, "q": "Place these in the order weight changes in the first year.", "items": ["Birth weight", "Loses about 10% in the first weeks", "Regains birth weight by 10-14 days", "Doubles at 4-6 months", "Triples at 1 year"], "y": "Loss first, regain by 10-14 days, doubles at 4-6 months, triples at 1 year."}, {"ty": "mat", "d": 2, "q": "Match each quiz-flagged item to its answer.", "pairs": [["Posterior fontanel closes", "By 2 months"], ["Anterior fontanel closes", "12-18 months"], ["Time-out for a 3-year-old", "3 minutes"], ["Booster seat until", "145 cm (4 ft 9 in)"]], "y": "Posterior by 2 months, anterior 12-18 months, time-out is 1 minute per year, booster until 145 cm or age 8-12."}, {"ty": "mc", "d": 2, "q": "A 6-month-old has a posterior fontanel that is still open. What does the nurse do?", "o": ["Report it for further investigation", "Document as expected", "Reassure the parent it closes at 12 months", "Apply gentle pressure to close it"], "a": [0], "y": "Right: it should have closed by 2 months, so an open one at 6 months needs follow-up. It is not expected. The 12-18 months timeline is the anterior fontanel. Pressure is never applied."}, {"ty": "mc", "d": 2, "q": "Which Erikson stage does a parent describe when a 5-year-old takes on adult chores, oversteps a rule and then feels bad?", "o": ["Initiative vs guilt", "Autonomy vs shame and doubt", "Industry vs inferiority", "Identity vs role confusion"], "a": [0], "y": "Right: preschool initiative with guilt after overstepping. Autonomy is toddler. Industry is school age. Identity is adolescence."}, {"ty": "mc", "d": 2, "q": "A mother asks which vitamin a breastfed newborn needs from the first week of life.", "o": ["Vitamin D", "Vitamin C", "Vitamin K at 4 months", "Folic acid"], "a": [0], "y": "Right: vitamin D is the only vitamin not passed well through breast milk. Iron is added at 4 months for exclusively breastfed infants. The others are not the listed supplement."}, {"ty": "sata", "d": 2, "q": "Which findings are suicide risk factors in an adolescent? Select all that apply.", "o": ["Giving away valued possessions", "Social isolation", "Parent with a substance abuse history", "Family history of a suicide attempt", "Active in school clubs", "Stable family routine"], "a": [0, 1, 2, 3], "y": "Right: marked behavior change such as giving away possessions, isolation, parental substance abuse and a family history of attempts are listed. Wrong: club involvement and a stable home are protective."}, {"ty": "num", "d": 2, "q": "A 7-month-old was born at 28 weeks. What is the adjusted age in months? (40 weeks is term, 4 weeks = 1 month)", "ans": 4, "tol": 0, "unit": "months", "y": "40 - 28 = 12 weeks early = 3 months. 7 - 3 = 4 months."}, {"ty": "ngn", "d": 2, "scen": "A nurse sees a 4-year-old with a parent who says, 'He woke up screaming, did not know me and remembers nothing.' The parent also says the child jumped off the porch because he thought he could fly. The parent asks about a booster seat.", "parts": [{"ty": "mc", "d": 2, "q": "What is the likely problem with the night episode?", "o": ["Night terror", "Nightmare", "Seizure", "Separation anxiety"], "a": [0], "y": "Right: screaming, confusion and no memory describe a night terror. In a nightmare the child remembers the dream. A seizure is not described. Separation anxiety does not fit."}, {"ty": "mc", "d": 2, "q": "What explains jumping off the porch?", "o": ["Magical thinking", "Animism", "Centration", "Negativism"], "a": [0], "y": "Right: magical thinking makes a child believe the impossible can happen. Animism gives life to objects. Centration focuses on one feature. Negativism is a toddler refusal."}, {"ty": "mc", "d": 2, "q": "What is the best teaching about the booster seat?", "o": ["Use it until 145 cm (4 ft 9 in) or age 8-12", "Stop at age 4", "Use only on long trips", "Move to the front seat at age 5"], "a": [0], "y": "Right: restraint continues until 145 cm or age 8-12. Age 4 is too early. Use on every trip. Children ride in the back seat."}], "y": ""}, {"ty": "mc", "d": 2, "q": "Which statement about HPV shows correct understanding?", "o": ["A series started at age 12 needs 2 doses 6-12 months apart", "Everyone needs 3 doses", "A series started at 12 needs 1 dose", "A series started at 16 needs 2 doses"], "a": [0], "y": "Right: starting before 15 needs 2 doses. Three doses are for starting at 15 or older, so not everyone needs 3 and a start at 16 needs 3. One dose is not the schedule."}, {"ty": "mc", "d": 2, "q": "A newborn has a heart rate of 70 beats per minute. How does the nurse respond?", "o": ["Report it, since it is far below the newborn range", "Document it as expected", "Recheck in 1 week", "Encourage feeding and recheck at the next visit"], "a": [0], "y": "Right: 120-160 is the newborn norm, so 70 is dramatically low. It is not expected. Waiting a week or only feeding delays care."}, {"ty": "mc", "d": 2, "q": "A newborn heart rate is 150. What is the interpretation?", "o": ["Within the expected range", "Bradycardia", "Tachycardia needing a workup", "Expected only after 1 year"], "a": [0], "y": "Right: 120-160 is normal. It is not slow or fast, and at 1 year the rate falls to 90-100."}, {"ty": "mc", "d": 2, "q": "Which describes expected vital signs as an infant ages?", "o": ["Pulse falls, blood pressure rises, respirations fall", "Pulse rises, blood pressure rises, respirations fall", "Pulse falls, blood pressure falls, respirations rise", "Pulse and respirations rise, blood pressure falls"], "a": [0], "y": "Right: only the first set matches the trend. The others reverse at least one value."}, {"ty": "mc", "d": 2, "q": "For how long is an infant's apical pulse counted?", "o": ["1 full minute", "15 seconds x 4", "30 seconds x 2", "10 seconds x 6"], "a": [0], "y": "Right: infants always get a full minute. 30 seconds x 2 is for older children with a regular rhythm."}, {"ty": "mc", "d": 2, "q": "A toddler has a regular heart rhythm. How long is the pulse counted?", "o": ["30 seconds and multiplied by 2", "1 full minute for every child", "15 seconds, then double it twice", "5 seconds, then multiply by 12"], "a": [0], "y": "Right: 30 seconds x 2 when regular, a full minute if irregular. Infants get a full minute. Shorter counts are unreliable."}, {"ty": "mc", "d": 2, "q": "A school-age child has an irregular radial pulse. How long is it counted?", "o": ["1 full minute", "30 seconds", "15 seconds, then double it twice", "2 minutes"], "a": [0], "y": "Right: irregular pulses get a full minute. 30 seconds is for regular rhythms."}, {"ty": "mc", "d": 2, "q": "Why is the right upper arm preferred if an arm is used for an infant's blood pressure?", "o": ["The left arm can give a false reading with a heart defect", "The right arm has larger vessels than the left", "The left arm is reserved for IV access", "The right arm is always easier to reach"], "a": [0], "y": "Right: a heart defect can distort the left-sided reading. Vessel size, IV use and access are not the reason."}, {"ty": "mc", "d": 2, "q": "Which artery is used for an infant's blood pressure?", "o": ["Lateral tibialis", "Brachial artery in the upper arm", "Radial artery at the wrist", "Carotid artery in the neck"], "a": [0], "y": "Right: lateral tibialis in the lower leg. Brachial is for older children and adults. Radial is a pulse site. Carotid is not used."}, {"ty": "mc", "d": 2, "q": "At what age does birth weight double?", "o": ["4-6 months", "2-3 months", "8-9 months", "12 months"], "a": [0], "y": "Right: doubles at 4-6 months. 12 months is when weight triples."}, {"ty": "mc", "d": 2, "q": "At what age does birth weight triple?", "o": ["1 year", "6 months", "18 months", "2 years"], "a": [0], "y": "Right: triples by 1 year."}, {"ty": "mc", "d": 2, "q": "By what age is an infant's length increased by 50%?", "o": ["12 months", "6 months", "18 months", "3 months"], "a": [0], "y": "Right: length is up 50% by 12 months, growing 2.5 cm a month for the first 6 months."}, {"ty": "mc", "d": 2, "q": "Head and chest circumference become equal at about what age in the infant section?", "o": ["2 years", "6 months", "1 month", "4 years"], "a": [0], "y": "Right: about 2 years. The toddler section lists 1-2 years."}, {"ty": "mc", "d": 2, "q": "A 4-month-old's head circumference should be growing at about what rate?", "o": ["1 cm a month", "2 cm a month", "0.5 cm a month", "3 cm a month"], "a": [0], "y": "Right: 2 cm a month for 3 months, 1 cm a month for months 4-6, then 0.5 cm a month for the second 6 months."}, {"ty": "mc", "d": 2, "q": "A child's percentile drops from the 90th to the 30th between visits. What does the nurse do?", "o": ["Plan further assessment", "Document as normal genetics", "Reassure the parent", "Switch to a different chart"], "a": [0], "y": "Right: children usually stay near the same percentile, so a large drop needs assessment. Genetics can explain a stable percentile, not a drop. Specialized charts are for conditions such as Down syndrome."}, {"ty": "mc", "d": 2, "q": "The nurse uses ATI's wording that the posterior fontanel closes at '2 months'. How does that match the slide?", "o": ["It equals 8 weeks", "It equals 12 weeks", "It equals 18 months", "It equals 6 months"], "a": [0], "y": "Right: 2 months is 8 weeks. 18 months is the upper end for the anterior fontanel."}, {"ty": "mc", "d": 2, "q": "What shape is the posterior fontanel?", "o": ["Triangle", "Diamond", "Square", "Oval"], "a": [0], "y": "Right: the posterior is a triangle. The anterior is a diamond."}, {"ty": "mc", "d": 2, "q": "Which reflex is tested by stroking the cheek?", "o": ["Rooting", "Moro", "Plantar grasp", "Babinski"], "a": [0], "y": "Right: stroking the cheek makes the infant turn toward the touch. Moro is a startle. Plantar grasp is toe curling. Babinski is the sole stroke."}, {"ty": "mc", "d": 2, "q": "By what age does the rooting reflex disappear?", "o": ["3 months", "9 months", "12 months", "6 months"], "a": [0], "y": "Right: about 3 months. 9 months is the plantar grasp."}, {"ty": "mc", "d": 2, "q": "An infant's palmar grasp is still strong at 8 months. What does this suggest?", "o": ["A neurologic problem needing evaluation", "Normal development for this age", "Advanced fine motor skills for age", "Normal until about 12 months of age"], "a": [0], "y": "Right: it should disappear by 4-6 months. Persistence points to neurologic impairment. It is not normal or advanced."}, {"ty": "mc", "d": 2, "q": "Which reflex disappears at about 9 months?", "o": ["Plantar grasp", "Moro", "Rooting", "Palmar grasp"], "a": [0], "y": "Right: plantar grasp at 9 months. Moro goes at 4 months, rooting at 3 months, palmar grasp at 4-6 months."}, {"ty": "mc", "d": 2, "q": "A newborn startles with arms flung out when a loud noise occurs. By what age should this disappear?", "o": ["4 months", "1 month", "9 months", "12 months"], "a": [0], "y": "Right: Moro disappears by about 4 months."}, {"ty": "mc", "d": 2, "q": "Which reflex is elicited by stroking the sole from heel to toes, with the big toe going up and the other toes fanning?", "o": ["Babinski", "Plantar grasp", "Stepping", "Moro"], "a": [0], "y": "Right: Babinski. Plantar grasp curls the toes when the ball of the foot is touched. Stepping is walking motions when held upright. Moro is the startle."}, {"ty": "mc", "d": 2, "q": "Which reflex is a protective reflex that appears as primitive reflexes fade?", "o": ["Parachute", "Rooting", "Moro", "Stepping"], "a": [0], "y": "Right: parachute and neck righting replace primitive reflexes. The others are primitive."}, {"ty": "mc", "d": 2, "q": "A newborn has blue hands and feet that are otherwise pink. How does the nurse interpret this?", "o": ["Acrocyanosis, which is expected", "Cardiac failure needing a code", "Hypoxemia needing oxygen now", "Hypothermia from a cold room only"], "a": [0], "y": "Right: acrocyanosis is normal in a newborn and fades over the first months. Cardiac failure and hypoxemia would show central signs. It is not a sign of cold alone."}, {"ty": "mc", "d": 2, "q": "A mother asks when to start solids. What is correct?", "o": ["4-6 months, rice cereal first by spoon", "At 2 months with cereal in a bottle", "At 8 months with fruit first", "Only after the first birthday visit"], "a": [0], "y": "Right: 4-6 months, rice cereal first. Not earlier in a bottle, not fruit first, and not delayed to a year."}, {"ty": "mc", "d": 2, "q": "How long should a parent wait between new foods?", "o": ["About 5 days", "1 day between each new food", "1 hour between each new food", "3 weeks between each new food"], "a": [0], "y": "Right: about 5 days to watch for allergy. One day is too short to identify a reaction."}, {"ty": "mc", "d": 2, "q": "When is the cup introduced and weaning from the bottle begun?", "o": ["Cup at 6 months, begin weaning by 9 months", "Cup at 3 months, wean at 6 months", "Cup at 12 months, wean at 24 months", "Cup at 18 months, wean at 30 months"], "a": [0], "y": "Right: cup at 6 months and begin weaning by 9 months, avoiding sippy cups for general use."}, {"ty": "mc", "d": 2, "q": "A parent props a bottle for a 5-month-old. What is the nurse's priority teaching?", "o": ["It is an aspiration risk and causes dental caries", "It improves intake and saves time", "It is safe if a cloth is under the head", "It is fine if the infant stays awake"], "a": [0], "y": "Right: propping risks aspiration and nursing bottle caries. Safety does not depend on a cloth or being awake."}, {"ty": "mc", "d": 2, "q": "At what angle is a bottle-fed infant positioned for feeding?", "o": ["About 45 degrees", "Flat", "90 degrees upside down", "Side-lying only"], "a": [0], "y": "Right: about 45 degrees."}, {"ty": "mc", "d": 2, "q": "A breastfed infant is exclusively breastfed. Which supplement is added at 4 months?", "o": ["Iron", "Vitamin D", "Vitamin K", "Calcium"], "a": [0], "y": "Right: iron at 4 months. Vitamin D starts in the first week."}, {"ty": "mc", "d": 2, "q": "Why does an infant on iron-fortified formula not need iron supplements?", "o": ["The formula already supplies the iron", "Formula contains vitamin D only, not iron", "Formula replaces the need for solids", "Iron stores last for the full 12 months"], "a": [0], "y": "Right: iron-fortified formula is an accepted alternative. The other reasons are not true."}, {"ty": "mc", "d": 2, "q": "At 2 months, what should an infant be able to do on the belly?", "o": ["Lift the head", "Roll over from front to back", "Sit up without support", "Crawl across the floor"], "a": [0], "y": "Right: lifts the head in prone by 2 months. Rolling is 6 months, sitting is 9 months."}, {"ty": "mc", "d": 2, "q": "At what age does an infant roll completely over?", "o": ["6 months", "2 months", "9 months", "12 months"], "a": [0], "y": "Right: 6 months."}, {"ty": "mc", "d": 2, "q": "At what age does an infant sit unsupported (usually)?", "o": ["8-9 months", "2 months", "4 months", "12 months"], "a": [0], "y": "Right: gets to sitting alone and sits unsupported by about 8-9 months."}, {"ty": "mc", "d": 2, "q": "A 4-month-old with head lag when pulled to sit. What is the nurse's interpretation?", "o": ["Delayed, since head lag should be gone by 4 months", "Expected for age at 4 months", "Advanced for age at 4 months", "Normal until 8 months of age"], "a": [0], "y": "Right: no head lag by 4 months. It is not expected at this age."}, {"ty": "mc", "d": 2, "q": "Which is a 9-month-old skill?", "o": ["Crude pincer grasp", "Rolling over", "Cooing", "Holding the head up in prone"], "a": [0], "y": "Right: crude pincer at 9 months. Rolling is 6 months. Cooing is 4 months. Head lift in prone is 2 months."}, {"ty": "mc", "d": 2, "q": "A premature 3-month-old is not holding up the head. What does the nurse tell the mother?", "o": ["Give more time and reevaluate by adjusted age", "This is probably cerebral palsy", "Start therapy right now", "Place him on his stomach only for sleep"], "a": [0], "y": "Right: premature infants have delayed milestones, so use adjusted age. The others jump ahead."}, {"ty": "mc", "d": 2, "q": "A mother plans to use a baby walker to help her infant walk. What is the best response?", "o": ["Walkers can delay growth and development", "They are safe if limited to 1 hour a day", "They speed up walking and balance", "They are required at about 6 months"], "a": [0], "y": "Right: your slide note says walkers delay development."}, {"ty": "mc", "d": 2, "q": "Which toys fit 8-12 months?", "o": ["Cups, bowls and stacking toys", "High contrast mobiles only", "Rattles only", "Board books only"], "a": [0], "y": "Right: cups, bowls, blocks and stacking toys. High contrast is for newborn to 1 month."}, {"ty": "mc", "d": 2, "q": "A newborn is shown high contrast toys. Why?", "o": ["Color vision is not yet developed", "Newborns are blind for the first month", "They prefer bright light over dim light", "They are bored by pastel colors"], "a": [0], "y": "Right: newborns cannot see color well. They are not blind."}, {"ty": "mc", "d": 2, "q": "At what age is a baby considered premature?", "o": ["Born before 37 weeks", "Born before 40 weeks", "Born before 34 weeks", "Born before 30 weeks"], "a": [0], "y": "Right: before 37 weeks. 40 weeks is full term."}, {"ty": "mc", "d": 2, "q": "A 10-month-old was born 8 weeks early. What is the adjusted age?", "o": ["8 months", "10 months", "6 months", "12 months"], "a": [0], "y": "Right: 8 weeks is 2 months. 10 - 2 = 8 months."}, {"ty": "mc", "d": 2, "q": "What is the safe water heater setting in a home with an infant?", "o": ["120 F", "140 F", "150 F", "100 F"], "a": [0], "y": "Right: 120 F."}, {"ty": "mc", "d": 2, "q": "Which sleep position is used to reduce SIDS?", "o": ["On the back with a bare crib", "On the stomach", "On the side with a pillow", "On the back with bumper pads"], "a": [0], "y": "Right: back, with no pillows, bumpers or stuffed animals."}, {"ty": "mc", "d": 2, "q": "A toddler stacks 6-7 blocks. What is the age?", "o": ["2 years", "18 months", "1 h", "Toddler"], ["Diaphragmatic breathing", "Preschool"], ["Industry example", "School age"], ["Suicide risk factors", "Adolescent"]], "y": "Each flag matches its age."}, {"ty": "mat", "d": 2, "q": "Match each vaccine age to the item.", "pairs": [["12 months", "Hep A"], ["15 months", "MMR and varicella"], ["11-12 years", "HPV"], ["18 years", "Catch-up MMR and Tdap"]], "y": "Each matches its schedule."}, {"ty": "num", "d": 2, "q": "A baby weighed 3,000 g at birth. What is the expected weight at 1 year? (triples)", "ans": 9000, "tol": 10, "unit": "g", "y": "3,000 x 3 = 9,000 g."}, {"ty": "num", "d": 2, "q": "A baby born at 32 weeks is 6 months old. What is the adjusted age in months? (40 weeks is term, 4 weeks = 1 month)", "ans": 4, "tol": 0, "unit": "months", "y": "8 weeks early = 2 months. 6 - 2 = 4 months."}, {"ty": "mc", "d": 2, "q": "Why is the right arm used for an infant blood pressure when a leg cannot be used?", "o": ["The left arm can read falsely low with coarctation of the aorta", "The right arm has the larger artery", "The left arm is closer to the heart", "The right arm is easier to cuff"], "a": [0], "y": "Right: the left subclavian comes off near a narrowing, so the left reading can be false. Artery size, closeness and ease of cuffing are not the reason."}, {"ty": "mc", "d": 2, "q": "Why does a 9-month-old infant need a full minute apical pulse?", "o": ["Rate and rhythm vary and the radial pulse is hard to feel", "The apical pulse is always slow", "A full minute is a hospital rule only", "The pulse stops between breaths"], "a": [0], "y": "Right: infant rates vary and the radial is small. The apical is not slow, the full minute is a physiologic need, and the pulse does not stop with breaths."}, {"ty": "mc", "d": 2, "q": "Why does the infant's stage focus on trust vs mistrust?", "o": ["The infant depends totally on caregivers to meet needs", "The infant is testing limits", "The infant is building skills at school", "The infant is choosing roles"], "a": [0], "y": "Right: consistent care teaches the world is safe. The others describe toddler, school age and adolescent stages."}, {"ty": "mc", "d": 2, "q": "Why does a toddler say 'no' and 'me do it'?", "o": ["Autonomy: practicing independence and control", "Sign of a behavior disorder", "Guilt over a mistake", "Poor language skills only"], "a": [0], "y": "Right: negativism and ritualism build independence. It is not a disorder, guilt belongs to preschool, and language is not the cause."}, {"ty": "mc", "d": 2, "q": "Why is a child in a night terror not woken?", "o": ["The child is partially aroused from deep sleep and will not remember", "The child is dreaming in REM", "Waking causes a seizure", "The child is pretending"], "a": [0], "y": "Right: it is deep-sleep arousal, so waking does not help. REM sleep produces nightmares. Waking does not cause seizures. It is not pretending."}, {"ty": "mc", "d": 2, "q": "Why does a toddler ride rear-facing as long as possible?", "o": ["The head is heavy and the neck is weak, and the seat spreads crash force", "The seat is cheaper", "Front-facing is illegal at 1 year", "The back seat is warmer"], "a": [0], "y": "Right: it supports head and neck. The other reasons are not true."}, {"ty": "mc", "d": 2, "q": "Why is an infant's posterior fontanel closed by 2 months but the anterior at 12-18 months?", "o": ["The posterior is small and closes first while the larger anterior needs longer for brain growth", "The anterior is bone and the posterior is cartilage", "They close in the same month", "The anterior closes first"], "a": [0], "y": "Right: size and brain growth explain it. The other options are not true."}, {"ty": "mc", "d": 2, "q": "Why does honey wait until after 12 months?", "o": ["Botulism spores can cause infant botulism", "Honey is too sweet", "Honey causes allergy to nuts", "Honey stains teeth"], "a": [0], "y": "Right: the infant gut cannot stop spores."}, {"ty": "mc", "d": 2, "q": "Why does a persistent palmar grasp at 8 months unt at the apex for 10 seconds and multiply by 6"], "a": [0], "y": "Right: the infant apical pulse is counted for 1 full minute, and the same applies to respirations. Why not 15, 30 or 10 second counts: they miss variation in an infant's rate."}, {"ty": "mc", "d": 3, "q": "Which is the first vaccine a baby receives?", "o": ["Hep B at birth", "DTaP at 2 months", "MMR at 12 months", "RV at 6 months"], "a": [0], "y": "Right: Hep B is the newborn vaccine. Why not DTaP: a 2-month vaccine. Why not MMR: 15-18 months on your schedule. Why not RV at 6 months: RV starts at 2 months."}, {"ty": "mc", "d": 3, "q": "A baby weighs 3.2 kg at birth. About what weight is expected at 5 months?", "o": ["About 6.4 kg, double the birth weight", "About 4.8 kg, 1.5 times birth weight", "About 9.6 kg, triple the birth weight", "About 12.8 kg, four times birth weight"], "a": [0], "y": "Right: birth weight doubles at 4-6 months. Why not 4.8 kg: that is only 1.5 times. Why not 9.6 kg: tripling occurs near 12 months. Why not 12.8 kg: four times is too large."}, {"ty": "ord", "d": 3, "q": "Place the Erikson stages in order from youngest to oldest.", "items": ["Trust vs mistrust", "Autonomy vs shame and doubt", "Initiative vs guilt", "Industry vs inferiority", "Identity vs role confusion"], "y": "Trust (infant), autonomy (toddler), initiative (preschool), industry (school age), identity (adolescent)."}, {"ty": "mc", "d": 3, "q": "A mother asks why the nurse tells her to place her baby to sleep on the back. Which is the best answer?", "o": ["It lowers the risk of SIDS", "It prevents spitting up", "It helps the head round out", "It makes the baby sleep longer"], "a": [0], "y": "Right: back to sleep lowers SIDS risk. Why not spitting up, head shape or longer sleep: none are the reason."}, {"ty": "mc", "d": 3, "q": "A 3-year-old pulls a toy truck to the nurse and says, 'He is hungry, give him a snack.' Which concept is this?", "o": ["Animism", "Centration", "Conservation", "Egocentrism of infancy"], "a": [0], "y": "Right: giving life to objects is animism, part of preoperational thought. Why not centration: focusing on one feature. Why not conservation: a concrete operational skill."}, {"ty": "mc", "d": 3, "q": "A toddler repeatedly says 'no' and insists on dressing himself slowly. What should the parent do?", "o": ["Offer limited choices and extra time", "Dress him quickly to avoid delays", "Punish the refusal", "Let him decide everything"], "a": [0], "y": "Right: choices support autonomy while keeping limits. Why not rushing: it takes away his control. Why not punishment: shame and doubt. Why not deciding everything: toddlers need limits."}, {"ty": "sata", "d": 3, "q": "Which findings in a 10-month-old are expected? Select all that apply.", "o": ["Stranger anxiety", "Sits without support", "Pincer grasp developing", "Responds to own name", "Walks alone with ease", "Says several clear sentences"], "a": [0, 1, 2, 3], "y": "Right: the first four fit 6-12 months. Why not walking with ease: usually near 12 months or later. Why not several sentences: that is later toddler language."}, {"ty": "mc", "d": 3, "q": "A 2-year-old drinks 32 oz of whole milk and refuses meals. Which problem is most likely?", "o": ["Iron deficiency from too much milk", "Vitamin C toxicity from dairy", "Low calcium from low milk intake", "Dehydration from fluid refusal"], "a": [0], "y": "Right: milk is low in iron and fills the child, so iron-rich foods are crowded out. Why not vitamin C toxicity: not related. Why not low calcium: intake is high. Why not dehydration: fluids are plentiful."}]}, "cram": [{"ty": "num", "d": 2, "q": "A 22 lb infant needs weight in kilograms for a dose. What is the weight in kg? (1 kg = 2.2 lb)", "ans": 10, "tol": 0.1, "unit": "kg", "y": "22 / 2.2 = 10 kg."}, {"ty": "num", "d": 2, "q": "Acetaminophen is ordered at 15 mg/kg. The child weighs 33 lb. How many mg is one dose? (1 kg = 2.2 lb)", "ans": 225, "tol": 1, "unit": "mg", "y": "33 / 2.2 = 15 kg. 15 kg x 15 mg/kg = 225 mg."}, {"ty": "num", "d": 2, "q": "A baby born at 32 weeks is now 9 months old. What is the adjusted age in months? (40 weeks is term, 4 weeks = 1 month)", "ans": 7, "tol": 0, "unit": "months", "y": "40 - 32 = 8 weeks early = 2 months. 9 - 2 = 7 months."}, {"ty": "num", "d": 2, "q": "A 7-month-old was born at 28 weeks. What is the adjusted age in months?", "ans": 4, "tol": 0, "unit": "months", "y": "12 weeks early = 3 months. 7 - 3 = 4 months."}, {"ty": "mc", "d": 2, "q": "What site is used for an infant blood pressure?", "o": ["Lateral tibialis (lower leg)", "Brachial artery in the upper arm", "Radial artery at the wrist", "Left upper arm in every case"], "a": [0], "y": "Right: lateral tibialis, or the right upper arm if no leg can be used. The others are not the infant site."}, {"ty": "mc", "d": 2, "q": "Which reflex disappears last?", "o": ["Babinski (12-24 months)", "Moro (4 months)", "Rooting (4 months)", "Palmar grasp (3-4 months)"], "a": [0], "y": "Right: Babinski goes at 12-24 months. The others disappear earlier."}, {"ty": "mc", "d": 2, "q": "Which child is demonstrating parallel play?", "o": ["A 2-year-old playing beside another child", "A 5-year-old sharing roles in a game", "A 6-month-old alone with a rattle", "A 12-year-old working with a team"], "a": [0], "y": "Right: parallel play is toddler play beside others. Cooperative play is preschool and older."}, {"ty": "sata", "d": 2, "q": "Which findings are normal for a 1-year-old? Select all that apply.", "o": ["Anterior fontanel is still open", "Waves bye-bye", "Is working on stranger anxiety", "Sits alone", "Draws a person with 5 parts", "Hops on one foot"], "a": [0, 1, 2, 3], "y": "Right: the first four are infant-to-1-year findings. Wrong: drawing a person and hopping are preschool."}, {"ty": "sata", "d": 2, "q": "Which are Erikson stages? Select all that apply.", "o": ["Trust vs Mistrust", "Industry vs Inferiority", "Identity vs Role Confusion", "Concrete operational", "Latency", "Conventional"], "a": [0, 1, 2], "y": "Right: the first three are Erikson. Wrong: concrete operational is Piaget, latency is Freud, conventional is Kohlberg."}, {"ty": "ord", "d": 2, "q": "Place these skills from youngest to oldest age.", "items": ["Rolls completely over", "Sits alone", "Walks alone", "Walks up and down stairs, both feet per step", "Draws a person with 5 parts"], "y": "Rolls completely over (6 months), sits alone (9 months), walks alone (15 months), stairs with both feet on each step (2 years), draws a person (preschool)."}, {"ty": "mat", "d": 2, "q": "Match each finding to the age.", "pairs": [["Anterior fontanel closes", "12-18 months"], ["Posterior fontanel closes", "8 weeks"], ["Birth weight doubles", "4-6 months"], ["Birth weight triples", "12 months"]], "y": "Anterior 12-18 months, posterior by 8 weeks, weight doubles at 4-6 months and triples at 1 year."}, {"ty": "mc", "d": 2, "q": "A 3-month-old has a firm bulging anterior fontanel while crying. What is the priority?", "o": ["Reassess when the infant is calm", "Notify the provider immediately", "Apply pressure to the fontanel", "Place the infant flat and crying"], "a": [0], "y": "Right: a fontanel can bulge briefly with crying; reassess when calm. The others overreact or are unsafe."}, {"ty": "mc", "d": 2, "q": "Which vaccine is the oral one on the schedule?", "o": ["Rotavirus", "IPV", "MMR", "Hib"], "a": [0], "y": "Right: rotavirus. The others are injections."}, {"ty": "mc", "d": 2, "q": "A teen says 'My friends say I am too fat.' Which Erikson task is involved?", "o": ["Identity vs role confusion", "Industry vs inferiority", "Initiative vs guilt", "Trust vs mistrust"], "a": [0], "y": "Right: adolescents form identity influenced by peers. The others are for younger ages."}, {"ty": "sata", "d": 2, "q": "Which choking hazards should a toddler avoid? Select all that apply.", "o": ["Whole grapes", "Hot dogs", "Coins", "Popcorn", "Mashed potatoes", "Soft cooked carrots"], "a": [0, 1, 2, 3], "y": "Right: round, hard or small items. Wrong: soft mashed foods are safe."}, {"ty": "ngn", "d": 2, "scen": "A nurse reviews a 4-year-old at a well visit. The child says the stuffed dog is sad, believes the moon follows the car and builds a pretend restaurant. The parent reports a stutter when excited and says the child woke screaming last night, eyes open, and did not recognize the parent.", "parts": [{"ty": "sata", "d": 2, "q": "Which findings are expected for age? Select all that apply.", "o": ["Animism", "Magical thinking", "Pretend play", "Stuttering when excited", "Concrete operational thinking", "Cooperative team sports"], "a": [0, 1, 2, 3], "y": "Right: preschoolers show animism, magical thinking, pretend play and normal stuttering. Wrong: concrete operational is school age and team sports come later."}, {"ty": "mc", "d": 2, "q": "What does the nurse tell the parent about the night episode?", "o": ["A night terror; keep him safe, do not wake him", "It was a nightmare; wake the child and talk", "It is a seizure; call 911 right away", "It means a behavior disorder needing referral"], "a": [0], "y": "Right: eyes open, screaming and no recognition describe a night terror. A nightmare would wake the child with recall. It is not described as a seizure or disorder."}], "y": ""}, {"ty": "num", "d": 2, "q": "Acetaminophen 15 mg/kg is ordered for a child weighing 44 lb. How many mg per dose? (1 kg = 2.2 lb)", "ans": 300, "tol": 1, "unit": "mg", "y": "44 / 2.2 = 20 kg. 20 kg x 15 mg/kg = 300 mg."}, {"ty": "num", "d": 2, "q": "A toddler weighs 26.4 lb. What is the weight in kg? (1 kg = 2.2 lb)", "ans": 12, "tol": 0.1, "unit": "kg", "y": "26.4 / 2.2 = 12 kg."}, {"ty": "num", "d": 2, "q": "Ibuprofen 10 mg/kg is ordered for a child weighing 55 lb. How many mg per dose? (1 kg = 2.2 lb)", "ans": 250, "tol": 1, "unit": "mg", "y": "55 / 2.2 = 25 kg. 25 kg x 10 mg/kg = 250 mg."}, {"ty": "num", "d": 2, "q": "A newborn weighed 3,600 g at birth. What weight is expected at 1 year? (triples)", "ans": 10800, "tol": 10, "unit": "g", "y": "3,600 g x 3 = 10,800 g."}, {"ty": "num", "d": 2, "q": "A newborn weighed 3,200 g. What weight is expected when birth weight doubles?", "ans": 6400, "tol": 10, "unit": "g", "y": "3,200 g x 2 = 6,400 g."}, {"ty": "num", "d": 2, "q": "A premature baby was born at 34 weeks and is now 6 months old. What is the adjusted age in months? (40 weeks is term, 4 weeks = 1 month)", "ans": 4.5, "tol": 0, "unit": "months", "y": "6 weeks early = 1.5 months. 6 - 1.5 = 4.5 months."}, {"ty": "num", "d": 2, "q": "A baby was born at 36 weeks and is 12 months old. What is the adjusted age in months?", "ans": 11, "tol": 0, "unit": "months", "y": "4 weeks early = 1 month. 12 - 1 = 11 months."}, {"ty": "num", "d": 2, "q": "An infant needs 25 oz of breast milk a day. How many mL is that? (1 oz = 30 mL)", "ans": 750, "tol": 1, "unit": "mL", "y": "25 x 30 = 750 mL."}, {"ty": "num", "d": 2, "q": "A 3-year-old is placed in time-out. How many minutes?", "ans": 3, "tol": 0, "unit": "minutes", "y": "1 minute per year of age."}, {"ty": "num", "d": 2, "q": "A baby's head circumference was 34 cm at birth. Using 2 cm a month for 3 months, what is it at 3 months?", "ans": 40, "tol": 0, "unit": "cm", "y": "34 + (2 x 3) = 40 cm."}, {"ty": "mc", "d": 2, "q": "A mother of a 9-month-old asks about juice. What is correct?", "o": ["Avoid juice at this age and offer water in a cup", "Offer 12 oz of juice daily in a cup", "Offer juice in a sippy cup between meals", "Offer juice at bedtime to help sleep"], "a": [0], "y": "Right: juice is not needed in infancy, and a cup is introduced at 6 months. Juice limits apply to toddlers (4-6 oz). Sippy cups are avoided for general use. Bedtime juice promotes caries."}, {"ty": "mc", "d": 2, "q": "A toddler drinks 36 oz of milk and eats little. What is the best teaching?", "o": ["Limit low-fat milk to 16-24 oz a day", "Increase milk to 48 oz for more calories", "Replace meals with milk until appetite returns", "Give milk before meals t
