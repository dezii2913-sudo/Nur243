<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}

select{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:5px;max-width:48%}

nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}

.sub{color:var(--mut);margin:0 0 12px;font-size:14px}

.st{color:var(--ac2)}
mark.blue{background:#0e7490;color:#e6fbff}

b.red{color:var(--red)}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}

th{background:var(--card2)}
td.plus{background:rgba(45,212,191,.08)}
ul{padding-left:20px;margin:6px 0}

.note.fill::before{content:"Confirm with lecture:";color:var(--red)}
.ex{background:var(--card2);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.cold,.trap{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:12px 0}
.cold h3{color:var(--ac2);margin:0 0 4px}.trap h3{color:var(--red);margin:0 0 4px}
.q{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:10px 0}
.q .qt{font-weight:700;margin-bottom:6px}
.q label{display:block;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin:4px 0;cursor:pointer;overflow-wrap:anywhere}
.q label.ok{border-color:var(--ok);background:rgba(52,211,153,.15)}
.q label.no{border-color:var(--bad);background:rgba(248,113,113,.15)}
.q label.miss{border-color:var(--ok);border-style:dashed}
.why{margin-top:6px;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--card2)}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:20px;padding:0 6px;color:var(--mut);margin-left:6px}
.tag.h{color:var(--red);border-color:var(--red)}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}

.game{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.game button.sel{outline:2px solid var(--ac2)}
.game button.gone{visibility:hidden}
textarea{width:100%;min-height:200px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px}
input[type=number],input[type=text].num{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px;width:120px}
#reader{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--ac);border-radius:30px;padding:5px 10px;display:none;gap:6px;z-index:30;max-width:96vw}
#reader.on{display:flex}
.hit{padding:8px;border:1px solid var(--ln);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--card)}
.legend span{margin-right:10px;white-space:nowrap}
@media(max-width:480px){h2{font-size:19px}th,td{padding:4px 5px;font-size:13px}}

<script>
const D={"tabs": [{"id": "star", "icon": "⭐", "title": "Quiz flags and stars", "sub": "Everything she flagged as a quiz question on the slides plus what she told you to star in lecture. Start here before the quiz.", "sections": [{"h": "Erikson stage and milestones by age group", "star": true, "blocks": [{"t": "tbl", "head": ["Age and Erikson stage", "Key milestones"], "rows": [["**Infant** (0-12 months): ★ !!Trust vs Mistrust!!", "2 months lifts head in prone. 4 months no head lag, hands to mouth, coos. 6 months rolls over, holds bottle, raspberries. 9 months sits alone, crude pincer, looks for dropped objects, mama and dada, bye-bye"], ["**Toddler** (1-3 years): ★ !!Autonomy vs Shame and Doubt!!", "Walks alone at 15 months, stacks 3-4 blocks at 18 months, 6-7 blocks and stairs with both feet at 2 years, about 50 words at 2 years, 2-3 word sentences by 3 years, parallel play"], ["**Preschool** (3-6 years): ★ !!Initiative vs Guilt!!", "Draws a person with 5 or more parts, hops, skips, dresses alone, uses verbs and plurals, simple rule games, magical thinking and animism"], ["**School age** (6-12 years): ★ !!Industry vs Inferiority!!", "Concrete operational thinking, peer groups and best friends, pre-puberty about 9 in girls, rules and cooperation, school activities"], ["**Adolescent** (12-20 years): ★ !!Identity vs Role Confusion!!", "Tanner changes, menarche average 12.5 years, formal operational thinking, peer influence, sexual, political and career identity, invincibility"]]}, {"t": "note", "k": "star", "x": "Erikson is an easy quiz question she gives. Know all five stages cold."}]}, {"h": "Why: vitals and growth", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Infant BP on the **right arm**, never the left", "The left arm can read falsely low if there is a heart defect (coarctation of the aorta). The right arm is reliable."], ["★ Lateral tibialis (lower leg) for infant BP", "The leg is easy to reach in a squirmy infant."], ["★ Infant apical pulse, full minute", "The infant heart rate varies and the radial pulse is too small to feel well."], ["★ Pulse and respirations fall, BP rises with age", "The heart and lungs grow stronger, so fewer beats and breaths are needed."], ["★ Newborn pulse 120-160", "Each beat is small, so the heart has to beat fast."], ["★ Weight doubles at 4-6 months, triples at 1 year", "The first year is the fastest growth, then it slows and appetite drops."], ["Children stay near one percentile", "A big drop means growth fell off its curve, so look for a problem."], ["★ Fontanels", "They let the skull mold and the brain grow. Posterior closes by 2 months, anterior at 12-18 months. An open posterior at 6 months needs follow-up."]]}]}, {"h": "Why: reflexes, newborn skin and feeding", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Primitive reflexes fade", "The brain matures and voluntary control takes over. One that stays means a neurologic problem."], ["★ Rooting and sucking", "They help the baby find food and feed."], ["★ Palmar grasp", "It is the first step to a purposeful grasp, so it fades at 4-6 months."], ["★ Asymmetric tonic neck", "It builds eye-hand coordination and fades by 4-6 months."], ["Moro (startle)", "A protective startle that fades by about 4 months. One-sided Moro suggests injury."], ["Babinski", "The toes fan because the nerve pathways are not mature yet. By 12-24 months the toes curl down."], ["Parachute and neck righting", "They protect the child from falls and keep the head in line, which is needed for sitting and walking."], ["★ Acrocyanosis is normal", "A newborn's circulation to the hands and feet is immature. Blue lips or tongue is not normal."]]}]}, {"h": "Why: infant feeding and safety", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Rice cereal first at 4-6 months", "It is iron-fortified, easy to digest and rarely causes allergy."], ["★ One new food every 5 days", "An allergy can take days to show, so you know which food caused it."], ["★ Vitamin D from the first week", "Breast milk has little vitamin D and bones need it."], ["★ Iron at 4 months if exclusively breastfed", "Stores from birth run out and breast milk is low in iron."], ["Breastfeed every 3-4 hours, no night bottles", "A bottle replaces a feeding, so the breast makes less milk."], ["Honey only after 12 months", "It can cause infant botulism."], ["Never prop a bottle", "The baby can aspirate and get tooth decay."], ["Back to sleep, bare crib", "Back sleeping lowers SIDS. Soft items can smother the baby."], ["Water heater at 120 F", "Infant skin is thin and burns fast."], ["★ Walkers delay development", "The baby does not learn balance and weight bearing, and can fall down stairs."], ["★ Premature babies use adjusted age", "Development follows time since conception, so birth age would wrongly look delayed."]]}]}, {"h": "Why: Erikson stage for each age group", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ !!Trust vs Mistrust!! (infant)", "The infant depends on caregivers. Consistent care teaches the world is safe."], ["★ !!Autonomy vs Shame and Doubt!! (toddler)", "The toddler can walk and talk, so wants to do things alone. Negativism and ritualism give a sense of control."], ["★ !!Initiative vs Guilt!! (preschool)", "The child can plan and imagine, so takes on adult tasks and feels guilty when overstepping limits."], ["★ !!Industry vs Inferiority!! (school age)", "The child learns skills at school. Success builds confidence, and not mastering every skill is normal."], ["★ !!Identity vs Role Confusion!! (adolescent)", "Body changes and abstract thinking make the teen ask 'Who am I?'."]]}]}, {"h": "Why: toddler", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Parallel play", "Toddlers are egocentric with little language, so they play beside, not with, others."], ["★ Telegraphic speech", "Vocabulary grows faster than grammar, so only key words are used."], ["★ Time-out 1 minute per year", "A toddler's attention span is short."], ["★ Rear-facing as long as possible", "The head is heavy and the neck is weak, and the seat supports them in a crash."], ["★ Back seat only", "The front air bag can injure a child."], ["★ Let the child choose from food options", "Choice meets the need for autonomy and avoids power struggles."], ["Limit juice and milk", "They fill the stomach. Too much milk crowds out iron foods and can cause anemia."], ["★ Sleep 10-12 hours", "Growth and rest. Bedtime resistance is part of autonomy."], ["Toilet training readiness", "The nerves must be mature, shown by staying dry 3-4 hours."], ["Choking foods", "Small airways and poor chewing. Round, firm foods block the airway."], ["Start safety teaching before the toddler stage", "Toddlers move and explore but cannot judge danger."]]}]}, {"h": "Why: preschool", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Night terror vs nightmare", "A night terror comes from deep sleep, so the child is confused and remembers nothing. A nightmare wakes the child, who can tell you the dream."], ["★ Diaphragmatic breathing", "Preschoolers breathe with the belly. It is normal unless retractions, flaring or grunting appear."], ["★ Magical thinking", "The child cannot separate wishes from reality, so needs supervision."], ["Stuttering normal until 5-6", "Thoughts come faster than the speech muscles can keep up."], ["★ White beans and other calcium foods", "Calcium builds bone."], ["Offer no more than 2 choices", "It gives control without overwhelming the child."], ["Booster until 145 cm or 8-12 years", "Adult belts sit on the neck and belly of a short child."], ["Screen time 1-2 hours", "More time replaces play and sleep."]]}]}, {"h": "Why: school age", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Squinting means vision impairment", "School reading shows poor vision. Refer for an exam."], ["★ Calcium 800-1,000 mg (4-8), 1,300 mg (9-12)", "Bones are being built, and needs rise as growth speeds up."], ["★ Peers matter more than parents", "The child is separating from the family and wants to belong."], ["★ Continuous peer relationships have the most impact", "Daily contact shapes behavior and attitudes."], ["Limit screens to 2 hours", "More time lowers activity and raises obesity risk."], ["Latchkey and 3-6 pm accidents", "Children are unsupervised after school."], ["School refusal", "Stomachaches only on school days often mean anxiety or bullying."], ["★ HPV: 2 doses before age 15, 3 doses at 15 or older", "Younger children respond more strongly, so fewer doses work."]]}]}, {"h": "Why: adolescent", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Girls stop growing 2-2.5 years after menarche", "Estrogen closes the growth plates. Boys grow until 18-20."], ["★ Iron-rich foods", "Teens grow fast and girls lose blood with periods."], ["Invincibility and risk taking", "Judgment is still maturing and peers have a strong pull."], ["Accidents peak late evening", "More driving and less supervision."], ["★ Giving away valued possessions", "It can mean the teen is planning suicide. Ask directly and report."], ["Suicide risk factors", "They add up to hopelessness and impulsive acts."], ["Eating disorders", "Body image forms now and peers add pressure."], ["Nursing concerns: self-image, privacy, peers", "Teens want independence and acceptance."]]}]}, {"h": "Why: immunizations", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["Live vaccines (MMR, varicella) at 12-15 months", "Mother's antibodies block a live vaccine before about 12 months."], ["Hep B at birth", "It protects against infection passed from mother to baby."], ["Rotavirus is oral", "The virus infects the gut."], ["First-time flu vaccine needs 2 doses", "The first primes the immune system and the second boosts it."], ["Hep A: 2 doses 6 months apart", "The second dose gives lasting protection."], ["Tdap at 11-12 years", "Protection from the childhood series fades."], ["RSV prevention optional, birth to about 8 months", "Young infants are at highest risk."]]}]}, {"h": "Slide quiz flags", "star": true, "blocks": [{"t": "tbl", "head": ["Topic", "Quiz flag"], "rows": [["**Infant: Body & Care**: Fontanels", "★ Quiz question: fontanels. Anterior (diamond, front) closes at 12-18 months. Posterior (triangle, back) closes by 2 months."], ["**Infant: Body & Care**: Nutrition", "★ Your notes: breastfeed every 3-4 hours and no night bottles (disrupts milk production). Infant must sit supported upright in a highchair (text p. 79). Whole milk, peanut, egg and honey only after 12 months. Sippy cup p. 80. Spitting up risk p. 87. Instructor flagged this as a quiz question."], ["**Infant: Body & Care**: Safety: accidents happen when routine changes", "★ Quiz question on this infant safety slide (text p. 78). The slide's headline is that accidents happen when the routine changes. Know every safety item listed above."], ["**Infant: Milestones & Theory**: 6 months", "★ Instructor flagged the palmar grasp at 6 months as a quiz question."], ["**Infant: Milestones & Theory**: Theorists: birth to 1 year", "★ Quiz question: object permanence at 6 months."], ["**Toddler (1-3)**: Play and behavior", "★ Quiz question. Telegraphic speech, text p. 112, Box 4.5."], ["**Toddler (1-3)**: Safety", "★ Start safety teaching before the toddler stage! Quiz question."], ["**Preschool (3-6)**: Vital signs and growth", "★ Quiz question, text p. 145. Preschoolers often breathe with the diaphragm (belly rises and falls)."], ["**Preschool (3-6)**: Nutrition", "★ Quiz question. White beans are high in calcium."], ["**Preschool (3-6)**: Education and anticipatory guidance", "★ Quiz questions. With nightmares the child can tell you what happened. Nightmare vs night terror, text p. 136."], ["**School Age (6-12)**: Nutrition", "★ Absolutely know the daily calcium intake."], ["**School Age (6-12)**: Development", "★ Quiz question. Promoting learning and school attendance. Peer groups, behaviors and attitudes will have an impact. Healthy People 2030 table, text p. 181."], ["**School Age (6-12)**: Theorists: school age", "★ Quiz question, text p. 146. Example of Industry: signs up for school activities."], ["**School Age (6-12)**: Developmental concerns", "★ Quiz questions. Continuous peer relationships have the most impact on social interaction in school-age children (text p. 150). Limit video games to 2 hours a day (text p. 161)."], ["**Adolescent (12-20)**: Development", "★ Quiz question, text p. 149. Peer relationships impact social interaction."], ["**Adolescent (12-20)**: Suicide risk factors", "★ Quiz question, text p. 132. A child of a parent with a history of substance abuse can lack social and emotional readiness."], ["**Safety by Age**: Safety side by side", "★ Instructor tags: infant safety quiz (text p. 78), toddler safety 'start before the toddler stage'."]]}]}, {"h": "Vitals & Growth: all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Vital signs by age:** **Infant** (birth to 1 yr) | 99.6 F | ==Newborn 120-140, down to 90-100 at 1 yr== | Newborn 30-60, 20-30 at 12 mo | 60-78 / 40-52", "★ **Vital signs by age (slide note):** Toddler vital signs slide is starred. Slide page reference for infant vitals: text p. 57.", "★ **How to take them, by age:** **Infants** | ==Apical pulse (listen at the heart with a stethoscope), counted for 1 full minute== | ==Respirations counted for 1 full minute== | ~~Lateral tibialis artery (lower leg)~~", "★ **How to take them, by age:** **Toddlers** | Radial pulse (wrist) counted for 30 seconds, then x 2. If irregular, listen apically for 1 full minute | Respiration count time is not given on your slide | ~~Brachial or lateral tibialis artery unless contraindicated~~", "★ **How to take them, by age (slide note):** If you cannot use the leg on an infant, the RIGHT upper arm is preferred. The left arm gives false readings.", "★ **Growth by age:** **Infant** | Birth 48-53 cm (19-21 in). Grows 2.5 cm (1 in)/month for 6 months. ==Length up 50% by 12 months== | Birth 2700-4000 g (6-9 lb). Loses 10% in week 1, regains by 10-14 days. ==Doubles by 4-6 months, triples by 1 year== | HC 33-35 cm. Up 2 cm/mo first 3 mo, 1 cm/mo months 4-6, 0.5 cm/mo second 6 mo. ==Head and chest equal by about 2 years==", "★ **Growth by age:** **School age** | 5 cm (2 in)/year | 2-3 kg (4.4-6.6 lb)/year | ==Pre-puberty begins about age 9, especially girls. Menarche 10-16, average 12.5==", "★ **Growth charts and measuring:** ==A significant shift from the child's usual percentiles means further assessment is needed.==", "★ **Growth charts and measuring (slide note):** Practice plotting from your slide notes: Baby girl 3 mo, HC 40 cm, wt 16 lb, ht 26 in. Baby boy 4.5 mo, HC 44 cm, wt 9.5 kg, ht 72 cm. Use the CDC charts linked in the slide notes.", "★ **From the lecture (Nov 10):** Know the newborn pulse: ==120-160 is the norm==. Your slide shows 120-140, which sits inside that range. A newborn pulse near 70 or near 200 is a concern. Do not fixate on small differences between ATI and the text.", "★ **From the lecture (Nov 10):** Trend with age: pulse goes down, blood pressure goes up, respirations go down. A newborn has a high heart rate, low blood pressure and high respirations.", "★ **From the lecture (Nov 10):** Infant: apical pulse for a ==full minute==. Toddler: 30 seconds x 2 if regular, full minute if irregular. School age through adult: radial pulse 30 seconds x 2 if regular, full minute if irregular. Respirations follow the same rule.", "★ **From the lecture (Nov 10):** Infant BP site: ==lateral tibialis (lower leg)==. If you must use an arm, use the ==right upper arm==: with a heart defect the left side can give a false reading. Older child and adult: brachial artery. Cuff size must fit the child's extremity.", "★ **From the lecture (Nov 10):** Weight ==doubles at 4-6 months, triples at 1 year==. Length grows 2.5 cm a month for 6 months, up 50% by 12 months. Head circumference grows 2 cm a month for 3 months, 1 cm a month for months 4-6, 0.5 cm a month for the second 6 months. Head and chest are equal by about 2 years."]}]}, {"h": "Infant: Body & Care: all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Fontanels:** **Anterior** (front) | Diamond | ==12 to 18 months==", "★ **Fontanels:** **Posterior** (back) | Triangle | ==By 8 weeks (2 months)==", "★ **Fontanels (slide note):** Quiz question: fontanels. Anterior (diamond, front) closes at 12-18 months. Posterior (triangle, back) closes by 2 months.", "★ **Neurologic system: primitive reflexes:** ==Focus points from your notes: asymmetric tonic neck, palmar grasp, rooting.==", "★ **Neurologic system: primitive reflexes (slide note):** + Reflex stays past its age, never shows, or shows on one side only = neurologic concern. Report to the provider.", "★ **Nutrition:** ==Solids at 4-6 months by spoon. Start with iron-fortified rice cereal (least allergenic).==", "★ **Nutrition:** ==Teeth: first erupt at 6-8 months, 3-6 teeth by 12 months. Sign: ear rubbing.==", "★ **Nutrition (slide note):** Your notes: breastfeed every 3-4 hours and no night bottles (disrupts milk production). Infant must sit supported upright in a highchair (text p. 79). Whole milk, peanut, egg and honey only after 12 months. Sippy cup p. 80. Spitting up risk p. 87. Instructor flagged this as a quiz question.", "★ **Skin, fluids, language, play:** ==Acrocyanosis (blue hands and feet) is normal in the newborn and fades over the first few months.==", "★ **Skin, fluids, language, play (slide note):** Walkers delay growth and development.", "★ **Safety: accidents happen when routine changes:** ==SIDS prevention: baby on the back (supine), no pillow, no bumper pads, no stuffed toys in the crib. Pacifier helps. No smoking.==", "★ **Safety: accidents happen when routine changes (slide note):** Quiz question on this infant safety slide (text p. 78). The slide's headline is that accidents happen when the routine changes. Know every safety item listed above.", "★ **From the lecture (Nov 10):** Fontanel slide is starred and flagged as a quiz question. ATI may say months instead of weeks: posterior fontanel closes by ==2 months (8 weeks)==, anterior diamond closes at ==12-18 months==. A posterior fontanel still open at 6 months needs investigation.", "★ **From the lecture (Nov 10):** Instructor starred ==asymmetric tonic neck, palmar grasp and rooting==. ATI can ask any reflex. A primitive reflex that stays past its age points to a neurologic impairment and needs a workup.", "★ **From the lecture (Nov 10):** ==Acrocyanosis== (blue hands and feet) is normal in a newborn and fades over the first few months.", "★ **From the lecture (Nov 10):** Solids at 4-6 months by spoon, ==rice cereal first==, one new food at a time over about 5 days to watch for allergy. No fruit first (they hold out for sweet).", "★ **From the lecture (Nov 10):** Breastfed: about 25 oz (750 mL) a day. Vitamin D from the first week. Iron at 4 months if exclusively breastfed. Iron-fortified formula replaces the iron supplement. No propped bottle (aspiration and dental caries), feeding position about 45 degrees."]}]}, {"h": "Infant: Milestones & Theory: all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **2 months (slide note):** Premature infants have delayed milestones. Give more time and reevaluate.", "★ **4 months:** Gross motor | ==No head lag== (head stays up)", "★ **6 months:** Gross motor | ==Rolls completely over==", "★ **6 months (slide note):** Instructor flagged the palmar grasp at 6 months as a quiz question.", "★ **Theorists: birth to 1 year:** **Piaget** | Sensorimotor (birth to 2 years) | Action is reflexive, moving to simple repetitive. Learns they are separate from other objects. ==Object permanence at about 4-7 months== (knows a hidden object still exists). Mental representation: uses symbols", "★ **Theorists: birth to 1 year:** **Erikson** | !!Trust vs Mistrust (birth to 1 year)!! | Others will meet their basic needs, or they will not", "★ **Theorists: birth to 1 year (slide note):** Quiz question: object permanence at 6 months.", "★ **From the lecture (Nov 10):** Instructor said milestones are a favorite test topic. 2 months: lifts head in prone, strong grasp reflex at 1 month. 4 months: no head lag, hands to mouth, grasps with both hands, coos. 6 months: ==rolls completely over==, holds bottle, palmar grasp (Cheerios), raspberries. 9 months: sits independently (unsupported by 8 months), crude pincer, ==looks for dropped objects==, mama and dada, bye-bye.", "★ **From the lecture (Nov 10):** Erikson: !!Trust vs mistrust!! (birth to 1 year). The infant learns that others will meet basic needs, or that they will not."]}]}, {"h": "Prematurity: all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Adjusted age:** ==Subtract the number of weeks the infant was premature from the chronological age.==", "★ **From the lecture (Nov 10):** Premature: born before ==37 weeks== of gestation (normal is about 40 weeks). Expect immature respiratory, nervous and GI systems and low iron and immunoglobulin stores.", "★ **From the lecture (Nov 10):** Adjusted age = chronological age minus weeks born early. Plot growth and judge milestones by adjusted age so a premature baby is not wrongly labeled delayed.", "★ **From the lecture (Nov 10):** Her example: 7 months old, born at 28 weeks. 12 weeks early = 3 months. 7 - 3 = ==4 months adjusted age==."]}]}, {"h": "Toddler (1-3): all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Nutrition (slide note):** Helpful: let the child choose meals by showing a few different options.", "★ **Elimination and sleep:** **Sleep** | ==10-12 hours at night==. Regular bedtime routine. Resists bedtime and voices fears (common). Falls asleep quickly", "★ **Developmental milestones:** **Play** | ==Parallel play== (plays beside, not with, another child). ==Filling empty containers, blocks, looking at books, push-pull toys, large-piece puzzles, thick crayons==", "★ **Developmental milestones (slide note):** Table 4.2, text p. 92.", "★ **Theorists: toddler:** **Erikson** | !!Autonomy vs Shame and Doubt!! | ==Learns to be self-sufficient or doubts their abilities. Independence is paramount. Negativism and ritualism are an important part of growth.==", "★ **Play and behavior:** Speech | ==Telegraphic speech== (key words only, 'me go') and ==echolalia== (repeats words)", "★ **Play and behavior (slide note):** Quiz question. Telegraphic speech, text p. 112, Box 4.5.", "★ **Education and anticipatory guidance (slide note):** Table 4.1, text p. 89.", "★ **Safety:** ==Rear-facing car seat as long as possible, front-facing until 40-60 lb. Always in the back seat.==", "★ **Safety (slide note):** Start safety teaching before the toddler stage! Quiz question.", "★ **From the lecture (Nov 10):** Vitals: temp 99 F, pulse 60-110, respirations 20-25. Grows about 3 in a year, gains 3-5 lb a year. Head and chest equal by 1-2 years.", "★ **From the lecture (Nov 10):** Nutrition: do not pressure, no food as a reward, finger foods with value, ==let the child choose from options==. Juice 4-6 oz, low-fat milk 16-24 oz a day. Avoid colas. Dental provider by age 1, brush after meals and at bedtime, fluoride may be needed. Wean from the bottle at 12-15 months.", "★ **From the lecture (Nov 10):** Sleep: 10-12 hours at night. Resisting bedtime and night fears are common. Keep a bedtime routine and move the crib to a bed when the child climbs out.", "★ **From the lecture (Nov 10):** Fine and gross motor: stacks 3-4 blocks at 18 months, 6-7 at 2 years. Walks alone at 15 months, throws a ball overhand at 18 months, stairs with both feet on each step at 2 years. About 50 words at 2 years, 2-3 word sentences by 36 months.", "★ **From the lecture (Nov 10):** ==Parallel play== (beside, not with): whole slide starred. Play is the major way toddlers socialize. About 30 minutes structured plus 1-3 hours unstructured activity a day. Limit television. Toddlers are egocentric and do not like to share.", "★ **From the lecture (Nov 10):** Safety: rear-facing as long as possible, then forward-facing at 40-60 lb, always in the back seat. Balloons are a choking hazard. Keep chemicals, sharp objects and firearms locked. Never leave alone in a tub. Windows locked, gates at stairs. Start safety teaching before the toddler stage.", "★ **From the lecture (Nov 10):** Erikson: !!autonomy vs shame and doubt!!. Independence is paramount, and negativism and ritualism are important for growth. Time-out is 1 minute per year of age.", "★ **From the lecture (Nov 10):** Typical behaviors (quiz flag): security item, tantrums, fear of loss of parents and strangers, telegraphic speech and echolalia, poor body boundaries, returning separation anxiety, resists invasive procedures.", "★ **From the lecture (Nov 10):** Vaccines: 12 months Hep A (2 doses 6 months apart) and annual flu. 15 months DTaP, Hib, IPV, MMR, varicella. ==MMR and varicella are live==."]}]}, {"h": "Preschool (3-6): all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Vital signs and growth (slide note):** Quiz question, text p. 145. Preschoolers often breathe with the diaphragm (belly rises and falls).", "★ **Nutrition:** ==3 meals and 2 snacks. Never force food. Never use food as a bribe, reward or punishment.==", "★ **Nutrition:** ==5 servings of fruits and vegetables a day (often like them raw).==", "★ **Nutrition (slide note):** Quiz question. White beans are high in calcium.", "★ **Theorists: preschool:** **Erikson** | !!Initiative vs Guilt!! | Wants to take on adult activities, sometimes oversteps limits set by parents and feels guilty", "★ **Education and anticipatory guidance (slide note):** Quiz questions. With nightmares the child can tell you what happened. Nightmare vs night terror, text p. 136.", "★ **From the lecture (Nov 10):** Nutrition: picky until about 5. 3 meals and 2 snacks. Never force food or use it as a reward or punishment. ==5 servings of fruit and vegetables==. Limit sweet drinks. Involve them in food prep. Offer no more than 2 choices. 1 hour of activity, screen time 1-2 hours.", "★ **From the lecture (Nov 10):** Erikson: !!initiative vs guilt!!. Wants to do adult activities, oversteps limits and feels guilty. Be consistent with discipline.", "★ **From the lecture (Nov 10):** Night terror vs nightmare: with a night terror the child wakes screaming and confused and does not understand what is going on. With a nightmare the child can remember and tell you the dream.", "★ **From the lecture (Nov 10):** Safety: booster seat when the forward-facing seat is outgrown, restraint until ==145 cm (4 ft 9 in) or 8-12 years==. Magical thinking can make a child think he can do the impossible (jumping from heights). Helmet, road crossing, swim and fire safety, learn parents' phone number."]}]}, {"h": "School Age (6-12): all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Vital signs and growth:** Puberty | ==Pre-puberty begins around age 9, especially for girls==", "★ **Vital signs and growth:** Menarche | ==10-16 years, average 12.5 years==", "★ **Vital signs and growth (slide note):** Visual impairment can show up at this age. Sign: squinting in class.", "★ **Nutrition:** **Calcium (mg)** | ==800-1,000== | ==1,300==", "★ **Nutrition (slide note):** Absolutely know the daily calcium intake.", "★ **Development:** **Self-concept** | Awareness of self in relation to others. Values and beliefs of the family. Confidence grows from positive self-concept, worth and making contributions. ==Middle school: more peer than parent influence.== Body image solidifies. Curiosity about sexuality and reproduction", "★ **Development:** **Social** | ==Peer groups are important. Peer pressure begins to take effect.== Clubs and best friends are popular. Bullying is meant to cause harm or control. Prefers same-gender company. Opposite-sex attraction begins in middle and later school age. Conformity becomes evident", "★ **Development (slide note):** Quiz question. Promoting learning and school attendance. Peer groups, behaviors and attitudes will have an impact. Healthy People 2030 table, text p. 181.", "★ **Theorists: school age:** **Erikson** | !!Industry vs Inferiority (7-11)!! | ==Confidence comes from competition, cooperation with others and accomplishing tasks. Learns that not every child masters every skill.==", "★ **Theorists: school age (slide note):** Quiz question, text p. 146. Example of Industry: signs up for school activities.", "★ **Developmental concerns:** Television and video games: set limits on content and time. ==Limit to 2 hours.==", "★ **Developmental concerns (slide note):** Quiz questions. Continuous peer relationships have the most impact on social interaction in school-age children (text p. 150). Limit video games to 2 hours a day (text p. 161).", "★ **Safety and immunizations:** ==Most accidents occur between 3 and 6 pm.==", "★ **From the lecture (Nov 10):** ==Visual impairment== can show at this age. Signs: squinting in class.", "★ **From the lecture (Nov 10):** ==Calcium== is highlighted as tested: 800-1,000 mg a day for ages 4-8, and 1,300 mg for 9-12. Iron about 10 mg. 3 meals and 2 snacks, watch for obesity, avoid fast food and skipped meals.", "★ **From the lecture (Nov 10):** In middle school ==peer influence is stronger than parental influence==. Peer pressure begins. Body image solidifies, curiosity about sexuality starts, clubs and best friends are popular and they like the same sex group.", "★ **From the lecture (Nov 10):** Erikson: !!industry vs inferiority!!. Confidence comes from accomplishing tasks, and not every child masters every skill.", "★ **From the lecture (Nov 10):** HPV: before age 15 only ==2 doses 6-12 months apart==. At 15 or older, 3 doses (0, 1-2 months, 6 months). Tdap and MCV4 are also due at 11-12."]}]}, {"h": "Adolescent (12-20): all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Vital signs and growth (slide note):** Menarche: average age 12.5 years.", "★ **Nutrition (slide note):** High in iron: meats, green leafy vegetables, eggs, peanut butter.", "★ **Development (slide note):** Quiz question, text p. 149. Peer relationships impact social interaction.", "★ **Theorists: adolescent:** **Erikson** | !!Identity vs Role Confusion!! | ==Who am I? Tries out different roles. Establishes sexual, political and career identity or is confused about what roles to play.==", "★ **Theorists: adolescent (slide note):** Nursing concerns: self-image, privacy, connection to peers.", "★ **Education, safety and risk:** ==Most accidents occur between 9 pm and 12 am.==", "★ **Suicide risk factors (slide note):** Quiz question, text p. 132. A child of a parent with a history of substance abuse can lack social and emotional readiness.", "★ **From the lecture (Nov 10):** Nutrition: 3 meals and 2 snacks, a teen multivitamin, extra iron, protein and calcium. ==Iron foods: eggs, leafy green vegetables, peanut butter, meat==. Risk of obesity, bulimia and anorexia, which can start in middle school.", "★ **From the lecture (Nov 10):** Erikson: !!identity vs role confusion!!. She called this an easy test question: forming sexual, political and career identity and being confused about roles.", "★ **From the lecture (Nov 10):** Suicide risk factors: depression or other mental illness, personal or family history of attempts, dysfunctional family, substance abuse, difficulty with sexual identity, social isolation, and marked behavior change such as giving away valued possessions."]}]}, {"h": "Immunizations: all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **What each one is (names and brands):** **RV** | Rotavirus. RotaTeq (3 doses), Rotarix (2 doses). Given by mouth | ==LIVE==", "★ **What each one is (names and brands):** **MMR** | Measles, mumps, rubella. M-M-R II, Priorix | ==LIVE==", "★ **What each one is (names and brands):** **VAR** | Varicella (chickenpox). Varivax | ==LIVE==", "★ **What each one is (names and brands) (slide note):** Your slide notes for the older child slide: Human papilloma virus and Meningococcal vaccine.", "★ **From the lecture (Nov 10):** Her tip: make flash cards for the vaccines as you go. The first quiz covers chapters 3-7.", "★ **From the lecture (Nov 10):** 12 months: Hep A, 2 doses 6 months apart. 15 months: DTaP, Hib, IPV, MMR, varicella. ==MMR and varicella are the live ones==."]}]}, {"h": "Theorists Compared: all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Stages by age group:** **Infant** (0-1) | Sensorimotor (0-2) | !!Trust vs Mistrust!! | Oral | Not yet (moral reasoning starts later)", "★ **Stages by age group:** **Toddler** (1-3) | Sensorimotor | !!Autonomy vs Shame and Doubt!! | Anal | Not yet (moral reasoning starts later)", "★ **Stages by age group:** **Preschool** (3-6) | Preoperational | !!Initiative vs Guilt!! | Phallic | Pre-conventional", "★ **Stages by age group:** **School age** (6-12) | Concrete operational (7-11) | !!Industry vs Inferiority!! | Latency | Conventional", "★ **Stages by age group:** **Adolescent** (12-20) | Formal operational (12-18) | !!Identity vs Role Confusion!! | Genital | Post-conventional", "★ **Stages by age group (slide note):** All five Erikson stages are shown in red so they stick together: Trust vs Mistrust, Autonomy vs Shame and Doubt, Initiative vs Guilt, Industry vs Inferiority, Identity vs Role Confusion.", "★ **From the lecture (Nov 10):** She said to star all of the Erikson stages.", "★ **From the lecture (Nov 10):** !!Trust vs mistrust!!: infant.", "★ **From the lecture (Nov 10):** !!Autonomy vs shame and doubt!!: toddler, wants to be self-sufficient.", "★ **From the lecture (Nov 10):** !!Initiative vs guilt!!: preschool, adult activities and overstepping limits.", "★ **From the lecture (Nov 10):** !!Industry vs inferiority!!: school age, accomplishing tasks and learning not everyone masters every skill.", "★ **From the lecture (Nov 10):** !!Identity vs role confusion!!: adolescent, an easy test item."]}]}, {"h": "Safety by Age: all highlights, stars and slide notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Safety side by side (slide note):** Instructor tags: infant safety quiz (text p. 78), toddler safety 'start before the toddler stage'."]}]}], "cold": ["Newborn pulse 120-160, BP site lateral tibialis or right upper arm.", "Weight doubles 4-6 months, triples at 1 year.", "Posterior fontanel closes by 2 months, anterior 12-18 months.", "Star all Erikson stages: trust, autonomy, initiative, industry, identity.", "HPV: 2 doses if started before 15, 3 doses at 15 or older.", "Calcium 800-1,000 mg (4-8 years), 1,300 mg (9-12 years)."], "traps": [["Quiz says ATI months and slide says weeks.", "Posterior fontanel closes at 2 months, which is 8 weeks."], ["A reflex is still present after its age.", "Neurologic impairment, needs follow-up."], ["Object permanence age.", "Quiz flag says 6 months, range 4-7."]]}, {"id": "vit", "icon": "📏", "title": "Vitals & Growth", "sub": "All ages, side by side", "sections": [{"h": "Vital signs by age", "blocks": [{"t": "tbl", "head": ["Age", "Temp", "Pulse", "Resp", "BP"], "rows": [["**Infant** (birth to 1 yr)", "99.6 F", "==Newborn 120-140, down to 90-100 at 1 yr==", "Newborn 30-60, 20-30 at 12 mo", "60-78 / 40-52"], ["**Toddler** (1-3)", "99 F (37.5 C)", "60-110", "20-25", "86-117 / 44-76"], ["**Preschool** (3-6)", "98.6 F", "60-110", "21-25", "86-122 / 44-84"], ["**School age** (6-12)", "98.2 to 97.9 F", "50-90", "18-20", "91-125 / 54-90"], ["**Adolescent** (12-20)", "97.9 F", "50-90", "16-20", "108-138 / 63-94"]]}, {"t": "note", "k": "star", "x": "Toddler vital signs slide is starred. Slide page reference for infant vitals: text p. 57."}]}, {"h": "How to take them, by age", "blocks": [{"t": "tbl", "head": ["Age group", "Heart rate", "Respirations", "Blood pressure"], "rows": [["**Infants**", "==Apical pulse (listen at the heart with a stethoscope), counted for 1 full minute==", "==Respirations counted for 1 full minute==", "~~Lateral tibialis artery (lower leg)~~"], ["**Toddlers**", "Radial pulse (wrist) counted for 30 seconds, then x 2. If irregular, listen apically for 1 full minute", "Respiration count time is not given on your slide", "~~Brachial or lateral tibialis artery unless contraindicated~~"], ["**School age to adult**", "Radial pulse (wrist) counted for 30 seconds, then x 2. If irregular, count for 1 full minute", "Respirations counted for 30 seconds, then x 2", "Brachial artery unless contraindicated"]]}, {"t": "ul", "items": ["Cuff size must be proportionate to the size of the child's extremity (too small reads falsely high, too big reads falsely low).", "The cuff-placement figure shows these sites: radial artery (wrist), popliteal artery (behind the knee), dorsalis pedis artery (top of foot), posterior tibial artery (inside ankle)."]}, {"t": "note", "k": "anno", "x": "If you cannot use the leg on an infant, the RIGHT upper arm is preferred. The left arm gives false readings."}]}, {"h": "Growth by age", "blocks": [{"t": "tbl", "head": ["Age", "Height / length", "Weight", "Head and chest"], "rows": [["**Infant**", "Birth 48-53 cm (19-21 in). Grows 2.5 cm (1 in)/month for 6 months. ==Length up 50% by 12 months==", "Birth 2700-4000 g (6-9 lb). Loses 10% in week 1, regains by 10-14 days. ==Doubles by 4-6 months, triples by 1 year==", "HC 33-35 cm. Up 2 cm/mo first 3 mo, 1 cm/mo months 4-6, 0.5 cm/mo second 6 mo. ==Head and chest equal by about 2 years=="], ["**Toddler**", "7.5 cm (3 in)/year. Half of adult height by age 2", "Gain 1.8-2.7 kg (3-5 lb)/year", "Head and chest equal by 1-2 years"], ["**Preschool**", "6.4-9 cm (2.5-3.5 in)/year. 3y 95 cm (37.5 in), 4y 103 cm (40.5 in), 5y 110 cm (43.5 in)", "Gain 2-3 kg (4.5-6.5 lb)/year. 3y 14.5 kg (32 lb), 4y 16.5 kg (36.5 lb), 5y 18.5 kg (41 lb)", ""], ["**School age**", "5 cm (2 in)/year", "2-3 kg (4.4-6.6 lb)/year", "==Pre-puberty begins about age 9, especially girls. Menarche 10-16, average 12.5=="], ["**Adolescent**", "Final 20-25% of height gained in puberty. Girls stop 2-2.5 yr after menarche (grow 5-20 cm). Boys stop at 18-20 yr (grow 10-30 cm)", "Girls gain 7-25 kg (15.5-55 lb). Boys gain 7-30 kg (15.5-66 lb)", ""]]}]}, {"h": "Growth charts and measuring", "blocks": [{"t": "ul", "items": ["Measure weight, length and head circumference, then plot on a standardized growth chart to judge growth for age.", "Children usually stay near the same percentile line over time.", "==A significant shift from the child's usual percentiles means further assessment is needed.==", "Specialized charts exist for children with certain diagnoses (for example Down syndrome) and for breastfed infants.", "The slide example is a CDC/WHO chart for boys, birth to 24 months. It plots head circumference-for-age and weight-for-length.", "Length board (recumbent): used for children under 2 years, under 85 cm, or too ill to stand. Accuracy 0.1 cm. It takes experience and patience.", "+ Why a board for babies: they cannot stand, so you lay them flat with the head against a fixed board and slide the foot piece to the heels."]}, {"t": "note", "k": "anno", "x": "Practice plotting from your slide notes: Baby girl 3 mo, HC 40 cm, wt 16 lb, ht 26 in. Baby boy 4.5 mo, HC 44 cm, wt 9.5 kg, ht 72 cm. Use the CDC charts linked in the slide notes."}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["★ Know the newborn pulse: ==120-160 is the norm==. Your slide shows 120-140, which sits inside that range. A newborn pulse near 70 or near 200 is a concern. Do not fixate on small differences between ATI and the text.", "★ Trend with age: pulse goes down, blood pressure goes up, respirations go down. A newborn has a high heart rate, low blood pressure and high respirations.", "★ Infant: apical pulse for a ==full minute==. Toddler: 30 seconds x 2 if regular, full minute if irregular. School age through adult: radial pulse 30 seconds x 2 if regular, full minute if irregular. Respirations follow the same rule.", "★ Infant BP site: ==lateral tibialis (lower leg)==. If you must use an arm, use the ==right upper arm==: with a heart defect the left side can give a false reading. Older child and adult: brachial artery. Cuff size must fit the child's extremity.", "★ Weight ==doubles at 4-6 months, triples at 1 year==. Length grows 2.5 cm a month for 6 months, up 50% by 12 months. Head circumference grows 2 cm a month for 3 months, 1 cm a month for months 4-6, 0.5 cm a month for the second 6 months. Head and chest are equal by about 2 years.", "Newborn weight: expected loss is about 10% and can reach 10-15% in breastfed babies over the first 2 weeks, regained by 10-14 days. Report loss beyond that.", "Percentiles: a child usually stays near the same percentile. A drop from the 90s to the 30s needs further assessment. Specialized growth charts exist for conditions such as Down syndrome."]}]}], "cold": ["Infant pulse: newborn 120-140, about 90-100 by 1 year. Infant resp: 30-60 down to 20-30 at 12 months.", "Infant BP site: lateral tibialis (lower leg). If no leg, RIGHT upper arm, never left.", "Infant HR and RR: full 1 minute. Toddler through adult: radial 30 sec, 1 minute if irregular.", "Weight: loses 10% week 1, back by 10-14 days, DOUBLES 4-6 months, TRIPLES 1 year.", "Length up 50% by 12 months. Head and chest equal at about 2 years.", "Head circumference grows fastest early: 2 cm/mo for 3 months, then 1 cm/mo, then 0.5 cm/mo.", "Toddler: 7.5 cm and 1.8-2.7 kg a year. Preschool: 6.4-9 cm and 2-3 kg a year. School age: 5 cm and 2-3 kg a year.", "Menarche 10-16, average 12.5. Girls stop growing 2-2.5 years later. Boys stop at 18-20.", "A jump across percentile lines on the growth chart means assess further."], "traps": [["Question asks which artery for an infant BP.", "Lateral tibialis (lower leg), not brachial."], ["Toddler radial pulse is irregular after 30 seconds.", "Count apically for a full minute."], ["Which arm if the leg cannot be used on an infant?", "Right upper arm. Left gives false readings."], ["Birth weight triples at 6 months?", "No. Doubles at 4-6 months, triples at 1 year."], ["Infant lost 10% of birth weight in week 1. Is that abnormal?", "No. Expected. Regains by 10-14 days."], ["Preschooler weight gain given in pounds.", "4.5-6.5 lb a year (2-3 kg). Do not mix with toddler 3-5 lb."]]}, {"id": "inf1", "icon": "🍼", "title": "Infant: Body & Care", "sub": "Birth to 12 months", "sections": [{"h": "Fontanels", "star": true, "blocks": [{"t": "tbl", "head": ["Fontanel", "Shape", "Closes"], "rows": [["**Anterior** (front)", "Diamond", "==12 to 18 months=="], ["**Posterior** (back)", "Triangle", "==By 8 weeks (2 months)=="]]}, {"t": "note", "k": "star", "x": "Quiz question: fontanels. Anterior (diamond, front) closes at 12-18 months. Posterior (triangle, back) closes by 2 months."}, {"t": "ul", "items": ["+ Normal: soft, flat, may pulse. A bulging fontanel suggests raised intracranial pressure. A sunken one suggests dehydration. Report either."]}]}, {"h": "Neurologic system: primitive reflexes", "star": false, "blocks": [{"t": "ul", "items": ["The central nervous system is not fully myelinated at birth.", "Primitive reflexes are present at birth and fade as the brain matures.", "==Focus points from your notes: asymmetric tonic neck, palmar grasp, rooting.==", "Table 3.1, text p. 58."]}, {"t": "tbl", "head": ["Reflex", "What it looks like", "Gone by"], "rows": [["**Step**", "+ Held upright with feet touching a surface, baby makes alternating stepping motions", "4-8 weeks"], ["**Root** ★", "+ Stroke the cheek or mouth corner and the head turns toward the touch with mouth open", "3 months"], ["**Suck**", "+ Touch lips or palate and baby sucks rhythmically", "2-5 months"], ["**Moro** (startle)", "+ Sudden head drop or loud noise: arms fling out, then pull in, baby cries", "4 months"], ["**Asymmetric tonic neck** (fencing) ★", "+ Head turned to one side: arm and leg on that side extend, opposite side flexes", "4 months"], ["**Plantar**", "+ Touch the sole at the base of the toes and the toes curl down", "9 months"], ["**Palmar grasp** ★", "+ Press an object into the palm and fingers close tightly", "4-6 months"], ["**Babinski**", "+ Stroke the outer sole heel to toe: toes fan out and big toe goes up", "12 months"]]}, {"t": "note", "k": "anno", "x": "+ Reflex stays past its age, never shows, or shows on one side only = neurologic concern. Report to the provider."}]}, {"h": "Protective reflexes", "blocks": [{"t": "ul", "items": ["Appear as primitive reflexes disappear.", "Involuntary motor responses that keep the body in equilibrium.", "They persist throughout life."]}, {"t": "tbl", "head": ["Reflex", "Appears"], "rows": [["**Neck righting** (+ head turns, body follows)", "4-6 months"], ["**Parachute, sideways** (+ arm extends to break a sideways fall)", "6 months"], ["**Parachute, forward** (+ arms extend when tipped forward)", "6-7 months"]]}]}, {"h": "Nutrition", "star": true, "blocks": [{"t": "ul", "items": ["Breast milk is a complete diet: about 25 oz or 750 mL per 24 hours at 20 cal/oz.", "Iron supplement for exclusively breastfed infants at 4 months.", "Vitamin D supplement from the first week of life (the one vitamin breast milk does not provide).", "Iron-fortified formula is an acceptable alternative.", "Never prop a bottle: aspiration risk and dental caries (nursing bottle mouth, also called baby bottle tooth decay). Feed at a 45 degree position.", "==Solids at 4-6 months by spoon. Start with iron-fortified rice cereal (least allergenic).==", "New foods one at a time, any order, about 5 days apart to watch for allergy.", "Cup at 6 months. Begin weaning by 9 months. Avoid sippy cups for general use.", "Finger foods can start at 9-12 months.", "==Teeth: first erupt at 6-8 months, 3-6 teeth by 12 months. Sign: ear rubbing.==", "Teething: irritable, mild fever, rubs ears. Acetaminophen if it disrupts sleep (ibuprofen only over 6 months). Wash teeth with a clean cool washcloth."]}, {"t": "note", "k": "star", "x": "Your notes: breastfeed every 3-4 hours and no night bottles (disrupts milk production). Infant must sit supported upright in a highchair (text p. 79). Whole milk, peanut, egg and honey only after 12 months. Sippy cup p. 80. Spitting up risk p. 87. Instructor flagged this as a quiz question."}]}, {"h": "Elimination and sleep", "blocks": [{"t": "tbl", "head": ["Feeding type", "How often", "Looks like"], "rows": [["**Breast fed**", "After each feeding", "Curdy, yellow"], ["**Formula fed**", "1-2 times per 24 hours", "Formed, soft, brown to yellow"]]}, {"t": "tbl", "head": ["Age", "Sleep"], "rows": [["Infants", "14-15 hours a day"], ["3-4 months", "9-11 hours a day"], ["12 months", "Sleeps through the night, 1-2 naps"]]}]}, {"h": "Skin, fluids, language, play", "blocks": [{"t": "ul", "items": ["More prone to dehydration (about 80% water).", "Lanugo and vernix may be seen in newborns.", "==Acrocyanosis (blue hands and feet) is normal in the newborn and fades over the first few months.==", "Skin is thinner than an adult's and peripheral capillaries are closer to the surface. Blue color and mottling from the immature system are gone by the end of the first weeks.", "Language: infants of bilingual families may mix languages (normal). Crying peaks at 2-4 hours a day by 6 weeks and decreases by 12 weeks."]}, {"t": "tbl", "head": ["Age", "Play ideas"], "rows": [["Newborn-1 mo", "Contrast colors, unbreakable mirror, soft bright toys, soft music"], ["1-4 mo", "Rattles, singing, large picture books"], ["4-7 mo", "Fabric or board books, easy-to-hold rattles, bath toys, soft dolls or animals"], ["8-12 mo", "Plastic cups, bowls, buckets, large blocks, stacking toys, toy phone, push-pull toys"]]}, {"t": "note", "k": "anno", "x": "Walkers delay growth and development."}]}, {"h": "Safety: accidents happen when routine changes", "star": true, "blocks": [{"t": "ul", "items": ["Federally approved car seat, REAR-facing, in the back seat, secured with the safety belt.", "Keep plastic bags and balloons away (aspiration). Keep sharp objects out of reach.", "Hot water heater set at 120 F.", "Never leave unattended in a bathtub or near water.", "Crib mattress at the lowest position, restraints used in infant seats, crib slats no more than 2 inches apart.", "Poison control: plants, safety locks on cabinets, cleaning supplies out of reach.", "==SIDS prevention: baby on the back (supine), no pillow, no bumper pads, no stuffed toys in the crib. Pacifier helps. No smoking.==", "Teach parents infant CPR."]}, {"t": "note", "k": "star", "x": "Quiz question on this infant safety slide (text p. 78). The slide's headline is that accidents happen when the routine changes. Know every safety item listed above."}]}, {"h": "Anticipatory guidance", "blocks": [{"t": "ul", "items": ["Becoming parents and the family's patterns of interaction.", "Baby: smoother muscle movement, hands reaching out, settling into feeding and sleep schedules, curious searching with the eyes and reaching with the hands.", "Health patterns: nutrition, elimination, stimulation."]}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["★ Fontanel slide is starred and flagged as a quiz question. ATI may say months instead of weeks: posterior fontanel closes by ==2 months (8 weeks)==, anterior diamond closes at ==12-18 months==. A posterior fontanel still open at 6 months needs investigation.", "★ Instructor starred ==asymmetric tonic neck, palmar grasp and rooting==. ATI can ask any reflex. A primitive reflex that stays past its age points to a neurologic impairment and needs a workup.", "Ages from lecture: stepping 4-8 weeks, rooting 3 months, Moro 4 months, palmar grasp 4-6 months, plantar grasp 9 months. Suck: gloved finger in the mouth, baby sucks at once. Babinski: stroke sole to toes, big toe goes up and out while the other toes fan.", "Asymmetric tonic neck: turn the head to one side and the arm and leg on that same side extend (fencing position).", "Protective reflexes replace the primitive ones: neck righting (head turns with the body) and parachute (arms go out sideways or forward when falling).", "★ ==Acrocyanosis== (blue hands and feet) is normal in a newborn and fades over the first few months.", "★ Solids at 4-6 months by spoon, ==rice cereal first==, one new food at a time over about 5 days to watch for allergy. No fruit first (they hold out for sweet).", "★ Breastfed: about 25 oz (750 mL) a day. Vitamin D from the first week. Iron at 4 months if exclusively breastfed. Iron-fortified formula replaces the iron supplement. No propped bottle (aspiration and dental caries), feeding position about 45 degrees.", "Newborn stomach is tiny, so frequent spitting up is often overfeeding.", "Sleep: newborn 14-15 hours a day, then 9-11 hours, and at 12 months sleeps through the night with 1-2 naps.", "Teething (first teeth 6-8 months, 3-6 teeth by 12 months): irritable, mild fever, ear rubbing. Parents often think it is an ear infection."]}]}], "cold": ["Fontanels: anterior diamond closes 12-18 months, posterior triangle closes by 8 weeks.", "Rooting, palmar grasp and asymmetric tonic neck are your instructor's focus reflexes.", "Disappear: step 4-8 wk, root 3 mo, suck 2-5 mo, Moro 4 mo, tonic neck 4 mo, plantar 9 mo, palmar 4-6 mo, Babinski 12 mo.", "Protective reflexes last for life: neck righting 4-6 mo, parachute sideways 6 mo, parachute forward 6-7 mo.", "Vitamin D starts in week 1. Iron at 4 months if exclusively breastfed.", "Solids at 4-6 months by spoon, rice cereal first. One new food every 5 days.", "First teeth at 6-8 months. Ibuprofen only over 6 months.", "Whole milk, honey, peanut and egg only after 12 months (your notes).", "SIDS: back to sleep, bare crib. Never prop a bottle. Hot water 120 F. Rear-facing car seat."], "traps": [["Which infant reflex is the Babinski?", "Toes fan upward. It is the LAST to go (12 months), not at 4 months."], ["Reflex timing: Moro vs plantar.", "Moro gone by 4 months. Plantar lasts until 9 months."], ["Parent asks about starting solids at 3 months.", "Too early. 4-6 months, by spoon, rice cereal first."], ["Is a bottle in the crib okay if it is propped?", "Never. Aspiration and nursing bottle mouth (dental caries)."], ["Which vitamin is not in breast milk?", "Vitamin D. Start in the first week."], ["Anterior vs posterior fontanel closing times.", "Anterior 12-18 months. Posterior 8 weeks."], ["Is acrocyanosis an emergency in a newborn?", "No. Normal and fades over the first few months."]]}, {"id": "inf2", "icon": "🧸", "title": "Infant: Milestones & Theory", "sub": "2, 4, 6, 9 months", "sections": [{"h": "How skills develop", "blocks": [{"t": "ul", "items": ["+ Head to toe (cephalocaudal): neck control comes before sitting, sitting before walking.", "+ Center outward (proximodistal): shoulders and arms are controlled before the fingers.", "The slide figure shows red arrows for both directions on an infant."]}]}, {"h": "2 months", "star": true, "blocks": [{"t": "tbl", "head": ["Area", "Milestone"], "rows": [["Gross motor", "Holds head up in prone (belly) position by 2 months"], ["Fine motor", "Strong reflex grasp (1 month)"], ["Cognitive", "Observes movement. Gazes at an object for several seconds"], ["Language", "Cries and makes other sounds. Startled by loud noises"], ["Social", "Calms down when picked up. Social smiles when spoken to"], ["Client education", "Talk, read and sing to the infant. Place on tummy while awake, with supervision"]]}, {"t": "note", "k": "anno", "x": "Premature infants have delayed milestones. Give more time and reevaluate."}]}, {"h": "4 months", "star": true, "blocks": [{"t": "tbl", "head": ["Area", "Milestone"], "rows": [["Gross motor", "==No head lag== (head stays up)"], ["Fine motor", "Brings hand to mouth. Grasps objects with both hands"], ["Cognitive", "Shows interest in hands by observing them"], ["Language", "Cooing. Makes consonant sounds. Imitates sounds back"], ["Social", "Smiles, moves, makes sounds to get attention"], ["Client education", "Positive talk, let the infant reach for objects. Talk, read, sing. Routine for eating and sleeping. Allow a safe clean object in the mouth"]]}]}, {"h": "6 months", "star": true, "blocks": [{"t": "tbl", "head": ["Area", "Milestone"], "rows": [["Gross motor", "==Rolls completely over=="], ["Fine motor", "Holds bottle. Begins gross pincer or palmar grasp"], ["Cognitive", "Puts objects in mouth. Grabs toy"], ["Language", "High pitched squeals. Raspberries (tongue out and blows). Takes turns making sounds with another person"], ["Social", "Laughs. Enjoys looking at self in the mirror"], ["Client education", "Reciprocal play with the infant. Read, sing, play music"]]}, {"t": "note", "k": "star", "x": "Instructor flagged the palmar grasp at 6 months as a quiz question."}]}, {"h": "9 months", "star": true, "blocks": [{"t": "tbl", "head": ["Area", "Milestone"], "rows": [["Gross motor", "Gets to sitting position alone. Sits unsupported, usually by 8 months"], ["Fine motor", "Crude pincer grasp. Neat pincer grasp by 11 months"], ["Cognitive", "Looks for dropped or hidden objects (object permanence)"], ["Language", "Many sounds with longer syllables ('mama', 'dada'). Lifts arms to be picked up"], ["Social", "Looks when name is called. Reacts when parent or caregiver leaves the room. Smiles or laughs during games"], ["Client education", "Repeat sounds, use simple words. Wave bye-bye, shake head no. Peek-a-boo, put blocks into containers"]]}, {"t": "ul", "items": ["+ Pincer grasp: thumb and finger pick up a small object. Crude = whole finger side. Neat = tips of thumb and index finger."]}]}, {"h": "Theorists: birth to 1 year", "blocks": [{"t": "tbl", "head": ["Theorist", "Stage", "What it means"], "rows": [["**Piaget**", "Sensorimotor (birth to 2 years)", "Action is reflexive, moving to simple repetitive. Learns they are separate from other objects. ==Object permanence at about 4-7 months== (knows a hidden object still exists). Mental representation: uses symbols"], ["**Erikson**", "!!Trust vs Mistrust (birth to 1 year)!!", "Others will meet their basic needs, or they will not"], ["**Freud**", "Oral stage (birth to 1 year)", "Mouth, tongue and gums are the focus of pleasurable sensation"]]}, {"t": "note", "k": "star", "x": "Quiz question: object permanence at 6 months."}]}, {"h": "Assessing development", "blocks": [{"t": "ul", "items": ["The nurse may ask the parent whether a skill is present, or the infant may show it during the interview.", "Screening tools can be used. What each is:"]}, {"t": "tbl", "head": ["Tool", "What it is"], "rows": [["**Denver II**", "+ Observed screen in four areas: personal-social, fine motor, language, gross motor. Flags delays against age norms. Also called the Denver Developmental Screening Test II."], ["**PDQ II**", "+ Prescreening Developmental Questionnaire. A parent-completed form that helps decide who needs the full Denver screen."], ["**ASQ**", "+ Ages and Stages Questionnaire. Parent-completed questionnaires for set ages."], ["**Infant-Toddler Checklist**", "+ Screens language and communication in infants and toddlers."], ["**Infant Development Inventory**", "+ Another parent-report screen of infant development listed on your slide."]]}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["★ Instructor said milestones are a favorite test topic. 2 months: lifts head in prone, strong grasp reflex at 1 month. 4 months: no head lag, hands to mouth, grasps with both hands, coos. 6 months: ==rolls completely over==, holds bottle, palmar grasp (Cheerios), raspberries. 9 months: sits independently (unsupported by 8 months), crude pincer, ==looks for dropped objects==, mama and dada, bye-bye.", "Object permanence (looks for a hidden or dropped object): 6 months for the quiz flag, within the 4-7 month range.", "★ Erikson: !!Trust vs mistrust!! (birth to 1 year). The infant learns that others will meet basic needs, or that they will not.", "Premature infants have delayed milestones: tell parents to give more time and reevaluate using adjusted age.", "Walkers delay growth and development, so they are not recommended.", "Infants from bilingual families may mix languages. This is normal.", "Newborn to 1 month: high contrast colors, unbreakable mirrors. 1-4 months: rattles, singing, large picture books. 4-7 months: board books, bath toys, soft dolls. 8-12 months: cups, bowls, blocks, stacking toys, toy telephones."]}]}], "cold": ["2 months: holds head up prone, social smile, calms when picked up.", "4 months: NO head lag, brings hand to mouth, cooing and consonant sounds.", "6 months: rolls completely over, raspberries, palmar/gross pincer grasp, laughs.", "9 months: sits alone, crude pincer, object permanence, waves bye-bye.", "Object permanence: 4-7 months range, 6 months for your quiz.", "Erikson: Trust vs Mistrust. Piaget: sensorimotor. Freud: oral.", "Premature infant: delayed milestones, give more time and reevaluate.", "Denver II is an observed screen. PDQ II and ASQ are parent questionnaires."], "traps": [["Which milestone marks 4 months?", "No head lag. Rolling completely over is 6 months."], ["Infant looks for a hidden toy. Which concept?", "Object permanence (Piaget, sensorimotor)."], ["Which Erikson stage in infancy?", "Trust vs Mistrust, not Autonomy vs Shame (that is toddler)."], ["Freud's infant stage is the anal stage?", "No. Oral stage. Anal is toddler."], ["Which tool is parent-completed?", "ASQ and PDQ II. Denver II is observed by the nurse."], ["Premature infant misses the 2-month milestone. Alarm?", "Not yet. Use adjusted age, give more time, reevaluate."]]}, {"id": "prem", "icon": "👶", "title": "Prematurity", "sub": "Adjusted age", "sections": [{"h": "What counts as premature", "blocks": [{"t": "ul", "items": ["Normal pregnancy is about 40 weeks.", "Prematurity (WHO): birth before 37 weeks from the mother's last menstrual period.", "Premature babies often have immature respiratory and nervous systems, low iron and immunoglobulin stores, and an immature GI tract that may not handle oral feeding."]}]}, {"h": "Adjusted age", "blocks": [{"t": "ul", "items": ["Assessments of growth and development must adjust for prematurity.", "Use the adjusted age to decide what outcomes to expect.", "==Subtract the number of weeks the infant was premature from the chronological age.==", "Plot growth and judge milestones using the adjusted age.", "Premature infants have delayed milestones. Give more time and reevaluate."]}, {"t": "ex", "x": "Slide example: a 7-month-old born at 28 weeks. Born 12 weeks early (40 - 28 = 12 weeks, which is 3 months). 7 months - 3 months = 4 months adjusted age. Answer: 4 months."}, {"t": "calc"}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["★ Premature: born before ==37 weeks== of gestation (normal is about 40 weeks). Expect immature respiratory, nervous and GI systems and low iron and immunoglobulin stores.", "★ Adjusted age = chronological age minus weeks born early. Plot growth and judge milestones by adjusted age so a premature baby is not wrongly labeled delayed.", "★ Her example: 7 months old, born at 28 weeks. 12 weeks early = 3 months. 7 - 3 = ==4 months adjusted age==."]}]}], "cold": ["Premature: born before 37 weeks.", "Weeks early = 40 minus gestational age at birth.", "Adjusted age = chronological age minus weeks premature.", "Plot growth and judge milestones on the adjusted age.", "Premature infants: immature lungs, brain, GI tract, low iron and immunoglobulins."], "traps": [["Adjusted age asked in months, gestation given in weeks.", "Convert 4 weeks = about 1 month before subtracting. 12 weeks = 3 months."], ["Born at 32 weeks, now 6 months. What age do you use?", "40 - 32 = 8 weeks = 2 months early. 6 - 2 = 4 months."], ["Which age goes on the growth chart?", "Adjusted age, not chronological."], ["Do you add or subtract the weeks?", "Subtract."]]}, {"id": "tod", "icon": "🚶", "title": "Toddler (1-3)", "sub": "Autonomy and safety", "sections": [{"h": "Vital signs and growth", "star": true, "blocks": [{"t": "tbl", "head": ["Measure", "Toddler"], "rows": [["Temp", "99 F (37.5 C)"], ["Pulse", "60-110"], ["Respirations", "20-25"], ["BP", "86-117 / 44-76"], ["Height", "7.5 cm (3 in)/year. Half of adult height by age 2"], ["Weight", "Gain 1.8-2.7 kg (3-5 lb)/year"], ["Head and chest", "Equal by 1-2 years"]]}]}, {"h": "Nutrition", "star": true, "blocks": [{"t": "ul", "items": ["Do not pressure to eat. Do not use food as a reward.", "Finger foods with food value. Avoid empty calories.", "Water. Avoid sugary additives. Limit juice to 4-6 oz a day.", "Low-fat milk, no more than 16-24 oz a day.", "Avoid colas, especially with caffeine (rare occasion only).", "Children copy the eating habits of the people around them.", "Parents brush and floss after meals and at bedtime. May need fluoride supplements. Establish a dental provider.", "Wean from the bottle by 12-15 months."]}, {"t": "note", "k": "anno", "x": "Helpful: let the child choose meals by showing a few different options."}]}, {"h": "Elimination and sleep", "blocks": [{"t": "tbl", "head": ["Topic", "Details"], "rows": [["**Toilet training readiness**", "Says familiar words (peepee, poopoo). Follows a family member to the bathroom. Shows interest. Stays dry 3-4 hours at a time"], ["**Normal stool**", "Daily, but every 1-3 days is normal. Watch for constipation"], ["**Constipation**", "More than 3 days needs a referral. Miralax added to the diet only per provider order"], ["**Sleep**", "==10-12 hours at night==. Regular bedtime routine. Resists bedtime and voices fears (common). Falls asleep quickly"], ["**Sleep safety**", "Move from crib to bed. Gate at the bedroom door so the toddler cannot roam at night. An older toddler may not want a nap"]]}]}, {"h": "Developmental milestones", "star": true, "blocks": [{"t": "tbl", "head": ["Area", "Milestone"], "rows": [["**Fine motor**", "Uses a cup well by 15 months. Spoon and cup well by 18 months. Tower of cube blocks: 3-4 blocks at 18 months, 6-7 blocks at 2 years. Turns book pages one at a time at 2 years"], ["**Gross motor**", "15 months: walks without help, creeps up stairs. 18 months: walks independently, often throws a ball overhand, pulls and pushes toys. 2 years: walks up and down stairs, both feet on each step"], ["**Language**", "Favorite word is 'No'. About 50 words. 2-3 word sentences by 36 months (3 years)"], ["**Play**", "==Parallel play== (plays beside, not with, another child). ==Filling empty containers, blocks, looking at books, push-pull toys, large-piece puzzles, thick crayons=="]]}, {"t": "note", "k": "anno", "x": "Table 4.2, text p. 92."}]}, {"h": "Theorists: toddler", "blocks": [{"t": "tbl", "head": ["Theorist", "Stage", "What it means"], "rows": [["**Piaget**", "Sensorimotor", "Self-centered. Asks many questions. Explores the environment. Associates words with objects"], ["**Erikson**", "!!Autonomy vs Shame and Doubt!!", "==Learns to be self-sufficient or doubts their abilities. Independence is paramount. Negativism and ritualism are an important part of growth.=="], ["**Freud**", "Anal stage", "The anus is the focus of pleasurable activity. Toilet training is the focus"]]}, {"t": "ul", "items": ["+ Negativism: saying 'no' to everything. Ritualism: needs things done the same way every time. Both are normal now."]}]}, {"h": "Play and behavior", "blocks": [{"t": "ul", "items": ["Play is the major socializing medium at this age.", "Needs 30 minutes of structured and 1-3 hours of unstructured physical activity daily.", "Limit television. Encourage creative and physical play.", "Parallel play, not cooperative play. Toddlers are egocentric (their own view only) and do not like to share.", "Short attention span: they change toys often. Multi-sense toys need not be expensive."]}, {"t": "tbl", "head": ["Typical behaviors", ""], "rows": [["Security item", "May rely on a blanket or toy"], ["Gender", "Becomes aware of gender differences"], ["Aggression and tantrums", "May be aggressive. Temper tantrums occur"], ["Fears", "Fear of losing parents and of strangers. Separation anxiety may return"], ["Speech", "==Telegraphic speech== (key words only, 'me go') and ==echolalia== (repeats words)"], ["Self-awareness", "More self-aware but no clear body boundaries. May resist invasive procedures"]]}, {"t": "note", "k": "star", "x": "Quiz question. Telegraphic speech, text p. 112, Box 4.5."}]}, {"h": "Education and anticipatory guidance", "blocks": [{"t": "ul", "items": ["Masturbation: exploring pleasurable sensation. Normal.", "Gender identity is formed by age 3.", "Toddlers see themselves as separate from their parents.", "Limit setting: time-out = 1 minute per year of age. Plan for temper tantrums, temperament, impulse control and anger management."]}, {"t": "note", "k": "anno", "x": "Table 4.1, text p. 89."}]}, {"h": "Safety", "star": true, "blocks": [{"t": "ul", "items": ["Accidents happen when routine changes, after stressful events, when caregivers are tired or ill, and in the late afternoon.", "==Rear-facing car seat as long as possible, front-facing until 40-60 lb. Always in the back seat.==", "Aspiration: grapes, hot dogs, coins, candy, small toys or pieces. Balloons are a choking hazard.", "Poisoning: keep chemicals locked away. Sharp objects out of reach. Firearms locked.", "Two more hazards on your slide: pets and animals, and burns.", "Never unattended in the bathtub. Toilet lids closed. Sunscreen.", "Falls: doors and windows locked, move to a toddler bed, safety gates at the top and bottom of stairs."]}, {"t": "note", "k": "star", "x": "Start safety teaching before the toddler stage! Quiz question."}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["★ Vitals: temp 99 F, pulse 60-110, respirations 20-25. Grows about 3 in a year, gains 3-5 lb a year. Head and chest equal by 1-2 years.", "★ Nutrition: do not pressure, no food as a reward, finger foods with value, ==let the child choose from options==. Juice 4-6 oz, low-fat milk 16-24 oz a day. Avoid colas. Dental provider by age 1, brush after meals and at bedtime, fluoride may be needed. Wean from the bottle at 12-15 months.", "Toilet training readiness: knows words, follows family to the bathroom, shows interest, stays dry 3-4 hours. Stool about once a day. No stool for over 3 days is a constipation concern.", "★ Sleep: 10-12 hours at night. Resisting bedtime and night fears are common. Keep a bedtime routine and move the crib to a bed when the child climbs out.", "★ Fine and gross motor: stacks 3-4 blocks at 18 months, 6-7 at 2 years. Walks alone at 15 months, throws a ball overhand at 18 months, stairs with both feet on each step at 2 years. About 50 words at 2 years, 2-3 word sentences by 36 months.", "★ ==Parallel play== (beside, not with): whole slide starred. Play is the major way toddlers socialize. About 30 minutes structured plus 1-3 hours unstructured activity a day. Limit television. Toddlers are egocentric and do not like to share.", "★ Safety: rear-facing as long as possible, then forward-facing at 40-60 lb, always in the back seat. Balloons are a choking hazard. Keep chemicals, sharp objects and firearms locked. Never leave alone in a tub. Windows locked, gates at stairs. Start safety teaching before the toddler stage.", "★ Erikson: !!autonomy vs shame and doubt!!. Independence is paramount, and negativism and ritualism are important for growth. Time-out is 1 minute per year of age.", "★ Typical behaviors (quiz flag): security item, tantrums, fear of loss of parents and strangers, telegraphic speech and echolalia, poor body boundaries, returning separation anxiety, resists invasive procedures.", "Vaccines: 12 months Hep A (2 doses 6 months apart) and annual flu. 15 months DTaP, Hib, IPV, MMR, varicella. ==MMR and varicella are live==."]}]}], "cold": ["Erikson: Autonomy vs Shame and Doubt. Freud: anal. Piaget: sensorimotor. Negativism and ritualism are normal.", "Cup at 15 months. Spoon and cup at 18 months. Tower 3-4 blocks at 18 months, 6-7 at 2 years.", "Walks alone at 15 months. Stairs with both feet on each step at 2 years.", "About 50 words. 2-3 word sentences by 3 years. Favorite word is no.", "Parallel play. Toddlers are egocentric and do not share.", "Time-out: 1 minute per year of age.", "Sleep 10-12 hours. Gate the door. Toilet training readiness: stays dry 3-4 hours.", "Car seat rear-facing as long as possible, front-facing until 40-60 lb, back seat.", "Milk limit 16-24 oz. Juice 4-6 oz. Wean from the bottle by 12-15 months."], "traps": [["Toddler says 'me go store'.", "Telegraphic speech. Normal. Not a delay."], ["Toddler repeats the last word you say.", "Echolalia. Normal at this age."], ["Toddler plays next to, not with, a peer.", "Parallel play. Cooperative play is later."], ["Parent bribes with dessert to finish dinner.", "Do not use food as a reward or pressure to eat."], ["Time-out for a 3-year-old.", "3 minutes (1 minute per year)."], ["Which age for Autonomy vs Shame and Doubt?", "Toddler. Trust vs Mistrust is infant."]]}, {"id": "pre", "icon": "🎨", "title": "Preschool (3-6)", "sub": "Initiative and magical thinking", "sections": [{"h": "Vital signs and growth", "star": false, "blocks": [{"t": "tbl", "head": ["Measure", "Preschool"], "rows": [["Temp", "98.6 F"], ["Pulse", "60-110"], ["Respirations", "21-25"], ["BP", "86-122 / 44-84"], ["Height", "6.4-9 cm (2.5-3.5 in)/year: 3y 95 cm, 4y 103 cm, 5y 110 cm"], ["Weight", "Gain 2-3 kg (4.5-6.5 lb)/year: 3y 14.5 kg, 4y 16.5 kg, 5y 18.5 kg"]]}, {"t": "note", "k": "star", "x": "Quiz question, text p. 145. Preschoolers often breathe with the diaphragm (belly rises and falls)."}]}, {"h": "Nutrition", "blocks": [{"t": "ul", "items": ["Finicky eaters until about age 5, then more willing to try new foods.", "==3 meals and 2 snacks. Never force food. Never use food as a bribe, reward or punishment.==", "==5 servings of fruits and vegetables a day (often like them raw).==", "0 servings of sweetened beverages.", "Involve them in food prep (age appropriate).", "Food choice: this or that, no more than two choices.", "1 hour of physical activity. No more than 1-2 hours of screen time."]}, {"t": "note", "k": "star", "x": "Quiz question. White beans are high in calcium."}]}, {"h": "Developmental milestones", "blocks": [{"t": "tbl", "head": ["Area", "Milestone"], "rows": [["**Fine motor**", "Draws a person with 5 or more recognizable parts"], ["**Gross motor**", "Hopping, skipping, dancing. Dresses independently"], ["**Language**", "Uses verbs and plurals correctly. Stuttering is normal. Lisping is normal up to age 5-6"], ["**Play**", "Pretend play. Changes rules to suit themselves. Plays games with simple rules"]]}, {"t": "tbl", "head": ["Social skills developed", ""], "rows": [["Cooperation, sharing things and feelings", "Kindness, generosity, affection"], ["Conversation, loves to talk", "Expressing feelings"], ["Helping others, making friends", "Comparing self to others"]]}]}, {"h": "Theorists: preschool", "blocks": [{"t": "tbl", "head": ["Theorist", "Stage", "What it means"], "rows": [["**Piaget**", "Preoperational (3-6 years)", "Includes and considers others. Enjoys repeating words, counting. Words express thoughts. Magical thinking, animism, centration, time"], ["**Erikson**", "!!Initiative vs Guilt!!", "Wants to take on adult activities, sometimes oversteps limits set by parents and feels guilty"], ["**Freud**", "Phallic stage", "Genitals are the most important body part. Boys are proud, girls wonder why they do not have one (Oedipal conflict)"], ["**Kohlberg**", "Pre-conventional", "Morality is good or bad. Based on punishment and obedience"]]}, {"t": "tbl", "head": ["Piaget term", "Meaning"], "rows": [["**Magical thinking**", "+ Believes thoughts or wishes can cause events. Thinks they can fly or break bricks like on TV"], ["**Animism**", "+ Believes objects are alive ('the moon is following me')"], ["**Centration**", "+ Focuses on one feature only and misses the rest"], ["**Egocentric**", "+ Sees the world only from their own viewpoint"]]}]}, {"h": "Education and anticipatory guidance", "blocks": [{"t": "ul", "items": ["Promote acceptable behavior. Discipline with consistency.", "Limit screen time to 1-2 hours. 1 hour of physical activity daily.", "Encourage social play. Play is interactive, games with simple rules.", "12 hours of sleep with a consistent routine. Fears and night terrors may occur.", "Dental trauma (injury to the teeth, usually from falls) is common.", "Elimination patterns should be well established."]}, {"t": "tbl", "head": ["", "Nightmare", "Night terror"], "rows": [["**What happens**", "+ Child wakes scared and can tell you about it", "+ Child screams, looks awake but does not respond to you"], ["**Memory**", "+ Remembers the dream", "+ Does not remember in the morning"], ["**What you do**", "+ Comfort, reassure, talk about it", "+ Stay close, keep safe, do not try to wake or question"]]}, {"t": "note", "k": "star", "x": "Quiz questions. With nightmares the child can tell you what happened. Nightmare vs night terror, text p. 136."}]}, {"h": "Safety", "star": true, "blocks": [{"t": "ul", "items": ["Federally approved car restraint. Move to a booster seat when the forward-facing seat is outgrown. A restraint is recommended until 145 cm (4 ft 9 in) or age 8-12.", "Magical thinking can
