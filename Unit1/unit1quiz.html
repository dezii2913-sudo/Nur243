, {"ty": "mc", "d": 3, "q": "A mother says her 6-month-old, born 3 months early, is not rolling over. What does the nurse tell her?", "o": ["At 3 months adjusted, rolling is not expected", "Rolling over is expected, so refer now", "Her baby is advanced", "Adjusted age is only used after 12 months"], "a": [0], "y": "Right: 3 months early means adjusted age is 3 months. Why not refer: that compares to the wrong age. Why not advanced: not rolling is not advanced. Why not after 12 months: adjusted age applies from the start and is used until the catch-up."}, {"ty": "mc", "d": 3, "q": "Which statement about a premature baby is correct?", "o": ["Prematurity is birth before 37 weeks", "Prematurity is birth before 40 weeks", "Premature infants have more iron stores", "Premature infants have mature respiratory systems"], "a": [0], "y": "Right: your slide defines prematurity as before 37 weeks. Why not 40: that is the normal length of pregnancy. Why not more iron: they have low iron and immunoglobulin stores. Why not mature lungs: respiratory and nervous systems are immature."}, {"ty": "num", "d": 3, "q": "A baby born at 35 weeks is 9 months old. What is the adjusted age in months? (40 weeks is term, 4 weeks = 1 month)", "ans": 7.75, "tol": 0, "unit": "months", "y": "5 weeks early is 1.25 months, so 9 - 1.25 = 7.75 months."}, {"ty": "mc", "d": 3, "q": "A nurse is plotting growth on a 6-month-old who was born 8 weeks early. Which is correct?", "o": ["Plot at 4 months", "Plot at 6 months", "Plot at 8 months", "Plot at 2 months"], "a": [0], "y": "Right: 8 weeks is 2 months, and 6 - 2 = 4. Why not 6: that ignores prematurity. Why not 8: that adds instead of subtracts. Why not 2: that treats the baby as the age of prematurity."}, {"ty": "mc", "d": 3, "q": "Which choice best describes the nurse's teaching when milestones lag in a premature baby by chronological age but match adjusted age?", "o": ["Expected, so give more time and reevaluate", "This signals cerebral palsy", "The infant needs immediate therapy", "Milestones should be ignored"], "a": [0], "y": "Right: your slide note says give more time and reevaluate. Why not cerebral palsy or therapy: neither follows from matching adjusted age. Why not ignoring them: milestones are still assessed, just against the adjusted age."}], "tod": [{"ty": "mc", "d": 2, "q": "Which finding shows a toddler is ready for toilet training?", "o": ["Stays dry for 3-4 hours at a time", "Wakes at night to urinate", "Sleeps 12 hours without waking", "Is 12 months old"], "a": [0], "y": "Right: staying dry 3-4 hours, using words such as peepee and poopoo, following family to the bathroom and showing interest are the readiness signs. Not night waking: not a readiness sign. Not 12 hours of sleep: unrelated. Not 12 months: too young, control comes later."}, {"ty": "mc", "d": 2, "q": "Which finding is expected in an 18-month-old?", "o": ["Stacks 3-4 cube blocks", "Stacks 6-7 cube blocks", "Turns book pages one at a time", "Walks up and down stairs with both feet on each step"], "a": [0], "y": "Right: 3-4 blocks at 18 months. Not 6-7 blocks: that is 2 years. Not page turning: 2 years. Not stairs with both feet per step: 2 years."}, {"ty": "mc", "d": 2, "q": "Which skill is expected at 2 years?", "o": ["Turns the pages of a book one at a time", "Draws a person with 5 or more parts", "Hops and skips", "Uses a spoon and cup well for the first time"], "a": [0], "y": "Right: page turning at 2 years. Not drawing a person with 5 parts: preschool. Not hopping and skipping: preschool. Not first use of a spoon and cup well: that is 18 months."}, {"ty": "mc", "d": 2, "q": "A 2-year-old plays beside another child with blocks and does not interact. What does the nurse document?", "o": ["Parallel play, which is expected for age", "Cooperative play, which is expected for age", "Social withdrawal needing referral", "Solitary play indicating delay"], "a": [0], "y": "Right: toddlers play next to each other, not with each other (parallel). Not cooperative: preschool and older. Not withdrawal or delay: this is normal."}, {"ty": "mc", "d": 2, "q": "A toddler shouts 'No! Me do it!' when a parent tries to help with a spoon. Which Erikson task is this?", "o": ["Autonomy versus shame and doubt", "Trust versus mistrust", "Initiative versus guilt", "Identity versus role confusion"], "a": [0], "y": "Right: toddlers want independence and do things themselves. Not trust vs mistrust: infant. Not initiative vs guilt: preschool. Not identity vs role confusion: adolescent."}, {"ty": "mc", "d": 2, "q": "A parent is upset that her 2-year-old says no to everything and insists on the same routine. What is the best response?", "o": ["Explain that negativism and ritualism are normal", "Explain that this suggests a behavior disorder", "Advise punishing every refusal right away", "Advise giving in to the child each time to keep peace"], "a": [0], "y": "Right: negativism and ritualism are expected parts of toddler growth under autonomy. Not a disorder: this is typical. Not punishing: harsh and unneeded. Not giving in each time: limits are still required."}, {"ty": "mc", "d": 2, "q": "A parent asks how long to use time-out for a 2-year-old. What is the best response?", "o": ["2 minutes", "10 minutes", "5 minutes", "Until the child apologizes"], "a": [0], "y": "Right: 1 minute per year of age gives 2 minutes. Longer times, or waiting for an apology, are beyond what a toddler can understand."}, {"ty": "mc", "d": 2, "q": "A parent asks when to turn the car seat of a 14-month-old to face forward. What is the best response?", "o": ["Keep it rear-facing as long as possible, in the back", "Face forward after the first birthday, in the back seat", "Face forward once the child can walk, in the back seat", "Face forward in the front seat with the air bag off"], "a": [0], "y": "Right: rear-facing as long as possible, front-facing later until 40-60 lb, always in the back seat. Not the first birthday or walking: not criteria. Not the front seat: the back seat is always used."}, {"ty": "sata", "d": 2, "q": "Which items are aspiration hazards for a toddler? Select all that apply.", "o": ["Grapes", "Hot dogs", "Coins", "Hard candy", "Small toy pieces", "Mashed banana", "Cooked pasta"], "a": [0, 1, 2, 3, 4], "y": "Right: grapes, hot dogs, coins, candy and small toy pieces are named on the slide. Wrong: mashed banana and soft cooked pasta are soft and unlikely to be inhaled."}, {"ty": "mc", "d": 2, "q": "Which statement by a parent of a 2-year-old shows understanding of nutrition?", "o": ["I offer finger foods and do not pressure him to eat", "I give dessert if he finishes his vegetables", "I give 20 oz of juice a day for fluids", "I give a cola every afternoon"], "a": [0], "y": "Right: no pressure, finger foods with food value. Not dessert as a reward: food is never a reward. Not 20 oz of juice: limit to 4-6 oz. Not a daily cola: avoid colas, especially with caffeine."}, {"ty": "mc", "d": 2, "q": "A toddler drinks 40 oz of milk daily and refuses meals. What is the priority teaching?", "o": ["Limit low-fat milk to 16-24 oz a day", "Increase milk to 48 oz a day", "Switch to juice between meals", "Give milk before meals to ensure intake"], "a": [0], "y": "Right: milk is capped at 16-24 oz a day so there is room for food. Not more milk: worsens the problem. Not juice: limit juice to 4-6 oz. Not milk before meals: fills the child up."}, {"ty": "mc", "d": 2, "q": "Which statement by a parent of a toddler requires further teaching?", "o": ["I leave my toddler in the tub while I answer the phone", "I keep the toilet lids closed", "I use gates at the top and bottom of stairs", "I keep firearms locked"], "a": [0], "y": "Right: toddlers are never left alone in a bathtub (drowning). The other statements are correct safety practices from the slide."}, {"ty": "mc", "d": 2, "q": "A toddler says 'Me go park.' Which term describes this speech?", "o": ["Telegraphic speech", "Echolalia", "Stuttering", "Lisping"], "a": [0], "y": "Right: telegraphic speech uses key words only. Echolalia repeats words just heard. Stuttering is a fluency problem. Lisping is a sound substitution."}, {"ty": "sata", "d": 2, "q": "Which behaviors are typical of a toddler? Select all that apply.", "o": ["Temper tantrums", "Reliance on a security item", "Separation anxiety that returns", "Resistance to invasive procedures", "Clear body boundaries", "Cooperative play with peers"], "a": [0, 1, 2, 3], "y": "Right: tantrums, a security item, returning separation anxiety and resisting procedures are all listed. Wrong: toddlers do not have clear body boundaries, and cooperative play comes later."}, {"ty": "mc", "d": 2, "q": "Which statement about toddler play is correct?", "o": ["Play is the major socializing medium", "Television is the best socializer", "Cooperative play is expected", "Toddlers share toys easily"], "a": [0], "y": "Right: play is how toddlers socialize. Not television: limit it. Not cooperative: parallel is expected. Not sharing: toddlers are egocentric and do not like to share."}, {"ty": "ngn", "d": 2, "scen": "A nurse performs a 15-month well-child visit. The parent says the child 'says no all the time and wants to feed himself.' The child walks alone, creeps up stairs and uses a cup well. The child does not wave or point and does not play with another child present.", "parts": [{"ty": "sata", "d": 2, "q": "Which findings are expected for age? Select all that apply.", "o": ["Says no often", "Wants to feed himself", "Walks without help", "Creeps up stairs", "Plays cooperatively with others", "Uses 3-word sentences"], "a": [0, 1, 2, 3], "y": "Right: autonomy (no, do it myself), walking alone and creeping up stairs fit 15 months. Wrong: cooperative play and 3-word sentences are later skills."}, {"ty": "mc", "d": 2, "q": "Which Erikson stage is the child working through?", "o": ["Autonomy versus shame and doubt", "Trust versus mistrust", "Initiative versus guilt", "Industry versus inferiority"], "a": [0], "y": "Right: wanting to do things alone and saying no show autonomy. The others are infant, preschool and school age."}], "y": ""}, {"ty": "mc", "d": 2, "q": "A 2-year-old uses a spoon and cup and stacks blocks. The nurse expects how many blocks?", "o": ["6-7 blocks", "3-4 blocks", "10 blocks", "1-2 blocks"], "a": [0], "y": "Right: 6-7 at 2 years. 3-4 is 18 months. Ten and 1-2 do not match either age."}, {"ty": "mc", "d": 2, "q": "A toddler has not had a stool for 4 days. What does the nurse suspect?", "o": ["Constipation", "Normal toddler variation", "Toilet training readiness", "Malabsorption only"], "a": [0], "y": "Right: stool about daily is expected, and over 3 days without one raises constipation concern. A couple of days is okay, but 4 is too long."}, {"ty": "mc", "d": 2, "q": "A toddler is in a safety seat. When can forward-facing begin?", "o": ["When rear-facing is no longer possible, up to 40-60 lb, always in the back seat", "At the first birthday", "When the toddler walks", "At 2 years in the front seat"], "a": [0], "y": "Right: stay rear-facing as long as possible, then forward-facing to 40-60 lb, in the back seat. Age 1 and walking are not criteria. The front seat is never used."}, {"ty": "mc", "d": 3, "q": "A mother says her 22-month-old drinks 40 oz of milk a day and eats few solids. Which teaching best addresses the cause?", "o": ["Limit low-fat milk to 16-24 oz a day", "Add more milk because toddlers need calcium", "Offer juice between meals to boost intake", "Serve milk after meals only and no solids at bedtime"], "a": [0], "y": "Right: too much milk fills a toddler and crowds out iron-rich food, so the cap is 16-24 oz. Why not more milk: it deepens the problem. Why not juice: juice is limited to 4-6 oz and also fills him up. Why not milk after meals and no bedtime solids: this misses the real problem, which is the volume of milk."}, {"ty": "mc", "d": 3, "q": "A toddler stacks 6 blocks, uses 2-3 word sentences like 'want juice please,' and walks up stairs with both feet on each step. What is the likely age?", "o": ["2 years", "15 months", "18 months", "3 years"], "a": [0], "y": "Right: 6-7 blocks and both feet on each step fit 2 years, and 2-3 word speech is the telegraphic stage. Why not 15 months: that child walks alone and has few words. Why not 18 months: that child stacks 3-4 blocks. Why not 3 years: a 3-year-old would be climbing alternating feet with sentences."}, {"ty": "mc", "d": 3, "q": "A mother of a 2-year-old says 'He says no to everything and wants the same cup every day. Should I be worried?' Which reply best uses Erikson?", "o": ["Expected autonomy, so offer limited choices", "This is a sign of shame and doubt, so refer him", "This shows initiative vs guilt, so discipline firmly", "This shows industry, so praise him"], "a": [0], "y": "Right: negativism and ritualism are part of autonomy vs shame and doubt, and choices give a sense of control. Why not shame and doubt: that outcome appears if independence is ridiculed or blocked. Why not initiative vs guilt: that is preschool. Why not industry: that is school age."}, {"ty": "mc", "d": 3, "q": "Which parent statement shows a need for teaching about a 2-year-old's safety?", "o": ["I can leave him in the tub to answer the door", "I use gates at the top and bottom of the stairs", "I keep my firearms locked", "I use a rear-facing seat in the back"], "a": [0], "y": "Right: toddlers can drown in seconds, so they are never left alone near water. Why not gates: correct on the slide. Why not locked firearms: correct. Why not rear-facing in the back seat: correct, since rear-facing is kept as long as possible and the back seat is always used."}, {"ty": "mc", "d": 3, "q": "Which snack would the nurse tell the parent of an 18-month-old to avoid?", "o": ["Whole grapes", "Mashed banana", "Soft cooked carrot pieces", "Cooked pasta"], "a": [0], "y": "Right: a whole grape is round and firm and can block the small airway. Why not mashed banana, soft carrots or pasta: soft foods that dissolve or squash are low risk."}, {"ty": "mc", "d": 3, "q": "A toddler in time-out screams for 8 minutes while the parent holds the clock. Which statement is the most accurate teaching?", "o": ["1 minute per year of age, so 2 minutes", "Time-out should last until the child apologizes", "Time-out should last 10 minutes at this age", "Time-out should be avoided in toddlers"], "a": [0], "y": "Right: the guide is 1 minute per year of age. Why not until he apologizes: a toddler does not understand it. Why not 10 minutes: too long for the attention span. Why not avoiding it: brief time-out is an accepted discipline tool."}, {"ty": "mc", "d": 3, "q": "A toddler shows readiness for toilet training. Which finding is the strongest sign?", "o": ["Stays dry for 3-4 hours at a time", "Wakes at night wet", "Is 12 months old", "Cries when the diaper is changed"], "a": [0], "y": "Right: dry periods of 3-4 hours show bladder control. Why not waking wet: it shows no control. Why not 12 months: the nerves are not mature enough. Why not crying at diaper changes: crying alone does not mean readiness."}, {"ty": "mc", "d": 3, "q": "A parent asks about juice for a 2-year-old. Which advice is most accurate?", "o": ["Limit juice to 4-6 oz a day", "Offer 16 oz so she stays hydrated", "Offer juice at bedtime in a bottle", "Avoid water because it has no calories"], "a": [0], "y": "Right: juice is limited to 4-6 oz a day. Why not 16 oz: it fills her and risks diarrhea and dental decay. Why not bedtime juice in a bottle: it harms teeth. Why not avoiding water: water is a good drink."}, {"ty": "sata", "d": 3, "q": "A toddler is at a well visit. Which findings are expected for age? Select all that apply.", "o": ["Temper tantrums", "Clinging to a blanket", "Plays beside other children", "Uses 2-3 word sentences", "Shares toys easily", "Plays cooperative games with rules", "Has a clear sense of body boundaries"], "a": [0, 1, 2, 3], "y": "Right: tantrums, a security item, parallel play and short sentences. Why not sharing easily: toddlers are egocentric. Why not cooperative games with rules: that is preschool or later. Why not clear body boundaries: toddlers have poor boundaries and resist invasive procedures."}, {"ty": "mc", "d": 3, "q": "A parent asks what is the best response to a toddler's tantrum in a store. Which choice supports the child's development?", "o": ["Stay calm, keep the child safe and avoid giving in", "Give the item so the tantrum stops", "Spank the child to show the limit", "Explain in detail why the item cannot be bought"], "a": [0], "y": "Right: calm and consistent limits teach the tantrum does not work. Why not giving in: it rewards the behavior. Why not spanking: harmful. Why not a long explanation: a toddler's language and attention are too limited."}], "pre": [{"ty": "mc", "d": 2, "q": "Which statement by a parent of a 4-year-old indicates understanding of nutrition?", "o": ["I offer two choices and never use food as a reward", "I let her choose anything from the pantry", "I make sure she finishes everything on the plate", "I give juice at every snack"], "a": [0], "y": "Right: this-or-that choices, no bribes, rewards or punishment with food. Not any choice: too many choices. Not finishing the plate: forcing food is discouraged. Not juice at every snack: 0 servings of sweetened beverages."}, {"ty": "mc", "d": 2, "q": "A 4-year-old says she can fly like a superhero and tries to jump off a step. Which concept does this show?", "o": ["Magical thinking typical of this age", "Animism", "Centration", "Object permanence"], "a": [0], "y": "Right: magical thinking is believing thoughts or wishes make the impossible happen. Animism is giving life to objects. Centration is focusing on one feature. Object permanence is an infant concept."}, {"ty": "mc", "d": 2, "q": "A 4-year-old says her teddy bear is sad and needs a hug because it is alive. Which term applies?", "o": ["Animism", "Magical thinking", "Centration", "Egocentrism"], "a": [0], "y": "Right: animism is believing objects are alive. Magical thinking is believing wishes make things happen. Centration is focusing on one part. Egocentrism is seeing only your own view."}, {"ty": "mc", "d": 2, "q": "A preschooler believes a tall thin glass holds more juice than a short wide glass of the same amount. Which concept explains this?", "o": ["Centration", "Animism", "Magical thinking", "Object permanence"], "a": [0], "y": "Right: centration is focusing on one feature (height) and ignoring the rest. Animism and magical thinking are about beliefs, not comparing amounts. Object permanence is an infant skill."}, {"ty": "mc", "d": 2, "q": "A 5-year-old builds a pretend store from cushions without permission and then feels bad when scolded. Which Erikson stage?", "o": ["Initiative versus guilt", "Autonomy versus shame and doubt", "Industry versus inferiority", "Trust versus mistrust"], "a": [0], "y": "Right: preschoolers take on adult activities, overstep limits and feel guilty. Autonomy is toddler. Industry is school age. Trust is infant."}, {"ty": "mc", "d": 2, "q": "A 4-year-old boy proudly says he will marry his mother. Which Freud stage is this?", "o": ["Phallic stage", "Anal stage", "Latency stage", "Genital stage"], "a": [0], "y": "Right: the phallic stage includes the Oedipal conflict. Anal is toddler. Latency is school age. Genital is adolescence."}, {"ty": "mc", "d": 2, "q": "A 5-year-old says he did not hit his brother because he would get in trouble. Which Kohlberg level is this?", "o": ["Pre-conventional", "Conventional", "Post-conventional", "Concrete operational"], "a": [0], "y": "Right: pre-conventional morality is based on punishment and obedience. Conventional follows society's rules. Post-conventional uses personal principles. Concrete operational is a Piaget stage, not Kohlberg."}, {"ty": "mc", "d": 2, "q": "A parent worries that a 4-year-old stutters when excited. What is the best response?", "o": ["Stuttering is normal at this age", "Refer for speech therapy now", "Correct the child every time", "Ask the child to stop and start over"], "a": [0], "y": "Right: stuttering is normal in preschoolers (and lisping is normal up to 5-6). Not an immediate referral: not needed. Not correcting or restarting: draws attention and can increase anxiety."}, {"ty": "mc", "d": 2, "q": "A child screams at night with the eyes open, does not respond to the parent and cannot recall it in the morning. What should the parent do?", "o": ["Stay near, keep the child safe and do not wake him", "Wake the child and ask about the dream", "Give water and discuss the dream the next morning", "Remove bedtime stories and nightlights from the room"], "a": [0], "y": "Right: this is a night terror, so the child is not awake; keep safe and wait. A child with a nightmare wakes and can tell you about it. Waking or questioning a child in a night terror does not help. Removing stories is not related."}, {"ty": "mc", "d": 2, "q": "Which parent statement requires more teaching?", "o": ["I let my 4-year-old watch 3 hours of shows each day", "I limit screen time to 1-2 hours a day", "I make sure she is active for 1 hour daily", "I keep a consistent bedtime routine"], "a": [0], "y": "Right: screen time should be 1-2 hours. The other statements match preschool guidance (1 hour of activity, consistent sleep routine)."}, {"ty": "sata", "d": 2, "q": "Which skills are expected at age 5? Select all that apply.", "o": ["Draws a person with 5 or more parts", "Hops, skips and dances", "Dresses independently", "Uses verbs and plurals correctly", "Plays only alone", "Cannot follow rules of simple games"], "a": [0, 1, 2, 3], "y": "Right: the slide lists drawing a person with 5+ parts, hopping and skipping, dressing alone and using verbs and plurals. Wrong: play with simple rules is expected, so these two describe delay."}, {"ty": "sata", "d": 2, "q": "Which findings in a 5-year-old suggest developmental delay? Select all that apply.", "o": ["Cannot dress or toilet without help", "Is unusually withdrawn", "Does not show a variety of emotions", "Lisps on some sounds", "Has pretend play", "Stutters when excited"], "a": [0, 1, 2], "y": "Right: inability to complete self-care, unusual withdrawal and flat emotions are listed warning signs. Wrong: lisping, pretend play and occasional stuttering are normal at this age."}, {"ty": "mc", "d": 2, "q": "A 3-year-old falls often, drools and has unclear speech. What does the nurse suspect?", "o": ["Possible developmental delay needing evaluation", "Normal 3-year-old development with some clumsiness", "Magical thinking", "A delay in parallel play with peers"], "a": [0], "y": "Right: frequent falls, drooling and unclear speech at 3 are listed concerns. Not normal: those are flagged signs. Magical thinking and parallel play are not delays."}, {"ty": "mc", "d": 2, "q": "A parent says a 5-year-old uses a lap belt only in the back seat. What is the best response?", "o": ["Use a booster until 145 cm or age 8-12", "A lap belt is fine at age 5 in the back", "Move to the front seat at 5", "Use a booster only until age 6"], "a": [0], "y": "Right: restraint is recommended until 145 cm or 8-12 years. Not lap belt: a belt alone does not fit a 5-year-old. Not the front seat: children ride in the back. Not until 6: ends too early."}, {"ty": "mc", "d": 2, "q": "A child who does not drink milk needs a calcium source. Which food does the nurse suggest?", "o": ["White beans", "White rice", "Chicken breast", "Apples"], "a": [0], "y": "Right: white beans are high in calcium (your note). The other foods are not significant calcium sources."}, {"ty": "mc", "d": 2, "q": "A nurse observes a 4-year-old with the belly rising with each breath, normal color and no distress. How should the nurse interpret this?", "o": ["Expected diaphragmatic breathing", "Retractions showing respiratory distress", "Grunting showing respiratory distress", "Nasal flaring showing respiratory distress"], "a": [0], "y": "Right: preschoolers often breathe with the diaphragm. Retractions, grunting and nasal flaring are signs of respiratory distress and are not described."}, {"ty": "mc", "d": 2, "q": "A parent offers a 4-year-old a choice of 6 snacks and she refuses all. What is the best advice?", "o": ["Offer no more than 2 choices", "Offer more choices", "Skip snacks for the day", "Offer dessert after a bite"], "a": [0], "y": "Right: no more than 2 choices. More choices overwhelm her. Skipping snacks and bribing with dessert both misuse food."}, {"ty": "mc", "d": 2, "q": "A parent says a 5-year-old still stutters occasionally. When is a speech therapy referral needed?", "o": ["If stuttering persists past 5-6 years", "Now, at any stutter", "Only if the child is embarrassed", "Never, it always resolves"], "a": [0], "y": "Right: stuttering is normal until about 5-6, and persistence beyond that gets a referral. Referring now is premature. Embarrassment alone is not the criterion. It does not always resolve."}, {"ty": "mc", "d": 3, "q": "A 4-year-old wakes screaming, eyes open, does not recognize the parent and cannot be comforted. In the morning he remembers nothing. What does the nurse advise?", "o": ["Stay close and keep him safe", "Wake him and ask about the dream", "Tell him it was only a dream and give water", "Give a sedative at bedtime"], "a": [0], "y": "Right: this is a night terror, a partial arousal from deep sleep, so waking or questioning does not help. Why not asking about the dream: he cannot recall. Why not reassurance with water: he is not awake to hear. Why not a sedative: not appropriate for this."}, {"ty": "mc", "d": 3, "q": "A 4-year-old tells the nurse, 'I can fly like Superman.' He is about to jump off the playground slide. Which concept explains this?", "o": ["Magical thinking", "Animism", "Centration", "Egocentric speech"], "a": [0], "y": "Right: preschoolers believe wishes make the impossible happen, which is why supervision around heights is needed. Why not animism: that is giving life to objects. Why not centration: focusing on one feature. Why not egocentric speech: not the issue here."}, {"ty": "mc", "d": 3, "q": "A 4-year-old says his stuffed lion is sad because it is lonely. Which term applies?", "o": ["Animism", "Magical thinking", "Centration", "Conservation"], "a": [0], "y": "Right: animism is giving life to objects. Why not magical thinking: that is believing wishes cause events. Why not centration: that is focusing on a single feature. Why not conservation: a concrete operational skill."}, {"ty": "mc", "d": 3, "q": "A preschooler sees two glasses with the same amount of juice and says the tall thin one has more. Which concept explains this?", "o": ["Centration", "Animism", "Magical thinking", "Industry"], "a": [0], "y": "Right: centration is focusing on one feature, height, and ignoring width. Why not animism or magical thinking: they involve beliefs about objects and wishes. Why not industry: that is an Erikson stage."}, {"ty": "mc", "d": 3, "q": "A parent asks about a 4-year-old's stutter when excited. When is a speech referral appropriate?", "o": ["If it continues past 5-6 years", "Right now, since any stutter needs therapy", "Never, it always resolves", "Only if he is embarrassed"], "a": [0], "y": "Right: stuttering is expected until about 5-6, and persistence beyond that gets a referral. Why not now: it is normal for the age. Why not never: persistent stuttering warrants evaluation. Why not embarrassment alone: it is not the criterion."}, {"ty": "mc", "d": 3, "q": "Which snack choice by a parent shows good understanding of preschool nutrition?", "o": ["Offering two healthy choices at snack time", "Offering dessert after the child finishes the vegetables", "Making the child finish the plate", "Offering a different meal if he refuses"], "a": [0], "y": "Right: two choices give control without overload. Why not dessert for finishing: it turns food into a reward. Why not finishing the plate: forced eating is discouraged. Why not a different meal: it teaches that refusal gets a preferred food."}, {"ty": "mc", "d": 3, "q": "A 5-year-old weighs 18 kg and is 43 inches tall. Which statement is correct?", "o": ["Near the 5-year average (18.5 kg, 43.5 in)", "He is above average for 5 years", "He is at the 3-year average", "He is below the average for 4 years"], "a": [0], "y": "Right: the slide gives 5 years as about 18.5 kg and 43.5 in. Why not above average: he is slightly below. Why not the 3-year average: that is 14.5 kg and 37.5 in. Why not below the 4-year average: 4 years is about 16.5 kg and 40.5 in."}, {"ty": "sata", "d": 3, "q": "A nurse is teaching about a 5-year-old's development. Which findings suggest a delay? Select all that apply.", "o": ["Cannot dress or toilet without help", "Unusually withdrawn", "Shows only a narrow range of emotions", "Stutters when excited", "Pretends to run a store", "Hops on one foot"], "a": [0, 1, 2], "y": "Right: dependence for self-care, withdrawal and flat emotions are listed warning signs. Why not the stutter: normal. Why not pretend play: expected. Why not hopping: expected."}, {"ty": "mc", "d": 3, "q": "A mother says her 4-year-old, 38 inches tall, was just moved to a booster seat. Which comment shows correct understanding?", "o": ["Booster until 145 cm (4 ft 9 in) or age 8-12", "He can use only a lap belt now", "He can ride in the front if the air bag is off", "He can stop using the booster at 6"], "a": [0], "y": "Right: restraint use continues until 145 cm or age 8-12. Why not lap belt: it does not fit a small child. Why not front seat: children ride in the back. Why not 6: too early."}, {"ty": "mc", "d": 3, "q": "A nurse is giving an injection to a 4-year-old. Which approach fits preschool development best?", "o": ["Use distraction and show a toy first", "Explain how the vaccine builds immunity", "Tell him it will not hurt", "Hold him down so it is over quickly"], "a": [0], "y": "Right: preschoolers learn through play and fear body harm. Why not explaining immunity: beyond his understanding. Why not 'it will not hurt': dishonest and damages trust. Why not holding him down: increases fear."}], "sch": [{"ty": "mc", "d": 2, "q": "How many mg of calcium does a 10-year-old need each day?", "o": ["1,300 mg", "800 mg", "1,000 mg", "1,600 mg"], "a": [0], "y": "Right: 9-12 years needs 1,300 mg. 800-1,000 mg is the 4-8 year range. 1,600 is a calorie figure, not calcium."}, {"ty": "sata", "d": 2, "q": "Which statements about the school-age diet are correct? Select all that apply.", "o": ["Eat 3 meals and 2 snacks", "9-12 year olds need 1,300 mg of calcium", "45-65% of calories come from carbohydrates", "9-12 year olds need 10 mg of iron", "40-50% of calories should come from protein"], "a": [0, 1, 2], "y": "Right: 3 meals and 2 snacks, calcium 1,300 mg and carbs 45-65%. Wrong: iron is 10 mg at 4-8 years and 8 mg at 9-12. Protein is 10-30% of calories."}, {"ty": "mc", "d": 2, "q": "A 9-year-old signs up for the school play and works hard to master reading. Which Erikson stage?", "o": ["Industry versus inferiority", "Initiative versus guilt", "Identity versus role confusion", "Autonomy versus shame and doubt"], "a": [0], "y": "Right: school-age children gain confidence from accomplishing tasks. Initiative is preschool. Identity is adolescent. Autonomy is toddler."}, {"ty": "mc", "d": 2, "q": "A 9-year-old sorts coins by size and understands right and left. Which Piaget stage?", "o": ["Concrete operational", "Preoperational", "Formal operational", "Sensorimotor"], "a": [0], "y": "Right: concrete operational (7-11) solves concrete problems, understands size relationships and right and left. Preoperational is preschool, formal is adolescence, sensorimotor is birth to 2."}, {"ty": "mc", "d": 2, "q": "Which Freud stage has sexual needs quiet while children put energy into schoolwork and clubs?", "o": ["Latency", "Phallic", "Genital", "Anal"], "a": [0], "y": "Right: latency. Phallic is preschool, genital is adolescence, anal is toddler."}, {"ty": "mc", "d": 2, "q": "A 10-year-old says rules must be followed because it is the law. Which Kohlberg level?", "o": ["Conventional (law and order)", "Pre-conventional", "Post-conventional", "Preoperational"], "a": [0], "y": "Right: conventional morality follows society's rules and law and order. Pre-conventional is punishment and obedience. Post-conventional uses universal principles. Preoperational is a Piaget stage."}, {"ty": "mc", "d": 2, "q": "A teacher reports that a 7-year-old squints at the board. What is the nurse's action?", "o": ["Refer for a vision exam", "Move the child to the back of the class", "Reassure that it will resolve", "Recommend more reading time"], "a": [0], "y": "Right: squinting suggests visual impairment, which can appear at this age. Not the back row: makes it worse. Not reassurance: ignores a real sign. Not more reading: could add strain."}, {"ty": "mc", "d": 2, "q": "A mother asks when puberty begins for her 9-year-old daughter. What is the best response?", "o": ["Pre-puberty can begin around age 9 in girls", "Not until age 14 for any child", "Only after the first menstrual period", "Girls and boys always begin at the same time"], "a": [0], "y": "Right: pre-puberty starts around 9 in girls. Not 14 or after menarche: later than expected. Not the same time: girls start earlier and boys show minimal visible maturation in preadolescence."}, {"ty": "mc", "d": 2, "q": "What is the average age of menarche?", "o": ["12.5 years", "10 years", "14 years", "9 years"], "a": [0], "y": "Right: average 12.5 years. The others are not the average (9 and 10 are early, 14 is late)."}, {"ty": "mc", "d": 2, "q": "A parent says the 8-year-old plays video games 4 hours a day. What is the best teaching?", "o": ["Limit video games and television to 2 hours", "Allow 4 hours a day if homework is done", "Allow unlimited play on weekends and holidays", "Remove all media from the home permanently"], "a": [0], "y": "Right: limit to 2 hours and monitor content. Not 4 hours or unlimited: too long. Not all media: unrealistic and unnecessary."}, {"ty": "mc", "d": 2, "q": "Which has the greatest impact on social interaction in school-age children?", "o": ["Continuous peer relationships", "Television and other media", "Birth order in the family", "Feedback from the teacher"], "a": [0], "y": "Right: your note says continuous peer relationships have the most impact. The others are weaker influences."}, {"ty": "mc", "d": 2, "q": "At what time of day do most accidents occur in school-age children?", "o": ["3-6 pm", "6-9 am", "9 pm-12 am", "12-3 pm"], "a": [0], "y": "Right: 3-6 pm (after school). 9 pm-12 am is the adolescent peak."}, {"ty": "sata", "d": 2, "q": "Which are developmental concerns of the school-age child? Select all that apply.", "o": ["School refusal", "Latchkey safety", "Bullying as victim or perpetrator", "Tobacco and alcohol education", "Telegraphic speech", "Toilet training"], "a": [0, 1, 2, 3], "y": "Right: the slide lists these four. Wrong: telegraphic speech and toilet training are toddler issues."}, {"ty": "mc", "d": 2, "q": "A 7-year-old has stomachaches every school morning but is well on weekends. Which concern does this suggest?", "o": ["School refusal (school phobia)", "Latchkey child safety", "Pre-puberty", "Peer pressure"], "a": [0], "y": "Right: symptoms on school days only point to school refusal. Latchkey is about being home alone. Pre-puberty and peer pressure do not explain weekday-only symptoms."}, {"ty": "mc", "d": 2, "q": "Which immunizations are due at 11-12 years?", "o": ["Tdap, HPV, MCV4", "DTaP, MMR, VAR", "Hep A, Hib, PCV", "RV, IPV, Hep B"], "a": [0], "y": "Right: Tdap, HPV and MCV4. DTaP, MMR and VAR are 4-5 years. Hep A, Hib and PCV and RV, IPV, Hep B are infant and toddler vaccines."}, {"ty": "mc", "d": 2, "q": "A teacher says a 7-year-old squints at the board. Which concern does the nurse have?", "o": ["Visual impairment", "Normal reading effort", "Pre-puberty", "Peer pressure"], "a": [0], "y": "Right: squinting in class suggests visual impairment, which can first show at this age. Reading effort does not explain squinting. The others are unrelated."}, {"ty": "mc", "d": 2, "q": "A 13-year-old starts the HPV series. How many doses does she need?", "o": ["2 doses, 6-12 months apart", "3 doses at 0, 1-2 and 6 months", "1 dose", "4 doses 1 month apart"], "a": [0], "y": "Right: a series started before age 15 needs 2 doses 6-12 months apart. Three doses (0, 1-2, 6 months) are for those starting at 15 or older. One dose or four doses is not the schedule."}, {"ty": "mc", "d": 2, "q": "A mother says her 12-year-old trusts friends more than parents. What is expected?", "o": ["Peer influence is stronger than parental influence in middle school", "A sign of a behavior disorder", "Parents should forbid friendships", "Peer groups matter only in adolescence"], "a": [0], "y": "Right: in middle school, peers become more influential than parents. It is not a disorder. Forbidding friends is not helpful. Peer influence starts in school age."}, {"ty": "mc", "d": 3, "q": "A 7-year-old's teacher reports she squints to read the board and holds books close. What does the nurse do first?", "o": ["Refer for a vision exam", "Move her to the back of the class", "Recommend limiting reading", "Reassure the parent it is normal"], "a": [0], "y": "Right: visual impairment can show at school age. Why not the back: it worsens the view. Why not limiting reading: it avoids the problem. Why not reassurance: it ignores a real sign."}, {"ty": "mc", "d": 3, "q": "A 6-year-old needs calcium. Which daily amount matches your slide?", "o": ["800-1,000 mg", "500 mg", "1,300 mg", "1,600 mg"], "a": [0], "y": "Right: 4-8 years is 800-1,000 mg. Why not 500: too low. Why not 1,300: that is 9-12 years. Why not 1,600: more than needed."}, {"ty": "mc", "d": 3, "q": "An 11-year-old needs calcium. Which daily amount matches your slide?", "o": ["1,300 mg", "800 mg", "1,000 mg", "2,000 mg"], "a": [0], "y": "Right: 9-12 years needs 1,300 mg. Why not 800-1,000: those are for 4-8. Why not 2,000: more than the recommendation."}, {"ty": "mc", "d": 3, "q": "A 10-year-old gets headaches and stomachaches every school morning but is well on weekends. What is the nurse's best action?", "o": ["Ask about school stressors and anxiety", "Order tests for appendicitis", "Tell the parents to keep him home for a week", "Recommend a new diet"], "a": [0], "y": "Right: symptoms limited to school days suggest school refusal, so explore stressors. Why not appendicitis testing: symptoms stop on weekends. Why not a week at home: reinforces avoidance. Why not a new diet: unrelated."}, {"ty": "mc", "d": 3, "q": "A mother says her 13-year-old son is now more influenced by friends than by her. Which response is best?", "o": ["Expected, since peers matter more in middle school", "A conduct problem needing referral", "A sign of poor parenting at home", "Seen only in late adolescence"], "a": [0], "y": "Right: peers become more influential than parents in middle school. Why not conduct problem: it is typical. Why not a failure: not true. Why not only in adolescence: it starts earlier."}, {"ty": "mc", "d": 3, "q": "A 9-year-old signs up for the school play, practices daily and feels proud after the show. Which statement is accurate?", "o": ["Mastering industry vs inferiority", "She is mastering initiative vs guilt", "She is showing identity vs role confusion", "She is in Freud's phallic stage"], "a": [0], "y": "Right: completing tasks builds industry at school age. Why not initiative vs guilt: preschool. Why not identity: adolescence. Why not phallic: Freud's preschool stage; school age is latency."}, {"ty": "mc", "d": 3, "q": "A mother is worried because her 11-year-old stays home alone after school. What is the most appropriate response?", "o": ["Teach a safety plan with locked doors", "Nothing, since 11 is old enough", "Ask her to stop working", "Allow friends over without telling anyone"], "a": [0], "y": "Right: latchkey children need a safety plan. Why not nothing: ignores the risk. Why not stopping work: unrealistic. Why not friends unannounced: adds risk."}, {"ty": "mc", "d": 3, "q": "Which vaccines are due at 11-12 years?", "o": ["Tdap, HPV and MCV4", "DTaP, MMR and VAR", "Hep A, Hib and PCV", "IPV, RV and Hep B"], "a": [0], "y": "Right: Tdap, HPV and MCV4. Why not DTaP, MMR, VAR: 4-5 years. Why not Hep A, Hib, PCV: toddler vaccines. Why not IPV, RV, Hep B: infant vaccines."}, {"ty": "mc", "d": 3, "q": "A 12-year-old girl is starting her series for the first time. How many HPV doses does she need?", "o": ["2 doses, 6-12 months apart", "3 doses at 0, 1-2 and 6 months", "1 dose", "4 doses"], "a": [0], "y": "Right: starting before 15 needs 2 doses 6-12 months apart. Why not 3 doses: that is for starting at 15 or older. Why not 1: not the schedule. Why not 4: not the schedule."}, {"ty": "sata", "d": 3, "q": "Which statements about a school-age child's development are correct? Select all that apply.", "o": ["Continuous peer relationships have the most impact on social interaction", "Video games and television should be limited to 2 hours", "Same-sex peer groups and best friends are common", "Calcium needs rise to 1,300 mg at 9-12 years", "Menarche averages 9 years", "Identity vs role confusion is the task"], "a": [0, 1, 2, 3], "y": "Right: the first four come from your slides. Why not menarche at 9: the average is 12.5, with pre-puberty beginning around 9. Why not identity vs role confusion: that is adolescence; the task here is industry."}], "ado": [{"ty": "mc", "d": 2, "q": "A 15-year-old asks the nurse, 'Who am I, really?' Which Erikson stage?", "o": ["Identity versus role confusion", "Industry versus inferiority", "Initiative versus guilt", "Autonomy versus shame and doubt"], "a": [0], "y": "Right: adolescents try different roles to form identity. The others are school age, preschool and toddler."}, {"ty": "mc", "d": 2, "q": "A 15-year-old debates hypothetical careers and thinks about the future. Which Piaget stage?", "o": ["Formal operational", "Concrete operational", "Preoperational", "Sensorimotor"], "a": [0], "y": "Right: formal operational uses deductive reasoning and futuristic idealistic thinking. Concrete is school age, preoperational is preschool, sensorimotor is infancy."}, {"ty": "mc", "d": 2, "q": "A 17-year-old refuses to follow a law he believes violates universal principles of justice. Which Kohlberg level?", "o": ["Post-conventional", "Conventional", "Pre-conventional", "Formal operational"], "a": [0], "y": "Right: post-conventional morality goes beyond a specific group to universal ethical principles. Conventional follows society's laws. Pre-conventional is about punishment. Formal operational is a Piaget stage."}, {"ty": "mc", "d": 2, "q": "According to the Tanner order on your slide, which change appears first in girls?", "o": ["Breast development", "Pubic hair", "Axillary hair", "Menstruation"], "a": [0], "y": "Right: the order is breast development, pubic hair, axillary hair, menstruation."}, {"ty": "ord", "d": 2, "q": "Place the female Tanner changes in the order they appear.", "items": ["Breast development", "Pubic hair", "Axillary hair", "Menstruation"], "y": "Breast, pubic hair, axillary hair, menstruation."}, {"ty": "ord", "d": 2, "q": "Place the male changes in the order on your slide.", "items": ["Testicular enlargement", "Pubic hair", "Penile enlargement", "Axillary hair", "Facial hair", "Vocal changes"], "y": "Testes, pubic hair, penis, axillary hair, facial hair, vocal changes."}, {"ty": "mc", "d": 2, "q": "A girl had menarche at 12. When does the nurse expect her growth in height to stop?", "o": ["About 2-2.5 years after menarche", "At menarche", "At 18-20 years", "One year after menarche"], "a": [0], "y": "Right: girls stop growing 2-2.5 years after menarche. Boys, not girls, stop at 18-20. Growth does not stop at menarche or after only one year."}, {"ty": "sata", "d": 2, "q": "Which nutrients does an adolescent need more of? Select all that apply.", "o": ["Iron", "Calcium", "Zinc", "Folic acid", "Vitamin B6", "Sodium", "Saturated fat"], "a": [0, 1, 2, 3, 4], "y": "Right: the slide lists extra iron, protein, calcium, zinc, folic acid, vitamin A and B6. Wrong: sodium and saturated fat are not nutrients to increase."}, {"ty": "sata", "d": 2, "q": "Which are suicide risk factors in an adolescent? Select all that apply.", "o": ["Depression", "Family history of a suicide attempt", "Social isolation", "Substance abuse", "Poor school performance", "Active on a sports team", "Close group of friends"], "a": [0, 1, 2, 3, 4], "y": "Right: all five are on the slide risk list. Wrong: sports participation and close friends are protective."}, {"ty": "mc", "d": 2, "q": "Which finding in a 16-year-old is the priority to report?", "o": ["Giving away prized possessions", "Wanting more time with friends", "Mood swings after a test", "Asking for privacy during the exam"], "a": [0], "y": "Right: giving away valued possessions is a marked change in behavior and a suicide warning sign. The other findings are common in adolescence."}, {"ty": "mc", "d": 2, "q": "At what time do most accidents occur in adolescents?", "o": ["9 pm to 12 am", "3 pm to 6 pm", "6 am to 9 am", "12 pm to 3 pm"], "a": [0], "y": "Right: 9 pm-12 am. 3-6 pm is the school-age peak."}, {"ty": "mc", "d": 2, "q": "Which statement describes adolescent self-concept?", "o": ["Views self as invincible and takes risks", "Has a fully formed body image by age 6", "Has little concern about peers", "Mood is steady and predictable"], "a": [0], "y": "Right: invincibility drives risky behavior, and mood swings are common. The other statements contradict the slide."}, {"ty": "mc", "d": 2, "q": "Which statement about adolescent body image is accurate?", "o": ["The image formed now is kept for life", "It is fully formed by about age 6", "It changes completely at about age 25", "It is unrelated to what peers think"], "a": [0], "y": "Right: image established in adolescence is retained for life, and teens compare themselves to peers. The other options are not supported."}, {"ty": "mc", "d": 2, "q": "Which nursing concerns are a priority when caring for a 15-year-old?", "o": ["Self-image, privacy and peers", "Parallel play and toilet training", "Separation anxiety and tantrums", "Magical thinking and animism"], "a": [0], "y": "Right: these are the nursing concerns on the slide. The other pairs belong to toddlers and preschoolers."}, {"ty": "mc", "d": 2, "q": "Which conditions is an adolescent at risk for due to poor eating habits?", "o": ["Obesity, bulimia and anorexia nervosa", "Rickets and marasmus in the older child", "Night terrors and sleepwalking", "Enuresis and school refusal"], "a": [0], "y": "Right: the slide lists obesity and under-eating (bulimia, anorexia nervosa). The others are not the listed nutrition risks."}, {"ty": "mc", "d": 2, "q": "A 16-year-old says, 'I do not know what I want to be.' Which Erikson stage is this?", "o": ["Identity vs role confusion", "Industry vs inferiority", "Initiative vs guilt", "Trust vs mistrust"], "a": [0], "y": "Right: adolescents form sexual, political and career identity. The others are earlier stages."}, {"ty": "mc", "d": 2, "q": "A teen needs more iron. Which food does the nurse suggest?", "o": ["Peanut butter", "White rice", "Apple juice", "Plain pasta"], "a": [0], "y": "Right: peanut butter, eggs, leafy greens and meat are your slide's iron foods. The others are not good iron sources."}, {"ty": "mc", "d": 3, "q": "A 15-year-old girl says her friends call her fat and she has started skipping meals. What is the priority?", "o": ["Assess for disordered eating", "Praise her discipline", "Recommend a diet plan", "Refer to a gym"], "a": [0], "y": "Right: skipped meals and body image distress raise risk for anorexia or bulimia. Why not praise: it reinforces the behavior. Why not a diet plan: harmful. Why not a gym: does not address the concern."}, {"ty": "mc", "d": 3, "q": "A 16-year-old with a drop in grades and social isolation gives away his favorite guitar. What is the most important action?", "o": ["Ask directly about suicide and report it", "Suggest he study and sleep more", "Wait and see if it passes", "Tell him the guitar can be replaced"], "a": [0], "y": "Right: giving away prized possessions is a marked behavior change and a warning sign. Why not studying or sleep: they miss the risk. Why not waiting: delays care."}, {"ty": "mc", "d": 3, "q": "A 17-year-old asks, 'Who am I really and what do I want?' Which statement is accurate?", "o": ["He is working through identity vs role confusion", "He is working through industry vs inferiority", "He has an emotional disorder", "He should stop questioning"], "a": [0], "y": "Right: adolescents explore sexual, political and career identity. Why not industry: school age. Why not a disorder: questioning is typical. Why not stopping: exploring is needed."}, {"ty": "mc", "d": 3, "q": "A mother says her 14-year-old is 'always on edge' and shows risky behavior. Which explanation is best?", "o": ["Teens feel invincible and take risks", "This shows a failure of toilet training", "This is magical thinking, as in preschool", "This is a sign of a delay"], "a": [0], "y": "Right: invincibility drives risk taking in adolescence. Why not toilet training: unrelated. Why not magical thinking: it is a preschool thought pattern. Why not delay: it is typical."}, {"ty": "mc", "d": 3, "q": "A girl started her period at 12. About when will her growth in height stop?", "o": ["About 2-2.5 years later", "At the first period", "At 18-20 years", "Within 6 months"], "a": [0], "y": "Right: girls stop growing 2-2.5 years after menarche. Why not at the first period: growth continues. Why not 18-20: that is boys. Why not 6 months: too soon."}, {"ty": "ord", "d": 3, "q": "Place the Tanner changes in girls in the order they occur.", "items": ["Breast development", "Pubic hair", "Axillary hair", "Menstruation"], "y": "Breast development first, then pubic hair, then axillary hair, then menstruation."}, {"ty": "mc", "d": 3, "q": "Which food is a good iron source for a teen?", "o": ["Peanut butter", "Apple juice", "White rice", "Plain pasta"], "a": [0], "y": "Right: meat, eggs, leafy greens and peanut butter are iron foods on your slide. Why not apple juice, white rice or pasta: low in iron."}, {"ty": "mc", "d": 3, "q": "Which time of day has the most accidents in adolescents?", "o": ["Late evening, 9 pm to midnight", "Mid-afternoon, 3 pm to 6 pm", "Early morning, 6 am to 9 am", "Midday around noon lunch"], "a": [0], "y": "Right: late evening. Why not 3-6 pm: that is the school-age peak. Why not morning or noon: not the peaks."}, {"ty": "sata", "d": 3, "q": "Which factors raise suicide risk in an adolescent? Select all that apply.", "o": ["Depression", "Social isolation", "Substance abuse", "Poor school performance", "Strong peer support", "Close family communication"], "a": [0, 1, 2, 3], "y": "Right: the first four are on your slide. Why not strong support or close communication: they protect."}, {"ty": "mc", "d": 3, "q": "Which vaccine is a catch-up at 18 years for a teen who is behind?", "o": ["MMR, Tdap, MCV and annual flu", "Hib, PCV and the rotavirus series", "Hep A, 2 doses 6 months apart", "DTaP and IPV for toddlers"], "a": [0], "y": "Right: catch-up MMR, Tdap, meningococcal and flu. Why not Hib and PCV: infant vaccines. Why not rotavirus: infant and oral. Why not Hep A at 12 months: a toddler schedule."}], "imm": [{"ty": "mc", "d": 2, "q": "Which vaccine is given at birth?", "o": ["Hep B", "Hep A", "DTaP", "Hib"], "a": [0], "y": "Right: Hep B at birth. Hep A is 12-23 months. DTaP and Hib start at 2 months."}, {"ty": "mc", "d": 2, "q": "Which vaccines are due at the 2-month visit on your slide?", "o": ["DTaP, RV, IPV, Hib, PCV, Hep B", "DTaP, MMR, VAR", "Tdap, HPV, MCV4", "DTaP, Hib, PCV, IPV, MMR"], "a": [0], "y": "Right: those six. DTaP, MMR, VAR is the 4-5 year set. Tdap, HPV, MCV4 is 11-12 years. The last choice is the 15-18 month set."}, {"ty": "mc", "d": 2, "q": "Which vaccines are due at 15-18 months?", "o": ["DTaP, Hib, PCV, IPV, MMR", "DTaP, RV, IPV, PCV", "Tdap, HPV, MCV4", "DTaP, MMR, VAR, IPV"], "a": [0], "y": "Right: DTaP, Hib, PCV, IPV and MMR. The second is the 4 month list. The third is 11-12 years. The fourth is 4-5 years."}, {"ty": "mc", "d": 2, "q": "A toddler receives the first Hep A dose. When is the second dose given?", "o": ["6 months later", "1 month later", "12 months later", "At age 4"], "a": [0], "y": "Right: 2 doses 6 months apart. The other intervals do not match the slide."}, {"ty": "mc", "d": 2, "q": "Which vaccines are due at 4-5 years?", "o": ["DTaP, MMR, VAR, IPV", "Tdap, HPV, MCV4", "Hep A, Hib, PCV", "RV, IPV, Hep B"], "a": [0], "y": "Right: DTaP, MMR, VAR, IPV. Tdap, HPV, MCV4 is 11-12 years. The others are infant and toddler vaccines."}, {"ty": "mc", "d": 2, "q": "Which vaccine is given by mouth?", "o": ["Rotavirus", "IPV", "Hib", "Hep B"], "a": [0], "y": "Right: rotavirus (RV) is oral. IPV, Hib and Hep B are injections."}, {"ty": "sata", "d": 2, "q": "Which are live vaccines? Select all that apply.", "o": ["MMR", "Varicella", "Rotavirus", "IPV", "Hep B", "Tdap", "HPV"], "a": [0, 1, 2], "y": "Right: MMR, varicella and rotavirus are live. Wrong: IPV, Hep B, Tdap and HPV are inactivated or recombinant."}, {"ty": "mc", "d": 2, "q": "Gardasil 9 is the brand name for which vaccine?", "o": ["HPV", "MCV4", "Tdap", "Hep A"], "a": [0], "y": "Right: Gardasil 9 is HPV. Menactra, Menveo and MenQuadfi are MCV4. Boostrix and Adacel are Tdap. Havrix and Vaqta are Hep A."}, {"ty": "mc", "d": 2, "q": "Which is a brand of the MCV4 vaccine?", "o": ["Menactra", "Gardasil 9", "Varivax", "Boostrix"], "a": [0], "y": "Right: Menactra (also Menveo, MenQuadfi) is MCV4. Gardasil is HPV, Varivax is varicella, Boostrix is Tdap."}, {"ty": "mc", "d": 2, "q": "Boostrix and Adacel are brands of which vaccine?", "o": ["Tdap", "DTaP", "MMR", "IPV"], "a": [0], "y": "Right: Tdap (age 7 and older). DTaP brands are Daptacel and Infanrix. MMR brands are M-M-R II and Priorix."}, {"ty": "mc", "d": 2, "q": "At what age does seasonal flu vaccine begin on your slide?", "o": ["6 months", "Birth", "12 months", "4 years"], "a": [0], "y": "Right: seasonal flu vaccine starts at 6-12 months and is given yearly. Not birth or 12 months: not the start. Not 4 years: too late."}, {"ty": "mc", "d": 2, "q": "Which injection protects against measles, mumps and rubella?", "o": ["MMR", "VAR", "IPV", "Tdap"], "a": [0], "y": "Right: MMR. VAR is chickenpox. IPV is polio. Tdap is tetanus, diphtheria and pertussis."}, {"ty": "mat", "d": 2, "q": "Match each brand to the vaccine.", "pairs": [["Varivax", "Varicella"], ["RotaTeq", "Rotavirus"], ["Gardasil 9", "HPV"], ["Havrix", "Hep A"]], "y": "Varivax is varicella. RotaTeq is rotavirus. Gardasil 9 is HPV. Havrix is Hep A."}, {"ty": "ord", "d": 2, "q": "Place these immunization points in order from earliest to latest.", "items": ["Hep B at birth", "DTaP, RV, IPV, Hib, PCV, Hep B", "Hep A series begins", "DTaP, MMR, VAR, IPV", "Tdap, HPV, MCV4"], "y": "Hep B at birth, the 2-month set, Hep A at 12-23 months, the 4-5 year set, then Tdap, HPV, MCV4 at 11-12 years."}, {"ty": "mc", "d": 2, "q": "A 3-year-old needs vaccines. Which are the live vaccines on the schedule?", "o": ["MMR and varicella", "IPV and Hib", "DTaP and Hep A", "Tdap and HPV"], "a": [0], "y": "Right: MMR and varicella are live. The other pairs are inactivated."}, {"ty": "mc", "d": 2, "q": "A mother asks about RSV vaccine for her 5-month-old. What is correct?", "o": ["It is optional and given from birth to about 8 months", "It is required by the CDC at birth", "It is given only after 12 months", "It replaces the MMR"], "a": [0], "y": "Right: optional, and older infants are likely already exposed. It is not mandated, not after 12 months, and not a substitute for MMR."}, {"ty": "mc", "d": 2, "q": "A 2-year-old received the first flu vaccine ever. What happens next?", "o": ["A second dose about 4 weeks later", "No further doses", "A booster at 12 months", "A second dose at 6 months"], "a": [0], "y": "Right: a first-time flu recipient returns for a second dose in about 4 weeks."}, {"ty": "mc", "d": 3, "q": "A 4-month-old is at the clinic. Which set matches your schedule?", "o": ["DTaP, RV, IPV and PCV", "DTaP, RV, IPV, Hib, PCV and Hep B", "DTaP, IPV, Hib and MMR", "Hep A and flu vaccine"], "a": [0], "y": "Right: the 4-month visit has four vaccines. Why not the set with Hib and Hep B: that is the 2- and 6-month visit. Why not MMR: that is 15-18 months. Why not Hep A and flu: Hep A is 12-23 months and flu starts at 6-12 months."}, {"ty": "mc", "d": 3, "q": "A 6-month-old has a mild cold with no fever and is due for the 6-month vaccines. What does the nurse do?", "o": ["Give them, since a mild cold is not a reason to delay", "Wait until the cold is fully gone", "Give only the oral vaccine today", "Give half doses and repeat later"], "a": [0], "y": "Right: a minor illness is not a contraindication. Why not delaying: it leaves the infant unprotected longer. Why not only live vaccines: none are due at 6 months except RV by mouth, and the choice is not based on a cold. Why not half doses: doses are never split."}, {"ty": "sata", "d": 3, "q": "Which vaccines on the schedule are live? Select all that apply.", "o": ["RV", "MMR", "VAR", "DTaP", "Hep B", "IPV", "Hib"], "a": [0, 1, 2], "y": "Right: rotavirus, MMR and varicella are live. Why not DTaP, Hep B, IPV and Hib: they are inactivated, and killed vaccines cannot cause the disease."}, {"ty": "mc", "d": 3, "q": "A mother asks which vaccine is given by mouth. Which answer is correct?", "o": ["Rotavirus (RV)", "Inactivated polio (IPV)", "Hepatitis A (Hep A)", "Tetanus booster (Tdap)"], "a": [0], "y": "Right: RV is oral (RotaTeq 3 doses, Rotarix 2 doses). Why not IPV, Hep A or Tdap: all are injections."}, {"ty": "mc", "d": 3, "q": "A 13-month-old had her first Hep A dose today. When is the second dose due?", "o": ["6 months later", "1 month later", "At 4-5 years", "At 11-12 years"], "a": [0], "y": "Right: Hep A is 2 doses 6 months apart between 12 and 23 months. Why not 1 month: too soon. Why not 4-5 years or 11-12 years: those are other vaccine visits."}, {"ty": "mc", "d": 3, "q": "Which visit includes MMR for the first time on your schedule?", "o": ["15-18 months", "6 months", "4 months", "11-12 years"], "a": [0], "y": "Right: MMR starts at 15-18 months with DTaP, Hib, PCV and IPV. Why not 6 or 4 months: live measles vaccine is not given in early infancy. Why not 11-12 years: that visit is Tdap, HPV and MCV4."}, {"ty": "mc", "d": 3, "q": "A newborn's mother is Hep B positive. Which statement fits your schedule?", "o": ["Hep B at birth, 2 and 6 months", "Hep B waits until 2 months", "Hep B is given only at 4 months", "Hep B is given at 11-12 years"], "a": [0], "y": "Right: the schedule lists Hep B at newborn, 2 months and 6 months. Why not waiting until 2 months, only at 4 months or at 11-12 years: none match the schedule."}, {"ty": "ngn", "d": 3, "scen": "A mother brings her 12-year-old daughter for a visit. The mother asks which vaccines are due and what the HPV series involves.", "parts": [{"ty": "mc", "d": 3, "q": "Which vaccines are due at this visit?", "o": ["Tdap, HPV and MCV4", "DTaP, MMR and VAR", "Hep A, Hib and PCV", "IPV, RV and Hep B"], "a": [0], "y": "Right: Tdap, HPV and MCV4 plus annual flu. Why not the other sets: they are the 4-5 year, toddler and infant vaccines."}, {"ty": "mc", "d": 3, "q": "What does the nurse explain about the HPV series for a girl who starts at 12?", "o": ["2 doses 6-12 months apart", "3 doses over 6 months", "1 dose", "4 doses 1 month apart"], "a": [0], "y": "Right: starting before 15 needs 2 doses 6-12 months apart. Why not the other schedules: 3 doses is for starting at 15 or older, and 1 or 4 doses are not the schedule."}], "y": "Both parts come from the 11-12 year row of your schedule."}], "theo": [{"ty": "mat", "d": 2, "q": "Match each stage to the age group.", "pairs": [["Trust vs Mistrust", "Infant"], ["Autonomy vs Shame and Doubt", "Toddler"], ["Initiative vs Guilt", "Preschool"], ["Industry vs Inferiority", "School age"], ["Identity vs Role Confusion", "Adolescent"]], "y": "Erikson: trust (infant), autonomy (toddler), initiative (preschool), industry (school age), identity (adolescent)."}, {"ty": "ord", "d": 2, "q": "Place Erikson's stages in order.", "items": ["Trust vs Mistrust", "Autonomy vs Shame and Doubt", "Initiative vs Guilt", "Industry vs Inferiority", "Identity vs Role Confusion"], "y": "Birth to 1 trust, toddler autonomy, preschool initiative, school age industry, adolescent identity."}, {"ty": "ord", "d": 2, "q": "Place Freud's stages in order.", "items": ["Oral", "Anal", "Phallic", "Latency", "Genital"], "y": "Oral (infant), anal (toddler), phallic (preschool), latency (school age), genital (adolescent)."}, {"ty": "ord", "d": 2, "q": "Place Piaget's stages in order.", "items": ["Sensorimotor", "Preoperational", "Concrete operational", "Formal operational"], "y": "Sensorimotor birth to 2, preoperational preschool, concrete operational 7-11, formal operational 12-18."}, {"ty": "ord", "d": 2, "q": "Place Kohlberg's levels in order.", "items": ["Pre-conventional", "Conventional", "Post-conventional"], "y": "Punishment and obedience, then society's rules, then universal principles."}, {"ty": "mc", "d": 2, "q": "Which two stages show up in red on your slides?", "o": ["Trust vs Mistrust and Initiative vs Guilt", "Autonomy and Industry as red highlights", "Industry and Identity as red highlights", "Trust and Identity as red highlights"], "a": [0], "y": "Right: the red highlights are on infant trust vs mistrust and preschool initiative vs guilt. The yellow highlights are on autonomy, industry and identity."}, {"ty": "mc", "d": 2, "q": "A nurse finds that toilet training is the focus of pleasurable activity. Which theorist and stage?", "o": ["Freud, anal stage", "Freud, oral stage", "Erikson, autonomy", "Piaget, sensorimotor"], "a": [0], "y": "Right: Freud's anal stage. The oral stage is infancy. Erikson and Piaget stages do not describe pleasure sources."}, {"ty": "mc", "d": 2, "q": "A child follows rules because he wants to be seen as good. Which Kohlberg level?", "o": ["Conventional", "Pre-conventional", "Post-conventional", "Formal"], "a": [0], "y": "Right: conventional morality follows society's rules and law and order. Pre-conventional is punishment and obedience. Post-conventional is principles. Formal is a Piaget stage."}, {"ty": "mc", "d": 2, "q": "A child centers on one feature of an object and ignores the rest. Which Piaget stage?", "o": ["Preoperational", "Sensorimotor", "Concrete operational", "Formal operational"], "a": [0], "y": "Right: centration is a preoperational thinking pattern. Sensorimotor uses senses and movement. Concrete uses logic about real objects. Formal uses abstract thought."}, {"ty": "mc", "d": 2, "q": "Which theorist is described by social conflicts that must be resolved at each age?", "o": ["Erikson", "Piaget", "Freud", "Kohlberg"], "a": [0], "y": "Right: Erikson's stages are psychosocial crises. Piaget is thinking, Freud is body pleasure focus, Kohlberg is moral reasoning."}, {"ty": "mc", "d": 2, "q": "Which stage and theorist match: 'Mouth, tongue and gums focus of pleasure'?", "o": ["Freud, oral stage", "Piaget, sensorimotor", "Erikson, trust", "Kohlberg, pre-conventional"], "a": [0], "y": "Right: Freud's oral stage. The others describe thinking, social conflict and morality."}, {"ty": "mc", "d": 2, "q": "A teenager tries out different roles and has trouble deciding who she is. Which theorist and stage?", "o": ["Erikson, identity vs role confusion", "Freud, latency", "Piaget, concrete operational", "Kohlberg, conventional"], "a": [0], "y": "Right: Erikson's adolescent crisis. Latency is school age. Concrete operational is school age. Conventional is school age morality."}, {"ty": "mat", "d": 2, "q": "Match each Erikson stage to its age group.", "pairs": [["Trust vs Mistrust", "Infant"], ["Autonomy vs Shame and Doubt", "Toddler"], ["Initiative vs Guilt", "Preschool"], ["Industry vs Inferiority", "School age"], ["Identity vs Role Confusion", "Adolescent"]], "y": "Infant: totally dependent, so trust forms from consistent care. Toddler: walking and talking bring a drive for independence. Preschool: imagination and planning bring initiative. School age: skills learned at school build industry. Adolescent: body change and abstract thinking raise the question of who I am."}, {"ty": "mat", "d": 2, "q": "Match each behavior to the Erikson stage it shows.", "pairs": [["A baby calms when the caregiver picks her up and expects feeding", "Trust vs Mistrust"], ["A 2-year-old insists 'me do it' and refuses help", "Autonomy vs Shame and Doubt"], ["A 5-year-old sets up a pretend store and feels bad when scolded for the mess", "Initiative vs Guilt"], ["A 9-year-old signs up for school activities and wants to finish a project", "Industry vs Inferiority"], ["A 16-year-old tries different roles and asks who he is", "Identity vs Role Confusion"]], "y": "The caregiver response points to infant trust. 'Me do it' is toddler autonomy. Pretend play with guilt after scolding is preschool initiative. Signing up and finishing tasks is school-age industry. Trying roles is adolescent identity."}, {"ty": "mat", "d": 2, "q": "Match each Erikson stage to what happens when the task is not met.", "pairs": [["Trust vs Mistrust", "The child learns needs will not be met"], ["Autonomy vs Shame and Doubt", "The child feels shame and doubts his abilities"], ["Initiative vs Guilt", "The child feels guilty about overstepping limits"], ["Industry vs Inferiority", "The child feels inferior to others"], ["Identity vs Role Confusion", "The teen stays confused about who he is"]], "y": "Each stage's negative pole is in its name: mistrust, shame and doubt, guilt, inferiority and role confusion."}, {"ty": "mc", "d": 3, "q": "A 4-year-old says, 'The moon is following our car because it likes me.' Which pairing is correct?", "o": ["Piaget preoperational with Erikson initiative vs guilt", "Piaget concrete operational with Erikson industry vs inferiority", "Piaget sensorimotor with Erikson trust vs mistrust", "Piaget formal operational with Erikson identity vs role confusion"], "a": [0], "y": "Right: magical thinking is preoperational and ages 3-6 are initiative vs guilt. Why not concrete operational and industry: school age. Why not sensorimotor and trust: infancy. Why not formal operational and identity: adolescence."}, {"ty": "mc", "d": 3, "q": "A 9-year-old sorts shells by size and understands that a ball of clay keeps the same amount when flattened. Which pairing fits?", "o": ["Piaget concrete operational and Freud latency", "Piaget preoperational and Freud phallic", "Piaget formal operational and Freud genital", "Piaget sensorimotor and Freud oral"], "a": [0], "y": "Right: logical thinking about real things is concrete operational, and school age is Freud's latency. Why not preoperational and phallic: preschool. Why not formal operational and genital: adolescence. Why not sensorimotor and oral: infancy."}, {"ty": "mc", "d": 3, "q": "A 16-year-old refuses to cheat because 'it would go against my own values even if I never got caught.' Which Kohlberg level is this?", "o": ["Post-conventional", "Pre-conventional", "Conventional", "Sensorimotor"], "a": [0], "y": "Right: acting on personal principles is post-conventional. Why not pre-conventional: that is avoiding punishment. Why not conventional: that is following rules. Why not sensorimotor: a Piaget stage."}, {"ty": "mc", "d": 3, "q": "A 5-year-old does not hit his sister because he will lose TV. Which Kohlberg level is this?", "o": ["Pre-conventional", "Conventional", "Post-conventional", "Latency"], "a": [0], "y": "Right: avoiding punishment is pre-conventional. Why not conventional: following rules for approval. Why not post-conventional: personal principles. Why not latency: a Freud stage."}, {"ty": "mc", "d": 3, "q": "A 10-month-old cries when his mother leaves the room and is soothed when she returns and feeds him. Which Erikson stage is he in and what does this build?", "o": ["Trust vs mistrust, which builds trust when needs are met", "Autonomy vs shame and doubt, which builds independence", "Initiative vs guilt, which builds purpose", "Industry vs inferiority, which builds competence"], "a": [0], "y": "Right: consistent care builds trust in infancy. Why not autonomy: toddler stage. Why not initiative: preschool. Why not industry: school age."}, {"ty": "mc", "d": 3, "q": "A toddler who is punished for every spill at the table is most at risk for which outcome?", "o": ["Shame and doubt", "Mistrust", "Guilt", "Role confusion"], "a": [0], "y": "Right: ridicule of toddler independence leads to shame and doubt. Why not mistrust: unmet infant needs. Why not guilt: preschool initiative being blocked. Why not role confusion: adolescent identity."}, {"ty": "mat", "d": 3, "q": "Match each Freud stage to its age group.", "pairs": [["Oral", "Infant"], ["Anal", "Toddler"], ["Phallic", "Preschool"], ["Latency", "School age"], ["Genital", "Adolescent"]], "y": "From the stages table: oral infant, anal toddler, phallic preschool, latency school age, genital adolescent."}, {"ty": "mc", "d": 3, "q": "Which pairing is incorrect?", "o": ["Toddler with Piaget preoperational", "Infant with Piaget sensorimotor", "School age with Piaget concrete operational", "Adolescent with Piaget formal operational"], "a": [0], "y": "Right: the toddler is still sensorimotor (0-2), and preoperational starts in the preschool years. The other three pairings are on your table."}], "saf": [{"ty": "mc", "d": 2, "q": "At what temperature should a home water heater be set when there is an infant?", "o": ["120 F", "100 F", "140 F", "130 F"], "a": [0], "y": "Right: 120 F reduces scald risk. 130 F and 140 F can scald quickly. 100 F is not the standard."}, {"ty": "mc", "d": 2, "q": "Which advice reduces SIDS risk?", "o": ["Place the baby on the back, offer a pacifier", "Place the baby on the stomach to sleep", "Use a small pillow for head support", "Use bumper pads to protect the head"], "a": [0], "y": "Right: supine and a pacifier help. Stomach sleeping, pillows and bumper pads increase risk."}, {"ty": "mc", "d": 2, "q": "Which seat position is correct for a 20-month-old?", "o": ["Rear-facing as long as possible, in the back seat", "Forward-facing in the front seat", "Forward-facing in the back seat after 12 months", "Booster seat in the back"], "a": [0], "y": "Right: toddlers remain rear-facing as long as possible in the back seat. A booster is for preschoolers who outgrow forward-facing seats."}, {"ty": "mc", "d": 2, "q": "A nurse teaches about poisoning in toddlers. Which advice is correct?", "o": ["Lock chemicals away out of reach", "Teach the child not to touch chemicals", "Keep cleaning products in a low cabinet", "Rely on child-proof lids only"], "a": [0], "y": "Right: toddlers cannot be taught safety so the environment is secured. Teaching alone fails. Low cabinets are reachable. Lids alone are not enough."}, {"ty": "mc", "d": 2, "q": "Which advice about balloons is correct?", "o": ["Keep balloons away from infants and toddlers", "Allow them with adult supervision only", "Allow only latex balloons, not foil", "Allow them after the child is 6 months old"], "a": [0], "y": "Right: balloons are an aspiration and choking hazard for young children."}, {"ty": "mc", "d": 2, "q": "A preschooler tries to 'fly' off a porch like a superhero. What is the nurse's teaching focus?", "o": ["Magical thinking leads children to try the impossible", "Preschoolers understand danger well enough to be left alone", "Toddler gates alone are enough for safety", "Time-out prevents the behavior from recurring"], "a": [0], "y": "Right: magical thinking leads preschoolers to believe they can do the impossible, so supervise and teach rules. The other options ignore the developmental reason."}, {"ty": "mc", "d": 2, "q": "Which age group has most accidents between 3 and 6 pm?", "o": ["School age", "Infant", "Toddler", "Adolescent"], "a": [0], "y": "Right: school-age children. Teens peak 9 pm-12 am. Infants and toddlers are not described by this window."}, {"ty": "mc", "d": 2, "q": "Which age group is most at risk for suicide, homicide and vehicle crashes?", "o": ["Adolescent", "School age", "Preschool", "Toddler"], "a": [0], "y": "Right: the adolescent safety slide lists these. School age concerns are pedestrian, sports, bikes and water."}, {"ty": "sata", "d": 2, "q": "Which safety measures apply to toddlers? Select all that apply.", "o": ["Safety gates at the top and bottom of stairs", "Toilet lids closed", "Firearms kept locked", "Never left alone in a bathtub", "Hot water heater set to 140 F", "Use a bumper pad in the crib"], "a": [0, 1, 2, 3], "y": "Right: gates, closed toilet lids, locked firearms and constant bath supervision. Wrong: hot water should be 120 F and bumper pads are not recommended."}, {"ty": "mc", "d": 2, "q": "A 6-year-old rides a bicycle. Which teaching is a priority?", "o": ["Wear a helmet and learn road rules", "Allow riding in the street alone at 6", "Skip helmets on bike paths", "Allow riding after dark"], "a": [0], "y": "Right: cycling safety includes a helmet and road rules. The others increase injury risk."}, {"ty": "mc", "d": 3, "q": "A mother says she puts her 3-month-old to sleep on her stomach on a soft blanket 'so she doesn't choke.' What is the priority teaching?", "o": ["Back to sleep on a firm bare surface", "Side-lying is the safest", "Stomach is safe once she can roll", "Add a bumper so she doesn't hit the crib"], "a": [0], "y": "Right: back to sleep with a bare crib lowers SIDS risk. Why not side-lying: still unsafe. Why not stomach after rolling: this infant cannot yet roll, and the slide teaching is back to sleep. Why not a bumper: the crib is kept bare."}, {"ty": "mc", "d": 3, "q": "A father plans to set his water heater to 140 F. What does the nurse say?", "o": ["Set it to 120 F or lower to prevent burns", "140 F is fine if the baby is supervised", "160 F kills germs best", "The temperature does not matter"], "a": [0], "y": "Right: the infant safety rule is 120 F. Why not 140 F: burns occur within seconds. Why not 160 F: scalds even faster. Why not 'does not matter': it does."}, {"ty": "mc", "d": 3, "q": "A parent is buying a crib. Which crib slat spacing matches your slide?", "o": ["2 inches apart", "4 inches apart", "6 inches apart", "As wide as possible for airflow"], "a": [0], "y": "Right: slats 2 in apart so a head cannot get stuck. Why not 4 or 6 inches: the head can become trapped. Why not as wide as possible: wide gaps are dangerous."}, {"ty": "mc", "d": 3, "q": "A 2-year-old weighs 28 lb. Which car seat plan is best?", "o": ["Rear-facing in the back seat", "Front-facing in the front seat", "Booster seat in the back", "Lap belt only in the back"], "a": [0], "y": "Right: toddlers stay rear-facing as long as possible, then front-facing until 40-60 lb, always in the back. Why not front seat: the back is safest. Why not booster: preschool and older. Why not lap belt: does not fit a toddler."}, {"ty": "mc", "d": 3, "q": "A 3-year-old is in a booster and the family asks when she can use only the seat belt. Which answer fits?", "o": ["At 145 cm (4 ft 9 in) or age 8-12", "At 5 years of age", "At 40 lb of body weight", "Whenever the child asks"], "a": [0], "y": "Right: booster use continues until 145 cm or age 8-12. Why not 5 years or 40 lb: too small for a belt. Why not when she asks: size and age decide."}, {"ty": "sata", "d": 3, "q": "Which instructions belong in toddler safety teaching? Select all that apply.", "o": ["Safety gates at the top and bottom of stairs", "Firearms stored locked", "Locks on chemical cabinets", "Toilet lids kept closed", "Leave a toddler in the tub for a minute", "Use a walker for early walking"], "a": [0, 1, 2, 3], "y": "Right: the first four are on your slide. Why not leaving a toddler in the tub: drowning risk, never leave alone. Why not a walker: not on the slide and walkers are linked to falls."}, {"ty": "mc", "d": 3, "q": "Which time of day does the school-age slide list as the peak for accidents?", "o": ["3 to 6 pm", "6 to 9 am", "Noon", "9 pm to midnight"], "a": [0], "y": "Right: most school-age accidents happen from 3 to 6 pm. Why not morning or noon: not the peaks. Why not 9 pm to midnight: that is the adolescent peak."}, {"ty": "mc", "d": 3, "q": "An 8-month-old is crawling toward a floor outlet and a bottle of dish soap. Which action is the nurse's best teaching?", "o": ["Cover outlets and lock poisons up high", "Teach him to say 'no' to dangerous items", "Keep him in a walker all day", "Watch only when he is awake"], "a": [0], "y": "Right: infants cannot understand warnings, so the environment is made safe. Why not teaching 'no': he cannot learn it yet. Why not a walker: raises fall risk. Why not watching only when awake: poisoning risks exist at any time."}], "star": [{"ty": "mc", "d": 2, "q": "Which fontanel closes at 12-18 months?", "o": ["Anterior diamond", "Posterior triangle", "Sphenoid", "Mastoid"], "a": [0], "y": "Right: the anterior diamond. The posterior triangle closes by 2 months."}, {"ty": "mc", "d": 2, "q": "Which is the instructor's quiz flag for the 6-month visit?", "o": ["Palmar grasp", "Pincer grasp", "Babinski", "Tonic neck"], "a": [0], "y": "Right: your note says palmar grasp at 6 months. Pincer is a 9-month skill. Babinski and tonic neck are not the flagged item."}, {"ty": "mc", "d": 2, "q": "Which is an example of toddler telegraphic speech, flagged as a quiz question?", "o": ["A toddler says 'me go park'", "A baby coos", "A preschooler tells a story", "A teen speaks slang"], "a": [0], "y": "Right: telegraphic speech uses key words only. The other examples are different stages."}, {"ty": "mc", "d": 2, "q": "Which sign is the quiz flag for preschool vitals and breathing?", "o": ["Diaphragmatic breathing", "Retractions", "Nasal flaring", "Grunting"], "a": [0], "y": "Right: preschoolers often breathe with the belly. The others signal distress."}, {"ty": "mc", "d": 2, "q": "Which food is the quiz example of a calcium source for a child who avoids milk?", "o": ["White beans", "Rice", "Chicken", "Apples"], "a": [0], "y": "Right: your note says white beans are high in calcium."}, {"ty": "mc", "d": 2, "q": "What is the correct example of Industry for a school-age child?", "o": ["Signs up for school activities", "Shares toys with a sibling", "Says no to a parent", "Wants to be a doctor someday"], "a": [0], "y": "Right: your note's example is signing up for school activities. The others belong to other stages."}, {"ty": "mc", "d": 2, "q": "What does the quiz say has the most impact on social interaction in a school-age child?", "o": ["Continuous peer relationships", "Television", "Teachers", "Siblings"], "a": [0], "y": "Right: your note on page 150. The others are weaker."}, {"ty": "mc", "d": 2, "q": "A teen's parent has a history of substance abuse. What may the teen lack?", "o": ["Social and emotional readiness", "Physical growth", "Vision", "Immunizations"], "a": [0], "y": "Right: your note says the child can lack social and emotional readiness. The others are not linked."}, {"ty": "sata", "d": 2, "q": "Which are starred reflexes the instructor said ATI can test? Select all that apply.", "o": ["Asymmetric tonic neck", "Palmar grasp", "Rooting", "Parachute", "Neck righting", "Pincer grasp"], "a": [0, 1, 2], "y": "Right: tonic neck, palmar grasp and rooting are the focus points. Wrong: parachute and neck righting are protective reflexes, and pincer grasp is a fine motor skill, not a primitive reflex."}, {"ty": "ord", "d": 2
