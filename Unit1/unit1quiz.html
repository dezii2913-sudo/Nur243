make a child think they can do the impossible (fly, break bricks, TV stunts).", "Bicycle safety. Road crossing safety. Swim safety.", "House rules. Fire safety. Emergency plans.", "Telephone numbers posted and practiced."]}]}, {"h": "Signs of developmental delay", "blocks": [{"t": "tbl", "head": ["Age", "Concern"], "rows": [["**3 years**", "Falls often or has trouble with stairs. Drools or has unclear speech. Cannot work simple toys. Does not make eye contact"], ["**5 years**", "Does not show a variety of emotions. Extremes of behavior (fear, anger, aggression). Unusually withdrawn or inactive. Cannot do self-care (toileting, dressing, brushing teeth)"]]}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["Vitals: temp 98.6 F, pulse 60-110, respirations 21-25. Grows about 2.5-3.5 in a year and gains 4.5-6.5 lb a year. She said not to stress the exact numbers for this group (quiz flag is on the vitals slide, so know the ranges).", "★ Nutrition: picky until about 5. 3 meals and 2 snacks. Never force food or use it as a reward or punishment. ==5 servings of fruit and vegetables==. Limit sweet drinks. Involve them in food prep. Offer no more than 2 choices. 1 hour of activity, screen time 1-2 hours.", "Fine motor and language: draws a stick figure with 5 or more parts, hops, skips, dances, dresses alone, uses verbs and plurals. Stuttering is normal up to 5-6 years, refer to speech therapy if it persists. Plays games with simple rules.", "★ Erikson: !!initiative vs guilt!!. Wants to do adult activities, oversteps limits and feels guilty. Be consistent with discipline.", "★ Night terror vs nightmare: with a night terror the child wakes screaming and confused and does not understand what is going on. With a nightmare the child can remember and tell you the dream.", "★ Safety: booster seat when the forward-facing seat is outgrown, restraint until ==145 cm (4 ft 9 in) or 8-12 years==. Magical thinking can make a child think he can do the impossible (jumping from heights). Helmet, road crossing, swim and fire safety, learn parents' phone number.", "Temper tantrum guidance: stay consistent and ignore the tantrum.", "Delay signs at 3 years: falls often or has trouble with stairs, drools or has unclear speech, cannot work simple toys, no eye contact. At 5: no variety of emotions, extreme behavior, withdrawn, cannot do self-care.", "Vaccines at 4-5: DTaP, MMR, varicella, IPV, annual flu. To ease fear of an injection, use distraction and demonstrate on a toy first."]}]}], "cold": ["Erikson: Initiative vs Guilt (red). Freud: phallic. Piaget: preoperational. Kohlberg: pre-conventional.", "Magical thinking, animism, centration, egocentrism: know what each looks like.", "5 servings fruits and vegetables. 0 sweetened beverages. Two choices only. 3 meals + 2 snacks.", "Never force food or use it as bribe, reward or punishment.", "Stuttering is normal. Lisping normal up to 5-6 years.", "Draws person with 5+ parts. Hops, skips, dresses alone.", "Screen 1-2 hours. 1 hour activity. 12 hours sleep.", "Nightmare: child wakes and remembers. Night terror: child unresponsive, no memory.", "Booster seat after forward-facing seat is outgrown, until 145 cm (4 ft 9 in) or age 8-12."], "traps": [["Preschooler says the moon follows him.", "Animism. Normal for age."], ["Child believes he can fly like a superhero.", "Magical thinking. Safety teaching needed."], ["Child stutters at age 4.", "Normal. Not a delay."], ["Which Erikson stage in preschool?", "Initiative vs Guilt. Not Industry vs Inferiority (school age)."], ["Child screams asleep and does not respond to you.", "Night terror. Do not wake. Keep safe."], ["Preschooler refuses vegetables. Offer dessert as a reward?", "No. Two choices, no bribes."]]}, {"id": "sch", "icon": "🎒", "title": "School Age (6-12)", "sub": "Industry and peers", "sections": [{"h": "Vital signs and growth", "blocks": [{"t": "tbl", "head": ["Measure", "School age"], "rows": [["Temp", "98.2 to 97.9 F"], ["Pulse", "50-90"], ["Respirations", "18-20"], ["BP", "91-125 / 54-90"], ["Height", "5 cm (2 in)/year"], ["Weight", "2-3 kg (4.4-6.6 lb)/year"], ["Puberty", "==Pre-puberty begins around age 9, especially for girls=="], ["Menarche", "==10-16 years, average 12.5 years=="]]}, {"t": "ul", "items": ["Growth and maturation rates start to differ between girls and boys.", "Visible sexual maturation in boys is minimal during preadolescence.", "Permanent teeth erupt: dental care. Bones continue to ossify."]}, {"t": "note", "k": "anno", "x": "Visual impairment can show up at this age. Sign: squinting in class."}]}, {"h": "Nutrition", "star": true, "blocks": [{"t": "ul", "items": ["Eats adult foods and needs quality nutrition.", "Eat 3 meals and 2 snacks a day.", "Risk for obesity. Emphasize activity. Avoid fast food. Do not skip meals. Model healthy behaviors."]}, {"t": "tbl", "head": ["Daily need", "4-8 years", "9-12 years"], "rows": [["Calories", "1,400-1,600", "1,600-2,000"], ["**Calcium (mg)**", "==800-1,000==", "==1,300=="], ["Iron (mg)", "10", "8"], ["Components", "45-65% carbs, 10-30% protein, 25-35% fat", "45-65% carbs, 10-30% protein, 25-35% fat"]]}, {"t": "note", "k": "star", "x": "Absolutely know the daily calcium intake."}]}, {"h": "Development", "blocks": [{"t": "tbl", "head": ["Area", "What happens"], "rows": [["**Self-concept**", "Awareness of self in relation to others. Values and beliefs of the family. Confidence grows from positive self-concept, worth and making contributions. ==Middle school: more peer than parent influence.== Body image solidifies. Curiosity about sexuality and reproduction"], ["**Social**", "==Peer groups are important. Peer pressure begins to take effect.== Clubs and best friends are popular. Bullying is meant to cause harm or control. Prefers same-gender company. Opposite-sex attraction begins in middle and later school age. Conformity becomes evident"]]}, {"t": "note", "k": "star", "x": "Quiz question. Promoting learning and school attendance. Peer groups, behaviors and attitudes will have an impact. Healthy People 2030 table, text p. 181."}]}, {"h": "Theorists: school age", "blocks": [{"t": "tbl", "head": ["Theorist", "Stage", "What it means"], "rows": [["**Piaget**", "Concrete operational (7-11)", "Solves concrete problems. Begins to understand relationships such as size. Understands right and left. Aware of other viewpoints"], ["**Erikson**", "!!Industry vs Inferiority (7-11)!!", "==Confidence comes from competition, cooperation with others and accomplishing tasks. Learns that not every child masters every skill.=="], ["**Freud**", "Latency", "Sexual needs are quiet. Children put energy into schoolwork and clubs"], ["**Kohlberg**", "Conventional level", "Morality follows the rules of society and tries to be good. Law and order orientation"]]}, {"t": "note", "k": "star", "x": "Quiz question, text p. 146. Example of Industry: signs up for school activities."}]}, {"h": "Developmental concerns", "star": true, "blocks": [{"t": "ul", "items": ["Television and video games: set limits on content and time. ==Limit to 2 hours.==", "School refusal (school phobia).", "Latchkey children (home alone after school) need a safety plan.", "Stealing, lying, cheating, bullying (as perpetrator or victim).", "Fitting in with peer groups matters a lot.", "Tobacco and alcohol education."]}, {"t": "note", "k": "star", "x": "Quiz questions. Continuous peer relationships have the most impact on social interaction in school-age children (text p. 150). Limit video games to 2 hours a day (text p. 161)."}, {"t": "ul", "items": ["Anticipatory guidance covers: playing sports, schoolwork and activities, time management, forming and keeping friends, peer pressure, bullying."]}]}, {"h": "Safety and immunizations", "blocks": [{"t": "ul", "items": ["Media. Pedestrian accidents. Sports injuries. Firearm safety. Cycling safety. Water safety. Fire and burns. Automobile accidents.", "Early experimentation with smoking, drugs or alcohol.", "==Most accidents occur between 3 and 6 pm.=="]}, {"t": "ul", "items": ["Immunizations at 11-12 years: Tdap, HPV, MCV4. Annual flu. COVID per current guidelines."]}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["Vitals: temp about 98 F, pulse 50-90, respirations 18-20. Girls usually grow faster than boys, so reassure a parent when a boy is shorter than his sister at the same age.", "★ ==Visual impairment== can show at this age. Signs: squinting in class.", "★ ==Calcium== is highlighted as tested: 800-1,000 mg a day for ages 4-8, and 1,300 mg for 9-12. Iron about 10 mg. 3 meals and 2 snacks, watch for obesity, avoid fast food and skipped meals.", "★ In middle school ==peer influence is stronger than parental influence==. Peer pressure begins. Body image solidifies, curiosity about sexuality starts, clubs and best friends are popular and they like the same sex group.", "★ Erikson: !!industry vs inferiority!!. Confidence comes from accomplishing tasks, and not every child masters every skill.", "Concerns: school refusal, latchkey children, bullying, fitting in. Limit TV and video games to 2 hours. Tobacco and alcohol education starts in middle school. Helmets for bikes and sports.", "★ HPV: before age 15 only ==2 doses 6-12 months apart==. At 15 or older, 3 doses (0, 1-2 months, 6 months). Tdap and MCV4 are also due at 11-12."]}]}], "cold": ["Erikson: Industry vs Inferiority. Piaget: concrete operational. Freud: latency. Kohlberg: conventional.", "Calcium: 4-8 years 800-1,000 mg. 9-12 years 1,300 mg.", "Menarche 10-16, average 12.5. Pre-puberty begins around age 9, especially girls.", "Growth 5 cm and 2-3 kg a year. Permanent teeth erupt. Bones ossify.", "Peers: continuous peer relationships have the most social impact.", "Video games and TV: 2 hours a day maximum.", "Accidents most often 3-6 pm.", "Squinting in class suggests a vision problem.", "School refusal, latchkey, bullying, tobacco and alcohol education."], "traps": [["Which Erikson stage when a child signs up for school activities?", "Industry vs Inferiority."], ["Calcium for a 10-year-old.", "1,300 mg, not 800-1,000."], ["Child squints at the board.", "Possible vision impairment. Refer for exam."], ["Parent refuses to let child join clubs because of bullying fears.", "Peer relationships have the most social impact. Support participation with safeguards."], ["Which Freud stage in school age?", "Latency, not genital."], ["Kohlberg level: follows rules to be 'good'.", "Conventional, law and order."]]}, {"id": "ado", "icon": "🧑‍🎓", "title": "Adolescent (12-20)", "sub": "Identity and risk", "sections": [{"h": "Vital signs and growth", "star": true, "blocks": [{"t": "tbl", "head": ["Measure", "Adolescent"], "rows": [["Temp", "97.9 F"], ["Pulse", "50-90"], ["Respirations", "16-20"], ["BP", "108-138 / 63-94"], ["Height", "Final 20-25% of growth is in puberty. Girls stop 2-2.5 yr after menarche (grow 5-20 cm, 2-8 in). Boys stop at 18-20 yr (grow 10-30 cm, 4-12 in)"], ["Weight", "Girls gain 7-25 kg (15.5-55 lb). Boys gain 7-30 kg (15.5-66 lb)"]]}, {"t": "note", "k": "anno", "x": "Menarche: average age 12.5 years."}]}, {"h": "Tanner scales (sexual maturity), in order", "star": true, "blocks": [{"t": "tbl", "head": ["Girls", "Boys"], "rows": [["1. Breast development", "1. Testicular enlargement"], ["2. Pubic hair", "2. Pubic hair"], ["3. Axillary hair", "3. Penile enlargement"], ["4. Menstruation", "4. Axillary hair"], ["", "5. Facial hair"], ["", "6. Vocal changes"]]}, {"t": "ul", "items": ["+ Tanner scale (sexual maturity rating) is a 5-stage system that rates breast, genital and pubic hair development from prepubertal (stage 1) to adult (stage 5). Your slide lists the order in which the changes appear."]}]}, {"h": "Nutrition", "blocks": [{"t": "ul", "items": ["Eats adult foods and needs quality nutrition.", "3 meals and 2 snacks with extra iron, protein, calcium, zinc, folic acid, vitamin A, vitamin B6.", "Risk for obesity or under-eating (bulimia nervosa, anorexia nervosa).", "Emphasize activity. Avoid fast food. Do not skip meals. Model healthy behaviors."]}, {"t": "note", "k": "anno", "x": "High in iron: meats, green leafy vegetables, eggs, peanut butter."}]}, {"h": "Development", "star": true, "blocks": [{"t": "tbl", "head": ["Area", "What happens"], "rows": [["**Sexual identity**", "Sexual experimentation with same or opposite sex, masturbation. Transition to intimate relationships later. Sexual experience"], ["**Self-concept**", "Views self in relation to peers. Early: wants to be the same. Later: values own unique characteristics. Views self as invincible, risky behavior. Mood swings are common"], ["**Body image**", "Compares to peers. Image established in this age is kept for life"], ["**Social**", "Peer relationships most important, a support system. Peer pressure begins to take effect. A best friend is more stable. Bullying is meant to harm or control. Parent-child relationships shift to greater independence"]]}, {"t": "note", "k": "star", "x": "Quiz question, text p. 149. Peer relationships impact social interaction."}]}, {"h": "Theorists: adolescent", "blocks": [{"t": "tbl", "head": ["Theorist", "Stage", "What it means"], "rows": [["**Piaget**", "Formal operational (12-18)", "Rational thinking, deductive reasoning, futuristic and idealistic thinking"], ["**Erikson**", "!!Identity vs Role Confusion!!", "==Who am I? Tries out different roles. Establishes sexual, political and career identity or is confused about what roles to play.=="], ["**Freud**", "Genital stage", "Focus on pleasure sensation. Seeks sexual stimulation and satisfaction in heterosexual relationships"], ["**Kohlberg**", "Post-conventional", "Morality as standards beyond a specific group. Social contract orientation. Universal ethical principle orientation. Mystical and religious reflection"]]}, {"t": "note", "k": "anno", "x": "Nursing concerns: self-image, privacy, connection to peers."}]}, {"h": "Education, safety and risk", "blocks": [{"t": "ul", "items": ["Guidance: sports, schoolwork and activities, organizing time, nonviolent video games, music, reading or pets for solitary time, career training, social events.", "Cover: early peer pressure, bullying, anger management and impulse control, sexual behavior and its risks.", "Teens need about 9 hours of sleep a night.", "Safety: suicide, homicide, motor vehicle accidents, sports injuries, firearms, cycling, water, fire and burns, smoking, drugs or alcohol.", "==Most accidents occur between 9 pm and 12 am.=="]}]}, {"h": "Suicide risk factors", "star": true, "blocks": [{"t": "ul", "items": ["Depression or other mental health illness.", "Personal or family history of a previous suicide attempt.", "Poor school performance (a drop in grades).", "Dysfunctional or disorganized family.", "Substance abuse (drugs or alcohol).", "Difficulties with sexual identity.", "Socially isolated (a loner or a victim of bullying).", "Marked changes in behavior, such as giving away valued possessions."]}, {"t": "note", "k": "star", "x": "Quiz question, text p. 132. A child of a parent with a history of substance abuse can lack social and emotional readiness."}, {"t": "ul", "items": ["Immunizations at 18 years: MMR, Tdap, MCV4, annual flu. COVID per the provider."]}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["Vitals: pulse 50-90, a little lower in athletes. Final 20-25% of height comes in puberty. Girls stop growing 2-2.5 years after menarche, boys at 18-20 years. Weight gain: girls 15.5-55 lb, boys 15.5-66 lb. Know the Tanner order.", "★ Nutrition: 3 meals and 2 snacks, a teen multivitamin, extra iron, protein and calcium. ==Iron foods: eggs, leafy green vegetables, peanut butter, meat==. Risk of obesity, bulimia and anorexia, which can start in middle school.", "Development: sexual experimentation may occur, they compare themselves to peers, peers are the main support. Bullying can be meant to cause harm. A teen wants independence.", "★ Erikson: !!identity vs role confusion!!. She called this an easy test question: forming sexual, political and career identity and being confused about roles.", "Guidance: sports physical and helmet, organize time, limit violent video games, discuss sexual behavior and risk, enough sleep.", "★ Suicide risk factors: depression or other mental illness, personal or family history of attempts, dysfunctional family, substance abuse, difficulty with sexual identity, social isolation, and marked behavior change such as giving away valued possessions.", "Safety: suicide, homicide, firearms, motor vehicle crashes, sports injuries. Most accidents occur late in the evening. Smoking, drug and alcohol education.", "Vaccines: at 18, if behind, MMR, Tdap and meningococcal, plus annual flu."]}]}], "cold": ["Erikson: Identity vs Role Confusion. Piaget: formal operational. Freud: genital. Kohlberg: post-conventional.", "Pulse 50-90, resp 16-20, BP 108-138/63-94.", "Girls stop growing 2-2.5 years after menarche. Boys stop at 18-20.", "Tanner order for girls: breast, pubic hair, axillary hair, menstruation.", "Tanner order for boys: testes, pubic hair, penis, axillary hair, facial hair, voice.", "Accidents most often 9 pm to 12 am.", "Suicide risks: depression, previous attempt, isolation, substance abuse, giving away possessions.", "Peers are the main support system. Nursing concerns: self-image, privacy, peers.", "Sleep 9 hours. Extra iron, calcium, zinc, folic acid, A, B6."], "traps": [["Teen gives away favorite things.", "Suicide warning sign. Assess directly and report."], ["Which Erikson stage: 'Who am I?'", "Identity vs Role Confusion."], ["Accident peak hour: school age vs teen.", "School age 3-6 pm. Teen 9 pm-12 am."], ["Which sign appears first in girls on the Tanner list?", "Breast development."], ["Which Kohlberg level for teens?", "Post-conventional, not conventional."], ["Teen thinks nothing bad will happen to them.", "Invincibility. Normal, drives risky behavior."]]}, {"id": "imm", "icon": "💉", "title": "Immunizations", "sub": "Birth to 18", "sections": [{"h": "Schedule on your slides", "star": false, "blocks": [{"t": "tbl", "head": ["Age", "Vaccines"], "rows": [["**Newborn**", "Hep B"], ["**2 months**", "DTaP, RV, IPV, Hib, PCV, Hep B"], ["**4 months**", "DTaP, RV, IPV, PCV (slide writes PVC, meaning PCV)"], ["**6 months**", "DTaP, RV, IPV, Hib, PCV, Hep B"], ["**6-12 months**", "Seasonal flu vaccine"], ["**12-23 months**", "Hep A, 2 doses 6 months apart"], ["**15-18 months**", "DTaP, Hib, PCV, IPV, MMR"], ["**Toddler on**", "Annual flu. COVID-19 per current recommendation"], ["**4-5 years**", "DTaP, MMR, VAR, IPV. Annual flu and COVID per provider"], ["**11-12 years**", "Tdap, HPV, MCV4. Annual flu. COVID per guidelines"], ["**18 years**", "MMR, Tdap, MCV4, annual flu. COVID per provider"]]}]}, {"h": "What each one is (names and brands)", "blocks": [{"t": "tbl", "head": ["Short name", "Full name and brands", "Type"], "rows": [["**Hep B**", "+ Hepatitis B. Engerix-B, Recombivax HB", "Inactivated"], ["**DTaP**", "+ Diphtheria, tetanus, acellular pertussis. Daptacel, Infanrix", "Inactivated"], ["**Tdap**", "+ Tetanus, reduced diphtheria, acellular pertussis for age 7+. Boostrix, Adacel", "Inactivated"], ["**RV**", "+ Rotavirus. RotaTeq (3 doses), Rotarix (2 doses). Given by mouth", "==LIVE=="], ["**IPV**", "+ Inactivated poliovirus. IPOL", "Inactivated"], ["**Hib**", "+ Haemophilus influenzae type b. ActHIB, PedvaxHIB, Hiberix", "Inactivated"], ["**PCV**", "+ Pneumococcal conjugate. Prevnar 13 and 20, Vaxneuvance", "Inactivated"], ["**MMR**", "+ Measles, mumps, rubella. M-M-R II, Priorix", "==LIVE=="], ["**VAR**", "+ Varicella (chickenpox). Varivax", "==LIVE=="], ["**Hep A**", "+ Hepatitis A. Havrix, Vaqta", "Inactivated"], ["**HPV**", "+ Human papillomavirus. Gardasil 9", "Inactivated"], ["**MCV4**", "+ Meningococcal conjugate (A, C, W, Y). Menactra, Menveo, MenQuadfi", "Inactivated"], ["**Flu**", "+ Fluzone and others (shot). The nasal spray FluMist is live", "Shot inactivated"]]}, {"t": "note", "k": "anno", "x": "Your slide notes for the older child slide: Human papilloma virus and Meningococcal vaccine."}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["★ Her tip: make flash cards for the vaccines as you go. The first quiz covers chapters 3-7.", "Birth: Hep B (hospital or first visit). 2 months: DTaP, rotavirus, IPV, Hib, PCV, Hep B. 4 months: the same minus Hep B. 6 months: the same as 2 months. Flu from 6 months, annually.", "A child getting flu vaccine for the first time returns in about 4 weeks for a second dose.", "12 months: Hep A, 2 doses 6 months apart. 15 months: DTaP, Hib, IPV, MMR, varicella. ==MMR and varicella are the live ones==.", "RSV prevention is optional (not CDC mandated): from birth through about 8 months, since older infants have likely been exposed.", "4-5 years: DTaP, MMR, varicella, IPV. 11-12 years: Tdap, HPV, MCV4. 18 years: catch up MMR, Tdap, meningococcal. Annual flu and COVID per provider."]}]}], "cold": ["Newborn: Hep B. 2 months: DTaP, RV, IPV, Hib, PCV, Hep B. 4 months: no Hib or Hep B.", "6 months: DTaP, RV, IPV, Hib, PCV, Hep B. Flu starts 6 months.", "12-23 months: Hep A, 2 doses 6 months apart.", "15-18 months: DTaP, Hib, PCV, IPV, MMR.", "4-5 years: DTaP, MMR, VAR, IPV.", "11-12 years: Tdap, HPV, MCV4. 18 years: MMR, Tdap, MCV4, flu.", "Live vaccines: MMR, varicella, rotavirus, nasal flu spray."], "traps": [["Which vaccines are on the 2-month and 6-month visits but not the 4-month visit on your slide?", "Hib and Hep B."], ["Which age gets Hep A?", "12-23 months, 2 doses 6 months apart."], ["Which vaccines at 11-12 years?", "Tdap, HPV, MCV4."], ["MMR given at what ages on your slides?", "15-18 months, then again at 4-5 years."], ["Rotavirus vaccine route?", "By mouth. Live."]]}, {"id": "theo", "icon": "🧠", "title": "Theorists Compared", "sub": "All stages in one place", "sections": [{"h": "Stages by age group", "blocks": [{"t": "tbl", "head": ["Age", "Piaget", "Erikson", "Freud", "Kohlberg"], "rows": [["**Infant** (0-1)", "Sensorimotor (0-2)", "!!Trust vs Mistrust!!", "Oral", "Not yet (moral reasoning starts later)"], ["**Toddler** (1-3)", "Sensorimotor", "!!Autonomy vs Shame and Doubt!!", "Anal", "Not yet (moral reasoning starts later)"], ["**Preschool** (3-6)", "Preoperational", "!!Initiative vs Guilt!!", "Phallic", "Pre-conventional"], ["**School age** (6-12)", "Concrete operational (7-11)", "!!Industry vs Inferiority!!", "Latency", "Conventional"], ["**Adolescent** (12-20)", "Formal operational (12-18)", "!!Identity vs Role Confusion!!", "Genital", "Post-conventional"]]}, {"t": "note", "k": "star", "x": "All five Erikson stages are shown in red so they stick together: Trust vs Mistrust, Autonomy vs Shame and Doubt, Initiative vs Guilt, Industry vs Inferiority, Identity vs Role Confusion."}]}, {"h": "Key words to tell them apart", "blocks": [{"t": "tbl", "head": ["Theorist", "Focus", "Key idea"], "rows": [["**Piaget**", "How thinking develops", "Sensorimotor learns by senses and movement. Preoperational uses words, magical thinking. Concrete operational is logical about real things. Formal operational is abstract"], ["**Erikson**", "Social conflict at each age", "Each stage has a crisis to resolve (trust, autonomy, initiative, industry, identity)"], ["**Freud**", "Body focus of pleasure", "Mouth, anus, genitals, latency (quiet), then mature genital"], ["**Kohlberg**", "How right and wrong is judged", "Avoiding punishment, then following rules, then personal principles"]]}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["★ She said to star all of the Erikson stages.", "!!Trust vs mistrust!!: infant.", "!!Autonomy vs shame and doubt!!: toddler, wants to be self-sufficient.", "!!Initiative vs guilt!!: preschool, adult activities and overstepping limits.", "!!Industry vs inferiority!!: school age, accomplishing tasks and learning not everyone masters every skill.", "!!Identity vs role confusion!!: adolescent, an easy test item."]}]}], "cold": ["Erikson order: Trust, Autonomy, Initiative, Industry, Identity.", "Freud order: Oral, Anal, Phallic, Latency, Genital.", "Piaget: Sensorimotor, Preoperational, Concrete operational, Formal operational.", "Kohlberg: Pre-conventional, Conventional, Post-conventional.", "Object permanence: sensorimotor, about 4-7 months. Magical thinking and animism: preoperational."], "traps": [["Industry vs Inferiority and Initiative vs Guilt.", "Industry is school age. Initiative is preschool."], ["Which Freud stage goes with toilet training?", "Anal (toddler)."], ["Kohlberg level: punishment and obedience.", "Pre-conventional (preschool)."], ["Which Piaget stage uses logic with real objects?", "Concrete operational (7-11)."]]}, {"id": "saf", "icon": "🛟", "title": "Safety by Age", "sub": "Top hazards and the rule", "sections": [{"h": "Safety side by side", "star": true, "blocks": [{"t": "tbl", "head": ["Age", "Main hazards", "Key rules"], "rows": [["**Infant**", "Aspiration, SIDS, falls, drowning, poisoning, burns", "Rear-facing car seat in the back. Water heater 120 F. Back to sleep, bare crib. Crib slats 2 in apart. Never alone in the tub. Parents learn CPR"], ["**Toddler**", "Aspiration, poisoning, burns, drowning, falls", "Rear-facing as long as possible, front-facing until 40-60 lb, back seat. Locks on chemicals, firearms locked. Safety gates top and bottom of stairs. Toilet lids closed"], ["**Preschool**", "Car crashes, bikes, roads, water, fire, magical thinking", "Booster seat until 145 cm (4 ft 9 in) or age 8-12. Bike, road, swim safety. House rules, fire plan, phone numbers practiced"], ["**School age**", "Pedestrian, sports, firearms, bikes, water, fire, cars, early smoking, drugs, alcohol", "Most accidents 3-6 pm. Limit media. Teach firearm and water safety"], ["**Adolescent**", "Suicide, homicide, vehicle crashes, sports, firearms, smoking, drugs, alcohol", "Most accidents 9 pm-12 am. Screen for suicide risk. Discuss sexual risks"]]}, {"t": "note", "k": "star", "x": "Instructor tags: infant safety quiz (text p. 78), toddler safety 'start before the toddler stage'."}]}, {"h": "From the lecture (Nov 10)", "star": true, "blocks": [{"t": "ul", "items": ["Infant: federally approved rear-facing seat in the back, no plastic bags or balloons, hot water at 120 F, never alone near water, mattress at the lowest position, slats close together, back to sleep with no pillows, bumpers or stuffed animals, no smoking in the home. She said accidents happen when routine changes.", "Toddler: rear-facing as long as possible, back seat, chemicals and sharp objects out of reach, firearms locked, windows locked, gates, never alone in the bathtub.", "Preschool: booster seat, helmet, road crossing, swim and fire safety, emergency plans. Magical thinking leads to risk taking.", "School age: helmets, sports injuries, firearm, water, burn and automobile safety, early experimentation with smoking.", "Adolescent: suicide, homicide, firearms, motor vehicle crashes, sports, substance education."]}]}], "cold": ["Infant: rear-facing, back seat. Water heater 120 F. Crib slats no more than 2 in. SIDS: back, bare crib, pacifier ok, no smoking.", "Toddler: aspiration list (grapes, hot dogs, coins, candy, small toys). Rear-facing as long as possible, front-facing until 40-60 lb. Gates top and bottom.", "Preschool: booster until 145 cm (4 ft 9 in) or age 8-12. Magical thinking.", "School age: accidents 3-6 pm. Teen: 9 pm-12 am.", "Teen top threats: suicide, homicide, vehicle crashes."], "traps": [["A pacifier for a sleeping infant.", "Helps reduce SIDS risk."], ["Toddler grapes and hot dogs.", "Aspiration hazard. Cut or avoid."], ["Accident time window for a 9-year-old.", "3-6 pm."], ["When does a toddler get a front-facing seat?", "Only after rear-facing is no longer possible, up to 40-60 lb, back seat always."]]}], "q": {"vit": [{"ty": "mc", "d": 2, "q": "A nurse is preparing to measure the blood pressure of a 5-month-old. Which site should the nurse use?", "o": ["Lateral tibialis artery in the lower leg", "Brachial artery in the left upper arm", "Radial artery at the wrist", "Carotid artery in the neck"], "a": [0], "y": "Right: infant BP is taken at the lateral tibialis artery (lower leg). Not the left brachial: if the leg cannot be used, the right upper arm is preferred because the left arm gives false readings. Not radial: that is a pulse site in older children, not an infant BP site. Not carotid: a pulse site that is never used for BP."}, {"ty": "mc", "d": 2, "q": "A nurse is assessing a 10-month-old. Which technique correctly obtains the heart rate?", "o": ["Listen apically for a full minute", "Palpate radially for 30 seconds and double it", "Palpate the brachial pulse for 15 seconds and multiply by 4", "Listen apically for 30 seconds and double it"], "a": [0], "y": "Right: infant HR is apical for 1 full minute because infant rates are fast and can be irregular. Not radial 30 seconds: that is for toddlers through adults. Not 15 seconds times 4: too short, magnifies error. Not apical 30 seconds doubled: the apical count for an infant is a full minute."}, {"ty": "mc", "d": 2, "q": "A nurse counts a toddler's radial pulse for 30 seconds and the rhythm is irregular. What should the nurse do next?", "o": ["Recount apically for a full minute", "Double the count and record the rate", "Switch to the brachial artery for 30 seconds", "Repeat the radial count for 15 seconds"], "a": [0], "y": "Right: an irregular rhythm needs an apical count for 1 full minute so every beat is counted. Not doubling: that assumes a regular rhythm. Not brachial 30 seconds: still a short count. Not radial 15 seconds: shortest count, least accurate."}, {"ty": "mc", "d": 2, "q": "Which statement about blood pressure cuff selection for a child is correct?", "o": ["The cuff must be proportionate to the child's extremity", "One cuff size works for all children under 3 years", "A smaller cuff is more accurate on thin arms", "Cuff size is chosen by the child's age only"], "a": [0], "y": "Right: cuff size is matched to limb size, not age. A cuff that is too small reads falsely high and one that is too large reads falsely low. Not one size for all: infants differ from toddlers. Not smaller is better: it falsely raises the reading. Not age only: limb size decides."}, {"ty": "mc", "d": 2, "q": "A nurse reviews vital signs for a 12-month-old: pulse 96, respirations 26, BP 70/45. Which conclusion is correct?", "o": ["All values are within expected ranges for age", "The heart rate is low for age", "The respiratory rate is high for age", "The blood pressure is low for age"], "a": [0], "y": "Right: at 1 year, pulse is about 90-100, respirations 20-30 and BP 60-78/40-52. Pulse 96, RR 26 and BP 70/45 all fit. Not low pulse: 96 is within 90-100. Not high resp: 26 is within 20-30. Not low BP: 70/45 is within range."}, {"ty": "sata", "d": 2, "q": "Which findings are expected vital signs for a healthy 4-year-old? Select all that apply.", "o": ["Pulse 88", "Respirations 23", "Blood pressure 100/60", "Temperature 101.5 F", "Respirations 32", "Pulse 130"], "a": [0, 1, 2], "y": "Right: preschool pulse is 60-110, resp 21-25 and BP 86-122/44-84. Pulse 88, resp 23 and BP 100/60 fit. Wrong: 101.5 F is a fever (expected 98.6). Resp 32 and pulse 130 are above the preschool range."}, {"ty": "mc", "d": 2, "q": "An infant weighed 3,000 g at birth. About what weight is expected at 1 year?", "o": ["9,000 g", "6,000 g", "12,000 g", "7,500 g"], "a": [0], "y": "Right: birth weight triples by 1 year, so 3,000 x 3 = 9,000 g. Not 6,000 g: that is the doubling point at 4-6 months. Not 12,000 g: quadruples, too much. Not 7,500 g: no milestone matches."}, {"ty": "mc", "d": 2, "q": "A newborn weighed 3,200 g at birth and weighs 2,900 g on day 5. How should the nurse interpret this?", "o": ["An expected loss, because up to 10% is normal in week 1", "Excessive loss that needs formula supplementation", "Failure to thrive needing referral", "A scale error, since newborns should not lose weight"], "a": [0], "y": "Right: 10% of 3,200 is 320 g, and a loss of 300 g is within that. Birth weight is regained by 10-14 days. Not excessive: loss is under 10%. Not failure to thrive: that is a pattern of poor gain over time. Not a scale error: loss is normal."}, {"ty": "mc", "d": 2, "q": "A baby girl had a head circumference of 34 cm at birth. Based on expected growth, what is it at 3 months?", "o": ["40 cm", "37 cm", "43 cm", "35 cm"], "a": [0], "y": "Right: head circumference grows 2 cm per month for the first 3 months, so 34 + 6 = 40 cm. Not 37 cm: that is only 1 cm per month. Not 43 cm: that would be 3 cm per month. Not 35 cm: that is the slow second-half-of-year rate."}, {"ty": "mc", "d": 2, "q": "A newborn is 50 cm long. About what length is expected at 12 months?", "o": ["75 cm", "60 cm", "100 cm", "65 cm"], "a": [0], "y": "Right: length increases 50% by 12 months, so 50 x 1.5 = 75 cm. Not 60 cm or 65 cm: too little growth. Not 100 cm: that would double the length."}, {"ty": "mc", "d": 2, "q": "At about what age are head and chest circumference approximately equal?", "o": ["2 years", "Birth", "6 months", "4 years"], "a": [0], "y": "Right: head and chest circumference become equal by about 2 years. Not birth: the head is larger at birth. Not 6 months: the head is still larger. Not 4 years: already equal by then."}, {"ty": "mc", "d": 2, "q": "A 3-year-old measured 88 cm a year ago and measures 95 cm today. What does the nurse conclude?", "o": ["Growth is within the expected 6.4-9 cm a year", "Growth is too slow and needs referral", "Growth is too fast for age", "Growth cannot be judged without a chart"], "a": [0], "y": "Right: a 7 cm gain falls inside the preschool range of 6.4-9 cm per year. Not slow: 7 cm is within range. Not fast: it is well below 9 cm. Not chart-dependent: the yearly gain can be compared to the expected range."}, {"ty": "mc", "d": 2, "q": "A 6-year-old has tracked at the 50th percentile for weight and now plots at the 10th. What is the nurse's priority?", "o": ["Plan further assessment of the percentile drop", "Reassure the parents because children vary widely", "Recheck the weight in one year", "Start a high-calorie diet"], "a": [0], "y": "Right: a significant shift from the child's usual percentiles means further assessment is needed. Not reassurance: it overlooks a real change. Not waiting a year: delays evaluation. Not a diet first: you assess the cause before treating."}, {"ty": "mc", "d": 2, "q": "Which statement about growth charts is accurate?", "o": ["Most children follow one percentile curve", "A healthy child must stay on the 50th percentile", "The same chart is used for every diagnosis", "Only weight is plotted for infants"], "a": [0], "y": "Right: children tend to follow their own percentile line. Not the 50th: any consistent percentile can be healthy. Not one chart: specialized charts exist (for example Down syndrome and breastfed infants). Not weight only: weight, length and head circumference are all plotted."}, {"ty": "sata", "d": 2, "q": "A nurse is teaching a student about measuring length. Which statements are correct? Select all that apply.", "o": ["Use a recumbent board for children under 2 years", "The board is used when the child is too ill to stand", "Accuracy should be to 0.1 cm", "Stand children against a wall once they walk at 12 months", "Use the board only for children taller than 85 cm", "Length is easy to measure and needs no practice"], "a": [0, 1, 2], "y": "Right: a length board is for children under 2 years, under 85 cm or too ill to stand, accurate to 0.1 cm. Wrong: standing measurements start at 2 years, the board is for children under 85 cm (not over), and length takes experience and patience."}, {"ty": "ord", "d": 2, "q": "Place these infant weight events in order from earliest to latest.", "items": ["Loses up to 10% of birth weight", "Regains birth weight", "Doubles birth weight", "Triples birth weight"], "y": "Week 1 the loss happens. By 10-14 days birth weight is back. Doubling occurs at 4-6 months. Tripling occurs at 1 year."}, {"ty": "mat", "d": 2, "q": "Match each age group to its expected height gain.", "pairs": [["Infant (first 6 months)", "2.5 cm a month"], ["Toddler", "7.5 cm a year"], ["Preschool", "6.4-9 cm a year"], ["School age", "5 cm a year"]], "y": "Infants grow 2.5 cm a month for 6 months. Toddlers 7.5 cm a year, preschoolers 6.4-9 cm, school age 5 cm."}, {"ty": "mc", "d": 2, "q": "A nurse must take an infant's blood pressure and cannot use a leg. Which site is correct?", "o": ["Right upper arm", "Left upper arm", "Either arm, the left is easier to reach", "Radial artery at the wrist only"], "a": [0], "y": "Right: if a leg cannot be used, use the right arm, since a heart defect can give a false reading on the left. Not the left arm for that reason. Not either arm: the side matters. Not wrist only: it is not the preferred infant site."}, {"ty": "mc", "d": 2, "q": "A parent worries because a newborn's heart rate is 140 beats per minute. What is the best response?", "o": ["That is within the expected newborn range of 120-160", "That is too fast and needs a cardiac workup", "That is too slow for a newborn", "It is expected only after the first year"], "a": [0], "y": "Right: 120-160 is the newborn norm, and your slide's 120-140 sits inside it. Too fast and too slow are not true for 140. A rate of 90-100 is the 1-year range."}, {"ty": "mc", "d": 2, "q": "Which trend describes vital signs as a child grows from newborn to school age?", "o": ["Pulse and respirations fall while blood pressure rises", "Pulse rises and blood pressure falls", "All three fall together", "All three rise together"], "a": [0], "y": "Right: pulse and respirations fall and blood pressure rises with age. The other patterns are reversed or do not fit."}, {"ty": "mc", "d": 3, "q": "A nurse takes vital signs at rest on four children. Which finding needs follow-up?", "o": ["A 4-year-old with respirations of 34 per minute", "A 9-month-old with a pulse of 112 per minute", "A 13-year-old with a pulse of 58 per minute", "A 2-year-old with a temperature of 99 F (37.2 C)"], "a": [0], "y": "Right: the preschool respiratory range is 21-25, so 34 is well above it and needs assessment for distress or infection. Why not the pulse of 112 at 9 months: infant rates fall from 120-140 at birth toward 90-100 at 1 year, so 112 sits in the expected band. Why not the pulse of 58 at 13 years: adolescents run 50-90. Why not 99 F at 2 years: the toddler norm on your slide is 99 F."}, {"ty": "mc", "d": 3, "q": "A 3-month-old has a cast on the right leg and a cast on the left leg. The nurse must take a blood pressure. Which choice follows the slide?", "o": ["Use the right upper arm", "Use the left upper arm, since the left arm is usually more accessible", "Use the radial artery with a small cuff", "Skip it until a leg is free, since arm pressures are unreliable"], "a": [0], "y": "Right: the slide note says if a leg cannot be used, use the right upper arm. Why not the left arm: it can read falsely with a heart defect, so it is the wrong side. Why not the radial artery: the cuff-placement figure shows the radial site, but the infant sites on your slide are the leg or the right upper arm. Why not waiting: a pressure can still be obtained safely from the right arm, so delaying care is not needed."}, {"ty": "mc", "d": 3, "q": "A newborn weighed 3,500 g at birth. On day 5 she weighs 3,200 g and is feeding well. How should the nurse interpret this?", "o": ["About 8.6% loss, regained by 10-14 days", "A 14% loss, which is excessive and needs a supplement", "A 3% loss, which is below the expected range", "A 6% gain, which shows the baby is overfed"], "a": [0], "y": "Right: 300 g divided by 3,500 g is about 8.6%, inside the 10% allowed in week 1, and birth weight is regained by 10-14 days. Why not 14%: that figure comes from dividing by the wrong weight. Why not 3%: the arithmetic does not give that. Why not a gain: the weight went down, not up, so overfeeding does not apply."}, {"ty": "mc", "d": 3, "q": "At birth an infant measured 34 cm for head circumference and 40 cm at 3 months. Which head circumference fits expected growth at 6 months?", "o": ["43 cm", "41 cm", "45 cm", "46 cm"], "a": [0], "y": "Right: growth is 2 cm a month for 3 months (34 to 40), then 1 cm a month for months 4-6, so 40 + 3 = 43 cm. Why not 41: that adds only 1 cm for the whole 3 months. Why not 45: that keeps the 2 cm a month rate, which slows after 3 months. Why not 46: that adds 2 cm a month for all 6 months, which overshoots."}, {"ty": "mc", "d": 3, "q": "A toddler's radial pulse is counted for 30 seconds and gives 28 beats with an uneven rhythm. What is the next step?", "o": ["Listen to the apical pulse for 1 full minute", "Record 56 beats per minute", "Repeat the radial count for 15 seconds and multiply by 4", "Record the pulse as normal because toddlers have irregular rhythms"], "a": [0], "y": "Right: the slide says to count apically for a full minute when the rhythm is irregular. Why not 56 recorded: doubling a 30-second count is only valid for a regular rhythm. Why not 15 seconds x 4: a shorter count magnifies error in an uneven rhythm. Why not calling it normal: an irregular rhythm needs to be counted properly, then reported if it persists."}, {"ty": "mc", "d": 3, "q": "A new nurse says four things about growth. Which one needs correcting?", "o": ["A fall from the 90th to the 30th percentile is normal", "A child usually stays near the same percentile", "A child with Down syndrome may be plotted on a specialized chart", "Length and weight are plotted together with head circumference in an infant"], "a": [0], "y": "Right: a large percentile drop is not normal variation and needs assessment. Why not the first statement: it is true, children follow their own curve. Why not the second: specialized charts exist for conditions like Down syndrome. Why not the fourth: infants have head circumference tracked along with length and weight."}, {"ty": "mc", "d": 3, "q": "A 12-month-old weighed 3.4 kg and measured 51 cm at birth. Now she is 10.3 kg and 76 cm. How does the nurse interpret this?", "o": ["Both weight and length match expected growth", "Weight is delayed because it should be four times birth weight", "Length is excessive because it should be up only 25%", "Weight is excessive because it should only have doubled"], "a": [0], "y": "Right: weight should triple by 1 year (3.4 x 3 is 10.2 kg) and length should rise about 50% (51 x 1.5 is 76.5 cm). Why not four times: that is not a milestone on your slide. Why not 25%: the slide gives 50% by 12 months. Why not doubled: doubling occurs at 4-6 months, tripling at 1 year."}, {"ty": "mc", "d": 3, "q": "Which pair is correctly matched?", "o": ["Infant: apical pulse for 1 full minute", "Infant: radial pulse for 30 seconds then doubled", "School-age child: apical pulse for 30 seconds then doubled", "Adolescent: brachial pulse for 15 seconds then multiplied by 4"], "a": [0], "y": "Right: infants get an apical full minute. Why not the radial for an infant: it is too small and the rate varies. Why not apical 30 seconds for a school-age child: the slide uses the radial pulse, with a full minute if irregular. Why not brachial for 15 seconds: no age group on your slide uses a 15-second count."}, {"ty": "mc", "d": 3, "q": "A nurse is choosing a cuff for a 2-year-old whose cuff is too small. What reading results and why?", "o": ["A falsely high reading from too little tissue wrapped", "A falsely low reading, because the cuff squeezes the artery", "A normal reading, because cuff size only matters in adults", "An unreadable result, because the sound cannot be heard"], "a": [0], "y": "Right: your slide says a cuff that is too small reads falsely high and one that is too large reads falsely low. Why not low: that is what a too-large cuff does. Why not size not mattering: the cuff must be proportionate to the child's extremity. Why not unreadable: the sound is heard, but the number is wrong."}, {"ty": "sata", "d": 3, "q": "Which findings are expected for a healthy 1-year-old? Select all that apply.", "o": ["Pulse of about 90-100", "Respirations near 20-30", "Weight about three times birth weight", "Length about 50% above birth length", "Weight twice birth weight", "Head circumference increasing 2 cm each month", "Anterior fontanel already closed"], "a": [0, 1, 2, 3], "y": "Right: 90-100 pulse, 20-30 respirations, triple weight and 50% longer length. Why not twice birth weight: that is the 4-6 month point. Why not 2 cm a month: that rate applies only to the first 3 months and slows to 0.5 cm a month in the second 6 months. Why not a closed anterior fontanel: it closes at 12-18 months, so closing before 12 months would be early."}], "inf1": [{"ty": "mc", "d": 2, "q": "A nurse palpates the fontanels of a 9-month-old. The anterior is soft, flat and diamond-shaped. The posterior is closed. What action is appropriate?", "o": ["Document these as expected findings", "Notify the provider about delayed anterior closure", "Plan imaging for the closed posterior fontanel", "Recheck in one week for premature closure"], "a": [0], "y": "Right: the anterior closes at 12-18 months (still open at 9 months) and the posterior closes by 8 weeks. Not delayed: the anterior stays open until 12-18 months. Not imaging: the posterior should be closed. Not premature closure: nothing here suggests it."}, {"ty": "mc", "d": 2, "q": "Which statement about the infant's fontanels is correct?", "o": ["The posterior is triangular and closes by 8 weeks", "The anterior is triangular and closes by 8 weeks", "The posterior is diamond-shaped and closes at 12-18 months", "Both close by 6 months"], "a": [0], "y": "Right: posterior is triangular and closes by about 2 months. The anterior is the diamond and closes at 12-18 months. The other options swap shapes and timing, and neither fontanel closes by 6 months."}, {"ty": "mc", "d": 2, "q": "A nurse strokes the cheek of a 5-month-old and the infant does not turn toward the touch. What does the nurse understand?", "o": ["The rooting reflex is expected to be gone by 3 months", "The infant has a neurologic deficit", "The reflex should persist until 12 months", "The infant is full and the test must be repeated after feeding"], "a": [0], "y": "Right: rooting disappears by about 3 months, so absence at 5 months is expected. Not a deficit: a missing reflex is only abnormal if it should still be present. Not 12 months: that is the Babinski timeline. Not full: hunger does not drive this reflex at 5 months."}, {"ty": "mc", "d": 2, "q": "A nurse strokes the sole of a 7-month-old's foot and the toes fan upward. What should the nurse do?", "o": ["Document it as expected until about 12 months", "Report it as an abnormal neurologic sign", "Reassess after 9 months for the plantar reflex", "Teach the parents about loss of the plantar reflex"], "a": [0], "y": "Right: a positive Babinski (toes fan, big toe up) is expected until about 12 months. Not abnormal: it is only concerning after the expected age. Not plantar: that is toe curling when the base of the toes is touched, a different reflex. The teaching option confuses the two."}, {"ty": "mc", "d": 2, "q": "A 6-month-old lies on the back with the head turned right. The right arm and leg extend while the left side flexes. What does the nurse suspect?", "o": ["A persistent asymmetric tonic neck reflex needing follow up", "An expected neck righting response at this age", "A normal Moro reflex that needs no follow-up", "An expected sideways parachute response at this age"], "a": [0], "y": "Right: the asymmetric tonic neck (fencing) reflex should be gone by 4 months, so persistence at 6 months is a neurologic concern. Not neck righting: that appears at 4-6 months and the head and body turn together. Not Moro: that is arms flinging out and in. Not parachute: that is arms extending to break a fall."}, {"ty": "sata", "d": 2, "q": "Which reflexes are expected in a healthy 2-month-old? Select all that apply.", "o": ["Moro", "Palmar grasp", "Asymmetric tonic neck", "Rooting", "Parachute (sideways)", "Parachute (forward)", "Neck righting"], "a": [0, 1, 2, 3], "y": "Right: Moro, palmar grasp, asymmetric tonic neck and rooting are primitive reflexes still present at 2 months (they go at 4, 4-6, 4 and 3 months). Wrong: neck righting appears at 4-6 months and the parachute reflexes at 6 and 6-7 months."}, {"ty": "ord", "d": 2, "q": "Place these reflexes in the order they normally disappear, earliest first.", "items": ["Step", "Rooting", "Moro", "Plantar", "Babinski"], "y": "Step goes at 4-8 weeks, rooting at 3 months, Moro at 4 months, plantar at 9 months and Babinski at 12 months."}, {"ty": "mc", "d": 2, "q": "A parent asks when to start solid foods. Which response is best?", "o": ["At 4 to 6 months, rice cereal by spoon", "At 2 months, to help the infant sleep longer", "At 3 months, mixed in the bottle", "After 9 months, to prevent allergies"], "a": [0], "y": "Right: solids start at 4-6 months with iron-fortified rice cereal (least allergenic) by spoon. Not 2 or 3 months: too early, and cereal in a bottle is an aspiration risk. Not after 9 months: delaying is not needed."}, {"ty": "mc", "d": 2, "q": "A mother is exclusively breastfeeding her 4-month-old. Which supplement does the nurse expect to be added at this age?", "o": ["Iron", "Vitamin D", "Vitamin C", "Zinc"], "a": [0], "y": "Right: iron is supplemented at 4 months in exclusively breastfed infants. Not vitamin D: that is started in the first week of life (breast milk lacks it). Not vitamin C or zinc: no routine supplement at this age."}, {"ty": "sata", "d": 2, "q": "Which instructions are appropriate for a parent of a 7-month-old? Select all that apply.", "o": ["Introduce one new food at a time, about 5 days apart", "Feed solids by spoon with the infant sitting supported", "Never prop the bottle during feeding", "Offer a cup for practice", "Add honey to cereal for flavor", "Put cereal in the bottle at night", "Use a sippy cup for all drinks"], "a": [0, 1, 2, 3], "y": "Right: new foods one at a time about 5 days apart, spoon feeding in a supported seat, no propped bottles (aspiration and nursing bottle mouth), and a cup from 6 months. Wrong: honey is for after 12 months, cereal in a bottle is an aspiration risk, and sippy cups are avoided for general use."}, {"ty": "mc", "d": 2, "q": "A parent reports the 6-month-old is drooling, rubbing the ears and irritable with a mild fever. Which suggestion is appropriate?", "o": ["Give acetaminophen if sleep is disrupted and wipe the gums with a cool cloth", "Give ibuprofen, which is considered safe at any age of infancy", "Give aspirin for the fever and gum pain relief at night", "Restrict all chewing items until the teeth have erupted"], "a": [0], "y": "Right: acetaminophen if it disrupts sleep and a clean cool washcloth on the teeth and gums. Not ibuprofen: only over 6 months. Not aspirin: not used for infants. Not restricting chewing: a safe clean object helps."}, {"ty": "mc", "d": 2, "q": "Which finding in a 2-day-old newborn is expected and needs no intervention?", "o": ["Blue hands and feet with a pink trunk", "Blue lips and tongue", "Blue color of the trunk with grunting", "Mottling of the trunk that persists"], "a": [0], "y": "Right: acrocyanosis (blue hands and feet) is normal and fades over the first few months. Not blue lips and tongue: central cyanosis, a sign of poor oxygenation. Not grunting with a blue trunk: respiratory distress. Not persistent mottling: the immature-system color change should resolve in the first weeks."}, {"ty": "mc", "d": 2, "q": "Which statement by a parent shows understanding of safe infant sleep?", "o": ["I will place my baby on the back with a bare crib", "A stuffed toy in the crib will keep her calm", "A pacifier increases the risk so I will avoid it", "I will put her on her stomach so she does not choke"], "a": [0], "y": "Right: supine, no pillow, no bumper pads, no toys. Not the stuffed toy: suffocation risk. Not avoiding the pacifier: pacifiers help reduce SIDS risk. Not tummy sleeping: back sleeping lowers SIDS risk."}, {"ty": "mc", "d": 2, "q": "Which water heater temperature does the nurse teach for a home with an infant?", "o": ["120 F", "140 F", "100 F", "130 F"], "a": [0], "y": "Right: 120 F lowers burn risk. 130 F and 140 F can scald in seconds. 100 F is not the recommended setting."}, {"ty": "mc", "d": 2, "q": "A nurse notices an infant crib with slats 3 inches apart. What teaching is the priority?", "o": ["Slats should be no more than 2 inches apart", "Slats up to 4 inches are safe once the infant sits", "Raise the mattress to its highest position", "Add bumper pads to cover the gap"], "a": [0], "y": "Right: crib slats no more than 2 inches apart prevent head entrapment. Not 4 inches: too wide at any age. Not the highest mattress: it is lowered as the infant grows. Not bumper pads: they are suffocation hazards."}, {"ty": "mc", "d": 2, "q": "Which stool pattern is expected for a formula-fed 2-month-old?", "o": ["1-2 soft brown to yellow stools a day", "A curdy yellow stool after every feeding", "One hard stool every 3 days", "Several watery green stools a day"], "a": [0], "y": "Right: formula-fed stools are formed, soft and brown to yellow, 1-2 times a day. Not after every feeding and curdy yellow: that is the breastfed pattern. Not hard every 3 days: suggests constipation. Not watery green: suggests diarrhea."}, {"ty": "mc", "d": 2, "q": "A parent plans to buy a walker for an 8-month-old. What is the best teaching?", "o": ["Walkers can delay growth and development", "A walker speeds up independent walking", "A walker is safe if used for short times", "A walker is safe once stair gates are installed"], "a": [0], "y": "Right: walkers are discouraged because they delay growth and development. Not faster walking: the opposite is true. Not safe in short periods or behind gates: the developmental and injury concerns remain."}, {"ty": "mc", "d": 2, "q": "Which sleep pattern is expected for a healthy 12-month-old?", "o": ["Sleeps through the night with 1-2 naps", "Sleeps 14-15 hours a day with 4 naps", "Wakes every 2 hours at night", "Sleeps 9-11 hours a day with no naps"], "a": [0], "y": "Right: by 12 months infants sleep through the night and take 1-2 naps. Not 14-15 hours: that is the newborn figure. Not waking every 2 hours: not expected at 12 months. Not 9-11 hours: that is the 3-4 month figure."}, {"ty": "mc", "d": 2, "q": "A mother asks when to expect the posterior fontanel to close. ATI words it in months. What is correct?", "o": ["By 2 months", "By 12 months", "By 18 months", "By 6 months"], "a": [0], "y": "Right: 2 months equals 8 weeks. 12-18 months is the anterior fontanel. At 6 months an open posterior fontanel needs investigation."}, {"ty": "mc", "d": 2, "q": "A 3-month-old turns the head to the right and the right arm and leg extend. What does the nurse document?", "o": ["An asymmetric tonic neck reflex, expected at this age", "A seizure", "An abnormal Babinski reflex", "A parachute reflex"], "a": [0], "y": "Right: the fencing position is expected until about 4 months. A seizure is not described. Babinski is toe fanning. Parachute is arm extension when falling."}, {"ty": "mc", "d": 2, "q": "A parent asks about starting solids for a healthy 5-month-old. Which advice is correct?", "o": ["Start with iron-fortified rice cereal by spoon and add one new food every 5 days", "Start with fruit so the baby accepts it", "Add cereal to the bottle at night", "Introduce several new foods together"], "a": [0], "y": "Right: rice cereal first, one new food at a time over about 5 days. Not fruit first. Not cereal in a bottle. Not several foods: you could not identify an allergy."}, {"ty": "mc", "d": 3, "q": "A mother notices the soft spot on her crying 5-month-old's head bulges, then flattens when he calms. What is the best action?", "o": ["Reassess when calm and document as expected", "Notify the provider at once for raised pressure", "Apply gentle pressure to the soft spot to test it", "Tell her to stop feeding and call emergency services"], "a": [0], "y": "Right: a fontanel can bulge briefly with crying, and it returns to flat when calm. Why not notifying now: a bulge that stays when the baby is calm and upright is the worrying sign. Why not pressure: the fontanel is never pressed on. Why not emergency services: nothing in this picture is an emergency."}, {"ty": "mc", "d": 3, "q": "At the 8-month visit the nurse finds a strong palmar grasp when the palm is stroked. How does the nurse interpret this?", "o": ["Abnormal, since it should fade by 4-6 months", "Expected, because it persists until 12 months", "Expected, because it is a protective reflex", "Abnormal, because it should appear only after 9 months"], "a": [0], "y": "Right: a primitive reflex that lasts past its age points to a neurologic problem. Why not persisting to 12 months: that is not the palmar timeline. Why not protective: palmar grasp is primitive, and the protective ones are the parachute and neck righting. Why not appearing after 9 months: it is present at birth and fades, not the reverse."}, {"ty": "mc", "d": 3, "q": "A 2-day-old startles to a loud noise. The right arm opens and extends, and the left arm stays flexed. What is the priority?", "o": ["Report the one-sided response as an injury", "Document a normal Moro reflex", "Document a normal tonic neck reflex", "Repeat in 4 months, since Moro disappears then"], "a": [0], "y": "Right: a Moro reflex should be symmetric, and a one-sided reaction suggests an injury such as a fractured collarbone or nerve injury. Why not a normal Moro: normal is both arms. Why not tonic neck: that reflex needs head turning, not a startle. Why not waiting 4 months: the date it disappears does not make the abnormal finding wait."}, {"ty": "mc", "d": 3, "q": "A mother of a 5-month-old says, 'He ate rice cereal for two days, so today I added bananas and applesauce.' What is the best response?", "o": ["Add one new food and wait about 5 days", "That is fine since fruit is hypoallergenic", "Return to breast milk only until 8 months", "Add the foods but wait 3 days between them"], "a": [0], "y": "Right: one new food over about 5 days lets an allergy show up and be traced. Why not hypoallergenic: a food does not need to be risky to cause a reaction, and combining two hides which one did. Why not milk only until 8 months: solids start at 4-6 months. Why not 3 days: the slide teaching is 5 days."}, {"ty": "mc", "d": 3, "q": "Which statement by a parent of an exclusively breastfed 4-month-old shows correct teaching?", "o": ["I give iron now and gave vitamin D at week 1", "I wait to start vitamin D until 6 months", "I give iron only if he is also taking formula", "I give no vitamin D because breast milk covers it"], "a": [0], "y": "Right: breastfed infants need vitamin D from the first week and iron at 4 months. Why not waiting to 6 months: that leaves the early weeks uncovered. Why not iron only with formula: formula is iron fortified, so a formula-fed baby needs the iron less, not more. Why not no vitamin D: breast milk is low in it."}, {"ty": "mc", "d": 3, "q": "Which parent statement about sleep safety needs teaching?", "o": ["I put a small stuffed animal in the crib", "I place him on his back with a pacifier", "I keep the crib mattress at the lowest setting", "I keep the crib free of pillows and bumper pads"], "a": [0], "y": "Right: stuffed toys, pillows and bumpers are not allowed in the crib because they can suffocate. Why not the back and pacifier: your slide lists both as SIDS prevention. Why not the lowest mattress: this prevents a climbing fall once he can stand. Why not no pillows or bumpers: the slide says to avoid them."}, {"ty": "mc", "d": 3, "q": "A breastfeeding mother gives a bottle of formula at night 'to get a longer sleep.' Which response is best?", "o": ["Night bottles cut milk supply, so nurse every 3-4 hours", "Formula at night is encouraged to promote sleep", "Stop all breastfeeding and move to formula", "Breastfeed every hour including at night"], "a": [0], "y": "Right: your slide notes say no night bottles because they disrupt production. Why not encouraging them: that is the opposite of the teaching. Why not stopping breastfeeding: nothing here requires it. Why not every hour: the pattern on your slide is every 3-4 hours."}, {"ty": "mc", "d": 3, "q": "A newborn 2 hours old has blue hands and feet, pink lips and tongue, a heart rate of 140 and respirations of 48. What is the nurse's best action?", "o": ["Document acrocyanosis and keep him warm", "Start oxygen at once for central cyanosis", "Call a code for cardiac failure", "Notify the provider for hypoglycemia"], "a": [0], "y": "Right: blue hands and feet with pink lips is acrocyanosis, which is normal, and warming helps. Why not oxygen: central cyanosis shows on the lips and tongue, not just the extremities. Why not a code: the heart rate and respirations are in the newborn range. Why not hypoglycemia: nothing in this picture points to it."}, {"ty": "mc", "d": 3, "q": "Which reflex and age of disappearance are correctly paired?", "o": ["Plantar grasp, 9 months", "Rooting, 9 months", "Moro, 12 months", "Palmar grasp, 3 months"], "a": [0], "y": "Right: plantar grasp goes at 9 months. Why not rooting at 9: it fades by 3 months. Why not Moro at 12 months: it disappears by about 4 months. Why not palmar at 3 months: it goes at 4-6 months."}, {"ty": "mc", "d": 3, "q": "An infant stiffens and extends the arm and leg on the side the head is turned toward while lying supine. When should this fade?", "o": ["By about 4-6 months", "By 2 weeks", "By 9 months", "It persists for life"], "a": [0], "y": "Right: the asymmetric tonic neck, the fencing pose, fades around 4-6 months. Why not 2 weeks: it is still present then. Why not 9 months: that is the plantar grasp. Why not for life: protective reflexes persist, but this primitive one does not."}], "inf2": [{"ty": "mc", "d": 2, "q": "A nurse pulls a 4-month-old to a sitting position and the head stays in line with the trunk. Which action is correct?", "o": ["Document it as an expected 4-month finding", "Report it as delayed motor development", "Reassess for a persistent primitive reflex", "Teach the parents about tummy time"], "a": [0], "y": "Right: no head lag is expected by 4 months. Not delayed: the finding is normal. Not a primitive reflex: this is head control, not a reflex. Not tummy time teaching: not needed for a normal finding."}, {"ty": "mc", "d": 2, "q": "Which milestone should the nurse expect in a 6-month-old?", "o": ["Rolls completely over", "Sits without support", "Neat pincer grasp", "Waves bye-bye"], "a": [0], "y": "Right: rolling completely over is the 6-month gross motor milestone. Not sitting without support: usually by 8 months. Not neat pincer: by 11 months. Not waving: a 9-month social skill."}, {"ty": "mc", "d": 2, "q": "A parent says the 9-month-old looks for a toy hidden under a blanket. Which concept does this show?", "o": ["Object permanence", "Mental representation", "Parallel play", "Stranger fear"], "a": [0], "y": "Right: looking for a hidden object shows the idea that it still exists (object permanence, Piaget sensorimotor). Not mental representation: using symbols to think about things, a later skill. Not parallel play: a toddler behavior. Not stranger fear: an emotional response."}, {"ty": "mc", "d": 2, "q": "Which activity best promotes development in a 6-month-old?", "o": ["Taking turns making sounds with the infant", "Naming letters with flash cards", "Placing the infant in a walker", "Watching television programs"], "a": [0], "y": "Right: reciprocal play and taking turns with sounds matches 6-month language and social skills. Not flash cards: beyond the age. Not a walker: delays development. Not television: not recommended for infants."}, {"ty": "sata", "d": 2, "q": "Which toys are appropriate for an 8-month-old? Select all that apply.", "o": ["Plastic cups and bowls", "Large building blocks", "Stacking toys", "Push-pull toys", "Balloons", "Small beads", "Marbles"], "a": [0, 1, 2, 3], "y": "Right: plastic cups, bowls, large blocks, stacking toys and push-pull toys are suggested at 8-12 months. Wrong: balloons, beads and marbles are aspiration and choking hazards."}, {"ty": "mc", "d": 2, "q": "A nurse answers promptly when an infant cries. Which Erikson task does this support?", "o": ["Trust versus mistrust", "Autonomy versus shame and doubt", "Initiative versus guilt", "Industry versus inferiority"], "a": [0], "y": "Right: infants decide whether others will meet their basic needs (trust vs mistrust, birth to 1 year). The other three are later stages: toddler, preschool and school age."}, {"ty": "mc", "d": 2, "q": "An infant explores objects by putting them in the mouth. Which developmental stage does this reflect?", "o": ["Freud's oral stage", "Freud's anal stage", "Erikson's autonomy stage", "Piaget's preoperational stage"], "a": [0], "y": "Right: in the oral stage the mouth, tongue and gums are the focus of pleasurable sensation. Not anal: that is the toddler stage. Not autonomy: toddler. Not preoperational: preschool."}, {"ty": "mc", "d": 2, "q": "A 2-month-old born prematurely cannot hold the head up prone. Which action is appropriate?", "o": ["Use adjusted age and reevaluate later", "Diagnose a developmental delay at this visit", "Refer to a specialist immediately for testing", "Avoid tummy time until the child is older"], "a": [0], "y": "Right: premature infants have delayed milestones, so use adjusted age, give more time and reevaluate. Not a diagnosis: too soon. Not an immediate referral: reevaluate first. Not avoiding tummy time: supervised tummy time is encouraged."}, {"ty": "mc", "d": 2, "q": "Which tool is a parent-completed questionnaire used to prescreen before the Denver II?", "o": ["Prescreening Developmental Questionnaire (PDQ II)", "Denver II Developmental Screening Test", "Tanner scale", "Apgar score"], "a": [0], "y": "Right: the PDQ II is completed by the parent as a prescreen. Not Denver II: the nurse observes the child. Not Tanner: rates sexual maturity. Not Apgar: scores the newborn at birth."}, {"ty": "mc", "d": 2, "q": "Which statement about the Denver II is correct?", "o": ["The nurse observes four skill areas", "It is a form the parent completes and mails back", "It measures only language skills in the child", "It tests intelligence and school readiness only"], "a": [0], "y": "Right: the Denver II is an observed screen covering personal-social, fine motor, language and gross motor skills. Not a mailed form: that describes a parent questionnaire. Not language only or intelligence only: it covers four developmental areas."}, {"ty": "mc", "d": 2, "q": "In which direction does motor development progress?", "o": ["Head to toe and center to outward", "Toe to head and outward to center", "Hands to arms and then trunk", "Legs to arms and then neck"], "a": [0], "y": "Right: cephalocaudal (head first) and proximodistal (center first). The other options reverse the order."}, {"ty": "mc", "d": 2, "q": "A 9-month-old cries when the mother leaves the room. How should the nurse interpret this?", "o": ["An expected social response at 9 months", "A sign of insecure attachment", "A sign of mistrust", "Regression in development"], "a": [0], "y": "Right: reacting when a caregiver leaves the room is a 9-month social milestone. Not insecure attachment or mistrust: this is expected. Not regression: it shows normal development."}, {"ty": "mc", "d": 2, "q": "An infant coos, makes consonant sounds and imitates sounds back. At what age is this expected?", "o": ["4 months", "2 months", "6 months", "9 months"], "a": [0], "y": "Right: cooing, consonant sounds and imitating sounds are the 4-month language skills. At 2 months infants cry and make sounds, at 6 they squeal and blow raspberries, at 9 they use longer syllables like 'mama'."}, {"ty": "mat", "d": 2, "q": "Match the milestone to the age.", "pairs": [["Social smile when spoken to", "2 months"], ["Brings hand to mouth, grasps with both hands", "4 months"], ["Rolls completely over", "6 months"], ["Crude pincer grasp", "9 months"]], "y": "2 months: social smile. 4 months: hand to mouth, both hands. 6 months: rolls completely over. 9 months: crude pincer."}, {"ty": "ord", "d": 2, "q": "Place these milestones in order from earliest to latest.", "items": ["Holds head up prone", "Brings hand to mouth", "Rolls completely over", "Crude pincer grasp"], "y": "Holds head up at 2 months, hand to mouth at 4, rolls over at 6, crude pincer at 9."}, {"ty": "mc", "d": 2, "q": "A 6-month-old rolls from front to back, holds the bottle and blows raspberries. How does the nurse interpret this?", "o": ["Expected for age", "Delayed, because the infant is not sitting alone", "Advanced for age", "A sign of poor oral control"], "a": [0], "y": "Right: rolling over, holding a bottle and raspberries fit 6 months. Sitting alone is a 9-month skill. These are not advanced or abnormal."}, {"ty": "mc", "d": 2, "q": "A parent of a 7-month-old who walks with a baby walker asks about it. What is the best response?", "o": ["Walkers can delay growth and development, so avoid them", "Walkers help the baby walk earlier", "Walkers are safe for 2 hours a day", "Walkers replace tummy time"], "a": [0], "y": "Right: your slide note says walkers delay development. They do not help walking, and no time limit makes them safe. Tummy time is separate."}, {"ty": "mc", "d": 3, "q": "At the 9-month visit, which finding needs further evaluation?", "o": ["The infant cannot sit without support", "The infant uses a crude pincer grasp", "The infant looks for a dropped toy", "The infant waves bye-bye"], "a": [0], "y": "Right: by 9 months the infant gets to sitting alone and sits unsupported, usually by 8 months. Why not crude pincer: that is the 9-month fine motor skill. Why not looking for a dropped toy: object permanence fits this age. Why not waving: your 9-month teaching includes bye-bye."}, {"ty": "mc", "d": 3, "q": "At the 4-month visit, which finding is a concern?", "o": ["The head lags when pulled to sitting", "The infant brings a hand to the mouth", "The infant coos and makes consonant sounds", "The infant grasps with both hands"], "a": [0], "y": "Right: there should be no head lag by 4 months. Why not hand to mouth: expected at 4 months. Why not cooing: expected. Why not grasping with both hands: expected."}, {"ty": "mc", "d": 3, "q": "A mother of a 6-month-old rolled over once at 4 months and now does not roll. What does the nurse know?", "o": ["Rolling over is expected by 6 months, so reassess", "Delayed, so refer right away", "Expected only after 9 months", "Abnormal, so start therapy"], "a": [0], "y": "Right: your 6-month gross motor milestone is rolling completely over. Why not 9 months: that is sitting alone. Why not normal: this is an expected skill. Why not not a milestone: it is on the slide."}, {"ty": "mc", "d": 3, "q": "Which action by the parent of a 6-month-old shows an understanding of cephalocaudal development?", "o": ["Neck control before sitting practice", "Teaching finger skills before arm control", "Teaching walking before sitting", "Teaching the pincer grasp before head control"], "a": [0], "y": "Right: cephalocaudal means head to toe, so neck control precedes sitting and walking. Why not fingers before arms: that reverses proximodistal, which is center outward. Why not walking before sitting: it reverses head to toe. Why not pincer before head control: it reverses the order."}, {"ty": "mc", "d": 3, "q": "Which skill reflects proximodistal development?", "o": ["Shoulder control before fingers", "Head control before sitting", "Sitting before walking", "Rolling before crawling"], "a": [0], "y": "Right: proximodistal is center to outward. Why not head control before sitting: that is cephalocaudal. Why not sitting before walking: also cephalocaudal. Why not rolling before crawling: it is a sequence of gross motor skills, not a center-outward example."}, {"ty": "mc", "d": 3, "q": "Which screening tool is completed by the parent and used to decide who needs the full Denver screen?", "o": ["PDQ II", "Denver II", "Infant-Toddler Checklist", "ASQ"], "a": [0], "y": "Right: the PDQ II is a parent-completed prescreen. Why not Denver II: the nurse observes the child in four areas. Why not the Infant-Toddler Checklist: it screens language and communication. Why not ASQ: it is also parent-completed, but it screens at set ages rather than selecting children for the Denver."}, {"ty": "mc", "d": 3, "q": "A nurse wants an observed screen across personal-social, fine motor, language and gross motor areas. Which tool does she use?", "o": ["Denver II", "PDQ II", "ASQ", "Infant Development Inventory"], "a": [0], "y": "Right: Denver II is observed and covers those four areas. Why not PDQ II: parent-completed prescreen. Why not ASQ: parent-completed. Why not the Infant Development Inventory: parent report."}, {"ty": "mc", "d": 3, "q": "A 4-month-old with a normal, term birth does not coo or make consonant sounds and rarely looks at her hands. What is the most likely reasoning?", "o": ["Expected by 4 months, so screen further", "These are expected at 9 months, so reassure", "These skills appear at 2 years, so wait", "Only gross motor skills matter at this age"], "a": [0], "y": "Right: cooing and watching the hands are 4-month skills in two areas. Why not 9 months: that group has longer sounds like mama. Why not 2 years: far too late. Why not gross motor only: development is assessed across areas."}, {"ty": "sata", "d": 3, "q": "Which findings are expected for a 6-month-old? Select all that apply.", "o": ["Rolls completely over", "Raspberries", "Holds a bottle", "Laughs and likes the mirror", "Crude pincer grasp", "Sits alone", "Waves bye-bye"], "a": [0, 1, 2, 3], "y": "Right: the first four are your 6-month items. Why not crude pincer, sitting alone and bye-bye: those belong to the 9-month group."}], "prem": [{"ty": "mc", "d": 2, "q": "A nurse defines prematurity as birth before which gestational age?", "o": ["37 weeks", "34 weeks", "40 weeks", "32 weeks"], "a": [0], "y": "Right: prematurity is birth before 37 weeks. 40 weeks is a full-term pregnancy. 34 and 32 weeks describe subgroups, not the definition."}, {"ty": "mc", "d": 2, "q": "A 9-month-old was born at 28 weeks. What adjusted age does the nurse use?", "o": ["6 months", "3 months", "9 months", "7 months"], "a": [0], "y": "Right: 40 - 28 = 12 weeks early (3 months). 9 - 3 = 6 months. Not 3 months: that subtracts the wrong number. Not 9 months: ignores adjustment. Not 7 months: subtracts only 2 months."}, {"ty": "mc", "d": 2, "q": "An 8-month-old was born at 32 weeks. What adjusted age does the nurse use?", "o": ["6 months", "4 months", "8 months", "7 months"], "a": [0], "y": "Right: 40 - 32 = 8 weeks early (2 months). 8 - 2 = 6 months. Not 4 months: over-subtracts. Not 8 months: no adjustment. Not 7 months: subtracts only 1 month."}, {"ty": "mc", "d": 2, "q": "A 10-month-old was born at 36 weeks. What adjusted age does the nurse use?", "o": ["9 months", "10 months", "6 months", "11 months"], "a": [0], "y": "Right: 40 - 36 = 4 weeks early, about 1 month. 10 - 1 = 9 months. Not 10 months: no adjustment. Not 6 months: over-subtracts. Not 11 months: adds instead of subtracts."}, {"ty": "mc", "d": 2, "q": "Which action reflects correct growth plotting for a premature infant?", "o": ["Plot using the adjusted age", "Plot using the chronological age", "Plot only head circumference", "Skip plotting until age 2"], "a": [0], "y": "Right: growth and milestones are judged using adjusted age. Not chronological: it makes a premature infant look delayed. Not head circumference only: weight and length are also plotted. Not skipping: monitoring is needed."}, {"ty": "num", "d": 2, "q": "A premature infant was born 10 weeks early. The chronological age is 22 weeks. What is the adjusted age in weeks?", "ans": 12, "tol": 0, "unit": "weeks", "y": "Subtract the weeks early from the chronological age: 22 - 10 = 12 weeks."}, {"ty": "sata", "d": 2, "q": "Which problems are common in infants born before 37 weeks? Select all that apply.", "o": ["Immature respiratory system", "Low iron stores", "Low immunoglobulin stores", "GI tract that may not tolerate oral feeds", "Fully myelinated nervous system", "Excess iron stores"], "a": [0, 1, 2, 3], "y": "Right: the slide lists immature breathing and nervous systems, low iron and immunoglobulin stores and an immature GI tract. Wrong: the nervous system is immature, and iron stores are low, not excessive."}, {"ty": "mc", "d": 2, "q": "A parent worries that a 2-month-old born at 30 weeks cannot hold the head up prone. What is the best response?", "o": ["We will use her adjusted age and reevaluate", "This is a sign of cerebral palsy", "She needs physical therapy now", "Keep her on her back only"], "a": [0], "y": "Right: she is 2 months old but was 10 weeks early, so she is only just reaching her due date and this skill is not yet expected. Not cerebral palsy or therapy now: both jump ahead of the adjusted age. Not back only: supervised tummy time is encouraged."}, {"ty": "mc", "d": 2, "q": "Which statement by a parent shows understanding of adjusted age?", "o": ["Her skills are judged as if she were born at 40 weeks", "Her skills are judged by the date she was born", "Her skills are judged by her siblings' ages", "Her skills are judged by her weight only"], "a": [0], "y": "Right: adjusted age judges development as if born at term. The others use the actual birth date, siblings or weight alone, which do not adjust for prematurity."}, {"ty": "mc", "d": 2, "q": "How is adjusted age calculated?", "o": ["Chronological age minus the weeks the infant was early", "Chronological age plus the weeks the infant was early", "Gestational age at birth only", "Weeks early divided by chronological age"], "a": [0], "y": "Right: subtract the weeks early from the chronological age. Adding would make the infant look older. The other two options are not calculations of adjusted age."}, {"ty": "mc", "d": 3, "q": "A baby was born at 30 weeks and is now 8 months old. Which adjusted age should the nurse use?", "o": ["5.5 months", "6 months", "8 months", "4 months"], "a": [0], "y": "Right: 40 - 30 = 10 weeks early, which is 2.5 months, and 8 - 2.5 = 5.5. Why not 6: that treats the baby as 8 weeks early. Why not 8: that ignores prematurity. Why not 4: that treats the baby as 16 weeks early."}, {"ty": "mc", "d": 3, "q": "A 10-month-old born at 34 weeks cannot yet sit alone. What is the best interpretation?", "o": ["Adjusted age is about 8.5 months, so within range", "Chronological age applies, so this is delayed", "Adjusted age is 6 months, so sitting is not expected", "Premature infants never sit alone"], "a": [0], "y": "Right: 6 weeks early is 1.5 months, so adjusted age is 8.5 months, and sitting unsupported is usually by 8 months, so a few weeks of delay is not alarming and calls for reassessment. Why not chronological age: it overcalls delay. Why not 6 months: the arithmetic is off. Why not never: premature babies simply need more time."}, {"ty": "mc", "d": 3, "q": "Why is adjusted age used for a premature infant?", "o": ["Milestones are judged by adjusted age, not birth date", "So the baby is labeled as delayed", "To count age from the due date only for feeding", "Because growth charts stop at term"], "a": [0], "y": "Right: development follows time since conception, so using birth age would label a healthy premature baby as delayed. Why not doses: dosing uses weight. Why not vaccines: the schedule follows chronological age. Why not insurance: unrelated."}
