light and star the focus of family-centered care slide."}]}, {"h": "Positive outcomes of family-centered care", "star": false, "blocks": [{"t": "ul", "items": ["Anxiety is decreased", "Children are calmer and pain management is enhanced", "Recovery times are shortened", "Families' confidence and problem-solving skills improve", "Communication between the health care team and the family improves", "Health care costs decrease (fewer readmissions)", "Health care resources are used more effectively"]}]}, {"h": "Providing a sense of control for a hospitalized child", "star": false, "blocks": [{"t": "ul", "items": ["Provide effective communication and teaching", "Find a balance between neutral and effective communication", "Use verbal and nonverbal communication", "Use developmental techniques for communicating with children", "Assess parent and child learning needs. Create an education plan from individual needs and learning styles", "Help the family get the information and resources they need"]}]}, {"h": "Working with an interpreter", "star": true, "blocks": [{"t": "ul", "items": ["★ Help the interpreter prepare and understand ahead of time what needs to be done", "★ The interpreter is the communication **bridge, not the content expert**. Timing may not match yours", "★ Speak slowly and clearly. Avoid jargon", "★ **Pause every few sentences** so the interpreter can translate", "★ **Talk directly to the family, not the interpreter**", "★ Give the family and interpreter time to respond", "★ Ask the family to **repeat back** their understanding", "★ Say it two or three different ways if needed. Use metaphors", "★ Use an interpreter to make sure the family can read and understand translated written materials", "★ Avoid side conversations during sessions", "★ Speaking another language does not mean someone is a good interpreter", "★ **Do not use children as interpreters**", "==Unique exception, sign language: the family may be used as the interpreter=="]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight and star this slide, and to highlight and star the sign language exception."}]}, {"h": "Goals of child and family education", "star": false, "blocks": [{"t": "ul", "items": ["Improve the child and family's **health literacy**", "Encourage communication with physicians or nurse practitioners", "Improve health outcomes and promote healthy lifestyles", "Encourage involvement of the child and family in care and decisions", "Improve compliance with the care and treatment plan", "Promote a sense of **autonomy and control**"]}]}, {"h": "Learning principles: children and parents", "star": false, "blocks": [{"t": "tbl", "head": ["Who", "Principle"], "rows": [["**Children**", "**Establishing rapport is the first step**. Age and developmental level decide the amount, format and timing of teaching. Make a teaching plan for their stage"], ["**Adolescents**", "==Particularly sensitive about maintaining body image and feelings of control and autonomy=="], ["**Adults (Knowles)**", "Self-directed. Problem focused and task oriented. Want an immediate need satisfied. Value past experiences and beliefs"]]}]}, {"h": "Learning needs assessment", "star": false, "blocks": [{"t": "ul", "items": ["Include the child and family", "Follow the nursing process: **assess, plan, implement, evaluate and document** teaching", "Identify learning styles, preferences and barriers to learning", "Consider cultural factors that affect learning", "Assess **health literacy**"]}, {"t": "note", "k": "anno", "x": "Questions to ask: who cares for the child at home, who is the authority figure, what is the social support structure, are there special dietary needs, are traditional health practices used, are special clothes or items used to maintain health, which religious beliefs, ceremonies and spiritual practices matter daily or to health."}]}, {"h": "Red flags for poor health literacy", "star": false, "blocks": [{"t": "ul", "items": ["Difficulty filling out forms", "Frequently missed appointments", "Noncompliance and no follow-up with treatment", "History of medication errors", "'I forgot my glasses' or 'I'll read this when I get home'", "Cannot answer questions about treatment or medicines", "Avoids asking questions for fear of looking stupid"]}]}, {"h": "Cone of learning (Edgar Dale)", "star": true, "blocks": [{"t": "tbl", "head": ["After 2 weeks we remember", "How"], "rows": [["★ **10%**", "What we **read**"], ["★ **20%**", "What we **hear**"], ["★ **30%**", "What we **see** (looking at pictures)"], ["★ **50%**", "What we **hear and see** (movie, demonstration, seeing it done)"], ["★ **70%**", "What we **say** (discussion, giving a talk)"], ["★ **90%**", "What we **say and do** (simulating or doing the real thing)"]]}, {"t": "note", "k": "star", "x": "The more active the learning, the more we keep. Passive = reading and hearing. Active = doing."}]}, {"h": "Techniques to improve learning", "star": false, "blocks": [{"t": "ul", "items": ["Slow down and repeat information often", "Conversational style in plain language. Use metaphors for complex points", "**Chunk** information: teach in small bites", "**Prioritize** information. Teach 'survival skills' first", "Use visuals", "Interactive, hands-on teaching"]}]}, {"h": "Evaluating learning", "star": false, "blocks": [{"t": "ul", "items": ["The child or family **demonstrates** a skill (example: checking a blood sugar)", "**Teach-back:** they repeat the information in their own words", "They answer **open-ended questions**", "They respond to a **pretend scenario** in their home"]}]}, {"h": "Documentation of child and family teaching", "star": false, "blocks": [{"t": "ul", "items": ["The learning needs assessment", "Information on the medical condition and plan of care", "Goals of child education and the date each goal is met", "Teaching method used and how the child and family received it", "Medications, including drug-drug and drug-food interactions", "Modified diets and nutritional needs", "Safe use of medical equipment", "Follow-up care and community resources discussed"]}]}], "cold": ["Family-centered care: respect, diversity, strengths, support family choices, flexibility.", "Interpreter: talk to the family, not the interpreter. Never use a child. Sign language exception: family may interpret.", "Cone of learning: 10% read, 20% hear, 30% see, 50% hear and see, 70% say, 90% say and do.", "Teaching: rapport first, chunk, prioritize survival skills, teach-back.", "Evaluate learning with demonstration, teach-back, open-ended questions."], "traps": [["Nurse looks at the interpreter while talking.", "Talk directly to the family."], ["Teen sibling or child offered as interpreter.", "Never use children. Only exception is the family for sign language."], ["'Do you understand?' as the evaluation.", "Use teach-back or demonstration. Yes or no does not prove learning."], ["Adolescent teaching that ignores privacy and body image.", "Adolescents are sensitive about body image and control."]]}, {"id": "ass1", "icon": "📋", "title": "Ch 10: Health History", "sub": "The interview before the exam: what to ask, how to talk to each age, and how to set up the room.", "sections": [{"h": "Components of the health assessment", "star": false, "blocks": [{"t": "ul", "items": ["Health interview and history: demographics, chief complaint and history of present illness (HPI), past health history, family history, review of systems, functional history, family dynamics", "Observation of the **parent-child interaction**", "Assessment of the child's emotional, physiologic, cognitive and social development", "Physical assessment"]}]}, {"h": "Components of the health history", "star": false, "blocks": [{"t": "ul", "items": ["Demographics", "Chief complaint and history of present illness", "Past health history", "Review of systems", "Family health history", "Developmental history", "Functional history", "Family composition, resources and home environment"]}]}, {"h": "Role of the nurse during the physical assessment", "star": true, "blocks": [{"t": "ul", "items": ["★ **Establish rapport and trust**", "★ Demonstrate **respect** for the child and parent or caregiver", "★ Communicate effectively by **listening actively**, **demonstrating empathy** and **providing feedback**", "★ **Observe systematically**", "★ **Validate and interpret data accurately**"]}]}, {"h": "Therapeutic communication techniques", "star": false, "blocks": [{"t": "ul", "items": ["**Active listening**", "Using **open-ended questions** (added: cannot be answered yes or no)", "**Identifying and eliminating barriers** to communication", "**Establishing rapport**"]}]}, {"h": "Chief complaint", "star": false, "blocks": [{"t": "ul", "items": ["Onset, duration, characteristics and course", "Previous episodes in the child or family members", "Changes in environment or daily routine", "Previous testing or therapies", "What makes it better or worse", "What the concern means to the child and family", "Exposure to infectious or toxic agents"]}]}, {"h": "Past health history", "star": false, "blocks": [{"t": "ul", "items": ["Prenatal and perinatal history", "Past illnesses and developmental concerns", "Prior illnesses, accidents or injuries", "Hospitalizations or surgeries", "Diet (specifics)", "Allergies (type and reactions)", "Immunization status", "Medications (over the counter or prescription)", "Supplements", "Menstrual history in females, preadolescent and adolescent"]}]}, {"h": "Functional history", "star": true, "blocks": [{"t": "tbl", "head": ["Ask about", "Example"], "rows": [["★ **Safety measures**", "Car seats and the right seat for age"], ["★ **Routine health and dental care**", "Regular doctor and dentist visits"], ["★ **Nutrition**", "24-hour dietary food log, vitamins, supplements"], ["★ **Physical activity**", "Sports, play"], ["★ **Television and gaming**", "Hours of screen time"], ["★ **Sleep routine**", "Bedtime, hours of sleep"], ["★ **Elimination patterns**", "Bowel and bladder"], ["★ **Religious involvement**", "Beliefs and practices"], ["★ **Sexual patterns**", "Asked privately for adolescents"]]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight and star this slide. Expect a select-all-that-apply asking which items are functional history. Page 262."}]}, {"h": "Review of systems (14 on the slide)", "star": true, "blocks": [{"t": "ul", "items": ["★ Growth and development", "★ Skin", "★ Head and neck", "★ Eyes and vision", "★ Ears and hearing", "★ Mouth, teeth and throat", "★ Respiratory system and breasts", "★ Cardiovascular system", "★ Gastrointestinal system", "★ Genitourinary system", "★ Musculoskeletal system", "★ Neurologic system", "★ Endocrine system", "★ Hematologic system"]}, {"t": "note", "k": "star", "x": "Pediatric difference from adults: growth and development is added. Lecture example: asking mom if the child is thirsty, urinating a lot or has a big appetite screens the endocrine system (diabetes)."}]}, {"h": "Developmental considerations", "star": true, "blocks": [{"t": "tbl", "head": ["Age", "How to approach"], "rows": [["**Infants and toddlers**", "!!Examine on the caretaker's lap, let the child touch the equipment, do invasive parts last!!"], ["**Preschoolers**", "May want to inspect the stethoscope. Let them hold the scope or the BP cuff"], ["**School age**", "Involve them. They need a sense of control"], ["**Teens**", "Prefer privacy. Talk to them directly"]]}, {"t": "ul", "items": ["Engage infants and young children in distraction as needed", "Talk to or with the caregiver for a young child", "Converse directly with an older child or teen"]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight and star infants and toddlers (caretaker's lap, touch equipment, invasive parts last)."}]}, {"h": "Nursing actions", "star": false, "blocks": [{"t": "ul", "items": ["Keep the room **warm and well lit**", "Keep medical equipment **out of sight** until needed", "Provide **privacy**", "Take time to play and develop rapport", "**Explain each step**", "Proceed in an organized sequence for the age", "Be **firm and direct** about expected behavior", "Use a calm voice", "Encourage the child and family to ask questions"]}, {"t": "note", "k": "anno", "x": "Pearl: 'keep equipment out of sight' and 'let the toddler touch the equipment' both appear. Out of sight at first, then let the child explore it once you are ready to use it."}]}, {"h": "Physical examination: what you measure and determine", "star": false, "blocks": [{"t": "tbl", "head": ["Step", "What"], "rows": [["**Measure**", "Weight, length or height, head circumference, vital signs"], ["**Determine**", "Body mass index (BMI), body surface area (BSA), general appearance, activity level, orientation, mood"], ["**Examine**", "A consistent head-to-toe pattern chosen for the age"]]}, {"t": "note", "k": "anno", "x": "BMI: Box 10.1 on page 274. Lecture: not tested in depth, an app or the EHR calculates it."}]}], "cold": ["Rapport and trust first. Open-ended questions, active listening, remove barriers.", "Functional history = safety, health care, nutrition, activity, screen time, sleep, elimination, religion, sexual patterns.", "ROS = adult systems plus growth and development (14 total).", "Infants and toddlers: caretaker's lap, touch equipment, invasive parts last.", "Teens want privacy. School age wants control. Preschool wants to hold the stethoscope."], "traps": [["Question lists car seat use, sleep and screen time.", "Those are functional history."], ["Examining a toddler on the table, starting with the ear.", "Caretaker's lap, invasive parts last."], ["A close-ended question to open an interview.", "Use open-ended questions to get more information."]]}, {"id": "ass2", "icon": "🩺", "title": "Ch 10: Vitals and Body Systems", "sub": "Order of the exam, vital signs, skin, HEENT, lungs, heart murmurs, GI and GU, and the neurologic exam in children.", "sections": [{"h": "Order of the physical exam", "star": true, "blocks": [{"t": "tbl", "head": ["Step", "What you do"], "rows": [["★ **1. Observation**", "Skin color, asymmetry, gait, unusual movements, odors"], ["★ **2. Auscultation**", "Listen to heart and lungs (added: before touching, so the child stays calm)"], ["★ **3. Palpation**", "Warmth, texture, unusual findings through touch"], ["★ **4. Percussion**", "Focused tapping for location, size and density of organs or masses"]]}, {"t": "ul", "items": ["★ **Exception: the abdomen.** Auscultate BEFORE palpating or percussing. Added: Touching first can stir up bowel sounds and make them false", "Why this order in children: observing first builds trust. A scope in their face right away frightens them"]}, {"t": "note", "k": "star", "x": "Lecture: she said her ATI will not change this order. Observe, auscultate, palpate, except abdomen: listen first."}]}, {"h": "Newborns and infants", "star": false, "blocks": [{"t": "ul", "items": ["For a **sleeping infant**, auscultate the heart, lungs and abdomen **first** while the baby is quiet", "**Count the heart rate and respiratory rate before undressing** the baby", "+ Why: a crying baby gives false rates. Save the throat exam for last because it makes them cry"]}]}, {"h": "Heart and respiratory rate ranges (Table 10.3)", "star": true, "blocks": [{"t": "tbl", "head": ["", "Infant", "Toddler", "Preschool", "School age", "Adolescent"], "rows": [["**Heart rate**", "80-150", "70-120", "65-110", "60-100", "55-95"], ["**Respiratory rate**", "25-55", "20-30", "20-25", "14-26", "12-20"]]}, {"t": "note", "k": "anno", "x": "Lecture: do not sweat small differences between the book and ATI (ATI normal infant HR 120-160). Know an infant in the 60s or 50s is abnormally low, and below 40 means start CPR."}]}, {"h": "Pulse and blood pressure", "star": false, "blocks": [{"t": "ul", "items": ["Assess the heart rate while the child is **resting or sleeping**. As the child grows the heart rate slows", "==The radial pulse is difficult to palpate accurately in children younger than 2 years because the blood vessels lie close to the surface==", "==Auscultate the apical pulse for a full minute== (added: the slide wording says 'under ten'; the reason given is the hard-to-feel radial pulse in infants and toddlers)", "**Cuff size must be proportionate to the size of the child's extremity**: cuff too big reads falsely **low**, too small reads falsely **high**", "+ Cuff sites on the slide: brachial artery, radial artery (wrist), popliteal artery (behind the knee), dorsalis pedis artery (top of foot), posterior tibial artery (inside ankle)"]}, {"t": "note", "k": "anno", "x": "Lecture: she said to highlight the radial pulse sentence. Lecture: a case where the order of the exam may change is the sleeping baby, because you want the heart rate before you wake them."}]}, {"h": "Growth assessment", "star": false, "blocks": [{"t": "ul", "items": ["Height and weight are plotted on an **appropriate growth chart**", "Special charts exist for **Down syndrome, premature infants and breastfed infants**", "Age-for-weight, head circumference and body mass index (from weight and height by age)"]}]}, {"h": "Skin color variations (Box 10.2)", "star": true, "blocks": [{"t": "tbl", "head": ["Finding", "What it looks like", "Causes"], "rows": [["★ **Pallor**", "Decreased pinkness in light skin, ashy gray in dark skin", "Anemia, shock, fever, syncope"], ["★ **Central cyanosis**", "Blue lips, tongue, oral mucosa and trunk", "Hypoxia or circulatory collapse (emergency)"], ["★ **Jaundice**", "Overall yellow color", "Physiologic in the newborn, or liver or blood disease at any age. Added: Newborns clear bilirubin with phototherapy and frequent feeds"], ["★ **Yellowing of nose, palms and soles**", "Yellow only in those spots", "Too many yellow vegetables"], ["★ **Redness**", "Red skin", "Blushing, cold exposure, hyperthermia, local inflammation, alcohol ingestion"], ["★ **Lack of color**", "No color in skin, hair and eyes", "Albinism"]]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight this slide. Do not mix up central cyanosis (lips and tongue, an emergency) with acrocyanosis (hands and feet, normal in a newborn)."}]}, {"h": "Acrocyanosis and reporting skin lesions", "star": true, "blocks": [{"t": "ul", "items": ["**Acrocyanosis** = blueness of the hands and feet. **Normal for babies up to several days old**, from an immature circulatory system finishing the switch from fetal to extrauterine life", "★ Describe the **color, shape and number** of lesions", "★ Describe the **location and extent** of all lesions", "★ Describe the characteristics: scaly, flat, flaky, blister-like, raised, crusted, weeping, itchy; **macule vs papule** (added: macule is flat, papule is raised)"]}]}, {"h": "HEENT", "star": true, "blocks": [{"t": "tbl", "head": ["Part", "Findings"], "rows": [["★ **Anterior fontanel**", "==Present up to 18 months (9-18 months), diamond shaped=="], ["★ **Fontanel when crying**", "==Brief bulging is normal=="], ["★ **Dehydration**", "==Sunken fontanel=="], ["★ **Increased intracranial pressure (ICP)**", "==Bulging fontanel that stays bulging when the baby is not crying=="], ["★ **Posterior fontanel**", "Closes from birth to 2 months"], ["★ **Eyes**", "Strabismus (crossing of the eyes) is intermittent up to 6 months. The corneal light reflex (Hirschberg) is always symmetric"], ["★ **Ears**", "Check ear canal, ear rotation and level"], ["★ **Tonsils**", "Large tonsils are common in the young child"]]}, {"t": "ul", "items": ["Fontanel still open after 18 months: **refer** (it should be closed)", "+ Large tonsils clue: snoring and excess drooling"]}, {"t": "note", "k": "star", "x": "Lecture: she said to star the HEENT slide and highlight the bulging and sunken fontanel lines."}]}, {"h": "Tympanic temperature", "star": true, "blocks": [{"t": "ul", "items": ["==For children younger than 3, pull the earlobe back and down==", "+ For 3 and older, pull the ear up and back (straightens the canal)", "Insert the thermometer gently into the canal with the infrared sensor beam aimed at the **center of the tympanic membrane**, not the sides of the canal"]}, {"t": "note", "k": "star", "x": "Lecture: she said this is a very important slide, star and highlight it."}]}, {"h": "Respirations", "star": true, "blocks": [{"t": "ul", "items": ["★ Observe the rate and effort: easy or labored", "★ Note **retractions** or use of accessory muscles (added: subcostal, substernal, subclavicular)", "★ Listen for unusual sounds: **wheezing, stridor, crackles**", "★ Describe a cough: dry, hacking, wet, productive (added: a barking cough suggests croup)", "Count for a **full minute** to ensure accuracy", "==Infant breathing is diaphragmatic (belly breathers)==. ==After 1 year, thoracic movements=="]}]}, {"h": "Oxygen saturation: sources of error", "star": true, "blocks": [{"t": "tbl", "head": ["Problem", "Result"], "rows": [["★ Abnormal hemoglobin values", "False reading"], ["★ Poor perfusion", "False reading, falsely **low**"], ["★ Ambient light interference", "False reading"], ["★ Poor connection (added: nail polish)", "Falsely **low**"], ["★ **Anemia** and **carbon monoxide poisoning**", "The reading may look normal while the child is truly low on oxygen. Added: CO sits on hemoglobin in place of oxygen, so the monitor reads high"]]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight and star this slide, it is very important. Page 270."}]}, {"h": "Grading heart murmurs (Table 10.5)", "star": true, "blocks": [{"t": "tbl", "head": ["Grade", "Sound"], "rows": [["★ **1**", "Barely audible. Sometimes heard, sometimes not. Usually only with intense concentration"], ["★ **2**", "Quiet and soft. Heard each time the chest is auscultated"], ["★ **3**", "Audible, intermediate intensity"], ["★ **4**", "Audible with a **palpable thrill**"], ["★ **5**", "Loud. Audible with the edge of the stethoscope lifted off the chest"], ["★ **6**", "Very loud. Audible with the stethoscope near but not touching the chest"]]}, {"t": "ul", "items": ["A murmur is a **common finding** in children", "Grade by **intensity and loudness**", "Note the **anatomic location** where it is best heard", "Note whether it **radiates** (where)"]}, {"t": "note", "k": "star", "x": "Speaker note: create little flashcards of these. Test questions will definitely come from this. Lecture: she said to highlight and star it and make flashcards, because they are easy test questions to memorize."}]}, {"h": "GI and GU", "star": false, "blocks": [{"t": "tbl", "head": ["Area", "What to do or check"], "rows": [["**GI**", "Avoid tickling with palpation"], ["**GU**", "Note hygiene"], ["**Girls**", "Make sure there are no labial adhesions"], ["**Boys**", "Both testes descended. Urethra midline in the glans penis"]]}, {"t": "note", "k": "anno", "x": "Speaker note: labial adhesions can be a sign of abuse in girls, so always assess. Lecture: a missed undescended testicle can have serious later consequences."}]}, {"h": "Musculoskeletal and neurologic", "star": false, "blocks": [{"t": "tbl", "head": ["System", "Findings"], "rows": [["**Musculoskeletal**", "Full range of motion in all extremities. Symmetrical movement in all extremities"], ["**Neurologic**", "Brisk deep tendon reflexes (DTRs) in newborns, decrease to normal by 5 months"], ["**Reflexes**", "Check **primitive reflexes giving way to protective reflexes** in infants"], ["**Babinski**", "Positive Babinski reflex (toes fan, big toe up) until 12 months"]]}]}], "cold": ["Order: observe, auscultate, palpate, percuss. Abdomen: auscultate before palpating.", "Sleeping infant: listen to heart, lungs and abdomen first. Count HR and RR before undressing.", "Radial pulse is hard to feel under 2 years. Apical pulse for a full minute.", "Cuff too big = falsely low BP. Cuff too small = falsely high BP.", "Anterior fontanel diamond, closes 9-18 months. Posterior closes by 2 months. Bulging not crying = ICP. Sunken = dehydration.", "Under 3: pull the earlobe back and down.", "Infants breathe with the diaphragm. After 1 year thoracic.", "O2 sat false readings: anemia, CO poisoning, poor perfusion, ambient light, abnormal Hgb.", "Murmur grades 1-6. Grade 4 = palpable thrill. Grade 5 = edge of scope lifted. Grade 6 = off the chest.", "Acrocyanosis normal in newborn. Central cyanosis (lips, tongue) = hypoxia emergency."], "traps": [["Palpating the abdomen before listening.", "Auscultate the abdomen first."], ["Counting an infant pulse at the wrist for 30 seconds.", "Apical pulse for a full minute."], ["Blue hands and feet in a 2-day-old reported as an emergency.", "Acrocyanosis is normal. Blue lips and tongue are not."], ["Reading 98% on a CO-poisoned child means oxygenation is fine.", "False reading. CO poisoning and anemia mislead the oximeter."], ["Murmur grade described by pitch.", "Grading is by intensity and loudness."]]}, {"id": "gro", "icon": "📏", "title": "Ch 10: Growth and BP by Age", "sub": "Quiz 1 material that belongs with the assessment chapter: blood pressure sites, temperature, growth by age and growth charts.", "sections": [{"h": "Temperature and blood pressure by age", "blocks": [{"t": "tbl", "head": ["Age", "Temp", "BP"], "rows": [["**Infant** (birth to 1 yr)", "99.6 F", "60-78 / 40-52"], ["**Toddler** (1-3)", "99 F (37.5 C)", "86-117 / 44-76"], ["**Preschool** (3-6)", "98.6 F", "86-122 / 44-84"], ["**School age** (6-12)", "98.2 to 97.9 F", "91-125 / 54-90"], ["**Adolescent** (12-20)", "97.9 F", "108-138 / 63-94"]]}, {"t": "note", "k": "anno", "x": "This exam's heart and respiratory rate ranges are Table 10.3 on the Vitals and Body Systems tab. Use those. Under 10 years, auscultate the apical pulse for a full minute. The radial pulse is hard to feel under 2 years."}]}, {"h": "Where to take the blood pressure", "blocks": [{"t": "tbl", "head": ["Age group", "Blood pressure site"], "rows": [["**Infants**", "~~Lateral tibialis artery (lower leg)~~"], ["**Toddlers**", "~~Brachial or lateral tibialis artery unless contraindicated~~"], ["**School age to adult**", "Brachial artery unless contraindicated"]]}, {"t": "ul", "items": ["Cuff size must be proportionate to the size of the child's extremity (too small reads falsely high, too big reads falsely low).", "The cuff-placement figure shows these sites: radial artery (wrist), popliteal artery (behind the knee), dorsalis pedis artery (top of foot), posterior tibial artery (inside ankle)."]}, {"t": "note", "k": "anno", "x": "If you cannot use the leg on an infant, the RIGHT upper arm is preferred. The left arm gives false readings."}]}, {"h": "Growth by age", "blocks": [{"t": "tbl", "head": ["Age", "Height / length", "Weight", "Head and chest"], "rows": [["**Infant**", "Birth 48-53 cm (19-21 in). Grows 2.5 cm (1 in)/month for 6 months. ==Length up 50% by 12 months==", "Birth 2700-4000 g (6-9 lb). Loses 10% in week 1, regains by 10-14 days. ==Doubles by 4-6 months, triples by 1 year==", "HC 33-35 cm. Up 2 cm/mo first 3 mo, 1 cm/mo months 4-6, 0.5 cm/mo second 6 mo. ==Head and chest equal by about 2 years=="], ["**Toddler**", "7.5 cm (3 in)/year. Half of adult height by age 2", "Gain 1.8-2.7 kg (3-5 lb)/year", "Head and chest equal by 1-2 years"], ["**Preschool**", "6.4-9 cm (2.5-3.5 in)/year. 3y 95 cm (37.5 in), 4y 103 cm (40.5 in), 5y 110 cm (43.5 in)", "Gain 2-3 kg (4.5-6.5 lb)/year. 3y 14.5 kg (32 lb), 4y 16.5 kg (36.5 lb), 5y 18.5 kg (41 lb)", ""], ["**School age**", "5 cm (2 in)/year", "2-3 kg (4.4-6.6 lb)/year", "==Pre-puberty begins about age 9, especially girls. Menarche 10-16, average 12.5=="], ["**Adolescent**", "Final 20-25% of height gained in puberty. Girls stop 2-2.5 yr after menarche (grow 5-20 cm). Boys stop at 18-20 yr (grow 10-30 cm)", "Girls gain 7-25 kg (15.5-55 lb). Boys gain 7-30 kg (15.5-66 lb)", ""]]}]}, {"h": "Growth charts and measuring", "blocks": [{"t": "ul", "items": ["Measure weight, length and head circumference, then plot on a standardized growth chart to judge growth for age.", "Children usually stay near the same percentile line over time.", "==A significant shift from the child's usual percentiles means further assessment is needed.==", "Specialized charts exist for children with certain diagnoses (for example Down syndrome) and for breastfed infants.", "The slide example is a CDC/WHO chart for boys, birth to 24 months. It plots head circumference-for-age and weight-for-length.", "Length board (recumbent): used for children under 2 years, under 85 cm, or too ill to stand. Accuracy 0.1 cm. It takes experience and patience.", "+ Why a board for babies: they cannot stand, so you lay them flat with the head against a fixed board and slide the foot piece to the heels."]}, {"t": "note", "k": "anno", "x": "Practice plotting from your slide notes: Baby girl 3 mo, HC 40 cm, wt 16 lb, ht 26 in. Baby boy 4.5 mo, HC 44 cm, wt 9.5 kg, ht 72 cm. Use the CDC charts linked in the slide notes."}]}], "cold": ["Infant BP site: lateral tibialis (lower leg). If no leg, RIGHT upper arm, never left.", "Weight: loses 10% week 1, back by 10-14 days, DOUBLES 4-6 months, TRIPLES 1 year.", "Length up 50% by 12 months. Head and chest equal at about 2 years.", "Head circumference grows fastest early: 2 cm/mo for 3 months, then 1 cm/mo, then 0.5 cm/mo.", "Toddler: 7.5 cm and 1.8-2.7 kg a year. Preschool: 6.4-9 cm and 2-3 kg a year. School age: 5 cm and 2-3 kg a year.", "Menarche 10-16, average 12.5. Girls stop growing 2-2.5 years later. Boys stop at 18-20.", "A jump across percentile lines on the growth chart means assess further."], "traps": [["Question asks which artery for an infant BP.", "Lateral tibialis (lower leg), not brachial."], ["Which arm if the leg cannot be used on an infant?", "Right upper arm. Left gives false readings."], ["Birth weight triples at 6 months?", "No. Doubles at 4-6 months, triples at 1 year."], ["Infant lost 10% of birth weight in week 1. Is that abnormal?", "No. Expected. Regains by 10-14 days."], ["Preschooler weight gain given in pounds.", "4.5-6.5 lb a year (2-3 kg). Do not mix with toddler 3-5 lb."]]}, {"id": "tan", "icon": "🌱", "title": "Ch 10: Tanner Staging", "sub": "Sexual maturity ratings. She said to memorize stages 2 to 4: stage 1 is nothing yet and stage 5 is adult.", "sections": [{"h": "Stage by stage: girls and boys together", "star": true, "blocks": [{"t": "tbl", "head": ["Stage", "Girls breasts", "Girls pubic hair", "Boys genitals", "Boys pubic hair"], "rows": [["**1**", "Only an elevated small nipple", "None, fine vellus hair", "Childlike. Testes and penis not growing", "None"], ["★ **2**", "**Breast bud**: small mound, widened areola", "Sparse, long, downy, mostly on the labia", "**Testes enlarge, scrotal skin reddens**", "Thin, light, at the base of the penis"], ["★ **3**", "Breast and areola enlarge together, **nipple flush**", "Sparse, **spreading over the mons**, darker, coarser, curlier", "**Penis lengthens** (not wider). Growth spurt. Voice may change", "Darker, coarser, curlier"], ["★ **4**", "Areola and nipple form a **secondary mound**", "Adult type over a smaller area, none on medial thigh", "Penis **wider and longer**. Scrotum darkens. Voice deepens, facial hair starts", "Thick and coarse, not yet on the thighs"], ["**5**", "Mature breast, only the nipple protrudes", "Adult pattern, inverse triangle, also medial thigh", "Adult genitalia", "Adult pattern, full body hair"]]}, {"t": "note", "k": "star", "x": "Lecture: stage 1 and stage 5 are easy. Memorize stages 2 to 4. Slide list of boys' changes in order: testicular enlargement, pubic hair, penis length, axillary hair, facial hair, vocal changes."}]}, {"h": "What Tanner staging is", "star": true, "blocks": [{"t": "ul", "items": ["Scale for the degree of pubertal development, **stages 1 to 5**", "**Stage 1 = prepubertal** (nothing happening yet). **Stage 5 = mature adult**", "★ Focus on **stages 2, 3 and 4**: they are the ones used most and confused most", "**Girls:** breast development, pubic hair distribution, axillary hair, menstruation", "**Boys:** testicular enlargement, pubic hair, penis length, axillary hair, facial hair, vocal changes", "Where to see it: Figure 10.28 page 285 (breasts) and Figure 10.36 page 290 (female pubic hair)"]}, {"t": "note", "k": "star", "x": "Lecture: she said to make flashcards for Tanner stages 2-4. Her test questions use pictures, so learn what each stage looks like. She said breast bud (stage 2) is always going to be a question."}]}, {"h": "Girls: breast development", "star": true, "blocks": [{"t": "tbl", "head": ["Stage", "What you see"], "rows": [["**1**", "Preadolescent: only an elevated small nipple, flat chest"], ["★ **2**", "**Breast bud stage.** A small mound of breast and nipple develops. The areola widens"], ["★ **3**", "Breast and areola **enlarge further**. The nipple is **flush with the breast surface**. No separation of contours"], ["★ **4**", "Areola and nipple form a **secondary mound** above the level of the breast"], ["**5**", "Mature breast. Only the nipple protrudes. The areola is flush with the breast contour"]]}, {"t": "note", "k": "star", "x": "Stage 3 vs stage 4: in stage 3 the areola and breast are one smooth contour. In stage 4 the areola and nipple stick up as a second mound. Seeing the secondary mound = stage 4."}]}, {"h": "Girls: pubic hair", "star": true, "blocks": [{"t": "tbl", "head": ["Stage", "What you see"], "rows": [["**1**", "Preadolescent: no pubic hair, only fine vellus hair on the abdomen and over the mons and labia"], ["★ **2**", "Sparse growth, mostly on the labia. Long, downy, slightly pigmented, straight or slightly curly"], ["★ **3**", "Sparse growth **spreading over the mons pubis**. Hair is darker, coarser and curlier"], ["★ **4**", "Adult-type hair but over a **smaller area**. None on the medial thigh"], ["**5**", "Adult type and pattern: inverse triangle and also on the medial thigh"]]}, {"t": "note", "k": "star", "x": "Lecture: she said her stage 2 and 3 questions on hair are the tricky ones, so know light and sparse (2) vs darker and spreading (3)."}]}, {"h": "Boys: genital development (from lecture)", "star": true, "blocks": [{"t": "tbl", "head": ["Stage", "What you see"], "rows": [["**1**", "No pubic hair, childlike. Testes and penis are not growing"], ["★ **2**", "**Testes enlarge** and the **scrotal skin reddens**. Thin, light pubic hair"], ["★ **3**", "**Penis lengthens** (not wider). Testes keep enlarging. Pubic hair darker. Growth spurt. Voice may change"], ["★ **4**", "Penis gets **wider and longer**. Scrotum darkens. Thick pubic hair. Voice deepens and facial hair starts"], ["**5**", "Adult genitalia and full pubic hair"]]}, {"t": "note", "k": "star", "x": "Lecture: stage 2 = scrotal reddening and testicular enlargement, stage 3 = penis LENGTH, stage 4 = penis width AND length. Know the difference between 2, 3 and 4."}]}, {"h": "Boys: pubic hair (from lecture)", "star": false, "blocks": [{"t": "tbl", "head": ["Stage", "What you see"], "rows": [["**1**", "None"], ["**2**", "Thin, light hair at the base of the penis"], ["**3**", "Darker, coarser, curlier"], ["**4**", "Thick and coarse, but does not yet reach the thighs or navel"], ["**5**", "Adult pattern, spreads fully"]]}]}, {"h": "Breast inspection", "star": false, "blocks": [{"t": "ul", "items": ["Observe the breast for position, shape, size, symmetry and color", "==Newborns of both genders may have swollen nipples from maternal estrogen==. Normal, it goes away", "~~Note the location of supernumerary nipples if present. They are usually along the mammary ridge and look like dark, raised nipple-like spots. They may indicate renal disorders, or may not be concerning~~"]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight this slide. Her example: a worried dad thought his son had breast development. It was only maternal estrogen swelling."}]}, {"h": "Sample exam question from lecture", "star": false, "blocks": [{"t": "ul", "items": ["**How does the nurse tell stage 3 from stage 4 breast development, and what confirms stage 4?** Stage 3 = breast and areola enlarge together with the nipple flush against the breast. Stage 4 = the **areola and nipple rise as a secondary mound** above the breast. Seeing the secondary mound confirms stage 4"]}, {"t": "note", "k": "star", "x": "This was the advanced question in the lecture review. Learn it word for word."}]}], "cold": ["Stage 1 = nothing, stage 5 = adult. Memorize stages 2-4.", "Girls order: breast, pubic hair, axillary hair, menstruation.", "Girls breast: 2 = bud, 3 = further enlargement, nipple flush, 4 = secondary mound.", "Girls pubic hair: 2 sparse on labia, 3 darker and spreads on mons, 4 adult type over a small area.", "Boys genital: 2 scrotal redness and testicular growth, 3 penis lengthens, 4 penis widens and lengthens.", "Supernumerary nipples along the mammary ridge may point to renal disorders."], "traps": [["Picture shows a small mound with a widened areola.", "Stage 2, the breast bud."], ["Picture shows enlarged breast with the nipple flush.", "Stage 3. A secondary mound would be stage 4."], ["Boy with a longer but not wider penis.", "Stage 3. Wider and longer = stage 4."], ["Newborn boy with swollen nipples.", "Normal. Maternal estrogen."]]}, {"id": "spc", "icon": "🧩", "title": "Ch 12: Special Health Care Needs", "sub": "Children with chronic conditions, how it affects the child and family, and nursing management.", "sections": [{"h": "Who are children with special needs", "star": false, "blocks": [{"t": "ul", "items": ["Conditions beyond the usual needs of children: **chronic physical, developmental, behavioral, emotional**", "Includes children with a **terminal illness** or who are dying"]}]}, {"h": "Resources and services needed", "star": false, "blocks": [{"t": "ul", "items": ["Medical care (including transportation to care)", "Prescription medication or durable medical equipment", "Mental health and education services", "Physical, occupational or speech therapy", "Treatment for emotional, developmental or behavioral problems", "Financial assistance", "Family support"]}, {"t": "note", "k": "anno", "x": "Speaker note: often parents get support from other parents of children with similar medical conditions (support groups)."}]}, {"h": "Impact on the child: all Erikson stages", "star": true, "blocks": [{"t": "tbl", "head": ["Age", "Erikson stage at risk", "Difficulty"], "rows": [["★ **Infant**", "!!Trust vs Mistrust!!", "May fail to develop a sense of trust and bonding"], ["★ **Toddler**", "!!Autonomy vs Shame and Doubt!!", "May have difficulty developing autonomy"], ["★ **Preschooler**", "!!Initiative vs Guilt!!", "May have difficulty achieving a sense of initiative"], ["★ **School age**", "!!Industry vs Inferiority!!", "May have difficulty achieving industry"], ["★ **Adolescent**", "!!Identity vs Role Confusion!!", "May have difficulty forming a sense of self-identity relative to peers"]]}, {"t": "ul", "items": ["**Delayed development** is also possible"]}, {"t": "note", "k": "star", "x": "Speaker note: all stages of Erikson can be impacted. Lecture: all Erikson stages could be delayed."}]}, {"h": "Impact on the family", "star": false, "blocks": [{"t": "ul", "items": ["A multitude of emotions and life changes. Overwhelm. Feeling burdened with care", "Fear, anger, sadness, guilt, frustration or resentment", "Financial burden", "Altered family activities", "**Siblings may feel cheated of parental time and affection**"]}]}, {"h": "Stressors of daily life for the family", "star": false, "blocks": [{"t": "ul", "items": ["Housing situation may change", "Technical care becomes part of daily life", "May be affected: sleep, basic activities of living, family identity, employment, caregiver health", "**Siblings may feel neglected and act out**"]}]}, {"h": "Transition times in care", "star": false, "blocks": [{"t": "ul", "items": ["Initial diagnosis or change in prognosis", "Increased symptoms", "Child moves to a new setting (hospital, school)", "During a parent's absence", "During periods of developmental change", "Arrival of new family members"]}, {"t": "note", "k": "star", "x": "Speaker note: when caring for special needs infants, help parents get into early intervention programs and specialists. Never delay care. Lecture: it is important to get into early intervention programs for specialty care, for example autism therapy at the right age."}]}, {"h": "Risk factors for vulnerable child syndrome", "star": true, "blocks": [{"t": "ul", "items": ["★ **Preterm birth**", "★ **Congenital anomaly**", "★ **Newborn jaundice**", "★ **Handicapping condition**", "★ An accident or illness the child was not expected to recover from", "★ **Crying or feeding problems in the first 5 years of life**", "+ Vulnerable child syndrome: parents see the child as fragile after a scare, so they overprotect and the child can end up with behavior or development problems"]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight this slide."}]}, {"h": "Families", "star": true, "blocks": [{"t": "ul", "items": ["★ Are a **constant** in the child's life", "★ Need **access to information and training**", "★ Deserve **culturally competent care**", "★ Know their strengths, limitations and fears", "★ Merit **mutual respect** and responsibility for outcomes", "★ **Caring for the dying child is a family-centered, multidisciplinary process**"]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight and star this slide."}]}, {"h": "Nursing management of children with special needs", "star": false, "blocks": [{"t": "ul", "items": ["Case management and advocacy", "Screening and ongoing assessment of the child", "Provision of appropriate home care", "Care of the technology-dependent child", "==Education and support of the child and family==", "==Referral for resources=="]}]}, {"h": "Promoting home care for the technology-dependent child", "star": true, "blocks": [{"t": "ul", "items": ["★ **Early discharge planning**", "★ Direct care and care coordination at home, including helping to **establish therapy schedules** and interventions", "★ Identify potential problems in the home environment", "★ **Former premature infant:** ongoing follow-up, routine well-child care, assess growth and development by **calculated (adjusted) age**"]}, {"t": "note", "k": "star", "x": "Speaker note: really important to help families create schedules for therapies. Lecture: routine is very important, and it is important to prevent passive caregiving."}]}, {"h": "Long-term risks for the premature infant", "star": true, "blocks": [{"t": "ul", "items": ["★ Cognitive delays", "★ Visual impairment", "★ Chronic lung disease", "★ Cerebral palsy", "★ Attention deficit disorder", "★ Learning disabilities", "★ Difficulties with socialization", "★ Vulnerable child syndrome", "★ Alterations in muscle tone"]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight or star this slide."}]}, {"h": "Resources: education, money, respite and complementary therapies", "star": false, "blocks": [{"t": "tbl", "head": ["Resource", "Details"], "rows": [["**Educational opportunities mandated by law**", "Early intervention from birth to age 2. Preschool for ages 3 to 5. IDEA (2004). The local school system"], ["**Other resources**", "Educational opportunities, financial resources, respite care, complementary therapies"], ["**Complementary therapies**", "Homeopathic and herbal medicine, pet therapy, **hippotherapy** (horse therapy), music, massage, culture-specific therapies"]]}]}, {"h": "Premature infants: calculated (adjusted) age (Quiz 1 slides)", "star": false, "blocks": [{"t": "ul", "items": ["Normal pregnancy is about 40 weeks. Premature = born before 37 weeks", "Weeks early = 40 minus the gestational age at birth", "==Adjusted age = chronological age minus the weeks born early==", "Plot growth and judge milestones on the adjusted age. Premature infants may reach milestones later, so give more time and reevaluate", "Premature babies often have immature lungs and nervous system, low iron and immunoglobulin stores, and an immature GI tract that may not handle oral feeding", "**Example:** a 7-month-old born at 28 weeks was 12 weeks (3 months) early. 7 - 3 = **4 months** adjusted age", "**Example:** born at 32 weeks, now 6 months. 40 - 32 = 8 weeks (2 months) early. 6 - 2 = **4 months** adjusted age"]}, {"t": "note", "k": "anno", "x": "Ch 12 slide: for the former premature infant, assess growth and development based on calculated age."}]}, {"h": "Erikson and Piaget by age: what illness can disrupt (Quiz 1 slides)", "star": true, "blocks": [{"t": "tbl", "head": ["Age", "Erikson", "Piaget", "What chronic illness can disrupt"], "rows": [["**Infant**", "!!Trust vs mistrust!!", "Sensorimotor", "Consistent comfort and bonding when care is painful or the baby is separated"], ["**Toddler**", "!!Autonomy vs shame and doubt!!", "Sensorimotor", "Independence, when the parent does everything"], ["**Preschool**", "!!Initiative vs guilt!!", "Preoperational", "Starting activities, and magical thinking that the illness is a punishment"], ["**School age**", "!!Industry vs inferiority!!", "Concrete operational", "School, skills and fitting in with peers"], ["**Adolescent**", "!!Identity vs role confusion!!", "Formal operational", "Body image, peer identity and control"]]}, {"t": "note", "k": "star", "x": "Speaker note, Ch 12: all stages of Erikson can be impacted."}]}], "cold": ["Special needs: chronic physical, developmental, behavioral, emotional, and terminal illness.", "All five Erikson stages can be affected: trust, autonomy, initiative, industry, identity.", "Siblings may feel cheated of time or neglected and act out.", "Vulnerable child syndrome risks: preterm, congenital anomaly, newborn jaundice, handicapping condition, near-fatal illness or accident, crying or feeding problems in first 5 years.", "Premature infant: use calculated (adjusted) age for growth and development.", "Help families set therapy schedules. Prevent passive caregiving.", "Early intervention: birth to 2. Preschool services: 3 to 5. IDEA (2004)."], "traps": [["Teen with a chronic illness cannot form peer relationships.", "Identity vs role confusion difficulty."], ["A parent calls a healthy child fragile after a premature birth.", "Vulnerable child syndrome."], ["Plan says to delay specialist referral until the child is older.", "Never delay. Early intervention programs."], ["Premature infant judged by birth date.", "Calculated (adjusted) age."]]}, {"id": "end", "icon": "🕊️", "title": "Ch 12: Transition and End of Life", "sub": "Moving to adult care, DNR and AND orders, organ donation and palliative care.", "sections": [{"h": "Components of transition planning", "star": false, "blocks": [{"t": "ul", "items": ["Multidisciplinary care coordination including community resources", "Acknowledgment of the changing roles", "Fostering the youth's **self-determination skills**", "Importance of a **medical home**"]}]}, {"h": "Teaching points: adolescent to adult care", "star": false, "blocks": [{"t": "ul", "items": ["Diagnosis and medical history to date", "Treatment rationale", "Symptoms of a worsening condition", "Danger signs", "When to seek help from a professional (and from whom)", "Medical insurance process", "**Detailed written plan of care**", "Consultation with a transition services coordinator"]}]}, {"h": "Orders related to end-of-life care", "star": true, "blocks": [{"t": "tbl", "head": ["Order", "Meaning"], "rows": [["★ **Limitations of care**", "Parents and patients (when able) may specify their wishes for end-of-life care"], ["★ **Do not resuscitate (DNR)**", "**Withhold CPR if the child's heart stops beating**"], ["★ **Special limitations**", "May be part of the order: for example oxygen and comfort care but no compressions"], ["★ **Allow natural death (AND)**", "In some institutions DNR is being replaced by AND"]]}, {"t": "note", "k": "star", "x": "Starred slide. Lecture: hospital systems often label the order differently."}]}, {"h": "Guidelines for organ donation", "star": false, "blocks": [{"t": "ul", "items": ["Discussion is **separate** from impending death or brain death notification", "**Written consent** is necessary", "**All expenses are borne by the recipient's family**", "State that the child's appearance **will not be marred**", "The donating child **will not suffer**", "Family culture and spiritual beliefs must be considered"]}]}, {"h": "Palliative care", "star": false, "blocks": [{"t": "tbl", "head": ["Principles", "Focus"], "rows": [["Respect the child's goals, preferences and choices", "Manage pain and discomfort"], ["Acknowledge and address the caregiver's concerns", "Provide nutrition"], ["Comprehensive, interdisciplinary continuum of care in the community", "Emotional support for the dying child and family"], ["Competent and ethical care", "Assist the family through grief. **Family is the unit of care**"]]}]}, {"h": "Nursing management of the dying child", "star": true, "blocks": [{"t": "ul", "items": ["★ **Manage pain and discomfort**", "★ **Provide nutrition**", "★ Provide **emotional support** to the child and family", "★ Provide resources for the family: support groups", "★ **Be present** for the family and respect spiritual backgrounds", "★ Make sure the family knows the nurse will help them and the child and **will not abandon them**", "+ Lecture: sit with them in the room and let the family stay with the child as long as they want"]}, {"t": "note", "k": "star", "x": "Starred slide. Caring for the dying child is a family-centered, multidisciplinary process."}]}], "cold": ["DNR = withhold CPR if the heart stops. AND = allow natural death.", "DNR can have limits: oxygen and comfort care but no compressions.", "Organ donation: written consent, separate conversation, recipient family pays, appearance not marred, no suffering.", "Palliative care: pain, nutrition, emotional support, grief. Family is the unit of care.", "Never abandon the family. Be present."], "traps": [["Organ donation brought up in the same breath as the death notice.", "Discussion must be separate."], ["Family asked to pay for the donor's costs.", "Recipient's family pays all expenses."], ["Nurse leaves the room to avoid a dying child's family.", "Be present, respect spiritual beliefs."], ["DNR means stop all care.", "It only withholds CPR. Comfort care and oxygen can continue."]]}, {"id": "med1", "icon": "💊", "title": "Ch 13: Peds Medication Basics", "sub": "Why children handle drugs differently, and how to dose by body surface area. Slide stars and lecture stars are marked.", "sections": [{"h": "Rights of pediatric medication", "star": false, "blocks": [{"t": "ul", "items": ["Right medication, right patient, right time, right route, right dose", "**Extra pediatric rights:** right **approach**, right **documentation**, right to be **educated**, right to **refuse**, right **form**", "Lecture: the rights are like the adult rights plus a couple of extra ones. The right approach matters because you must meet the child at their developmental level"]}]}, {"h": "Pharmacodynamics vs pharmacokinetics", "star": true, "blocks": [{"t": "tbl", "head": ["Term", "What it is", "Affected by"], "rows": [["★ **Pharmacodynamics**", "What the drug does to the body. Behavior of the medication at the **cellular level**", "Physiologic **immaturity** of some body systems in a child. Response may vary with **genetic makeup**"], ["★ **Pharmacokinetics**", "What the body does to the drug. Movement of the drug over time through the body by **absorption, distribution, metabolism and excretion**", "The child's **age, weight, body surface area, body composition** and diseases affecting related organs (liver, kidney)"]]}, {"t": "note", "k": "star", "x": "Speaker note: pharmacodynamics is what a drug does to the body (biochemical, physiological and molecular effects). Pharmacokinetics is how the body affects the drug from the moment it enters until it is eliminated. An immature body system will affect how drugs are metabolized."}]}, {"h": "Absorption: topical drugs", "star": true, "blocks": [{"t": "ul", "items": ["★ **Topical absorption is increased in infants and young children**", "★ Reason: higher **body surface area** and increased **skin permeability**", "★ Topical drugs are absorbed quicker in children than adults"]}, {"t": "note", "k": "star", "x": "Starred slide. Toxicity is a risk with creams and ointments in babies."}]}, {"h": "Distribution in children vs adults", "star": false, "blocks": [{"t": "ul", "items": ["**Higher percentage of body water** than adults", "More rapid **extracellular fluid** exchange", "**Decreased body fat**", "**Liver immaturity**, which changes first-pass elimination", "**Decreased plasma proteins** available for drug binding", "**Immature blood-brain barrier**, especially in neonates, so some drugs move into the cerebrospinal fluid (CSF)"]}]}, {"h": "Metabolism and excretion", "star": false, "blocks": [{"t": "ul", "items": ["Differences in hepatic enzyme production and renal clearance", "Increased metabolic rate", "Biotransformation is affected by the same variations that affect distribution", "==Immaturity of the kidneys until age 1 to 2 years affects renal blood flow, glomerular filtration and active tubular secretion==", "==Result: a longer half-life and a higher risk of toxicity for drugs excreted mainly by the kidneys==", "Lecture: for kids both the liver and kidneys have a hard time processing medications"]}]}, {"h": "Question on the slides: oral amoxicillin in an infant", "star": false, "blocks": [{"t": "ul", "items": ["Which physical factor might affect absorption? **Slower gastric emptying.** It matters because the drug is given by mouth", "Wrong: vasomotor instability (affects IM absorption), decreased perfusion (affects subcutaneous absorption), lower percentage of body water (infants actually have a HIGHER percentage)"]}, {"t": "note", "k": "star", "x": "Quiz question on the slides. Match the absorption factor to the route."}]}, {"h": "Developmentally appropriate explanations", "star": false, "blocks": [{"t": "ul", "items": ["Why the drug is needed", "What the child will experience", "What is expected of the child", "How the parents can participate and support the child"]}]}, {"h": "Body surface area (BSA)", "star": true, "blocks": [{"t": "ul", "items": ["Measure height and weight. On the **nomogram** draw a line from height (left column) to weight (right column). Where it crosses the **surface area** column is the BSA in **m²**", "**Formula (metric):** BSA (m²) = square root of [ weight (kg) x height (cm) / 3,600 ]", "**Formula (pounds and inches):** BSA (m²) = square root of [ weight (lb) x height (in) / 3,131 ]", "**Child's dose** = (child's BSA / 1.73 m²) x normal adult dose"]}, {"t": "calc", "k": "bsa"}, {"t": "note", "k": "anno", "x": "Lecture: she said ATI does not test BSA and she does not test it either. The formulas are starred on the slide, so know where they are."}]}], "cold": ["Extra pediatric rights: approach, documentation, educated, refuse, form.", "Pharmacodynamics = what the drug does to the body (cell level). Pharmacokinetics = what the body does to the drug (ADME).", "Kids: more body water, less fat, immature liver and kidneys, immature blood-brain barrier, fewer plasma proteins.", "Topical drugs are absorbed faster in infants (higher BSA, more permeable skin).", "Kidney immaturity until age 1-2 = longer half-life and more toxicity.", "BSA formula: sqrt(kg x cm / 3,600). Child dose = BSA / 1.73 x adult dose."], "traps": [["Choice says infants have LESS body water than adults.", "False. Infants have MORE."], ["Oral drug and the cause is 'vasomotor instability'.", "That affects IM. Oral = gastric emptying."], ["Higher body surface area, so topical absorption is slower.", "Faster."]]}, {"id": "med2", "icon": "💉", "title": "Ch 13: Giving Peds Medications", "sub": "Forms and routes, and the numbers she starred: eye drops, nose drops, IM sites, SQ and intradermal.", "sections": [{"h": "Oral medications", "star": true, "blocks": [{"t": "ul", "items": ["Forms: liquids, elixirs, syrups, suspensions, powders, tablets, capsules", "==For liquids, give the drug **slowly in small amounts** and allow the child time to swallow in between==", "If the child refuses a tablet, **call pharmacy** for a liquid or a **slurry**", "Crushed tablets or capsule contents can taste bitter. **Never mix with formula or essential foods** or the child may refuse to eat them later. A small amount of applesauce or other nonessential food may be used"]}, {"t": "note", "k": "star", "x": "Starred slide. Slide quiz: 'mix the crushed tablet with the child's formula' is FALSE."}]}, {"h": "Other forms of medication", "star": true, "blocks": [{"t": "tbl", "head": ["Form", "Examples"], "rows": [["★ **Inhaled**", "Powders, aerosols"], ["★ **Topical** (==absorbed the quickest==)", "==Creams, ointments, lotions, drops=="], ["★ **Transdermal**", "Patches"], ["★ **Rectal**", "Suppositories"]]}, {"t": "note", "k": "star", "x": "Speaker note: the EpiPen now comes as a nasal spray mist. Lecture: asked which form on this slide is absorbed quickest: topical."}]}, {"h": "Gastrostomy and jejunostomy tubes", "star": false, "blocks": [{"t": "ul", "items": ["**Verify placement** of the tube before giving anything", "Give liquid medications directly by syringe along with a small amount of air", "Mix powdered medication with warm water", "Crush pills as finely as possible and mix with water before adding to the tube", "Open capsules and mix with water to dissolve the contents", "**Flush the tube with water** after giving medications", "==Do NOT crush capsules== (slide 35 on tube care)"]}, {"t": "note", "k": "anno", "x": "Speaker note: at home, use a pH strip to verify gastric pH and make sure you are in the stomach."}]}, {"h": "Other routes", "star": false, "blocks": [{"t": "ul", "items": ["Rectal, ophthalmic, otic, nasal, intramuscular (IM), subcutaneous (SQ) and intradermal (ID), intravenous (IV)"]}]}, {"h": "Eye drops (ophthalmic)", "star": true, "blocks": [{"t": "ul", "items": ["★ Hold the medication **2.5 cm (1 inch) from the eye**", "★ Have the child **look up and to the side**", "★ **Children 3 and younger:** get an additional adult to keep their arms and fingers away", "★ After the drop: apply **gentle pressure to the inner canthus** so the medication stays in the eye (added: the canthus is the corner of the eye by the nose)"]}, {"t": "note", "k": "star", "x": "Starred slide. Lecture: she said to highlight the pressure on the inner canthus."}]}, {"h": "Nose drops (nasal)", "star": true, "blocks": [{"t": "ul", "items": ["★ Medication at **room temperature**", "★ Have the child **blow the nose first** (or use a bulb syringe)", "★ Position **supine with the head hyperextended**. A pillow or folded towel can help", "★ **Do not touch the nares** with the spray or dropper", "★ After the drops, keep the head hyperextended for **about 1 minute**. Not longer: a parent who says to keep the head back 5 minutes is wrong"]}, {"t": "note", "k": "star", "x": "Starred slide, page 359. Lecture: read pediatric teaching questions closely for clues in the wording, for example what a parent says about how long to keep the head back after the drops. The slide says at least a minute. In her review she said the rule is 1 minute and that a mom saying 5 minutes is wrong."}]}, {"h": "Intramuscular injection sites", "star": true, "blocks": [{"t": "tbl", "head": ["Age", "Preferred site"], "rows": [["★ **12 months or less**", "**Vastus lateralis** (anterolateral thigh)"], ["★ **Greater than 12 months**", "Vastus lateralis (anterolateral thigh) **or deltoid** may be considered"], ["★ **Starred slide picture shows 3 sites**", "**Vastus lateralis** (middle third of the thigh), **deltoid**, and the **ventrogluteal** site (between the iliac crest and the greater trochanter, found with the hand over the hip). (added: ventrogluteal is the gluteal site used in older children. The dorsogluteal is avoided in children because the sciatic nerve is close)"]]}, {"t": "ul", "items": ["==Muscle development and the amount of fluid to be injected decide the IM site==", "==Needle size and length are decided by the size of the muscle and the viscosity of the medication=="]}, {"t": "note", "k": "star", "x": "Starred slide. Lecture review question: preferred IM site for an infant under 12 months = vastus lateralis."}]}, {"h": "Subcutaneous (SQ) vs intradermal (ID)", "star": true, "blocks": [{"t": "tbl", "head": ["Route", "Where it goes", "Used for"], "rows": [["==**Subcutaneous (SQ)**==", "==Distributes medication into the fatty layers of the body==", "~~Insulin, heparin and certain immunizations~~"], ["==**Intradermal (ID)**==", "==Deposits medication just under the epidermis==", "~~Tuberculosis screening and allergy testing~~"]]}, {"t": "ul", "items": ["!!MMR vaccine is SUB Q!! (the only vaccine given SQ, all the others are IM)"]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight that MMR is the only vaccine given sub-Q."}]}, {"h": "Atraumatic care when giving medication", "star": true, "blocks": [{"t": "ul", "items": ["★ Use **comforting positions**", "★ **Encourage the child to participate** in care", "★ Give the child **developmentally appropriate options**", "★ Use a **topical anesthetic** before injections (lidocaine cream or EMLA)"]}]}, {"h": "Educating and preventing errors", "star": false, "blocks": [{"t": "ul", "items": ["Teach the child and parents: how often, when the next dose is due and how long the medication is to be given", "**Stress the importance of completing the prescribed dose**", "Give tips for medication administration", "Preventing medication errors"]}]}], "cold": ["Oral liquid: slowly, small amounts, let them swallow. Tablet refused = call pharmacy for slurry. Never mix with formula.", "Topical = absorbed quickest.", "G-tube: verify placement (pH), crush pills, NEVER crush capsules, flush with water.", "Eye: 1 inch away, look up and to the side, age 3 and under needs a helper, pressure on inner canthus.", "Nose: room temperature, blow nose first, supine head hyperextended for 1 minute (not 5), do not touch nares.", "IM: 12 months or less = vastus lateralis. Over 12 months = vastus lateralis or deltoid.", "MMR is the only SQ vaccine. SQ = insulin, heparin. ID = TB and allergy testing."], "traps": [["Crushed medication mixed in formula 'so the baby takes it'.", "Never. The child may refuse formula later."], ["Deltoid chosen for a 9-month-old.", "Vastus lateralis."], ["Eye drops: no pressure afterward.", "Gentle pressure on the inner canthus."], ["Nose drops, child sits up after the drops right away.", "Keep the head hyperextended for 1 minute."], ["Mom says to keep the head back for 5 minutes after nose drops.", "Wrong. The rule is 1 minute."], ["Which vaccine is SQ?", "MMR."]]}, {"id": "ivn", "icon": "💧", "title": "Ch 13: IV, Fluids and Nutrition", "sub": "IV sites and technique, maintenance fluid math, enteral feedings and TPN.", "sections": [{"h": "Equipment choice for IV therapy", "star": false, "blocks": [{"t": "ul", "items": ["Type of solution or medication", "Duration of therapy", "Age and developmental level", "The child's status", "Condition of the child's veins", "==Rule of thumb: select the **smallest gauge** for the **shortest length of time** necessary to minimize trauma to the veins=="]}]}, {"h": "Peripheral IV sites", "star": false, "blocks": [{"t": "ul", "items": ["Commonly the **hands, feet and forearms**", "**Scalp veins** may be used in infants up to about 9 months, but they frighten parents, so usually only after other sites have failed", "Common figure sites: superficial temporal, frontal, external jugular, cephalic, basilic, dorsal arch, saphenous veins"]}]}, {"h": "Slide question: 5-month-old IV site", "star": false, "blocks": [{"t": "ul", "items": ["**True:** choosing the baby's **foot** for a 5-month-old is correct. Hands, feet and forearms are common sites. The scalp is a last resort"]}, {"t": "note", "k": "star", "x": "Quiz question on the slides."}]}, {"h": "IV therapy technique", "star": true, "blocks": [{"t": "ul", "items": ["Gather equipment before approaching the child", "Select the **hand** rather than the wrist or upper arm veins", "Ensure adequate pain relief (topical anesthetic)", "Allow the anesthetic-prepared site to dry", "Prepare the site with aseptic technique, using terms the child can understand", "Use a **barrier** to avoid pinching the skin", "If needed use a device to **transilluminate** the vein", "★ **Make only two attempts** to gain access. Get help if unsuccessful", "★ **Encourage parental participation** to hold and comfort the child (therapeutic hugging)", "★ Coordinate care with other departments", "★ **Secure the line with a minimal amount of tape**", "★ Protect the site from accidental bumping", "★ **Assess the insertion site at regular intervals**"]}, {"t": "note", "k": "star", "x": "Starred slide. Lecture: pull anything sticky off their skin carefully when kids have sensory issues."}]}, {"h": "IV maintenance fluid calculation (daily)", "star": true, "blocks": [{"t": "tbl", "head": ["Body weight", "Amount per day"], "rows": [["★ **First 10 kg**", "**100 mL per kg**"], ["★ **Next 10 kg** (10-20 kg)", "**50 mL per kg**"], ["★ **Remainder** over 20 kg", "**20 mL per kg**"]]}, {"t": "calc", "k": "fluid"}, {"t": "ul", "items": ["Worked example: a **25 kg** child. First 10 kg = 10 x 100 = **1,000 mL**. Next 10 kg = 10 x 50 = **500 mL**. Remaining 5 kg = 5 x 20 = **100 mL**. Total = **1,600 mL per day**. Divide by 24 = **66.7 mL per hour**", "Preventing complications: **infiltration** and **inflammation**. Also know how to discontinue the IV device"]}, {"t": "note", "k": "star", "x": "Starred slide. Table 13.4 page 369. Lecture: she asked who needs extra help with fluid calculations."}]}, {"h": "Nutritional support", "star": true, "blocks": [{"t": "tbl", "head": ["Type", "How", "Notes"], "rows": [["★ **Enteral**", "**Orogastric, nasogastric, nasojejunal or nasoduodenal** tubes go along existing anatomy. **Gastrostomy or jejunostomy** tubes go straight into the GI tract through a surgical opening in the abdomen", "For a **functioning GI tract** when the child cannot take enough calories by mouth"], ["★ **Parenteral**", "Additional fluids by peripheral IV", ""], ["★ **TPN** (total parenteral nutrition)", "Through a **central line**. ==A highly concentrated solution of carbohydrates, electrolytes, vitamins and minerals==", "May be used when the GI tract does not work"]]}, {"t": "note", "k": "star", "x": "Starred slide. Lecture: she said to highlight the TPN line."}]}, {"h": "Care of the child with an enteral tube", "star": true, "blocks": [{"t": "ul", "items": ["★ **Placement must be confirmed before adding anything**", "★ Nonradiologic methods (if not high risk for aspiration): ==check the **color and pH of the aspirate**: gastric **1.5 to 4**, respiratory greater than **7**==", "★ Check the external markings and external tube length", "★ Watch for signs of misplacement: **unexplained gagging, vomiting or coughing**, and signs of **respiratory distress**", "★ Be aware of developmental needs that tube feedings can interfere with (**sucking**)"]}, {"t": "note", "k": "star", "x": "Starred slide. Lecture: she said to put the pH numbers to memory because ATI asked about stomach pH."}]}, {"h": "Medications by gastrostomy tube", "star": true, "blocks": [{"t": "ul", "items": ["★ Verify proper tube placement", "★ Crush tablets and mix with warm water", "★ ==DO NOT CRUSH CAPSULES==", "★ Flush the tube after each medication"]}, {"t": "note", "k": "star", "x": "Starred slide. Page 374."}]}, {"h": "Measures to reduce TPN complications", "star": true, "blocks": [{"t": "ul", "items": ["★ Monitor vital signs closely for changes", "★ **Strict aseptic technique**. Monitor the insertion site", "★ Keep the system a **closed system** at all times", "★ ==Use **occlusive dressings**. Monitor the insertion site at dressing changes==", "★ Follow agency policy for flushing the catheter and keeping it patent", "★ Assess intake and output frequently", "★ ==Monitor **blood glucose** and obtain labs as ordered to check fluid and electrolyte changes=="]}, {"t": "note", "k": "star", "x": "Speaker note: sterile water, 10 mL per shift for flushing. Lecture: one flush of 10 mL every 12 hours or per shift."}]}], "cold": ["Smallest gauge for the shortest time.", "Infant IV sites: hands, feet, forearms. Scalp up to about 9 months, last resort.", "Two attempts only, then get help. Parent holds the child (therapeutic hugging).", "Fluids: 100 mL/kg first 10 kg, 50 mL/kg next 10 kg, 20 mL/kg the rest.", "Enteral = functioning gut. TPN = central line, concentrated, needs aseptic technique and glucose checks.", "Gastric aspirate pH 1.5 to 4. Respiratory over 7.", "Do not crush capsules. Flush the tube after each drug."], "traps": [["A 25 kg child's daily fluid calculated as 25 x 100.", "100/50/20 stepwise: 1,600 mL."], ["Nurse tries 4 times to start the IV.", "Two attempts then get help."], ["Tube aspirate pH is 7.5.", "Respiratory. Do not give the medication."], ["Capsule crushed for a G-tube.", "Never crush capsules."]]}, {"id": "dos", "icon": "🧮", "title": "Dosage and fluid math", "sub": "She is focusing on fluids and on mg/kg/day. Learn which formula the weight needs, and how to go from an order to a dose and from a dose back to mg/kg/day.", "sections": [{"h": "Maintenance fluids: pick the formula by weight", "star": true, "blocks": [{"t": "tbl", "head": ["Weight", "Daily fluid (mL per day)", "How it is built"], "rows": [["★ **Under 10 kg**", "**100 x kg**", "Only the first band is used, 100 mL for every kg"], ["★ **10 to 20 kg**", "**1,000 + 50 x (kg - 10)**", "The full first band (1,000) plus 50 mL for each kg above 10"], ["★ **Over 20 kg**", "**1,500 + 20 x (kg - 20)**", "The first two bands in full (1,000 + 500) plus 20 mL for each kg above 20"]]}, {"t": "ul", "items": ["★ **Weight decides the formula.** Weigh in kg first. Pounds divided by 2.2", "★ At exactly 10 kg both of the first two formulas give 1,000. At exactly 20 kg both of the last two give 1,500", "★ This is her slide rule (100 mL per kg for the first 10 kg, 50 for the next 10, 20 for the rest) written as one line per weight band", "★ **Per hour:** divide the daily total by 24. Round only at the end", "+ Do not multiply the whole weight by 100. Only the first 10 kg get 100"]}, {"t": "calc", "k": "fluid"}, {"t": "note", "k": "star", "x": "Starred slide, Table 13.4 page 369. Lecture: she is focusing on fluid calculations and offered extra help."}]}, {"h": "Worked fluid examples", "star": true, "blocks": [{"t": "ul", "items": ["★ **8 kg:** under 10 kg, so 100 x 8 = **800 mL per day**. 800 / 24 = **33.3 mL per hour**", "★ **15 kg:** 1,000 + 50 x (15 - 10) = 1,000 + 250 = **1,250 mL per day**. 1,250 / 24 = **52.1 mL per hour**", "★ **28 kg:** 1,500 + 20 x (28 - 20) = 1,500 + 160 = **1,660 mL per day**. 1,660 / 24 = **69.2 mL per hour**", "★ **44 lb:** 44 / 2.2 = 20 kg first. Then 1,000 + 50 x 10 = **1,500 mL per day**. 1,500 / 24 = **62.5 mL per hour**"]}]}, {"h": "Quick check table (daily and hourly)", "star": false, "blocks": [{"t": "tbl", "head": ["Weight", "mL per day", "mL per hour (divide by 24)"], "rows": [["**3 kg**", "300", "12.5"], ["**5 kg**", "500", "20.8"], ["**8 kg**", "800", "33.3"], ["**10 kg**", "1,000", "41.7"], ["**12 kg**", "1,100", "45.8"], ["**15 kg**", "1,250", "52.1"], ["**18 kg**", "1,400", "58.3"], ["**20 kg**", "1,500", "62.5"], ["**25 kg**", "1,600", "66.7"], ["**30 kg**", "1,700", "70.8"], ["**40 kg**", "1,900", "79.2"], ["**50 kg**", "2,100", "87.5"]]}, {"t": "note", "k": "anno", "x": "Use it to check your own answer, not to skip the formula. Questions use weights that are not on this table."}]}, {"h": "Added: the 4-2-1 hourly rule", "star": false, "blocks": [{"t": "ul", "items": ["+ Another way to get mL per hour: 4 mL per kg for the first 10 kg, 2 per kg for the next 10, 1 per kg after that", "+ It lands close to the daily total divided by 24, not exactly on it (a 10 kg child is 40 by 4-2-1 and 41.7 by daily / 24)", "+ **On her exam use her method:** the daily formula, then divide by 24. Her slide only has the 100 / 50 / 20 rule"]}]}, {"h": "mg/kg/day: dose to order and order to dose", "star": true, "blocks": [{"t": "tbl", "head": ["You are given", "You need", "Steps"], "rows": [["★ mg/kg/day, weight, doses per day", "mg per dose", "mg/kg/day x kg = mg per day. Then divide by doses per day"], ["★ mg per dose, doses per day, weight", "mg/kg/day", "mg per dose x doses per day = mg per day. Then divide by kg"], ["★ mg/kg/dose and weight", "mg per dose", "mg/kg/dose x kg. No dividing by doses"], ["★ Safe range in mg/kg/day, weight, the ordered dose", "Is the order safe", "Range x kg gives the lowest and highest safe mg per day. Ordered mg per dose x doses per day. Compare the two"], ["★ mg per dose and the concentration in mg per mL", "mL to give", "mg per dose divided by mg per mL"], ["Weight in pounds", "Weight in kg", "Pounds divided by 2.2. Do this first, before any other step"]]}, {"t": "note", "k": "star", "x": "Lecture: she is focusing on both directions, taking the mg/kg/day and finding the dose, and taking the dose and finding the mg/kg/day."}]}, {"h": "Doses per day", "star": false, "blocks": [{"t": "tbl", "head": ["Order says", "Doses per day"], "rows": [["**Once daily, daily, every 24 hours**", "1"], ["**BID, every 12 hours**", "2"], ["**TID, every 8 hours**", "3"], ["**QID, every 6 hours**", "4"], ["**Every 4 hours**", "6"]]}]}, {"h": "Worked dose examples", "star": true, "blocks": [{"t": "ul", "items": ["★ **Order to dose:** 40 mg/kg/day in 3 doses for a 12 kg child. 40 x 12 = 480 mg per day. 480 / 3 = **160 mg per dose**", "★ **Dose to mg/kg/day:** 250 mg every 6 hours for a 20 kg child. 250 x 4 = 1,000 mg per day. 1,000 / 20 = **50 mg/kg/day**", "★ **Safe range check:** range 20 to 40 mg/kg/day, child 10 kg, order 150 mg every 8 hours. Safe range is 200 to 400 mg per day. Ordered 150 x 3 = 450 mg per day. That is 45 mg/kg/day, above the range, so **hold and clarify**", "★ **mL to give:** 90 mg ordered, the label reads 160 mg per 5 mL. 90 / 160 x 5 = **2.8 mL**"]}, {"t": "calc", "k": "dose"}]}, {"h": "How she can trap you", "star": false, "blocks": [{"t": "tbl", "head": ["Trap", "How to beat it"], "rows": [["Weight given in pounds", "Divide by 2.2 before anything else"], ["mg/kg/day order, but the question asks for one dose", "Find mg per day, then divide by doses per day"], ["Dose given, question asks for mg/kg/day", "Multiply the dose by doses per day first, then divide by kg"], ["mg/kg/dose order", "No dividing by doses. Multiply by kg only"], ["Hourly rate wanted", "Daily total divided by 24"], ["The ordered dose is under the single-dose number but over the daily total", "Always compare mg per DAY with the safe mg per day"], ["Weight sits in the first or second band", "Do not apply 20 mL per kg to a weight under 20 kg"]]}]}], "cold": ["Under 10 kg: 100 x kg. 10 to 20 kg: 1,000 + 50 x (kg - 10). Over 20 kg: 1,500 + 20 x (kg - 20).", "Per hour = per day divided by 24. Pounds divided by 2.2 = kg.", "mg/kg/day to dose: multiply by kg, then divide by doses per day.", "Dose to mg/kg/day: multiply by doses per day, then divide by kg.", "Safe check: compare mg per day, not mg per dose. Unsafe means hold and clarify."], "traps": [["25 kg child calculated as 25 x 100.", "Use the 1,500 + 20 x (kg - 20) formula: 1,600 mL per day."], ["Order 250 mg every 6 hours, child 20 kg, answer 12.5 mg/kg/day.", "That forgot the 4 doses. 1,000 / 20 = 50 mg/kg/day."], ["Order 30 mg/kg/day in 3 doses for 15 kg, answer 450 mg per dose.", "450 is the daily total. Divide by 3 for 150 mg per dose."]]}], "q": {"atr": [{"ty": "mc", "d": 2, "q": "A nurse is preparing a 4-year-old for a peripheral IV start. Which plan best follows the principles of atraumatic care?", "o": ["Topical anesthetic and a parent comfort-hold", "Restrain the child firmly and quickly so the procedure is over in seconds", "Tell the child it will not hurt at all so he stays calm and still", "Ask the parent to wait outside so the child cooperates better"], "a": [0], "y": "Right: a topical anesthetic prevents the physical pain, and a parent comfort-hold gives security without restraint, so both main stressors (pain and separation) are covered. Why not firm quick restraint: atraumatic care says to avoid restraint when possible, and being held down is frightening for a 4-year-old. Why not telling him it will not hurt: an IV start does hurt, so the lie breaks trust and he will not believe the next explanation. Why not sending the parent out: separation is a core stressor and a preschooler is calmer with the parent present."}, {"ty": "mc", "d": 3, "q": "A 5-year-old about to have surgery asks, 'Will the mask hurt?' The mother says, 'Don't tell her anything, it will only upset her.' What is the nurse's best response?", "o": ["Explain the mask simply and invite her mother to help", "Agree to distract the child with a toy until the anesthesia starts working", "Tell the mother that the surgeon will explain everything to the child later", "Show the mask to the child only after the parent has left the room"], "a": [0], "y": "Right: simple honest explanations let a preschooler know what to expect, and including the mother makes her a partner, which family-centered care requires. Why not only distracting with a toy: distraction helps but leaves the child's question unanswered and the mask will still surprise her. Why not saying the surgeon will explain: it passes the job on when the nurse is the one asked and the child needs an answer now. Why not showing the mask after the parent leaves: it removes the parent at the moment the child needs her."}, {"ty": "mc", "d": 2, "q": "Which statement by a parent shows an accurate understanding of therapeutic hugging for a toddler's lumbar puncture?", "o": ["I will hold her snugly in my lap so she feels safe", "I will lie across her body so that she physically cannot move at all", "I will look away and leave her with the nurses while it is done", "I will hold her wrists and ankles down firmly until it is over"], "a": [0], "y": "Right: therapeutic hugging is a secure, snug hold in the parent's lap that keeps the toddler positioned while she feels comforted, so it meets both goals of keeping the child still and reducing fear. Why not lying across her body: that is restraint by force and can hurt or frighten her. Why not looking away and leaving her with the nurses: separation from the parent is a core stressor. Why not holding wrists and ankles down: it is also restraint, which atraumatic care avoids when possible."}, {"ty": "sata", "d": 3, "q": "A nurse is planning care to reduce physical stressors for a hospitalized 7-year-old with an infection. Which actions fit atraumatic care? Select all that apply.", "o": ["Place a saline lock instead of repeated IV starts", "Group blood draws to avoid extra needle sticks", "Offer music or counting aloud during the procedure", "Let the child choose which arm to use", "Hold the child down firmly to avoid a second attempt", "Give every injection IM so it is done with one stick", "Do the procedures while the parents are at lunch"], "a": [0, 1, 2, 3], "y": "Right: a saline lock avoids repeated IV starts, grouping draws avoids extra sticks, distraction lowers distress, and a choice of arm gives a sense of control, all matching the slide list. Why not holding the child down to avoid a second try: it avoids restraint on the slide and the child is likely to fight harder. Why not giving every injection IM: the slide says to minimize IM and subcutaneous injections because they hurt. Why not doing procedures while the parents are at lunch: preventing separation is a principle."}, {"ty": "mc", "d": 2, "q": "Whic
