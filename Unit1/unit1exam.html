 of the tongue so the whole dose goes down at once and cannot be spat out", "Put the tip in the center front of the mouth and push the plunger quickly so the baby does not refuse it", "Mix the dose into a full bottle of formula so the baby swallows it over the whole feeding"], "a": [0], "y": "Right: the side of the mouth along the cheek lets the baby swallow a little at a time and lowers the choking risk. Why not the back of the tongue: it triggers gagging and aspiration. Why not the front center with a fast push: the tongue thrusts the drug back out and a fast push can choke the baby. Why not the bottle: if the baby stops early the dose is incomplete, and the drug can make the formula taste bad so the baby refuses it later."}, {"ty": "mc", "d": 3, "q": "A nurse is teaching a group of adult patients about wound care at home. Which approach fits how adults learn?", "o": ["Start with the problem the teaching solves and give tasks they can use right away", "Begin with the full anatomy of skin healing before giving any of the home instructions", "Decide the content alone because adults wait for an expert to set the goals", "Skip their past experience with wounds so old habits do not get in the way"], "a": [0], "y": "Right: adult learners are problem focused and task oriented, so a teaching plan that starts with the problem and a usable skill matches how they learn. Why not anatomy first: that is subject focused, which fits children better. Why not deciding alone: adults are self directed and want a say in what they learn. Why not skipping past experience: adults bring experience and learn best when it is used."}, {"ty": "mc", "d": 3, "q": "A nurse auscultates a murmur that is quiet and soft and is heard every time the chest is auscultated. How is it graded?", "o": ["Grade 2", "Grade 1", "Grade 3", "Grade 4"], "a": [0], "y": "Right: grade 2 is quiet and soft but heard every time. Why not grade 1: grade 1 is barely audible and is heard only with intense concentration, not every time. Why not grade 3: that is intermediate intensity, louder than quiet and soft. Why not grade 4: grade 4 is the first grade with a palpable thrill."}, {"ty": "mc", "d": 3, "q": "A toddler spits out a tablet at every dose. Which action should the nurse take?", "o": ["Ask the pharmacy whether the drug comes as a liquid or can be made into a slurry", "Crush the tablet and stir it into the child's full bottle of formula so it is hidden", "Pinch the child's nose and tip the head back so the tablet is swallowed", "Skip the dose and chart that the child refused so the prescriber is told at rounds"], "a": [0], "y": "Right: when a form does not work the nurse calls the pharmacy for another form such as a liquid or slurry. Why not hiding it in formula: bitter crushed drug in formula makes the child refuse feedings later. Why not pinching the nose: it forces swallowing and risks aspiration. Why not skipping the dose: a missed dose harms the child, and a refusal needs a solution and a call to the prescriber now, not at rounds."}, {"ty": "mc", "d": 3, "q": "An 8-year-old asks a nurse whether the IV will hurt. Her mother answers for her. What is the best nursing response?", "o": ["Turn to the child and answer her directly and honestly in simple words", "Thank the mother and let her explain it, since parents know their child's fears best", "Tell the child it will not hurt at all so that she stays calm for the insertion", "Hand her a toy and change the subject so her worry does not grow before the procedure"], "a": [0], "y": "Right: school-age children are working on industry and need to be spoken to directly and answered honestly. Why not letting the mother explain: it leaves the child out and costs her trust. Why not saying it will not hurt: a lie breaks trust the first time it does hurt. Why not changing the subject: ignoring the question leaves the fear unanswered."}, {"ty": "sata", "d": 3, "q": "Which measures prevent dental problems in a newborn? Select all that apply.", "o": ["Gently wipe the gums with a soft cloth or gauze after feedings", "Do not put the baby to bed with a bottle", "Begin brushing when the first tooth erupts", "Let the baby carry a bottle of juice for comfort between feedings", "Wait until age 3 before starting any mouth care", "Dip the pacifier in sugar water to soothe the baby"], "a": [0, 1, 2], "y": "Right: wiping the gums removes milk, a bedtime bottle bathes the gums and new teeth in milk or juice, and brushing starts with the first tooth. Why not the juice bottle and the sugar pacifier: both keep sugar on the gums and teeth. Why not waiting until age 3: the teeth are exposed to decay from the day they erupt."}, {"ty": "ord", "d": 3, "q": "Put the steps for giving an oral liquid to an infant in order.", "items": ["Check the order and the child's identity", "Hold the infant semi-upright", "Draw the dose into an oral syringe", "Place the tip in the side of the mouth along the cheek", "Give small amounts slowly and let the baby swallow", "Document the dose and how the baby tolerated it"], "y": "Right: checking the order and identity comes first, then the baby is positioned to lower aspiration risk, the dose is prepared, placed at the cheek, given slowly and documented last."}, {"ty": "mc", "d": 3, "q": "A child with immature kidneys receives a drug that builds up because the kidneys clear it slowly. Which concept does this describe?", "o": ["Pharmacokinetics, because the body is clearing the drug more slowly", "Pharmacodynamics, because the drug is changing how the kidney cells work", "Pharmacodynamics, because the drug now has a stronger effect at the same dose", "Pharmacokinetics, because the drug is moving in the body only during absorption"], "a": [0], "y": "Right: excretion is one of the four kinetic processes (absorption, distribution, metabolism, excretion), and immature kidneys slow it, so the drug stays longer and can be toxic. Why not the first pharmacodynamics choice: it names a cell-level effect, not clearance. Why not the second: the stem describes the body clearing the drug, not the drug acting on the body. Why not the last: kinetics covers all four processes, not only absorption."}, {"ty": "mc", "d": 3, "q": "A nurse examines a boy whose penis is wider as well as longer, whose scrotum is darker, and whose pubic hair is coarse and curly but not yet on the thighs. Which Tanner stage is this?", "o": ["Stage 4", "Stage 2", "Stage 3", "Stage 5"], "a": [0], "y": "Right: wider and longer with a darkened scrotum is stage 4. Why not stage 2: that is testicular enlargement and scrotal reddening with thin hair. Why not stage 3: the penis only lengthens. Why not stage 5: that is adult size and the hair spreads onto the thighs."}, {"ty": "mat", "d": 2, "q": "Match each murmur description to its grade.", "pairs": [["Barely audible, not heard every time", "Grade 1"], ["Quiet and soft, heard every time", "Grade 2"], ["Audible with a palpable thrill", "Grade 4"], ["Heard with the edge of the stethoscope lifted", "Grade 5"]], "y": "Grade 1 is barely audible. Grade 2 is quiet and heard every time. Grade 4 is the first with a thrill. Grade 5 is loud enough to hear with the edge of the scope lifted off the chest."}, {"ty": "ngn", "d": 3, "scen": "A nurse is giving a liquid antibiotic to a 6-month-old. The baby cries and spits out half of the dose. The mother suggests putting the rest of the medicine in the bottle.", "parts": [{"ty": "mc", "d": 3, "q": "What should the nurse tell the mother about mixing the drug into the bottle?", "o": ["Do not mix it, because the baby may refuse the rest of the feeding", "It is fine if the bottle is warm, because heat makes the drug dissolve", "It is fine if only half of the bottle is used, so the baby finishes it quickly", "It is fine because infants swallow more medicine when they are sucking"], "a": [0], "y": "Right: a drug mixed in formula can taste bad so the baby refuses feedings later, and if the baby does not finish the bottle the dose is unknown. Why not the warm bottle: warming does not fix taste or dose accuracy. Why not the half bottle: a partly finished bottle still gives an unknown dose. Why not sucking: sucking does not guarantee the baby takes the full amount."}, {"ty": "sata", "d": 3, "q": "Which actions should the nurse take next? Select all that apply.", "o": ["Hold the baby semi-upright", "Use the oral syringe in the side of the mouth along the cheek", "Give the remaining dose in small amounts", "Notify the prescriber or pharmacy if the dose cannot be given reliably", "Lay the baby flat to keep the drug from running out", "Aim the syringe at the back of the throat"], "a": [0, 1, 2, 3], "y": "Right: semi-upright, cheek placement and small amounts lower the choking risk, and the prescriber or pharmacy is told if the dose cannot be given. Why not flat: lying flat raises aspiration risk. Why not the back of the throat: it triggers gagging and aspiration."}], "y": ""}, {"ty": "mc", "d": 3, "q": "A nurse states that adult learners are subject focused and children are problem focused. Which statement corrects this?", "o": ["It is reversed: adults are problem focused, children subject focused", "It is correct, since adults need the full theory before they can use it", "It is partly correct, since both groups are problem focused after age 12", "It is irrelevant, since learning style does not change with age"], "a": [0], "y": "Right: adults (Knowles) are problem focused and task oriented. Why not the first: that describes subject focus, the child pattern. Why not the second: the slides do not put adolescents in the adult pattern. Why not the third: age and developmental level change how teaching must be planned."}, {"ty": "mc", "d": 3, "q": "After a nurse gives nose drops to a 4-year-old, the mother says she will keep the child's head tilted back for 5 minutes. What is the best response?", "o": ["Tell her that about 1 minute is the right time to keep the head back", "Agree, since a longer time lets more of the drug absorb into the nose", "Agree, but only if the child is lying quietly with the eyes closed", "Tell her the head should come up right away so the drops do not run into the throat"], "a": [0], "y": "Right: the head stays hyperextended for about 1 minute, so 5 minutes is wrong. Why not agreeing for absorption: the rule is a set time and longer does not make it work better, and a child will not hold still that long. Why not agreeing if the child is quiet: a calm child does not change the time. Why not sitting up at once: the drops would drain back out before they work."}, {"ty": "sata", "d": 3, "q": "Which actions are correct when giving nose drops to a child? Select all that apply.", "o": ["Have the child blow the nose first or use a bulb syringe", "Position the child supine with the head hyperextended", "Keep the dropper from touching the nares", "Use medication at room temperature", "Seat the child upright with the chin tucked to the chest", "Touch the dropper to the nostril so no drop is lost", "Keep the head back for 5 minutes"], "a": [0, 1, 2, 3], "y": "Right: the nose is cleared first, the head is tipped back, the dropper stays clean and the drug is room temperature. Why not upright with the chin tucked: the drops run out the front. Why not touching the nostril: it contaminates the dropper. Why not 5 minutes: the rule is 1 minute."}, {"ty": "ord", "d": 3, "q": "Put the steps for giving nose drops to a child in order.", "items": ["Make sure the drops are at room temperature", "Have the child blow the nose or use a bulb syringe", "Position the child supine with the head hyperextended", "Give the drops without touching the nares", "Keep the head hyperextended for 1 minute"], "y": "Right: the drug is checked first, the nose is cleared so the drops reach the tissue, then the child is positioned, the drops are given and the head stays back for 1 minute."}, {"ty": "mc", "d": 3, "q": "A drug lowers a child's fever by acting on the temperature center in the brain. Which concept describes this?", "o": ["Pharmacodynamics, because it is what the drug does to the body", "Pharmacokinetics, because it describes the drug moving through the body", "Pharmacokinetics, because the child's weight changes how the dose works", "Neither, because an effect on the brain is only an adverse reaction"], "a": [0], "y": "Right: pharmacodynamics is the drug acting on the body, such as lowering the fever. Why not the first pharmacokinetics choice: movement through the body is absorption, distribution, metabolism and excretion. Why not the second: weight affects the dose, but it is not the drug effect. Why not neither: lowering the fever is the intended effect."}, {"ty": "mat", "d": 2, "q": "Match each term to its meaning.", "pairs": [["Pharmacodynamics", "What the drug does to the body"], ["Pharmacokinetics", "What the body does to the drug"], ["Absorption, distribution, metabolism, excretion", "The four kinetic processes"], ["Nose drops hold time", "Head hyperextended for 1 minute"]], "y": "Dynamics is the drug's action, kinetics is the drug's movement (ADME), and nose drops need the head back for 1 minute."}, {"ty": "ngn", "d": 3, "scen": "A mother is giving nose drops to her 3-year-old, who has a stuffy nose. The child is sitting up and the mother plans to keep the head tilted back for 5 minutes after the drops.", "parts": [{"ty": "mc", "d": 3, "q": "What should the nurse teach first?", "o": ["Have the child blow the nose, then lay the child down with the head tipped back", "Give the drops while the child sits and then lay the child down for 5 minutes", "Warm the bottle in hot water so the drops spread through the nose better", "Touch the dropper to the nostril so the child cannot sneeze the drops out"], "a": [0], "y": "Right: the nose is cleared first and the child lies supine with the head hyperextended. Why not sitting first: the drops would run out before the position is set. Why not hot water: the drug should be room temperature. Why not touching the nostril: the dropper must not touch the nares."}, {"ty": "mc", "d": 3, "q": "How long should the mother keep the head hyperextended?", "o": ["1 minute", "5 minutes", "10 seconds", "Until the child falls asleep"], "a": [0], "y": "Right: 1 minute. Why not 5 minutes: her review named 5 minutes as the wrong statement. Why not 10 seconds: that is too short for the drops to stay in the nose. Why not until asleep: there is no such rule and a child may not fall asleep."}], "y": ""}, {"ty": "mc", "d": 3, "q": "A nurse is asked what total parenteral nutrition contains. Which answer matches the slide?", "o": ["A concentrated mix of carbohydrates, electrolytes, vitamins and minerals", "A dilute dextrose and saline solution that runs through a peripheral IV line", "Whole formula that is blended and then given through a gastrostomy tube", "Plain sterile water with a small amount of potassium chloride added to it"], "a": [0], "y": "Right: TPN is a highly concentrated mix of carbohydrates, electrolytes, vitamins and minerals given by central line. Why not dilute dextrose and saline: that describes a peripheral IV fluid, not TPN. Why not blended formula: that is an enteral feeding, which needs a working gut. Why not sterile water with potassium: it gives no nutrition.", "tp": null}, {"ty": "sata", "d": 3, "q": "Which measures reduce complications for a child receiving TPN? Select all that apply.", "o": ["Monitor blood glucose levels", "Use an occlusive dressing and check the insertion site", "Keep the system closed at all times", "Assess intake and output frequently", "Monitor vital signs closely", "Open the line at the hub to hang each new bag without cleaning", "Stop checking labs once the child is stable on the solution"], "a": [0, 1, 2, 3, 4], "y": "Right: glucose, the site, a closed system, intake and output and vital signs all catch problems from the concentrated solution and the central line. Why not opening the hub without cleaning: that breaks the closed system and risks infection. Why not stopping labs: fluid and electrolytes keep changing and labs are ordered to track them.", "tp": null}, {"ty": "ngn", "d": 3, "scen": "A 7-year-old is receiving TPN through a central line. The nurse finds the dressing wet and loose and the child has a temperature and a fast pulse.", "parts": [{"ty": "sata", "d": 3, "q": "Which findings does the nurse report? Select all that apply.", "o": ["Temperature above baseline", "Fast pulse", "Wet and loose dressing at the insertion site", "Child asks for a drink of water", "Child is watching television"], "a": [0, 1, 2], "y": "Right: fever, a fast pulse and a compromised dressing can mean a line infection. Why not the drink or the television: they are normal behavior and say nothing about the line."}, {"ty": "mc", "d": 3, "q": "What should the nurse do first?", "o": ["Notify the provider and re-dress the site using aseptic technique", "Stop the TPN and flush the line with tap water to clear any blockage", "Cover the wet dressing with extra tape and recheck the child in four hours", "Take the pump off the line to see whether the child feels better"], "a": [0], "y": "Right: this may be an infection, so the nurse reports it and re-dresses the site aseptically per policy. Why not tap water: it is not sterile. Why not taping over it: that keeps a wet dressing on the site and delays care. Why not removing the pump: stopping TPN abruptly is not the nurse's decision and can drop blood glucose."}], "y": "", "tp": null}, {"ty": "sata", "d": 3, "q": "Which can cause a false pulse oximeter reading in a child? Select all that apply.", "o": ["Carbon monoxide poisoning", "Anemia", "Poor perfusion", "Ambient light interference", "A loose probe or nail polish", "A warm hand with good circulation", "A probe placed correctly on a still child"], "a": [0, 1, 2, 3, 4], "y": "Right: CO, anemia, poor perfusion, light and a poor connection all change what the probe senses. Why not a warm hand or a correct probe: those give the best reading.", "tp": null}, {"ty": "mc", "d": 3, "q": "A child with carbon monoxide poisoning has a pulse oximeter reading of 99% but is drowsy and has a headache. What does the nurse understand?", "o": ["The reading is falsely high because carbon monoxide sits on the hemoglobin", "The child is oxygenating well and the symptoms must have another cause", "The probe is reading falsely low and the true value is even higher", "The reading is accurate because the oximeter counts all gases in the blood"], "a": [0], "y": "Right: CO binds hemoglobin so the monitor reads high while tissues are starved of oxygen. Why not a good oxygen level: the symptoms and history point to hypoxia. Why not falsely low: poor perfusion and a poor connection cause low readings, not CO. Why not accurate: the oximeter cannot tell CO from oxygen.", "tp": null}, {"ty": "ord", "d": 3, "q": "Put the murmur grades in order from quietest to loudest, using the description for each.", "items": ["Barely audible, not heard every time", "Quiet and soft, heard every time", "Intermediate loudness", "Palpable thrill", "Heard with the edge of the stethoscope lifted", "Heard with the stethoscope near but not touching the chest"], "y": "Right: grade 1 to grade 6 rises from barely audible, through a palpable thrill at grade 4, to a murmur heard with the stethoscope off the chest at grade 6.", "tp": null}, {"ty": "mc", "d": 3, "q": "A nurse hears a murmur with the edge of the stethoscope lifted slightly off the chest. How is it graded?", "o": ["Grade 5", "Grade 4", "Grade 6", "Grade 3"], "a": [0], "y": "Right: grade 5 is heard with the edge of the stethoscope lifted off the chest. Why not grade 4: grade 4 has a palpable thrill. Why not grade 6: grade 6 is heard with the stethoscope near but not touching the chest. Why not grade 3: grade 3 is intermediate and needs no lifted scope.", "tp": null}, {"ty": "mat", "d": 2, "q": "Match each murmur grade to what you hear or feel.", "pairs": [["Grade 1", "Barely audible"], ["Grade 2", "Quiet, heard every time"], ["Grade 3", "Intermediate"], ["Grade 4", "Palpable thrill"], ["Grade 5", "Edge of scope lifted"], ["Grade 6", "Scope near the chest"]], "y": "Grades rise with loudness: 1 barely, 2 quiet but every time, 3 intermediate, 4 thrill, 5 edge of scope lifted, 6 near the chest.", "tp": null}], "gro": [{"ty": "mc", "d": 3, "q": "A nurse needs to take a blood pressure on a 6-month-old. Which artery is the usual site?", "o": ["Lateral tibialis artery in the lower leg", "Brachial artery in the upper arm of either side", "Radial artery at the wrist of the dominant hand", "Carotid artery on the side of the neck"], "a": [0], "y": "Right: the Quiz 1 slides give the lateral tibialis artery in the lower leg as the infant blood pressure site. Why not the brachial artery: it is the site from school age up, and for toddlers it is one of two options. Why not the radial artery: it is a pulse site and is hard to palpate before age 2. Why not the carotid artery: it is not a cuff site."}, {"ty": "mc", "d": 3, "q": "An infant's legs cannot be used for a blood pressure. Which arm does the nurse use?", "o": ["The right upper arm", "The left upper arm, because it is closer to the heart", "Either upper arm, since the pressures are identical", "Neither arm, because arm readings are unreliable in infants"], "a": [0], "y": "Right: if the leg cannot be used, the right upper arm is preferred because the left arm gives false readings. Why not the left arm: the left gives false readings. Why not either arm: the pressures are not identical. Why not neither: the right arm is the accepted alternative."}, {"ty": "mc", "d": 3, "q": "Why must the cuff size be proportionate to the size of the child's extremity?", "o": ["A cuff that is too small reads falsely high and one that is too large reads falsely low", "A cuff that is too small reads falsely low because less artery is squeezed", "Cuff size changes only the pulse rate and not the pressure", "Any cuff works well as long as it is inflated slowly enough"], "a": [0], "y": "Right: a cuff that is too small needs more pressure to close the artery, so the reading is high, and one that is too large reads low, which is why the slide says size must be proportionate. Why not too small reads low: it is the reverse. Why not only the pulse changes: the pressure reading itself changes. Why not slow inflation: speed does not fix a wrong width."}, {"ty": "mc", "d": 3, "q": "A 10-year-old has a blood pressure of 112/68. How does the nurse interpret this?", "o": ["Within the school-age range of 91-125 over 54-90", "Too high, since school-age children run 60-80 systolic", "Too low, since diastolic should be over 90", "Within the toddler range, so it needs no further thought"], "a": [0], "y": "Right: 112 is within 91-125 and 68 is within 54-90 for school age. Why not too high: 60-80 is not the school-age systolic range. Why not too low: diastolic over 90 is above the range. Why not the toddler range: a 10-year-old is school age and the toddler range is lower."}, {"ty": "mc", "d": 3, "q": "When does an infant's birth weight usually triple?", "o": ["By 1 year of age", "By 6 months of age", "By 3 months of age", "By 2 years of age"], "a": [0], "y": "Right: weight doubles at 4 to 6 months and triples by 1 year. Why not 6 months: that is the doubling window. Why not 3 months: too early for a doubling. Why not 2 years: tripling happens by 1 year."}, {"ty": "mc", "d": 3, "q": "A 6-day-old has lost 8% of birth weight and is feeding well. What should the nurse conclude?", "o": ["This is expected and birth weight returns by 10 to 14 days", "This is a failure to thrive and needs a feeding change", "This needs a referral because newborns should not lose weight", "This means the weight will triple by 6 months"], "a": [0], "y": "Right: newborns lose up to 10% in the first week and regain it by 10 to 14 days. Why not failure to thrive: a normal loss with good feeding is not failure to thrive. Why not a referral: some loss is expected. Why not tripling by 6 months: tripling is by 1 year."}, {"ty": "mc", "d": 3, "q": "By what age does an infant's length increase by about 50%?", "o": ["12 months", "6 months", "3 months", "24 months"], "a": [0], "y": "Right: length increases about 50% by 12 months. Why not 6 months: the gain is about 2.5 cm a month, which is less than 50%. Why not 3 months: too early. Why not 24 months: by age 2 a toddler reaches half of adult height, which is a different milestone."}, {"ty": "mc", "d": 3, "q": "A child has tracked along the 50th percentile for weight and now plots near the 10th. What is the best action?", "o": ["Assess further, because a shift across percentile lines is significant", "Document it as normal, because children vary a lot in size", "Wait one full year and plot the child's weight again then", "Tell the parents to add formula to every feeding they give"], "a": [0], "y": "Right: children usually stay near the same percentile, so a shift across lines means further assessment. Why not normal variation: the shift is the concern. Why not waiting a year: delay could hide illness. Why not adding formula: the cause is unknown."}, {"ty": "mc", "d": 3, "q": "Which child is measured with a length board?", "o": ["A 15-month-old, since children under 2 are measured lying down", "A 4-year-old who has a cold and a low-grade fever today", "A 10-year-old who is anxious and a bit afraid of the scale", "An adolescent who is shy about being measured by a nurse"], "a": [0], "y": "Right: a recumbent length board is used for children under 2 years, under 85 cm, or too ill to stand. Why not the 4-year-old with a cold: he can stand. Why not the 10-year-old: standing height is used. Why not the adolescent: standing height is used."}, {"ty": "ord", "d": 3, "q": "Place the expected infant weight milestones in order.", "items": ["Weight loss of up to 10% in the first week", "Birth weight regained by 10 to 14 days", "Weight doubles at 4 to 6 months", "Weight triples by 1 year"], "y": "Loss first, then recovery, then doubling, then tripling."}, {"ty": "mat", "d": 3, "q": "Match each age group with its expected yearly height gain.", "pairs": [["Toddler", "7.5 cm (3 in)"], ["Preschooler", "6.4-9 cm (2.5-3.5 in)"], ["School-age child", "5 cm (2 in)"], ["Adolescent", "Final 20-25% of adult height in puberty"]], "y": "Toddlers gain 7.5 cm, preschoolers 6.4 to 9 cm, school-age children 5 cm, and adolescents gain a large final portion during puberty."}, {"ty": "mc", "d": 3, "q": "A mother asks when her daughter will likely start her periods. Which answer is accurate?", "o": ["Menarche ranges from age 10 to 16 and averages 12.5", "It always begins at age 9 with the first breast bud", "It begins at age 18 after growth ends", "It begins only after she reaches adult height"], "a": [0], "y": "Right: menarche ranges from 10 to 16 and averages 12.5. Why not age 9 always: pre-puberty may begin about 9 but menarche comes later. Why not 18: that is closer to when boys stop growing. Why not after adult height: she is still growing when periods begin."}, {"ty": "sata", "d": 3, "q": "Which arteries appear in the blood pressure cuff placement figure? Select all that apply.", "o": ["Radial artery", "Popliteal artery", "Dorsalis pedis artery", "Posterior tibial artery", "Carotid artery", "Aortic arch"], "a": [0, 1, 2, 3], "y": "Right: the figure shows the radial, popliteal, dorsalis pedis and posterior tibial arteries. Why not the carotid: it is in the neck and not a cuff site. Why not the aortic arch: it is inside the chest."}, {"ty": "mc", "d": 3, "q": "A 10-month-old's head circumference grew 0.5 cm in one month. How does the nurse interpret this?", "o": ["Expected, since growth slows to 0.5 cm a month in the second half of the first year", "Too slow, since it should be 2 cm every month at this age", "Too fast, since head growth should have stopped at 6 months", "Abnormal, since the head should not grow at all after 3 months"], "a": [0], "y": "Right: head circumference grows 2 cm a month for 3 months, then 1 cm a month for months 4 to 6, then 0.5 cm a month after that. Why not too slow: 2 cm is for the first 3 months. Why not too fast: growth continues. Why not no growth after 3 months: it slows, it does not stop."}, {"ty": "ngn", "d": 3, "scen": "A 5-day-old boy was 3,600 g at birth and weighs 3,300 g today. His mother is worried and says, 'He is feeding well and has plenty of wet diapers.'", "parts": [{"ty": "mc", "d": 3, "q": "How does the nurse interpret the weight?", "o": ["Expected loss of about 8%", "Dangerous loss needing admission", "Normal weight gain", "A scale error that makes the weight meaningless"], "a": [0], "y": "Right: 300 g is about 8% of 3,600 g, which is under the 10% a newborn can lose in the first week. Why not dangerous: it is under 10% with good feeding and output. Why not weight gain: it is a loss. Why not a scale error: there is no sign of one."}, {"ty": "mc", "d": 3, "q": "By when should the baby be back to birth weight?", "o": ["10 to 14 days", "At 4 to 6 months", "At 1 year", "At the next 3 weeks only"], "a": [0], "y": "Right: birth weight is regained by 10 to 14 days. Why not 4 to 6 months: that is when weight doubles. Why not 1 year: when it triples. Why not 3 weeks only: the expected window is 10 to 14 days."}], "y": "Expected newborn weight loss."}], "dos": [{"ty": "num", "d": 3, "q": "A child weighs 7 kg. What is the maintenance fluid in mL per day?", "ans": 700, "tol": 1, "unit": "mL per day", "y": "100 x 7 = 700 mL per day."}, {"ty": "num", "d": 3, "q": "A child weighs 14 kg. What is the maintenance fluid in mL per day?", "ans": 1200, "tol": 1, "unit": "mL per day", "y": "1,000 + 50 x (14 - 10) = 1,000 + 200 = 1,200 mL per day."}, {"ty": "num", "d": 3, "q": "A child weighs 32 kg. What is the maintenance fluid in mL per day?", "ans": 1740, "tol": 1, "unit": "mL per day", "y": "1,500 + 20 x (32 - 20) = 1,500 + 240 = 1,740 mL per day."}, {"ty": "num", "d": 3, "q": "A child weighs 9.5 kg. What is the maintenance fluid in mL per day?", "ans": 950.0, "tol": 1, "unit": "mL per day", "y": "100 x 9.5 = 950 mL per day."}, {"ty": "num", "d": 3, "q": "A child weighs 18 kg. What is the maintenance fluid rate in mL per hour? Round to the nearest tenth.", "ans": 58.3, "tol": 0.2, "unit": "mL per hour", "y": "1,000 + 50 x (18 - 10) = 1,000 + 400 = 1,400 mL per day. Divide by 24 = 58.3 mL per hour."}, {"ty": "num", "d": 3, "q": "A child weighs 45 kg. What is the maintenance fluid rate in mL per hour? Round to the nearest tenth.", "ans": 83.3, "tol": 0.2, "unit": "mL per hour", "y": "1,500 + 20 x (45 - 20) = 1,500 + 500 = 2,000 mL per day. Divide by 24 = 83.3 mL per hour."}, {"ty": "num", "d": 3, "q": "A child weighs 13 kg. What is the maintenance fluid rate in mL per hour? Round to the nearest tenth.", "ans": 47.9, "tol": 0.2, "unit": "mL per hour", "y": "1,000 + 50 x (13 - 10) = 1,000 + 150 = 1,150 mL per day. Divide by 24 = 47.9 mL per hour."}, {"ty": "num", "d": 3, "q": "A child weighs 44 pounds. What is the maintenance fluid in mL per day?", "ans": 1500, "tol": 1, "unit": "mL per day", "y": "44 / 2.2 = 20 kg first. 1,000 + 50 x (20 - 10) = 1,500 mL per day."}, {"ty": "mc", "d": 3, "q": "Which formula gives the daily maintenance fluid for a 17 kg child?", "o": ["1,000 + 50 x (17 - 10)", "100 x 17, using the whole weight", "1,500 + 20 x (17 - 20)", "1,000 + 50 x 17"], "a": [0], "y": "Right: 17 kg is in the 10 to 20 kg band, so 1,000 for the first 10 kg plus 50 for each of the 7 kg above 10 = 1,350 mL per day. Why not 100 x 17: that charges 100 mL for every kg and ignores the bands. Why not the 1,500 formula: that is for over 20 kg and here would subtract. Why not 1,000 + 50 x 17: that adds 50 for all 17 kg, not just the 7 above 10."}, {"ty": "mc", "d": 3, "q": "A nurse calculates the maintenance fluid for a 25 kg child as 25 x 100 = 2,500 mL per day. What is the error and the correct amount?", "o": ["Only the first 10 kg get 100 mL per kg, so the correct amount is 1,600 mL per day", "The nurse should have used 50 mL per kg, so the correct amount is 1,250 mL per day", "The nurse should have used 20 mL per kg, so the correct amount is 500 mL per day", "The nurse used the right formula, but the answer should be divided by 24 for the daily total"], "a": [0], "y": "Right: 1,500 + 20 x (25 - 20) = 1,500 + 100 = 1,600 mL per day. Why not 50 per kg: that ignores the first band and the over 20 kg band. Why not 20 per kg: that ignores the first 20 kg. Why not dividing by 24: that gives the hourly rate, not the daily total, and the formula itself was wrong."}, {"ty": "ord", "d": 3, "q": "Put the steps for a maintenance fluid question in order.", "items": ["Convert pounds to kg if needed", "Pick the formula that matches the weight band", "Calculate mL per day", "Divide by 24 for mL per hour", "Compare with the ordered rate and clarify if they differ"], "y": "Right: the weight must be in kg before the band is picked, the daily total comes before the hourly rate, and the comparison with the order is last."}, {"ty": "num", "d": 3, "q": "The order is 15 mg/kg/day divided every 8 hours for a child who weighs 18 kg. How many mg per dose?", "ans": 90, "tol": 0.5, "unit": "mg per dose", "y": "15 x 18 = 270 mg per day. Every 8 hours is 3 doses. 270 / 3 = 90 mg per dose."}, {"ty": "num", "d": 3, "q": "The order is 200 mg every 6 hours for a child who weighs 16 kg. How many mg/kg/day is this?", "ans": 50, "tol": 0.5, "unit": "mg/kg/day", "y": "Every 6 hours is 4 doses. 200 x 4 = 800 mg per day. 800 / 16 = 50 mg/kg/day."}, {"ty": "num", "d": 3, "q": "The safe range is 30 to 50 mg/kg/day divided every 8 hours for a child who weighs 12 kg. What is the highest safe single dose in mg?", "ans": 200, "tol": 1, "unit": "mg per dose", "y": "50 x 12 = 600 mg per day at the top of the range. 600 / 3 = 200 mg per dose."}, {"ty": "num", "d": 3, "q": "The order is 2.5 mg/kg/dose for a child who weighs 14.4 kg. How many mg per dose?", "ans": 36, "tol": 0.5, "unit": "mg per dose", "y": "mg/kg/dose is already per dose, so 2.5 x 14.4 = 36 mg. No dividing by doses."}, {"ty": "num", "d": 3, "q": "A child who weighs 9 kg receives 120 mg three times a day. How many mg/kg/day is this?", "ans": 40, "tol": 0.5, "unit": "mg/kg/day", "y": "120 x 3 = 360 mg per day. 360 / 9 = 40 mg/kg/day."}, {"ty": "num", "d": 3, "q": "The order is 90 mg and the label reads 160 mg per 5 mL. How many mL will the nurse give? Round to the nearest tenth.", "ans": 2.8, "tol": 0.1, "unit": "mL", "y": "90 / 160 x 5 = 2.8125, so 2.8 mL."}, {"ty": "mc", "d": 3, "q": "The order is 125 mg every 12 hours for a child who weighs 8 kg. The safe range is 20 to 40 mg/kg/day. What should the nurse do?", "o": ["Give it, because 250 mg per day is 31.3 mg/kg/day, inside the range", "Hold it, because 125 mg is above the 40 mg limit", "Hold it, because 250 mg per kg per day is far above the range", "Ask for the child's height first, since the range cannot be judged without it"], "a": [0], "y": "Right: every 12 hours is 2 doses, 125 x 2 = 250 mg per day, and 250 / 8 = 31.3 mg/kg/day. Why not holding for the 40 limit: the limit is mg per kg per day, not mg per dose. Why not 250 mg per kg: the 250 is the total for the child, not per kg. Why not height: the range is weight based."}, {"ty": "mc", "d": 3, "q": "A nurse calculates a dose for a 10 kg child with an order of 40 mg/kg/day in 3 doses and gives 400 mg per dose. What was the error?", "o": ["400 mg is the daily total, so each dose is 133 mg", "The nurse should have multiplied 40 by 3 doses to get 120 mg per dose", "The nurse should have divided 40 by the weight to get 4 mg per dose", "The nurse was right because the order gives the dose per kg already"], "a": [0], "y": "Right: 40 x 10 = 400 mg per day, then 400 / 3 = 133.3 mg per dose. Why not 40 x 3: the number of doses divides the daily total, it never multiplies mg/kg. Why not 40 / 10: dividing by weight gives a meaningless number. Why not the last: the order says per day, so 400 mg is the whole day."}, {"ty": "sata", "d": 3, "q": "Which steps turn an order in mg/kg/day into mg per dose? Select all that apply.", "o": ["Convert pounds to kg when the weight is in pounds", "Multiply mg/kg/day by the weight in kg", "Divide the daily total by the number of doses per day", "Multiply the daily total by the number of doses", "Divide by 24 to get the mg per dose", "Divide the weight by the mg/kg/day"], "a": [0, 1, 2], "y": "Right: the weight must be in kg, then mg/kg/day x kg gives mg per day, then dividing by doses per day gives one dose. Why not multiplying by doses: that makes the total larger than a day. Why not dividing by 24: 24 is for hourly fluid rates, not doses. Why not weight / mg/kg/day: the units do not cancel to mg."}, {"ty": "mat", "d": 2, "q": "Match what you are given and what you need to the correct step.", "pairs": [["mg/kg/day and kg", "Multiply to get mg per day"], ["mg per day and doses per day", "Divide to get mg per dose"], ["mg per dose x doses per day, then / kg", "mg/kg/day"], ["mg per dose / mg per mL", "mL per dose"]], "y": "mg/kg/day x kg gives mg per day. Dividing by doses gives a dose. Dose x doses per day, divided by kg, gives mg/kg/day. mg divided by the concentration gives mL."}, {"ty": "ngn", "d": 3, "scen": "A child weighs 22 pounds. The order reads 250 mg every 12 hours. The safe range is 25 to 45 mg/kg/day.", "parts": [{"ty": "num", "d": 3, "q": "What is the child's weight in kg?", "ans": 10, "tol": 0.1, "unit": "kg", "y": "22 / 2.2 = 10 kg."}, {"ty": "num", "d": 3, "q": "How many mg/kg/day is ordered?", "ans": 50, "tol": 0.5, "unit": "mg/kg/day", "y": "250 x 2 = 500 mg per day. 500 / 10 = 50 mg/kg/day."}, {"ty": "mc", "d": 3, "q": "What should the nurse do?", "o": ["Hold the dose and clarify the order with the prescriber", "Give the dose because 250 mg is under the 450 mg limit for one dose", "Give half the dose because that brings it into the range", "Give the dose and recheck the child's weight after the next one"], "a": [0], "y": "Right: 50 mg/kg/day is above the 45 maximum (450 mg per day), so the nurse holds and clarifies. Why not the first: 450 mg is the daily total, not a single-dose limit. Why not half: changing an order is not a nursing decision. Why not giving and rechecking: an overdose in a small child is harm that cannot be taken back."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 6-year-old who weighs 20 kg has an IV order for maintenance fluids.", "parts": [{"ty": "num", "d": 3, "q": "How many mL per day is the maintenance amount?", "ans": 1500, "tol": 1, "unit": "mL per day", "y": "1,000 + 50 x 10 = 1,500 mL per day."}, {"ty": "num", "d": 3, "q": "How many mL per hour? Round to the nearest tenth.", "ans": 62.5, "tol": 0.2, "unit": "mL per hour", "y": "1,500 / 24 = 62.5 mL per hour."}, {"ty": "mc", "d": 3, "q": "The pump reads 100 mL per hour. What is the best action?", "o": ["Check the order against 62.5 and clarify if they differ", "Leave it because a higher rate is always safer for a child", "Lower it to 62.5 on the nurse's own judgment since that is maintenance", "Divide the pump rate by 24 to see whether it matches"], "a": [0], "y": "Right: 100 mL per hour is well above the 62.5 maintenance, so the nurse checks the order and clarifies if it does not match. Why not leaving it: extra fluid can overload a child. Why not changing it alone: the order, not the formula, sets the rate. Why not dividing by 24: that turns an hourly rate into a meaningless number."}], "y": ""}]}, "cram": [{"ty": "mc", "d": 3, "q": "A 2-year-old screams when the nurse approaches with a stethoscope. Which first step is best?", "o": ["Let him touch the stethoscope while he sits on the parent's lap", "Move quickly so the exam is finished before he can react", "Ask the parent to leave the room so he stops his clinging", "Tell him in a loud and firm voice that he must be brave"], "a": [0], "y": "Right: handling the stethoscope on the parent's lap lowers a toddler's fear through play and security. Why not rushing: it frightens him. Why not asking the parent to leave: separation adds distress. Why not demanding he be brave: toddlers cannot comply and it adds shame."}, {"ty": "mc", "d": 3, "q": "A nurse records a respiratory rate of 40 in a sleeping 5-month-old. How should this be interpreted?", "o": ["Within range, since infants breathe 25-55 per minute", "Too high, since infants breathe 12-20 per minute", "Too low, since infants breathe 55-80 per minute", "Too high, since infants breathe 20-30 per minute"], "a": [0], "y": "Right: the infant range from Table 10.3 is 25-55, so 40 is within range. Why not 12-20: adolescent. Why not 55-80: not a range for any age. Why not 20-30: toddler."}, {"ty": "sata", "d": 3, "q": "Which findings in an infant should be reported? Select all that apply.", "o": ["Bulging fontanel while calm", "Central cyanosis", "Retractions with grunting", "Persistent strabismus after 6 months", "Acrocyanosis in a 1-day-old", "Abdominal breathing in a 3-month-old"], "a": [0, 1, 2, 3], "y": "Right: a persistent bulge, central cyanosis, retractions with grunting and strabismus past 6 months are abnormal. Why not acrocyanosis in a 1-day-old: normal. Why not abdominal breathing in a 3-month-old: normal diaphragmatic breathing."}, {"ty": "ord", "d": 3, "q": "Place the steps in order for giving an oral liquid medication to a 5-month-old.", "items": ["Verify the order and ID band", "Calculate and check the dose against the child's weight", "Draw up the dose in an oral syringe", "Place the syringe at the inner cheek and give slowly", "Praise and document"], "y": "Safety checks come first, then the dose, then the technique, then documentation."}, {"ty": "mat", "d": 3, "q": "Match each finding with the Tanner stage for girls.", "pairs": [["Breast bud", "Stage 2"], ["Further enlargement with a smooth contour", "Stage 3"], ["Secondary mound", "Stage 4"], ["Only the nipple projects", "Stage 5"]], "y": "Stage 2 is the bud, stage 3 is more growth, stage 4 is a secondary mound, stage 5 is the mature breast."}, {"ty": "num", "d": 3, "q": "A child weighs 22 kg. What is the maintenance rate in mL/hr? Round to the nearest tenth.", "ans": 64.2, "tol": 0.2, "unit": "mL/hr", "y": "1000 + 500 + (2 x 20 = 40) = 1,540 mL/day. 1,540 / 24 = 64.2 mL/hr."}, {"ty": "mc", "d": 3, "q": "A child with leukemia has a DNR order. Which care continues?", "o": ["Comfort measures, pain control and family support", "Cardiopulmonary resuscitation if the heart should stop beating", "Chest compressions only, without breaths or any medications", "No further care of any kind, since the order stops treatment"], "a": [0], "y": "Right: DNR withholds CPR, and comfort measures, pain control and family support continue. Why not CPR: it goes against the order. Why not chest compressions only: the order withholds them. Why not no care at all: palliative care continues."}, {"ty": "mc", "d": 3, "q": "A 3-year-old with a chronic illness will not feed himself and the mother does everything. Which concern fits?", "o": ["Risk to autonomy, the toddler task", "Risk to industry, the school-age task", "Risk to identity, the adolescent task", "Risk to trust, the infant task"], "a": [0], "y": "Right: the toddler task is autonomy, and a parent who does everything blocks it. Why not industry: school age. Why not identity: adolescence. Why not trust: infancy."}, {"ty": "mc", "d": 3, "q": "Which statement shows correct understanding of a hospitalized child's regression?", "o": ["It is an expected response to stress and should not be punished", "It shows that the child is being manipulative on purpose", "It always means that the child has a developmental delay", "It means that the parent is doing something wrong at home"], "a": [0], "y": "Right: regression is an expected coping response to stress and is not punished. Why not manipulation: it is fear. Why not delay: it appeared with the stress. Why not parent fault: it is a normal response."}, {"ty": "mc", "d": 3, "q": "A mother of a child with Down syndrome asks about school services for her 4-year-old. Which is accurate?", "o": ["Preschool special education services are available for ages 3 to 5", "Services do not begin until a child reaches 6 years of age", "Services are available only for children older than 12 years", "Early intervention is the program used for ages 3 to 5 years"], "a": [0], "y": "Right: the slide says preschool services are mandated for ages 3 to 5. Why not age 6: services begin earlier. Why not only older than 12: IDEA covers young children. Why not early intervention for 3 to 5: that is birth to age 2."}, {"ty": "mc", "d": 3, "q": "Which nursing action best addresses a language barrier during teaching?", "o": ["Use a qualified interpreter and use teach-back", "Ask a young sibling to translate", "Use gestures and short sentences only", "Give the written handout in English"], "a": [0], "y": "Right: a qualified interpreter plus teach-back ensures the family understands. Why not a young sibling: the slide says not to use children. Why not gestures and short sentences: they are not enough for teaching. Why not an English handout: she cannot read it."}, {"ty": "sata", "d": 3, "q": "Which statements about adult learning are correct? Select all that apply.", "o": ["Adults want to solve an immediate need", "Adults bring past experience to learning", "Adults are self-directed", "Adults need to know why they should learn something", "Adults learn best through lecture alone", "Adults prefer having the teacher decide everything"], "a": [0, 1, 2, 3], "y": "Right: the slide gives adults as self-directed, problem focused, wanting an immediate need met and valuing experience, and they need to know why they are learning. Why not lecture alone: adults learn by applying. Why not the teacher deciding everything: adults are self-directed."}, {"ty": "mc", "d": 3, "q": "A nurse asks a mother how many medications her child takes. Which part of the interview is this?", "o": ["Past health history", "Chief complaint", "Family history", "Developmental history"], "a": [0], "y": "Right: medications taken belong to past health history. Why not chief complaint: the reason for the visit. Why not family history: relatives' conditions. Why not developmental history: milestones."}, {"ty": "mc", "d": 3, "q": "A child's pulse oximeter reads 99% but he is pale and tired. Which cause is possible?", "o": ["Anemia or carbon monoxide poisoning can hide hypoxia", "Warm fingers with good perfusion on the probe", "A well-placed probe with no ambient light", "A normal hemoglobin value"], "a": [0], "y": "Right: anemia and carbon monoxide poisoning can give a normal reading while the child is hypoxic, so the nurse trusts the child's appearance. Why not warm fingers with good perfusion: that gives a reliable reading. Why not a well-placed probe without ambient light: it also improves accuracy. Why not a normal hemoglobin: abnormal values cause the error."}, {"ty": "num", "d": 3, "q": "A child's BSA is 0.5 m2 and the adult dose is 400 mg. Using BSA / 1.73 x adult dose, how many mg? Round to a whole number.", "ans": 116, "tol": 1, "unit": "mg", "y": "0.5 / 1.73 = 0.289. 0.289 x 400 = 116 mg."}, {"ty": "mc", "d": 3, "q": "Which IV finding in an infant requires immediate action?", "o": ["Pale, cool and puffy skin around the site", "A dry and intact dressing", "A secured arm board", "Fluids infusing at the ordered rate"], "a": [0], "y": "Right: pale, cool, puffy skin suggests infiltration. Why not a dry intact dressing: normal. Why not a secured arm board: protective. Why not the ordered rate: that is correct."}, {"ty": "mc", "d": 3, "q": "Which feeding method keeps the gut working in a child who can digest food?", "o": ["Enteral feeding", "Total parenteral nutrition", "Clear fluids alone", "Bed rest without feeding"], "a": [0], "y": "Right: enteral feeding keeps the gut working, as the slide says it is for patients with a functioning GI tract. Why not TPN: for a nonworking gut. Why not clear liquids alone: not enough nutrition. Why not no feeding: starvation."}, {"ty": "mc", "d": 3, "q": "A nurse is choosing an IV site for a 5-month-old. Which choice follows the slides?", "o": ["The foot", "The scalp, since it is always the first choice in infants", "The upper arm, since larger veins are always preferred", "The neck, since it is the largest accessible vein"], "a": [0], "y": "Right: the slide says hands, feet and forearms are common sites, so the foot is correct for a 5-month-old. Why not the scalp first: it is a last resort up to about 9 months. Why not the upper arm: the hand is preferred. Why not the neck: not a peripheral site on the slides."}, {"ty": "mc", "d": 3, "q": "Which sample statement is the Situation in SBAR?", "o": ["I am calling about the 3-year-old in room 4 who has a temperature of 40 C", "I recommend that a blood culture be drawn before any antibiotics", "He was admitted yesterday with a urinary tract infection and is on fluids", "He looks flushed, is lethargic and his heart rate is 150 and regular"], "a": [0], "y": "Right: the S states who the patient is and the problem. Why not the culture: that is the Recommendation. Why not the admission history: Background. Why not the findings: Assessment."}, {"ty": "mc", "d": 3, "q": "According to Maslow, which need is met first in a child with respiratory distress?", "o": ["Oxygenation", "Safety", "Belonging", "Self-esteem"], "a": [0], "y": "Right: breathing is a physiological need and comes first. Why not safety: it comes after. Why not belonging: higher. Why not self-esteem: higher."}, {"ty": "sata", "d": 3, "q": "Which actions help a hospitalized preschooler cope? Select all that apply.", "o": ["Allow play with medical equipment", "Give simple honest explanations", "Let a parent stay", "Provide familiar objects from home", "Keep procedures secret until they begin", "Limit toys to keep the room neat"], "a": [0, 1, 2, 3], "y": "Right: play, honesty, parent presence and familiar items lower a preschooler's fear. Why not secrecy: it increases fear. Why not limiting toys: play is a coping tool."}, {"ty": "ord", "d": 3, "q": "Place the Tanner changes in girls in order.", "items": ["Breast bud", "Pubic hair", "Axillary hair", "Menarche"], "y": "Breast, pubic hair, axillary hair, then menstruation."}, {"ty": "mc", "d": 3, "q": "Which statement about a child's chronic illness and identity is correct?", "o": ["An adolescent may feel different from peers and need support", "Adolescents are not affected in any way by a chronic illness", "Adolescents always accept the illness with no emotional difficulty", "Adolescents care only about their parents' opinions of them"], "a": [0], "y": "Right: adolescents may feel different from peers and need support as they form identity. Why not unaffected: illness affects them. Why not always accepting: not true. Why not parents' opinions only: peers matter most."}, {"ty": "mc", "d": 3, "q": "A child's order reads 0.25 mL. The nurse sees .25 mL. Which is true?", "o": ["The missing leading zero risks a tenfold error", "It makes no difference to the dose that will be drawn up", "The dose is safer because it is written in a shorter way", "The dose will be rounded up to the nearest whole milliliter"], "a": [0], "y": "Right: .25 has no leading zero, so a missed decimal could become 25 mL, a tenfold error. Why not no difference: the zero matters. Why not safer: it is riskier. Why not rounded up: nothing is rounded."}, {"ty": "ngn", "d": 3, "scen": "A 5-year-old weighing 20 kg is admitted with dehydration. The nurse notes dry mucous membranes, a heart rate of 130 and urine output of 0.3 mL/kg/hr.", "parts": [{"ty": "sata", "d": 3, "q": "Which findings support dehydration? Select all that apply.", "o": ["Dry mucous membranes", "Heart rate of 130", "Low urine output", "Fussiness", "Moist mucous membranes", "A heart rate of 70"], "a": [0, 1, 2, 3], "y": "Right: dry membranes, a fast heart rate, low urine output and fussiness fit dehydration. Why not moist membranes: normal. Why not a heart rate of 70: not expected for a 5-year-old with dehydration, whose range is 65-110 but whose rate would rise."}, {"ty": "num", "d": 3, "q": "What is the maintenance fluid in mL/hr? Round to the nearest tenth.", "ans": 62.5, "tol": 0.2, "unit": "mL/hr", "y": "1000 + 500 = 1,500 mL/day. 1,500 / 24 = 62.5 mL/hr."}], "y": "Assess, calculate, evaluate."}, {"ty": "mc", "d": 3, "q": "Which action keeps an adolescent engaged in teaching?", "o": ["Offer private time and let him set learning goals", "Teach only his parent and send the teen out of the room", "Use long lectures that cover everything in one sitting", "Tell him exactly what he must do and when he must do it"], "a": [0], "y": "Right: adolescents need privacy and control to engage. Why not teaching only the parent: it excludes him. Why not long lectures: they disengage. Why not commands: they threaten autonomy."}, {"ty": "mc", "d": 3, "q": "Which is a sign of increased intracranial pressure in an infant?", "o": ["Bulging fontanel while calm", "Sunken fontanel", "Closed fontanel at 12 months", "Soft spot that pulses lightly"], "a": [0], "y": "Right: a persistent bulge suggests raised ICP. Why not sunken: dehydration. Why not closed at 12 months: normal, since closure is 9 to 18 months. Why not a lightly pulsing soft spot: normal."}, {"ty": "mc", "d": 3, "q": "A parent asks why the nurse counts the heart rate before touching the infant. Which answer is best?", "o": ["A quiet baby gives accurate rates, and touch or crying raises them", "It is faster to do the vital signs before anything else", "It does not matter when the rates are counted in the visit", "The baby must be wide awake and alert before they are counted"], "a": [0], "y": "Right: a quiet infant gives accurate rates, and the slide says to count rates before undressing. Why not for speed: not the reason. Why not timing does not matter: it does. Why not awake: sleeping is best."}, {"ty": "mat", "d": 3, "q": "Match each medication route to the best site or technique.", "pairs": [["IM injection, 12 months or younger", "Vastus lateralis"], ["IM injection, over 12 months", "Vastus lateralis, deltoid may be considered"], ["Eye drops", "Look up and to the side, dropper 1 inch away"], ["Nose drops", "Supine, head hyperextended at least a minute"]], "y": "Know the site and the reason."}, {"ty": "mc", "d": 3, "q": "Which statement shows the parent understands teaching about an inhaler?", "o": ["I will show you how I use it and explain each step", "I will watch and read the handout later", "I understand how to use it", "I will remember what you said"], "a": [0], "y": "Right: a return demonstration with explanation shows learning at the top of the cone. Why not reading later: no evidence of learning. Why not saying 'I understand': a statement is not a skill. Why not 'I will remember': also not shown."}, {"ty": "mc", "d": 3, "q": "A child's DNR order has special limits. Who must be told?", "o": ["The whole care team, so the order is followed", "Only the child's primary nurse needs to know about the order", "Only the parents need to know since they requested it", "Only the pharmacy needs to know about the limits in the order"], "a": [0], "y": "Right: the order must be known by the whole team so it is followed. Why not one nurse: others will not know. Why not only the parents: staff must act. Why not only the pharmacy: not who responds to an arrest."}, {"ty": "mc", "d": 3, "q": "What is the main reason premature infants are assessed by corrected age?", "o": ["It avoids labeling normal development as delayed", "It makes the infant appear older than he really is on the chart", "It speeds up the infant's growth and the reaching of milestones", "It is only required after the child reaches 5 years of age"], "a": [0], "y": "Right: corrected age compares the infant fairly and avoids labeling normal development as delayed. Why not looking older: it makes him younger. Why not speeding growth: it changes the comparison. Why not only after 5: it is used from the start."}, {"ty": "mc", "d": 3, "q": "Which action is best when a family's cultural practice differs from the care plan?", "o": ["Ask about the practice and adjust the plan if it is safe", "Tell the family to stop the practice while the child is in the hospital", "Ignore the practice completely since it is not on the care plan", "Document the refusal and discharge the child to avoid conflict"], "a": [0], "y": "Right: asking and accommodating safe practices is culturally competent care. Why not telling them to stop: dismisses beliefs. Why not ignoring: loses trust. Why not documenting refusal and discharge: premature."}, {"ty": "num", "d": 3, "q": "A child weighs 16 kg. What is the maintenance fluid in mL per day?", "ans": 1300, "tol": 1, "unit": "mL per day", "y": "1,000 + 50 x 6 = 1,300 mL per day.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 35 kg. What is the maintenance fluid in mL per hour? Round to the nearest tenth.", "ans": 75, "tol": 0.2, "unit": "mL per hour", "y": "1,500 + 20 x 15 = 1,800 mL per day. 1,800 / 24 = 75 mL per hour.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 4 kg. What is the maintenance fluid in mL per day?", "ans": 400, "tol": 1, "unit": "mL per day", "y": "Under 10 kg: 100 x 4 = 400 mL per day.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 66 pounds. What is the maintenance fluid in mL per day?", "ans": 1700, "tol": 1, "unit": "mL per day", "y": "66 / 2.2 = 30 kg first. 1,500 + 20 x (30 - 20) = 1,700 mL per day.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "The order is 24 mg/kg/day divided every 12 hours for a child who weighs 15 kg. How many mg per dose?", "ans": 180, "tol": 0.5, "unit": "mg per dose", "y": "24 x 15 = 360 mg per day. Every 12 hours is 2 doses. 360 / 2 = 180 mg per dose.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child who weighs 12 kg receives 75 mg every 6 hours. How many mg/kg/day is this?", "ans": 25, "tol": 0.5, "unit": "mg/kg/day", "y": "75 x 4 = 300 mg per day. 300 / 12 = 25 mg/kg/day.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "The order is 5 mg/kg/dose for a child who weighs 8.4 kg. How many mg per dose?", "ans": 42, "tol": 0.5, "unit": "mg per dose", "y": "5 x 8.4 = 42 mg. No dividing by doses.", "tp": "dose"}, {"ty": "mc", "d": 3, "q": "Which weight uses the formula 1,000 + 50 x (kg - 10)?", "o": ["A 14 kg child", "A 9 kg infant", "A 22 kg school-age child", "A 30 kg adolescent"], "a": [0], "y": "Right: 10 to 20 kg is the middle band, and 14 kg is in it. Why not 9 kg: under 10 kg is 100 x kg. Why not 22 kg or 30 kg: over 20 kg uses 1,500 + 20 x (kg - 20).", "tp": "dose"}, {"ty": "mc", "d": 3, "q": "A child who weighs 20 kg has an order of 250 mg every 6 hours. The safe range is 30 to 60 mg/kg/day. What is the ordered mg/kg/day and is it safe?", "o": ["50 mg/kg/day, safe", "12.5 mg/kg/day, below the range so the dose is too low", "25 mg/kg/day, below the range so the dose is too low", "200 mg/kg/day, above the range so the dose is unsafe"], "a": [0], "y": "Right: 250 x 4 = 1,000 mg per day and 1,000 / 20 = 50, inside 30 to 60. Why not 12.5: that divides one dose by weight and forgets the 4 doses. Why not 25: that uses 2 doses instead of 4. Why not 200: that multiplies instead of dividing by weight.", "tp": "dose"}, {"ty": "sata", "d": 3, "q": "Which weights are in the band that uses 1,500 + 20 x (kg - 20)? Select all that apply.", "o": ["21 kg", "28 kg", "44 kg", "10 kg", "12 kg", "18 kg"], "a": [0, 1, 2], "y": "Right: anything over 20 kg uses this formula. Why not 10 kg: that is the first band. Why not 12 kg or 18 kg: both are in the 10 to 20 kg band.", "tp": "dose"}, {"ty": "ord", "d": 3, "q": "Put the steps in order to check whether a mg/kg/day order is safe.", "items": ["Convert pounds to kg", "Multiply the range by kg for the lowest and highest safe mg per day", "Multiply the ordered mg per dose by doses per day", "Compare the ordered daily total with the safe range", "Give the dose, or hold and clarify if it is out of range"], "y": "Right: the weight comes first, then the safe daily limits, then the ordered daily total, then the decision.", "tp": "dose"}, {"ty": "mat", "d": 2, "q": "Match each dose question to its first step.", "pairs": [["Order in mg/kg/day, need the dose", "Multiply by kg"], ["Dose given, need mg/kg/day", "Multiply by doses per day"], ["Weight in pounds", "Divide by 2.2"], ["Hourly fluid rate", "Divide the daily total by 24"]], "y": "Each starts a different calculation: mg/kg/day x kg, dose x doses per day, pounds / 2.2, and daily / 24.", "tp": "dose"}, {"ty": "ngn", "d": 3, "scen": "A child weighs 18 kg. The order is 300 mg every 8 hours. The safe range is 40 to 60 mg/kg/day.", "parts": [{"ty": "num", "d": 3, "q": "How many mg/kg/day is ordered?", "ans": 50, "tol": 0.5, "unit": "mg/kg/day", "y": "300 x 3 = 900 mg per day. 900 / 18 = 50 mg/kg/day."}, {"ty": "mc", "d": 3, "q": "What should the nurse do?", "o": ["Give the dose, since 50 is inside the 40 to 60 range", "Hold the dose, since 300 mg is above 60 mg", "Hold the dose until the pharmacy halves it", "Give the dose, then recalculate with the child's height"], "a": [0], "y": "Right: 50 mg/kg/day is inside 40 to 60. Why not holding for 60: the range is per kg per day, not per dose. Why not halving: nothing is out of range. Why not height: the range is weight based."}], "y": "", "tp": "dose"}, {"ty": "mc", "d": 3, "q": "A nurse is giving an oral liquid antibiotic to a 5-month-old. Which technique is correct?", "o": ["Use an oral syringe with the tip in the side of the mouth along the cheek, a little at a time", "Place the syringe tip at the back of the tongue so the whole dose goes down at once and cannot be spat out", "Put the tip in the center front of the mouth and push the plunger quickly so the baby does not refuse it", "Mix the dose into a full bottle of formula so the baby swallows it over the whole feeding"], "a": [0], "y": "Right: the side of the mouth along the cheek lets the baby swallow a little at a time and lowers the choking risk. Why not the back of the tongue: it triggers gagging and aspiration. Why not the front center with a fast push: the tongue thrusts the drug back out and a fast push can choke the baby. Why not the bottle: if the baby stops early the dose is incomplete, and the drug can make the formula taste bad so the baby refuses it later."}, {"ty": "mc", "d": 3, "q": "A nurse is teaching a group of adult patients about wound care at home. Which approach fits how adults learn?", "o": ["Start with the problem the teaching solves and give tasks they can use right away", "Begin with the full anatomy of skin healing before giving any of the home instructions", "Decide the content alone because adults wait for an expert to set the goals", "Skip their past experience with wounds so old habits do not get in the way"], "a": [0], "y": "Right: adult learners are problem focused and task oriented, so a teaching plan that starts with the problem and a usable skill matches how they learn. Why not anatomy first: that is subject focused, which fits children better. Why not deciding alone: adults are self directed and want a say in what they learn. Why not skipping past experience: adults bring experience and learn best when it is used."}, {"ty": "mc", "d": 3, "q": "A nurse auscultates a murmur that is quiet and soft and is heard every time the chest is auscultated. How is it graded?", "o": ["Grade 2", "Grade 1", "Grade 3", "Grade 4"], "a": [0], "y": "Right: grade 2 is quiet and soft but heard every time. Why not grade 1: grade 1 is barely audible and is heard only with intense concentration, not every time. Why not grade 3: that is intermediate intensity, louder than quiet and soft. Why not grade 4: grade 4 is the first grade with a palpable thrill."}, {"ty": "mc", "d": 3, "q": "A toddler spits out a tablet at every dose. Which action should the nurse take?", "o": ["Ask the pharmacy whether the drug comes as a liquid or can be made into a slurry", "Crush the tablet and stir it into the child's full bottle of formula so it is hidden", "Pinch the child's nose and tip the head back so the tablet is swallowed", "Skip the dose and chart that the child refused so the prescriber is told at rounds"], "a": [0], "y": "Right: when a form does not work the nurse calls the pharmacy for another form such as a liquid or slurry. Why not hiding it in formula: bitter crushed drug in formula makes the child refuse feedings later. Why not pinching the nose: it forces swallowing and risks aspiration. Why not skipping the dose: a missed dose harms the child, and a refusal needs a solution and a call to the prescriber now, not at rounds."}, {"ty": "mc", "d": 3, "q": "An 8-year-old asks a nurse whether the IV will hurt. Her mother answers for her. What is the best nursing response?", "o": ["Turn to the child and answer her directly and honestly in simple words", "Thank the mother and let her explain it, since parents know their child's fears best", "Tell the child it will not hurt at all so that she stays calm for the insertion", "Hand her a toy and change the subject so her worry does not grow before the procedure"], "a": [0], "y": "Right: school-age children are working on industry and need to be spoken to directly and answered honestly. Why not letting the mother explain: it leaves the child out and costs her trust. Why not saying it will not hurt: a lie breaks trust the first time it does hurt. Why not changing the subject: ignoring the question leaves the fear unanswered."}, {"ty": "sata", "d": 3, "q": "Which measures prevent dental problems in a newborn? Select all that apply.", "o": ["Gently wipe the gums with a soft cloth or gauze after feedings", "Do not put the baby to bed with a bottle", "Begin brushing when the first tooth erupts", "Let the baby carry a bottle of juice for comfort between feedings", "Wait until age 3 before starting any mouth care", "Dip the pacifier in sugar water to soothe the baby"], "a": [0, 1, 2], "y": "Right: wiping the gums removes milk, a bedtime bottle bathes the gums and new teeth in milk or juice, and brushing starts with the first tooth. Why not the juice bottle and the sugar pacifier: both keep sugar on the gums and teeth. Why not waiting until age 3: the teeth are exposed to decay from the day they erupt."}, {"ty": "ord", "d": 3, "q": "Put the steps for giving an oral liquid to an infant in order.", "items": ["Check the order and the child's identity", "Hold the infant semi-upright", "Draw the dose into an oral syringe", "Place the tip in the side of the mouth along the cheek", "Give small amounts slowly and let the baby swallow", "Document the dose and how the baby tolerated it"], "y": "Right: checking the order and identity comes first, then the baby is positioned to lower aspiration risk, the dose is prepared, placed at the cheek, given slowly and documented last."}, {"ty": "mc", "d": 3, "q": "A child with immature kidneys receives a drug that builds up because the kidneys clear it slowly. Which concept does this describe?", "o": ["Pharmacokinetics, because the body is clearing the drug more slowly", "Pharmacodynamics, because the drug is changing how the kidney cells work", "Pharmacodynamics, because the drug now has a stronger effect at the same dose", "Pharmacokinetics, because the drug is moving in the body only during absorption"], "a": [0], "y": "Right: excretion is one of the four kinetic processes (absorption, distribution, metabolism, excretion), and immature kidneys slow it, so the drug stays longer and can be toxic. Why not the first pharmacodynamics choice: it names a cell-level effect, not clearance. Why not the second: the stem describes the body clearing the drug, not the drug acting on the body. Why not the last: kinetics covers all four processes, not only absorption."}, {"ty": "mc", "d": 3, "q": "A nurse examines a boy whose penis is wider as well as longer, whose scrotum is darker, and whose pubic hair is coarse and curly but not yet on the thighs. Which Tanner stage is this?", "o": ["Stage 4", "Stage 2", "Stage 3", "Stage 5"], "a": [0], "y": "Right: wider and longer with a darkened scrotum is stage 4. Why not stage 2: that is testicular enlargement and scrotal reddening with thin hair. Why not stage 3: the penis only lengthens. Why not stage 5: that is adult size and the hair spreads onto the thighs."}, {"ty": "mat", "d": 2, "q": "Match each murmur description to its grade.", "pairs": [["Barely audible, not heard every time", "Grade 1"], ["Quiet and soft, heard every time", "Grade 2"], ["Audible with a palpable thrill", "Grade 4"], ["Heard with the edge of the stethoscope lifted", "Grade 5"]], "y": "Grade 1 is barely audible. Grade 2 is quiet and heard every time. Grade 4 is the first with a thrill. Grade 5 is loud enough to hear with the edge of the scope lifted off the chest."}, {"ty": "ngn", "d": 3, "scen": "A nurse is giving a liquid antibiotic to a 6-month-old. The baby cries and spits out half of the dose. The mother suggests putting the rest of the medicine in the bottle.", "parts": [{"ty": "mc", "d": 3, "q": "What should the nurse tell the mother about mixing the drug into the bottle?", "o": ["Do not mix it, because the baby may refuse the rest of the feeding", "It is fine if the bottle is warm, because heat makes the drug dissolve", "It is fine if only half of the bottle is used, so the baby finishes it quickly", "It is fine because infants swallow more medicine when they are sucking"], "a": [0], "y": "Right: a drug mixed in formula can taste bad so the baby refuses feedings later, and if the baby does not finish the bottle the dose is unknown. Why not the warm bottle: warming does not fix taste or dose accuracy. Why not the half bottle: a partly finished bottle still gives an unknown dose. Why not sucking: sucking does not guarantee the baby takes the full amount."}, {"ty": "sata", "d": 3, "q": "Which actions should the nurse take next? Select all that apply.", "o": ["Hold the baby semi-upright", "Use the oral syringe in the side of the mouth along the cheek", "Give the remaining dose in small amounts", "Notify the prescriber or pharmacy if the dose cannot be given reliably", "Lay the baby flat to keep the drug from running out", "Aim the syringe at the back of the throat"], "a": [0, 1, 2, 3], "y": "Right: semi-upright, cheek placement and small amounts lower the choking risk, and the prescriber or pharmacy is told if the dose cannot be given. Why not flat: lying flat raises aspiration risk. Why not the back of the throat: it triggers gagging and aspiration."}], "y": ""}, {"ty": "mc", "d": 3, "q": "A nurse states that adult learners are subject focused and children are problem focused. Which statement corrects this?", "o": ["It is reversed: adults are problem focused, children subject focused", "It is correct, since adults need the full theory before they can use it", "It is partly correct, since both groups are problem focused after age 12", "It is irrelevant, since learning style does not change with age"], "a": [0], "y": "Right: adults (Knowles) are problem focused and task oriented. Why not the first: that describes subject focus, the child pattern. Why not the second: the slides do not put adolescents in the adult pattern. Why not the third: age and developmental level change how teaching must be planned."}, {"ty": "mc", "d": 3, "q": "After a nurse gives nose drops to a 4-year-old, the mother says she will keep the child's head tilted back for 5 minutes. What is the best response?", "o": ["Tell her that about 1 minute is the right time to keep the head back", "Agree, since a longer time lets more of the drug absorb into the nose", "Agree, but only if the child is lying quietly with the eyes closed", "Tell her the head should come up right away so the drops do not run into the throat"], "a": [0], "y": "Right: the head stays hyperextended for about 1 minute, so 5 minutes is wrong. Why not agreeing for absorption: the rule is a set time and longer does not make it work better, and a child will not hold still that long. Why not agreeing if the child is quiet: a calm child does not change the time. Why not sitting up at once: the drops would drain back out before they work."}, {"ty": "sata", "d": 3, "q": "Which actions are correct when giving nose drops to a child? Select all that apply.", "o": ["Have the child blow the nose first or use a bulb syringe", "Position the child supine with the head hyperextended", "Keep the dropper from touching the nares", "Use medication at room temperature", "Seat the child upright with the chin tucked to the chest", "Touch the dropper to the nostril so no drop is lost", "Keep the head back for 5 minutes"], "a": [0, 1, 2, 3], "y": "Right: the nose is cleared first, the head is tipped back, the dropper stays clean and the drug is room temperature. Why not upright with the chin tucked: the drops run out the front. Why not touching the nostril: it contaminates the dropper. Why not 5 minutes: the rule is 1 minute."}, {"ty": "ord", "d": 3, "q": "Put the steps for giving nose drops to a child in order.", "items": ["Make sure the drops are at room temperature", "Have the child blow the nose or use a bulb syringe", "Position the child supine with the head hyperextended", "Give the drops without touching the nares", "Keep the head hyperextended for 1 minute"], "y": "Right: the drug is checked first, the nose is cleared so the drops reach the tissue, then the child is positioned, the drops are given and the head stays back for 1 minute."}, {"ty": "mc", "d": 3, "q": "A drug lowers a child's fever by acting on the temperature center in the brain. Which concept describes this?", "o": ["Pharmacodynamics, because it is what the drug does to the body", "Pharmacokinetics, because it describes the drug moving through the body", "Pharmacokinetics, because the child's weight changes how the dose works", "Neither, because an effect on the brain is only an adverse reaction"], "a": [0], "y": "Right: pharmacodynamics is the drug acting on the body, such as lowering the fever. Why not the first pharmacokinetics choice: movement through the body is absorption, distribution, metabolism and excretion. Why not the second: weight affects the dose, but it is not the drug effect. Why not neither: lowering the fever is the intended effect."}, {"ty": "mat", "d": 2, "q": "Match each term to its meaning.", "pairs": [["Pharmacodynamics", "What the drug does to the body"], ["Pharmacokinetics", "What the body does to the drug"], ["Absorption, distribution, metabolism, excretion", "The four kinetic processes"], ["Nose drops hold time", "Head hyperextended for 1 minute"]], "y": "Dynamics is the drug's action, kinetics is the drug's movement (ADME), and nose drops need the head back for 1 minute."}, {"ty": "ngn", "d": 3, "scen": "A mother is giving nose drops to her 3-year-old, who has a stuffy nose. The child is sitting up and the mother plans to keep the head tilted back for 5 minutes after the drops.", "parts": [{"ty": "mc", "d": 3, "q": "What should the nurse teach first?", "o": ["Have the child blow the nose, then lay the child down with the head tipped back", "Give the drops while the child sits and then lay the child down for 5 minutes", "Warm the bottle in hot water so the drops spread through the nose better", "Touch the dropper to the nostril so the child cannot sneeze the drops out"], "a": [0], "y": "Right: the nose is cleared first and the child lies supine with the head hyperextended. Why not sitting first: the drops would run out before the position is set. Why not hot water: the drug should be room temperature. Why not touching the nostril: the dropper must not touch the nares."}, {"ty": "mc", "d": 3, "q": "How long should the mother keep the head hyperextended?", "o": ["1 minute", "5 minutes", "10 seconds", "Until the child falls asleep"], "a": [0], "y": "Right: 1 minute. Why not 5 minutes: her review named 5 minutes as the wrong statement. Why not 10 seconds: that is too short for the drops to stay in the nose. Why not until asleep: there is no such rule and a child may not fall asleep."}], "y": ""}, {"ty": "mc", "d": 3, "q": "A nurse is asked what total parenteral nutrition contains. Which answer matches the slide?", "o": ["A concentrated mix of carbohydrates, electrolytes, vitamins and minerals", "A dilute dextrose and saline solution that runs through a peripheral IV line", "Whole formula that is blended and then given through a gastrostomy tube", "Plain sterile water with a small amount of potassium chloride added to it"], "a": [0], "y": "Right: TPN is a highly concentrated mix of carbohydrates, electrolytes, vitamins and minerals given by central line. Why not dilute dextrose and saline: that describes a peripheral IV fluid, not TPN. Why not blended formula: that is an enteral feeding, which needs a working gut. Why not sterile water with potassium: it gives no nutrition.", "tp": null}, {"ty": "sata", "d": 3, "q": "Which measures reduce complications for a child receiving TPN? Select all that apply.", "o": ["Monitor blood glucose levels", "Use an occlusive dressing and check the insertion site", "Keep the system closed at all times", "Assess intake and output frequently", "Monitor vital signs closely", "Open the line at the hub to hang each new bag without cleaning", "Stop checking labs once the child is stable on the solution"], "a": [0, 1, 2, 3, 4], "y": "Right: glucose, the site, a closed system, intake and output and vital signs all catch problems from the concentrated solution and the central line. Why not opening the hub without cleaning: that breaks the closed system and risks infection. Why not stopping labs: fluid and electrolytes keep changing and labs are ordered to track them.", "tp": null}, {"ty": "ngn", "d": 3, "scen": "A 7-year-old is receiving TPN through a central line. The nurse finds the dressing wet and loose and the child has a temperature and a fast pulse.", "parts": [{"ty": "sata", "d": 3, "q": "Which findings does the nurse report? Select all that apply.", "o": ["Temperature above baseline", "Fast pulse", "Wet and loose dressing at the insertion site", "Child asks for a drink of water", "Child is watching television"], "a": [0, 1, 2], "y": "Right: fever, a fast pulse and a compromised dressing can mean a line infection. Why not the drink or the television: they are normal behavior and say nothing about the line."}, {"ty": "mc", "d": 3, "q": "What should the nurse do first?", "o": ["Notify the provider and re-dress the site using aseptic technique", "Stop the TPN and flush the line with tap water to clear any blockage", "Cover the wet dressing with extra tape and recheck the child in four hours", "Take the pump off the line to see whether the child feels better"], "a": [0], "y": "Right: this may be an infection, so the nurse reports it and re-dresses the site aseptically per policy. Why not tap water: it is not sterile. Why not taping over it: that keeps a wet dressing on the site and delays care. Why not removing the pump: stopping TPN abruptly is not the nurse's decision and can drop blood glucose."}], "y": "", "tp": null}, {"ty": "sata", "d": 3, "q": "Which can cause a false pulse oximeter reading in a child? Select all that apply.", "o": ["Carbon monoxide poisoning", "Anemia", "Poor perfusion", "Ambient light interference", "A loose probe or nail polish", "A warm hand with good circulation", "A probe placed correctly on a still child"], "a": [0, 1, 2, 3, 4], "y": "Right: CO, anemia, poor perfusion, light and a poor connection all change what the probe senses. Why not a warm hand or a correct probe: those give the best reading.", "tp": null}, {"ty": "mc", "d": 3, "q": "A child with carbon monoxide poisoning has a pulse oximeter reading of 99% but is drowsy and has a headache. What does the nurse underst
