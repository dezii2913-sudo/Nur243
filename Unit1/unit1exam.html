and?", "o": ["The reading is falsely high because carbon monoxide sits on the hemoglobin", "The child is oxygenating well and the symptoms must have another cause", "The probe is reading falsely low and the true value is even higher", "The reading is accurate because the oximeter counts all gases in the blood"], "a": [0], "y": "Right: CO binds hemoglobin so the monitor reads high while tissues are starved of oxygen. Why not a good oxygen level: the symptoms and history point to hypoxia. Why not falsely low: poor perfusion and a poor connection cause low readings, not CO. Why not accurate: the oximeter cannot tell CO from oxygen.", "tp": null}, {"ty": "ord", "d": 3, "q": "Put the murmur grades in order from quietest to loudest, using the description for each.", "items": ["Barely audible, not heard every time", "Quiet and soft, heard every time", "Intermediate loudness", "Palpable thrill", "Heard with the edge of the stethoscope lifted", "Heard with the stethoscope near but not touching the chest"], "y": "Right: grade 1 to grade 6 rises from barely audible, through a palpable thrill at grade 4, to a murmur heard with the stethoscope off the chest at grade 6.", "tp": null}, {"ty": "mc", "d": 3, "q": "A nurse hears a murmur with the edge of the stethoscope lifted slightly off the chest. How is it graded?", "o": ["Grade 5", "Grade 4", "Grade 6", "Grade 3"], "a": [0], "y": "Right: grade 5 is heard with the edge of the stethoscope lifted off the chest. Why not grade 4: grade 4 has a palpable thrill. Why not grade 6: grade 6 is heard with the stethoscope near but not touching the chest. Why not grade 3: grade 3 is intermediate and needs no lifted scope.", "tp": null}, {"ty": "mat", "d": 2, "q": "Match each murmur grade to what you hear or feel.", "pairs": [["Grade 1", "Barely audible"], ["Grade 2", "Quiet, heard every time"], ["Grade 3", "Intermediate"], ["Grade 4", "Palpable thrill"], ["Grade 5", "Edge of scope lifted"], ["Grade 6", "Scope near the chest"]], "y": "Grades r function record(q,ok){const pid=q.pid||q.id;prog[pid]=ok;store.set('prog',prog);if(!ok){vault[pid]=1}else if(vault[pid]){delete vault[pid]}store.set('vault',vault)}
function mkq(q,cb,single){
 const w=document.createElement('div');w.className='q';
 const dtag=`<span class="tag ${q.d===3?'h':''}">${q.d===3?'hard':'core'}</span>`;
 const typ={mc:'Multiple choice',sata:'Select all that apply',ord:'Put in order',mat:'Matching',num:'Calculation',ngn:'Case study'}[q.ty];
 if(q.ty==='ngn'){
  w.innerHTML=`<div class="qt">Case study ${dtag}</div><div class="ex">${escn(q.scen)}</div><div class="parts"></div>`;
  const host=$('.parts',w);let right=0;
  q.parts.forEach((p,j)=>{const sub=mkq({...p,id:q.id+'.'+j,pid:q.id+'.'+j},()=>{if(cb)cb()});sub.style.marginLeft='0';host.appendChild(sub)});
  return w}
 w.innerHTML=`<div class="qt">${escn(q.q)} ${dtag}<span class="tag">${typ}</span></div><div class="body"></div><div class="row"><button class="pri chk">Check</button></div><div class="out"></div>`;
 const body=$('.body',w),out=$('.out',w),chk=$('.chk',w);let get,show;
 if(q.ty==='mc'||q.ty==='sata'){
  const idx=shuf(q.o.map((_,i)=>i)),multi=q.ty==='sata';
  body.innerHTML=idx.map(i=>`<label data-i="${i}"><input type="${multi?'checkbox':'radio'}" name="r${q.id}${Math.random()}" value="${i}"> ${escn(q.o[i])}</label>`).join('');
  get=()=>{const sel=$$('input:checked',body).map(x=>+x.value);const A=q.a;return {ok:sel.length===A.length&&A.every(a=>sel.includes(a)),sel}};
  show=r=>{$$('label',body).forEach(l=>{const i=+l.dataset.i,isA=q.a.includes(i),s=r.sel.includes(i);if(isA&&s)l.classList.add('ok');else if(s)l.classList.add('no');else if(isA)l.classList.add('miss')});$$('input',body).forEach(x=>x.disabled=true)}
 } else if(q.ty==='ord'){
  let pick=[];const it=shuf(q.items);
  const draw=()=>{body.innerHTML=`<div>${it.map((x,i)=>`<span class="chip ${pick.includes(i)?'done':''}" data-i="${i}">${esc(x)}</span>`).join('')}</div><div class="ex">Your order: ${pick.length?pick.map((i,n)=>`${n+1}. ${esc(it[i])}`).join(' &rarr; '):'tap items in order'} <button class="und">Undo</button></div>`;$$('.chip',body).forEach(c=>c.onclick=()=>{if(w.dataset.done)return;const i=+c.dataset.i;if(!pick.includes(i)){pick.push(i);draw()}});$('.und',body).onclick=()=>{if(!w.dataset.done){pick.pop();draw()}}};
  draw();
  get=()=>({ok:pick.length===it.length&&pick.every((p,n)=>it[p]===q.items[n]),sel:pick});
  show=r=>{body.innerHTML+=`<div class="ex">Correct order: ${q.items.map((x,n)=>`${n+1}. ${esc(x)}`).join(' &rarr; ')}</div>`}
 } else if(q.ty==='mat'){
  const rights=shuf(q.pairs.map(p=>p[1]));
  body.innerHTML=q.pairs.map((p,i)=>`<div class="row"><span style="flex:1 1 140px">${esc(p[0])}</span><select data-i="${i}"><option value="">Choose</option>${rights.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>`).join('');
  get=()=>{const s=$$('select',body);const res=s.map((x,i)=>x.value===q.pairs[i][1]);return {ok:res.every(Boolean),sel:res}};
  show=r=>{$$('select',body).forEach((x,i)=>{x.disabled=true;x.style.borderColor=r.sel[i]?'var(--ok)':'var(--bad)'});if(!r.ok)body.innerHTML+=`<div class="ex">${q.pairs.map(p=>esc(p[0])+' = '+esc(p[1])).join('<br>')}</div>`}
 } else if(q.ty==='num'){
  body.innerHTML=`<input class="num" type="text" inputmode="decimal" placeholder="Answer"> ${esc(q.unit||'')}`;
  get=()=>{const v=parseFloat($('input',body).value);return {ok:!isNaN(v)&&Math.abs(v-q.ans)<=(q.tol||0)+1e-9,sel:v}};
  show=r=>{$('input',body).disabled=true;body.innerHTML+=`<div class="ex">Answer: ${q.ans} ${esc(q.unit||'')}</div>`}
 }
 chk.onclick=()=>{if(w.dataset.done)return;const r=get();if(q.ty==='mc'&&!r.sel.length||q.ty==='num'&&isNaN(r.sel))return;w.dataset.done=1;chk.disabled=true;show(r);record(q,r.ok);out.innerHTML=`<div class="why"><b>${r.ok?'Correct.':'Not quite.'}</b> ${escn(q.y)}</div>`;if(cb)cb(r.ok)};
 return w}

 const cd=()=>{$('#cq').innerHTML='';const lv=$('#cl').value,P=lv==='hard'?D.cram.filter(q=>q.d===3):lv==='core'?D.cram.filter(q=>q.d!==3):D.cram;const by={};P.forEach(q=>(by[q.ty]=by[q.ty]||[]).push(q));let pick=shuf(P.filter(x=>x.tp==='dose')).slice(0,4);Object.values(by).forEach(a=>pick.push(shuf(a)[0]));['num','sata','ord','mat','ngn'].forEach(t=>{const a=shuf((by[t]||[]).filter(x=>!pick.includes(x)));if(a[0])pick.push(a[0])});if(lv==='mix')shuf(P.filter(x=>x.d===3&&!pick.includes(x))).slice(0,6).forEach(x=>pick.push(x));pick=[...new Set(pick)];shuf(P.filter(x=>!pick.includes(x))).slice(0,Math.max(0,22-pick.length)).forEach(x=>pick.push(x));shuf(pick).forEach(q=>$('#cq').appendChild(mkq({...q,id:'cram.'+D.cram.indexOf(q)})))};$('#cq').insertAdjacentHTML('beforebegin','<div class="row"><button class="pri" id="cn">New set</button><label>Level <select id="cl"><option value="mix">Mixed (hard first)</option><option value="hard">Hard only</option><option value="core">Core only</option></select></label></div>');$('#cn').onclick=cd;$('#cl').onchange=cd;cd()};

let rq=[],ri=-1;
