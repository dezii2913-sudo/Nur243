h statement best describes the main role of a child life specialist?", "o": ["Decreasing anxiety and fear during hospital care", "Prescribing pain medication before every painful procedure on the unit", "Interpreting for families who speak a language other than English", "Planning the child's tube feeding schedule with the dietitian"], "a": [0], "y": "Right: the speaker note names decreasing anxiety and fear during hospitalization and painful procedures as a big role of the child life specialist, using play and preparation. Why not prescribing pain medication: prescribing belongs to the provider. Why not interpreting: interpreters are a separate service with separate rules. Why not planning tube feedings: that is the dietitian and provider."}, {"ty": "ngn", "d": 3, "scen": "A 6-year-old is admitted with appendicitis and needs an IV and surgery. His mother is tearful and says she wants to stay but 'will only be in the way.'", "parts": [{"ty": "sata", "d": 3, "q": "Which interventions by the nurse apply atraumatic care principles? Select all that apply.", "o": ["Invite the mother to stay and help comfort him", "Explain the IV start in words a 6-year-old can understand", "Offer him a choice of which hand", "Refer him to the child life specialist", "Ask the mother to step out during the IV start", "Tell him the IV will not hurt"], "a": [0, 1, 2, 3], "y": "Right: inviting the mother, explaining at the child's level, offering a choice and using the child life specialist all address separation, fear and control. Why not asking the mother to step out: separation is a stressor. Why not telling him it will not hurt: an IV start does hurt, so the lie breaks trust."}, {"ty": "mc", "d": 3, "q": "The mother says, 'I feel useless. The nurses do everything.' Which response best supports family-centered care?", "o": ["Show her how to help with comfort care and explain her role", "Reassure her that the nurses will handle everything", "Suggest she go home and rest while he sleeps", "Tell her the surgeon will explain her role later"], "a": [0], "y": "Right: showing her how to help and explaining her role treats the parent as a partner and gives her a sense of value and control, which is what the slide rationale says. Why not reassuring that nurses handle everything: it leaves her feeling useless. Why not suggesting she go home: it increases separation. Why not saying the surgeon will explain her role: the nurse should teach and encourage her to perform as much of the care as is reasonable."}], "y": "Atraumatic care keeps parents involved and the child prepared."}, {"ty": "mc", "d": 3, "q": "A nurse reviews the atraumatic care principle 'promote a sense of control.' Which action by the nurse best demonstrates it for a 3-year-old who is refusing a dose of liquid medication?", "o": ["Offer a choice of two cups, then give it", "Tell the child he must take it right now because the nurse is busy", "Give the dose while the child cries so that it is over faster", "Hide the medication in his favorite juice so he does not notice"], "a": [0], "y": "Right: a limited choice (which cup) keeps the child in control while the medicine is still taken, which is the point of promoting a sense of control. Why not insisting he take it right now: it removes control and invites a power struggle. Why not giving it while he cries: it adds fear and raises the risk of aspiration. Why not hiding it in his juice: deceiving the child breaks trust, and the bitter taste may make him refuse the juice later."}, {"ty": "mc", "d": 2, "q": "The nurse wants to use distraction during a venipuncture on a 6-year-old. Which instruction is appropriate?", "o": ["Ask the child to blow bubbles and count aloud", "Ask the child to watch the needle go in", "Tell the child to hold very still and not look away", "Ask the child to describe how much it hurts"], "a": [0], "y": "Right: blowing bubbles and counting aloud are on the distraction list and give the child something else to focus on. Why not watching the needle: that focuses on the fear and the pain. Why not holding still and not looking away: it is a demand, not a distraction, and it removes control. Why not describing how much it hurts: it turns attention to the pain instead of away from it."}, {"ty": "mc", "d": 3, "q": "A child with a new diagnosis starts sucking his thumb again and clinging to his mother after a painful procedure. How does the nurse interpret this?", "o": ["Regression, an expected coping response not to be punished", "A sign of a developmental delay that needs a specialist referral", "Manipulative behavior meant to avoid the treatments he dislikes", "A sign of poor parental discipline that needs parent teaching"], "a": [0], "y": "Right: regression is a normal coping response in a hospitalized child, so it is accepted and not punished, and the child is supported until he recovers. Why not developmental delay: the behavior appeared after the stress and is temporary, while delay would be present before. Why not manipulation: young children use old comfort habits because they are scared, not to trick anyone. Why not poor discipline: it is not caused by parenting, and teaching the parent about discipline would add guilt."}, {"ty": "ord", "d": 3, "q": "Place the steps of preparing a child for an IV start using atraumatic care in the best order.", "items": ["Gather equipment before approaching the child", "Apply topical anesthetic and let it take effect", "Explain the procedure at the child's level with the parent present", "Use distraction and therapeutic hugging during the stick"], "y": "Gather first so you are not leaving the room, numb ahead of time so the stick does not hurt, then explain with the parent present, then distract and hold during the procedure."}, {"ty": "mc", "d": 3, "q": "A nurse says to a colleague, 'Atraumatic care is mostly about giving pain medication to hospitalized children.' Which response is most accurate?", "o": ["It also protects against emotional stress and separation", "That is correct, because pain control is the only goal of the approach", "It applies only to children having surgery in the operating room", "It is mainly for young children who cannot yet talk to the nurse"], "a": [0], "y": "Right: atraumatic care also prevents emotional stress and parent-child separation and promotes family-centered care, so pain relief is only one part. Why not 'pain control is the only goal': the four principles include separation, family and control. Why not only surgical patients: it applies to all children and families. Why not mainly nonverbal children: every age benefits, and explanations are matched to development."}, {"ty": "mc", "d": 2, "q": "The slide question reads: 'The focus of atraumatic care for a child in surgery is solely on meeting the physical needs of the child.' What is the answer and why?", "o": ["False, because it includes family roles and support", "True, because surgery is a physical event that mostly affects the body", "True, because parents are not considered a part of the health care team", "False, because only the emotional needs of the child are addressed"], "a": [0], "y": "Right: the slide rationale says atraumatic care uses a family-centered approach that promotes family roles, family support and information, so it is not only physical. Why not 'true because surgery is physical': the care addresses emotional needs and family as well. Why not 'true because parents are not part of the team': parents are partners. Why not 'false because only emotional needs': that overcorrects, since physical needs such as pain are still part of it."}, {"ty": "mc", "d": 3, "q": "A mother of a hospitalized 8-month-old asks, 'Can I still feed and bathe her, or should I let you do it?' Which reply best reflects the slide's guidance?", "o": ["Yes, do as much of her care as is reasonable", "It is best if the nurses do all of the care while she is in the hospital", "Only the bath is allowed, since feeding is a task reserved for nurses", "Please wait until the physician approves each task before you begin"], "a": [0], "y": "Right: the slide says to treat parents as equal partners and let them do as much of the child's care as is reasonable, which gives them a sense of value and control. Why not nurses do all care: it makes the parent feel useless. Why not allowing only the bath: feeding is a normal parent task. Why not waiting for physician approval of each task: routine care does not need a provider order."}, {"ty": "mc", "d": 3, "q": "A school-age child is angry about hospital rules. Which action best builds his sense of control?", "o": ["Let him pick the order of his morning care tasks", "Set a firm schedule that he is told not to question", "Make all the decisions for him to lower his stress", "Share plans only just before each procedure begins"], "a": [0], "y": "Right: a real choice in the order of tasks gives a school-age child a sense of control without changing the care. Why not a rigid schedule he cannot question: it removes control and adds anger. Why not deciding everything for him: it makes him powerless. Why not sharing plans only just before: school-age children need advance explanation to prepare."}, {"ty": "mc", "d": 3, "q": "Which nursing action best prevents separation distress in a hospitalized toddler?", "o": ["Encourage a parent to room in with open visiting", "Limit visits to two hours so routines stay steady", "Ask parents to wait in the lounge during procedures", "Send parents home at night so the child adapts"], "a": [0], "y": "Right: rooming in prevents or minimizes parent-child separation, a main atraumatic principle, and toddlers are most distressed by separation. Why not limiting visits to two hours: it lengthens separation. Why not waiting in the lounge during procedures: it removes the parent when the child needs her most. Why not sending parents home at night: toddlers protest and then withdraw, which looks like adjusting but is not."}, {"ty": "ord", "d": 3, "q": "Place the nursing process steps in order for a 6-year-old who is anxious about a blood draw.", "items": ["Assess the child's fear level and coping", "Identify anxiety related to the procedure", "Plan choices, distraction and parent presence", "Carry out the plan during the draw", "Evaluate how the child coped"], "y": "ADPIE runs assess, diagnose, plan, implement, evaluate."}], "fam": [{"ty": "mc", "d": 2, "q": "A Spanish-speaking mother needs discharge teaching. Which action by the nurse is correct?", "o": ["Face the mother while the interpreter translates", "Ask her 10-year-old to translate so teaching is faster", "Talk to the interpreter and let him relay it later", "Give written English instructions and ask her to read them at home"], "a": [0], "y": "Right: facing the mother and talking directly to her keeps her at the center of the teaching, and the interpreter is only the communication bridge. Why not asking her 10-year-old: the slide says do not use children as interpreters. Why not talking to the interpreter and letting him relay later: speak directly to the family and pause for translation. Why not written English instructions: she cannot read them, and an interpreter should help confirm she understands translated material."}, {"ty": "mc", "d": 3, "q": "A deaf father uses sign language and no certified signer is available for his son's teaching. What is the best action?", "o": ["Allow a family member who signs to interpret", "Delay teaching until a certified interpreter can come", "Use his young daughter as the interpreter", "Give him printed handouts only"], "a": [0], "y": "Right: the slide gives sign language as the unique exception where a family member may be used, so a family member who signs can interpret. Why not delaying teaching: it denies him needed instruction when an exception exists. Why not the young daughter: the rule against using children still stands, even though sign language is the exception for a family member. Why not printed handouts only: he communicates through sign, so reading alone may not confirm understanding."}, {"ty": "sata", "d": 3, "q": "Which actions show correct use of an interpreter? Select all that apply.", "o": ["Pause every few sentences", "Ask the family to repeat back their understanding", "Avoid jargon and speak slowly", "Prepare the interpreter ahead of time", "Hold side conversations with the interpreter during the session", "Assume anyone who speaks the language will interpret well"], "a": [0, 1, 2, 3], "y": "Right: pausing, using teach-back, avoiding jargon and preparing the interpreter ahead of time are all on the slide. Why not side conversations with the interpreter: the slide says to avoid them because the family is left out. Why not assuming anyone who speaks the language will interpret well: the slide says speaking another language does not make someone a good interpreter."}, {"ty": "mc", "d": 2, "q": "Which statement best describes the cone of learning?", "o": ["Retention is about 90% for what people say and do", "Retention is about 50% for what people read on their own", "Retention is about 70% for what people hear in a lecture", "Retention is about 10% for what people say and do together"], "a": [0], "y": "Right: in the cone of learning, people retain about 90% of what they say and do, because active practice builds memory. Why not 50% for reading: reading is only about 10%. Why not 70% for hearing: hearing is about 20%. Why not 10% for saying and doing: that figure belongs to reading, so the percentages here are swapped. The slide percentages are 10, 20, 30, 50, 70, 90."}, {"ty": "mc", "d": 3, "q": "A nurse is teaching a mother how to give her child's insulin. Which evaluation shows learning best?", "o": ["The mother draws up and injects a practice dose", "The mother says she understands everything that was taught to her", "The mother signs the education record after the teaching is finished", "The mother nods and watches closely during the nurse's demonstration"], "a": [0], "y": "Right: drawing up and injecting a practice dose is a return demonstration, the highest level of evaluating learning because the mother does the skill. Why not saying she understands: a statement does not show she can do it. Why not signing the education record: paperwork shows teaching was done, not learned. Why not nodding during the demonstration: watching is passive and shows nothing about skill."}, {"ty": "mc", "d": 2, "q": "A nurse uses 'chunking' while teaching a father about his daughter's new medications. What does this mean?", "o": ["Small bites of information, repeated", "Teaching everything in one long session so the family hears it all once", "Teaching only the child, since he is the one who will use the skill", "Giving the information in a written handout and nothing else"], "a": [0], "y": "Right: chunking breaks teaching into small pieces and repeats them, so the parent does not get overwhelmed. Why not one long session: too much information at once is forgotten. Why not teaching only the child: the parent is the caregiver at home and must be included. Why not writing only: it ignores the parent's learning style and cannot be checked with teach-back."}, {"ty": "mc", "d": 3, "q": "A parent frequently misses appointments, cannot complete forms and says, 'I'll read this when I get home.' What does the nurse suspect and how should teaching change?", "o": ["Poor health literacy, so use visuals and teach-back", "Noncompliance by choice, so document that the parent refuses care", "A language barrier, so call an interpreter before every appointment", "A learning disability in the child, so refer the child for testing"], "a": [0], "y": "Right: missed appointments, trouble with forms and 'I'll read this at home' are red flags for poor health literacy, so teaching should use visuals and teach-back instead of reading. Why not noncompliance by choice: the pattern fits difficulty reading, not refusal. Why not a language barrier: she is speaking and no interpreter need is mentioned. Why not a learning disability in the child: the findings describe the parent."}, {"ty": "mc", "d": 3, "q": "A 14-year-old with a new diagnosis refuses to talk while his mother is in the room. Which approach best fits the learning principles?", "o": ["Offer him private time to ask questions", "Direct all of the teaching to his mother, who will manage his care", "Tell him that he must participate since the diagnosis is his own", "Wait until he turns 18 and then begin the teaching with him"], "a": [0], "y": "Right: adolescents are sensitive about body image, control and autonomy, so private time to ask questions and keep some control keeps him engaged. Why not teaching only his mother: it excludes the patient and fuels his refusal. Why not telling him he must participate: it threatens his autonomy and adolescents resist demands. Why not waiting until he is 18: delaying leaves him unprepared for self-care."}, {"ty": "sata", "d": 3, "q": "Which findings are red flags for poor health literacy? Select all that apply.", "o": ["History of medication errors", "Frequently missed appointments", "Avoids questions for fear of looking stupid", "Difficulty filling out forms", "Asks detailed questions about the plan of care", "Brings a written medication list to each visit"], "a": [0, 1, 2, 3], "y": "Right: medication errors, missed appointments, hiding questions and trouble with forms are the red flags of poor literacy. Why not asking detailed questions about the plan: it shows engagement. Why not bringing a written medication list: it shows organization and understanding."}, {"ty": "mc", "d": 2, "q": "Which question belongs in the nurse's learning needs assessment?", "o": ["Who is the person caring for the child at home?", "How many hospital rooms are open on the pediatric unit this week?", "What is the child's insurance deductible for the current year?", "Which unit will the child be transferred to after discharge?"], "a": [0], "y": "Right: knowing who is caring for the child at home is a component of the learning needs assessment because that person needs the teaching. Why not the number of open hospital rooms: it is an administrative detail unrelated to what the family needs to learn. Why not the insurance deductible: finances matter for resources but are not part of the learning needs assessment on the slide. Why not which unit the child transfers to: that is a bed management question."}, {"ty": "ngn", "d": 3, "scen": "A nurse is teaching a 9-year-old with type 1 diabetes and his father. The father works two jobs and says he 'doesn't have time to read all that.' The boy likes video games.", "parts": [{"ty": "mc", "d": 3, "q": "Which teaching technique is best?", "o": ["Small bites of information with visuals and hands-on practice", "One long session that is supported by printed handouts to take home", "Teaching the father alone while the boy is away in school", "A detailed lecture on the pathophysiology of the disease"], "a": [0], "y": "Right: small amounts of information with visuals and hands-on practice fit how children and parents learn and sit high on the cone of learning. Why not one long session with handouts: too much at once and passive. Why not teaching the father only: the 10-year-old with diabetes must take part. Why not a lecture on pathophysiology: it does not teach the skills needed at home."}, {"ty": "mc", "d": 3, "q": "Which finding shows the teaching worked?", "o": ["The boy teaches back the steps in his own words", "The father says that he understands everything that was shown", "The boy reads through the handout from the first page to the last", "The father signs the care plan form at the end of the visit"], "a": [0], "y": "Right: when the boy teaches the steps back in his own words, teach-back proves understanding. Why not the father saying he understands: a statement is not a demonstration. Why not the boy finishing the handout: reading does not show he can do it. Why not the father signing the care plan: a signature records teaching, not learning."}], "y": "Teaching must fit age, literacy and time, and be checked with teach-back."}, {"ty": "mc", "d": 3, "q": "Which statement about adult learning (Knowles) should guide a nurse teaching parents of a newly diagnosed child?", "o": ["Adults want an immediate need met and value experience", "Adults need to be taught in the same way that children are taught", "Adults learn best by passively listening to an expert lecture", "Adults are mostly motivated by outcomes far in the distant future"], "a": [0], "y": "Right: Knowles says adults want an immediate need met and value past experience, so teaching starts with what the parent needs now. Why not teaching them as children: adults are self-directed and problem focused. Why not passive lecture: adults learn by applying information. Why not long-term outcomes: adults are motivated by present need."}, {"ty": "mc", "d": 2, "q": "Which action best shows culturally competent family-centered care?", "o": ["Ask which traditional health practices the family uses", "Tell the family to stop using traditional practices during hospitalization", "Assume that all families from one culture share the same beliefs", "Limit the visiting family to the parents only for the whole stay"], "a": [0], "y": "Right: asking about traditional practices respects the family and lets the nurse include safe practices in the plan, which is culturally competent care. Why not telling them to stop: it dismisses their beliefs and damages trust. Why not assuming every family from a culture believes the same: it is a stereotype, and families differ. Why not limiting visitors to parents: the slide says the family may extend beyond parents and siblings."}, {"ty": "mc", "d": 3, "q": "A nurse calls the provider about a child with rising respiratory distress. Which statement is the Recommendation in SBAR?", "o": ["I recommend you evaluate him now and consider a chest x-ray", "He has had a cough for two days and now has retractions", "His respiratory rate is 46 and his oxygen saturation is 91%", "I am calling about the 4-year-old in room 12 who looks worse"], "a": [0], "y": "Right: in SBAR the R is the Recommendation, what you want the provider to do. Why not the cough and retractions: that is the Background. Why not the rate and saturation: they are the Assessment, what the nurse found. Why not the child in room 12 who looks worse: that is the Situation, who and what the problem is."}, {"ty": "mc", "d": 3, "q": "A child in severe pain refuses to learn the inhaler technique. According to Maslow, what comes first?", "o": ["Relieve the pain, a physiological need", "Teach the technique so he feels safe and secure", "Praise him to meet his need for self-esteem", "Teach while the pain continues so time is not lost"], "a": [0], "y": "Right: Maslow puts physiological needs, including pain relief, before safety and learning, so the pain is treated first and teaching waits. Why not teaching for safety first: the child cannot take in teaching while in severe pain. Why not praise for esteem: esteem is higher on the hierarchy. Why not teaching through pain: nothing will be retained."}, {"ty": "sata", "d": 3, "q": "Which statements describe family-centered care? Select all that apply.", "o": ["The family is the constant in the child's life", "Care is planned in collaboration with the family", "Cultural diversity is respected", "Emotional support is given to the family", "The care team makes the decisions for the family", "Information is limited to protect the parents"], "a": [0, 1, 2, 3], "y": "Right: family-centered care sees the family as the constant, plans care in partnership, respects culture and supports emotions. Why not the team deciding for the family: it removes collaboration. Why not limiting information: the slide says families need honest, unbiased information."}], "ass1": [{"ty": "mc", "d": 2, "q": "A nurse is examining a 2-year-old who clings to his mother. Which approach is best?", "o": ["Examine him on his mother's lap, ears and throat last", "Place him alone on the exam table and begin with the ear exam", "Separate him from his mother so that he will cooperate more easily", "Hide the stethoscope from him until his parent leaves the room"], "a": [0], "y": "Right: a clinging toddler fears strangers, so examining on the mother's lap and leaving the invasive ear and throat checks for last keeps him calm and cooperative. Why not alone on the table: separation raises fear and he will resist everything. Why not separating him from his mother: the parent is the safest place for him and the slide says to keep the child comfortable. Why not hiding the stethoscope until the parent leaves: removing the parent is the problem, and the slide says to keep equipment out of sight only until it is needed."}, {"ty": "sata", "d": 3, "q": "A nurse is obtaining a functional history for a 12-year-old. Which topics belong to functional history? Select all that apply.", "o": ["Car seat or seat belt use", "Sleep routine", "Screen time and gaming", "Elimination patterns", "Birth weight", "Immunization status", "Past hospitalizations"], "a": [0, 1, 2, 3], "y": "Right: car seats and safety, sleep, screen time and elimination are on the functional history slide. Why not birth weight: it is prenatal and perinatal past health history. Why not immunizations: past health history. Why not past hospitalizations: also past health history, along with surgeries and illnesses."}, {"ty": "mc", "d": 3, "q": "A mother says her son has a cough for 3 days, and the nurse asks, 'Has anyone else at home been sick?' Which part of the history is this?", "o": ["Chief complaint, exposure to infectious agents", "Functional history, which covers sleep and daily routines", "Family health history, which covers the illnesses of relatives", "Developmental history, which covers the child's milestones"], "a": [0], "y": "Right: exposure to infectious or toxic agents is listed under the chief complaint, and asking who else is sick tests that. Why not functional history: that covers safety, sleep, nutrition and activity. Why not family health history: that is about relatives' conditions, not a current exposure. Why not developmental history: that is milestones."}, {"ty": "mc", "d": 2, "q": "Which question is open-ended?", "o": ["What does your daughter eat in a typical day?", "Does your daughter eat breakfast before she leaves for school?", "Is she a picky eater when new foods are put on her plate?", "Does she drink milk with her meals at every sitting?"], "a": [0], "y": "Right: 'What does your daughter eat in a typical day?' needs a description, so it opens the conversation and gives more information. Why not asking whether she eats breakfast: it can be answered yes or no. Why not asking whether she is picky: also yes or no. Why not asking whether she drinks milk: another yes or no, and it limits the answer."}, {"ty": "mc", "d": 3, "q": "A nurse is preparing to examine a 4-year-old who is afraid of the stethoscope. Which action is most developmentally appropriate?", "o": ["Let the child hold and listen to it first", "Explain in detail how the stethoscope amplifies the sound of heart sounds", "Place it on the chest quickly while a parent distracts the child", "Tell the child that it is only a toy so he will not worry"], "a": [0], "y": "Right: letting a preschooler hold and listen gives control and removes the mystery of the tool, which fits the developmental stage. Why not a detailed explanation of amplification: preschoolers do not follow technical language. Why not rushing it onto the chest: a surprise makes the fear worse. Why not calling it a toy: it is a false statement and the child may stop trusting the nurse."}, {"ty": "mc", "d": 3, "q": "A 15-year-old comes with his father. Which approach is best for the sexual history?", "o": ["Ask the father to step out so the teen can talk", "Ask all of the questions in front of the father to save time", "Skip the sexual history unless the teen volunteers it on his own", "Ask the father to answer the questions on behalf of his son"], "a": [0], "y": "Right: adolescents need privacy and confidentiality to be honest about sexual history, so the father steps out for that part. Why not asking in front of the father: the teen will not answer honestly. Why not skipping unless he volunteers: it is part of the complete history and teens rarely volunteer. Why not letting the father answer: it excludes the patient, and the information has to come from the teen."}, {"ty": "ngn", "d": 3, "scen": "A nurse is interviewing the mother of a 7-month-old with 3 days of vomiting. The mother says she has been giving the baby only water since yesterday and the baby is 'sleepier than usual.' She asks, 'Should I be worried?'", "parts": [{"ty": "sata", "d": 3, "q": "Which questions are most important for the nurse to ask about the chief complaint? Select all that apply.", "o": ["When did it start and how often is it happening?", "What makes it better or worse?", "Has anyone else at home been sick?", "How many wet diapers has the baby had?", "What is the baby's favorite toy?", "Who watches the baby during the day?"], "a": [0, 1, 2, 3], "y": "Right: onset and frequency, what makes it better or worse, others at home who are sick, and output such as wet diapers are chief complaint questions. Why not the baby's favorite toy: it is not relevant to the complaint. Why not who watches the baby: that is a family composition question, not a chief complaint question."}, {"ty": "mc", "d": 3, "q": "Which finding on exam would suggest dehydration and need to be reported?", "o": ["Sunken anterior fontanel", "Brief bulging of the fontanel while crying", "Acrocyanosis of the hands", "Strabismus that comes and goes"], "a": [0], "y": "Right: a sunken anterior fontanel suggests dehydration. Why not brief bulging while crying: the slide lists that as normal. Why not acrocyanosis: normal in a newborn. Why not intermittent strabismus: normal up to 6 months."}], "y": "Use the chief complaint outline and then link findings to the problem."}, {"ty": "mc", "d": 2, "q": "Which action should the nurse take when setting up the exam room for a toddler?", "o": ["Keep equipment out of sight until it is needed", "Display all of the equipment so that the child can pick what to use", "Dim the lights in the room so that the child stays relaxed and calm", "Keep the room cool so the child stays awake during the whole exam"], "a": [0], "y": "Right: the slide says to keep medical equipment out of sight so the child is not frightened before the exam. Why not displaying all the equipment: it increases fear. Why not dimming the lights: the slide says the room should be warm and well lit. Why not keeping the room cool: the room should be warm, and a cool room makes an undressed child uncomfortable."}, {"ty": "mc", "d": 3, "q": "The nurse is performing a review of systems on a 10-year-old. The mother reports increased thirst, frequent urination and constant hunger. Which system do these questions screen?", "o": ["Endocrine", "Genitourinary only", "Hematologic", "Musculoskeletal"], "a": [0], "y": "Right: increased thirst, urination and hunger are screened under the endocrine system, as in diabetes. Why not genitourinary only: urination belongs to it, but thirst and hunger point beyond the urinary tract. Why not hematologic: it covers blood, bruising and anemia. Why not musculoskeletal: it covers joints, muscles and gait."}, {"ty": "mc", "d": 2, "q": "Which component is unique to the pediatric review of systems?", "o": ["Growth and development", "Cardiovascular system", "Skin", "Respiratory system"], "a": [0], "y": "Right: growth and development is added to the body systems for children and does not appear on the adult list. Why not the cardiovascular system: it is on the adult list. Why not skin: it is on the adult list. Why not the respiratory system: it is on the adult list."}, {"ty": "mc", "d": 3, "q": "A child's mother is nervous and asks many questions during the visit. How should the nurse respond to support the role of the nurse in assessment?", "o": ["Listen actively, show empathy, then answer her", "Ask her to hold all of her questions until the end of the exam", "Tell her the physician will be the one to answer every question", "Tell her to relax so that the child does not pick up on her fear"], "a": [0], "y": "Right: active listening and empathy reduce her anxiety and the nurse's role includes teaching and supporting the family, so she is answered. Why not asking her to hold questions: it ignores her need and she may not remember them later. Why not sending every question to the physician: the nurse is expected to answer within the nursing role. Why not telling her to relax: it dismisses her feelings and will not stop the worry."}, {"ty": "mc", "d": 3, "q": "Which sequence best shows the nurse validating and interpreting data accurately in pediatric assessment?", "o": ["Compare with age norms and growth charts, then document", "Document the findings first and compare them with norms at a later time", "Use adult norms for all of the findings since they are well established", "Use the parent's report alone without measuring the child directly"], "a": [0], "y": "Right: comparing findings with age norms and growth charts is how the nurse tells normal from abnormal in a child, and documentation follows. Why not documenting first and comparing later: abnormal findings may be missed or not reported in time. Why not using adult norms: children's norms differ by age, as in the heart rate and respiratory tables. Why not relying on the parent's report alone: the nurse must measure and observe."}, {"ty": "mc", "d": 2, "q": "The nurse asks about prenatal and perinatal history. Which category does this belong to?", "o": ["Past health history", "Functional history", "Review of systems", "Family composition"], "a": [0], "y": "Right: prenatal and perinatal history is part of the past health history. Why not functional history: that is daily routines. Why not review of systems: that is a body-system screen. Why not family composition: that is who lives in the home."}, {"ty": "ord", "d": 3, "q": "Place the parts of a pediatric health history in the usual order they are gathered.", "items": ["Chief complaint", "History of present illness", "Past health history", "Review of systems"], "y": "Start with why the child came, then the story of the illness, then past history, then the body-system review."}, {"ty": "mc", "d": 3, "q": "A 16-year-old tells the nurse she is sexually active and asks that her mother not be told. Which response is best?", "o": ["I will keep this private unless your safety is at risk", "I have to tell your mother right away about this", "That is not something we talk about in this clinic", "I will write it in your mother's folder for her"], "a": [0], "y": "Right: adolescents need confidentiality to be honest, with an exception when their safety is at risk. Why not telling the mother right away: it breaks trust and the teen may stop sharing. Why not refusing to discuss it: it shuts down honesty and leaves her without guidance. Why not writing it in the mother's folder: it exposes the information to the mother indirectly."}, {"ty": "sata", "d": 3, "q": "Which are good practices when interviewing a school-age child? Select all that apply.", "o": ["Address the child directly", "Use words suited to the child's age", "Let the child ask questions", "Explain what will be done before doing it", "Rely only on the parent's answers", "Use medical terms the child may not know"], "a": [0, 1, 2, 3], "y": "Right: school-age children can describe their own symptoms, so the nurse speaks to the child, uses age-appropriate words, welcomes questions and explains steps. Why not relying on the parent only: the child's own report is lost. Why not medical terms: they confuse the child and increase fear."}], "ass2": [{"ty": "mc", "d": 3, "q": "A nurse enters a room where a 6-month-old is sleeping and plans the physical assessment. Which order is correct?", "o": ["Count rates and auscultate heart, lungs and abdomen first", "Undress the baby and then examine his throat while he is still quiet", "Wake the baby gently and begin the exam with the ear and throat checks", "Palpate the abdomen first and then listen to the heart and lungs"], "a": [0], "y": "Right: a sleeping infant is quiet, so counting heart and respiratory rates and auscultating the heart, lungs and abdomen first gives accurate findings before touch or crying changes them, which is on the slide. Why not undressing first: rates should be counted before undressing, and undressing wakes him. Why not waking him and starting with the ears: invasive steps come last. Why not palpating the abdomen first: auscultate the abdomen before palpating because touch can change bowel sounds."}, {"ty": "mc", "d": 3, "q": "A nurse auscultates a 3-year-old's abdomen after palpating it and finds no bowel sounds. Which is the best interpretation?", "o": ["Palpation was done first and can alter bowel sounds", "The child has an ileus that is causing the bowel sounds to be absent", "Absent bowel sounds are an expected finding in toddlers of this age", "The stethoscope was too cold, so the child tensed the abdomen"], "a": [0], "y": "Right: palpating first can change bowel sounds, so the finding is unreliable and the abdomen should be auscultated before palpation. Why not an ileus: you cannot decide that from sounds taken after touching the abdomen. Why not expected in toddlers: bowel sounds are normal in toddlers. Why not a cold stethoscope: the temperature does not cause absent sounds."}, {"ty": "sata", "d": 3, "q": "A nurse is preparing to take vital signs on a 9-month-old. Which actions are appropriate? Select all that apply.", "o": ["Auscultate the apical pulse for a full minute", "Count respirations for a full minute", "Select a cuff proportionate to the infant's extremity", "Count the rates before undressing the infant", "Palpate the radial pulse for 15 seconds", "Use the adult cuff on the thigh"], "a": [0, 1, 2, 3], "y": "Right: the slides say to use the apical pulse in children under 10 for a full minute, count respirations for a full minute, use a proportionate cuff, and count rates before undressing. Why not palpating the radial pulse for 15 seconds: the radial pulse is hard to feel under 2 years, and a short count misses irregularity. Why not an adult cuff on the thigh: the cuff must be proportionate to the extremity and a large cuff reads falsely low."}, {"ty": "mc", "d": 3, "q": "A 4-year-old's blood pressure is taken with a cuff that is too narrow. What is the effect and why?", "o": ["Falsely high, since more pressure is needed to compress the artery", "Falsely low, since the cuff covers too much of the child's upper arm", "Accurate, since the size of the artery is not changed by the cuff", "Falsely low, since the child's pulse is faster than that of an adult"], "a": [0], "y": "Right: a cuff that is too narrow needs more pressure to compress the artery, so the reading is falsely high. Why not falsely low because it covers too much arm: a too-wide cuff does that, not a narrow one. Why not accurate: the slide says cuff size must be proportionate to the extremity. Why not falsely low because the pulse is faster: pulse rate does not change the cuff effect."}, {"ty": "mc", "d": 2, "q": "The nurse takes a tympanic temperature on a 2-year-old. Which technique is correct?", "o": ["Pull the pinna back and down, aim at the eardrum", "Pull the pinna up and back and aim the sensor at the canal wall", "Pull the pinna downward only and aim the sensor straight ahead", "Insert the probe as far as it will comfortably go into the canal"], "a": [0], "y": "Right: for children younger than 3 the slide says to pull the earlobe back and down, and the infrared sensor is aimed at the center of the tympanic membrane. Why not pulling up and back: that applies after age 3, and it aims at the canal wall. Why not pulling down only: back and down is needed to straighten the canal. Why not pushing the probe as far as it goes: the slide says to insert it gently and aim at the center of the membrane."}, {"ty": "mc", "d": 3, "q": "A 5-month-old is crying and the anterior fontanel is bulging. Five minutes after he is calmed, it is still bulging. What does the nurse do?", "o": ["Report it, since a bulge that persists suggests raised ICP", "Document it as normal since the baby has been crying for several minutes", "Offer fluids since a bulging fontanel is a sign of dehydration", "Recheck it at the next well visit since it will most likely resolve"], "a": [0], "y": "Right: crying causes a brief bulge, but a bulge that persists when the baby is calm suggests increased intracranial pressure and should be reported. Why not documenting as normal: it did not go away after crying stopped. Why not offering fluids: dehydration makes the fontanel sunken, not bulging. Why not rechecking at the next visit: raised ICP needs prompt attention."}, {"ty": "mc", "d": 3, "q": "A 20-month-old's mother says the soft spot on top of his head 'still has not closed.' What is the nurse's best response?", "o": ["Closure is due by 18 months, so refer", "This is normal, since it may stay open until the child is 3 years old", "This is normal, since it closes at about 2 months after birth", "Ask her to massage it gently so that it closes more quickly"], "a": [0], "y": "Right: the anterior fontanel closes between 9 and 18 months, so an open one at 20 months needs referral. Why not open until 3: that is too late. Why not closes at 2 months: that is the posterior fontanel, which closes from birth to 2 months. Why not massage: pressing on the area is not a treatment."}, {"ty": "mc", "d": 2, "q": "Which finding is expected in an 8-week-old?", "o": ["Intermittent crossing of the eyes", "Strabismus that is present all the time while the eyes are open", "A sunken anterior fontanel noted while the baby is lying flat", "Central cyanosis of the lips and tongue during feeding"], "a": [0], "y": "Right: strabismus is intermittent up to 6 months, so an 8-week-old crossing the eyes now and then is expected. Why not constant strabismus: it needs evaluation. Why not a sunken fontanel: it signals dehydration. Why not central cyanosis: a sign of hypoxia that needs immediate action."}, {"ty": "mc", "d": 3, "q": "A newborn has blue hands and feet and pink lips and tongue. Which statement by the nurse is accurate?", "o": ["Acrocyanosis, normal from immature circulation", "Central cyanosis, which needs oxygen and a call to the provider", "Carbon monoxide poisoning that has turned the extremities blue", "Jaundice, which turns the hands and feet yellow and not blue"], "a": [0], "y": "Right: blueness of the hands and feet with pink lips and tongue is acrocyanosis, normal for several days in a newborn from the immature circulation completing the switch from fetal life. Why not central cyanosis: it shows in the lips, tongue and trunk. Why not carbon monoxide poisoning: it would not be limited to the extremities. Why not jaundice: jaundice is yellow, not blue."}, {"ty": "sata", "d": 3, "q": "A child looks pale, lethargic and breathes fast, but the pulse oximeter reads 98%. Which factors are listed on the slide as sources of false readings? Select all that apply.", "o": ["Carbon monoxide poisoning", "Anemia", "Abnormal hemoglobin values", "Poor perfusion", "Ambient light interference", "A normal hemoglobin level", "A correctly placed probe on a still child"], "a": [0, 1, 2, 3, 4], "y": "Right: the slide lists abnormal hemoglobin values, poor perfusion and ambient light, and names anemia and carbon monoxide poisoning as conditions that cause false readings. Why not a normal hemoglobin level: it makes the reading trustworthy. Why not a correctly placed probe on a still child: that gives a reliable reading. Trust the child's color and effort and assess further."}, {"ty": "mc", "d": 3, "q": "A nurse is assessing a 3-month-old and notes the chest wall moves little while the belly rises and falls with each breath. What does the nurse do?", "o": ["Document it as normal diaphragmatic breathing", "Report it as retractions since the chest wall is moving very little", "Notify the provider of paradoxical breathing in the infant", "Reposition the infant and recheck the breathing in four hours"], "a": [0], "y": "Right: infants breathe with the diaphragm, so the belly moves more than the chest and thoracic movement appears after 1 year. Why not retractions: retractions are inward pulling between the ribs or under the sternum. Why not paradoxical breathing: this is the normal infant pattern. Why not rechecking in four hours: nothing is wrong."}, {"ty": "mc", "d": 3, "q": "A 3-year-old with a barking cough and noisy breathing has suprasternal and substernal retractions. Which finding does the nurse report first?", "o": ["Retractions with stridor", "Barking cough that is described as sounding like a seal", "Respiratory rate of 28 breaths per minute at rest", "Dry cough that is worse at night and when lying flat"], "a": [0], "y": "Right: retractions and stridor show labored breathing and airway narrowing, so they need immediate report. Why not the barking cough: it describes croup but retractions show the child is working to breathe. Why not 28 breaths per minute: a preschooler's range is 20 to 25, so it is only slightly high. Why not a dry cough at night: it is less urgent than airway signs."}, {"ty": "mc", "d": 2, "q": "A murmur is heard best at the upper left sternal border and can be felt as a vibration under the nurse's hand. What grade is it?", "o": ["Grade 4", "Grade 2", "Grade 3", "Grade 6"], "a": [0], "y": "Right: grade 4 is audible with a palpable thrill, felt as a vibration under the hand. Why not grade 2: it is quiet and soft. Why not grade 3: audible without a thrill. Why not grade 6: it is very loud and heard with the stethoscope lifted off the chest."}, {"ty": "mat", "d": 3, "q": "Match each murmur grade to its description.", "pairs": [["Grade 1", "Barely audible, sometimes heard and sometimes not"], ["Grade 2", "Quiet and soft, heard each time"], ["Grade 3", "Audible, intermediate intensity"], ["Grade 4", "Audible with a palpable thrill"], ["Grade 5", "Loud, heard with the edge of the stethoscope lifted"], ["Grade 6", "Heard with the stethoscope near but not touching the chest"]], "y": "Slide table 10.5. She said test questions will definitely come from this."}, {"ty": "mc", "d": 3, "q": "A nurse is documenting a heart murmur. Which information is most complete?", "o": ["Grade, location best heard and radiation", "Grade and the pitch of the sound as heard through the diaphragm", "The location where it is heard best and nothing else about it", "Whether the child has symptoms and whether he is active"], "a": [0], "y": "Right: the slide says to grade by intensity, note where it is heard best, and note if it radiates. Why not grade and pitch: pitch is not part of the plan. Why not location alone: the grade and radiation are missing. Why not symptoms and activity alone: they do not describe the murmur."}, {"ty": "mc", "d": 3, "q": "A nurse examines the genitalia of a 4-month-old boy. Which finding is most concerning?", "o": ["One testis cannot be felt in the scrotum", "Both testes are descended", "The urethra opens at the tip of the glans", "The scrotum is slightly swollen at birth only"], "a": [0], "y": "Right: both testes should be descended, so one that cannot be felt in the scrotum needs reporting. Why not both testes descended: normal. Why not the urethra at the tip of the glans: normal. Why not slight scrotal swelling at birth: expected early."}, {"ty": "mc", "d": 3, "q": "During a perineal exam on a 3-year-old girl the nurse finds labial adhesions. Which action is most appropriate?", "o": ["Assess further, since adhesions may signal abuse", "Document it as normal and move on to the rest of the exam", "Apply a cream and teach the mother how to use it every day", "Reassure her that it is only caused by poor hygiene habits"], "a": [0], "y": "Right: the slide note says labial adhesions can be a sign of abuse in girls, so always assess further. Why not documenting as normal: it could miss abuse. Why not applying a cream and teaching the mother: it treats the finding without looking for the cause. Why not reassuring that it is poor hygiene: it dismisses a possible safety concern."}, {"ty": "mc", "d": 2, "q": "A 4-month-old has brisk deep tendon reflexes. How does the nurse interpret this?", "o": ["Expected, since brisk DTRs normalize by 5 months", "Abnormal, since DTRs should be completely absent at this age", "Expected only in newborns and should be gone after 1 month", "Abnormal at any age and needs a neurologic referral right away"], "a": [0], "y": "Right: DTRs are brisk in newborns and decrease to normal by 5 months, so brisk at 4 months is expected. Why not absent: they should be present. Why not only in newborns: it lasts until about 5 months. Why not abnormal at any age: brisk is expected early."}, {"ty": "mc", "d": 3, "q": "A 14-month-old has a positive Babinski reflex. What is the best nursing action?", "o": ["Report it, since it should be gone by 12 months", "Document it as an expected finding for a toddler of this age", "Reassure the parent that the reflex will go away with time", "Repeat the check in 3 months and record the findings then"], "a": [0], "y": "Right: a positive Babinski is expected until 12 months, so at 14 months it should have gone and needs reporting. Why not expected: she is past 12 months. Why not reassuring the parent: it could signal a neurologic problem. Why not repeating in 3 months: it needs prompt report."}], "tan": [{"ty": "mc", "d": 2, "q": "A nurse examines a 10-year-old girl who has a small mound of breast tissue and a widened areola. Which Tanner stage is this?", "o": ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], "a": [0], "y": "Right: a small mound of breast tissue with a widened areola is the breast bud stage, stage 2. Why not stage 1: only the nipple is raised and nothing else has changed. Why not stage 3: the breast and areola enlarge further with the nipple flush against the breast. Why not stage 4: the areola and nipple rise as a secondary mound."}, {"ty": "mc", "d": 3, "q": "A nurse sees that a girl's breast and areola are enlarged as one smooth contour and the nipple is flush with the breast. Which stage is this and how does it differ from stage 4?", "o": ["Stage 3, because there is no secondary mound", "Stage 2, because the areola is widened", "Stage 4, because the breast is enlarged", "Stage 5, because the nipple is flush"], "a": [0], "y": "Right: when breast and areola enlarge together as one contour with the nipple flush, it is stage 3, and the lack of a secondary mound separates it from stage 4. Why not stage 2: that is a bud with a widened areola, before the whole breast enlarges. Why not stage 4: the breast is enlarged in stage 3 too, so enlargement alone does not make it stage 4, the secondary mound does. Why not stage 5: in stage 5 only the nipple protrudes and the areola returns to the breast contour."}, {"ty": "mc", "d": 3, "q": "A girl's breast shows an areola and nipple projecting above the contour of the breast as a second mound. Which stage is this?", "o": ["Stage 4", "Stage 3", "Stage 5", "Stage 2"], "a": [0], "y": "Right: the areola and nipple forming a secondary mound over the breast is the sign of stage 4. Why not stage 3: the nipple is flush with the breast and there is no second mound. Why not stage 5: in the mature breast only the nipple protrudes and the areola is flush. Why not stage 2: a stage 2 breast is just a small bud."}, {"ty": "mc", "d": 3, "q": "A girl has sparse, long downy pubic hair mostly on the labia that is slightly pigmented and straight. Which stage is this?", "o": ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], "a": [0], "y": "Right: sparse, long, downy, slightly pigmented hair mostly on the labia is stage 2. Why not stage 1: only fine vellus hair and no true pubic hair. Why not stage 3: hair spreads over the mons pubis and is darker, coarser and curlier. Why not stage 4: the hair is adult in type but covers a smaller area."}, {"ty": "mc", "d": 3, "q": "A girl has dark, coarse, curly pubic hair that covers the mons pubis but is not on the medial thighs. Which stage is this?", "o": ["Stage 4", "Stage 2", "Stage 3", "Stage 5"], "a": [0], "y": "Right: adult-type hair (dark, coarse, curly) over a smaller area with none on the medial thigh is stage 4. Why not stage 2: sparse hair mostly on the labia. Why not stage 3: it is spreading over the mons and darker, but not yet adult in type. Why not stage 5: adult pattern, inverse triangle, and also on the medial thigh."}, {"ty": "ord", "d": 3, "q": "Place the order in which pubertal changes appear in girls (Tanner).", "items": ["Breast development", "Pubic hair distribution", "Axillary hair", "Menstruation"], "y": "The slide lists breast development, then pubic hair, then axillary hair, then menstruation."}, {"ty": "mc", "d": 3, "q": "A 12-year-old boy has reddening of the scrotal skin and enlarged testes with thin, light pubic hair. Which stage is this?", "o": ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], "a": [0], "y": "Right: reddening of the scrotal skin, testicular enlargement and thin light pubic hair is stage 2 in boys. Why not stage 1: childlike, nothing changing. Why not stage 3: the penis lengthens and the testes keep growing. Why not stage 4: the penis is wider and longer with thick pubic hair, voice change and facial hair."}, {"ty": "mc", "d": 3, "q": "A 13-year-old boy's penis has lengthened but not widened. Pubic hair is darker. Which stage is this?", "o": ["Stage 3", "Stage 2", "Stage 4", "Stage 5"], "a": [0], "y": "Right: a penis that lengthens but does not widen with darker pubic hair is stage 3. Why not stage 2: that is scrotal reddening and testicular growth. Why not stage 4: the penis widens as well as lengthens. Why not stage 5: adult genitalia."}, {"ty": "mc", "d": 3, "q": "A 14-year-old boy has a penis that is wider and longer, thick pubic hair, a deepening voice and early facial hair. Which stage is this?", "o": ["Stage 4", "Stage 3", "Stage 2", "Stage 5"], "a": [0], "y": "Right: widening and lengthening of the penis with thick pubic hair, a deepening voice and early facial hair is stage 4. Why not stage 3: length only. Why not stage 2: only scrotal reddening and testicular growth. Why not stage 5: adult genitalia with full pubic and body hair."}, {"ty": "mc", "d": 3, "q": "The nurse is explaining to a mother why her 9-year-old daughter's first visible sign of puberty is breast changes. Which statement is correct?", "o": ["Breast development is the first change, followed by pubic hair", "Menstruation is the first visible change of puberty in girls", "Axillary hair is always the first sign in girls before anything else", "Pubic hair always comes before any breast changes in every girl"], "a": [0], "y": "Right: the Tanner order in girls is breast development, then pubic hair, then axillary hair, then menstruation. Why not menstruation first: it is last. Why not axillary hair first: it is third. Why not pubic hair before breasts: the slide lists breast development first."}, {"ty": "mc", "d": 3, "q": "A father is worried that his newborn son has swollen nipples. What is the best response?", "o": ["It is expected and comes from maternal estrogen", "It is a sign of early puberty that needs an endocrine evaluation", "It is a sign of a renal disorder that needs imaging of the kidneys", "It needs a referral to endocrinology before he is discharged home"], "a": [0], "y": "Right: newborns of both genders may have swollen nipples from maternal estrogen, which is expected and fades. Why not early puberty: it comes from the mother's hormones, not his own. Why not a renal disorder: that is the possible meaning of supernumerary nipples, not swelling. Why not an endocrine referral: it does not need one."}, {"ty": "mc", "d": 3, "q": "A nurse finds a small, darkly pigmented, nipple-like spot along the mammary ridge in a school-age child. Which is the best action?", "o": ["Document as a supernumerary nipple and note it may relate to a renal disorder", "Document it as a mole and ignore it unless it grows or changes color", "Report it as an infection and begin treatment with a topical antibiotic", "Reassure the family that it is a Tanner stage 2 finding of puberty"], "a": [0], "y": "Right: small, darkly pigmented, nipple-like spots along the mammary ridge are supernumerary nipples, which may indicate renal disorders or may not be concerning, so they are documented and noted. Why not a mole: the location along the mammary ridge and nipple-like look point to an extra nipple. Why not an infection: there are no signs of infection. Why not a Tanner stage 2 finding: Tanner staging describes breast development, not an extra nipple."}, {"ty": "sata", "d": 3, "q": "Which statements about Tanner staging are correct? Select all that apply.", "o": ["Stage 1 is prepubertal and stage 5 is mature", "Girls are rated on breasts and pubic hair", "Boys are rated on genitalia and pubic hair", "Stages 2 to 4 are the ones most often tested", "Stage 3 breasts have a secondary mound", "Stage 2 in boys is penile widening"], "a": [0, 1, 2, 3], "y": "Right: stage 1 is prepubertal and stage 5 mature, girls are rated on breasts and pubic hair, boys on genitalia and pubic hair, and stages 2 to 4 are the ones she tests. Why not a secondary mound at stage 3: that is stage 4. Why not penile widening at stage 2 in boys: stage 2 is scrotal reddening and testicular growth, and widening is stage 4."}, {"ty": "mat", "d": 3, "q": "Match each Tanner finding with its stage.", "pairs": [["Breast bud, widened areola", "Girls breast stage 2"], ["Secondary mound of areola and nipple", "Girls breast stage 4"], ["Scrotal reddening and testicular enlargement", "Boys genital stage 2"], ["Penis lengthens", "Boys genital stage 3"], ["Penis widens and lengthens", "Boys genital stage 4"]], "y": "Stage 2 starts the changes. Stage 3 is length in boys and further enlargement in girls. Stage 4 is the secondary mound in girls and width plus length in boys."}, {"ty": "mc", "d": 3, "q": "What is the first sign of puberty in most boys?", "o": ["Testicular enlargement with scrotal reddening", "Deepening of the voice and facial hair", "Widening of the penis with thicker pubic hair", "Lengthening of the penis with dark pubic hair"], "a": [0], "y": "Right: stage 2 in boys is the first change, with testicular enlargement and scrotal reddening, and the slide list starts with testicular enlargement. Why not voice and facial hair: stage 4. Why not widening of the penis: stage 4. Why not lengthening of the penis: stage 3."}, {"ty": "ord", "d": 3, "q": "Place the male genital Tanner changes in order.", "items": ["Scrotal reddening and testicular growth", "Penis lengthens", "Penis widens and the voice deepens", "Adult-size genitalia"], "y": "Stage 2 is testes, stage 3 is length, stage 4 is width plus voice change, stage 5 is adult."}], "spc": [{"ty": "mc", "d": 2, "q": "A nurse is caring for a 13-year-old with cystic fibrosis. Which Erikson task is at risk because of the illness?", "o": ["Identity vs role confusion, forming identity relative to peers", "Trust vs mistrust, which depends on consistent care from parents", "Autonomy vs shame and doubt, which is mastered while a toddler", "Initiative vs guilt, which is worked through in the preschool years"], "a": [0], "y": "Right: adolescents are forming their identity among peers, and a chronic illness can make them feel different and isolated, so identity vs role confusion is at risk. Why not trust vs mistrust: that is the infant task. Why not autonomy: the toddler task. Why not initiative: the preschool task. The speaker note says all stages can be affected, but the question asks about a 13-year-old."}, {"ty": "mc", "d": 3, "q": "A mother of a toddler with a chronic heart condition does everything for him and says, 'He is too fragile to try.' Which developmental concern does the nurse recognize?", "o": ["Difficulty developing autonomy", "Difficulty developing trust", "Difficulty achieving industry", "Difficulty achieving identity"], "a": [0], "y": "Right: toddlers need to try things themselves to develop autonomy, and a parent who does everything blocks it. Why not trust: that is the infant stage. Why not industry: that is school age. Why not identity: that is adolescence."}, {"ty": "sata", "d": 3, "q": "A nurse is caring for a premature infant discharged on home oxygen. Which long-term risks are possible? Select all that apply.", "o": ["Cerebral palsy", "Visual impairment", "Chronic lung disease", "Learning disabilities", "Precocious puberty", "Increased bone density"], "a": [0, 1, 2, 3], "y": "Right: cerebral palsy, visual impairment, chronic lung disease and learning disabilities are on the long-term risk list for premature infants. Why not precocious puberty: it is not on the list. Why not increased bone density: premature infants are at risk for problems, not extra strength."}, {"ty": "mc", "d": 3, "q": "A nurse is reviewing risk factors for vulnerable child syndrome with a new graduate. Which statement shows understanding?", "o": ["A baby with newborn jaundice and feeding problems", "Only children who have permanent disabilities are ever at risk", "It occurs only in the first month after the baby is born", "It is caused by parents who provide poor parenting at home"], "a": [0], "y": "Right: newborn jaundice and early feeding problems are on the vulnerable child syndrome risk list along with preterm birth, congenital anomaly, a handicapping condition, a near-fatal illness or accident, and crying or feeding problems in the first 5 years. Why not only permanent disabilities: several risks are temporary. Why not only the first month: the list covers the first 5 years. Why not poor parenting: it is a parent's response to fear of losing the child, not neglect."}, {"ty": "mc", "d": 3, "q": "A 10-year-old sibling of a child with special needs is acting out at school and says, 'No one pays attention to me.' What does the nurse conclude?", "o": ["The sibling feels neglected and cheated of parental time", "The sibling has developed a conduct disorder that needs treatment", "The sibling is manipulating the parents to get more attention", "The sibling is jealous of the gifts that the sick child receives"], "a": [0], "y": "Right: the slides say siblings may feel cheated of parental time and affection and may feel neglected and act out. Why not a conduct disorder: the behavior is a reaction to the family situation. Why not manipulation: he is expressing unmet need for attention. Why not jealousy about gifts: his words point to attention, not gifts."}, {"ty": "mc", "d": 2, "q": "A premature infant was born 8 weeks early and is now 6 months old. How should the nurse assess growth and development?", "o": ["Using the calculated (adjusted) age", "Using the birth date", "Using the average of birth and due dates", "Using the age from conception"], "a": [0], "y": "Right: the slide says to assess growth and development of the former premature infant by calculated age, which here is 6 months minus 2 months. Why not birth date: it would make a normal infant look delayed. Why not an average of birth and due dates: that is not a method. Why not conception age: that is not used."}, {"ty": "mc", "d": 3, "q": "A nurse is teaching the parents of a technology-dependent child. Which action is the highest priority for home care?", "o": ["Set up a therapy schedule and plan discharge early", "Tell them the nurse will provide all of the care at home", "Delay discharge planning until the child is clinically stable", "Advise them to avoid support groups so they can focus on care"], "a": [0], "y": "Right: the slide says early discharge planning and help setting therapy schedules and interventions, and the speaker note says helping families create therapy schedules is really important. Why not the nurse providing all care at home: the family must learn the care and it is not realistic. Why not delaying discharge planning: the slide says early. Why not avoiding support groups: the note says parents often get support from other parents."}, {"ty": "mc", "d": 3, "q": "A mother of a child with a new autism diagnosis says she wants to 'wait and see' before starting therapy. What is the nurse's best response?", "o": ["Explain that early intervention helps and help her enroll", "Agree to wait and recheck at the next visit in a few months", "Tell her that she is in denial and needs to accept the diagnosis", "Tell her therapy is the family's decision and drop the subject"], "a": [0], "y": "Right: the speaker note says to help parents get into early intervention programs and specialists and never delay care. Why not agreeing to wait: it delays care. Why not telling her she is in denial: it is judgmental and shuts down trust. Why not dropping the subject: the nurse advocates for the child."}, {"ty": "mc", "d": 3, "q": "Which resource on the slides directly helps a family with the cost of care?", "o": ["Financial resources", "Respite care, which gives caregivers a planned break", "Educational opportunities, which provide school services by law", "Complementary therapies, such as massage, music and hippotherapy"], "a": [0], "y": "Right: the slide lists financial resources as a resource for the child with special needs, and financial assistance is the one that pays for care. Why not respite care: it gives caregivers a break, it does not pay for care. Why not educational opportunities: they provide school services. Why not complementary therapies: they are therapies the family may pay for, not help with cost."}, {"ty": "mc", "d": 3, "q": "A family asks about education services for their 4-year-old with a developmental delay. Which statement is accurate?", "o": ["Preschool services are mandated for ages 3 to 5", "Early intervention is the program that serves ages 3 to 5", "IDEA applies only to adolescents who are in high school", "Services are not available until a child reaches age 6"], "a": [0], "y": "Right: the slide says preschool services are mandated for ages 3 to 5, and early intervention is mandated from birth to age 2. Why not early intervention for 3 to 5: that is birth to age 2. Why not adolescents only: IDEA (2004) covers children and the local school system. Why not age 6: services start sooner."}, {"ty": "mc", "d": 3, "q": "The mother of a premature infant says, 'I know she's doing great but I check on her every hour. I can't relax.' Which concern does the nurse consider?", "o": ["Vulnerable child syndrome in the parent's view", "Normal parental anxiety that does not need any action at all", "Neglect of the child by a parent who is overwhelmed", "A need for a detailed therapy schedule for the home"], "a": [0], "y": "Right: a mother who checks every hour and cannot relax after a premature birth fits vulnerable child syndrome, where the parent sees the child as fragile. Why not normal anxiety needing no action: it can limit the child's development. Why not neglect: she is overly attentive. Why not a therapy schedule: the problem is her perception."}, {"ty": "mc", "d": 2, "q": "Which stage of Erikson does a school-age child with a chronic illness have trouble achieving?", "o": ["Industry", "Trust", "Initiative", "Identity"], "a": [0], "y": "Right: school age is industry vs inferiority, so illness that limits school and skills puts it at risk. Why not trust: infant. Why not initiative: preschool. Why not identity: adolescence."}, {"ty": "mat", "d": 3, "q": "Match each age group with the Erikson task at risk in special needs.", "pairs": [["Infant", "Trust and bonding"], ["Toddler", "Autonomy"], ["Preschooler", "Initiative"], ["School-age child", "Industry"], ["Adolescent", "Self-identity relative to peers"]], "y": "The slide notes all Erikson stages can be impacted."}, {"ty": "sata", "d": 3, "q": "Which interventions are included in nursing management of children with special needs? Select all that apply.", "o": ["Case management and advocacy", "Education and support of the child and family", "Referral for resources", "Care of the technology-dependent child", "Limit the family's involvement in care", "Defer all decisions to the provider"], "a": [0, 1, 2, 3], "y": "Right: case management, education and support, referral for resources and care of the technology-dependent child are on the nursing management slide. Why not limiting the family's involvement: care is family-centered. Why not deferring all decisions to the provider: the nurse advocates and teaches."}, {"ty": "mc", "d": 3, "q": "A parent asks what respite care is. Which explanation is correct?", "o": ["A planned break that lets caregivers rest from daily care", "A hospital stay used to adjust medications for the child", "A therapy that uses horses to improve muscle tone", "A program that pays for the child's equipment"], "a": [0], "y": "Right: respite care is a planned break so caregivers can rest, and it is one of the resource categories on the slide. Why not a hospital stay for medication changes: that is an admission. Why not horses: that is hippotherapy, a complementary therapy. Why not paying for equipment: that is financial assistance."}, {"ty": "ngn", "d": 3, "scen": "A mother of a 3-year-old with cerebral palsy born at 28 weeks says, 'I cannot leave him with anyone. I'm so tired. His big sister has started hitting other kids at school.'", "parts": [{"ty": "mc", "d": 3, "q": "Which action should the nurse take first?", "o": ["Assess the mother's exhaustion and support network", "Tell her the sister needs a behavior evaluation", "Explain that his developmental delay is expected", "Advise her to avoid asking others for help"], "a": [0], "y": "Right: the mother is exhausted and isolated, so caregiver strain and support are assessed first, as the slides list stressors on caregiver health and family life. Why not telling her the sister needs a behavior evaluation: the acting out is probably a reaction to less attention. Why not explaining that the delay is expected: it does not address her needs. Why not advising her to avoid help: it worsens burnout."}, {"ty": "sata", "d": 3, "q": "Which interventions fit this family? Select all that apply.", "o": ["Refer to respite care and parent support groups", "Help the family plan time for the sibling", "Connect the family with financial and community resources", "Include the mother in setting therapy goals", "Limit the sibling's visits to protect the child", "Let the mother manage alone to build confidence"], "a": [0, 1, 2, 3], "y": "Right: respite, support groups, time for the sibling, financial and community resources, and involving the mother in goals support the whole family. Why not limiting the sibling's visits: siblings already feel neglected. Why not letting the mother manage alone: it increases burnout."}], "y": "Special needs care supports the whole family, including siblings."}, {"ty": "num", "d": 3, "q": "A 10-month-old was born at 28 weeks. Using 40 weeks as full term, what is the adjusted age in months?", "ans": 7, "tol": 0.1, "unit": "months", "y": "28 weeks is 12 weeks early, which is 3 months. 10 minus 3 equals 7 months adjusted age."}, {"ty": "mc", "d": 3, "q": "A 4-year-old with leukemia tells the nurse, 'I'm sick because I was bad.' Which developmental stage explains this?", "o": ["Preoperational thinking, with magical beliefs", "Sensorimotor learning through the senses", "Concrete operational logic about real objects", "Formal operational abstract reasoning"], "a": [0], "y": "Right: preschoolers are in the preoperational stage and use magical thinking, so they believe illness is a punishment for being bad. Why not sensorimotor: that is birth to 2 years and learning through the senses. Why not concrete operational: that is school age and logical about real things. Why not formal operational: abstract reasoning begins in adolescence."}, {"ty": "mc", "d": 3, "q": "Why does the nurse plot a former premature infant's growth using the adjusted age?", "o": ["It compares the infant with children at the same level of maturity", "It makes the infant look older and healthier on the chart", "It speeds up the infant's milestones", "It is required only after the child turns 5"], "a": [0], "y": "Right: plotting by adjusted age compares the infant with children at the same level of maturity, so normal development is not labeled as delay. Why not making the infant look older: the adjustment makes him younger. Why not speeding milestones: it changes the comparison, not the child. Why not only after 5: it is used from the start."}], "end": [{"ty": "mc", "d": 2, "q": "A 9-year-old with leukemia has a DNR order. His heart stops. Which action is correct?", "o": ["Do not start CPR and provide comfort care", "Start compressions until the provider arrives", "Give oxygen only and nothing else", "Ask the parents to reverse the order now"], "a": [0], "y": "Right: DNR means withholding CPR if the heart stops, and comfort care continues, so the nurse does not start CPR and provides comfort. Why not compressions: they go against the order. Why not oxygen only: comfort measures are more than oxygen. Why not asking the parents to reverse the order: the order stands unless the parents and provider change it."}, {"ty": "mc", "d": 3, "q": "A DNR order for a child states, 'oxygen and comfort care but no compressions.' What does this represent?", "o": ["A special limitation of the order", "An allow natural death order", "An order that stops all treatment", "An invalid order"], "a": [0], "y": "Right: the slide says a DNR may have special limitations, such as oxygen and comfort care but no compressions. Why not an allow natural death order: AND is another name for DNR used by some institutions. Why not an order that stops all treatment: oxygen and comfort continue. Why not an invalid order: limits are allowed."}, {"ty": "mc", "d": 3, "q": "A hospital changes 'DNR' to 'allow natural death.' Which statement by the nurse is accurate?", "o": ["Some institutions use AND in place of DNR", "AND means that the family refuses every treatment for the child", "AND means that organ donation has been planned for the child", "AND means the child has been declared brain dead already"], "a": [0], "y": "Right: the slide says that in some institutions DNR is being replaced by allow natural death (AND). Why not refusing all treatment: comfort care continues. Why not organ donation: it is unrelated. Why not brain death: AND is a code status order."}, {"ty": "sata", "d": 3, "q": "The nurse is discussing organ donation with the family of a child who has been declared brain dead. Which statements are correct? Select all that apply.", "o": ["Written consent is required", "The discussion is held separately from the death notification", "The recipient's family pays the expenses", "The child's appearance will not be marred", "The donor's family covers hospital costs", "The donating child may experience pain"], "a": [0, 1, 2, 3], "y": "Right: written consent is required, the discussion is separate from the death notification, the recipient's family pays all expenses and the child's appearance will not be marred. Why not the donor's family covering costs: the recipient's family bears all expenses. Why not the child feeling pain: the donating child will not suffer."}, {"ty": "mc", "d": 3, "q": "A nurse tells a family at the same time that their child has died and that organ donation is possible. What is wrong with this approach?", "o": ["Donation is discussed apart from the death notice", "Consent is not required when the child has been declared brain dead", "Donation can only be mentioned by the hospital social worker", "The family should be told about donation after waiting one week"], "a": [0], "y": "Right: the slide says the donation discussion is separate from impending death or brain death notification, so the family can take in the news and donation does not look like the priority. Why not 'consent is not required': written consent is necessary. Why not social worker only: the slide does not limit who raises it. Why not waiting a week: timing is not set that way."}, {"ty": "mc", "d": 2, "q": "A dying child's parent says, 'I'm afraid you will leave us alone.' Which response is best?", "o": ["I will be here to help you both through this", "The doctors will take care of absolutely everything from here on", "You should take a break and go home to rest for a while", "There is nothing more that anyone can do for your child now"], "a": [0], "y": "Right: the slide says to help ensure the family that the nurse will help them and the child and not abandon them. Why not saying the doctors will take care of everything: it removes the nurse's presence. Why not telling them to go home: it separates them. Why not 'nothing more can be done': comfort, pain control and support continue."}, {"ty": "mc", "d": 3, "q": "Which action best shows palliative care for a child with advanced cancer?", "o": ["Manage pain, give nutrition and support the family", "Focus only on curing the cancer with the strongest treatments available", "Avoid discussing death with the family so they keep their hope", "Limit visitors so that the child can conserve his limited energy"], "a": [0], "y": "Right: palliative care manages pain and discomfort, provides nutrition, gives emotional support and treats the family as the unit of care. Why not curing only: palliative care is a comprehensive continuum. Why not avoiding talk of death: the family needs support and honest communication. Why not limiting visitors: family presence is encouraged."}, {"ty": "mc", "d": 3, "q": "A 17-year-old with a chronic illness will soon turn 18. Which teaching point should the nurse include for transition to adult care?", "o": ["Danger signs and when to seek help", "Only the name of the diagnosis and the name of the medications", "How his parents will go on managing all of his care for him", "How to avoid the transition for as long as it is possible"], "a": [0], "y": "Right: the slide's teaching points for transition include symptoms of worsening condition, danger signs and when to seek help. Why not only the diagnosis and medicines: the slide also lists treatment rationale, insurance, a written plan and when to seek help. Why not parents managing everything: transition fosters self-determination. Why not avoiding the transition: it is planned."}, {"ty": "mc", "d": 2, "q": "Which component is part of transition planning?", "o": ["Establishing a medical home", "Delaying the plan until age 21", "Excluding community resources", "Keeping care coordinated by one provider only"], "a": [0], "y": "Right: the slide lists the importance of a medical home as a component of transition planning. Why not delaying until 21: planning begins earlier. Why not excluding community resources: multidisciplinary coordination includes them. Why not one provider only: it must be multidisciplinary."}, {"ty": "mc", "d": 3, "q": "A family of a dying child asks to stay with the child around the clock. Which response best reflects the guideline?", "o": ["Let them stay as long as they wish, with resources", "Ask them to leave at the end of the posted visiting hours", "Allow only one of the two parents to stay at the bedside", "Let them stay but ask that they not touch the child's body"], "a": [0], "y": "Right: palliative nursing means being present for the family and respecting their needs, so staying as long as they wish with resources fits. Why not ending at visiting hours: it separates the family. Why not allowing one parent: it limits family presence. Why not asking them not to tou
