ch the child: it blocks comfort."}, {"ty": "ngn", "d": 3, "scen": "A nurse is caring for a 10-year-old boy with end-stage cancer. His parents say they are Muslim and ask that a family elder be present at the bedside. His mother says, 'We know he is dying. Please don't let him be in pain, and please don't leave us.'", "parts": [{"ty": "mc", "d": 3, "q": "Which action by the nurse is best?", "o": ["Arrange for the elder to be present and continue pain management", "Explain to the family that only the parents are allowed at the bedside", "Reduce the pain medication to avoid sedating the dying child", "Ask the elder to leave the room during every nursing care task"], "a": [0], "y": "Right: the nurse respects spiritual background and keeps the child comfortable, so the elder is welcome and pain management continues. Why not parents only: the slide says family may extend beyond parents. Why not reducing pain medication: pain control is a goal. Why not asking the elder to leave: it goes against respecting the family's spiritual background."}, {"ty": "sata", "d": 3, "q": "Which interventions should be included in the plan of care? Select all that apply.", "o": ["Manage pain and discomfort", "Provide nutrition", "Provide emotional support to the child and family", "Be present and not abandon the family", "Limit family members to 2 per day", "Avoid mentioning spirituality"], "a": [0, 1, 2, 3], "y": "Right: pain, nutrition, emotional support and being present are on the nursing management slide. Why not limiting family to 2 a day: it limits family presence. Why not avoiding spirituality: the slide says to respect spiritual backgrounds."}], "y": "Palliative care is family-centered and respects culture and spirituality."}, {"ty": "mc", "d": 3, "q": "Which statement shows that a nurse understands palliative care principles?", "o": ["The family is the unit of care", "Palliative care is only for the last hours of life", "The child's wishes are secondary to the family's wishes", "Palliative care ends when the child dies"], "a": [0], "y": "Right: palliative care focuses on the family as a unit of care. Why not last hours only: it is a continuum of care. Why not the child's wishes second: the first principle is respect for the child's goals, preferences and choices. Why not ending at death: grief support continues."}, {"ty": "ord", "d": 3, "q": "Place the steps in order when a child with a DNR order has a cardiac arrest in the hospital.", "items": ["Confirm the code status order", "Do not begin compressions", "Provide comfort measures and oxygen as ordered", "Support the family at the bedside"], "y": "Check the order first, then withhold CPR, then give comfort and oxygen as ordered, and stay with the family."}, {"ty": "mc", "d": 3, "q": "After a child's death, which nursing action best supports the parents?", "o": ["Allow time with the child and offer to let them hold him", "Take the body away quickly to spare them distress", "Advise them not to look at the child", "Ask them to finish all paperwork before they leave"], "a": [0], "y": "Right: time with the child and the chance to hold him supports grieving. Why not taking the body away quickly: it removes the chance to say goodbye. Why not advising them not to look: viewing is the family's choice. Why not paperwork first: it adds burden at the worst time."}, {"ty": "mc", "d": 3, "q": "A 17-year-old with cystic fibrosis is moving to adult care. Which statement shows he is ready?", "o": ["I can name my medications and know when to call the clinic", "My mother will keep handling every appointment", "I will wait to see a doctor until I feel very sick", "I do not need my records in the new clinic"], "a": [0], "y": "Right: knowing his medications and when to call fits the teaching points on symptoms, danger signs and when to seek help. Why not mother handling every appointment: it blocks self-determination skills. Why not waiting until very sick: delaying care is unsafe. Why not skipping records: the new team needs the history."}, {"ty": "sata", "d": 3, "q": "Which are parts of palliative care for a child? Select all that apply.", "o": ["Pain management", "Emotional support", "Spiritual support", "Care that treats the family as the unit", "Stopping all comfort measures", "Limiting care to the final days of life"], "a": [0, 1, 2, 3], "y": "Right: palliative care covers pain, emotional and spiritual support, and treats the family as the unit. Why not stopping comfort: comfort is the goal. Why not final days only: it is a continuum that can begin earlier."}], "med1": [{"ty": "num", "d": 3, "q": "A child weighs 36 kg and is 100 cm tall. Using BSA = square root of (kg x cm / 3600), what is the BSA in m2?", "ans": 1.0, "tol": 0.02, "unit": "m2", "y": "36 x 100 = 3600. 3600 / 3600 = 1. The square root of 1 is 1.0 m2."}, {"ty": "num", "d": 3, "q": "The adult dose is 500 mg. The child's BSA is 0.87 m2. Using child dose = BSA / 1.73 x adult dose, what is the dose in mg? Round to the nearest whole number.", "ans": 251, "tol": 2, "unit": "mg", "y": "0.87 / 1.73 = 0.503. 0.503 x 500 = 251 mg."}, {"ty": "mc", "d": 3, "q": "A nurse questions a pediatric medication order. Which finding is the most important reason to hold the dose and call the provider?", "o": ["The dose is outside the safe range for his weight", "The pharmacy label is typed instead of handwritten by the provider", "The child is asleep at the time when the dose is scheduled", "The route that has been ordered for the medicine is oral"], "a": [0], "y": "Right: pediatric doses are based on weight, so a dose outside the safe range for his weight can poison a small body and must be held until clarified. Why not a typed label: how a label is produced says nothing about the dose. Why not the child being asleep: you assess and wake him if needed, it does not make the order wrong. Why not the oral route: oral is a normal, common route."}, {"ty": "mc", "d": 3, "q": "Why are infants and young children at higher risk for medication errors than adults?", "o": ["Doses follow weight or BSA, so small errors are large", "Their livers are larger so they clear the drugs more quickly", "They always receive their medications by the IV route only", "Their dosing is fixed by age alone and cannot be adjusted"], "a": [0], "y": "Right: because doses are calculated by weight or BSA, a small slip in the decimal or the weight becomes a large percentage of the dose. Why not larger livers clearing drugs faster: the slides say liver and kidney immaturity change drug handling and can lengthen half-life. Why not always IV: many pediatric medications are oral. Why not age alone: dosing uses weight and BSA, not age only."}, {"ty": "mc", "d": 3, "q": "A child's order is for 0.5 mL and the nurse reads it as 5 mL. Which practice would have prevented this?", "o": ["Use a leading zero and never a trailing zero", "Write the dose without any decimal point in it at all", "Round the dose up to the nearest whole number every time", "Check the drug name only and trust the rest of the order"], "a": [0], "y": "Right: a leading zero (0.5) makes the decimal point visible, so it is not missed, and a trailing zero (5.0) is avoided because it can be read as 50. Why not dropping the decimal: it removes accuracy. Why not rounding up: it raises the dose. Why not checking the drug name only: the dose is where the error happened."}, {"ty": "sata", "d": 3, "q": "Which actions help prevent pediatric medication errors? Select all that apply.", "o": ["Verify the dose against the child's weight", "Use two identifiers, including the ID band", "Double-check calculations with another nurse for high-alert drugs", "Ask the parent about allergies", "Rely on the parent to state the dose", "Give the dose first and chart later"], "a": [0, 1, 2, 3], "y": "Right: checking the weight, using two identifiers, independent double checks for high-alert drugs and asking about allergies all catch errors before they reach the child. Why not relying on the parent: verify against the order. Why not charting later: skipping the check order invites error, and charting should follow the dose immediately."}, {"ty": "mc", "d": 2, "q": "Which formula gives the percentage of the adult dose a child should receive when using BSA?", "o": ["Child BSA divided by 1.73, times the adult dose", "Weight in kilograms divided by 70, times the adult dose", "Age in years divided by age plus 12, times the adult dose", "Height in centimeters divided by 100, times the adult dose"], "a": [0], "y": "Right: 1.73 m2 is the average adult BSA, so child BSA divided by 1.73 times the adult dose gives the child's dose. Why not kg divided by 70: it is not the BSA method. Why not an age formula: it is not the BSA method. Why not height divided by 100: it is only one part of BSA and ignores weight."}, {"ty": "mc", "d": 3, "q": "The lecture states BSA calculation is not tested. Which statement shows the correct study approach?", "o": ["Know why BSA is used, and focus on weight and fluid math", "Skip all of the dosage calculation material on the exam", "Memorize the square root steps and nothing else about BSA", "Study age-based dosing only since it is the most common"], "a": [0], "y": "Right: she said BSA calculation is not tested, but understanding why it is used (it follows body size and drug clearance better than age) and practicing the weight-based and fluid math is what is likely to appear. Why not skipping all dosage math: fluid and weight-based dosing are fair game. Why not memorizing square roots: the calculation is not tested. Why not age-based dosing only: pediatric dosing is by weight or BSA."}, {"ty": "mc", "d": 3, "q": "A nurse prepares a medication for a toddler and the child says it is 'yucky.' Which approach is best?", "o": ["Be honest, offer a choice, and praise him", "Tell the child that the medicine tastes just like candy", "Hide the drug in a full bottle of formula or juice", "Give the child a choice about whether he wants to take it"], "a": [0], "y": "Right: honesty keeps trust, a limited choice gives the toddler control, and praise reinforces cooperation. Why not saying it tastes like candy: it is false and may lead the child to take it later on his own. Why not hiding it in a full bottle: if he refuses part the dose is uncertain, and the slide says never to mix bitter medicine with formula or essential foods. Why not a choice about whether to take it: the medicine is not optional."}, {"ty": "mc", "d": 3, "q": "A nurse is giving an oral liquid to a 5-month-old. Which technique is correct?", "o": ["Syringe at the inner cheek, given slowly", "Squirt it to the back of the throat as fast as possible", "Lay the infant flat on his back and pour it into his mouth", "Mix it into a full bottle of formula and let him finish it"], "a": [0], "y": "Right: the slide says to give oral liquids slowly in small amounts and let the child swallow between amounts, and the inner cheek is the safest place. Why not squirting to the back of the throat: it triggers gagging and aspiration. Why not lying flat: it raises aspiration risk. Why not mixing into a full bottle: if some is left the dose is incomplete, and the slide warns against mixing with formula."}, {"ty": "mat", "d": 3, "q": "Match each situation with the correct action.", "pairs": [["Child spits out part of a dose", "Do not repeat the dose; report to the provider"], ["Order has no weight listed", "Clarify the order before giving"], ["Dose is above the safe range", "Hold it and call the provider"], ["Child refuses oral medication", "Stay calm, offer a choice about how, and try again"]], "y": "Never guess a repeated dose. Clarify, hold and report."}, {"ty": "num", "d": 3, "q": "The order is 15 mg/kg/dose for a child who weighs 12 kg. How many mg per dose?", "ans": 180, "tol": 1, "unit": "mg", "y": "15 x 12 = 180 mg."}, {"ty": "num", "d": 3, "q": "The child's dose is 180 mg and the liquid is 120 mg per 5 mL. How many mL does the nurse draw up?", "ans": 7.5, "tol": 0.1, "unit": "mL", "y": "180 / 120 = 1.5. 1.5 x 5 = 7.5 mL."}, {"ty": "num", "d": 3, "q": "The child's BSA is 0.6 m2 and the adult dose is 300 mg. Using BSA / 1.73 x adult dose, how many mg? Round to a whole number.", "ans": 104, "tol": 1, "unit": "mg", "y": "0.6 / 1.73 = 0.347. 0.347 x 300 = 104 mg."}, {"ty": "ngn", "d": 3, "scen": "A child weighs 10 kg. The order reads 150 mg every 8 hours. The safe range is 20 to 40 mg/kg/day.", "parts": [{"ty": "num", "d": 3, "q": "How many mg/kg/day is ordered?", "ans": 45, "tol": 0.5, "unit": "mg/kg/day", "y": "150 x 3 doses = 450 mg/day. 450 / 10 kg = 45 mg/kg/day."}, {"ty": "mc", "d": 3, "q": "What should the nurse do?", "o": ["Hold the dose and clarify the order with the provider", "Give the dose because it is close to the range", "Give half the dose and chart the change", "Ask the parent whether the dose looks right"], "a": [0], "y": "Right: 45 mg/kg/day is above the 40 mg/kg/day limit, so the nurse holds the dose and clarifies. Why not giving it because it is close: close is still an overdose in a small child. Why not giving half: changing an order is not a nursing decision. Why not asking the parent: verify against the order and references, not the parent's opinion."}], "y": "Check the safe range before giving."}, {"ty": "mc", "d": 3, "q": "A baby is held by his mother and the nurse is about to give a medication. How should the nurse identify the child?", "o": ["Check the ID band and compare it to the order", "Ask the mother to state the baby's name", "Read the name on the crib card", "Rely on recognizing the baby from earlier"], "a": [0], "y": "Right: the ID band is the reliable identifier and it is compared with the order. Why not asking the mother to state the name: it can be wrong or misheard and a parent cannot be counted on in a stressful moment. Why not the crib card: cards can be moved. Why not recognizing the baby: familiarity is not a safety check."}], "med2": [{"ty": "mc", "d": 3, "q": "A nurse prepares to give an intramuscular injection to a 6-month-old. Which site is best?", "o": ["Vastus lateralis", "Deltoid", "Ventrogluteal", "Dorsogluteal"], "a": [0], "y": "Right: the slide names the vastus lateralis (anterolateral thigh) as the preferred IM site for a child 12 months or younger because muscle development and the amount of fluid decide the site. Why not the deltoid: the slide allows it only for children over 12 months. Why not the ventrogluteal: it appears in the starred picture but is not the infant preferred site, and the infant's gluteal muscles are not well developed. Why not the dorsogluteal: not a site on the slides."}, {"ty": "mc", "d": 3, "q": "A nurse prepares an intramuscular injection for a 14-month-old. Which sites does the slide allow?", "o": ["Vastus lateralis, with the deltoid as an option", "The dorsogluteal muscle is the only choice for a child of this age", "The ventrogluteal muscle is the only choice for a child of this age", "The rectus abdominis muscle, because it is large and easy to reach"], "a": [0], "y": "Right: over 12 months the slide lists the vastus lateralis and says the deltoid may be considered. Why not dorsogluteal only: it is not a site on the slides. Why not ventrogluteal only: it is pictured on the starred slide but the text names the vastus lateralis and deltoid for this age. Why not rectus abdominis: it is not an injection site."}, {"ty": "mc", "d": 3, "q": "A nurse is giving eye drops to a 2-year-old who keeps pulling away. What is the best action?", "o": ["Get a second adult to keep the child's arms and fingers away", "Wrap the child in a blanket and work alone so fewer people frighten him", "Skip the dose and tell the provider that the child refused it", "Wait until the child falls asleep and give the drops then"], "a": [0], "y": "Right: the slide says to get an additional adult for children 3 and younger to keep their arms and fingers away. Why not wrapping the child and working alone: a blanket does not replace a helper and the drops can still miss the eye. Why not skipping the dose: the medication is needed. Why not waiting until he sleeps: it breaks trust and the eye is closed."}, {"ty": "mc", "d": 3, "q": "Which route is used for the MMR vaccine?", "o": ["Subcutaneous", "Intradermal, just under the epidermis", "Intramuscular in the vastus lateralis", "Intravenous through a peripheral line"], "a": [0], "y": "Right: the red note says the MMR vaccine is subcutaneous, into the fatty layer under the skin. Why not intradermal: that deposits just under the epidermis and is used for TB screening and allergy testing. Why not intramuscular in the vastus lateralis: that is an IM site for other injections. Why not intravenous: vaccines are not given IV."}, {"ty": "mc", "d": 3, "q": "A nurse is giving nose drops to a child. Which statement is accurate?", "o": ["Supine with the head hyperextended, held a minute", "Child upright with the head tilted forward as the drops go in", "Hold the nostrils closed while the drops are instilled", "Give the drops at a moment when the child is crying hard"], "a": [0], "y": "Right: the slide says to position the child supine with the head hyperextended and keep it there at least a minute. Why not upright with the head forward: the drops run out. Why not holding the nostrils closed: it blocks the drops, and the slide says not to touch the nares. Why not giving them while he cries: he will swallow or aspirate the drops."}, {"ty": "mc", "d": 3, "q": "Which technique follows the starred eye drop slide?", "o": ["Hold the dropper 2.5 cm (1 inch) from the eye, child looking up and to the side", "Dropper resting on the lashes while the child looks straight down", "Dropper held 10 cm away while the child keeps both eyes shut", "Dropper touching the cornea so that the drop cannot possibly miss"], "a": [0], "y": "Right: the starred slide says to hold the medication 2.5 cm (1 inch) from the eye and have the child look up and to the side. Why not resting on the lashes: the dropper should not touch the eye. Why not 10 cm away with eyes shut: the drop would miss. Why not touching the cornea: it can injure the eye."}, {"ty": "mc", "d": 3, "q": "A 2-year-old is to receive an oral antibiotic. The nurse says, 'You can take this or not, it's up to you.' What is the problem with this approach?", "o": ["It is not optional, so offer a choice about how", "The nurse used the name of the toddler during the explanation", "The antibiotic should have been ordered by the IV route instead", "The child will refuse the medicine every time it is offered"], "a": [0], "y": "Right: when the medicine is required, offering a choice about whether to take it invites refusal, so the choice should be about how or what to drink after. Why not the use of the toddler's name: using it is fine. Why not IV: oral is appropriate. Why not 'will refuse every time': the problem is the false choice."}, {"ty": "mc", "d": 3, "q": "For IM injections, which statement about volume is correct for an infant?", "o": ["Smaller volumes for small muscles, larger only in big ones", "All muscles are able to hold up to 5 mL of medication safely", "Infants tolerate the same volume of injection as adult patients", "Volume does not matter as long as a short needle is chosen"], "a": [0], "y": "Right: the slide says muscle development and the amount of fluid decide the site, so small muscles take smaller volumes. Why not 5 mL in any muscle: far too much for a small muscle. Why not the same as adults: infants have small muscles. Why not volume not mattering with a short needle: needle length is chosen by muscle size and viscosity, but volume still matters."}, {"ty": "sata", "d": 3, "q": "Which measures reduce pain and fear during an injection in a toddler? Select all that apply.", "o": ["Have a parent help comfort the child", "Use distraction", "Be honest that it will pinch", "Apply a topical anesthetic before the procedure when ordered", "Tell the child it will not hurt at all", "Do the injection while the child sleeps"], "a": [0, 1, 2, 3], "y": "Right: the slide lists comforting positions, participation, options and topical anesthetic, and honesty and distraction support them. Why not 'it will not hurt': it is untrue and breaks trust. Why not injecting while asleep: it destroys trust."}, {"ty": "mc", "d": 3, "q": "A child with a gastrostomy tube has one tablet and one capsule ordered. Which action is correct?", "o": ["Crush the tablet and mix with warm water, but do not crush the capsule, and flush after each", "Crush both of them and mix with formula so the child gets nutrition too", "Crush the capsule and skip the flush so that the tube does not leak", "Verify the tube placement once in the morning and skip it for later doses"], "a": [0], "y": "Right: the slides say to crush tablets and mix with warm water, not to crush capsules, and to flush after each medication. Why not crushing both and mixing with formula: capsules are not crushed and bitter medicine is not mixed with formula. Why not skipping the flush: the tube can clog. Why not verifying placement once a day: placement is confirmed before anything is added."}, {"ty": "ord", "d": 3, "q": "Place these actions in order when giving an IM injection to a school-age child.", "items": ["Verify the order and identify the child", "Explain what will happen in simple terms", "Select the site and give the injection", "Praise the child and document"], "y": "Verify first, explain, give the injection, then praise and document."}, {"ty": "mc", "d": 3, "q": "A 3-year-old resists the mother's attempt to give a medicine with a syringe. Which approach is best?", "o": ["Let the child give it to a doll first", "Restrain the child quickly with no explanation of what will occur", "Force the dose in while the child is crying so it is done fast", "Tell the child that the medicine is a treat so he will take it"], "a": [0], "y": "Right: therapeutic play lets a preschooler gain control and understand what will happen. Why not restraining with no explanation: it increases fear. Why not forcing during crying: aspiration risk. Why not calling it a treat: unsafe and untrue."}, {"ty": "mc", "d": 3, "q": "Which position is best for an injection in a toddler?", "o": ["Sitting on a parent's lap in a hug hold", "Prone on the table held by two staff members", "Alone in bed with a blanket over the body", "Standing and facing the wall with the pants down"], "a": [0], "y": "Right: a parent's lap and a hug hold give comfort and keep the limb steady, which fits the slide on comforting positions. Why not prone with two staff: it looks and feels like restraint. Why not alone in bed: separation raises fear. Why not facing the wall: no comfort and no control."}, {"ty": "mc", "d": 3, "q": "A mother asks to crush her child's tablet and mix it into his formula. Which response is best?", "o": ["Mix it with a small amount of applesauce instead", "Mix it into the whole bottle so he does not notice", "Mix it into his cereal and give the full bowl", "Stir it into his juice and let him sip it all day"], "a": [0], "y": "Right: the slide says bitter crushed medication should never be mixed with formula or other essential foods, because the child may link the bitter taste to the food and refuse it, and a small amount of applesauce or another nonessential food is fine. Why not the whole bottle: formula is an essential food and a partly finished bottle gives an uncertain dose. Why not a full bowl of cereal: it is also an essential food and the dose is uncertain. Why not juice sipped all day: the full dose may not be taken."}, {"ty": "mat", "d": 3, "q": "Match each medication technique with the right method.", "pairs": [["Eye drops: where is the dropper held", "2.5 cm (1 inch) from the eye"], ["Nose drops: how is the child positioned", "Supine with the head hyperextended"], ["IM injection at 12 months or younger", "Vastus lateralis"], ["Oral liquid", "Slowly, in small amounts, letting the child swallow"]], "y": "Know each technique and why: it follows the shape of the ear canal and the safe way to avoid aspiration."}, {"ty": "ord", "d": 3, "q": "Place the steps in order for giving an oral medication to a preschooler.", "items": ["Verify the order and identify the child", "Explain simply and offer a choice", "Give the dose by syringe or cup", "Praise and document"], "y": "Verify first, prepare the child, give the dose, then praise and document."}, {"ty": "mc", "d": 3, "q": "After a nurse gives nose drops to a 4-year-old, the mother says she will keep the child's head tilted back for 5 minutes. What is the best response?", "o": ["Tell her that about 1 minute is the right time to keep the head back", "Agree, since a longer time lets more of the drug absorb into the nose", "Agree, but only if the child is lying quietly with the eyes closed", "Tell her the head should come up right away so the drops do not run into the throat"], "a": [0], "y": "Right: the head stays hyperextended for about 1 minute, so 5 minutes is wrong. Why not agreeing for absorption: the rule is a set time and longer does not make it work better, and a child will not hold still that long. Why not agreeing if the child is quiet: a calm child does not change the time. Why not sitting up at once: the drops would drain back out before they work."}, {"ty": "sata", "d": 3, "q": "Which actions are correct when giving nose drops to a child? Select all that apply.", "o": ["Have the child blow the nose first or use a bulb syringe", "Position the child supine with the head hyperextended", "Keep the dropper from touching the nares", "Use medication at room temperature", "Seat the child upright with the chin tucked to the chest", "Touch the dropper to the nostril so no drop is lost", "Keep the head back for 5 minutes"], "a": [0, 1, 2, 3], "y": "Right: the nose is cleared first, the head is tipped back, the dropper stays clean and the drug is room temperature. Why not upright with the chin tucked: the drops run out the front. Why not touching the nostril: it contaminates the dropper. Why not 5 minutes: the rule is 1 minute."}], "ivn": [{"ty": "num", "d": 3, "q": "A child weighs 25 kg. Using 100 mL/kg for the first 10 kg, 50 mL/kg for the next 10 kg and 20 mL/kg for the rest, what is the maintenance fluid rate in mL/hr? Round to the nearest tenth.", "ans": 66.7, "tol": 0.2, "unit": "mL/hr", "y": "First 10 kg = 1000. Next 10 kg = 500. Last 5 kg = 100. Total 1,600 mL/day. 1,600 / 24 = 66.7 mL/hr."}, {"ty": "num", "d": 3, "q": "A child weighs 18 kg. What is the daily maintenance fluid in mL?", "ans": 1400, "tol": 5, "unit": "mL/day", "y": "First 10 kg = 1000. Next 8 kg x 50 = 400. Total 1,400 mL/day."}, {"ty": "num", "d": 3, "q": "A child weighs 12 kg. What is the maintenance rate in mL/hr? Round to the nearest tenth.", "ans": 45.8, "tol": 0.2, "unit": "mL/hr", "y": "First 10 kg = 1000. Next 2 kg x 50 = 100. Total 1,100 mL/day. 1,100 / 24 = 45.8 mL/hr."}, {"ty": "num", "d": 3, "q": "A child weighs 32 kg. What is the daily maintenance fluid in mL?", "ans": 1740, "tol": 5, "unit": "mL/day", "y": "First 10 kg = 1000. Next 10 kg = 500. Remaining 12 kg x 20 = 240. Total 1,740 mL/day."}, {"ty": "num", "d": 3, "q": "A child weighs 8 kg. What is the maintenance rate in mL/hr? Round to the nearest tenth.", "ans": 33.3, "tol": 0.2, "unit": "mL/hr", "y": "8 kg x 100 = 800 mL/day. 800 / 24 = 33.3 mL/hr."}, {"ty": "mc", "d": 3, "q": "Why are infants and young children more prone to dehydration than adults?", "o": ["Higher body water proportion and faster fluid turnover", "They have a lower metabolic rate than adults and use less fluid", "Their kidneys concentrate urine better than those of an adult", "They lose less water through the skin because they are small"], "a": [0], "y": "Right: children have a higher percentage of body water and faster extracellular fluid exchange, so they lose and need fluid quickly. Why not a lower metabolic rate: the slides say metabolic rate is increased. Why not better urine concentration: immature kidneys concentrate poorly until 1 to 2 years. Why not less skin loss: a larger surface area relative to weight means more loss."}, {"ty": "mc", "d": 3, "q": "A nurse is caring for a toddler with an IV in the hand. Which finding is most concerning?", "o": ["Swelling, coolness and pain at the IV site", "The dressing is clean, dry and intact over the catheter", "The child is playing quietly in the crib with a toy", "The arm is resting on a padded arm board for support"], "a": [0], "y": "Right: swelling, coolness and pain at the site suggest infiltration, so the IV is no longer in the vein. Why not a dry intact dressing: that is expected. Why not playing quietly: reassuring. Why not an arm board: protects the site."}, {"ty": "mc", "d": 3, "q": "A nurse finds IV fluid infusing at a rate higher than ordered in a 10-month-old. What is the priority?", "o": ["Stop or slow it and assess for fluid overload", "Document the rate and let the infusion continue to run", "Raise the head of the bed only and watch the infant's color", "Wait until the next shift check to see if the rate is wrong"], "a": [0], "y": "Right: infants tolerate fluid overload poorly, so the infusion is stopped or slowed and the infant assessed. Why not documenting and continuing: it leaves him overloaded. Why not raising the head only: it does not stop the overload. Why not waiting until the next check: too late."}, {"ty": "mc", "d": 3, "q": "Which device is used to prevent accidental fluid overload in a pediatric IV?", "o": ["Infusion pump with a volume-limiting chamber", "Gravity drip with no chamber to limit what can flow in", "Bolus syringe pushed by gravity from the hanging container", "Adult-size bag of fluid hung high above the child's bed"], "a": [0], "y": "Right: a pump or volume-limiting chamber caps what the child can receive. Why not a plain gravity drip: free flow risk. Why not a bolus syringe by gravity: not a maintenance method. Why not an adult bag hung high: more volume and pressure than he needs."}, {"ty": "mc", "d": 3, "q": "A nurse is choosing between an enteral and a parenteral feeding for a child with a working gut. Which is preferred and why?", "o": ["Enteral, since it keeps the gut working", "Parenteral, since it is more natural for a child's body", "Parenteral, since it is cheaper and carries fewer risks", "Neither one, since both routes are risky for children"], "a": [0], "y": "Right: the slide says enteral feeding is for a patient with a functioning GI tract, and it keeps the gut working with fewer complications. Why not parenteral because it is natural: it is not. Why not parenteral because it is cheaper: it costs more and has more risk. Why not neither: a working gut should be used."}, {"ty": "mc", "d": 3, "q": "What must the nurse do before adding anything to a nasogastric tube?", "o": ["Confirm placement, for example by the color and pH of the aspirate", "Flush with air and listen over the stomach only", "Ask the child whether the tube feels in the right place", "Start the feeding slowly and check placement if he coughs"], "a": [0], "y": "Right: the slide says placement must be confirmed before adding anything, for example by color and pH of the aspirate (gastric 1.5-4, respiratory above 7) and the external tube length. Why not air and listening only: it is unreliable. Why not asking the child: he cannot know. Why not starting and checking if he coughs: the slide says to confirm first."}, {"ty": "sata", "d": 3, "q": "Which findings suggest dehydration in a 1-year-old? Select all that apply.", "o": ["Sunken anterior fontanel", "Dry mucous membranes", "Decreased urine output", "Tachycardia", "Bulging fontanel", "Moist mucous membranes"], "a": [0, 1, 2, 3], "y": "Right: a sunken fontanel, dry membranes, low urine output and a fast heart rate are signs of dehydration. Why not a bulging fontanel: raised ICP. Why not moist membranes: normal."}, {"ty": "mc", "d": 3, "q": "A child with a central line has a fever of 39 C. Which action is the priority?", "o": ["Notify the provider of possible line infection", "Give the child a bath and recheck the temperature later", "Flush the line forcefully to clear any blockage that exists", "Remove the line yourself so the source is no longer there"], "a": [0], "y": "Right: fever with a central line may mean a line infection or sepsis, so the provider is notified at once. Why not a bath: delay. Why not a forceful flush: it can push infection in. Why not removing it yourself: not a nursing decision."}, {"ty": "ngn", "d": 3, "scen": "A 4-year-old weighing 18 kg has gastroenteritis and is receiving IV maintenance fluids. The nurse notes the IV site is red and swollen and the child has not urinated in 8 hours.", "parts": [{"ty": "mc", "d": 3, "q": "Which action should the nurse take first?", "o": ["Stop the infusion and assess the IV site", "Increase the rate to catch up on fluids", "Apply a warm bath and recheck", "Document the finding only"], "a": [0], "y": "Right: redness and swelling suggest infiltration or phlebitis, so the infusion is stopped and the site assessed first. Why not increasing the rate: it worsens infiltration. Why not a warm bath: delay. Why not documenting only: fluid is not reaching the vein."}, {"ty": "num", "d": 3, "q": "What is the child's daily maintenance fluid in mL?", "ans": 1400, "tol": 5, "unit": "mL/day", "y": "First 10 kg = 1000. Next 8 kg x 50 = 400. Total 1,400 mL/day."}], "y": "Check the site first, then the math."}, {"ty": "num", "d": 3, "q": "A child weighs 28 kg. What is the maintenance fluid rate in mL/hr? Round to the nearest tenth.", "ans": 69.2, "tol": 0.2, "unit": "mL/hr", "y": "1000 + 500 + (8 x 20 = 160) = 1,660 mL/day. 1,660 / 24 = 69.2 mL/hr."}, {"ty": "mc", "d": 3, "q": "Which finding best fits phlebitis at an IV site?", "o": ["Redness, warmth and a firm cord along the vein", "Pale, cool and swollen skin around the site", "A dry dressing with no change in skin", "Blood backing up into the tubing only"], "a": [0], "y": "Right: phlebitis is inflammation of the vein, with redness, warmth and a cord. Why not pale, cool, swollen skin: that is infiltration. Why not a dry dressing: normal. Why not blood in the tubing: usually the bag was lowered, not an inflammation sign."}, {"ty": "sata", "d": 3, "q": "Which actions keep a child's IV infusion safe? Select all that apply.", "o": ["Check the site on a regular schedule", "Use a pump or volume-limiting chamber", "Protect the site with an arm board", "Verify the rate against the order", "Hang several bags of fluid at once", "Disconnect the line for a bath without clamping it"], "a": [0, 1, 2, 3], "y": "Right: site checks, volume control, protection with an arm board and verifying the rate are safe practice, and the slide says to protect the site from bumping and assess at regular intervals. Why not hanging several bags: overload risk. Why not disconnecting without clamping: air and infection risk."}], "star": [{"ty": "mc", "d": 3, "q": "A mother asks why you let her 2-year-old hold the stethoscope before the exam. What is the best explanation?", "o": ["Play gives control and lowers fear, the aim of atraumatic care", "It saves time during the exam since the child does not resist", "It is required before every assessment of a young child", "It keeps the child from crying for the whole of the exam"], "a": [0], "y": "Right: letting a toddler handle the stethoscope gives control and removes fear, which is the aim of atraumatic care. Why not saving time: it takes longer, but it prevents a struggle. Why not required before every assessment: it is a technique, not a rule. Why not stopping crying for the whole exam: it lowers fear but does not guarantee a quiet child."}, {"ty": "mc", "d": 3, "q": "Which parenting style is linked to children who are more likely to be compliant and have good self-regulation?", "o": ["Authoritative", "Authoritarian", "Permissive", "Neglectful"], "a": [0], "y": "Right: authoritative parents set limits with warmth and explanation, which builds compliance and self-regulation. Why not authoritarian: strict rules without discussion tend to produce compliance from fear or rebellion. Why not permissive: few limits leave children with less self-control. Why not neglectful: little involvement leaves the child without guidance."}, {"ty": "mc", "d": 3, "q": "The nurse is assessing a 3-year-old. His heart rate is 115 and the nurse believes it is normal. Is the nurse correct?", "o": ["No, preschool is 65-110, so 115 is high and needs a reason", "Yes, 115 is within the normal range for every age group", "Yes, the toddler range of 70-120 applies to a 3-year-old", "No, 115 is dangerously low for a preschool age child"], "a": [0], "y": "Right: a 3-year-old is a preschooler, whose range is 65-110, so 115 is high and needs a reason such as crying or fever. Why not normal for every age: ranges fall as the child grows. Why not the toddler range of 70-120: a 3-year-old is a preschooler, which is the trap. Why not dangerously low: 115 is above the range, not below it."}, {"ty": "mc", "d": 3, "q": "The anterior fontanel is expected to close at which age?", "o": ["9 to 18 months", "2 months", "6 months", "24 months"], "a": [0], "y": "Right: the slide says the anterior fontanel closes between 9 and 18 months. Why not 2 months: the posterior fontanel closes from birth to 2 months. Why not 6 months: too early. Why not 24 months: past the expected closure."}, {"ty": "ord", "d": 3, "q": "Place the steps of a pediatric assessment in the order that follows the lecture.", "items": ["Count heart and respiratory rates and auscultate heart, lungs and abdomen", "Palpate the abdomen", "Examine the head, neck, eyes and mouth", "Examine the ears and throat last"], "y": "Quiet, noninvasive steps first, auscultate before palpation, invasive parts last."}, {"ty": "mc", "d": 3, "q": "A parent says, 'The nurse shouldn't tell my child the shot will pinch.' Which response supports the child's trust?", "o": ["Honest, simple information builds trust", "Tell the child that it will not hurt at all, to keep him calm", "Say nothing and do the injection very quickly", "Wait until the child is sleeping and then give it"], "a": [0], "y": "Right: honest, simple information builds trust, so telling a child a shot will pinch lets him believe the nurse next time. Why not saying it will not hurt: it is untrue and breaks trust. Why not saying nothing and doing it quickly: surprises increase fear. Why not waiting until he is asleep: it destroys trust and frightens him on waking."}, {"ty": "mc", "d": 3, "q": "A nurse is writing a teaching plan. According to the cone of learning, which method leads to the highest retention?", "o": ["Doing the real thing and teaching it back", "Reading about the topic from the handout alone", "Listening to a lecture given by the nurse", "Watching a demonstration that is done for the family"], "a": [0], "y": "Right: the cone of learning puts doing and saying at about 90% retention, so teaching it back is best. Why not reading: about 10%. Why not a lecture: about 20%. Why not watching a demonstration: about 30%, and it is passive."}, {"ty": "mc", "d": 3, "q": "Which finding in a 4-month-old requires a report?", "o": ["Bulging fontanel that persists while calm", "Brisk deep tendon reflexes in a baby of this age", "Belly breathing seen when the infant is lying quietly", "Acrocyanosis seen during the first days of life"], "a": [0], "y": "Right: a bulge that persists in a calm infant suggests increased intracranial pressure and needs a report. Why not brisk DTRs: they normalize by 5 months. Why not belly breathing: infants breathe with the diaphragm. Why not acrocyanosis: it is normal in newborns for several days."}, {"ty": "sata", "d": 3, "q": "Which are risk factors for vulnerable child syndrome? Select all that apply.", "o": ["Preterm birth", "Newborn jaundice", "A near-fatal illness or accident", "Congenital anomaly", "Being the oldest sibling", "Starting school"], "a": [0, 1, 2, 3], "y": "Right: preterm birth, newborn jaundice, near-fatal illness or accident and congenital anomaly are on the slide. Why not being the oldest sibling or starting school: neither is a listed risk."}, {"ty": "mc", "d": 3, "q": "A child's DNR order says no CPR. The nurse asks whether to give oxygen. What is correct?", "o": ["Follow the order's wording, which may allow oxygen and comfort care", "Never give oxygen to a child who has a DNR order in place", "Start CPR anyway since the child is young and may recover", "Remove all comfort measures since the child is not to be treated"], "a": [0], "y": "Right: the slide says a DNR may have special limitations such as oxygen and comfort care but no compressions, so the wording of the order decides. Why not never giving oxygen: oxygen may be allowed. Why not starting CPR anyway: it goes against the order. Why not removing comfort measures: comfort care continues."}, {"ty": "num", "d": 3, "q": "A child weighs 20 kg. What is the maintenance fluid rate in mL/hr? Round to the nearest tenth.", "ans": 62.5, "tol": 0.2, "unit": "mL/hr", "y": "First 10 kg = 1000. Next 10 kg = 500. Total 1,500 mL/day. 1,500 / 24 = 62.5 mL/hr."}, {"ty": "mc", "d": 3, "q": "A mother of a toddler says, 'He is stubborn and always says no.' Which explanation fits the child's development?", "o": ["Saying no is part of developing autonomy", "He has a behavior disorder that needs to be evaluated", "He is being manipulative to get his way with his parents", "His parent is too strict and needs parenting classes"], "a": [0], "y": "Right: toddlers are in the stage of autonomy vs shame and doubt, so saying no is part of learning independence. Why not a behavior disorder: it is expected. Why not manipulation: it is a developmental drive. Why not a strict parent: there is nothing to suggest strictness."}, {"ty": "mc", "d": 3, "q": "A 10-year-old girl has a breast bud with a widened areola. Which sequence of puberty changes should the nurse expect next?", "o": ["Pubic hair, then axillary hair, then menstruation", "Menstruation first, then pubic hair and axillary hair", "Axillary hair first, then breast changes and menstruation", "Menstruation, then axillary hair, then pubic hair growth"], "a": [0], "y": "Right: after breast development, the slide lists pubic hair, then axillary hair, then menstruation. Why not menstruation first or second: it is last. Why not axillary hair first: it follows pubic hair. Why not menstruation, then axillary hair, then pubic hair: it reverses the order."}, {"ty": "mc", "d": 3, "q": "Why is the vastus lateralis the preferred IM site in infants?", "o": ["Best-developed infant muscle, away from major nerves", "It is the largest muscle area found on an infant's body", "It is the least painful of the injection sites for all ages", "The gluteal muscles are fully developed in every infant"], "a": [0], "y": "Right: the vastus lateralis is the best-developed muscle in infants and is away from major nerves. Why not the largest area: size is not the reason. Why not least painful for all ages: it is chosen for muscle development, not pain. Why not gluteal muscles fully developed: infants' gluteal muscles are not developed."}, {"ty": "mat", "d": 3, "q": "Match each age group with its Erikson stage.", "pairs": [["Infant", "Trust vs mistrust"], ["Toddler", "Autonomy vs shame and doubt"], ["Preschooler", "Initiative vs guilt"], ["School-age child", "Industry vs inferiority"], ["Adolescent", "Identity vs role confusion"]], "y": "Each task fits the age: infants need reliable care for trust, toddlers practice independence, preschoolers start activities, school-agers master skills, teens form identity."}, {"ty": "mc", "d": 3, "q": "Why does the infant stage fit trust vs mistrust?", "o": ["Infants depend fully on caregivers, so consistent care builds trust", "Infants test limits, so firm rules build trust", "Infants compare themselves with peers, so praise builds trust", "Infants choose their own goals, so freedom builds trust"], "a": [0], "y": "Right: infants depend on caregivers for everything, so consistent care teaches them the world is safe, which is trust vs mistrust. Why not testing limits: that is a toddler. Why not comparing with peers: school age. Why not choosing their own goals: preschool initiative."}, {"ty": "mc", "d": 3, "q": "Why does the toddler stage fit autonomy vs shame and doubt?", "o": ["Toddlers are learning to walk, feed and toilet themselves and want control", "Toddlers are forming a sense of who they are among their peers", "Toddlers begin to plan and start activities that they can finish", "Toddlers learn skills at school and compare their results with others"], "a": [0], "y": "Right: toddlers are learning to walk, feed and toilet themselves, so they want control, which is autonomy vs shame and doubt. Why not forming a sense of who they are: adolescence. Why not planning activities: preschool initiative. Why not learning skills at school: industry vs inferiority."}, {"ty": "mc", "d": 3, "q": "Which parenting style gives clear limits with warmth and explanation?", "o": ["Authoritative", "Authoritarian", "Permissive", "Neglectful"], "a": [0], "y": "Right: authoritative parents give clear limits with warmth and explanation. Why not authoritarian: strict and rigid with little explanation. Why not permissive: warm but few limits. Why not neglectful: little involvement."}, {"ty": "mc", "d": 3, "q": "Why is the parenting style important to the nurse during teaching?", "o": ["It shows how the family will carry out limits and the care plan at home", "It tells the nurse the child's diagnosis before the exam begins", "It tells the nurse which Tanner stage the child has reached", "It predicts the child's adult weight and height from the early years"], "a": [0], "y": "Right: how a family sets limits and follows through at home affects whether the care plan and teaching are carried out. Why not the diagnosis: the style tells you nothing about it. Why not the Tanner stage: unrelated. Why not weight and height: unrelated."}, {"ty": "mc", "d": 3, "q": "Why must the BP cuff be proportionate to the size of the child's extremity?", "o": ["A cuff that is too small reads falsely high and too large reads falsely low", "A narrow cuff always reads accurately because it fits closer", "The width of the cuff has no effect on the number that is read", "The cuff must be placed across the elbow joint to get a reading"], "a": [0], "y": "Right: a cuff that is too small needs more pressure to close the artery so it reads high, and a cuff that is too large reads low, so the slide says to match the extremity. Why not always accurate: narrow cuffs overread. Why not no effect: width changes the number. Why not across the elbow: the cuff sits on the extremity, not the joint."}, {"ty": "mc", "d": 3, "q": "Which heart rate range applies to a school-age child?", "o": ["60-100 beats per minute", "70-120 beats per minute", "65-110 beats per minute", "80-150 beats per minute"], "a": [0], "y": "Right: school age is 60-100 beats per minute. Why not 70-120: toddler. Why not 65-110: preschool. Why not 80-150: infant."}, {"ty": "mc", "d": 3, "q": "Which respiratory rate range applies to a toddler?", "o": ["20-30 breaths per minute", "25-55 breaths per minute", "14-26 breaths per minute", "12-20 breaths per minute"], "a": [0], "y": "Right: toddlers breathe 20-30 per minute. Why not 25-55: infant. Why not 14-26: school age. Why not 12-20: adolescent."}, {"ty": "mat", "d": 3, "q": "Match each age group with its normal heart rate range.", "pairs": [["Infant", "80-150"], ["Toddler", "70-120"], ["Preschooler", "65-110"], ["School-age child", "60-100"], ["Adolescent", "55-95"]], "y": "Rates fall as children grow. Table 10.3 is the source."}, {"ty": "mc", "d": 3, "q": "Why is the posterior fontanel expected to close before the anterior?", "o": ["It is smaller and closes earlier, from birth to 2 months", "It is larger and closes first, by about 18 months of age", "It stays open until the child begins to walk on his own", "It never closes on its own and is covered by bone later"], "a": [0], "y": "Right: the posterior fontanel is small and closes from birth to 2 months, while the anterior closes at 9 to 18 months. Why not larger and closing first: the anterior is the larger one. Why not closing when walking begins: closure is not tied to walking. Why not never closing: both close."}, {"ty": "mc", "d": 3, "q": "What does a sunken anterior fontanel suggest?", "o": ["Dehydration", "Increased intracranial pressure", "A normal finding while crying", "Craniosynostosis"], "a": [0], "y": "Right: a sunken fontanel suggests dehydration. Why not increased ICP: it bulges. Why not normal while crying: crying causes a brief bulge, not sinking. Why not craniosynostosis: that is early closure of skull sutures."}, {"ty": "mc", "d": 3, "q": "Which finding must be reported in a newborn?", "o": ["Central cyanosis of the lips and tongue", "Blue hands and feet for a short time", "Swollen nipples from maternal estrogen", "Brisk deep tendon reflexes"], "a": [0], "y": "Right: central cyanosis of the lips and tongue means poor oxygenation and needs action. Why not blue hands and feet: that is acrocyanosis, normal in a newborn. Why not swollen nipples: maternal estrogen. Why not brisk DTRs: normal in newborns."}, {"ty": "mc", "d": 3, "q": "Which murmur grade has a palpable thrill?", "o": ["Grade 4", "Grade 3", "Grade 2", "Grade 1"], "a": [0], "y": "Right: grade 4 is audible with a palpable thrill. Why not grade 3: intermediate, no thrill. Why not grade 2: quiet. Why not grade 1: barely audible."}, {"ty": "mc", "d": 3, "q": "Why is the cone of learning important to patient teaching?", "o": ["People remember most when they do and say it themselves", "People remember most of what they read in a handout at home", "People remember most of what they hear in a lecture from an expert", "Retention is the same for every teaching method that is used"], "a": [0], "y": "Right: retention is highest, about 90%, when people do and say the skill themselves. Why not reading: about 10%. Why not hearing: about 20%. Why not the same for all methods: the cone shows large differences."}, {"ty": "ord", "d": 3, "q": "Place the cone of learning methods from the lowest retention to the highest.", "items": ["Reading", "Hearing words", "Seeing pictures", "Watching a demonstration", "Saying and writing", "Doing the real thing"], "y": "The slide runs 10, 20, 30, 50, 70, 90 percent."}, {"ty": "mc", "d": 3, "q": "A DNR order is to be followed when which event occurs?", "o": ["The heart or breathing stops", "The child has a fever", "The child refuses a meal", "The child asks for pain medication"], "a": [0], "y": "Right: DNR applies when the heart stops beating or breathing stops. Why not a fever: the child still gets full treatment. Why not refusing a meal: ordinary care continues. Why not asking for pain medication: pain is treated."}, {"ty": "mc", "d": 3, "q": "Which statement about organ donation is true?", "o": ["The recipient's family pays the donation costs", "The donor's family pays the donation costs", "Verbal consent is enough", "The child may feel pain during donation"], "a": [0], "y": "Right: the slide says all expenses are borne by the recipient's family. Why not the donor's family: they do not pay. Why not verbal consent: written consent is necessary. Why not the child feeling pain: the donating child will not suffer."}, {"ty": "mc", "d": 3, "q": "A former premature infant is 8 months old and was born 2 months early. Which age is used to assess development?", "o": ["6 months", "8 months", "10 months", "2 months"], "a": [0], "y": "Right: calculated age is the actual age minus the months born early, so 8 minus 2 equals 6 months. Why not 8: it makes him look delayed. Why not 10: you subtract, not add. Why not 2: that is how early he was born."}, {"ty": "mc", "d": 3, "q": "Which sign of the parent suggests vulnerable child syndrome?", "o": ["Treating a healthy child as fragile after a scare", "Teaching the child to do more things independently as he grows", "Keeping the child on a normal schedule that matches his age", "Allowing the child to play with other children of the same age"], "a": [0], "y": "Right: parents who feared losing the child may overprotect and see him as fragile, which is vulnerable child syndrome. Why not teaching independence, a normal schedule or play: these are healthy."}, {"ty": "mc", "d": 3, "q": "For a child younger than 3, how is the earlobe positioned for a tympanic temperature?", "o": ["Pulled back and down, with the sensor aimed at the center of the eardrum", "Up and back, with the sensor aimed at the side of the canal wall", "Forward, with the sensor aimed toward the nose to avoid the wax", "Left in place, with the probe pushed as far as it will go"], "a": [0], "y": "Right: the slide says that for children younger than 3 the earlobe is pulled back and down and the sensor is aimed at the center of the tympanic membrane. Why not up and back at the canal wall: the slide aims at the center, not the sides. Why not forward toward the nose: it does not straighten the canal. Why not not moving the ear and pushing the probe: the slide says to insert it gently."}, {"ty": "mc", "d": 3, "q": "Which IM site is preferred for a child who is 12 months or younger?", "o": ["Vastus lateralis (anterolateral thigh)", "The deltoid muscle of the upper arm in all children", "The dorsogluteal muscle in the buttock for all children", "The ventrogluteal muscle at the hip for all infant patients"], "a": [0], "y": "Right: the slide gives the vastus lateralis (anterolateral thigh) as preferred for 12 months or younger. Why not the deltoid: only for children over 12 months. Why not the dorsogluteal: not a site on the slides. Why not the ventrogluteal: pictured on the starred slide but not the infant preferred site."}, {"ty": "mc", "d": 3, "q": "Which IM sites does the slide list for a child older than 12 months?", "o": ["Vastus lateralis, or the deltoid may be considered", "Dorsogluteal is the only site that the slide allows for the age", "Ventrogluteal is the only site that the slide allows for the age", "Rectus abdominis because it is a large and easy muscle to find"], "a": [0], "y": "Right: over 12 months the slide lists the vastus lateralis and says the deltoid may be considered. Why not dorsogluteal only: not a slide site. Why not ventrogluteal only: pictured, but the text names the vastus lateralis and deltoid. Why not rectus abdominis: not an injection site."}, {"ty": "num", "d": 3, "q": "A child weighs 15 kg. What is the maintenance fluid in mL/day?", "ans": 1250, "tol": 5, "unit": "mL/day", "y": "1000 + (5 x 50 = 250) = 1,250 mL/day."}, {"ty": "num", "d": 3, "q": "A child weighs 40 kg. What is the maintenance fluid in mL/day?", "ans": 1900, "tol": 5, "unit": "mL/day", "y": "1000 + 500 + (20 x 20 = 400) = 1,900 mL/day."}, {"ty": "mc", "d": 3, "q": "Which action fits atraumatic care when giving an injection?", "o": ["Use topical anesthetic and let the parent comfort the child", "Hold the child firmly and give the injection very quickly so it is over", "Tell the child that it will not hurt at all so that he relaxes", "Give the injection while the child is asleep so there is no fear"], "a": [0], "y": "Right: topical anesthetic and a parent comfort-hold reduce pain and fear, on the atraumatic medication slide. Why not firm and fast: restraint adds fear. Why not saying it will not hurt: untrue. Why not while asleep: it destroys trust."}, {"ty": "sata", "d": 3, "q": "Which are goals of atraumatic care? Select all that apply.", "o": ["Prevent or reduce separation from the family", "Promote a sense of control", "Prevent or minimize bodily injury and pain", "Decrease anxiety and fear", "Limit parents during procedures", "Make decisions for the child"], "a": [0, 1, 2, 3], "y": "Right: preventing separation, promoting control, preventing injury and pain, and decreasing anxiety and fear are core goals. Why not limiting parents: separation is a stressor. Why not deciding for the child: it removes control."}, {"ty": "mc", "d": 3, "q": "Which Tanner stage shows the first breast bud in girls?", "o": ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], "a": [0], "y": "Right: stage 2 is the breast bud with a widened areola. Why not stage 1: only the nipple is elevated. Why not stage 3: the breast and areola enlarge with the nipple flush. Why not stage 4: a secondary mound forms."}, {"ty": "mc", "d": 3, "q": "Which is the correct order of the first changes of puberty in girls?", "o": ["Breast development, then pubic hair", "Pubic hair, then breast development", "Menstruation, then breast development", "Axillary hair, then pubic hair"], "a": [0], "y": "Right: the slide lists breast development first, then pubic hair. Why not pubic hair first: breasts come first. Why not menstruation first: it is last. Why not axillary hair before pubic hair: axillary hair is third."}, {"ty": "mc", "d": 3, "q": "Why should an auscultation of the abdomen come before palpation?", "o": ["Touching the abdomen can change bowel sounds", "Palpation can only be done at the end", "Auscultation hurts less than palpation", "Bowel sounds are only heard in a sleeping child"], "a": [0], "y": "Right: touching the abdomen can change bowel sounds, so it is auscultated before palpation. Why not palpating at the end: the reason is that sounds change. Why not auscultation hurting less: pain is not the reason. Why not sleeping only: bowel sounds are heard in awake children too."}, {"ty": "ngn", "d": 3, "scen": "A 6-month-old was born at 30 weeks. His mother says he is fragile and does not let anyone hold him. At the well visit his weight is on the growth curve for his corrected age and he holds his head steady when pulled to sit.", "parts": [{"ty": "mc", "d": 3, "q": "Which interpretation is best?", "o": ["Development is on track for his corrected age", "He is delayed because he cannot sit alone at 6 months", "He is delayed because of his birth date", "He is too small to be assessed"], "a": [0], "y": "Right: at 30 weeks he was 10 weeks early, so at 6 months his corrected age is about 3.5 months, and good weight and head control fit that age. Why not delayed because he cannot sit alone: sitting alone is not expected at 3.5 months. Why not birth date: it makes him look delayed. Why not too small to assess: he is assessed on the corrected-age chart."}, {"ty": "mc", "d": 3, "q": "Which concern should the nurse note about the mother?", "o": ["Possible vulnerable child syndrome", "A diagnosis of postpartum depression", "A lack of bonding", "Good coping that needs no teaching"], "a": [0], "y": "Right: seeing the infant as fragile and not letting anyone hold him after a premature birth is overprotection, a sign of vulnerable child syndrome. Why not postpartum depression: nothing is stated. Why not lack of bonding: she is overinvolved. Why not good coping: her view limits the child."}], "y": "Corrected age and vulnerable child syndrome."}, {"ty": "mc", "d": 3, "q": "Which statement about interpreters is correct?", "o": ["Do not use children as interpreters", "Use the older sibling to interpret since he knows the family", "Speak to the interpreter and not the family", "The interpreter should explain the medical content in their own words"], "a": [0], "y": "Right: the slide says do not use children as interpreters. Why not the older sibling: a child is not an acceptable interpreter. Why not speaking to the interpreter: speak directly to the family. Why not the interpreter explaining in their own words: the interpreter is the bridge, not the content expert."}, {"ty": "mc", "d": 3, "q": "Which is the one exception where a family member may interpret?", "o": ["Sign language", "Spoken Spanish", "Written consent forms", "Emergency situations of any kind"], "a": [0], "y": "Right: sign language is the unique exception where a family member may be used. Why not spoken Spanish: a qualified interpreter is used. Why not written consent forms: the interpreter helps ensure the family can read translated materials. Why not emergencies of any kind: the slide gives no such exception."}, {"ty": "mc", "d": 3, "q": "What is a main role of the child life specialist?", "o": ["Decrease anxiety and fear during hospitalization and painful procedures", "Order pain medication before every painful procedure", "Perform the physical assessment on all newly admitted children", "Interpret the results of laboratory tests for the family"], "a": [0], "y": "Right: the speaker note says decreasing anxiety and fear during hospitalization and painful procedures is a big role. Why not ordering medication: that is a provider role. Why not the physical assessment: that is nursing. Why not lab results: not their role."}, {"ty": "sata", "d": 3, "q": "Which items belong in the functional history? Select all that apply.", "o": ["Car seat and other safety measures", "Television and gaming", "Sleep routine", "Elimination patterns", "Birth weight", "Immunization status"], "a": [0, 1, 2, 3], "y": "Right: the functional history covers safety, screen time, sleep and elimination, plus routine care, nutrition, activity, religion and sexual patterns. Why not birth weight: past health history. Why not immunizations: past health history."}, {"ty": "mc", "d": 3, "q": "A nurse is listing exam steps. Which order does the slide give?", "o": ["Observation, palpation, percussion, auscultation, with the abdomen auscultated second", "Percussion, then palpation, then auscultation, then last observation", "Auscultation of the abdomen after palpation and percussion are done", "Palpation, then observation, then percussion, then auscultation"], "a": [0], "y": "Right: the slide lists observation, palpation, percussion and auscultation, with the abdomen auscultated second. Why not percussion first: observation comes first. Why not auscultating the abdomen after palpation: touch changes the sounds. Why not palpation before observation: observation is first."}, {"ty": "mc", "d": 3, "q": "When reporting a skin lesion, which description is complete?", "o": ["Color, shape, number, location, extent, and whether it is scaly, raised, crusted or weeping", "The word rash with the date that it first began", "Only the color of the lesion and whether or not it itches", "Whether it is a macule or a papule and nothing else about it"], "a": [0], "y": "Right: the slide asks for color, shape, number, locations, extent and characteristics such as scaly, raised, crusted or weeping. Why not a rash and a date: too vague. Why not color and itch: shape, number and location are missing. Why not macule or papule alone: other details are needed."}, {"ty": "mc", "d": 3, "q": "Which finding on the oxygen saturation slide can cause a falsely normal reading in a child who looks sick?", "o": ["Carbon monoxide poisoning", "Good perfusion", "A snug probe connection", "A normal hemoglobin value"], "a": [0], "y": "Right: anemia and carbon monoxide poisoning are named as conditions that cause false readings, so a sick child can have a normal number. Why not good perfusion: it improves accuracy. Why not a snug connection: a poor connection causes errors. Why not normal hemoglobin: abnormal values cause the errors."}, {"ty": "sata", "d": 3, "q": "Which can cause a falsely low pulse oximeter reading? Select all that apply.", "o": ["Poor connection", "Poor perfusion", "Warm fingers", "A probe that is well placed"], "a": [0, 1], "y": "Right: the slide lists poor connection and poor perfusion as causes of falsely low readings. Why not warm fingers: they improve circulation. Why not a well-placed probe: a good connection gives reliable readings."}, {"ty": "mc", "d": 3, "q": "Which assessment finding belongs under the HEENT slide?", "o": ["A symmetric corneal light reflex (Hirschberg)", "A positive Babinski at 14 months", "Brisk deep tendon reflexes at 4 months", "Murmur grade 3"], "a": [0], "y": "Right: a symmetric corneal light reflex (Hirschberg) is listed under HEENT. Why not Babinski or DTRs: they are neurologic. Why not a murmur: cardiac."}, {"ty": "sata", "d": 3, "q": "Which findings go with evaluating respirations on the starred slide? Select all that apply.", "o": ["Retractions or use of accessory muscles", "Wheezing, stridor and crackles", "Dry, hacking, wet or productive cough", "Easy or labored breathing", "A thready radial pulse", "Bowel sounds in the left lower quadrant"], "a": [0, 1, 2, 3], "y": "Right: effort, retractions, abnormal sounds and cough type are the four items on the slide. Why not a thready radial pulse: circulation. Why not bowel sounds: abdominal."}, {"ty": "mc", "d": 3, "q": "A parent asks why infants breathe mostly with their bellies. What is the best answer?", "o": ["Infants use diaphragmatic breathing, and thoracic movement appears after 1 year", "Infants breathe with the chest muscles first and the belly after", "Belly breathing in an infant is a sign of underlying lung disease", "Thoracic breathing is present from the first moment after birth"], "a": [0], "y": "Right: the slide says infant breathing is diaphragmatic and thoracic movement begins after 1 year. Why not chest muscles first: the diaphragm leads. Why not lung disease: it is normal. Why not thoracic from birth: that comes later."}, {"ty": "mc", "d": 3, "q": "Which statement about topical medications in infants is correct?", "o": ["They are absorbed more quickly because of higher body surface area and skin permeability", "Absorbed more slowly than in adults because the skin is thin", "Not absorbed through the skin of an infant to any great degree", "Absorbed at exactly the same rate that adults absorb them"], "a": [0], "y": "Right: the slide says topical absorption is increased in infants because of higher body surface area and increased permeability. Why not slower: it is faster. Why not not absorbed: infants absorb readily. Why not the same: it is higher than in adults."}, {"ty": "mc", "d": 3, "q": "Which describes pharmacokinetics?", "o": ["How the body moves a drug through absorption, distribution, metabolism and excretion", "What the drug does to the cells and the tissues of the body", "How a child's genetics change the color and taste of the drug", "How the nurse calculates the BSA to get a child's dose"], "a": [0], "y": "Right: pharmacokinetics is how the body moves a drug through absorption, distribution, metabolism and excretion. Why not what the drug does to cells: that is pharmacodynamics. Why not genetics changing color: unrelated. Why not BSA calculation: that is a dosing method."}, {"ty": "mc", "d": 3, "q": "Which statement about oral liquid medications is correct?", "o": ["Give it slowly in small amounts and allow time to swallow between amounts", "All at once so that none of the dose is lost or wasted", "While the child lies flat on the back so it stays down", "Mixed into a full bottle of formula for the child to finish"], "a": [0], "y": "Right: the starred note says to give oral liquids slowly in small amounts so the child can swallow between amounts. Why not all at once: choking and aspiration risk. Why not lying flat: aspiration risk. Why not a full bottle of formula: bitter medicine is not mixed with formula."}, {"ty": "mc", "d": 3, "q": "Which action is correct when giving eye drops?", "o": ["Hold the dropper 2.5 cm (1 inch) from the eye and have the child look up and to the side", "Dropper resting on the eyelashes while the child looks down", "Dropper held 10 cm away while the child keeps the eyes closed", "Dropper touching the cornea so that the drop will not fall wide"], "a": [0], "y": "Right: the slide says to hold the medication 2.5 cm (1 inch) from the eye and have the child look up and to the side. Why not resting on the lashes: the dropper should stay clear. Why not 10 cm with eyes closed: the drop would miss. Why not touching the cornea: it can injure the eye."}, {"ty": "mc", "d": 3, "q": "A child 3 years old or younger is getting eye drops. What does the slide add?", "o": ["Get an additional adult to keep the child's arms and fingers away", "Give the drops while the child is asleep and cannot resist", "Restrain the child alone with a blanket wrapped around the body", "Skip the second drop to save time and lower the child's fear"], "a": [0], "y": "Right: for children 3 and younger the slide says to get an additional adult to keep the arms and fingers away. Why not sleeping: not on the slide. Why not restraining alone: help is needed. Why not skipping the second drop: the ordered dose is still needed."}, {"ty": "mc", "d": 3, "q": "What is the correct position after nose drops?", "o": ["Supine with the head hyperextended for at least a minute", "Sitting upright for about ten seconds after the drops go in", "Prone with the head turned to one side so the drops drain", "Lying flat with the head tilted forward onto the chest"], "a": [0], "y": "Right: the slide says supine with the head hyperextended, held at least a minute. Why not upright for 10 seconds: the drops drain. Why not prone: the head is not hyperextended. Why not head forward: the drops run out."}, {"ty": "mc", "d": 3, "q": "Which vaccine is given by the subcutaneous route?", "o": ["MMR", "Tuberculosis screening test", "Allergy skin test", "A test dose of insulin by the intradermal route"], "a": [0], "y": "Right: the red note says the MMR vaccine is subcutaneous. Why not TB screening or allergy tests: they are intradermal, just under the epidermis. Why not insulin intradermal: insulin is given subcutaneously."}, {"ty": "mc", "d": 3, "q": "A nurse is starting an IV on a child. Which action follows the slides?", "o": ["Make only two attempts and then seek additional help", "Keep trying until the vein is found", "Use the upper arm vein first", "Tape the line firmly with several layers"], "a": [0], "y": "Right: the slide says to make only two attempts and then seek help. Why not continuing: it adds trauma. Why not the upper arm: select the hand over the wrist or upper arm. Why not several layers of tape: use a minimal amount of tape."}, {"ty": "mc", "d": 3, "q": "Which action confirms nasogastric tube placement without an x-ray?", "o": ["Check the color and pH of the aspirate and the external tube length", "Listening for gurgling over the stomach as air is pushed in", "Asking the child whether the tube feels like it is in place", "Flushing with water and watching for any coughing afterward"], "a": [0], "y": "Right: the slide lists aspirate color and pH (gastric 1.5-4, respiratory above 7) and the external tube length. Why not gurgling alone: unreliable. Why not asking the child: he cannot confirm. Why not coughing alone: it signals a problem but does not confirm placement."}, {"ty": "mc", "d": 3, "q": "A nurse is giving medications through a gastrostomy tube. Which action is correct?", "o": ["Do not crush capsules, and flush the tube after each medication", "Crush capsules finely and mix them with the child's formula", "Skip the flush so that the child gets less fluid overall", "Verify the placement only once a day, at the morning feeding"], "a": [0], "y": "Right: the slides say not to crush capsules and to flush the tube after each medication. Why not crushing capsules and mixing with formula: both are wrong. Why not skipping the flush: it clogs the tube. Why not verifying once a day: placement is confirmed before use."}, {"ty": "mc", "d": 3, "q": "Which measure reduces complications in a child receiving TPN?", "o": ["Monitor blood glucose and laboratory tests as ordered", "Open the system often to keep it clean", "Use a regular dressing so the site can breathe", "Check intake and output only once a day"], "a": [0], "y": "Right: the slide says to monitor blood glucose and labs. Why not opening the system: it must stay closed. Why not a regular dressing: occlusive dressings are used. Why not once-a-day intake and output: they are assessed frequently."}, {"ty": "mc", "d": 3, "q": "Which long-term risks does the starred slide list for a premature infant?", "o": ["Cerebral palsy, visual impairment and chronic lung disease", "Hearing improvement and stronger lungs than the term infant", "Early puberty and increased bone density in the school years", "Advanced cognition and faster growth than other children"], "a": [0], "y": "Right: cerebral palsy, visual impairment and chronic lung disease are on the starred list. Why not improvements: they are risks. Why not early puberty or bone density: not listed. Why not advanced cognition: cognitive delays are a risk."}, {"ty": "mc", "d": 3, "q": "Which statement about nursing the dying child is correct?", "o": ["Reassure the family that they will not be abandoned", "Limit family time to protect the child", "Avoid religious topics to stay neutral", "Stop pain medication to keep the child alert"], "a": [0], "y": "Right: the starred slide says to help ensure the family they will not be abandoned. Why not limiting family time: presence is part of care. Why not avoiding religion: spiritual background is respected. Why not stopping pain medication: pain management is a goal."}, {"ty": "mc", "d": 3, "q": "Which statement is correct about the family in caring for the dying child?", "o": ["The process is family-centered and multidisciplinary", "The process belongs only to the provider", "The process excludes siblings", "The process begins after death"], "a": [0], "y": "Right: the slide says it is a family-centered, multidisciplinary process. Why not only the provider: many disciplines take part. Why not excluding siblings: the family includes them. Why not starting after death: care begins during the illness."}, {"ty": "mc", "d": 3, "q": "Which sequence lists the Tanner changes in boys as shown on the slide?", "o": ["Testicular enlargement, pubic hair, penis length, axillary hair, facial hair, vocal changes", "Facial hair, vocal changes, testicular enlargement, then pubic hair", "Penis length, testicular enlargement, vocal changes, facial hair", "Axillary hair, pubic hair, testicular enlargement, vocal changes"], "a": [0], "y": "Right: the slide lists testicular enlargement, pubic hair, penis length, axillary hair, facial hair and vocal changes. Why not facial hair first: it comes later. Why not penis length first: testicular enlargement is first. Why not axillary hair first: it follows penis length."}, {"ty": "mc", "d": 3, "q": "A boy has a penis that is longer but not wider, with darker pubic hair and a growth spurt. Which stage is this?", "o": ["Stage 3", "Stage 2", "Stage 4", "Stage 5"], "a": [0], "y": "Right: stage 3 is length without width. Why not stage 2: scrotal reddening and testicular growth. Why not stage 4: wider and longer with thick hair, voice change and facial hair. Why not stage 5: adult genitalia."}, {"ty": "mc", "d": 3, "q": "A teen boy has a deepening voice, early facial hair, and a penis that has widened and lengthened. Which stage is this?", "o": ["Stage 4", "Stage 3", "Stage 2", "Stage 5"], "a": [0], "y": "Right: width plus length with voice change and facial hair is stage 4. Why not stage 3: length only. Why not stage 2: scrotum and testes only. Why not stage 5: adult genitalia."}, {"ty": "mc", "d": 3, "q": "Which description matches Tanner stage 2 in boys?", "o": ["Scrotal reddening and testicular enlargement with thin, light pubic hair", "The penis lengthens and the growth spurt is beginning now", "The penis widens and the voice has started to deepen already", "Adult genitalia with full pubic hair and body hair present"], "a": [0], "y": "Right: stage 2 is scrotal reddening and testicular enlargement with thin light hair. Why not lengthening: stage 3. Why not widening and deeper voice: stage 4. Why not adult genitalia: stage 5."}, {"ty": "mc", "d": 3, "q": "Which arm is preferred for an infant's blood pressure when the leg cannot be used?", "o": ["Right upper arm", "Left upper arm", "Either arm", "Neither arm"], "a": [0], "y": "Right: the right upper arm is preferred because the left gives false readings. Why not the left: false readings. Why not either: not equal. Why not neither: the right arm is acceptable."}, {"ty": "num", "d": 3, "q": "A child weighs 30 kg. What is the maintenance fluid in mL per day?", "ans": 1700, "tol": 1, "unit": "mL per day", "y": "1,500 + 20 x (30 - 20) = 1,700 mL per day."}, {"ty": "num", "d": 3, "q": "A child weighs 12 kg. What is the maintenance fluid in mL per hour? Round to the nearest tenth.", "ans": 45.8, "tol": 0.2, "unit": "mL per hour", "y": "1,000 + 50 x 2 = 1,100 mL per day. 1,100 / 24 = 45.8 mL per hour."}, {"ty": "num", "d": 3, "q": "A child weighs 6 kg. What is the maintenance fluid in mL per day?", "ans": 600, "tol": 1, "unit": "mL per day", "y": "Under 10 kg: 100 x 6 = 600 mL per day."}, {"ty": "num", "d": 3, "q": "The order is 30 mg/kg/day divided every 6 hours for a child who weighs 20 kg. How many mg per dose?", "ans": 150, "tol": 0.5, "unit": "mg per dose", "y": "30 x 20 = 600 mg per day. Every 6 hours is 4 doses. 600 / 4 = 150 mg per dose."}, {"ty": "num", "d": 3, "q": "A child who weighs 25 kg receives 300 mg every 8 hours. How many mg/kg/day is this?", "ans": 36, "tol": 0.5, "unit": "mg/kg/day", "y": "300 x 3 = 900 mg per day. 900 / 25 = 36 mg/kg/day."}, {"ty": "mc", "d": 3, "q": "A child weighs 40 kg. Which fluid formula applies?", "o": ["1,500 + 20 x (40 - 20)", "100 x 40, using the whole weight", "1,000 + 50 x (40 - 10)", "1,500 + 20 x 40"], "a": [0], "y": "Right: over 20 kg uses 1,500 plus 20 for each kg above 20, so 1,500 + 400 = 1,900 mL per day. Why not 100 x 40: only the first 10 kg get 100. Why not the 1,000 formula: that is for 10 to 20 kg. Why not 1,500 + 20 x 40: that adds 20 for all 40 kg, not only the 20 above 20."}, {"ty": "mc", "d": 3, "q": "The order is 10 mg/kg/day in 2 doses for a child who weighs 11 kg. The nurse is about to give 110 mg. What is correct?", "o": ["The nurse should give 55 mg, since 110 mg is the daily total", "The nurse should give 110 mg, since it is the order multiplied by weight", "The nurse should give 220 mg, since each dose is 10 x 11 x 2", "The nurse should give 10 mg, since the order is 10 mg per dose"], "a": [0], "y": "Right: 10 x 11 = 110 mg per day, then 110 / 2 = 55 mg per dose. Why not 110: that is the whole day. Why not 220: multiplying by doses makes the total larger instead of splitting it. Why not 10: the order is per kg per day, not per dose."}, {"ty": "mc", "d": 3, "q": "A child who weighs 15 kg receives 100 mg every 12 hours. The safe range is 10 to 20 mg/kg/day. Is it safe?", "o": ["Yes, 200 mg per day is 13.3 mg/kg/day, inside the range", "No, 100 mg is more than the 20 mg limit", "No, 200 mg per day is more than 20 mg", "No, 100 mg x 15 kg = 1,500 mg, which is far above the range"], "a": [0], "y": "Right: 100 x 2 = 200 mg per day and 200 / 15 = 13.3 mg/kg/day, inside 10 to 20. Why not the 20 mg limit: the limit is per kg. Why not 20 mg for the day: 20 is per kg, so the daily limit is 300 mg. Why not 100 x 15: the dose is already in mg, so multiplying by kg treats it as mg per kg."}, {"ty": "sata", "d": 3, "q": "Which are correct for finding mg/kg/day from a dose? Select all that apply.", "o": ["Multiply the dose by the number of doses per day", "Divide the daily total by the weight in kg", "Convert pounds to kg before dividing", "Divide the dose by 24", "Multiply the daily total by the weight"], "a": [0, 1, 2], "y": "Right: dose x doses gives mg per day, then dividing by kg gives mg/kg/day, and pounds must be kg first. Why not dividing by 24: that is for hourly fluids. Why not multiplying the total by weight: that makes the units mg x kg, not mg per kg."}, {"ty": "mc", "d": 3, "q": "A nurse is giving an oral liquid antibiotic to a 5-month-old. Which technique is correct?", "o": ["Use an oral syringe with the tip in the side of the mouth along the cheek, a little at a time", "Place the syringe tip at the back
