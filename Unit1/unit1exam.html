<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUR 243 Exam 1 Study Guide</title>
<style>
:root{--bg:#0b1f1d;--card:#12302d;--card2:#17403b;--tx:#e6f4f1;--mut:#9cc3bd;--ac:#2dd4bf;--ac2:#fbbf24;--red:#ff7b7b;--ln:#24524c;--hl:#6b5a00;--hlt:#fff3b0;--ok:#34d399;--bad:#f87171;--font:Georgia,'Times New Roman',serif}
body[data-th=plum]{--bg:#1b1026;--card:#2a1a3a;--card2:#372350;--tx:#f1e8fa;--mut:#bba5d3;--ac:#c084fc;--ac2:#fbbf24;--ln:#4a3366;--hl:#6b5a00}
body[data-th=paper]{--bg:#f6f1e7;--card:#fffdf8;--card2:#efe7d6;--tx:#2a2620;--mut:#6b6254;--ac:#0f766e;--ac2:#b45309;--red:#c0262d;--ln:#d9cfb8;--hl:#fde68a;--hlt:#3b2f00;--ok:#047857;--bad:#b91c1c}
body[data-th=ocean]{--bg:#0a1626;--card:#10253d;--card2:#17355a;--tx:#e5f0fb;--mut:#9db8d4;--ac:#38bdf8;--ln:#24476e}
body[data-f=sans]{--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body[data-f=lora]{--font:Lora,Georgia,serif}
body[data-f=read]{--font:Verdana,Trebuchet MS,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:16px;line-height:1.55;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 10px}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;flex:1 1 100%;color:var(--ac)}
input,select,textarea,button{font:inherit;color:var(--tx)}
#q{flex:1 1 120px;min-width:0;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
select{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:5px;max-width:48%}
button{background:var(--card2);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--ac);color:#04201d;border-color:var(--ac);font-weight:700}
button:disabled{opacity:.5}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
nav button{white-space:nowrap;flex:0 0 auto}
nav button.on{background:var(--ac);color:#04201d;border-color:var(--ac);font-weight:700}
main{max-width:900px;margin:0 auto;padding:12px 10px 90px}
h2{color:var(--ac);margin:4px 0 2px;font-size:22px}
.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
section.sec{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:12px 0}
section.sec>h3{margin:0 0 6px;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
section.sec>h3 .rd{margin-left:auto;font-size:12px;padding:3px 8px}
.st{color:var(--ac2)}
mark.blue{background:#0e7490;color:#e6fbff}
mark{background:var(--hl);color:var(--hlt);padding:0 2px;border-radius:3px}
b.red{color:var(--red)}
.nb{white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--ln);padding:5px 7px;text-align:left;vertical-align:top;overflow-wrap:normal;word-break:normal;hyphens:manual}
th{background:var(--card2)}
td.plus{background:rgba(45,212,191,.08)}
ul{padding-left:20px;margin:6px 0}
li{margin:3px 0;overflow-wrap:break-word;word-break:normal}
li.star::marker{color:var(--ac2)}
li.plus{list-style:"+ ";color:var(--tx)}
.note{border-left:4px solid var(--ac);background:var(--card2);padding:6px 10px;margin:8px 0;border-radius:0 8px 8px 0;font-size:14px}
.note.star{border-color:var(--ac2)}
.note.fill{border-color:var(--red);border-style:dashed}
.note::before{font-weight:700;margin-right:6px}
.note.anno::before{content:"Annotation:";color:var(--ac)}
.note.star::before{content:"\2605 Starred:";color:var(--ac2)}
.note.fill::before{content:"Confirm with lecture:";color:var(--red)}
.ex{background:var(--card2);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.cold,.trap{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:12px 0}
.cold h3{color:var(--ac2);margin:0 0 4px}.trap h3{color:var(--red);margin:0 0 4px}
.q{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:10px 0}
.q .qt{font-weight:700;margin-bottom:6px}
.q label{display:block;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;margin:4px 0;cursor:pointer;overflow-wrap:break-word;word-break:normal}
.q label.ok{border-color:var(--ok);background:rgba(52,211,153,.15)}
.q label.no{border-color:var(--bad);background:rgba(248,113,113,.15)}
.q label.miss{border-color:var(--ok);border-style:dashed}
.why{margin-top:6px;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--card2)}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:20px;padding:0 6px;color:var(--mut);margin-left:6px}
.tag.h{color:var(--red);border-color:var(--red)}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.chip{display:inline-block;padding:3px 8px;margin:3px;border:1px solid var(--ln);border-radius:16px;background:var(--card2);cursor:pointer;overflow-wrap:break-word;word-break:normal}
.chip.sel{background:var(--ac);color:#04201d}
.chip.done{opacity:.55}
.game{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.game button{min-height:44px;min-width:0;overflow-wrap:break-word;word-break:normal;hyphens:manual}
.game button.sel{outline:2px solid var(--ac2)}
.game button.gone{visibility:hidden}
textarea{width:100%;min-height:200px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px}
input[type=number],input[type=text].num{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px;width:120px}
#reader{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--ac);border-radius:30px;padding:5px 10px;display:none;gap:6px;z-index:30;max-width:96vw}
#reader.on{display:flex}
.hit{padding:8px;border:1px solid var(--ln);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--card)}
.legend span{margin-right:10px;white-space:nowrap}
@media(max-width:480px){h2{font-size:19px}th,td{padding:4px 5px;font-size:12.5px}}
</style></head>

<script>
const D={"tabs": [{"id": "star", "icon": "⭐", "title": "Quiz flags and stars", "sub": "Every star, highlight and speaker note from the four decks plus what she told you to star in lecture. Start here before the exam.", "sections": [{"h": "Slides she starred", "star": true, "blocks": [{"t": "tbl", "head": ["Chapter", "Slides with a star on them"], "rows": [["**Ch 8**", "Principles of atraumatic care. Role of child life specialists. Focus of family-centered care. Working with an interpreter. Cone of learning"], ["**Ch 10**", "Role of the nurse. Functional history. Review of systems. Order of physical exam. Reporting skin variations. HEENT. Tympanic temperature. Evaluating respirations. Oxygen saturation errors. Grading heart murmurs. Tanner breast development. Tanner female pubic hair"], ["**Ch 12**", "Impact on the child. Vulnerable child syndrome risks. Families. Home care for the technology-dependent child. Long-term risks for the premature infant. End-of-life orders. Nursing management of the dying child"], ["**Ch 13**", "Pharmacodynamics vs pharmacokinetics. Topical absorption. Oral medication forms. Other forms of medication. Eye drops. Nose drops. IM injection sites and the preferred site. Atraumatic care with medication. IV therapy (second slide). IV fluid calculation. Nutritional support. Enteral tube care. G-tube medications. TPN complications"]]}]}, {"h": "Highlights by color", "star": true, "blocks": [{"t": "tbl", "head": ["Color", "What was highlighted"], "rows": [["==Yellow==", "Interpreter sign language exception. Education and support, and referral for resources (nursing management). Kidney immaturity, longer half-life and toxicity. Oral liquid medication given slowly. Topical absorbed the quickest, creams, ointments, lotions, drops. Muscle development and fluid amount decide the IM site. SQ and ID definitions. Rule of thumb: smallest IV gauge. Encourage parental participation (therapeutic hugging). TPN definition. Aspirate color and pH. Do not crush capsules. TPN occlusive dressing and blood glucose. Functional history. Radial pulse hard under 2 and apical for a full minute. Fontanel facts. Earlobe back and down under 3. Infant diaphragmatic breathing and thoracic after 1. Newborn swollen nipples"], ["~~Blue~~", "SQ and ID uses (insulin, heparin, immunizations, TB screening, allergy testing). Supernumerary nipples"], ["!!Red!!", "MMR vaccine is SUB Q. Infants and toddlers: examine on the caretaker's lap, let the child touch equipment, invasive parts last"], ["==Teal==", "Adolescents are particularly sensitive about body image and control"]]}]}, {"h": "Fluid formulas: pick by weight (she is focusing on these)", "star": true, "blocks": [{"t": "tbl", "head": ["Weight", "Daily fluid (mL per day)", "How it is built"], "rows": [["★ **Under 10 kg**", "**100 x kg**", "Only the first band is used, 100 mL for every kg"], ["★ **10 to 20 kg**", "**1,000 + 50 x (kg - 10)**", "The full first band (1,000) plus 50 mL for each kg above 10"], ["★ **Over 20 kg**", "**1,500 + 20 x (kg - 20)**", "The first two bands in full (1,000 + 500) plus 20 mL for each kg above 20"]]}, {"t": "ul", "items": ["★ Per hour = daily total / 24. Pounds / 2.2 = kg", "★ Weigh in kg first, then pick the band"]}]}, {"h": "mg/kg/day both ways (she is focusing on these)", "star": true, "blocks": [{"t": "tbl", "head": ["You are given", "You need", "Steps"], "rows": [["★ mg/kg/day, weight, doses per day", "mg per dose", "mg/kg/day x kg = mg per day. Then divide by doses per day"], ["★ mg per dose, doses per day, weight", "mg/kg/day", "mg per dose x doses per day = mg per day. Then divide by kg"], ["★ mg/kg/dose and weight", "mg per dose", "mg/kg/dose x kg. No dividing by doses"], ["★ Safe range in mg/kg/day, weight, the ordered dose", "Is the order safe", "Range x kg gives the lowest and highest safe mg per day. Ordered mg per dose x doses per day. Compare the two"], ["★ mg per dose and the concentration in mg per mL", "mL to give", "mg per dose divided by mg per mL"], ["Weight in pounds", "Weight in kg", "Pounds divided by 2.2. Do this first, before any other step"]]}, {"t": "tbl", "head": ["Order says", "Doses per day"], "rows": [["**Once daily, daily, every 24 hours**", "1"], ["**BID, every 12 hours**", "2"], ["**TID, every 8 hours**", "3"], ["**QID, every 6 hours**", "4"], ["**Every 4 hours**", "6"]]}]}, {"h": "Her review-session questions, answered", "star": true, "blocks": [{"t": "tbl", "head": ["She asked", "Answer", "Why"], "rows": [["★ How do you give a medication to an infant by mouth", "**Oral syringe**, a small amount at a time, aimed at the **side of the mouth along the inner cheek**", "The back of the mouth triggers gagging and choking, the front lets the tongue push the drug out, and small amounts give the baby time to swallow"], ["★ True or false: adult learners are problem focused", "**True**", "Adults (Knowles) learn to solve a need they have now, so start with the problem and how the teaching fixes it"], ["★ Which murmur is quiet and soft and heard every time the chest is auscultated", "**Grade 2**", "Grade 1 is barely audible and not heard every time. Grade 3 is intermediate and louder"], ["★ What can the nurse do if a form of medication does not work for the child", "**Call the pharmacy** for another form, such as a liquid or a slurry. Never hide it in formula", "The problem is the form, not the dose. The pharmacy knows what is available, and formula taints a feeding the child needs"], ["★ How does the nurse communicate with a school-age child", "Speak **directly to the child** and answer the child's questions directly", "School-age children are working on industry and want control. Talking only to the parent leaves them out"], ["★ Dental health in a newborn", "**Gently wipe the gums** after feedings. **Never put the baby to bed with a bottle**. Brush when the first tooth erupts", "Milk pooling around the gums and new teeth feeds bacteria, and wiping removes it"], ["★ What is TPN made of", "A **highly concentrated solution of carbohydrates, electrolytes, vitamins and minerals**, given through a **central line**", "It is too concentrated for a small peripheral vein, and it is used when the GI tract does not work"], ["★ What do you monitor when giving TPN", "**Vital signs, the insertion site, blood glucose, labs (fluids and electrolytes), intake and output**, plus a closed system, aseptic technique and an occlusive dressing", "A concentrated sugar and electrolyte load can change glucose and electrolytes fast, and a central line is a direct route for infection"], ["★ How are murmurs graded", "**Grade 1 to 6 by intensity and loudness**: 1 barely audible, 2 quiet and heard every time, 3 intermediate, 4 palpable thrill, 5 edge of the stethoscope lifted, 6 stethoscope near but not touching the chest", "The grade rises with how loud the murmur is and how easy it is to hear or feel. It is not graded by pitch"], ["★ What causes a false oxygen saturation reading", "**Anemia, carbon monoxide poisoning, abnormal hemoglobin values, poor perfusion, ambient light, poor connection**", "The oximeter reads light through the finger. Anything that changes the blood, the blood flow, the light or the contact changes the number"], ["★ What is pharmacodynamics", "What the **drug does to the body**: its biochemical, physiological and molecular effects", "Dynamics means action. Pharmacodynamics is the drug acting on the body, while pharmacokinetics is the body moving the drug"], ["★ A mom says to keep her child's head back for 5 minutes after nose drops", "**Wrong.** Keep the head hyperextended for **1 minute**", "A minute lets the drops reach the nasal tissue. Five minutes is not the rule and a child will not hold the position"], ["★ What is pharmacokinetics", "How the **body handles the drug**: absorption, distribution, metabolism, excretion", "Kinetics means movement. The drug moves through the body. Pharmacodynamics is what the drug does to the body"], ["★ Tanner stage for a boy: penis wider and longer, scrotum darkens, pubic hair not yet on the thighs", "**Stage 4**", "Stage 3 only lengthens the penis. Stage 5 is adult size with hair onto the thighs"]]}, {"t": "note", "k": "star", "x": "Recorded review (the audio started late and was rough): the Tanner answer was debated between 3 and 4. Your Chapter 10 slide and lecture say wider AND longer is stage 4."}]}, {"h": "TPN: what it is made of and what to monitor", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ **Made of:** a highly concentrated solution of **carbohydrates, electrolytes, vitamins and minerals**", "Complete nutrition when the gut cannot be used. Added: in practice it also carries amino acids and lipids"], ["★ Given by **central line**", "The solution is too concentrated for a peripheral vein"], ["★ Monitor **vital signs** closely", "Fever or a fast pulse can be the first sign of infection or fluid overload"], ["★ **Strict aseptic technique** and a **closed system**", "A central line is a direct route into the blood"], ["★ **Occlusive dressing**, check the insertion site at dressing changes", "Keeps germs out and shows redness or drainage early"], ["★ Follow policy for **flushing** and keeping the catheter patent (sterile water, 10 mL per shift)", "A blocked line stops the feeding and raises infection risk"], ["★ Assess **intake and output** often", "Shows fluid balance and whether the child is getting too much or too little"], ["★ Monitor **blood glucose** and obtain **labs** for fluid and electrolyte changes", "The sugar load can cause high glucose, and the electrolytes can shift"]]}, {"t": "note", "k": "star", "x": "Starred slide: measures to reduce TPN complications. Lecture: she asked what TPN is made of."}]}, {"h": "Murmur grades 1 to 6", "star": true, "blocks": [{"t": "tbl", "head": ["Grade", "What you hear or feel"], "rows": [["★ **1**", "Barely audible, not heard every time"], ["★ **2**", "Quiet and soft, heard every time the chest is auscultated"], ["★ **3**", "Intermediate loudness"], ["★ **4**", "Palpable thrill"], ["★ **5**", "Loud. Heard with the edge of the stethoscope lifted off the chest"], ["★ **6**", "Very loud. Heard with the stethoscope near but not touching the chest"]]}]}, {"h": "Oxygen saturation: what causes a false reading", "star": true, "blocks": [{"t": "tbl", "head": ["Cause", "What happens"], "rows": [["★ **Anemia**", "Less hemoglobin to carry oxygen, so the child can be low on oxygen with a normal-looking number"], ["★ **Carbon monoxide poisoning**", "CO sits on hemoglobin in place of oxygen, so the monitor reads high while the child is hypoxic"], ["★ **Abnormal hemoglobin values**", "False reading"], ["★ **Poor perfusion**", "Falsely low reading"], ["★ **Ambient light interference**", "False reading"], ["★ **Poor connection** (loose probe, nail polish)", "Falsely low reading"]]}, {"t": "note", "k": "star", "x": "Starred slide, page 270. Lecture: she said it is very important."}]}, {"h": "Giving nose drops to a child", "star": true, "blocks": [{"t": "ul", "items": ["★ Medication at **room temperature**", "★ Have the child **blow the nose first**, or use a bulb syringe", "★ Position **supine with the head hyperextended**. A pillow or folded towel helps", "★ **Do not touch the nares** with the dropper or spray", "★ Keep the head hyperextended for **1 minute**. If a parent says to keep it back 5 minutes, that is wrong", "+ Hyperextended means the head tipped back so the drops run toward the back of the nose and stay there instead of draining out the front"]}, {"t": "note", "k": "star", "x": "Slide page 359 says at least a minute. In her review the answer was 1 minute, and 5 minutes was the wrong parent statement. If a choice says 1 minute, pick it over 5."}]}, {"h": "Giving an oral liquid to an infant", "star": true, "blocks": [{"t": "ul", "items": ["★ Hold the infant **semi-upright**, not flat", "★ Use an **oral syringe** with no needle", "★ Place the tip in the **side of the mouth along the inner cheek**", "★ Give **small amounts slowly** and let the baby swallow between squirts", "★ **Never mix** the drug in a full bottle or in essential food", "+ If the baby coughs or chokes, stop. Lying flat and squirting to the back both raise the risk of aspiration"]}]}, {"h": "Newborn and infant dental care", "star": true, "blocks": [{"t": "ul", "items": ["★ **Wipe the gums** with a clean, soft, damp cloth or gauze after feedings", "★ **Never put the baby to bed with a bottle** of milk, formula or juice", "★ **Begin brushing when the first tooth erupts**", "+ Use a soft infant toothbrush and a smear of fluoride toothpaste the size of a grain of rice once a tooth appears", "+ Pooled milk or juice around teeth causes early childhood caries, also called baby bottle tooth decay"]}]}, {"h": "Why: vitals and growth", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Infant BP on the **right arm**, never the left", "The left arm can read falsely low if there is a heart defect (coarctation of the aorta). The right arm is reliable."], ["★ Lateral tibialis (lower leg) for infant BP", "The leg is easy to reach in a squirmy infant."], ["★ Infant apical pulse, full minute", "The infant heart rate varies and the radial pulse is too small to feel well."], ["★ Pulse and respirations fall, BP rises with age", "The heart and lungs grow stronger, so fewer beats and breaths are needed."], ["★ Newborn pulse 120-160", "Each beat is small, so the heart has to beat fast."], ["★ Weight doubles at 4-6 months, triples at 1 year", "The first year is the fastest growth, then it slows and appetite drops."], ["Children stay near one percentile", "A big drop means growth fell off its curve, so look for a problem."], ["★ Fontanels", "They let the skull mold and the brain grow. Posterior closes by 2 months, anterior at 12-18 months. An open posterior at 6 months needs follow-up."]]}]}, {"h": "Why: reflexes, newborn skin and feeding", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Primitive reflexes fade", "The brain matures and voluntary control takes over. One that stays means a neurologic problem."], ["★ Rooting and sucking", "They help the baby find food and feed."], ["★ Palmar grasp", "It is the first step to a purposeful grasp, so it fades at 4-6 months."], ["★ Asymmetric tonic neck", "It builds eye-hand coordination and fades by 4-6 months."], ["Moro (startle)", "A protective startle that fades by about 4 months. One-sided Moro suggests injury."], ["Babinski", "The toes fan because the nerve pathways are not mature yet. By 12-24 months the toes curl down."], ["Parachute and neck righting", "They protect the child from falls and keep the head in line, which is needed for sitting and walking."], ["★ Acrocyanosis is normal", "A newborn's circulation to the hands and feet is immature. Blue lips or tongue is not normal."]]}]}, {"h": "Why: infant feeding and safety", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Rice cereal first at 4-6 months", "It is iron-fortified, easy to digest and rarely causes allergy."], ["★ One new food every 5 days", "An allergy can take days to show, so you know which food caused it."], ["★ Vitamin D from the first week", "Breast milk has little vitamin D and bones need it."], ["★ Iron at 4 months if exclusively breastfed", "Stores from birth run out and breast milk is low in iron."], ["Breastfeed every 3-4 hours, no night bottles", "A bottle replaces a feeding, so the breast makes less milk."], ["Honey only after 12 months", "It can cause infant botulism."], ["Never prop a bottle", "The baby can aspirate and get tooth decay."], ["Back to sleep, bare crib", "Back sleeping lowers SIDS. Soft items can smother the baby."], ["Water heater at 120 F", "Infant skin is thin and burns fast."], ["★ Walkers delay development", "The baby does not learn balance and weight bearing, and can fall down stairs."], ["★ Premature babies use adjusted age", "Development follows time since conception, so birth age would wrongly look delayed."]]}]}, {"h": "Why: Erikson stage for each age group", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ !!Trust vs Mistrust!! (infant)", "The infant depends on caregivers. Consistent care teaches the world is safe."], ["★ !!Autonomy vs Shame and Doubt!! (toddler)", "The toddler can walk and talk, so wants to do things alone. Negativism and ritualism give a sense of control."], ["★ !!Initiative vs Guilt!! (preschool)", "The child can plan and imagine, so takes on adult tasks and feels guilty when overstepping limits."], ["★ !!Industry vs Inferiority!! (school age)", "The child learns skills at school. Success builds confidence, and not mastering every skill is normal."], ["★ !!Identity vs Role Confusion!! (adolescent)", "Body changes and abstract thinking make the teen ask 'Who am I?'."]]}]}, {"h": "Why: toddler", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Parallel play", "Toddlers are egocentric with little language, so they play beside, not with, others."], ["★ Telegraphic speech", "Vocabulary grows faster than grammar, so only key words are used."], ["★ Time-out 1 minute per year", "A toddler's attention span is short."], ["★ Rear-facing as long as possible", "The head is heavy and the neck is weak, and the seat supports them in a crash."], ["★ Back seat only", "The front air bag can injure a child."], ["★ Let the child choose from food options", "Choice meets the need for autonomy and avoids power struggles."], ["Limit juice and milk", "They fill the stomach. Too much milk crowds out iron foods and can cause anemia."], ["★ Sleep 10-12 hours", "Growth and rest. Bedtime resistance is part of autonomy."], ["Toilet training readiness", "The nerves must be mature, shown by staying dry 3-4 hours."], ["Choking foods", "Small airways and poor chewing. Round, firm foods block the airway."], ["Start safety teaching before the toddler stage", "Toddlers move and explore but cannot judge danger."]]}]}, {"h": "Why: preschool", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Night terror vs nightmare", "A night terror comes from deep sleep, so the child is confused and remembers nothing. A nightmare wakes the child, who can tell you the dream."], ["★ Diaphragmatic breathing", "Preschoolers breathe with the belly. It is normal unless retractions, flaring or grunting appear."], ["★ Magical thinking", "The child cannot separate wishes from reality, so needs supervision."], ["Stuttering normal until 5-6", "Thoughts come faster than the speech muscles can keep up."], ["★ White beans and other calcium foods", "Calcium builds bone."], ["Offer no more than 2 choices", "It gives control without overwhelming the child."], ["Booster until 145 cm or 8-12 years", "Adult belts sit on the neck and belly of a short child."], ["Screen time 1-2 hours", "More time replaces play and sleep."]]}]}, {"h": "Why: school age", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Squinting means vision impairment", "School reading shows poor vision. Refer for an exam."], ["★ Calcium 800-1,000 mg (4-8), 1,300 mg (9-12)", "Bones are being built, and needs rise as growth speeds up."], ["★ Peers matter more than parents", "The child is separating from the family and wants to belong."], ["★ Continuous peer relationships have the most impact", "Daily contact shapes behavior and attitudes."], ["Limit screens to 2 hours", "More time lowers activity and raises obesity risk."], ["Latchkey and 3-6 pm accidents", "Children are unsupervised after school."], ["School refusal", "Stomachaches only on school days often mean anxiety or bullying."], ["★ HPV: 2 doses before age 15, 3 doses at 15 or older", "Younger children respond more strongly, so fewer doses work."]]}]}, {"h": "Why: adolescent", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["★ Girls stop growing 2-2.5 years after menarche", "Estrogen closes the growth plates. Boys grow until 18-20."], ["★ Iron-rich foods", "Teens grow fast and girls lose blood with periods."], ["Invincibility and risk taking", "Judgment is still maturing and peers have a strong pull."], ["Accidents peak late evening", "More driving and less supervision."], ["★ Giving away valued possessions", "It can mean the teen is planning suicide. Ask directly and report."], ["Suicide risk factors", "They add up to hopelessness and impulsive acts."], ["Eating disorders", "Body image forms now and peers add pressure."], ["Nursing concerns: self-image, privacy, peers", "Teens want independence and acceptance."]]}]}, {"h": "Why: immunizations", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["Live vaccines (MMR, varicella) at 12-15 months", "Mother's antibodies block a live vaccine before about 12 months."], ["Hep B at birth", "It protects against infection passed from mother to baby."], ["Rotavirus is oral", "The virus infects the gut."], ["First-time flu vaccine needs 2 doses", "The first primes the immune system and the second boosts it."], ["Hep A: 2 doses 6 months apart", "The second dose gives lasting protection."], ["Tdap at 11-12 years", "Protection from the childhood series fades."], ["RSV prevention optional, birth to about 8 months", "Young infants are at highest risk."]]}]}, {"h": "Other lecture points to star", "star": true, "blocks": [{"t": "ul", "items": ["★ **Parenting styles (lecture quiz review):** **authoritative** = not too strict and not too permissive, listens to the child. **Authoritarian** = strict. **Permissive** = very laid back. **Passive (uninvolved)** = does not care what is going on", "★ **Tanner:** she wants stages 2, 3 and 4 memorized for both boys and girls. Her exam questions use pictures", "★ **Heart rate trap:** do not stress small differences between the book and ATI. ATI normal infant HR is 120-160. Infant in the 60s or 50s is abnormally low. Below 40 start CPR", "★ **Flashcards she told you to make:** Tanner stages 2-4 and heart murmur grades", "★ **Do review:** IV maintenance fluid calculations (she offered extra help)", "★ **Reading pediatric questions:** look for clues, such as a sleeping infant (listen first) or a parent teaching statement that is off"]}]}, {"h": "Ch 8: Atraumatic Care: all stars, highlights and notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Principles of atraumatic care:** Prevent or minimize **physical stressors**: pain, discomfort, immobility, sleep deprivation, inability to eat or drink, changes in elimination", "★ **Principles of atraumatic care:** Prevent or minimize **parent-child separation**", "★ **Principles of atraumatic care:** Promote **family-centered care**: treat the family as the patient", "★ **Principles of atraumatic care:** Promote a **sense of control**", "★ **Principles of atraumatic care (note):** Lecture: she said to highlight this whole slide. Goal: minimize physical AND emotional stress for the child and family.", "★ **Role of child life specialists:** Programs that prepare children for hospitalization and painful procedures", "★ **Role of child life specialists:** Support during medical procedures", "★ **Role of child life specialists:** Therapeutic play and activities that support normal growth and development", "★ **Role of child life specialists:** Educate the child and family about health conditions", "★ **Role of child life specialists:** Teach and support coping and pain management strategies", "★ **Role of child life specialists:** Sibling support and advocacy for the child and family", "★ **Role of child life specialists:** Grief and bereavement support", "★ **Role of child life specialists (note):** Speaker note: one big role of the child life specialist is to decrease anxiety and fear during hospitalizations and painful procedures.", "★ **Preventing or minimizing physical stressors:** ==Therapeutic hugging== (Figure 8.1): the parent or nurse holds the child securely in a comforting position, often on a parent's lap, so the child stays still without being restrained", "★ **Quiz questions on the slides (note):** Quiz question flagged on the slides. Know both rationales."]}]}, {"h": "Ch 8: Family Care and Teaching: all stars, highlights and notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Focus of family-centered care:** **Respect** for the child and family. Family may extend beyond parents and siblings", "★ **Focus of family-centered care:** Recognize the effects of **cultural, racial, ethnic and socioeconomic diversity** on the family's health care experience", "★ **Focus of family-centered care:** **Identify and expand the family's strengths**", "★ **Focus of family-centered care:** **Support the family's choices** about the child's health care", "★ **Focus of family-centered care:** Maintain **flexibility**", "★ **Focus of family-centered care (note):** Lecture: she said to highlight and star the focus of family-centered care slide.", "★ **Working with an interpreter:** Help the interpreter prepare and understand ahead of time what needs to be done", "★ **Working with an interpreter:** The interpreter is the communication **bridge, not the content expert**. Timing may not match yours", "★ **Working with an interpreter:** Speak slowly and clearly. Avoid jargon", "★ **Working with an interpreter:** **Pause every few sentences** so the interpreter can translate", "★ **Working with an interpreter:** **Talk directly to the family, not the interpreter**", "★ **Working with an interpreter:** Give the family and interpreter time to respond", "★ **Working with an interpreter:** Ask the family to **repeat back** their understanding", "★ **Working with an interpreter:** Say it two or three different ways if needed. Use metaphors", "★ **Working with an interpreter:** Use an interpreter to make sure the family can read and understand translated written materials", "★ **Working with an interpreter:** Avoid side conversations during sessions", "★ **Working with an interpreter:** Speaking another language does not mean someone is a good interpreter", "★ **Working with an interpreter:** **Do not use children as interpreters**", "★ **Working with an interpreter:** ==Unique exception, sign language: the family may be used as the interpreter==", "★ **Working with an interpreter (note):** Lecture: she said to highlight and star this slide, and to highlight and star the sign language exception.", "★ **Learning principles: children and parents:** **Adolescents** | ==Particularly sensitive about maintaining body image and feelings of control and autonomy==", "★ **Learning needs assessment (note):** Questions to ask: who cares for the child at home, who is the authority figure, what is the social support structure, are there special dietary needs, are traditional health practices used, are special clothes or items used to maintain health, which religious beliefs, ceremonies and spiritual practices matter daily or to health.", "★ **Cone of learning (Edgar Dale):** **10%** | What we **read**", "★ **Cone of learning (Edgar Dale):** **20%** | What we **hear**", "★ **Cone of learning (Edgar Dale):** **30%** | What we **see** (looking at pictures)", "★ **Cone of learning (Edgar Dale):** **50%** | What we **hear and see** (movie, demonstration, seeing it done)", "★ **Cone of learning (Edgar Dale):** **70%** | What we **say** (discussion, giving a talk)", "★ **Cone of learning (Edgar Dale):** **90%** | What we **say and do** (simulating or doing the real thing)", "★ **Cone of learning (Edgar Dale) (note):** The more active the learning, the more we keep. Passive = reading and hearing. Active = doing."]}]}, {"h": "Ch 10: Health History: all stars, highlights and notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Role of the nurse during the physical assessment:** **Establish rapport and trust**", "★ **Role of the nurse during the physical assessment:** Demonstrate **respect** for the child and parent or caregiver", "★ **Role of the nurse during the physical assessment:** Communicate effectively by **listening actively**, **demonstrating empathy** and **providing feedback**", "★ **Role of the nurse during the physical assessment:** **Observe systematically**", "★ **Role of the nurse during the physical assessment:** **Validate and interpret data accurately**", "★ **Functional history:** **Safety measures** | Car seats and the right seat for age", "★ **Functional history:** **Routine health and dental care** | Regular doctor and dentist visits", "★ **Functional history:** **Nutrition** | 24-hour dietary food log, vitamins, supplements", "★ **Functional history:** **Physical activity** | Sports, play", "★ **Functional history:** **Television and gaming** | Hours of screen time", "★ **Functional history:** **Sleep routine** | Bedtime, hours of sleep", "★ **Functional history:** **Elimination patterns** | Bowel and bladder", "★ **Functional history:** **Religious involvement** | Beliefs and practices", "★ **Functional history:** **Sexual patterns** | Asked privately for adolescents", "★ **Functional history (note):** Lecture: she said to highlight and star this slide. Expect a select-all-that-apply asking which items are functional history. Page 262.", "★ **Review of systems (14 on the slide):** Growth and development", "★ **Review of systems (14 on the slide):** Skin", "★ **Review of systems (14 on the slide):** Head and neck", "★ **Review of systems (14 on the slide):** Eyes and vision", "★ **Review of systems (14 on the slide):** Ears and hearing", "★ **Review of systems (14 on the slide):** Mouth, teeth and throat", "★ **Review of systems (14 on the slide):** Respiratory system and breasts", "★ **Review of systems (14 on the slide):** Cardiovascular system", "★ **Review of systems (14 on the slide):** Gastrointestinal system", "★ **Review of systems (14 on the slide):** Genitourinary system", "★ **Review of systems (14 on the slide):** Musculoskeletal system", "★ **Review of systems (14 on the slide):** Neurologic system", "★ **Review of systems (14 on the slide):** Endocrine system", "★ **Review of systems (14 on the slide):** Hematologic system", "★ **Review of systems (14 on the slide) (note):** Pediatric difference from adults: growth and development is added. Lecture example: asking mom if the child is thirsty, urinating a lot or has a big appetite screens the endocrine system (diabetes).", "★ **Developmental considerations:** **Infants and toddlers** | !!Examine on the caretaker's lap, let the child touch the equipment, do invasive parts last!!", "★ **Developmental considerations (note):** Lecture: she said to highlight and star infants and toddlers (caretaker's lap, touch equipment, invasive parts last).", "★ **Nursing actions (note):** Pearl: 'keep equipment out of sight' and 'let the toddler touch the equipment' both appear. Out of sight at first, then let the child explore it once you are ready to use it.", "★ **Physical examination: what you measure and determine (note):** BMI: Box 10.1 on page 274. Lecture: not tested in depth, an app or the EHR calculates it."]}]}, {"h": "Ch 10: Vitals and Body Systems: all stars, highlights and notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Order of the physical exam:** **1. Observation** | Skin color, asymmetry, gait, unusual movements, odors", "★ **Order of the physical exam:** **2. Auscultation** | Listen to heart and lungs (added: before touching, so the child stays calm)", "★ **Order of the physical exam:** **3. Palpation** | Warmth, texture, unusual findings through touch", "★ **Order of the physical exam:** **4. Percussion** | Focused tapping for location, size and density of organs or masses", "★ **Order of the physical exam:** **Exception: the abdomen.** Auscultate BEFORE palpating or percussing. Added: Touching first can stir up bowel sounds and make them false", "★ **Order of the physical exam (note):** Lecture: she said her ATI will not change this order. Observe, auscultate, palpate, except abdomen: listen first.", "★ **Heart and respiratory rate ranges (Table 10.3) (note):** Lecture: do not sweat small differences between the book and ATI (ATI normal infant HR 120-160). Know an infant in the 60s or 50s is abnormally low, and below 40 means start CPR.", "★ **Pulse and blood pressure:** ==The radial pulse is difficult to palpate accurately in children younger than 2 years because the blood vessels lie close to the surface==", "★ **Pulse and blood pressure:** ==Auscultate the apical pulse for a full minute== (added: the slide wording says 'under ten'; the reason given is the hard-to-feel radial pulse in infants and toddlers)", "★ **Pulse and blood pressure (note):** Lecture: she said to highlight the radial pulse sentence. Lecture: a case where the order of the exam may change is the sleeping baby, because you want the heart rate before you wake them.", "★ **Skin color variations (Box 10.2):** **Pallor** | Decreased pinkness in light skin, ashy gray in dark skin | Anemia, shock, fever, syncope", "★ **Skin color variations (Box 10.2):** **Central cyanosis** | Blue lips, tongue, oral mucosa and trunk | Hypoxia or circulatory collapse (emergency)", "★ **Skin color variations (Box 10.2):** **Jaundice** | Overall yellow color | Physiologic in the newborn, or liver or blood disease at any age. Added: Newborns clear bilirubin with phototherapy and frequent feeds", "★ **Skin color variations (Box 10.2):** **Yellowing of nose, palms and soles** | Yellow only in those spots | Too many yellow vegetables", "★ **Skin color variations (Box 10.2):** **Redness** | Red skin | Blushing, cold exposure, hyperthermia, local inflammation, alcohol ingestion", "★ **Skin color variations (Box 10.2):** **Lack of color** | No color in skin, hair and eyes | Albinism", "★ **Skin color variations (Box 10.2) (note):** Lecture: she said to highlight this slide. Do not mix up central cyanosis (lips and tongue, an emergency) with acrocyanosis (hands and feet, normal in a newborn).", "★ **Acrocyanosis and reporting skin lesions:** Describe the **color, shape and number** of lesions", "★ **Acrocyanosis and reporting skin lesions:** Describe the **location and extent** of all lesions", "★ **Acrocyanosis and reporting skin lesions:** Describe the characteristics: scaly, flat, flaky, blister-like, raised, crusted, weeping, itchy; **macule vs papule** (added: macule is flat, papule is raised)", "★ **HEENT:** **Anterior fontanel** | ==Present up to 18 months (9-18 months), diamond shaped==", "★ **HEENT:** **Fontanel when crying** | ==Brief bulging is normal==", "★ **HEENT:** **Dehydration** | ==Sunken fontanel==", "★ **HEENT:** **Increased intracranial pressure (ICP)** | ==Bulging fontanel that stays bulging when the baby is not crying==", "★ **HEENT:** **Posterior fontanel** | Closes from birth to 2 months", "★ **HEENT:** **Eyes** | Strabismus (crossing of the eyes) is intermittent up to 6 months. The corneal light reflex (Hirschberg) is always symmetric", "★ **HEENT:** **Ears** | Check ear canal, ear rotation and level", "★ **HEENT:** **Tonsils** | Large tonsils are common in the young child", "★ **HEENT (note):** Lecture: she said to star the HEENT slide and highlight the bulging and sunken fontanel lines.", "★ **Tympanic temperature:** ==For children younger than 3, pull the earlobe back and down==", "★ **Tympanic temperature (note):** Lecture: she said this is a very important slide, star and highlight it.", "★ **Respirations:** Observe the rate and effort: easy or labored", "★ **Respirations:** Note **retractions** or use of accessory muscles (added: subcostal, substernal, subclavicular)", "★ **Respirations:** Listen for unusual sounds: **wheezing, stridor, crackles**", "★ **Respirations:** Describe a cough: dry, hacking, wet, productive (added: a barking cough suggests croup)", "★ **Respirations:** ==Infant breathing is diaphragmatic (belly breathers)==. ==After 1 year, thoracic movements==", "★ **Oxygen saturation: sources of error:** Abnormal hemoglobin values | False reading", "★ **Oxygen saturation: sources of error:** Poor perfusion | False reading, falsely **low**", "★ **Oxygen saturation: sources of error:** Ambient light interference | False reading", "★ **Oxygen saturation: sources of error:** Poor connection (added: nail polish) | Falsely **low**", "★ **Oxygen saturation: sources of error:** **Anemia** and **carbon monoxide poisoning** | The reading may look normal while the child is truly low on oxygen. Added: CO sits on hemoglobin in place of oxygen, so the monitor reads high", "★ **Oxygen saturation: sources of error (note):** Lecture: she said to highlight and star this slide, it is very important. Page 270.", "★ **Grading heart murmurs (Table 10.5):** **1** | Barely audible. Sometimes heard, sometimes not. Usually only with intense concentration", "★ **Grading heart murmurs (Table 10.5):** **2** | Quiet and soft. Heard each time the chest is auscultated", "★ **Grading heart murmurs (Table 10.5):** **3** | Audible, intermediate intensity", "★ **Grading heart murmurs (Table 10.5):** **4** | Audible with a **palpable thrill**", "★ **Grading heart murmurs (Table 10.5):** **5** | Loud. Audible with the edge of the stethoscope lifted off the chest", "★ **Grading heart murmurs (Table 10.5):** **6** | Very loud. Audible with the stethoscope near but not touching the chest", "★ **Grading heart murmurs (Table 10.5) (note):** Speaker note: create little flashcards of these. Test questions will definitely come from this. Lecture: she said to highlight and star it and make flashcards, because they are easy test questions to memorize.", "★ **GI and GU (note):** Speaker note: labial adhesions can be a sign of abuse in girls, so always assess. Lecture: a missed undescended testicle can have serious later consequences."]}]}, {"h": "Ch 10: Growth and BP by Age: all stars, highlights and notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Temperature and blood pressure by age (note):** This exam's heart and respiratory rate ranges are Table 10.3 on the Vitals and Body Systems tab. Use those. Under 10 years, auscultate the apical pulse for a full minute. The radial pulse is hard to feel under 2 years.", "★ **Where to take the blood pressure:** **Infants** | ~~Lateral tibialis artery (lower leg)~~", "★ **Where to take the blood pressure:** **Toddlers** | ~~Brachial or lateral tibialis artery unless contraindicated~~", "★ **Where to take the blood pressure (note):** If you cannot use the leg on an infant, the RIGHT upper arm is preferred. The left arm gives false readings.", "★ **Growth by age:** **Infant** | Birth 48-53 cm (19-21 in). Grows 2.5 cm (1 in)/month for 6 months. ==Length up 50% by 12 months== | Birth 2700-4000 g (6-9 lb). Loses 10% in week 1, regains by 10-14 days. ==Doubles by 4-6 months, triples by 1 year== | HC 33-35 cm. Up 2 cm/mo first 3 mo, 1 cm/mo months 4-6, 0.5 cm/mo second 6 mo. ==Head and chest equal by about 2 years==", "★ **Growth by age:** **School age** | 5 cm (2 in)/year | 2-3 kg (4.4-6.6 lb)/year | ==Pre-puberty begins about age 9, especially girls. Menarche 10-16, average 12.5==", "★ **Growth charts and measuring:** ==A significant shift from the child's usual percentiles means further assessment is needed.==", "★ **Growth charts and measuring (note):** Practice plotting from your slide notes: Baby girl 3 mo, HC 40 cm, wt 16 lb, ht 26 in. Baby boy 4.5 mo, HC 44 cm, wt 9.5 kg, ht 72 cm. Use the CDC charts linked in the slide notes."]}]}, {"h": "Ch 10: Tanner Staging: all stars, highlights and notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Stage by stage: girls and boys together:** **2** | **Breast bud**: small mound, widened areola | Sparse, long, downy, mostly on the labia | **Testes enlarge, scrotal skin reddens** | Thin, light, at the base of the penis", "★ **Stage by stage: girls and boys together:** **3** | Breast and areola enlarge together, **nipple flush** | Sparse, **spreading over the mons**, darker, coarser, curlier | **Penis lengthens** (not wider). Growth spurt. Voice may change | Darker, coarser, curlier", "★ **Stage by stage: girls and boys together:** **4** | Areola and nipple form a **secondary mound** | Adult type over a smaller area, none on medial thigh | Penis **wider and longer**. Scrotum darkens. Voice deepens, facial hair starts | Thick and coarse, not yet on the thighs", "★ **Stage by stage: girls and boys together (note):** Lecture: stage 1 and stage 5 are easy. Memorize stages 2 to 4. Slide list of boys' changes in order: testicular enlargement, pubic hair, penis length, axillary hair, facial hair, vocal changes.", "★ **What Tanner staging is:** Focus on **stages 2, 3 and 4**: they are the ones used most and confused most", "★ **What Tanner staging is (note):** Lecture: she said to make flashcards for Tanner stages 2-4. Her test questions use pictures, so learn what each stage looks like. She said breast bud (stage 2) is always going to be a question.", "★ **Girls: breast development:** **2** | **Breast bud stage.** A small mound of breast and nipple develops. The areola widens", "★ **Girls: breast development:** **3** | Breast and areola **enlarge further**. The nipple is **flush with the breast surface**. No separation of contours", "★ **Girls: breast development:** **4** | Areola and nipple form a **secondary mound** above the level of the breast", "★ **Girls: breast development (note):** Stage 3 vs stage 4: in stage 3 the areola and breast are one smooth contour. In stage 4 the areola and nipple stick up as a second mound. Seeing the secondary mound = stage 4.", "★ **Girls: pubic hair:** **2** | Sparse growth, mostly on the labia. Long, downy, slightly pigmented, straight or slightly curly", "★ **Girls: pubic hair:** **3** | Sparse growth **spreading over the mons pubis**. Hair is darker, coarser and curlier", "★ **Girls: pubic hair:** **4** | Adult-type hair but over a **smaller area**. None on the medial thigh", "★ **Girls: pubic hair (note):** Lecture: she said her stage 2 and 3 questions on hair are the tricky ones, so know light and sparse (2) vs darker and spreading (3).", "★ **Boys: genital development (from lecture):** **2** | **Testes enlarge** and the **scrotal skin reddens**. Thin, light pubic hair", "★ **Boys: genital development (from lecture):** **3** | **Penis lengthens** (not wider). Testes keep enlarging. Pubic hair darker. Growth spurt. Voice may change", "★ **Boys: genital development (from lecture):** **4** | Penis gets **wider and longer**. Scrotum darkens. Thick pubic hair. Voice deepens and facial hair starts", "★ **Boys: genital development (from lecture) (note):** Lecture: stage 2 = scrotal reddening and testicular enlargement, stage 3 = penis LENGTH, stage 4 = penis width AND length. Know the difference between 2, 3 and 4.", "★ **Breast inspection:** ==Newborns of both genders may have swollen nipples from maternal estrogen==. Normal, it goes away", "★ **Breast inspection:** ~~Note the location of supernumerary nipples if present. They are usually along the mammary ridge and look like dark, raised nipple-like spots. They may indicate renal disorders, or may not be concerning~~", "★ **Breast inspection (note):** Lecture: she said to highlight this slide. Her example: a worried dad thought his son had breast development. It was only maternal estrogen swelling.", "★ **Sample exam question from lecture (note):** This was the advanced question in the lecture review. Learn it word for word."]}]}, {"h": "Ch 12: Special Health Care Needs: all stars, highlights and notes", "star": true, "blocks": [{"t": "ul", "items": ["★ **Resources and services needed (note):** Speaker note: often parents get support from other parents of children with similar medical conditions (support groups).", "★ **Impact on the child: all Erikson stages:** **Infant** | !!Trust vs Mistrust!! | May fail to develop a sense of trust and bonding", "★ **Impact on the child: all Erikson stages:** **Toddler** | !!Autonomy vs Shame and Doubt!! | May have difficulty developing autonomy", "★ **Impact on the child: all Erikson stages:** **Preschooler** | !!Initiative vs Guilt!! | May have difficulty achieving a sense of initiative", "★ **Impact on the child: all Erikson stages:** **School age** | !!Industry vs Inferiority!! | May have difficulty achieving industry", "★ **Impact on the child: all Erikson stages:** **Adolescent** | !!Identity vs Role Confusion!! | May have difficulty forming a sense of self-identity relative to peers", "★ **Impact on the child: all Erikson stages (note):** Speaker note: all stages of Erikson can be impacted. Lecture: all Erikson stages could be delayed.", "★ **Transition times in care (note):** Speaker note: when caring for special needs infants, help parents get into early intervention programs and specialists. Never delay care. Lecture: it is important to get into early intervention programs for specialty care, for example autism therapy at the right age.", "★ **Risk factors for vulnerable child syndrome:** **Preterm birth**", "★ **Risk factors for vulnerable child syndrome:** **Congenital anomaly**", "★ **Risk factors for vulnerable child syndrome:** **Newborn jaundice**", "★ **Risk factors for vulnerable child syndrome:** **Handicapping condition**", "★ **Risk factors for vulnerable child syndrome:** An accident or illness the child was not expected to recover from", "★ **Risk factors for vulnerable child syndrome:** **Crying or feeding problems in the first 5 years of life**", "★ **Risk factors for vulnerable child syndrome (note):** Lecture: she said to highlight this slide.", "★ **Families:** Are a **constant** in the child's life", "★ **Families:** Need **access to information and training**", "★ **Families:** Deserve **culturally competent care**", "★ **Families:** Know their strengths, limitations and fears", "★ **Families:** Merit **mutual ary to minimize trauma to the veins==", "★ **Slide question: 5-month-old IV site (note):** Quiz question on the slides.", "★ **IV therapy technique:** **Make only two attempts** to gain access. Get help if unsuccessful", "★ **IV therapy technique:** **Encourage parental participation** to hold and comfort the child (therapeutic hugging)", "★ **IV therapy technique:** Coordinate care with other departments", "★ **IV therapy technique:** **Secure the line with a minimal amount of tape**", "★ **IV therapy technique:** Protect the site from accidental bumping", "★ **IV therapy technique:** **Assess the insertion site at regular intervals**", "★ **IV therapy technique (note):** Starred slide. Lecture: pull anything sticky off their skin carefully when kids have sensory issues.", "★ **IV maintenance fluid calculation (daily):** **First 10 kg** | **100 mL per kg**", "★ **IV maintenance fluid calculation (daily):** **Next 10 kg** (10-20 kg) | **50 mL per kg**", "★ **IV maintenance fluid calculation (daily):** **Remainder** over 20 kg | **20 mL per kg**", "★ **IV maintenance fluid calculation (daily) (note):** Starred slide. Table 13.4 page 369. Lecture: she asked who needs extra help with fluid calculations.", "★ **Nutritional support:** **Enteral** | **Orogastric, nasogastric, nasojejunal or nasoduodenal** tubes go along existing anatomy. **Gastrostomy or jejunostomy** tubes go straight into the GI tract through a surgical opening in the abdomen | For a **functioning GI tract** when the child cannot take enough calories by mouth", "★ **Nutritional support:** **Parenteral** | Additional fluids by peripheral IV", "★ **Nutritional support:** **TPN** (total parenteral nutrition) | Through a **central line**. ==A highly concentrated solution of carbohydrates, electrolytes, vitamins and minerals== | May be used when the GI tract does not work", "★ **Nutritional support (note):** Starred slide. Lecture: she said to highlight the TPN line.", "★ **Care of the child with an enteral r day**. 1,500 / 24 = **62.5 mL per hour**", "★ **Quick check table (daily and hourly) (note):** Use it to check your own answer, not to skip the formula. Questions use weights that are not on this table.", "★ **mg/kg/day: dose to order and order to dose:** mg/kg/day, weight, doses per day | mg per dose | mg/kg/day x kg = mg per day. Then divide by doses per day", "★ **mg/kg/day: dose to order and order to dose:** mg per dose, doses per day, weight | mg/kg/day | mg per dose x doses per day = mg per day. Then divide by kg", "★ **mg/kg/day: dose to order and order to dose:** mg/kg/dose and weight | mg per dose | mg/kg/dose x kg. No dividing by doses", "★ **mg/kg/day: dose to order and order to dose:** Safe range in mg/kg/day, weight, the ordered dose | Is the order safe | Range x kg gives the lowest and highest safe mg per day. Ordered mg per dose x doses per day. Compare the two", "★ **mg/kg/day: dose to order and order to dose:** mg per dose and the concentration in mg per mL | mL to give | mg per dose divided by mg per mL", "★ **mg/kg/day: dose to order and order to dose (note):** Lecture: she is focusing on both directions, taking the mg/kg/day and finding the dose, and taking the dose and finding the mg/kg/day.", "★ **Worked dose examples:** **Order to dose:** 40 mg/kg/day in 3 doses for a 12 kg child. 40 x 12 = 480 mg per day. 480 / 3 = **160 mg per dose**", "★ **Worked dose examples:** **Dose to mg/kg/day:** 250 mg every 6 hours for a 20 kg child. 250 x 4 = 1,000 mg per day. 1,000 / 20 = **50 mg/kg/day**", "★ **Worked dose examples:** **Safe range check:** range 20 to 40 mg/kg/day, child 10 kg, order 150 mg every 8 hours. Safe range is 200 to 400 mg per day. Ordered 150 x 3 = 450 mg per day. That is 45 mg/kg/day, above the range, so **hold and clarify**", "★ **Worked dose examples:** **mL to give:** 90 mg ordered, the label reads 160 mg per 5 mL. 90 / 160 x 5 = **2.8 mL**"]}]}, {"h": "Exam traps: Quiz-day wording", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Question lists 'fatty layer' vs 'just under the epidermis'.", "SQ = fatty layer. ID = just under the epidermis."], ["Which vaccine is given SQ?", "MMR."], ["Teen needs teaching about a chronic illness.", "Body image, control and privacy."], ["Squirting the whole dose at the back of the infant's mouth.", "Side of the mouth along the cheek, a little at a time."], ["Mom says to keep the head back 5 minutes after nose drops.", "Wrong. 1 minute."], ["Adult learners called subject focused.", "False. Adults are problem focused."], ["Murmur barely audible and not heard every time.", "Grade 1. Grade 2 is heard every time."], ["TPN described as a dilute solution given through a peripheral IV.", "Highly concentrated carbohydrates, electrolytes, vitamins and minerals through a central line."], ["A choice says a normal oximeter reading proves oxygenation in a child with CO poisoning or anemia.", "Those can give a false normal. Look at the child, not only the number."], ["Wording says EXCEPT, NOT or 'needs further teaching'.", "Pick the incorrect statement. Read the stem twice before choosing. (Test-taking tip.)"], ["A sleeping infant and a choice that wakes the baby to take the pulse.", "Listen first to the heart, lungs and abdomen while the baby is quiet."], ["A parent teaching statement that is slightly off.", "Look for the detail that does not match the slide rule, such as 5 minutes instead of 1 minute."], ["Which developmental theory: Erikson or Piaget.", "She stresses Erikson most. Piaget is thinking: sensorimotor, preoperational, concrete operational, formal operational."]]}]}, {"h": "Exam traps: Ch 8: Atraumatic Care", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["A choice says atraumatic care is only for physical needs.", "False. It is family-centered and covers emotional needs."], ["A choice tells parents to leave care to staff or hides surgery details.", "Wrong. Parents are equal partners and need honest information."], ["A choice restrains a scared child for speed.", "Avoid restraint when possible. Use comfort positions and therapeutic hugging."], ["A choice says people remember 90% of what they read.", "Cone of learning: 10% read, 20% hear, 30% see, 50% hear and see, 70% say, 90% say and do."], ["A choice says the child life specialist performs the painful procedure.", "Child life specialists prepare, support and teach through therapeutic play. They do not perform the procedure."], ["A parent who is strict is called authoritative.", "Authoritative = not too strict and not too permissive, listens. Authoritarian = strict. Permissive = very laid back. Passive (uninvolved) = does not care what is going on."]]}]}, {"h": "Exam traps: Ch 8: Family Care and Teaching", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Nurse looks at the interpreter while talking.", "Talk directly to the family."], ["Teen sibling or child offered as interpreter.", "Never use children. Only exception is the family for sign language."], ["'Do you understand?' as the evaluation.", "Use teach-back or demonstration. Yes or no does not prove learning."], ["Adolescent teaching that ignores privacy and body image.", "Adolescents are sensitive about body image and control."], ["Erikson stage matched to the wrong age.", "Match the stage to the age: infant trust vs mistrust, toddler autonomy vs shame and doubt, preschool initiative vs guilt, school age industry vs inferiority, adolescent identity vs role confusion."], ["A teaching plan for a teen talks only to the parent.", "Speak directly to the school-age child and the teen, and answer their questions directly."]]}]}, {"h": "Exam traps: Ch 10: Health History", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Question lists car seat use, sleep and screen time.", "Those are functional history."], ["Examining a toddler on the table, starting with the ear.", "Caretaker's lap, invasive parts last."], ["A close-ended question to open an interview.", "Use open-ended questions to get more information."], ["A choice leads with the physical exam before rapport.", "Rapport and trust come first."], ["The question asks which items are functional history and lists allergies.", "Allergies are past health history. Functional history is daily living: safety, car seats, sleep, screen time, elimination, religion."]]}]}, {"h": "Exam traps: Ch 10: Vitals and Body Systems", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Palpating the abdomen before listening.", "Auscultate the abdomen first."], ["Counting an infant pulse at the wrist for 30 seconds.", "Apical pulse for a full minute."], ["Blue hands and feet in a 2-day-old reported as an emergency.", "Acrocyanosis is normal. Blue lips and tongue are not."], ["Reading 98% on a CO-poisoned child means oxygenation is fine.", "False reading. CO poisoning and anemia mislead the oximeter."], ["Murmur grade described by pitch.", "Grading is by intensity and loudness."], ["Infant heart rate of 60 or 50 is called normal.", "ATI normal infant rate is 120 to 160. The 60s and 50s are abnormally low, and below 40 means start CPR."], ["Counting the respiratory rate after undressing a crying infant.", "Count heart rate and respiratory rate before undressing, and listen first to a sleeping infant."], ["Tympanic temperature in a 2-year-old with the earlobe pulled up and back.", "Under age 3, pull the earlobe back and down."], ["Murmur heard only with the edge of the stethoscope lifted off the chest.", "Grade 5. Grade 6 is heard with the stethoscope near but not touching the chest. Grade 4 has a palpable thrill."], ["A choice says a murmur always means heart disease.", "A murmur is a common finding in children. Grade it and describe where it is heard."]]}]}, {"h": "Exam traps: Ch 10: Growth and BP by Age", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Question asks which artery for an infant BP.", "Lateral tibialis (lower leg), not brachial."], ["Which arm if the leg cannot be used on an infant?", "Right upper arm. Left gives false readings."], ["Birth weight triples at 6 months?", "No. Doubles at 4-6 months, triples at 1 year."], ["Infant lost 10% of birth weight in week 1. Is that abnormal?", "No. Expected. Regains by 10-14 days."], ["Preschooler weight gain given in pounds.", "4.5-6.5 lb a year (2-3 kg). Do not mix with toddler 3-5 lb."], ["Infant lost 10% of birth weight in week 1 is flagged as abnormal.", "Expected. Regains by 10 to 14 days."]]}]}, {"h": "Exam traps: Ch 10: Tanner Staging", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Picture shows a small mound with a widened areola.", "Stage 2, the breast bud."], ["Picture shows enlarged breast with the nipple flush.", "Stage 3. A secondary mound would be stage 4."], ["Boy with a longer but not wider penis.", "Stage 3. Wider and longer = stage 4."], ["Newborn boy with swollen nipples.", "Normal. Maternal estrogen."], ["Boy with scrotal reddening and enlarged testes but no penis growth.", "Stage 2."], ["Girl with light, sparse pubic hair versus darker, spreading hair.", "Light and sparse is stage 2. Darker and spreading is stage 3."], ["Questions use pictures, so the answer is hidden in the wording.", "Learn what stages 2, 3 and 4 look like. Breast bud is stage 2 and always shows up."]]}]}, {"h": "Exam traps: Ch 12: Special Health Care Needs", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Teen with a chronic illness cannot form peer relationships.", "Identity vs role confusion difficulty."], ["A parent calls a healthy child fragile after a premature birth.", "Vulnerable child syndrome."], ["Plan says to delay specialist referral until the child is older.", "Never delay. Early intervention programs."], ["Premature infant judged by birth date.", "Calculated (adjusted) age."], ["A choice says early intervention should wait until the child starts school.", "Never delay referrals. Early intervention starts as early as possible."], ["A choice says a child with a chronic illness cannot reach normal milestones.", "Support normal growth and development. Illness may make it harder, so plan around the child's abilities."]]}]}, {"h": "Exam traps: Ch 12: Transition and End of Life", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Organ donation brought up in the same breath as the death notice.", "Discussion must be separate."], ["Family asked to pay for the donor's costs.", "Recipient's family pays all expenses."], ["Nurse leaves the room to avoid a dying child's family.", "Be present, respect spiritual beliefs."], ["DNR means stop all care.", "It only withholds CPR. Comfort care and oxygen can continue."], ["AND is described as the same as DNR.", "DNR withholds CPR. AND means allow natural death."], ["Nurse stays at the bedside but avoids the family's questions.", "Be present, answer honestly and respect spiritual beliefs."]]}]}, {"h": "Exam traps: Ch 13: Peds Medication Basics", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Choice says infants have LESS body water than adults.", "False. Infants have MORE."], ["Oral drug and the cause is 'vasomotor instability'.", "That affects IM. Oral = gastric emptying."], ["Higher body surface area, so topical absorption is slower.", "Faster."], ["Pharmacokinetics is defined as what the drug does to the body.", "Reversed. Pharmacokinetics = what the body does to the drug (absorption, distribution, metabolism, excretion). Pharmacodynamics = what the drug does to the body."], ["A choice says immature kidneys clear the drug faster.", "Immature kidneys clear it slower, so the half-life is longer and the drug can become toxic."], ["Which form is absorbed the quickest: oral, IM or topical.", "Topical (creams, ointments, lotions, drops)."]]}]}, {"h": "Exam traps: Ch 13: Giving Peds Medications", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Crushed medication mixed in formula 'so the baby takes it'.", "Never. The child may refuse formula later."], ["Deltoid chosen for a 9-month-old.", "Vastus lateralis."], ["Eye drops: no pressure afterward.", "Gentle pressure on the inner canthus."], ["Nose drops, child sits up after the drops right away.", "Keep the head hyperextended for 1 minute."], ["Mom says to keep the head back for 5 minutes after nose drops.", "Wrong. The rule is 1 minute."], ["Which vaccine is SQ?", "MMR."], ["Oral drug mixed in the child's formula or an essential food.", "Never. The child may refuse the food later. A little applesauce is allowed."], ["Child spits out a tablet, so the nurse skips the dose.", "Call the pharmacy for a liquid or a slurry."], ["Eye drops: dropper touches the eye or is held far away.", "Hold the dropper 2.5 cm (1 inch) from the eye with the child looking up and to the side. Ages 3 and under need a helper."], ["Nose drops given to a child sitting up with a stuffy nose.", "Blow the nose first, then lay the child supine with the head hyperextended and do not touch the nares."], ["IM site for a 12-month-old or younger is the deltoid or gluteus.", "Vastus lateralis. Muscle development and the amount of fluid decide the site."], ["SQ and ID uses are swapped.", "SQ = insulin, heparin, MMR. ID = TB screening, allergy testing."], ["Wording says 'give slowly' versus 'give quickly'.", "Oral liquid medications are given slowly in small amounts so the child can swallow."]]}]}, {"h": "Exam traps: Ch 13: IV, Fluids and Nutrition", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["A 25 kg child's daily fluid calculated as 25 x 100.", "100/50/20 stepwise: 1,600 mL."], ["Nurse tries 4 times to start the IV.", "Two attempts then get help."], ["Tube aspirate pH is 7.5.", "Respiratory. Do not give the medication."], ["Capsule crushed for a G-tube.", "Never crush capsules."], ["IV started in a scalp vein as the first choice in a 5-month-old.", "Hand, foot or forearm first. Scalp is a last resort in infants up to about 9 months."], ["Largest gauge catheter chosen for a small child.", "Smallest gauge for the shortest time."], ["Enteral feeding is chosen for a child whose gut does not work.", "Enteral needs a functioning GI tract. TPN is for when it does not."], ["TPN is described as a diluted solution given peripherally.", "TPN is highly concentrated and goes through a central line. Use occlusive dressings and monitor blood glucose."], ["Aspirate pH of 3 is treated as respiratory.", "Gastric is 1.5 to 4. Respiratory is greater than 7."], ["Tablets and capsules both crushed for a G-tube.", "Crush tablets in warm water. Never crush capsules. Flush after each drug."]]}]}, {"h": "Exam traps: Dosage and fluid math", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["25 kg child calculated as 25 x 100.", "Use the 1,500 + 20 x (kg - 20) formula: 1,600 mL per day."], ["Order 250 mg every 6 hours, child 20 kg, answer 12.5 mg/kg/day.", "That forgot the 4 doses. 1,000 / 20 = 50 mg/kg/day."], ["Order 30 mg/kg/day in 3 doses for 15 kg, answer 450 mg per dose.", "450 is the daily total. Divide by 3 for 150 mg per dose."], ["Daily fluid total given when the question asks mL per hour.", "Divide the daily total by 24."], ["Weight given in pounds.", "Divide by 2.2 first, then pick the formula."], ["Ordered dose compared with the safe mg per dose.", "Compare mg per DAY with the safe mg per day. The safe range is per kg per day."], ["Order is mg/kg/dose.", "Multiply by kg only. Do not divide by doses per day."], ["The dose to give is asked in mL.", "mg per dose divided by the concentration in mg per mL."]]}]}], "cold": ["Rapport first. Observe, auscultate, palpate. Abdomen: listen first.", "Murmur grades 1-6. Tanner stages 2-4.", "Topical drugs absorb fastest. Kidney immaturity = toxicity. Cone of learning 10-20-30-50-70-90.", "MMR is SQ. Vastus lateralis under 12 months. Fluids: under 10 kg 100 x kg, 10 to 20 kg 1,000 + 50 x (kg - 10), over 20 kg 1,500 + 20 x (kg - 20).", "mg/kg/day to dose: x kg, then / doses per day. Dose to mg/kg/day: x doses per day, then / kg.", "TPN: concentrated carbohydrates, electrolytes, vitamins and minerals by central line. Monitor vital signs, site, glucose, labs, intake and output.", "False oximeter reading: anemia, CO poisoning, abnormal hemoglobin, poor perfusion, ambient light, poor connection. Murmur grades 1 to 6 by loudness.", "Nose drops: supine, head hyperextended 1 minute. A parent saying 5 minutes is wrong. Pharmacodynamics = what the drug does to the body.", "Infant oral liquid: oral syringe, small amounts, side of mouth along the inner cheek. Adult learners are problem focused (true).", "Quiet murmur heard every time = grade 2. Form not working: call the pharmacy. School age: talk to the child directly.", "Newborn teeth: wipe gums after feeds, no bottle in bed, brush at the first tooth. Pharmacokinetics = ADME. Boys stage 4 = wider and longer.", "DNR withholds CPR. AND = allow natural death. Never abandon the family."], "traps": []}, {"id": "atr", "icon": "🧸", "title": "Ch 8: Atraumatic Care", "sub": "Making the hospital experience as gentle as possible for the child and the family. Slide stars and lecture stars are marked.", "sections": [{"h": "Principles of atraumatic care", "star": true, "blocks": [{"t": "ul", "items": ["★ Prevent or minimize **physical stressors**: pain, discomfort, immobility, sleep deprivation, inability to eat or drink, changes in elimination", "★ Prevent or minimize **parent-child separation**", "★ Promote **family-centered care**: treat the family as the patient", "★ Promote a **sense of control**", "+ Why these four: hospital stress comes from pain, being away from parents and feeling helpless, so each principle removes one of those"]}, {"t": "note", "k": "star", "x": "Lecture: she said to highlight this whole slide. Goal: minimize physical AND emotional stress for the child and family."}]}, {"h": "Techniques for providing atraumatic care", "star": false, "blocks": [{"t": "tbl", "head": ["Technique", "What it means"], "rows": [["**Therapeutic communication**", "Goal directed. Focus on facts and feelings"], ["**Therapeutic play**", "Gives the child an emotional outlet or a coping device"], ["**Child education**", "Helps the child understand why they are in the hospital or having a procedure, in a way that fits their developmental level"], ["**Parental education**", "Engages parents as active participants in the health care team"]]}]}, {"h": "Role of child life specialists", "star": true, "blocks": [{"t": "ul", "items": ["★ Programs that prepare children for hospitalization and painful procedures", "★ Support during medical procedures", "★ Therapeutic play and activities that support normal growth and development", "★ Educate the child and family about health conditions", "★ Teach and support coping and pain management strategies", "★ Sibling support and advocacy for the child and family", "★ Grief and bereavement support"]}, {"t": "note", "k": "anno", "x": "Speaker note: one big role of the child life specialist is to decrease anxiety and fear during hospitalizations and painful procedures."}]}, {"h": "Preventing or minimizing physical stressors", "star": false, "blocks": [{"t": "ul", "items": ["Minimize physical distress during procedures", "Engage the child in identifying what would make him or her comfortable", "Use positions that are comfortable to the child", "==Therapeutic hugging== (Figure 8.1): the parent or nurse holds the child securely in a comforting position, often on a parent's lap, so the child stays still without being restrained", "Use distraction methods (music, conversation)", "Explain procedures **age appropriately**. Example: 'The MRI machine will be loud but will not hurt you.'", "+ Lecture: therapeutic hugging can be used for a lumbar puncture. The child is turned around and held, instead of lying alone"]}]}, {"h": "Nursing actions to lessen trauma (slide 7, page 205)", "star": false, "blocks": [{"t": "tbl", "head": ["Action", "Why it helps"], "rows": [["**Numbing techniques**", "Topical anesthetic (lidocaine cream, EMLA) put on before injections or IV starts so the stick does not hurt"], ["**Avoid restraint when possible**", "Restraint raises fear and loss of control"], ["**Saline lock IV** for multiple parenteral medications", "One IV start instead of many needle sticks"], ["**Avoid excessive blood draws**", "Fewer sticks, less pain and blood loss"], ["**Minimize IM and SQ injections**", "Fewer painful injections"], ["**Pain management**", "Untreated pain is a physical stressor"]]}]}, {"h": "Distraction methods", "star": false, "blocks": [{"t": "ul", "items": ["Have the child point toes inward and wiggle them", "Ask the child to squeeze your hand", "Encourage the child to count aloud", "Sing a song and have the child sing along", "Point out the pictures on the ceiling", "Have the child blow bubbles", "Play music appealing to the child", "Offer to watch a television show", "+ Regression: a scared or hurting child may act younger (thumb sucking, clinging) to self-soothe. This is expected and not punished"]}]}, {"h": "Quiz questions on the slides", "star": false, "blocks": [{"t": "ul", "items": ["**True or false:** atraumatic care for a child in surgery focuses **solely** on the physical needs of the child. **False.** It uses a family-centered approach: family roles, family support of the child and appropriate information", "**Cardiac surgery child, communicating with parents:** treat the parents as **equal partners** and let them perform as much of the child's care as is reasonable. This gives parents a sense of value and control. Wrong: hiding surgery details, shifting parents away from routine care, sending every question to the physician"]}, {"t": "note", "k": "star", "x": "Quiz question flagged on the slides. Know both rationales."}]}], "cold": ["Four principles: physical stressors, parent-child separation, family-centered care, sense of control.", "Child life specialist: decreases anxiety and fear during hospitalization and painful procedures.", "Atraumatic care is NOT only physical. Parents are equal partners.", "Numbing: EMLA or lidocaine cream before injections. Avoid restraint. Saline lock IV.", "Distraction: counting aloud, squeezing a hand, bubbles, music, songs."], "traps": [["A choice says atraumatic care is only for physical needs.", "False. It is family-centered and covers emotional needs."], ["A choice tells parents to leave care to staff or hides surgery details.", "Wrong. Parents are equal partners and need honest information."], ["A choice restrains a scared child for speed.", "Avoid restraint when possible. Use comfort positions and therapeutic hugging."]]}, {"id": "fam", "icon": "👪", "title": "Ch 8: Family Care and Teaching", "sub": "Family-centered care, interpreters, and how to teach children and parents so it sticks.", "sections": [{"h": "Focus of family-centered care", "star": true, "blocks": [{"t": "ul", "items": ["★ **Respect** for the child and family. Family may extend beyond parents and siblings", "★ Recognize the effects of **cultural, racial, ethnic and socioeconomic diversity** on the family's health care experience", "★ **Identify and expand the family's strengths**", "★ **Support the family's choices** about the child's health care", "★ Maintain **flexibility**", "Provide **honest, unbiased information** in an affirming and useful way, in formats that fit successful learning", "Help with the emotional and other support the child and family need", "**Collaborate** with families. Encourage parents to report their observations about changes in the child", "**Empower** families"]}, {"t": "note", "k": "star", "x": "Lecture: she said to high
