ct precautions", "Droplet precautions with a surgical mask only", "Standard precautions with hand hygiene only", "Contact precautions with a gown and gloves only"], "a": [0], "y": "Right: varicella spreads by air and by contact with lesion fluid. Not droplet only or contact only: each covers just one route. Not standard only: transmission precautions are required."}, {"ty": "mc", "d": 3, "q": "Which teaching is correct for the family?", "o": ["Trim his nails, use calamine or oatmeal baths, and avoid aspirin", "Give aspirin for the fever and aches to keep him comfortable", "Let him scratch gently to open the blisters so they heal faster", "Return to daycare once the fever breaks and he feels better again"], "a": [0], "y": "Right: nail trimming and soothing baths reduce scratching, and aspirin is linked to Reye syndrome. Not aspirin or scratching: harmful. Not returning when fever breaks: he is contagious until all lesions are crusted."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 3-month-old has had chronic diarrhea, thrush that will not clear and two pneumonias. She is not gaining weight. Her cousin died in infancy of an infection.", "parts": [{"ty": "mc", "d": 3, "q": "Which condition is the nurse most concerned about?", "o": ["Severe combined immunodeficiency", "Roseola infantum, with a fever and then a rash", "Pediculosis capitis, with an itchy scalp", "Latex allergy, with wheezing after glove contact"], "a": [0], "y": "Right: severe infections, thrush, diarrhea and failure to thrive in early infancy fit SCID. Roseola, lice and latex allergy do not cause this pattern."}, {"ty": "mc", "d": 3, "q": "Which action is the best?", "o": ["Protect from infection and prepare for stem cell replacement", "Give the scheduled MMR and varicella vaccines at the next visit", "Start cool mist humidification at home and discharge the infant", "Apply permethrin cream from head to toe and recheck in a week"], "a": [0], "y": "Right: she needs infection protection and transplant planning, with no live vaccines. Not MMR and varicella: live vaccines are dangerous. Not discharge with humidification: it ignores the risk. Not permethrin: that treats scabies."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 9-month-old was born to a mother with HIV. His ELISA is positive. His mother asks if this means he is infected.", "parts": [{"ty": "mc", "d": 3, "q": "Which test confirms infection at this age?", "o": ["PCR for HIV DNA or RNA", "Repeat ELISA in 1 week", "Platelet count", "Skin scraping"], "a": [0], "y": "Right: under 18 months PCR is used because maternal antibodies can make ELISA positive. Not repeat ELISA: the same limitation. Not platelets: shows bleeding risk. Not skin scraping: scabies and tinea."}, {"ty": "sata", "d": 3, "q": "Which teaching points should the nurse give the mother? Select all that apply.", "o": ["Everyday contact such as hugging is safe", "The infant needs a 3-drug regimen if confirmed", "Ongoing follow-up with labs and viral load checks", "The infant should not be held by family members", "Medication can stop once he looks well"], "a": [0, 1, 2], "y": "Right: HIV is not spread by everyday contact, treatment is a 3-drug regimen and follow-up continues. Not avoiding family: unnecessary isolation. Not stopping when he looks well: missed doses cause resistance."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 7-year-old with spina bifida has had many surgeries. During a catheter insertion he develops wheezing and swelling of the lips.", "parts": [{"ty": "mc", "d": 3, "q": "What is the likely problem?", "o": ["Latex allergy with anaphylaxis", "A viral exanthem, such as roseola infantum", "A tick-borne infection, such as Lyme disease", "A scabies reaction after skin contact with mites"], "a": [0], "y": "Right: spina bifida and many surgeries raise latex risk, and wheezing with lip swelling is anaphylaxis. A viral rash, tick-borne infection and scabies do not cause sudden airway swelling."}, {"ty": "mc", "d": 3, "q": "Which action comes first?", "o": ["Remove the latex source and call for help for possible anaphylaxis", "Continue the procedure so that it can be finished quickly and safely", "Apply a hot pack to the site and watch for any further swelling", "Give an antipyretic and observe him at home overnight with his parents"], "a": [0], "y": "Right: stop exposure and treat the airway. Not continuing, hot packs or antipyretic: they ignore the emergency."}, {"ty": "mc", "d": 3, "q": "Which food teaching is correct?", "o": ["Banana, avocado and kiwi may cross-react", "Foods never affect latex allergy in children with spina bifida", "Only citrus fruits cross-react with latex proteins in the body", "Cooked foods are always safe because heat destroys all proteins"], "a": [0], "y": "Right: some food proteins look like latex proteins. Not never, only citrus or cooked always safe: not true of the list."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 9-year-old has itching all over that is worse at night. There are burrows between his fingers and on his wrists. His younger sister has started scratching too.", "parts": [{"ty": "mc", "d": 3, "q": "Which condition fits?", "o": ["Scabies", "Tinea corporis", "Pediculosis capitis", "Pinworm infection"], "a": [0], "y": "Right: burrows between the fingers with night itching fit scabies. Tinea is ring-shaped and scaly. Head lice are on the scalp. Pinworm is rectal itching."}, {"ty": "mc", "d": 3, "q": "How is it diagnosed?", "o": ["Skin scraping", "Scotch tape test on 3 nights", "Throat culture", "Blood culture"], "a": [0], "y": "Right: skin scraping shows the mite. Not tape test: pinworm. Not throat or blood culture: other infections."}, {"ty": "sata", "d": 3, "q": "Which nursing actions apply? Select all that apply.", "o": ["Treat the whole family", "Wash bedding and clothing in hot water and dry hot", "Apply permethrin head to toe on clean skin", "Treat only the child", "Apply permethrin to the itchy areas only"], "a": [0, 1, 2], "y": "Right: scabies spreads by skin contact, so family and linens need treatment, and the drug goes head to toe. Not the child only or itchy areas only."}], "y": ""}, {"ty": "mc", "d": 3, "q": "A nurse uses the mnemonic MTV for airborne precautions. Which statement about it is correct?", "o": ["It covers measles, tuberculosis and varicella, and mumps is not part of it", "It covers mumps, tuberculosis and varicella, because all three spread by small particles", "It covers measles, tuberculosis and rubella, because all three cause a rash", "It covers meningitis, tuberculosis and varicella, because all three are serious"], "a": [0], "y": "Right: M is measles, T is tuberculosis and V is varicella. Not mumps: it is droplet. Not rubella: also droplet. Not meningitis: droplet. Severity and rash do not decide the precaution, particle size does."}, {"ty": "sata", "d": 3, "q": "Which children need droplet precautions? Select all that apply.", "o": ["A child with mumps", "A child with rubella", "A child with meningitis", "A child with pertussis", "A child with measles", "A child with active tuberculosis"], "a": [0, 1, 2, 3], "y": "Right: mumps, rubella, meningitis and pertussis spread by larger droplets over a short distance, so a private room and surgical mask are used. Not measles or active TB: these are airborne and need a negative pressure room and an N95."}, {"ty": "mc", "d": 3, "q": "After treating head lice, why must all bedding and clothing be washed in hot water?", "o": ["Eggs can live on surfaces for 3 to 7 days and could reinfest the child", "Lice survive on surfaces for a month and can jump back onto the child", "Hot water prevents the shampoo from being absorbed through the scalp", "Washing is only needed if the child's scalp has open sores from scratching"], "a": [0], "y": "Right: the review session said eggs live 3 to 7 days on surfaces. Not a month: lice live 48 hours off the host and they crawl rather than jump. Not shampoo absorption: the shampoo is on the scalp. Not open sores: laundry is needed for every case."}, {"ty": "mc", "d": 3, "q": "Which drugs are the anti-helminthic medications reviewed for pinworm?", "o": ["Pyrantel pamoate, albendazole and mebendazole", "Permethrin, spinosad and lindane, which kill lice and scabies mites", "Griseofulvin, tolnaftate and fluconazole, which are antifungal drugs", "Doxycycline, amoxicillin and cefuroxime, which are antibiotics for tick disease"], "a": [0], "y": "Right: these three treat worms. Not permethrin, spinosad and lindane: they treat lice and scabies. Not griseofulvin, tolnaftate and fluconazole: antifungals for ringworm. Not doxycycline, amoxicillin and cefuroxime: antibiotics for Lyme disease and RMSF."}, {"ty": "mc", "d": 3, "q": "Why does the instructor stress parental commitment when a child has pinworm?", "o": ["The whole household must follow treatment and hygiene or the worms are passed back", "Parents must give the dose by injection because the drugs are never given by mouth", "Parents must stop the medicine after one dose since a second dose is harmful", "Parents must keep the child out of school until the tape test is negative for a month"], "a": [0], "y": "Right: pinworm spreads fecal-orally, so one untreated person reinfects the others. Not injection: the drugs are oral. Not stopping after one dose: the dose is repeated in 2 weeks. Not a month out of school: not required."}, {"ty": "mc", "d": 3, "q": "Which assessment question best screens a child for Lyme disease?", "o": ["Has your child spent time in the woods or a wooded area?", "Has your child shared a hat or hairbrush with another child recently?", "Has your child been walking barefoot on soil or sand recently?", "Has your child had itching around the rectum at night this week?"], "a": [0], "y": "Right: Lyme disease comes from a tick bite, and ticks live in woods and brush. Not shared hats or brushes: head lice. Not barefoot on soil: hookworm. Not night rectal itching: pinworm."}, {"ty": "mc", "d": 3, "q": "A student says she will hold a lighter near an attached tick so it backs out. What is the best response?", "o": ["Do not use heat. Pull the tick straight up with fine-tipped tweezers", "Heat works only if the tick is also covered with petroleum jelly first", "Heat is fine if the lighter is held at least 2 inches from the skin", "Heat is correct if the tick is on the scalp where tweezers cannot reach"], "a": [0], "y": "Right: no heat and no petroleum jelly, and the tweezers pull is steady and straight up without twisting or jiggling. Not heat with jelly, or heat at a distance: both are unsafe and may make the tick release germs. Not heat on the scalp: tweezers work on any site."}, {"ty": "mc", "d": 3, "q": "Which teaching is correct for a child with athlete's foot?", "o": ["Apply an antifungal cream, keep the feet dry and change socks regularly", "Apply permethrin cream from head to toe and leave it on for 8 to 12 hours", "Keep the feet in damp socks overnight so the cream stays in place", "Give an oral antibiotic for 10 days and keep the feet covered at all times"], "a": [0], "y": "Right: athlete's foot is a fungal infection, and fungus grows in warm, moist skin. Not permethrin head to toe: that treats scabies. Not damp socks: moisture feeds the fungus. Not an antibiotic: antibiotics treat bacteria, not fungus."}, {"ty": "mc", "d": 3, "q": "When may a child with chickenpox return to school?", "o": ["When all of the lesions have crusted over", "When the fever has been gone for 24 hours and the itching has eased", "After the first vesicles appear and the child feels well enough to play", "After 14 days from the first spot, whatever the lesions look like"], "a": [0], "y": "Right: crusted lesions no longer hold live virus. Not a fever-free day: lesions may still be contagious. Not first vesicles: the child is still shedding virus. Not a fixed 14 days: the rule is based on the lesions."}, {"ty": "mc", "d": 3, "q": "Which child with chickenpox is the best candidate for an antiviral such as acyclovir?", "o": ["A child who is immunocompromised and therefore high risk", "A healthy 5-year-old with a few itchy lesions and no fever", "A healthy 8-year-old whose lesions are already crusted over", "A healthy toddler who has mild itching and sleeps well at night"], "a": [0], "y": "Right: antivirals are used for high-risk cases to slow the illness. Not a healthy child with a few lesions, crusted lesions or mild itching: oatmeal baths and comfort care are enough."}, {"ty": "mc", "d": 3, "q": "A mother asks when to put on the scabies cream. Which answer is best?", "o": ["After a shower at bedtime, leave it on, and rinse it off in the morning", "On the rash only after breakfast, and rinse it off at lunchtime that day", "After a shower in the morning, and leave it on for a full 24 hours", "At bedtime on unwashed skin, and rinse it off after 1 hour in the bath"], "a": [0], "y": "Right: head to toe on clean skin for 8 to 12 hours fits bedtime to morning. Not the rash only for a few hours: too short and incomplete. Not 24 hours: longer than ordered. Not unwashed skin for 1 hour: too short."}, {"ty": "mat", "d": 3, "q": "Match each drug to the condition it treats.", "pairs": [["Pyrantel pamoate", "Pinworm"], ["Permethrin cream", "Scabies"], ["Doxycycline", "Lyme disease"], ["Acyclovir", "High-risk chickenpox"], ["Antifungal cream", "Athlete's foot"]], "y": "Pyrantel pamoate is an anti-helminthic for pinworm. Permethrin treats scabies mites. Doxycycline treats Lyme disease. Acyclovir is an antiviral for high-risk chickenpox. Antifungal cream treats athlete's foot."}, {"ty": "mc", "d": 3, "q": "Which virus causes Koplik spots, and which rash shows slapped cheeks?", "o": ["Measles virus causes Koplik spots, and parvovirus B19 causes slapped cheeks", "Rubella virus causes Koplik spots, and roseola virus causes slapped cheeks", "Measles virus causes slapped cheeks, and parvovirus B19 causes Koplik spots", "Varicella virus causes Koplik spots, and rubella virus causes slapped cheeks"], "a": [0], "y": "Right: Koplik spots are white spots inside the cheeks in measles (rubeola), and slapped cheeks are fifth disease from parvovirus B19. The other pairs mix up rubella, roseola, varicella and the two signs."}, {"ty": "ngn", "d": 3, "scen": "A 6-year-old has had chickenpox for 3 days. His mother asks about school and what she can do for the itching.", "parts": [{"ty": "mc", "d": 3, "q": "When may he return to school?", "o": ["When all of the lesions have crusted over", "When the fever is gone for 24 hours", "When the first blisters stop appearing", "When he has been home for 14 days"], "a": [0], "y": "Right: crusted lesions are no longer contagious. Not 24 hours without a fever: lesions may still shed virus. Not the first blisters stopping: some may still be fluid filled. Not a fixed 14 days: the rule follows the lesions."}, {"ty": "sata", "d": 3, "q": "Which advice does the nurse give? Select all that apply.", "o": ["Give oatmeal baths for comfort", "Keep his nails short", "Ask the provider about an antiviral only if he is high risk", "Give aspirin for the aches", "Let him scratch the blisters open"], "a": [0, 1, 2], "y": "Right: oatmeal baths soothe, short nails limit scratching and antivirals are for high-risk children. Not aspirin: Reye syndrome. Not scratching: it scars and infects the skin."}], "y": ""}]}, "cram": [{"ty": "num", "d": 3, "q": "A child weighs 22 lb. Acetaminophen is ordered at 15 mg/kg per dose. How many mg per dose?", "ans": 150, "tol": 1, "unit": "mg", "y": "22 lb / 2.2 = 10 kg. 15 mg/kg x 10 kg = 150 mg per dose.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "The ordered dose is 150 mg. The liquid is 160 mg per 5 mL. How many mL does the nurse give? (Round to the nearest tenth.)", "ans": 4.7, "tol": 0.1, "unit": "mL", "y": "150 mg / 32 mg per mL = 4.69, which rounds to 4.7 mL. (160 mg / 5 mL = 32 mg per mL.)", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 33 lb. What is the weight in kg?", "ans": 15, "tol": 0.1, "unit": "kg", "y": "33 lb / 2.2 = 15 kg.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "Ibuprofen 10 mg/kg per dose is ordered for a 15 kg child. The liquid is 100 mg per 5 mL. How many mL? ", "ans": 7.5, "tol": 0.1, "unit": "mL", "y": "10 mg/kg x 15 kg = 150 mg. 100 mg per 5 mL is 20 mg per mL. 150 / 20 = 7.5 mL.", "tp": "dose"}, {"ty": "num", "d": 2, "q": "A child's temperature is 102.2 F. What is it in degrees Celsius?", "ans": 39, "tol": 0.1, "unit": "C", "y": "(102.2 - 32) x 5/9 = 70.2 x 5/9 = 39 C.", "tp": "dose"}, {"ty": "mc", "d": 3, "q": "A 12 kg child is ordered acetaminophen 200 mg. The safe range is 10 to 15 mg/kg per dose. What should the nurse do?", "o": ["Hold the dose and clarify, since 200 mg is above the 180 mg maximum", "Give the dose because 200 mg is within the range for this child", "Give half the dose and document that it was reduced", "Give the dose and recheck the temperature in 30 minutes"], "a": [0], "y": "Right: 10 to 15 mg/kg x 12 kg = 120 to 180 mg, so 200 mg is too high. Not giving it: above range. Not half: changing a dose is not the nurse's decision. Not giving and rechecking: harm can happen before the recheck."}, {"ty": "mc", "d": 3, "q": "A 15 kg child is ordered 90 mg of acetaminophen. The safe range is 10 to 15 mg/kg per dose. Which statement is correct?", "o": ["90 mg is below the range of 150 to 225 mg, so clarify", "90 mg is within the range so it can be given as ordered", "90 mg is above the range so it should be held and clarified", "The range cannot be found without knowing the child's height"], "a": [0], "y": "Right: 10 to 15 mg/kg x 15 kg = 150 to 225 mg, so 90 mg is too low to be effective. Not within or above: wrong comparison. Not height: dosing is by weight."}, {"ty": "mc", "d": 3, "q": "A parent says her child's weight is 44 lb. How many kilograms does the nurse use?", "o": ["20 kg", "9.5 kg", "44 kg", "96.8 kg"], "a": [0], "y": "Right: 44 / 2.2 = 20 kg. Not 9.5 kg: that divides by 4.6. Not 44: the pounds. Not 96.8: that multiplies by 2.2."}, {"ty": "mc", "d": 3, "q": "A nurse is ordered a drug at 5 mg/kg per dose for a 24 kg child. How much is given per dose?", "o": ["120 mg", "4.8 mg", "29 mg", "240 mg"], "a": [0], "y": "Right: 5 x 24 = 120 mg. Not 4.8: divides instead of multiplies. Not 29: adds. Not 240: doubled."}, {"ty": "mc", "d": 3, "q": "Which statement correctly describes the types of immunity?", "o": ["Passive is received, cellular is T cells, humoral is B cells", "Passive is B cells, cellular is received, humoral is T cells", "Passive is T cells, cellular is B cells, humoral is received", "Passive is received, cellular is B cells, humoral is T cells"], "a": [0], "y": "Right: this matches the slide. The other options swap the cells or the definition."}, {"ty": "mc", "d": 3, "q": "A baby had a recent exposure to a parent with active tuberculosis. Which precaution applies?", "o": ["Airborne in a negative pressure room", "Droplet with a surgical mask", "Contact with a gown and gloves", "Reverse isolation for the nurse"], "a": [0], "y": "Right: TB is airborne. Not droplet or contact: wrong routes. Not reverse isolation: protects an immunocompromised patient and is not for TB."}, {"ty": "mc", "d": 3, "q": "A nurse prepares to give a 4-month-old's vaccines. Which set is on the slide for 4 months?", "o": ["DTaP, RV, IPV and PCV", "DTaP, RV, IPV, Hib, PCV and Hep B", "MMR and varicella", "Hep A and flu"], "a": [0], "y": "Right: four vaccines at 4 months on the slide. Not the six-vaccine set: that is 2 and 6 months. Not MMR and varicella: toddler. Not Hep A and flu: later."}, {"ty": "sata", "d": 3, "q": "Which findings are in the nursing assessment of severe combined immune deficiency? Select all that apply.", "o": ["Chronic diarrhea", "Persistent thrush", "Failure to thrive", "Very low immunoglobulins", "Slapped cheeks", "Koplik spots"], "a": [0, 1, 2, 3], "y": "Right: these are the SCID slide findings. Not slapped cheeks or Koplik spots: viral rash illnesses."}, {"ty": "sata", "d": 3, "q": "Which are mechanisms of immunity on the Chapter 25 slide? Select all that apply.", "o": ["The lymph system and spleen filter plasma", "Phagocytes reach adult chemotaxis at age 7", "T cells do not cross the placenta", "Infant B cells respond less well than adults", "Humoral immunity is fully developed at birth", "IgM crosses the placenta"], "a": [0, 1, 2, 3], "y": "Right: these four are on the slide. Not humoral fully developed: develops over time. Not IgM: does not cross."}, {"ty": "sata", "d": 3, "q": "Which are parasitic or helminthic infections on the slide? Select all that apply.", "o": ["Pediculosis capitis", "Scabies", "Pinworm", "Hookworm", "Fifth disease", "Roseola"], "a": [0, 1, 2, 3], "y": "Right: lice, scabies, pinworm and hookworm are listed. Not fifth disease or roseola: viral."}, {"ty": "sata", "d": 3, "q": "Which nursing interventions promote skin integrity? Select all that apply.", "o": ["Keep fingernails short", "Encourage the child to press on the itchy area rather than scratch", "Encourage fluid intake and proper nutrition", "Use antipruritics and topical ointments as ordered", "Allow scratching for comfort", "Restrict fluids"], "a": [0, 1, 2, 3], "y": "Right: these match the slide. Not scratching: damages skin. Not fluid restriction: the slide says encourage fluids."}, {"ty": "sata", "d": 3, "q": "Which are the six types of infectious disease on the slide? Select all that apply.", "o": ["Bacterial", "Viral", "Zoonotic", "Vector-borne", "Parasitic and helminthic", "Sexually transmitted", "Autoimmune", "Allergic"], "a": [0, 1, 2, 3, 4, 5], "y": "Right: the six types. Not autoimmune or allergic: those are immune disorders, not infection types."}, {"ty": "mat", "d": 3, "q": "Match each virus to its common name.", "pairs": [["Rubella", "German measles"], ["Rubeola", "Measles"], ["Varicella zoster", "Chickenpox"], ["Roseola infantum", "Sixth disease"]], "y": "Rubella is German measles. Rubeola is measles. Varicella zoster is chickenpox. Roseola is the sixth disease."}, {"ty": "mat", "d": 3, "q": "Match each vaccine to its route.", "pairs": [["MMR", "Under the skin"], ["DTaP", "Into the thigh or upper arm muscle"], ["LAIV", "Nasal spray"], ["Rotavirus", "By mouth"]], "y": "MMR is a live vaccine given subcutaneously (under the skin). DTaP is intramuscular, the thigh for infants and the deltoid for older children. LAIV is the intranasal flu spray. Rotavirus is the live oral vaccine."}, {"ty": "mat", "d": 3, "q": "Match each term to its meaning.", "pairs": [["Vertical transmission", "Mother to infant in utero or through breast milk"], ["Horizontal transmission", "Nonsterile needles, blood products or tattooing"], ["Zoonotic", "Passed directly or indirectly from animals to humans"], ["Vector-borne", "Passed by ticks, mosquitoes or other insects"]], "y": "Vertical means mother to baby, horizontal means contact with blood, zoonotic means from an animal, and vector-borne means carried by an insect."}, {"ty": "mat", "d": 3, "q": "Match each drug to its use.", "pairs": [["Doxycycline", "Lyme disease and Rocky Mountain spotted fever"], ["Permethrin", "Scabies and head lice"], ["Griseofulvin", "Ringworm of the scalp"], ["Zidovudine", "HIV (an NRTI)"]], "y": "Doxycycline treats both tick diseases. Permethrin treats scabies and lice. Griseofulvin treats scalp ringworm. Zidovudine is an NRTI used for HIV."}, {"ty": "ord", "d": 3, "q": "Put the stages of infection in order.", "items": ["Incubation", "Prodrome", "Illness", "Convalescence"], "y": "Germ multiplies, vague symptoms, clear disease, recovery."}, {"ty": "ord", "d": 3, "q": "Put these vaccine milestones in order.", "items": ["Hepatitis B at birth", "DTaP, RV, IPV, Hib, PCV, Hep B at 2 months", "Flu vaccine starts at 6 months", "MMR at 12 to 15 months", "Tdap, HPV and MenACWY at 11 to 12 years"], "y": "Newborn Hep B, the 2-month set, flu at 6 months, MMR at 12 to 15 months, and the adolescent set at 11 to 12."}, {"ty": "ord", "d": 3, "q": "Put the pinworm tape test in order.", "items": ["Wait until the child is asleep at night", "Press clear tape over the rectum", "Remove the tape and look for eggs", "Repeat on 3 consecutive nights"], "y": "Worms come out at night, so tape is placed after sleep, the tape is examined, and it is repeated."}, {"ty": "ord", "d": 3, "q": "Put the fever pathway in order.", "items": ["Infection stimulates endogenous pyrogens", "Pyrogens act on the hypothalamus", "Prostaglandin production raises the set point", "Shivering and vasoconstriction decrease heat loss", "Fever occurs"], "y": "Pyrogens lead to prostaglandins, which raise the set point, so the body conserves heat until the fever occurs."}, {"ty": "mc", "d": 3, "q": "Which action is the most important in preventing infection?", "o": ["Hand washing", "Wearing the same gown all day", "Giving antibiotics at the first sign of fever", "Keeping the room at a high temperature"], "a": [0], "y": "Right: hand washing is bold on the slide. The other options do not stop spread and some promote resistance."}, {"ty": "mc", "d": 3, "q": "A mother says Lyme disease can only be seen at the tick bite. What is the best correction?", "o": ["The bull's-eye rash can appear anywhere on the body", "It appears only on the palms and soles of the feet", "It appears only on the scalp where the tick attached", "It does not occur in children and only occurs in adults"], "a": [0], "y": "Right: the note says anywhere. Not palms and soles: RMSF pattern. Not scalp only or not in children: untrue."}, {"ty": "mc", "d": 3, "q": "Which infection is spread by swallowing microscopic eggs by the fecal-oral route?", "o": ["Pinworm", "Scabies", "Head lice", "Ringworm"], "a": [0], "y": "Right: Enterobius vermicularis eggs. Not scabies or lice: contact. Not ringworm: fungal, contact."}, {"ty": "mc", "d": 3, "q": "Which statement about phagocytes in children is correct?", "o": ["They show decreased chemotaxis and reach adult levels at age 7", "They are fully mature at birth and match adult function", "They only begin to act after about age 12 years", "They are exactly the same in children and in adults"], "a": [0], "y": "Right: from the slide. The other options are untrue."}, {"ty": "mc", "d": 3, "q": "A newborn is breastfed and the mother's antibodies give the baby protection. What kind of immunity is this?", "o": ["Natural passive immunity", "Artificial active immunity", "Natural active immunity", "Humoral immunity made by the baby's B cells"], "a": [0], "y": "Right: the lecture called this natural passive. Not artificial active: that is a vaccine. Not natural active: that follows the child's own infection. Not baby's B cells: breast milk antibodies come from the mother."}, {"ty": "mc", "d": 3, "q": "Which highlighted finding on the viral exanthem slide goes with fifth disease?", "o": ["Slapped cheek", "Koplik spots", "Bull's-eye rash", "Burrows"], "a": [0], "y": "Right: the slide highlights slapped cheek or fifth disease. Not Koplik spots: measles. Not bull's-eye: Lyme. Not burrows: scabies."}, {"ty": "mc", "d": 3, "q": "Which statement shows understanding of the chronic illness slide?", "o": ["Chronic illness often needs specialized supervision and more frequent visits", "These children need fewer visits since the specialists see them already", "These children do not need routine immunizations because they are ill", "These children do not need a medical home at all if a specialist follows them"], "a": [0], "y": "Right: from the slide. The other options are untrue."}, {"ty": "mc", "d": 3, "q": "Which immunoglobulins do not cross the placenta according to the slide?", "o": ["IgA, IgD, IgE and IgM", "IgG only", "IgA and IgG", "IgM and IgG"], "a": [0], "y": "Right: the four named immunoglobulins do not cross. IgG is the one that does, which is why it is not on the list."}, {"ty": "mc", "d": 3, "q": "A child allergic to latex asks about food. Which food list includes cross-reacting foods?", "o": ["Banana, avocado, kiwi and chestnut", "Rice, chicken, milk and bread", "Lamb, salmon, cheese and eggs", "Oats, butter, honey and yogurt"], "a": [0], "y": "Right: the classic cross-reacting foods. The other options are not on the list."}, {"ty": "mc", "d": 3, "q": "Which action should the nurse take first for a child with latex allergy symptoms after a catheter insertion?", "o": ["Remove the latex source and call for help for possible anaphylaxis", "Apply a hot pack to the site and keep observing the child quietly", "Give a bath and observe the child at home overnight with a parent", "Continue the procedure to finish it quickly as it was planned"], "a": [0], "y": "Right: stop the exposure and respond to anaphylaxis. Not a hot pack: does nothing for IgE reactions. Not home bath: unsafe. Not continuing: increases exposure."}, {"ty": "mc", "d": 3, "q": "A medical home provider coordinates specialty care. Which characteristic is this?", "o": ["Delivery of specialty care is coordinated in the medical home", "Care is limited to the first year of life only, then ends", "The provider only sees patients for sick visits and not for well care", "The family decides to see only one specialist for all of its needs"], "a": [0], "y": "Right: this is a listed characteristic. The other options contradict the long-term, comprehensive design."}, {"ty": "mc", "d": 3, "q": "Which statement is correct about antibiotics?", "o": ["Finish the full course and use them judiciously to avoid resistance", "Stop taking them as soon as the fever is gone and the child plays", "Give them for every viral rash to prevent a later bacterial infection", "Use leftover antibiotics at home for the next illness that comes"], "a": [0], "y": "Right: judicious use is on the prevention slide. The other options increase resistance."}, {"ty": "mc", "d": 3, "q": "Which action is correct for a child with chickenpox and fever?", "o": ["Give acetaminophen, not aspirin", "Give aspirin for the fever and aches", "Give a cold bath until the fever is gone", "Give no fluids until the rash fades"], "a": [0], "y": "Right: aspirin is linked to Reye syndrome. Not a cold bath: causes shivering. Not withholding fluids: hydration is a priority."}, {"ty": "ngn", "d": 3, "scen": "A 3-year-old attends daycare. His mother reports nighttime itching around the rectum and restless sleep. The nurse sees small scratch marks near the rectum.", "parts": [{"ty": "mc", "d": 3, "q": "Which infection is most likely?", "o": ["Pinworm", "Scabies", "Head lice", "Tinea"], "a": [0], "y": "Right: nocturnal perianal itch suggests pinworm. Not scabies: burrows between fingers. Not lice: scalp. Not tinea: a ring-shaped rash."}, {"ty": "mc", "d": 3, "q": "Which test is used?", "o": ["Clear tape test on 3 consecutive nights", "Skin scraping read under the microscope", "Throat culture swabbed from the back of the throat", "Blood culture drawn before an antibiotic"], "a": [0], "y": "Right: tape placed at night after the child sleeps. Not skin scraping: scabies and tinea. Not cultures: wrong specimen."}, {"ty": "sata", "d": 3, "q": "Which teaching points apply? Select all that apply.", "o": ["Handwashing after the toilet and before meals", "Keep nails short", "Wash bedding and underwear in hot water", "Apply permethrin head to toe", "Give griseofulvin"], "a": [0, 1, 2], "y": "Right: hygiene breaks the fecal-oral cycle. Not permethrin or griseofulvin: not pinworm drugs."}], "y": ""}, {"ty": "num", "d": 3, "q": "A child weighs 18 lb. Ibuprofen is ordered at 10 mg/kg per dose. How many mg per dose? (Round to the nearest whole number.)", "ans": 82, "tol": 1, "unit": "mg", "y": "18 lb / 2.2 = 8.2 kg. 8.2 kg x 10 mg/kg = 82 mg. Convert pounds to kilograms first, because the order is per kg.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "The ordered dose is 120 mg. The liquid is 160 mg per 5 mL. How many mL does the nurse give? (Round to the nearest tenth.)", "ans": 3.8, "tol": 0.1, "unit": "mL", "y": "120 / 160 x 5 = 3.75, which rounds to 3.8 mL. Dose wanted over dose on hand times the volume.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 26 lb. What is the weight in kg? (Round to the nearest tenth.)", "ans": 11.8, "tol": 0.1, "unit": "kg", "y": "26 / 2.2 = 11.8 kg. Pounds divided by 2.2 gives kilograms.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "Ibuprofen drops are 50 mg per 1.25 mL. The order is 75 mg. How many mL does the nurse give? (Round to the nearest tenth.)", "ans": 1.9, "tol": 0.1, "unit": "mL", "y": "75 / 50 x 1.25 = 1.875, which rounds to 1.9 mL.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child's temperature is 38.5 C. What is it in degrees F? (Round to the nearest tenth.)", "ans": 101.3, "tol": 0.1, "unit": "F", "y": "38.5 x 9/5 = 69.3. 69.3 + 32 = 101.3 F.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child's temperature is 104 F. What is it in degrees C?", "ans": 40, "tol": 0.1, "unit": "C", "y": "(104 - 32) x 5/9 = 72 x 5/9 = 40 C.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "Amoxicillin is ordered at 40 mg/kg/day divided every 8 hours. The child weighs 15 kg. How many mg per dose?", "ans": 200, "tol": 1, "unit": "mg", "y": "40 x 15 = 600 mg per day. Every 8 hours is 3 doses. 600 / 3 = 200 mg per dose.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "The amoxicillin dose is 200 mg. The liquid is 250 mg per 5 mL. How many mL does the nurse give?", "ans": 4, "tol": 0.1, "unit": "mL", "y": "200 / 250 x 5 = 4 mL.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "Using 100 mL/kg for the first 10 kg and 50 mL/kg for the next 10 kg, what is the daily maintenance fluid for a 14 kg child in mL?", "ans": 1200, "tol": 1, "unit": "mL per day", "y": "First 10 kg: 10 x 100 = 1,000 mL. Next 4 kg: 4 x 50 = 200 mL. Total 1,200 mL per day.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "An 8 kg infant needs 100 mL/kg per day of maintenance fluid. How many mL per day?", "ans": 800, "tol": 1, "unit": "mL per day", "y": "Under 10 kg: 100 mL x 8 kg = 800 mL per day.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 44 lb. Acetaminophen is ordered at 15 mg/kg per dose. The liquid is 160 mg per 5 mL. How many mL does the nurse give? (Round to the nearest tenth.)", "ans": 9.4, "tol": 0.1, "unit": "mL", "y": "44 lb / 2.2 = 20 kg. 20 x 15 = 300 mg. 300 / 160 x 5 = 9.375, which rounds to 9.4 mL.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 66 lb. The safe range for acetaminophen is 10 to 15 mg/kg per dose. What is the maximum safe single dose in mg?", "ans": 450, "tol": 1, "unit": "mg", "y": "66 / 2.2 = 30 kg. 30 x 15 = 450 mg. The upper end of the range is the maximum.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "Doxycycline is ordered at 2.2 mg/kg per dose for a child who weighs 25 kg. How many mg per dose?", "ans": 55, "tol": 0.5, "unit": "mg", "y": "2.2 x 25 = 55 mg.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A child weighs 52 lb. The order is 5 mg/kg per dose. How many mg per dose? (Round to the nearest whole number.)", "ans": 118, "tol": 1, "unit": "mg", "y": "52 / 2.2 = 23.6 kg. 23.6 x 5 = 118 mg.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "An infant weighs 9.5 kg. What is the weight in pounds? (Round to the nearest tenth.)", "ans": 20.9, "tol": 0.1, "unit": "lb", "y": "9.5 x 2.2 = 20.9 lb.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A 12 kg child is ordered ibuprofen 10 mg/kg per dose. The liquid is 100 mg per 5 mL. How many mL does the nurse give?", "ans": 6, "tol": 0.1, "unit": "mL", "y": "12 x 10 = 120 mg. 120 / 100 x 5 = 6 mL.", "tp": "dose"}, {"ty": "num", "d": 3, "q": "A 14 kg child needs 1,200 mL of fluid per day. How many mL per hour is that?", "ans": 50, "tol": 1, "unit": "mL per hour", "y": "1,200 mL / 24 hours = 50 mL per hour.", "tp": "dose"}, {"ty": "mc", "d": 3, "q": "A 20 kg child is ordered ibuprofen 250 mg. The safe range is 5 to 10 mg/kg per dose. What should the nurse do?", "o": ["Hold the dose and clarify, since the range is 100 to 200 mg", "Give the dose, since 250 mg is within the safe range", "Give 200 mg without calling, because it is the highest safe dose", "Give the dose and recheck the temperature in 30 minutes"], "a": [0], "y": "Right: 20 x 5 = 100 mg and 20 x 10 = 200 mg, so 250 mg is above the range and must be clarified. Not giving it: overdose risk. Not 200 mg without calling: changing an order needs the prescriber. Not recheck in 30 minutes: temperature timing does not make the dose safe."}, {"ty": "mc", "d": 3, "q": "An 8 kg infant is ordered acetaminophen 100 mg. The safe range is 10 to 15 mg/kg per dose. Which statement is correct?", "o": ["The range is 80 to 120 mg, so the dose is safe to give", "The range is 80 to 120 mg, so the dose is too high and is held", "The range is 100 to 150 mg, so the dose is too low and is increased", "The range cannot be found without the infant's height and length"], "a": [0], "y": "Right: 8 x 10 = 80 mg and 8 x 15 = 120 mg, and 100 mg is inside. Not too high: 100 is below 120. Not 100 to 150: that uses the wrong weight. Not height: pediatric doses use weight."}, {"ty": "mc", "d": 3, "q": "A child weighs 36 lb and the order is 15 mg/kg per dose. Which calculation is correct?", "o": ["36 / 2.2 = 16.4 kg, then 16.4 x 15 = 246 mg", "36 x 2.2 = 79.2 kg, then 79.2 x 15 = 1,188 mg", "36 x 15 = 540 mg, with no weight conversion", "36 / 15 = 2.4, then 2.4 x 2.2 = 5.3 mg"], "a": [0], "y": "Right: divide pounds by 2.2 for kilograms, then multiply by mg/kg. Not multiplying by 2.2: that makes the child look much heavier. Not skipping conversion: the order is per kg. Not dividing by 15: the units do not work."}, {"ty": "mc", "d": 3, "q": "A 12 kg child is ordered 30 mg/kg/day divided every 6 hours. How many mg per dose?", "o": ["90 mg", "360 mg", "30 mg", "120 mg"], "a": [0], "y": "Right: 30 x 12 = 360 mg per day, divided into 4 doses is 90 mg. Not 360: that is the whole day. Not 30: that is the per-kg amount. Not 120: that divides by 3 instead of 4."}, {"ty": "mc", "d": 3, "q": "Why must pounds be converted to kilograms before calculating a pediatric dose?", "o": ["Doses are ordered per kg, so pounds make the dose 2.2 times off", "Kilograms are only used for IV drugs and are not used for oral drugs", "The child's weight in pounds is not accurate on a scale in a clinic", "Pounds are only used for infants who weigh under 10 pounds"], "a": [0], "y": "Right: mg/kg orders need kg, and pounds would give a dose far too large. Not IV only: oral drugs use mg/kg too. Not inaccurate scales: the scale is fine. Not infants only: all weight-based orders use kg."}, {"ty": "mc", "d": 3, "q": "Which set is on the vaccine card for a child at 12 to 15 months?", "o": ["MMR #1, varicella #1, Hib booster and PCV booster", "DTaP #5, IPV #4, MMR #2 and varicella #2 as the main set", "Tdap, HPV and MenACWY #1 as the school-age set", "DTaP #4 and hepatitis A only, which are given at 15 months"], "a": [0], "y": "Right: these four are the toddler set at 12 to 15 months. Not DTaP #5, IPV #4, MMR #2 and varicella #2: that is the 4 to 6 year set. Not Tdap, HPV and MenACWY: ages 11 to 12. Not DTaP #4 and hepatitis A only: DTaP #4 is at 15 to 18 months, and hepatitis A is 12 to 23 months."}, {"ty": "mc", "d": 3, "q": "Which vaccines are due at 4 to 6 years?", "o": ["DTaP #5, IPV #4, MMR #2 and varicella #2", "MMR #1, varicella #1, Hib and PCV boosters", "Tdap, HPV and MenACWY #1", "MenACWY booster and seasonal flu only"], "a": [0], "y": "Right: these are the preschool boosters. Not the first set: that is toddler. Not Tdap, HPV and MenACWY: 11 to 12 years. Not MenACWY booster and flu: the booster is at 16."}, {"ty": "mc", "d": 3, "q": "A 12-year-old begins the HPV series. How many doses are given?", "o": ["Two doses, 6 to 12 months apart, because she started before age 15", "Three doses, because HPV always needs 3 doses at any age of starting", "One dose only, because she is a girl and the vaccine works fast", "Two doses given 1 week apart, because she started before age 15"], "a": [0], "y": "Right: starting before 15 needs 2 doses 6 to 12 months apart. Not 3 doses: that is for starting at 15 or older. Not one dose: the series needs more. Not 1 week apart: the interval is months."}, {"ty": "mc", "d": 3, "q": "Which vaccine is given at age 7 and older, including the 11 to 12 year booster and each pregnancy?", "o": ["Tdap", "DTaP", "Hib", "MMR"], "a": [0], "y": "Right: Tdap uses reduced doses of diphtheria and pertussis for older children and adults. Not DTaP: used under age 7. Not Hib or MMR: different diseases."}, {"ty": "mc", "d": 3, "q": "Which infant should NOT receive the rotavirus vaccine?", "o": ["An infant with a history of intussusception", "An infant who is exclusively breastfed and growing well", "An infant with a mild cold and a runny nose today", "An infant who was born premature at 34 weeks and is now 2 months old"], "a": [0], "y": "Right: a history of intussusception or severe combined immunodeficiency is a contraindication. Not breastfed, mild cold or premature: these are not reasons to delay."}, {"ty": "mc", "d": 3, "q": "A 3-year-old with a temperature of 103 F and moderate illness is due for vaccines. How is this classified?", "o": ["A precaution: weigh risk and benefit, and usually postpone", "A contraindication: the vaccine can never be given to the child", "Not a reason to delay: give all of the vaccines today as scheduled", "A reason to give a double dose of each vaccine at a later visit"], "a": [0], "y": "Right: moderate or severe acute illness is a precaution. Not contraindication: that is anaphylaxis or live vaccines in severe immunodeficiency. Not mild illness: this is moderate. Not a double dose: never done."}, {"ty": "mc", "d": 3, "q": "Why is aspirin avoided in a child with a viral illness such as chickenpox or after vaccines?", "o": ["It is linked to Reye syndrome, so acetaminophen is used instead", "It causes the vaccine to be less effective for the rest of the life", "It causes the rash to spread to the palms and soles of the feet", "It makes the child's temperature rise higher than the original fever"], "a": [0], "y": "Right: Reye syndrome causes liver and brain swelling. Not vaccine effectiveness: not a known effect. Not rash spread: not the issue. Not raising temperature: aspirin lowers fever, but the risk is Reye syndrome."}, {"ty": "mc", "d": 3, "q": "Why do infants get more ear infections than adults?", "o": ["Their eustachian tubes are short, wide and horizontal", "Their eustachian tubes are long, narrow and vertical like an adult's", "Their ears have no immune cells, so germs are never cleared", "Their ear canals are filled with fat, which traps germs inside"], "a": [0], "y": "Right: short, wide, horizontal tubes let germs travel from the throat and drain poorly. Not long, narrow, vertical: that is closer to adult anatomy. Not no immune cells or fat-filled canals: not the reason."}, {"ty": "mc", "d": 3, "q": "Which statement describes lymphocytes?", "o": ["They produce and maintain the response and include B, T and NK cells", "They are the first line of defense and eat germs as soon as they arrive", "They are the second line and become macrophages in the tissues", "They are the cells that rise first with a bacterial infection in the blood"], "a": [0], "y": "Right: lymphocytes build and maintain the response. Not first line eating germs: granulocytes. Not second line and macrophages: monocytes. Not first to rise in bacterial infection: neutrophils, which are granulocytes."}, {"ty": "mc", "d": 3, "q": "Which marker rises and falls faster during infection?", "o": ["C-reactive protein (CRP)", "Erythrocyte sedimentation rate (ESR)", "Blood culture", "Complete blood count with differential"], "a": [0], "y": "Right: CRP changes quickly, while ESR rises and falls slowly. Not blood culture: it finds the germ, not inflammation. Not CBC: it counts cells."}, {"ty": "mc", "d": 3, "q": "Why is a blood culture collected before the first antibiotic dose?", "o": ["The antibiotic could kill the germs and make the culture falsely negative", "The culture needs the antibiotic in the blood so that the germs can grow", "The first dose must be given by the lab technician at the bedside only", "Blood drawn after the dose damages the specimen in the collection tube"], "a": [0], "y": "Right: giving the drug first can hide the germ and the sensitivity result. Not needing antibiotic to grow: the opposite. Not technician: not the reason. Not damage to the specimen: the issue is a falsely negative result."}, {"ty": "mc", "d": 3, "q": "A 6-week-old has a temperature of 100.6 F (38.1 C). Which action is correct?", "o": ["Notify the provider for urgent evaluation", "Give acetaminophen and recheck in 4 hours", "Give a lukewarm bath and watch at home", "Wait 24 hours to see if it returns"], "a": [0], "y": "Right: fever in an infant under 3 months needs urgent evaluation, because serious infection can be hidden. Not antipyretic and recheck, or a bath: delays diagnosis. Not waiting 24 hours: unsafe."}, {"ty": "mc", "d": 3, "q": "Which is an influencing factor for autoimmune disease?", "o": ["Hormones", "Vitamin C intake", "Frequent handwashing", "Daycare attendance"], "a": [0], "y": "Right: heredity, hormones, self-marker molecules, environmental influences, viruses and certain drugs are listed. Not vitamin C, handwashing or daycare: these are not listed."}, {"ty": "mc", "d": 3, "q": "What does plasmapheresis do?", "o": ["Filters harmful antibodies out of the plasma", "Gives the child borrowed antibodies from donors", "Replaces the missing T and B cell source", "Slows autoimmune joint disease over years"], "a": [0], "y": "Right: plasmapheresis removes harmful antibodies. Not borrowed antibodies: IVIG. Not replacing the source: stem cell transplant. Not slowing joint disease: DMARDs."}, {"ty": "mc", "d": 3, "q": "A child scratched by a kitten develops a papule and tender swollen nodes near the site. How is this infection classified?", "o": ["Zoonotic, passed from animals to humans", "Vector-borne, spread by a tick", "Parasitic, caused by mites", "Sexually transmitted, spread by contact"], "a": [0], "y": "Right: cat-scratch fever (Bartonella henselae) is zoonotic. Not vector-borne: ticks and mosquitoes. Not parasitic: lice and scabies. Not sexually transmitted: not the route."}, {"ty": "mc", "d": 3, "q": "A child is bitten by a raccoon. Which first action is correct?", "o": ["Wash the wound with soap and water for 15 minutes, then seek prophylaxis", "Apply permethrin cream to the wound and cover it with a clean dressing", "Cover the wound with a bandage and watch the child for symptoms", "Give doxycycline and wait for the PCR results before doing anything else"], "a": [0], "y": "Right: washing reduces virus in the wound, and rabies immune globulin plus vaccine are given because rabies is fatal once symptoms begin. Not permethrin: for mites. Not watching: symptoms mean it is too late. Not doxycycline: for tick diseases."}, {"ty": "mc", "d": 3, "q": "A child who plays barefoot develops an itchy rash on his foot and later iron-deficiency anemia. Which infection fits, and what is the teaching?", "o": ["Hookworm, and wear shoes to prevent larvae from entering the skin", "Pinworm, and wash bedding in hot water and treat the household too", "Scabies, and apply permethrin head to toe for 8 to 12 hours daily", "Head lice, and avoid sharing combs and hats with other children now"], "a": [0], "y": "Right: hookworm larvae in soil enter bare skin and cause blood loss anemia. Not pinworm: rectal itching at night. Not scabies: burrows. Not lice: scalp."}, {"ty": "mc", "d": 3, "q": "Why should the nurse explain that IVIG gives only temporary protection?", "o": ["It gives borrowed antibodies, which fade, so it must be repeated", "It destroys the child's T cells and B cells during each infusion", "It trains the child's own cells to remember the germ for many years", "It is made from the child's own plasma and returned to the body"], "a": [0], "y": "Right: IVIG is passive immunity from donors. Not destroying T and B cells: not a mechanism. Not training cells: active immunity from vaccines. Not own plasma: donor immunoglobulin."}, {"ty": "sata", "d": 3, "q": "Which actions are part of standard precautions for every patient? Select all that apply.", "o": ["Hand hygiene", "Gloves when touching blood or body fluids", "Mask or eye protection when fluids could splash", "Gown when clothing could be soiled", "N95 for every patient", "A negative pressure room for every patient"], "a": [0, 1, 2, 3], "y": "Right: standard precautions are tier one for every patient, with handwashing as the key action. Not N95 or negative pressure for everyone: those are airborne precautions for specific diseases."}, {"ty": "sata", "d": 3, "q": "Which items belong in the health history of a child with a suspected infection? Select all that apply.", "o": ["Immunization status", "Known exposure to ill contacts", "Recent travel", "Changes in feeding or irritability", "The child's favorite toy", "The color of the child's bedroom"], "a": [0, 1, 2, 3], "y": "Right: immunization status, exposure, travel and behavior changes are on the slide. Not favorite toy or bedroom color: unrelated."}, {"ty": "sata", "d": 3, "q": "Which instructions are correct after vaccines? Select all that apply.", "o": ["Soreness, redness and low-grade fever are expected", "Give acetaminophen as directed", "Call for hives or trouble breathing", "Never give aspirin", "Apply a hot pack to the site for 30 minutes", "Give aspirin for any fever"], "a": [0, 1, 2, 3], "y": "Right: expected reactions, acetaminophen, danger signs and avoiding aspirin. Not a hot pack for 30 minutes or aspirin: unsafe or unsupported."}, {"ty": "sata", "d": 3, "q": "Which factors explain why children get more infections? Select all that apply.", "o": ["An immature immune system with no memory yet", "Short, wide, horizontal eustachian tubes", "Small airways that swell and block easily", "Constant exposure at daycare and school", "Adult-level phagocytes from birth", "A fully mature spleen at birth"], "a": [0, 1, 2, 3], "y": "Right: these four are on the slide. Not adult-level phagocytes or a mature spleen: the slide says phagocytes reach adult levels at age 7."}, {"ty": "sata", "d": 3, "q": "Which are causes of secondary immunodeficiency? Select all that apply.", "o": ["Chemotherapy", "Malnutrition", "HIV infection", "Immunosuppressive medication", "Severe combined immunodeficiency", "DiGeorge syndrome"], "a": [0, 1, 2, 3], "y": "Right: acquired causes lower immunity. Not SCID or DiGeorge: these are primary and mostly hereditary or congenital."}, {"ty": "sata", "d": 3, "q": "Which treatments are used in immune disorders? Select all that apply.", "o": ["IV immunoglobulins", "Plasmapheresis", "Disease-modifying antirheumatic drugs", "Stem cell transplantation", "Permethrin cream", "Tolnaftate cream"], "a": [0, 1, 2, 3], "y": "Right: these are on the treatment list. Not permethrin or tolnaftate: they treat scabies and tinea."}, {"ty": "ord", "d": 3, "q": "Put the course of roseola in order.", "items": ["High fever for 3 to 5 days", "The fever breaks", "A rose-pink rash appears on the trunk", "Recovery"], "y": "The rash comes after the fever breaks, which is the trap."}, {"ty": "ord", "d": 3, "q": "Put the nursing care for suspected Rocky Mountain spotted fever in order.", "items": ["Ask about a recent tick bite and assess the rash", "Notify the provider of the fever and the wrist and ankle rash", "Start doxycycline as soon as it is ordered", "Monitor the response", "Teach tick prevention and removal"], "y": "Assess, report, treat quickly, monitor, then teach."}, {"ty": "ord", "d": 3, "q": "Put the response to a latex anaphylaxis reaction in order.", "items": ["Stop the latex exposure", "Call for help and assess airway and breathing", "Give epinephrine as ordered", "Give oxygen and monitor", "Document and add an allergy band"], "y": "Remove the cause, call for help and assess, treat with epinephrine, support, then document."}, {"ty": "ord", "d": 3, "q": "Put the steps from surveillance to assessment in order.", "items": ["Developmental surveillance at every visit", "A standardized screening tool at the set age", "A concern remains or the screen is abnormal", "In-depth assessment by a specialist", "Referral and follow-up"], "y": "Surveillance is ongoing, screening is a short tool, and assessment is in depth after an abnormal result."}, {"ty": "mat", "d": 3, "q": "Match each disease to its precaution.", "pairs": [["Measles", "Airborne with an N95"], ["Influenza", "Droplet with a surgical mask"], ["MRSA", "Contact with gown and gloves"], ["Hepatitis B", "Standard precautions only"]], "y": "Measles is airborne, flu is droplet, MRSA is contact, and hepatitis B is standard."}, {"ty": "mat", "d": 3, "q": "Match each vaccine to its age.", "pairs": [["Hepatitis B first dose", "Newborn"], ["MMR #1", "Toddler, 12 to 15 months"], ["DTaP #5", "Preschool, 4 to 6 years"], ["MenACWY booster", "Adolescent, age 16"]], "y": "Hep B is at birth. MMR #1 is at 12 to 15 months. DTaP #5 is at 4 to 6 years. The MenACWY booster is at 16 years."}, {"ty": "mat", "d": 3, "q": "Match each laboratory test to what it shows.", "pairs": [["Complete blood count", "High neutrophils and bands suggest bacteria"], ["C-reactive protein", "Inflammation that rises and falls fast"], ["Blood culture", "Collected before the first antibiotic"], ["Throat culture", "Group A strep"]], "y": "Each test has a signature use."}, {"ty": "mat", "d": 3, "q": "Match each HIV drug class to its example.", "pairs": [["NRTI", "Zidovudine"], ["NNRTI", "Nevirapine"], ["Protease inhibitor", "Lopinavir with ritonavir"], ["Pneumocystis prophylaxis", "Trimethoprim-sulfamethoxazole"]], "y": "Zidovudine is an NRTI, nevirapine an NNRTI, lopinavir with ritonavir a protease inhibitor, and trimethoprim-sulfamethoxazole prevents Pneumocystis pneumonia."}, {"ty": "ngn", "d": 3, "scen": "A 2-year-old has a temperature of 103.2 F (39.6 C). He is shivering with cool hands. His mother wants to cover him with blankets and rub him with alcohol.", "parts": [{"ty": "mc", "d": 3, "q": "Why is he shivering with cool hands?", "o": ["Prostaglandins raised the set point, so the body saves heat to reach it", "He has fallen below the set point and is becoming hypothermic now", "The fever has just broken and heat is leaving through his skin now", "Pyrogens have destroyed his sweat glands, so he cannot cool down"], "a": [0], "y": "Right: pyrogens trigger prostaglandins that raise the set point. Not hypothermia or broken fever: those are the opposite. Not sweat glands: not the mechanism."}, {"ty": "sata", "d": 3, "q": "Which actions are correct? Select all that apply.", "o": ["Dress him in light clothing", "Offer fluids often", "Recheck the temperature 30 to 60 minutes after an antipyretic", "Use the same site and device each time", "Cover him with extra blankets", "Use an alcohol rub"], "a": [0, 1, 2, 3], "y": "Right: these support heat loss and accurate trends. Not blankets: they trap heat. Not alcohol: it can cause shivering or toxicity."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 2-month-old is at the clinic for vaccines. His mother asks what the visit includes and what to do afterward.", "parts": [{"ty": "mc", "d": 3, "q": "Which vaccines are given at 2 months per the slide?", "o": ["DTaP, RV, IPV, Hib, PCV and Hep B", "DTaP, RV, IPV and PCV only, as listed for the 4-month visit", "MMR and varicella, which are given later in the second year", "Hepatitis A and influenza, which are given after 6 months"], "a": [0], "y": "Right: six vaccines at the first visit. Not four: that is the 4-month slide list. Not MMR and varicella: given at 12 months. Not hepatitis A and flu: later."}, {"ty": "sata", "d": 3, "q": "Which instructions does the nurse give? Select all that apply.", "o": ["Soreness and a low-grade fever are expected", "Acetaminophen can be given as directed", "Call for hives or trouble breathing", "Aspirin is safe for the fever", "Apply a heating pad to the thigh"], "a": [0, 1, 2], "y": "Right: expected reactions, acetaminophen and danger signs. Not aspirin: Reye syndrome. Not a heating pad: not recommended."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 7-year-old has an itchy scalp, especially behind the ears. The nurse finds small oval particles stuck to the hair shaft near the scalp.", "parts": [{"ty": "mc", "d": 3, "q": "Which condition is this?", "o": ["Pediculosis capitis", "Tinea capitis, which is a scaly bald patch", "Scabies, which burrows in the skin of the hands", "Pinworm infection, which itches at the rectum"], "a": [0], "y": "Right: nits on the hair shaft mean head lice. Tinea is a scaly bald patch. Scabies burrows in skin. Pinworm itches at the rectum."}, {"ty": "mc", "d": 3, "q": "Which treatment fits?", "o": ["Permethrin 1% shampoo, repeated in 7 days", "Oral griseofulvin without a corticosteroid for 6 weeks", "A scotch tape test on 3 consecutive nights at bedtime", "Permethrin 5% cream head to toe for 8 to 12 hours"], "a": [0], "y": "Right: shampoo and a 7-day repeat. Not griseofulvin: scalp ringworm. Not tape test: a pinworm diagnosis. Not 5% cream head to toe: scabies treatment."}, {"ty": "sata", "d": 3, "q": "Which teaching does the nurse give? Select all that apply.", "o": ["Comb out nits daily for 1 week", "Avoid sharing hats and brushes", "Examine all family members", "Lice jump from child to child", "Lice survive a week off the head"], "a": [0, 1, 2], "y": "Right: comb, avoid sharing and examine family. Not jumping: lice crawl. Not a week: 48 hours off the host."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 3-year-old attends daycare. His mother reports nighttime itching around the rectum and restless sleep.", "parts": [{"ty": "mc", "d": 3, "q": "Which test is done?", "o": ["Clear tape pressed to the rectum on 3 consecutive nights", "A skin scraping taken from the abdomen and read under a microscope", "A throat culture swabbed from the back of the throat", "A blood culture drawn rust in one day", "They lower the child's temperature through cooling in the bath water", "They replace the need for short nails because the skin is softened"], "a": [0], "y": "Right: chickenpox is a virus, so care is comfort, and oatmeal baths ease itching. Not killing the virus: baths do not. Not lowering temperature: that is the role of antipyretics. Not replacing short nails: soft skin scratches easily."}, {"ty": "ngn", "d": 3, "scen": "An 8-year-old returns from a camping trip. He has an expanding red ring on his thigh, fever and a headache. His mother found a tick on him 4 days ago and pulled it out with her fingers.", "parts": [{"ty": "mc", "d": 3, "q": "Which assessment question is most helpful?", "o": ["Has he been in the woods or a wooded area?", "Has he shared a hairbrush or hat with a friend?", "Has he been itching around the rectum at night?", "Has he had white spots inside his cheeks?"], "a": [0], "y": "Right: exposure to woods points to ticks and Lyme disease. Not hairbrush: lice. Not rectal itching: pinworm. Not white spots: measles."}, {"ty": "mc", "d": 3, "q": "Which treatment is expected?", "o": ["Doxycycline", "Permethrin cream", "Pyrantel pamoate", "Griseofulvin"], "a": [0], "y": "Right: doxycycline treats Lyme disease. Not permethrin: scabies. Not pyrantel pamoate: pinworm. Not griseofulvin: scalp ringworm."}, {"ty": "sata", "d": 3, "q": "Which tick teaching does the nurse give? Select all that apply.", "o": ["Use fine-tipped tweezers and protect your hands", "Pull the tick straight up without twisting or jiggling", "Do not use heat or petroleum jelly", "Twist the tick counterclockwise", "Hold a lighter near the tick"], "a": [0, 1, 2], "y": "Right: these are the review-session steps. Not twisting or a lighter: they can leave mouthparts or release germs."}], "y": ""}], "sort": [["Passive vs active immunity", "Ch 9"], ["Lead screening in Virginia", "Ch 9"], ["Vaccine routes box", "Ch 9"], ["Vaccine card by age", "Ch 9"], ["Universal vs selective ive."], ["A daycare or school cannot be a health supervision setting.", "False. Daycare centers and schools are both listed settings."]]}, {"title": "Ch 9: Immunizations (ATI Ch 34)", "rows": [["Which vaccine route is subcutaneous?", "MMR (also varicella and IPV). Do not pick intramuscular."], ["Passive immunity from a vaccine.", "No. A vaccine gives active immunity."], ["A child with a cold and a low-grade fever must wait for vaccines.", "No. Mild illness is not a reason to delay."], ["Tetanus is spread by coughing.", "No. It comes from spores in soil entering a wound."], ["Which type of vaccine is MMR?", "Live attenuated, so avoid it in severe immunodeficiency."], ["Acetaminophen or aspirin for fever after a shot?", "Acetaminophen. Aspirin is linked to Reye syndrome."], ["The slide lists six vaccines at 4 months.", "No. It lists four: DTaP, RV, IPV, PCV."]]}, {"title": "Ch 15: Infection Basics", "rows": [["Granulocytes vs lymphocytes: which is the first line of defense?", "Granulocytes. Lymphocytes produce and maintain the response. Monocytes are second line."], ["Incubation vs prodrome.", "Incubation ends at the first symptom. Prodrome is vague symptoms before the specific ones."], ["Measles precaution.", "Airborne. Droplet is wrong."], ["Mumps needs airborne precautions.", "Droplet. The airborne mnemonic MTV is measles, tuberculosis, varicella."], ["Hepatitis B and chemotherapy in the precaution list.", "Standard precautions, not isolation. Chemo needs safe drug handling."], ["Recheck the temperature right after the antipyretic.", "Wait 30 to 60 minutes."], ["Switch thermometer and site between readings.", "Wrong. Use the same site and device."], ["Dress a febrile child in extra blankets.", "Wrong. Light clothing."], ["Which is most important to prevent infection?", "Hand washing (bold on the slide)."], ["Antibiotic stopped when the fever breaks.", "Wrong. Finish the full course."]]}, {"title": "Ch 15: Viral Rashes, Ticks and Zoonoses", "rows": [["Koplik spots point to which rash illness?", "Rubeola (measles). Not rubella."], ["Rubella vs rubeola.", "Rubella is German measles (mild). Rubeola is measles (Koplik spots, airborne)."], ["Fifth disease vs sixth disease.", "Fifth is slapped cheek (parvovirus B19). Sixth is roseola."], ["Rash first, then fever breaks.", "Wrong for roseola. The fever breaks first, then the rash."], ["Which viral rash is dangerous to a pregnant woman?", "Rubella (teratogenic). Also report parvovirus B19 exposure."], ["Twist the tick out gently.", "Wrong. Pull straight up with steady pressure. Do not twist, jiggle or jerk."], ["Hold a lighter near the tick or cover it with petroleum jelly.", "Wrong. No heat and no petroleum jelly. Use fine-tipped tweezers."], ["A child with chickenpox returns to school when the fever is gone.", "Review session: when all lesions have crusted over."], ["Cat-scratch fever and rabies are vector-borne.", "No. They are zoonotic (animal to human)."], ["Wait for lab results to start doxycycline for RMSF.", "Wrong. Treat immediately when suspected."], ["Erythema migrans only appears at the bite site.", "The note says it can show up anywhere on the body after a tick bite."]]}, {"title": "Ch 15: Lice, Scabies, Ringworm and Worms", "rows": [["Tinea is a parasite.", "Fungus (the note). It is only grouped with parasitic infections on the slide."], ["Nits hatch in 24 hours.", "7 to 10 days."], ["Lice eggs die within a day once they leave the head.", "Review session: eggs can live on surfaces 3 to 7 days, so wash all bedding and clothing in hot water."], ["Pinworm is treated with permethrin cream.", "Anti-helminthic drugs: pyrantel pamoate, albendazole or mebendazole."], ["Athlete's foot is treated with an oral antibiotic.", "It is a fungus: antifungal cream, dry feet, change socks."], ["Lice survive a week off the head.", "48 hours off the host."], ["Spinosad for any age.", "Slide: children over 4 years."], ["Apply scabies cream to the neck down only and wash off after 1 hour.", "Head to toe, 8 to 12 hours, then wash off."], ["Corticosteroid cream for ringworm.", "Wrong. Griseofulvin without a corticosteroid."], ["Scotch tape test once, in the afternoon.", "3 nights in a row (note). Morning, before bathing."], ["Itching worse at night: which two infections?", "Scabies and pinworm."], ["Treat only the child with scabies.", "Treat the family."]]}, {"title": "Ch 25: Immunity and Immune Disorders", "rows": [["Cellular immunity is made by B cells.", "T cells. B cells are humoral."], ["IgA crosses the placenta.", "IgA, IgD, IgE and IgM do not cross."], ["Phagocytes are mature at birth.", "They reach adult levels at age 7."], ["Four ear infections in 6 months is normal.", "Four or more in 1 year is a warning sign."], ["SCID only affects boys.", "X-linked or autosomal recessive: boys or girls."], ["Humoral immunity is fully functional at birth.", "Cellular is functional at birth. Humoral develops over time."], ["Prematurity is a primary immunodeficiency.", "Secondary cause."]]}, {"title": "Ch 25: HIV and Latex Allergy", "rows": [["ELISA is the best test for an infant.", "PCR. ELISA detects antibodies, which may be the mother's."], ["HIV spreads by hugging or sharing toys.", "No. Everyday contact is safe."], ["Vertical transmission = needles.", "Vertical is mother to baby. Needles are horizontal."], ["Latex allergy is a delayed rash only.", "The slide stresses IgE-mediated and anaphylaxis."], ["Banana, avocado and kiwi are safe for a latex-allergic child.", "No. They cross-react."]]}], "qm": [{"t": "tbl", "head": ["Quick math", "Rule"], "rows": [["**Pounds to kg**", "lb / 2.2 = kg"], ["**mg per dose from mg/kg/dose**", "mg/kg x kg"], ["**mL to draw up**", "mg needed / (mg per mL on the label)"], ["**Fahrenheit to Celsius**", "(F - 32) x 5/9. Example: 102.2 F = 39 C"], ["**Celsius to Fahrenheit**", "C x 9/5 + 32. Example: 38 C = 100.4 F"], ["**Acetaminophen**", "10 to 15 mg/kg per dose every 4 to 6 hours (safe range used in the questions)"], ["**Ibuprofen**", "5 to 10 mg/kg per dose every 6 to 8 hours, over 6 months old"]]}]};

/* search */
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();if(v.length<2){if(cur==='search')go('home');return}
 cur='search';buildNav();const hits=[];
 D.tabs.forEach(t=>t.sections.forEach((s,i)=>{const txt=plain(JSON.stringify([s.h,s.blocks]));if(txt.toLowerCase().includes(v)){const k=txt.toLowerCase().indexOf(v);hits.push([t,i,s.h,txt.slice(Math.max(0,k-50),k+90)])}}));
 $('#main').innerHTML=`<h2>Search: ${esc(v)}</h2><p class="sub">${hits.length} section${hits.length===1?'':'s'}</p>`+hits.map((h,n)=>`<div class="hit" data-n="${n}"><b>${esc(h[0].title)} &rsaquo; ${esc(plain(h[2]))}</b><br><small>${esc(h[3])}</small></div>`).join('');
 $$('.hit').forEach(el=>el.onclick=()=>{const h=hits[+el.dataset.n];$('#q').value='';go(h[0].id,`s-${h[0].id}-${h[1]}`)})};
/* read aloud */
let rq=[],ri=-1;
function secs(){return $$('section.sec[id^="s-"]')}
function say(i){const s=secs();if(i<0||i>=s.length){stopRead();return}ri=i;speechSynthesis.cancel();s[i].scrollIntoView({block:'start'});
 const t=plain(s[i].innerText.replace(/Read aloud/,'').replace(/★/g,'star ')).replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(t);u.onend=()=>{if(ri===i)say(i+1)};speechSynthesis.speak(u)}
function startRead(id){if(!('speechSynthesis' in window)){alert('Read aloud is not supported in this browser.');return}$('#reader').classList.add('on');say(secs().findIndex(s=>s.id===id))}
function stopRead(){ri=-1;try{speechSynthesis.cancel()}catch(e){}$('#reader').classList.remove('on')}
$('#rp').onclick=()=>say(ri-1);$('#rn').onclick=()=>say(ri+1);$('#rs').onclick=stopRead;
buildNav();go('home');
