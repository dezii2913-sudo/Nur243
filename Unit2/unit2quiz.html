tar": true, "blocks": [{"t": "tbl", "head": ["Item", "Content"], "rows": [["**Definition**", "Diseases transmitted by **ticks, mosquitoes or other insect vectors**"], ["**Types**", "==Lyme disease==, ==Rocky Mountain spotted fever== (both highlighted), malaria"]]}]}, {"h": "Ticks: Lyme disease and Rocky Mountain spotted fever", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Lyme disease", "Rocky Mountain spotted fever"], "rows": [["★ **A&P**", "+ Borrelia burgdorferi, from the **black-legged (deer) tick**. Needs about 36 to 48 hours attached", "+ Rickettsia rickettsii, from the **American dog tick or wood tick**"], ["★ **Manifestation**", "**Erythema migrans** expanding red ring, fever, fatigue, headache, joint and muscle aches. Later: facial palsy, heart block, arthritis", "+ Fever, severe headache, nausea and vomiting, then a rash **starting at the wrists and ankles** and spreading to palms, soles and trunk, becoming **petechial**"], ["★ **Diagnosis**", "+ Clinical rash plus blood antibody tests (ELISA then Western blot)", "**PCR testing** (note). Added: Blood tests can be negative early"], ["★ **Treatment**", "**Doxycycline** (note). Added: Amoxicillin or cefuroxime for young children", "**Doxycycline** (note). Added: Start **immediately**, do not wait for the lab result"], ["★ **Nursing education**", "Assessment question (review session): **ask if the child has been in the woods or a wooded area**. Added: Repellent, long sleeves, tick checks after being outdoors, shower, remove ticks right away", "+ Same prevention. Report fever or rash within about 2 weeks of a bite"]]}, {"t": "note", "k": "star", "x": "Speaker note: Lyme disease and Rocky Mountain spotted fever, doxycycline for treatment, PCR testing. Lecture: Lyme disease will be on your quiz AND your final. Highlight doxycycline, it is very important. If a child is allergic to doxycycline, weigh the benefit against the risk, because there is really no other antibiotic choice. A PCR test is sent if either disease is suspected."}]}, {"h": "Erythema migrans", "star": true, "blocks": [{"t": "ul", "items": ["★ **Speaker note and lecture:** the bull's-eye rash is caused by the bacteria after the tick bite and can show up **anywhere on the body**. It may appear within days of the bite", "+ Expanding red ring, often with central clearing like a bull's-eye. It usually does not itch or hurt. It appears 3 to 30 days after the bite and is the sign of early Lyme disease"]}]}, {"h": "Teaching guidelines for tick removal", "star": true, "blocks": [{"t": "tbl", "head": ["Step", "Action"], "rows": [["★ 1", "Use **fine-tipped tweezers**"], ["★ 2", "Protect fingers with a tissue, paper towel or latex gloves"], ["★ 3", "Grasp the tick **as close to the skin as possible** and **pull upward** with steady, even pressure"], ["★ 4", "Do **not twist, jiggle or jerk** the tick"], ["★ 5", "Clean the site with soap and water and wash your hands"], ["★ 6", "**Save the tick** for identification in case the child becomes sick"]]}, {"t": "note", "k": "anno", "x": "Why not twist or jerk: the mouthparts can break off and stay in the skin. Review session: **do not use heat** (matches or lighters) **or petroleum jelly**. These are not safe ways to remove a tick."}]}], "cold": ["Rubella 3 day rash and swollen back-of-head nodes. Rubeola Koplik spots and 3 Cs. Varicella vesicles in crops, all stages at once. Fifth disease slapped cheek. Roseola fever then rash.", "Roseola: the rash appears AFTER the fever breaks. Fifth disease: not contagious once the rash shows.", "Measles and varicella are airborne. Varicella also needs contact.", "Zoonotic = from animals: rabies, cat-scratch fever. Vector-borne = ticks, mosquitoes: Lyme, RMSF, malaria.", "Lyme and RMSF are on the quiz and the final. Both: PCR test, doxycycline (highlight). Lyme: erythema migrans. RMSF: rash starts at wrists and ankles.", "Tick removal: fine-tipped tweezers, close to the skin, pull straight up, no twisting, clean, save the tick."], "traps": [["Koplik spots point to which rash illness?", "Rubeola (measles). Not rubella."], ["Rubella vs rubeola.", "Rubella is German measles (mild). Rubeola is measles (Koplik spots, airborne)."], ["Fifth disease vs sixth disease.", "Fifth is slapped cheek (parvovirus B19). Sixth is roseola."], ["Rash first, then fever breaks.", "Wrong for roseola. The fever breaks first, then the rash."], ["Which viral rash is dangerous to a pregnant woman?", "Rubella (teratogenic). Also report parvovirus B19 exposure."], ["Twist the tick out gently.", "Wrong. Pull straight up with steady pressure. Do not twist, jiggle or jerk."], ["Hold a lighter near the tick or cover it with petroleum jelly.", "Wrong. No heat and no petroleum jelly. Use fine-tipped tweezers."], ["A child with chickenpox returns to school when the fever is gone.", "Review session: when all lesions have crusted over."], ["Cat-scratch fever and rabies are vector-borne.", "No. They are zoonotic (animal to human)."], ["Wait for lab results to start doxycycline for RMSF.", "Wrong. Treat immediately when suspected."], ["Erythema migrans only appears at the bite site.", "The note says it can show up anywhere on the body after a tick bite."]]}, {"id": "skn15", "icon": "🧬", "title": "Ch 15: Lice, Scabies, Ringworm and Worms", "sub": "Parasitic, fungal and helminthic infections filled into the instructor's template (A&P, manifestations, diagnosis, treatment, nursing education). Slide stars, highlights and notes are marked. Lines starting with + are added.", "sections": [{"h": "Parasitic and helminthic infections (overview)", "star": true, "blocks": [{"t": "tbl", "head": ["Group", "Infections on the slide"], "rows": [["★ **Parasitic infections**", "Pediculosis capitis (head lice), pediculosis pubis (pubic lice), scabies, tinea (ringworm)"], ["★ **Helminthic infections**", "Pinworm, hookworm, ascariasis"]]}, {"t": "note", "k": "anno", "x": "The slide groups tinea (ringworm) under parasitic, but the speaker note on the tinea slide says fungal infection. Know both: it is listed here, and it is a fungus."}]}, {"h": "Pediculosis (head lice)", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "Pediculosis capitis: **infestation of the hair and scalp**. Added: Lice crawl, they do not jump. Spread by head-to-head contact and shared combs, hats and brushes. Not caused by poor hygiene"], ["★ **Manifestation**", "**Nits on the shaft of the hair near the scalp**. Nits **hatch in 7 to 10 days**. Lice **live 48 hours off the host**. Review session: **eggs can live on surfaces for 3 to 7 days**. Added: Itching scalp, especially behind the ears and at the nape"], ["★ **Diagnosis**", "**Visual inspection**"], ["★ **Treatment**", "**Pediculicide**. Permethrin 1% shampoo, **repeat in 7 days**. Spinosad for children **over 4 years**"], ["★ **Nursing education**", "**Remove nits with a fine-tooth comb daily for 1 week**. **Avoid sharing** hats, combs and brushes. **Examine all family members**. Review session: **wash all bedding and clothing in hot water**. Wash linens in hot water or **bag items in a sealed plastic bag for 14 days**"]]}, {"t": "note", "k": "star", "x": "Speaker notes: permethrin 1% shampoo repeat in 7 days. Spinosad children over 4 years. Wash in hot water or bag in a sealed plastic bag for 14 days. Lecture: highlight and star this slide. Memory trick: capitis = cap (head). Pediculosis pubis lives in the pubic area."}]}, {"h": "Scabies", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "**Sarcoptes scabiei** mite. Added: Spread by skin-to-skin contact. Parasitic infection (note)"], ["★ **Manifestation**", "**Burrows under the skin**. Added: Intense itching worse at night between the fingers, wrists, waist, armpits and groin"], ["★ **Diagnosis**", "**Skin scraping** (lecture)"], ["★ **Treatment**", "==Permethrins, Lindane== (highlighted). Added: Permethrin 5% cream is first choice. Lindane is a last resort and can cause seizures, so avoid in infants"], ["★ **Nursing education**", "==Shower, dry off, apply on clean skin head to toe, leave on for the time ordered (8 to 12 hours), then wash off== (highlighted). **Hot wash and dry** bedding and clothing. **Treat the family**"]]}, {"t": "note", "k": "star", "x": "Lecture: highlight and star permethrin and how to apply it. Review session: shower and put it on before bedtime, leave it on overnight, rinse it off in the morning after breakfast (8 to 12 hours). Wash all bedding in hot water and treat all family members and contacts. Spread by direct (skin-to-skin) contact. Itching can last 2 to 4 weeks after treatment, which does not mean the treatment failed."}]}, {"h": "Tinea (ringworm)", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "Fungal infection (note). Added: Dermatophytes live in skin, hair and nails. Types: capitis (scalp), corporis (body), pedis (feet), cruris (groin)"], ["★ **Manifestation**", "**Scaly, red, dry, itchy** rash (lecture). Added: Round patch with a clear center and a raised edge. Scalp: scaly bald patch with broken hairs"], ["★ **Diagnosis**", "**Skin scraping** (lecture). Added: KOH exam, Wood's lamp or fungal culture"], ["★ **Treatment**", "**Clotrimazole** topical (lecture summary lists clotrimazole and **nystatin** as the antifungal medications). **Selenium shampoo**. **Oral griseofulvin without a corticosteroid** for tinea capitis. **Tolnaftate** for feet and body (tinea pedis). **Fluconazole (Diflucan)** is systemic"], ["★ **Nursing education**", "**Treat pets**. Added: Keep skin dry, do not share combs, hats or towels, wear sandals in locker rooms"]]}, {"t": "note", "k": "star", "x": "Speaker notes: griseofulvin for tinea (ringworm) of the scalp. Tolnaftate for tinea pedis (athlete's foot), an antifungal. Review session, athlete's foot: use an **antifungal cream**, **keep the feet dry** and **change socks regularly**. Fluconazole (Diflucan) is systemic."}]}, {"h": "Pinworm", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "+ Enterobius vermicularis. Spread **fecal-oral** by swallowing tiny eggs (note)"], ["★ **Manifestation**", "**Itchy bottom, worse at night** (note and lecture). Intestinal parasite. Added: Poor sleep and irritability"], ["★ **Diagnosis**", "**Tape test**: a piece of clear tape over the rectum while the child sleeps, because worms come out at night. Do it **3 consecutive nights** (note and lecture)"], ["★ **Treatment**", "**Anti-helminthic drugs: pyrantel pamoate, albendazole and mebendazole** (review session), as one dose repeated in 2 weeks. Treat the household. **Parental commitment is a big one**: everyone must follow the plan or it comes back"], ["★ **Nursing education**", "+ Handwashing after toilet and before eating, short nails, wash bedding and underwear in hot water, shower in the morning"]]}, {"t": "note", "k": "star", "x": "Speaker notes: fecal-oral, scotch tape 3 nights in a row, itching worse at night. Lecture: highlight this slide, it will be on the quiz. The worm is Enterobius vermicularis, swallowed as microscopic eggs."}]}, {"h": "Hookworm and ascariasis (added)", "star": false, "blocks": [{"t": "tbl", "head": ["Worm and spread", "Key signs", "Treatment and teaching"], "rows": [["**Hookworm**. Larvae in soil enter through **bare skin**, usually the feet", "Itchy rash at the entry site, **iron-deficiency anemia** from gut blood loss, fatigue", "Albendazole or mebendazole plus iron. **Wear shoes**"], ["**Ascariasis** (roundworm). Swallowed eggs from soil, unwashed food or hands", "Cough, belly swelling and pain, poor growth. Heavy infection can **block the bowel**", "Albendazole or mebendazole. Handwashing, wash produce, sanitation"]]}, {"t": "note", "k": "anno", "x": "The slide only names these two. Everything in the table is added."}]}, {"h": "Medications named on the slides", "star": false, "blocks": [{"t": "tbl", "head": ["Drug", "Used for", "Teaching"], "rows": [["**Clotrimazole**", "Topical antifungal (lecture, **fungal infections**)", "+ Apply to clean dry skin as directed"], ["**Nystatin**", "Antifungal (lecture, **fungal infections**)", "+ Mostly used for candida: thrush and diaper rash"], ["**Griseofulvin**", "Oral antifungal for **tinea capitis (scalp)**", "+ Take with a fatty food, avoid sun, long course of weeks. Report jaundice, dark urine or vomiting"], ["**Tolnaftate**", "Topical antifungal for **tinea pedis** and body", "+ Apply to clean dry skin. Keep feet dry"], ["**Permethrin 1% shampoo**", "**Head lice**. Lecture: an **antiparasitic** that treats both scabies and lice", "Repeat in 7 days. Comb nits daily for a week"], ["**Permethrin 5% cream**", "**Scabies**", "Apply head to toe on clean skin for 8 to 12 hours, then wash off"]]}]}, {"h": "Nursing interventions to promote skin integrity", "star": true, "blocks": [{"t": "ul", "items": ["★ Monitor skin for color changes, temperature, redness, swelling, warmth, pain or signs of infection, and changes in rash lesions, distribution or size", "★ Encourage fluid intake and proper nutrition", "★ Keep the child's **fingernails short**", "★ Encourage the child to **press on rather than scratch** itchy areas", "★ Use antipruritics and topical ointments or creams as ordered", "+ Why: scratching breaks the skin, and broken skin lets bacteria in"]}]}], "cold": ["Head lice: nits near the scalp hatch in 7 to 10 days, adults live 48 hours off the host. Permethrin 1% shampoo, repeat in 7 days. Comb daily for a week. Bag items 14 days.", "Scabies: Sarcoptes scabiei, burrows, permethrin 5% cream head to toe for 8 to 12 hours. Hot wash bedding. Treat the family.", "Tinea is fungal. Griseofulvin for the scalp, tolnaftate for feet and body. Treat pets. No corticosteroid.", "Pinworm: fecal-oral, night itching, scotch tape test 3 nights in a row.", "Hookworm enters bare feet and causes anemia. Ascariasis can obstruct the bowel.", "Skin integrity: short nails, press do not scratch, fluids and nutrition, antipruritics."], "traps": [["Tinea is a parasite.", "Fungus (the note). It is only grouped with parasitic infections on the slide."], ["Nits hatch in 24 hours.", "7 to 10 days."], ["Lice eggs die within a day once they leave the head.", "Review session: eggs can live on surfaces 3 to 7 days, so wash all bedding and clothing in hot water."], ["Pinworm is treated with permethrin cream.", "Anti-helminthic drugs: pyrantel pamoate, albendazole or mebendazole."], ["Athlete's foot is treated with an oral antibiotic.", "It is a fungus: antifungal cream, dry feet, change socks."], ["Lice survive a week off the head.", "48 hours off the host."], ["Spinosad for any age.", "Slide: children over 4 years."], ["Apply scabies cream to the neck down only and wash off after 1 hour.", "Head to toe, 8 to 12 hours, then wash off."], ["Corticosteroid cream for ringworm.", "Wrong. Griseofulvin without a corticosteroid."], ["Scotch tape test once, in the afternoon.", "3 nights in a row (note). Morning, before bathing."], ["Itching worse at night: which two infections?", "Scabies and pinworm."], ["Treat only the child with scabies.", "Treat the family."]]}, {"id": "imm25", "icon": "🛡️", "title": "Ch 25: Immunity and Immune Disorders", "sub": "How a child's immune system works and what happens when it fails. Slide stars and speaker notes are marked. Lines starting with + are added to fill gaps in the slides.", "sections": [{"h": "Types of immunity", "star": true, "blocks": [{"t": "tbl", "head": ["Type", "Slide definition", "Plain meaning (added)"], "rows": [["★ **Passive**", "Antibodies **received from an external source** (mother to baby, IVIG)", "Borrowed protection. Short-lived"], ["★ **Cellular**", "Antibodies produced by native **T-cell lymphocytes**", "T cells attack infected cells directly. Added: T cells do not make antibodies, B cells do"], ["★ **Humoral**", "Antibodies produced by native **B-cell lymphocytes**", "B cells make antibodies that float in the blood and body fluids"]]}, {"t": "note", "k": "star", "x": "Lecture: please highlight this slide. Link to Chapter 9: there immunity is passive or active. Here active immunity is split into cellular (T cells) and humoral (B cells). B and T cells are made in the bone marrow."}]}, {"h": "Mechanisms of immunity in children", "star": false, "blocks": [{"t": "tbl", "head": ["Part", "What the slide says", "Why it matters (added)"], "rows": [["**Lymph system and spleen**", "**Passively filter plasma** for bacteria or foreign material", "A child without a working spleen cannot filter blood bacteria well"], ["**Phagocytosis**", "Neutrophils and monocytes show **decreased chemotaxis**, reaching adult levels at **age 7**", "Young children are slower to send white cells to an infection"], ["**Cellular immunity**", "T cells do **not cross the placenta**, but fetal T cells may become sensitized to antigens that do cross", "Cellular immunity is not borrowed from mom"], ["**B cells**", "**Infant B cells do not respond to infection as well as adults**", "Infants respond poorly to some germs, especially polysaccharide ones"], ["**IgA, IgD, IgE, IgM**", "Do **not cross the placenta**. They need an antigenic challenge for production", "+ **IgG** is the one that crosses and protects the newborn for the first months"]]}]}, {"h": "Variations in pediatric anatomy and physiology", "star": false, "blocks": [{"t": "ul", "items": ["The newborn gets **passive immunity** from maternal antibodies through the **placenta and breastfeeding**", "A healthy full-term infant's immune system is still **immature** and does not fully develop until later in childhood", "The newborn has a **decreased inflammatory and phagocytic response**, which raises the risk of infection", "**Cellular immunity is generally functional at birth**. **Humoral immunity develops over time**", "Infants have **larger tonsils and thymus** than adults", "+ Why 3 to 6 months is a weak spot: borrowed maternal IgG fades before the infant makes enough of their own"]}]}, {"h": "Primary immunodeficiencies", "star": false, "blocks": [{"t": "tbl", "head": ["Type (slide)", "What fails", "Examples (added)"], "rows": [["**Humoral deficiency**", "B cells and antibodies", "X-linked agammaglobulinemia, selective IgA deficiency"], ["**Cellular immunity deficiency**", "**T cell production is impaired** (lecture)", "DiGeorge syndrome"], ["**Combined humoral and cellular**", "B cells and T cells", "**Severe combined immunodeficiency (SCID)**"], ["**Phagocytic system defect**", "Neutrophils and macrophages", "Chronic granulomatous disease"], ["**Complement deficiency**", "Complement proteins that help kill germs", "Recurrent Neisseria infections"]]}, {"t": "note", "k": "anno", "x": "Primary means mostly hereditary or congenital."}]}, {"h": "10 warning signs of primary immunodeficiency", "star": false, "blocks": [{"t": "ul", "items": ["**Four or more** new episodes of acute otitis media in 1 year", "**Two or more** episodes of severe sinusitis", "Antibiotics for **2 months or longer** with little effect", "**Two or more** episodes of pneumonia in 1 year", "**Failure to thrive** in the infant", "Recurrent **deep skin or organ abscesses**", "**Persistent oral thrush or skin candidiasis** after 1 year of age", "Infections that needed **IV antibiotics** to clear", "**Two or more** serious infections such as sepsis", "**Family history** of primary immunodeficiency"]}]}, {"h": "Severe combined immune deficiency (SCID)", "star": true, "blocks": [{"t": "ul", "items": ["Nursing assessment: **chronic diarrhea**, **failure to thrive**, history of **severe infections early in infancy**, **persistent thrush**, adventitious sounds from pneumonia, lab findings of **very low immunoglobulins**", "★ **Speaker note (page 911):** genetic, **X-linked or autosomal recessive**, so boys or girls. **Absent T-cell and B-cell function**", "★ **Potentially fatal**. Treatment is **stem cell or bone marrow replacement**. **IVIG** assists. **Lifelong treatment**. Future treatment possible with **CRISPR**", "+ Protect from infection with a private room and handwashing. Live vaccines are not given"]}, {"t": "note", "k": "anno", "x": "Why bone marrow works: it replaces the missing T and B cell factory."}]}, {"h": "Causes of secondary immunodeficiency", "star": false, "blocks": [{"t": "tbl", "head": ["Cause", "Why it lowers immunity"], "rows": [["**Chronic illness**", "+ Ongoing illness drains the body's defenses"], ["**Malignancy and chemotherapy**", "+ Cancer and chemo harm the bone marrow that makes white cells"], ["**Immunosuppressive medication**", "Lowers the immune response"], ["**Malnutrition or protein-losing state**", "+ Antibodies and immune cells are made of protein"], ["**Prematurity**", "+ Less maternal IgG passed before birth"], ["**HIV infection**", "+ The virus destroys CD4 helper T cells"]]}, {"t": "note", "k": "anno", "x": "Secondary means it is acquired from something else, not inherited."}]}, {"h": "Influencing factors for autoimmune disease", "star": false, "blocks": [{"t": "ul", "items": ["Heredity", "Hormones", "Self-marker molecules", "Environmental influences", "Viruses", "Certain drugs", "+ In autoimmune disease the immune system attacks the body's own tissue. Examples: type 1 diabetes, juvenile idiopathic arthritis, lupus"]}]}, {"h": "Common medications and medical treatments in immune disorder", "star": false, "blocks": [{"t": "tbl", "head": ["Treatment", "Purpose (added)"], "rows": [["**Immunosuppressants**", "Calm an overactive immune system"], ["**Cytotoxic medications**", "Kill rapidly dividing cells"], ["**Plasmapheresis**", "Filters harmful antibodies out of the plasma"], ["**IV immunoglobulins (IVIG)**", "Give passive antibodies"], ["**Antibiotics**", "Treat or prevent bacterial infection"], ["**Disease-modifying antirheumatic drugs (DMARDs)**", "Slow autoimmune joint disease"], ["**Antiviral medications, NNRTIs, protease inhibitors**", "Treat HIV"], ["**Immunizations**", "Build active immunity where safe"], ["**Bone marrow or stem cell transplantation**", "Replace the immune cell factory"]]}]}], "cold": ["Types of immunity: passive (received), cellular (T cells), humoral (B cells).", "Phagocytes reach adult chemotaxis at age 7. IgA, IgD, IgE, IgM do not cross the placenta. IgG does.", "Newborn: passive immunity from placenta and breast milk, immature system, cellular works at birth, humoral develops over time.", "Primary immunodeficiency: humoral, cellular, combined, phagocytic, complement.", "Warning signs: 4 ear infections a year, 2 pneumonias, 2 sinus infections, failure to thrive, thrush after 1 year.", "SCID: absent T and B cells, X-linked or recessive, stem cell transplant, IVIG, lifelong care.", "Secondary causes: chronic illness, malignancy and chemo, immunosuppressants, malnutrition, prematurity, HIV."], "traps": [["Cellular immunity is made by B cells.", "T cells. B cells are humoral."], ["IgA crosses the placenta.", "IgA, IgD, IgE and IgM do not cross."], ["Phagocytes are mature at birth.", "They reach adult levels at age 7."], ["Four ear infections in 6 months is normal.", "Four or more in 1 year is a warning sign."], ["SCID only affects boys.", "X-linked or autosomal recessive: boys or girls."], ["Humoral immunity is fully functional at birth.", "Cellular is functional at birth. Humoral develops over time."], ["Prematurity is a primary immunodeficiency.", "Secondary cause."]]}, {"id": "hiv25", "icon": "🎗️", "title": "Ch 25: HIV and Latex Allergy", "sub": "HIV in children and latex allergy with food cross-reactivity. Slide stars and speaker notes are marked. Lines starting with + are added to fill gaps in the slides.", "sections": [{"h": "How HIV spreads to children", "star": true, "blocks": [{"t": "tbl", "head": ["Route", "Meaning (note)", "Examples"], "rows": [["★ **Vertical transmission**", "**Passive from mother to infant**: in utero or via **breast milk**", "+ Also during delivery"], ["★ **Horizontal transmission**", "Spread by blood or body fluid contact", "**Nonsterile needles, blood products, tattooing**. Added: Sexual contact"]]}, {"t": "note", "k": "star", "x": "Speaker note, ATI page 251, text page 912."}]}, {"h": "Laboratory and diagnostic testing for HIV", "star": false, "blocks": [{"t": "tbl", "head": ["Test", "What it does", "Pediatric points"], "rows": [["**Polymerase chain reaction (PCR)**", "Tests for **HIV genetic material** (DNA, RNA). Lecture: it also checks the **viral load**", "**Positive in infected infants older than 1 month.** **Under 18 months, use PCR** (note and lecture)"], ["**ELISA (HIV antibody test)**", "Tests for **antibodies** to HIV", "**Less accurate in infants and toddlers than PCR.** Lecture: **over 18 months, do the HIV antibody test**. Added: Maternal antibodies stay for up to 18 months"], ["**Platelet count**", "Low platelets bleed", "**Below 30,000 requires treatment**"], ["**CD4 and ANC counts**", "Count of helper T cells and neutrophils", "**Low in HIV infection.** **CD4 under 200** (note and lecture) is where HIV is diagnosed as AIDS"]]}]}, {"h": "Signs and symptoms of HIV infection in children", "star": false, "blocks": [{"t": "ul", "items": ["**Failure to thrive**", "**Recurrent bacterial infections**", "**Opportunistic infections**", "**Chronic or recurrent diarrhea**", "**Recurrent or persistent fever**", "**Developmental delay**", "**Prolonged candidiasis**"]}]}, {"h": "Past medical history clues for an immunologic disorder", "star": false, "blocks": [{"t": "ul", "items": ["**Maternal HIV infection**", "Frequent, recurrent infections", "**Chronic cough**", "Recurrent low-grade fever", "**Two or more serious infections** in early childhood", "Recurrent deep skin or organ abscesses", "**Persistent thrush** in the mouth", "**Extensive eczema**", "**Growth failure**"]}]}, {"h": "Goals of nursing care for the child with HIV", "star": false, "blocks": [{"t": "tbl", "head": ["Goal", "How (added)"], "rows": [["**Avoiding infection**", "Handwashing, avoid sick contacts, immunize with inactivated vaccines, standard precautions"], ["**Promoting compliance with the medication regimen**", "Teach times, side effects and why missed doses cause resistance"], ["**Promoting nutrition**", "High-calorie, high-protein foods, track growth"], ["**Pain management and comfort measures**", "Assess pain, give analgesics and comfort"], ["**Educating the child and caregivers**", "Age-appropriate teaching"], ["**Ongoing psychosocial support**", "Counseling and support groups"]]}]}, {"h": "Stressors with an HIV diagnosis", "star": false, "blocks": [{"t": "ul", "items": ["Diagnosis of an **incurable disease**", "**Financial difficulties**", "**Multiple family members** with HIV", "**HIV-associated stigma**", "**Desire to keep HIV infection confidential**", "**Multiple medical appointments and hospitalizations**"]}]}, {"h": "Family education for the child with HIV", "star": false, "blocks": [{"t": "tbl", "head": ["Topic", "Content (added)"], "rows": [["**Medication regimen**", "Exact times, never skip doses, never stop without the provider"], ["**Ongoing follow-up**", "Regular visits, labs and viral load checks"], ["**When to call the infectious disease provider**", "Fever, cough, diarrhea, poor intake, new rash or exposure to illness"], ["**Stress reduction**", "Routines, support groups, counseling"], ["**HIV education**", "How it spreads and how it does not. Everyday contact is safe"]]}]}, {"h": "HIV treatment drug classes (added)", "star": true, "blocks": [{"t": "tbl", "head": ["Class", "Examples", "Note"], "rows": [["**NRTIs** (nucleoside reverse transcriptase inhibitors)", "Zidovudine, lamivudine", "Zidovudine can lower red and white cells"], ["**NNRTIs** (non-nucleoside reverse transcriptase inhibitors)", "Nevirapine, efavirenz", "On the slide"], ["**Protease inhibitors**", "Lopinavir with ritonavir", "On the slide"], ["**PJP prophylaxis**", "Trimethoprim-sulfamethoxazole", "When CD4 is low, to prevent Pneumocystis pneumonia"]]}, {"t": "note", "k": "star", "x": "Lecture: HIV is treated with a **3-drug regimen**. Infectious disease (the child is referred out) picks **one drug from each class** and uses all three together. Her big takeaway: know these 3 drug classes. Examples are added."}]}, {"h": "Latex allergy and cross-reactivity", "star": true, "blocks": [{"t": "tbl", "head": ["Item", "Content"], "rows": [["★ **Ask**", "Ask if the child is **allergic to rubber gloves**"], ["★ **Mechanism**", "**IgE-mediated response**, can cause **anaphylaxis** (note, page 924)"], ["★ **Cross-reacting foods**", "Apples, apricots, avocados, bananas, carrots, celery, cherry, chestnuts, fig, grape, kiwi, melon, nectarine, papaya, passion fruit, pear, peach, pineapple, plum, potatoes, tomatoes"], ["+ **Higher risk**", "Children with spina bifida or many surgeries, urinary catheters, and health workers"], ["+ **Nursing**", "Latex-free gloves, tubing and supplies. Allergy band. Epinephrine for anaphylaxis"]]}, {"t": "note", "k": "anno", "x": "Why foods matter: some food proteins look like latex proteins, so the body reacts to them too. Banana, avocado, kiwi and chestnut are the classic ones."}]}], "cold": ["Vertical = mother to baby (in utero, breast milk). Horizontal = needles, blood products, tattooing.", "PCR for HIV in infants (under 18 months). ELISA is less accurate in infants. CD4 under 200. Platelets below 30,000 need treatment.", "Symptoms: failure to thrive, recurrent infections, diarrhea, fever, developmental delay, candidiasis.", "Goals: avoid infection, adherence, nutrition, comfort, teaching, psychosocial support.", "Latex allergy is IgE-mediated. Ask about rubber gloves. Foods cross-react: banana, avocado, kiwi, chestnut and more."], "traps": [["ELISA is the best test for an infant.", "PCR. ELISA detects antibodies, which may be the mother's."], ["HIV spreads by hugging or sharing toys.", "No. Everyday contact is safe."], ["Vertical transmission = needles.", "Vertical is mother to baby. Needles are horizontal."], ["Latex allergy is a delayed rash only.", "The slide stresses IgE-mediated and anaphylaxis."], ["Banana, avocado and kiwi are safe for a latex-allergic child.", "No. They cross-react."]]}], "q": {"h9": [{"ty": "mc", "d": 3, "q": "A clinic tests every 12-month-old for lead no matter where the child lives or what the parents report. Which type of screening is this?", "o": ["Universal screening", "Selective screening, since a blood test is being used", "A risk assessment, since lead exposure is being checked", "Developmental surveillance, since the child is 12 months old"], "a": [0], "y": "Right: universal screening covers an entire population regardless of individual risk, and lead testing was her Virginia example. Not selective: selective is done only after a risk assessment finds one or more risk factors. Not a risk assessment: that is the question-and-data step that estimates the likelihood of a condition, it is not a test given to everyone. Not surveillance: surveillance is the ongoing watch over development, not a lead test."}, {"ty": "mc", "d": 3, "q": "A nurse asks a family about the age of their home, the child's diet and recent travel, then orders a lead level because two risk factors were found. What is the correct order of what the nurse did?", "o": ["Risk assessment first, then selective screening", "Selective screening first, then a risk assessment to explain the result", "Universal screening first, then a risk assessment of those who tested high", "A risk assessment and a universal screening at the same moment"], "a": [0], "y": "Right: the risk assessment gathers objective and subjective data and finds the risk factors, and that finding triggers the selective screen. Not selective first: you cannot select a child for a test before you know the risk. Not universal first: universal screens skip the individual risk step entirely. Not both at once: they answer different questions, and only the risk assessment decides who is selected."}, {"ty": "sata", "d": 3, "q": "Which actions are part of developmental surveillance at a well-child visit? Select all that apply.", "o": ["Noting and addressing the parents' concerns", "Obtaining a developmental history", "Making accurate observations of the child", "Consulting with relevant professionals", "Starting a physical therapy program", "Replacing the visit with a one-time exam at age 5"], "a": [0, 1, 2, 3], "y": "Right: the five surveillance components are parental concerns, a developmental history, the appropriate screening assessment, accurate observations, and consulting professionals. Not starting physical therapy: that is treatment after a problem is confirmed. Not a one-time exam: surveillance is ongoing at every visit, not a single event."}, {"ty": "mc", "d": 3, "q": "A nurse caring for a child with a chronic illness says the plan is to see the child at the same yearly interval as healthy children. What is the best response?", "o": ["Chronic illness often needs more frequent, specialized supervision", "Chronic illness is managed in the hospital, so well-child visits can be fewer and shorter", "Yearly visits are enough as long as the specialists see the child regularly", "Frequent visits are only needed when the child has a fever or a flare-up of symptoms"], "a": [0], "y": "Right: the slide says chronic illness may need specialized health supervision and more frequent visits, with services coordinated through the medical home. Not fewer visits: hospital care does not replace preventive supervision. Not yearly with specialists: no one specialist covers growth, immunization, school and family coping. Not only with a flare: health supervision is proactive, not reactive."}, {"ty": "ngn", "d": 3, "scen": "A 6-year-old with cystic fibrosis comes to the medical home. The mother says the family lost insurance last month, they have no car, and she has missed two specialist visits. The father is not sleeping and the older sibling is failing school.", "parts": [{"ty": "mc", "d": 3, "q": "Which areas of the psychosocial assessment does the mother's report show?", "o": ["Insurance, transportation, coping and school response", "Developmental history, red reflex, vision and hearing screens", "Metabolic screening, lead level and blood pressure checks", "Immunization status, oral health and sun safety teaching"], "a": [0], "y": "Right: insurance, transportation, financial stress, family coping (father and sibling) and the school's response are exactly the issues the slide lists. The other options are screenings and anticipatory guidance topics, which are not what she described."}, {"ty": "mc", "d": 3, "q": "What is the nurse's best first action?", "o": ["Connect the family with a social worker or care coordinator for resources", "Tell the mother to reschedule the specialist visits as soon as she can find a ride", "Document the missed visits and wait for the next scheduled appointment to discuss them", "Refer only the sibling to the school counselor for the school problem"], "a": [0], "y": "Right: the medical home coordinates community resources and assesses family needs, and the barrier to care is insurance and transportation. Not telling her to reschedule: that leaves the barrier in place. Not just documenting: documentation without action delays care. Not only the sibling: the father and the child's care are also affected."}, {"ty": "sata", "d": 3, "q": "Which actions support this family? Select all that apply.", "o": ["Coordinate specialty services through the medical home", "Reassess family coping at each visit", "Ask how the school is responding to the child's illness", "Reduce the number of visits to save the family money", "Advise the family to stop the specialist care until insurance returns"], "a": [0, 1, 2], "y": "Right: coordination, ongoing assessment of family needs and the school's response are all on the slide. Not fewer visits or stopping specialist care: both put a child with cystic fibrosis at risk. The solution is to remove the barrier, not the care."}], "y": ""}, {"ty": "mc", "d": 3, "q": "A nurse says, 'Health supervision means we treat children when they get sick and teach them afterward.' Which statement corrects her?", "o": ["Health supervision is proactive and prevents injury and illness", "It is correct, since teaching after an illness is what prevents the next illness", "It only applies to children with a chronic illness that needs ongoing follow-up", "It is limited to immunizations and care during the newborn period only"], "a": [0], "y": "Right: the principles are proactive services, optimal functioning, appropriate growth and development, best possible health, and preventing injury and illness through child teaching. Not correct as stated: it begins before illness. Not chronic only: every child gets health supervision. Not only immunizations: immunizations are one of six screening and visit components."}, {"ty": "mc", "d": 2, "q": "A parent says, 'Our pediatrician has known my daughter since birth, respects our customs, and sends us to the cardiologist and keeps track of what he says.' Which feature of a medical home is the least obvious in this description?", "o": ["Care that is accessible and affordable", "A long-term trusting relationship", "Respect for the family's customs and beliefs", "Coordination of specialty care"], "a": [0], "y": "Right: nothing in the description mentions cost or access. Not long-term relationship: 'known her since birth' is that. Not respect for customs: stated directly. Not coordination: sending to the cardiologist and tracking the report is coordination."}, {"ty": "mat", "d": 3, "q": "Match each screening to what it looks for.", "pairs": [["Metabolic screen", "Inherited disorders such as PKU from a newborn heel stick"], ["Lead screen", "Poisoning from old paint, dust and soil"], ["Iron-deficiency anemia screen", "Low hemoglobin checked around 12 months"], ["Hypertension screen", "Blood pressure measured at each yearly visit from age 3"]], "y": "Each screening answers a different question: metabolic means the newborn heel-stick for inherited disorders, lead means environmental exposure, iron-deficiency anemia means a hemoglobin level, and hypertension means yearly blood pressure from age 3."}, {"ty": "ord", "d": 3, "q": "Put these in the correct order for a selective screening decision.", "items": ["Ask about housing, diet and exposures", "Identify one or more risk factors", "Order the selective screening test", "Refer or treat if the result is abnormal"], "y": "A risk assessment gathers the data, the risk factors found select the child, the selective test is then done, and the result decides referral or treatment."}, {"ty": "mc", "d": 3, "q": "A mother of a 4-month-old asks about the sun at the beach. Which teaching is correct?", "o": ["Keep the infant in shade and out of direct sun, with a hat", "Apply sunscreen SPF 15 and allow 1 hour of direct sun for vitamin D", "Direct sun is fine before 10 AM without any protection for a short time", "Use a high SPF sunscreen on all skin and no other protection is needed"], "a": [0], "y": "Right: infants under 6 months are kept out of direct sun and protected with shade, hats and clothing. Not SPF 15 and 1 hour: too low and too much sun. Not unprotected morning sun: the infant's skin burns easily at any hour. Not sunscreen alone: clothing and shade are the first line."}, {"ty": "sata", "d": 2, "q": "Which are settings for health supervision? Select all that apply.", "o": ["Private physician office", "Freestanding clinic in a retail store", "Nonprofit clinic with sliding scale payments", "School", "Emergency department trauma bay", "Operating room"], "a": [0, 1, 2, 3], "y": "Right: private offices, retail clinics, health department clinics, sliding scale clinics, daycare centers and schools are listed. Not the trauma bay or operating room: those deliver acute and surgical care, not preventive supervision."}, {"ty": "mc", "d": 3, "q": "Which nursing statement shows the correct understanding of a sliding scale clinic?", "o": ["It charges by family income so more families can afford preventive care", "It charges by the child's weight so that medication dosing stays accurate", "It charges by the number of vaccines that are given at each visit", "It only treats children who are already ill and need acute care"], "a": [0], "y": "Right: payment is scaled to income, which keeps care accessible and affordable, one of the medical home qualities. Not by weight: weight is used for dosing, not billing. Not by vaccines: that is not how the scale works. Not only ill: it provides well-child care."}, {"ty": "mc", "d": 3, "q": "After a developmental screening tool is abnormal, what is the next step?", "o": ["A more in-depth developmental assessment by a specialist", "Repeat the same screening tool at every visit until it is normal", "Reassure the parents and recheck at the next yearly visit", "Begin treatment of the most likely diagnosis"], "a": [0], "y": "Right: a screening is a short tool that flags a concern, and an abnormal result leads to an in-depth assessment. Not repeating the screen: it does not give new information. Not waiting a year: that delays early intervention. Not treating a guessed diagnosis: treatment follows assessment, not a screen."}, {"ty": "mc", "d": 3, "q": "A family adopted a 3-year-old from another country. Which assessments are the most important at the first visit?", "o": ["Screening for infections, lead, growth and development, and immunization records", "Only a hearing and vision test, because the other tests were done abroad", "Only catch-up immunizations, because any infections would already be known", "A sports physical and a dental referral, which are the usual first steps"], "a": [0], "y": "Right: internationally adopted children are screened for infections, lead and delays, and their records are reviewed for catch-up vaccines (added content). Not hearing and vision only: that skips the highest-risk screens. Not only immunizations: infections may be undiagnosed. Not a sports physical: not the priority."}, {"ty": "mc", "d": 3, "q": "Which example shows 'marshalling of resources' in a health partnership?", "o": ["The nurse, school and family gather the services a child needs", "The family and provider agree on one goal and share the benefits", "The provider teaches the child to wash hands before meals every day", "The nurse records the child's height and weight on the growth chart"], "a": [0], "y": "Right: marshalling means pulling together the people and services that are needed. Not agreeing on a goal: that is mutual goal setting. Not teaching handwashing: that is development of optimal health practices. Not recording growth: that is part of the physical assessment."}, {"ty": "mc", "d": 3, "q": "Which anticipatory guidance topic is paired with the correct teaching?", "o": ["Oral health: wipe the gums, brush at the first tooth, no bottle in bed", "Healthy weight: serve juice with each meal so the child gets enough fluid", "Healthy activity: about 15 minutes of play a day is enough for a child", "Hygiene: wash hands only after using the toilet, not before meals"], "a": [0], "y": "Right: this is the oral health teaching. Not juice with meals: sugary drinks should be limited. Not 15 minutes: about 60 minutes of activity a day is recommended (added). Not only after the toilet: handwashing also before meals and after play."}], "im9": [{"ty": "mc", "d": 3, "q": "A newborn receives antibodies from the mother through the placenta. Which statement about this protection is correct?", "o": ["It is passive immunity and fades over the first months", "It is active immunity because the baby now has antibodies", "It is active immunity that lasts a lifetime", "It is a type of vaccine called a toxoid"], "a": [0], "y": "Right: passive immunity is borrowed immunoglobulins from another person and is used up. Not active because the baby has antibodies: active means the baby's own immune system made them. Not lifelong: only active immunity with memory cells lasts. Not a toxoid: a toxoid is an inactivated bacterial toxin given as a vaccine."}, {"ty": "mc", "d": 3, "q": "Which vaccine is given subcutaneously according to the Box 9.7 chart?", "o": ["MMR", "Hepatitis B", "Hib", "Pneumococcal conjugate"], "a": [0], "y": "Right: MMR, varicella and IPV (and MPSV4) are subcutaneous in the box. Not hepatitis B, Hib or pneumococcal conjugate: all intramuscular."}, {"ty": "mc", "d": 3, "q": "Which vaccine is given as a nasal spray?", "o": ["Influenza (LAIV) nasal spray", "Influenza (IIV) injection", "Rotavirus by mouth", "Varicella under the skin"], "a": [0], "y": "Right: LAIV is the intranasal live flu vaccine. Not IIV: the injected, killed flu vaccine. Not rotavirus: it is a live vaccine but given by mouth. Not varicella: a live vaccine given subcutaneously."}, {"ty": "sata", "d": 3, "q": "Which vaccines are live attenuated? Select all that apply.", "o": ["MMR", "Varicella", "Rotavirus", "LAIV", "IPV", "Hepatitis B"], "a": [0, 1, 2, 3], "y": "Right: MMR, varicella, rotavirus and LAIV contain weakened live germs, so they are avoided in severely immunocompromised children. Not IPV: killed. Not hepatitis B: recombinant, made from one piece of the virus."}, {"ty": "mc", "d": 3, "q": "A 2-month-old is at the first well visit. Which set of vaccines is correct according to the slide schedule?", "o": ["DTaP, RV, IPV, Hib, PCV and Hep B", "DTaP, RV, IPV and PCV only", "MMR, varicella, DTaP and Hib", "Hep A, flu, IPV and Tdap"], "a": [0], "y": "Right: six vaccines at 2 months. Not DTaP, RV, IPV and PCV: that is the slide list for 4 months. Not MMR and varicella: those start at 12 to 15 months. Not Hep A, flu and Tdap: flu starts at 6 months, Tdap is for age 11 to 12."}, {"ty": "mc", "d": 3, "q": "At the 6-month visit the nurse prepares vaccines. Which is on the slide list for 6 months?", "o": ["DTaP, RV, IPV, Hib, PCV and Hep B", "DTaP, RV, IPV and PCV only, as listed at 4 months", "MMR and varicella together, as given in the second year", "Hep A and MenACWY together, as given in the school years"], "a": [0], "y": "Right: 6 months repeats the 2-month set. Not the 4-month list: that one has no Hib or Hep B on the slide. Not MMR and varicella: toddler vaccines. Not Hep A and MenACWY: Hep A begins at 12 months and MenACWY at 11 to 12 years."}, {"ty": "ord", "d": 3, "q": "Put these in the order a child receives them.", "items": ["Hepatitis B (newborn)", "DTaP #1 (2 months)", "Seasonal flu (6 months)", "MMR #1 (12 to 15 months)", "Tdap (11 to 12 years)"], "y": "Newborn Hep B, then the 2-month series, flu begins at 6 months, MMR at 12 to 15 months, and Tdap at 11 to 12 years."}, {"ty": "mc", "d": 3, "q": "A mother says her 7-month-old has a mild cold and no fever. Which response is correct?", "o": ["Go ahead with the scheduled vaccines, since a mild illness is not a reason to delay", "Delay all vaccines until the cold is completely gone and the child is well", "Give only the live vaccines at this visit because they are the strongest", "Skip these vaccines and start the whole series again at 12 months"], "a": [0], "y": "Right: mild illness with or without a low-grade fever is not a contraindication. Not delaying: that leaves the infant unprotected. Not live vaccines only: live vaccines are given at 12 months and would not be chosen for being 'stronger'. Not restarting: a series is never restarted, it is continued."}, {"ty": "mc", "d": 3, "q": "Which child should not receive MMR?", "o": ["A child on high-dose chemotherapy with severe immunosuppression", "A child with a runny nose and a normal temperature this week", "A child who is allergic to eggs and has had mild hives from eggs", "A child who is exclusively breastfed and whose mother is nursing"], "a": [0], "y": "Right: MMR is a live vaccine, and live vaccines are avoided in severe immunodeficiency because the weakened virus could multiply. Not a runny nose: a mild illness. Not egg allergy: not a contraindication to MMR. Not breastfeeding: no effect."}, {"ty": "mc", "d": 3, "q": "A nurse is preparing diphtheria, tetanus and pertussis protection for a 9-year-old. Which vaccine is used?", "o": ["Tdap, because the child is age 7 or older", "DTaP, because it is the stronger formulation", "MMR, because it contains the pertussis component", "Hib, because it protects against tetanus"], "a": [0], "y": "Right: DTaP is for children under 7 and Tdap for age 7 and older. Not DTaP: only under 7. Not MMR: that is measles, mumps and rubella. Not Hib: it protects against Haemophilus influenzae type b."}, {"ty": "mc", "d": 3, "q": "Which description matches tetanus?", "o": ["Spores from soil enter a wound, causing lockjaw and spasms, with no person-to-person spread", "A thick gray membrane covers the throat and the neck swells, spread by droplets", "A whooping cough with vomiting afterward, spread by droplets and worst in infants", "A red rash that begins on the face after white spots appear inside the cheeks"], "a": [0], "y": "Right: Clostridium tetani spores cause lockjaw and spasms. Not the gray membrane: diphtheria. Not whooping and vomiting: pertussis. Not Koplik spots: measles."}, {"ty": "mc", "d": 3, "q": "Which finding in an infant most strongly points to pertussis?", "o": ["Brief stops in breathing (apnea) after coughing fits, with no whoop", "A bull neck with a thick gray membrane over the throat and tonsils", "Jaw stiffness with an arched back and painful full body muscle spasms", "A lacy rash after a slapped-cheek look on the face of the child"], "a": [0], "y": "Right: infants may not whoop and can have apnea. Not bull neck: diphtheria. Not jaw stiffness: tetanus. Not slapped cheek: fifth disease."}, {"ty": "mat", "d": 3, "q": "Match each vaccine type to its example.", "pairs": [["Toxoid", "The tetanus part of DTaP"], ["Recombinant", "Hepatitis B"], ["Conjugate", "Haemophilus influenzae type b (Hib)"], ["Killed (inactivated)", "Injected polio (IPV)"]], "y": "Toxoid vaccines use inactivated toxin (tetanus, diphtheria). Hepatitis B is recombinant. Hib is a conjugate vaccine because the sugar coat is attached to a protein. IPV contains killed virus."}, {"ty": "mc", "d": 3, "q": "Which statement is correct about the vaccine card for an adolescent (12 to 20 years)?", "o": ["Tdap, HPV and meningococcal at 11 to 12, with a booster at 16", "It includes the first MMR dose, which is given at about 12 years", "It includes DTaP #5 at 16 years as the last booster of the series", "It includes rotavirus at 12 years to protect against diarrhea"], "a": [0], "y": "Right: this is the standard adolescent set (added content). Not first MMR: given at 12 to 15 months. Not DTaP #5: given at 4 to 6 years. Not rotavirus: an infant oral vaccine only."}, {"ty": "mc", "d": 3, "q": "After giving vaccines, which action is the priority?", "o": ["Observe for 15 to 20 minutes with epinephrine available", "Send the family home right away to avoid crowding in the clinic", "Apply a hot pack to the injection sites for 30 minutes after each shot", "Give aspirin right away to prevent a fever after the vaccines"], "a": [0], "y": "Right: severe allergic reaction is the most dangerous early complication. Not sending home immediately: reactions can start in minutes. Not a hot pack: not recommended. Not aspirin: linked to Reye syndrome, so acetaminophen is used if needed."}, {"ty": "ngn", "d": 3, "scen": "A nurse in a pediatric clinic is giving vaccines to a 12-month-old who has had a mild cold for 2 days and a temperature of 99.5 F (37.5 C). The mother says the child had a hive-like rash and wheezing within minutes after the last dose of a vaccine.", "parts": [{"ty": "mc", "d": 3, "q": "What is the most important finding?", "o": ["The hives and wheezing after the previous dose", "The child has had a mild cold for the past two days", "The temperature of 99.5 F (37.5 C) that was measured today", "The child's age of 12 months, which is when the vaccine is due"], "a": [0], "y": "Right: anaphylaxis to a prior dose or a vaccine component is a contraindication. Not the cold or the low temperature: mild illness is not a reason to delay. Not the age: 12 months is when MMR and varicella are due."}, {"ty": "mc", "d": 3, "q": "What should the nurse do?", "o": ["Hold the vaccine and notify the provider about the reaction", "Give the vaccine because the cold is mild and the fever is low", "Give half the dose to reduce the risk of another reaction", "Give the vaccine at the same time as an antihistamine given first"], "a": [0], "y": "Right: do not give it until the provider reviews the reaction. Not giving it: a prior anaphylaxis is a contraindication. Not half a dose: fractional doses are not protective and not safe. Not with diphenhydramine: antihistamine does not stop anaphylaxis."}, {"ty": "sata", "d": 3, "q": "Which are teaching points for this family? Select all that apply.", "o": ["Report all reactions through the Vaccine Adverse Event Reporting System", "Mild soreness and low-grade fever are expected after most vaccines", "Call right away for hives or trouble breathing", "Give aspirin for fever after a vaccine", "A cold means every future vaccine must be skipped"], "a": [0, 1, 2], "y": "Right: VAERS reporting, expected mild reactions, and emergency signs are standard. Not aspirin: Reye syndrome. Not skipping every vaccine: only the one with the contraindication is held."}], "y": ""}], "inf15": [{"ty": "mc", "d": 3, "q": "A child's stool shows a parasitic infection. Which white blood cell would the nurse expect to be raised?", "o": ["Eosinophils", "Neutrophils", "Monocytes", "Basophils"], "a": [0], "y": "Right: eosinophils are the granulocytes involved in parasitic infections (lecture). Not neutrophils: they rise in bacterial infection and are the usual first responders. Not monocytes: the second line for larger, more severe infections. Not basophils: involved in the immune response and allergy, not parasites."}, {"ty": "mc", "d": 3, "q": "Which pair correctly describes the lines of defense?", "o": ["Granulocytes are first line and monocytes handle larger infections", "Monocytes are the first line and granulocytes are the second line", "Lymphocytes are the first line of defense because they act the fastest", "Granulocytes and lymphocytes are both second line cells in this system"], "a": [0], "y": "Right: granulocytes are phagocytic first responders, and monocytes respond to larger, more severe infections. Not the reverse: that swaps them. Not lymphocytes first: they produce and maintain the immune response and are slower. Not both second: granulocytes are the first line."}, {"ty": "mat", "d": 3, "q": "Match each stage of infection to its meaning.", "pairs": [["Incubation", "The pathogen is multiplying and no symptom has shown yet"], ["Prodrome", "Tiredness and muscle aches before the specific signs appear"], ["Illness", "Signs and symptoms of the disease are clearly evident"], ["Convalescence", "Acute symptoms begin to disappear"]], "y": "Incubation is entrance to first symptom with the germ multiplying. Prodrome is the non-specific stage, such as fatigue and muscle aches. Illness is the stage where signs are clear. Convalescence is recovery as acute symptoms fade."}, {"ty": "ord", "d": 3, "q": "Put the stages of an infectious disease in order.", "items": ["Incubation", "Prodrome", "Illness", "Convalescence"], "y": "The germ multiplies silently first, vague symptoms follow, the disease becomes clear, then recovery begins. Communicability can happen across several stages, so it is not a step in the sequence."}, {"ty": "mc", "d": 3, "q": "A child is admitted with active tuberculosis. Which precaution is required?", "o": ["Airborne in a negative pressure room", "Droplet precautions in a private room", "Contact precautions with gown and gloves", "Standard precautions applied to all"], "a": [0], "y": "Right: TB is airborne and needs a negative pressure room with an N95 for staff. Not droplet: that is for flu, pertussis, rubella and meningitis. Not contact: for RSV, scabies and MRSA. Not standard only: that is the minimum for every patient, not enough for TB."}, {"ty": "sata", "d": 3, "q": "Which infections require droplet precautions? Select all that apply.", "o": ["Influenza", "Pertussis", "Rubella", "Meningitis", "Scabies", "Varicella"], "a": [0, 1, 2, 3], "y": "Right: flu, pertussis, rubella and meningitis (viral or bacterial) were her droplet examples. Not scabies: contact. Not varicella: airborne, and contact."}, {"ty": "sata", "d": 3, "q": "Which infections require contact precautions? Select all that apply.", "o": ["RSV", "Scabies", "MRSA", "Measles", "Tuberculosis", "Influenza"], "a": [0, 1, 2], "y": "Right: RSV, scabies and MRSA were her contact examples. Not measles or TB: airborne. Not influenza: droplet."}, {"ty": "mc", "d": 3, "q": "A 5-year-old has varicella. Which room and equipment are correct?", "o": ["Negative pressure room with an N95, plus gown and gloves", "A private room with the door open and a surgical mask only", "A semi-private room, as long as the other child has had chickenpox", "Any room on the unit as long as standard precautions are followed"], "a": [0], "y": "Right: varicella needs airborne precautions and contact precautions for the lesions. Not a mask only: a surgical mask does not stop airborne particles. Not a semi-private room: you cannot share a room with an airborne infection. Not standard: not enough."}, {"ty": "mc", "d": 3, "q": "Which statement shows the nurse understands chemotherapy and hepatitis B in the precaution list?", "o": ["They are managed with standard precautions, and chemo needs safe drug handling", "Both need airborne precautions because they spread through small particles", "Both need droplet precautions with a surgical mask worn by every visitor", "Both need contact precautions with a gown for all visitors and staff"], "a": [0], "y": "Right: neither is spread through the air or by droplets. Chemotherapy is a hazardous drug, so the nurse uses chemo-rated gloves and a gown. The airborne, droplet and contact options are all for infections spread those ways."}, {"ty": "mc", "d": 3, "q": "A nurse is asked which action is the most important way to prevent the spread of infection. Which is correct?", "o": ["Hand washing", "Wearing a gown with every patient", "Using antibiotics early for every fever", "Keeping all children in private rooms"], "a": [0], "y": "Right: hand washing is bold on the slide and the foundation of standard precautions. Not gowns for every patient: only when splashes or contact are expected. Not early antibiotics: unneeded antibiotics promote resistant germs. Not private rooms for all: not needed and does not stop hand-to-hand spread."}, {"ty": "mc", "d": 3, "q": "Which test is ordered to look for inflammation in a child who is being worked up for infection?", "o": ["C-reactive protein (CRP)", "Urine culture and sensitivity", "Throat culture for strep", "Stool culture for bacteria"], "a": [0], "y": "Right: CRP and the sedimentation rate are inflammation markers (the lecture said these check for inflammation). Not the cultures: each looks for a germ in one specimen, not inflammation."}, {"ty": "mc", "d": 3, "q": "A child with suspected sepsis needs blood cultures and antibiotics. What is the correct order?", "o": ["Collect the blood culture first, then give the antibiotic", "Give the antibiotic first so the child starts treatment immediately", "Give the antibiotic and the culture at the same time", "Wait for the CBC before doing either"], "a": [0], "y": "Right: a culture drawn after the antibiotic can be falsely negative. Not antibiotic first: it hides the germ. Not at the same time: the sample is still drawn before the dose goes in. Not waiting for the CBC: delays treatment for sepsis."}, {"ty": "mc", "d": 3, "q": "A febrile child is shivering and has cool hands and feet. What explains this?", "o": ["Prostaglandins raised the set point, so the body acts cold and saves heat", "The child has fallen below the set point and is becoming hypothermic", "The fever has just broken and heat is now leaving through the skin", "The pyrogens destroyed the child's sweat glands so heat cannot escape"], "a": [0], "y": "Right: pyrogens trigger prostaglandins that raise the set point, causing shivering, vasoconstriction and decreased peripheral perfusion. Not hypothermic: the temperature is rising, not falling. Not the fever breaking: when it breaks the child sweats and feels warm. Not sweat glands: pyrogens do not do that."}, {"ty": "num", "d": 2, "q": "A child's temperature is 38.6 C. What is it in degrees Fahrenheit? (Round to the nearest tenth.)", "ans": 101.5, "tol": 0.1, "unit": "F", "y": "38.6 x 9/5 = 69.48. Add 32 = 101.48, which rounds to 101.5 F."}, {"ty": "mc", "d": 3, "q": "A nurse gives an antipyretic. When should the temperature be rechecked?", "o": ["30 to 60 minutes after the dose, with the same site and device", "Right away, so the baseline temperature can be documented again", "After 4 hours, at the time of the next scheduled dose of the medicine", "After 30 to 60 minutes, using a different device to confirm the reading"], "a": [0], "y": "Right: the drug needs 30 to 60 minutes to work, and the same site and device keep the readings comparable. Not right away: that is the baseline, not the response. Not 4 hours: too long to know if it worked. Not a different device: readings differ between devices, so a change might be false."}, {"ty": "sata", "d": 3, "q": "Which nursing actions are correct for a febrile child? Select all that apply.", "o": ["Dress the child in light clothing", "Encourage frequent fluids", "Keep linens and clothing clean and dry", "Assess the temperature at least every 4 to 6 hours", "Give a cold bath until the shivering stops", "Rub the skin with alcohol"], "a": [0, 1, 2, 3], "y": "Right: light clothing, fluids, dry linens and regular temperature checks follow the slides. Not a cold bath: shivering generates heat and raises the temperature. Not alcohol: absorbed through the skin and toxic."}, {"ty": "mc", "d": 3, "q": "A child with an infection says the pain medicine is not working. Which action did the instructor suggest?", "o": ["Use distraction, check the milligram dose, and consider scheduled dosing", "Wait until the pain is severe before giving the next dose of medicine", "Double the dose without asking the provider because it is not working", "Stop the medicine and use only cool mist humidification for comfort"], "a": [0], "y": "Right: check that the dose is right, add distraction, and consider a regular schedule so the level stays built up. Not waiting for severe pain: lets pain get ahead. Not doubling: a dose change needs an order. Not stopping: cool mist is a comfort measure, it does not replace analgesics."}, {"ty": "mc", "d": 3, "q": "A mother stops her child's antibiotic after 3 days because the fever is gone. What is the best response?", "o": ["Explain that the full course clears the infection and prevents resistance", "Tell her it is fine to stop as long as the child is eating and playing well", "Tell her to save the rest of the bottle in case the child gets sick again", "Tell her to switch to an antipyretic since the fever has already gone away"], "a": [0], "y": "Right: stopping early lets surviving germs return and become resistant. Not fine if eating well: appetite does not show the germ is gone. Not saving the rest: unsupervised antibiotics are unsafe. Not an antipyretic: it treats the fever and not the infection."}, {"ty": "mc", "d": 3, "q": "Which diseases can immunizations prevent according to the slide she told you to highlight and star?", "o": ["DTP, MMR, varicella and polio", "Lyme disease, Rocky Mountain spotted fever, malaria and rabies", "Head lice, scabies, pinworm and ringworm in school-age children", "HIV, latex allergy, SCID and other immune disorders in infants"], "a": [0], "y": "Right: the slide lists DTP, MMR, varicella and polio. Not Lyme, RMSF or malaria: vector-borne and not prevented by these vaccines. Not lice, scabies or pinworm: parasites with no vaccine. Not HIV, latex allergy or SCID: not vaccine-preventable."}, {"ty": "ngn", "d": 3, "scen": "A 4-year-old is brought to the clinic with 3 days of fever, a cough and a red blotchy rash that started at the hairline and spread downward. The mother says her child is not vaccinated. The nurse sees tiny white spots inside the child's cheeks.", "parts": [{"ty": "mc", "d": 3, "q": "Which condition does the child most likely have?", "o": ["Rubeola (measles)", "Roseola infantum", "Fifth disease", "Rubella (German measles)"], "a": [0], "y": "Right: white spots on the inner cheeks are Koplik spots, the key finding for rubeola, with cough and a rash that spreads downward. Not roseola: the rash comes after the fever breaks. Not fifth disease: slapped cheeks and a lacy rash. Not rubella: milder, with swollen nodes behind the ears."}, {"ty": "mc", "d": 3, "q": "Which precaution does the nurse put in place?", "o": ["Airborne in a negative pressure room", "Droplet precautions in a private room", "Contact precautions with gown and gloves", "Standard precautions applied to all"], "a": [0], "y": "Right: measles is airborne. Not droplet: rubella is droplet, measles is not. Not contact or standard: neither stops airborne particles."}, {"ty": "sata", "d": 3, "q": "Which findings does the nurse report or watch for? Select all that apply.", "o": ["Unvaccinated status", "Koplik spots", "Cough and fever", "Signs of pneumonia or ear infection", "A pearly gray membrane over the tonsils", "Lockjaw"], "a": [0, 1, 2, 3], "y": "Right: unvaccinated status, Koplik spots, cough and fever, and complications such as pneumonia or otitis media. Not a gray membrane: diphtheria. Not lockjaw: tetanus."}], "y": ""}], "vir15": [{"ty": "mc", "d": 3, "q": "Which finding is the key sign of rubeola (measles)?", "o": ["Koplik spots", "Slapped cheeks", "Fever that breaks before a pink rash", "Itchy vesicles in crops"], "a": [0], "y": "Right: Koplik spots, tiny white spots on the inner cheeks, show before the rash. Not slapped cheeks: fifth disease. Not fever then rash: roseola. Not vesicles in crops: varicella."}, {"ty": "mc", "d": 3, "q": "A mother says her child has bright red cheeks that look slapped and then a lacy rash. Which statement is correct?", "o": ["This is fifth disease, and the child was most contagious before the rash", "This is roseola, the sixth disease, and the child is contagious while the rash shows", "This is rubeola and needs airborne precautions in a negative pressure room", "This is rubella, so the child should avoid pregnant women until the rash is gone"], "a": [0], "y": "Right: slapped cheek is parvovirus B19 (fifth disease), and contagiousness is highest before the rash shows. Not roseola: high fever then a rash on the trunk. Not rubeola: Koplik spots and a hairline-down rash. Not rubella: a different rash with swollen nodes behind the ears."}, {"ty": "mc", "d": 3, "q": "A 12-month-old had 4 days of fever of 104 F (40 C) and looked well. The fever stopped and a pink rash appeared on the trunk. Which disease is this?", "o": ["Roseola infantum", "Rubeola (measles)", "Fifth disease", "Varicella (chickenpox)"], "a": [0], "y": "Right: roseola's rash appears after the fever breaks. Not rubeola: the rash comes with the fever and Koplik spots. Not fifth disease: slapped cheeks. Not varicella: vesicles."}, {"ty": "mc", "d": 3, "q": "Which problem is the greatest reason to keep a child with rubella away from pregnant women?", "o": ["Rubella is teratogenic and can cause congenital rubella syndrome", "Rubella causes fatal pneumonia in pregnant women who are exposed", "Rubella makes the pregnant woman permanently infertile after infection", "Rubella spreads only to pregnant women and not to other adults"], "a": [0], "y": "Right: first-trimester infection can cause cataracts, deafness and heart defects in the fetus. Not fatal pneumonia: not typical. Not infertility: not an effect. Not only pregnant women: anyone nonimmune can catch it."}, {"ty": "mc", "d": 3, "q": "A mother of a child with chickenpox asks what to do for the itching. Which teaching is correct?", "o": ["Trim the nails, use calamine or oatmeal baths, and avoid aspirin", "Let the child scratch gently and give aspirin for the fever and aches", "Apply a corticosteroid cream to the lesions and cover the child tightly", "Keep the child in hot baths for long periods to dry out the lesions"], "a": [0], "y": "Right: nails short prevent scratching and secondary infection, and aspirin is linked to Reye syndrome. Not scratching and aspirin: both harmful. Not steroid cream and covering: raises infection risk and traps heat. Not hot baths: heat worsens itching."}, {"ty": "mat", "d": 3, "q": "Match each viral rash illness to its clue.", "pairs": [["Rubeola", "White spots inside the cheeks before the rash"], ["Roseola", "A rash that shows as the fever breaks"], ["Varicella", "Itchy blisters in all stages at once"], ["Parvovirus B19", "Slapped red cheeks"]], "y": "Koplik spots belong to rubeola. Roseola's rash follows the fever. Varicella has macules, papules, vesicles and crusts together. Parvovirus B19 has slapped cheeks and a lacy rash."}, {"ty": "ord", "d": 3, "q": "Put the stages of a chickenpox lesion in order.", "items": ["Macule", "Papule", "Vesicle", "Pustule", "Crust"], "y": "A lesion starts as a flat red spot, rises to a bump, fills with fluid, turns cloudy, then dries to a crust. In chickenpox you see all of them at once."}, {"ty": "mc", "d": 3, "q": "A child brings home an attached tick. Which action is correct?", "o": ["Grasp it close to the skin with fine-tipped tweezers and pull up steadily", "Twist it counterclockwise to loosen and free the tick's mouthparts", "Cover it with petroleum jelly until it lets go on its own", "Burn it with a hot match so that it backs out of the skin"], "a": [0], "y": "Right: steady upward pull with fine tweezers removes the whole tick. Not twisting: can break off the mouthparts. Not petroleum jelly: the tick stays attached and may release more germs. Not burning: same problem and a burn risk."}, {"ty": "ord", "d": 3, "q": "Put the tick removal steps in order.", "items": ["Use fine-tipped tweezers and protect the fingers", "Grasp the tick as close to the skin as possible", "Pull upward with steady, even pressure", "Clean the site with soap and water and wash hands", "Save the tick for identification"], "y": "Protect yourself, grasp close to the skin, pull steadily without twisting, clean the site, then save the tick in case the child becomes sick."}, {"ty": "mc", "d": 3, "q": "Which drug is used for both Lyme disease and Rocky Mountain spotted fever?", "o": ["Doxycycline", "Permethrin", "Griseofulvin", "Acyclovir"], "a": [0], "y": "Right: doxycycline treats both, and she said to highlight it because there is really no other antibiotic choice. Not permethrin: an antiparasitic for lice and scabies. Not griseofulvin: an antifungal. Not acyclovir: an antiviral."}, {"ty": "mc", "d": 3, "q": "A child with a tick bite has a fever and a pink rash that began at the wrists and ankles and spread to the palms and soles. What should the nurse expect?", "o": ["Rocky Mountain spotted fever, a PCR test and prompt doxycycline", "Lyme disease, whose rash always stays at the site of the tick bite", "Roseola, which is treated with fluids and an antipyretic only", "Fifth disease, which is treated with a course of antibiotics"], "a": [0], "y": "Right: this rash pattern points to RMSF, and treatment should not wait for confirmation because it can be fatal. Not Lyme at the bite site only: that describes erythema migrans, and she said it can appear anywhere. Not roseola: no tick. Not fifth disease: slapped cheeks, and antibiotics do not treat a virus."}, {"ty": "mc", "d": 3, "q": "A mother asks where the bull's-eye rash from a tick bite can appear. Which answer matches the speaker note?", "o": ["Anywhere on the body", "Only at the bite site", "Only on the trunk", "Only on palms and soles"], "a": [0], "y": "Right: the note says it can pop up anywhere. Not only at the site: that is a common mistake. Not only the trunk: not limited. Not palms and soles: that is the RMSF rash."}, {"ty": "sata", "d": 3, "q": "Which diseases are vector-borne? Select all that apply.", "o": ["Lyme disease", "Rocky Mountain spotted fever", "Malaria", "Rabies", "Cat-scratch fever", "Roseola"], "a": [0, 1, 2], "y": "Right: ticks and mosquitoes are vectors. Not rabies or cat-scratch fever: zoonotic, passed directly or indirectly from an animal. Not roseola: a human virus."}, {"ty": "mc", "d": 3, "q": "A child was scratched by a kitten and has a sore node near the scratch. Which category does this infection belong in?", "o": ["Zoonotic", "Vector-borne", "Helminthic", "Sexually transmitted"], "a": [0], "y": "Right: cat-scratch fever passes from an animal to a human. Not vector-borne: that means a tick, mosquito or insect carries it. Not helminthic: worms. Not sexually transmitted: not an infection spread by sex."}, {"ty": "ngn", "d": 3, "scen": "A 9-year-old camped in the woods 5 days ago. He has a fever, severe headache, vomiting and a pink rash on his wrists and ankles that is spreading to his palms. His mother removed a tick last week.", "parts": [{"ty": "mc", "d": 3, "q": "Which disease is suspected?", "o": ["Rocky Mountain spotted fever", "Lyme disease with erythema migrans only", "Pediculosis", "Scabies"], "a": [0], "y": "Right: fever, headache and a wrist and ankle rash moving to palms and soles. Not erythema migrans only: Lyme's rash is an expanding ring, not wrist and ankle petechiae. Not lice or scabies: no tick association."}, {"ty": "mc", "d": 3, "q": "What is the best first treatment action?", "o": ["Start doxycycline as ordered without waiting for confirmation", "Wait for the PCR result before giving any treatment to the child", "Give permethrin cream from head to toe and wash it off later", "Give an antipyretic and reassess the child again in 3 days"], "a": [0], "y": "Right: treat quickly because delay can be fatal, and send a PCR test. Not waiting: dangerous. Not permethrin: for scabies. Not only an antipyretic: leaves the infection untreated."}, {"ty": "sata", "d": 3, "q": "Which teaching points does the nurse give? Select all that apply.", "o": ["Use repellent and check the body after being outdoors", "Remove ticks right away with fine-tipped tweezers", "Save the tick for identification", "Ticks are removed by twisting", "Doxycycline is optional for this disease"], "a": [0, 1, 2], "y": "Right: prevention, correct removal and saving the tick. Not twisting: leaves mouthparts. Not optional: doxycycline is the treatment."}], "y": ""}, {"ty": "sata", "d": 2, "q": "Which illnesses are viral exanthems on the slide? Select all that apply.", "o": ["Rubella", "Rubeola", "Varicella zoster", "Parvovirus B19", "Roseola infantum", "Scabies", "Pinworm"], "a": [0, 1, 2, 3, 4], "y": "Right: all five are viral illnesses with a characteristic rash. Not scabies: a mite. Not pinworm: a worm."}, {"ty": "mc", "d": 3, "q": "Which assessment question helps identify possible Lyme disease?", "o": ["Has your child been in the woods or a wooded area?", "Has your child been in contact with a kitten or other pet recently?", "Has your child been in contact with a child who has a cold?", "Has your child been swimming in a lake or a pool recently?"], "a": [0], "y": "Right: ticks live in woods and brush. Not kitten contact: cat-scratch fever. Not cold contact: respiratory infection. Not swimming: not linked to Lyme."}, {"ty": "mc", "d": 3, "q": "When can a child with chickenpox return to school?", "o": ["When all of the lesions have crusted over", "When the fever is gone and the child feels well again", "As soon as the last new blister has formed", "After 5 days no matter what the lesions look like"], "a": [0], "y": "Right: crusted lesions are no longer contagious. Not fever gone: lesions may still hold virus. Not the last blister formed: it may still be fluid filled. Not 5 days: the rule is the state of the lesions."}], "skn15": [{"ty": "mc", "d": 3, "q": "A mother asks how long head lice nits take to hatch and how long lice survive away from the scalp. Which answer is correct?", "o": ["Nits hatch in 7 to 10 days, and lice live about 48 hours off the host", "Nits hatch in 24 hours, and lice live a week off the host", "Nits hatch in 14 days, and lice live 14 days off the host", "Nits hatch in 7 days, and lice die within an hour off the host"], "a": [0], "y": "Right: these are the slide numbers. Not 24 hours and a week: both wrong. Not 14 and 14: 14 days is how long items are bagged. Not an hour: lice survive about 48 hours."}, {"ty": "mc", "d": 3, "q": "A child has head lice. Which instruction is correct?", "o": ["Fine-tooth comb daily for 1 week, repeat the shampoo in 7 days, and check the family", "Use permethrin once and no combing or family checks are needed afterward at all", "Shave the child's head and treat only the child with the shampoo one time", "Share one comb among the family so that everyone is treated the same way at once"], "a": [0], "y": "Right: this matches the slide and lecture. Not once without combing: nits can survive. Not shaving and treating only the child: not required and family members need checking. Not sharing a comb: spreads lice."}, {"ty": "mc", "d": 3, "q": "Which action handles items that cannot be washed after a child has head lice?", "o": ["Seal them in a plastic bag for 14 days", "Leave them in the open air in a sunny room for 2 days", "Place them in the home freezer for 1 hour before using them again", "Spray them with the same shampoo used on the child's hair"], "a": [0], "y": "Right: 14 days in a sealed bag outlasts lice and hatching nits. Not 2 days in the open: lice live 48 hours, but nits hatch in 7 to 10 days. Not 1 hour in a freezer: not enough. Not spraying shampoo: not a recommended method."}, {"ty": "sata", "d": 3, "q": "Which instructions are correct for a family with head lice? Select all that apply.", "o": ["Avoid sharing hats, combs and brushes", "Wash linens in hot water", "Check all family members", "Remove nits with a fine-tooth comb for 1 week", "Stay out of school for a month", "Use the shampoo on everyone in the house whether or not they have lice"], "a": [0, 1, 2, 3], "y": "Right: these match the slide and lecture. Not a month out of school: not required. Not treating everyone regardless: examine and treat those who are infested."}, {"ty": "mc", "d": 3, "q": "A nurse teaches a mother to apply permethrin cream to her child with scabies. Which statement shows correct understanding?", "o": ["Bathe, dry off, apply head to toe on clean skin, leave on 8 to 12 hours, wash off", "Apply it to the rash only, and wash it off after 30 minutes", "Apply it at bedtime on unwashed skin, and leave it on for 24 hours overnight", "Apply it from the neck down, and rinse it off after 1 hour in the shower"], "a": [0], "y": "Right: this is the highlighted application: clean skin, head to toe, 8 to 12 hours, then wash off. Not the rash only: mites are all over the skin. Not unwashed for 24 hours: wrong time and prep. Not the neck down for 1 hour: head to toe, and 1 hour is too short."}, {"ty": "mc", "d": 3, "q": "How is scabies usually diagnosed?", "o": ["By a skin scraping looked at under the microscope", "By a scotch tape test done on 3 nights in a row at bedtime", "By a throat culture swabbed from the back of the throat", "By a blood culture drawn before the first dose of an antibiotic"], "a": [0], "y": "Right: lecture said skin scraping. Not tape: that is pinworm. Not a throat or blood culture: not used for a skin mite."}, {"ty": "mc", "d": 3, "q": "Which action is correct for the household of a child with scabies?", "o": ["Wash beddi
