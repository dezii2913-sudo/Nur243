<script>
const D={"tabs": [{"id": "star", "icon": "⭐", "title": "Quiz flags and stars", "sub": "Every star, highlight and speaker note from the three decks plus what she said to star on the Nov 17 recording. Start here before the quiz.", "sections": [{"h": "What she said on the recording", "star": true, "blocks": [{"t": "ul", "items": ["★ **Quiz is Thursday.** These chapters (9, 15, 25) are tested, and she is doing a review session before it", "★ **Lyme disease and Rocky Mountain spotted fever are on your quiz AND your final.** Highlight doxycycline. PCR test. If allergic to doxycycline, weigh benefit against risk because there is really no other antibiotic choice", "★ **She said to star in gold:** viral exanthems (page 472 to 475 in the text, ATI pages 241 to 244)", "★ **She said to highlight and star:** role of immunizations in preventing childhood infections, pediculosis (head lice), scabies (permethrin and how to apply it), pinworm, types of immunity (Ch 25), immunity (Ch 9)", "★ **Tick questions are 'easy questions'** she loves: fine-tipped tweezers, close to the skin, pull upward steady, do not leave parts, wash, save the tick", "★ **Transmission precautions:** she had the class give examples. Airborne: measles, varicella, TB, smallpox. Droplet: flu, pertussis, rubella, meningitis. Contact: varicella, scabies, RSV, MRSA", "★ **HIV: know the 3 drug classes** of the 3-drug regimen (NRTIs, NNRTIs, protease inhibitors). Her big takeaway with safely caring for immunocompromised patients", "★ **HIV tests:** PCR (viral load, DNA and RNA) under 18 months. Antibody test over 18 months. ELISA is less accurate in infants. CD4 under 200", "★ **Universal screening example:** lead testing in Virginia", "★ **Subcutaneous vaccines to know:** MMR, varicella, polio (IPV), meningococcal polysaccharide. Immunocompromised children avoid live vaccines", "★ **She said the CDC vaccine schedule chart is easier to memorize.** Know the schedule well and do not stress about how it is listed on the slide", "★ **Fever cutoffs vary by institution:** 100.3 or 100.5. Follow the order or policy", "★ **Pain medicine not working:** distraction, check the milligram dose, schedule it around the clock", "★ **Review session (Nov 18), precautions:** airborne mnemonic **MTV** = Measles, Tuberculosis, Varicella. Droplet: mumps, rubella, meningitis", "★ **Review session, head lice:** medicated shampoo, comb, check the whole family, wash all bedding and clothing in hot water. Eggs can live on surfaces **3 to 7 days**", "★ **Review session, pinworm:** tape test. Anti-helminthic drugs **pyrantel pamoate, albendazole, mebendazole**. Parental commitment is a big one", "★ **Review session, scabies:** shower, cream head to toe at bedtime, leave 8 to 12 hours, rinse in the morning, hot wash bedding, treat family and contacts", "★ **Review session, Lyme disease:** ask if the child has been in the woods or a wooded area. Tick removal: fine-tipped tweezers, protect your hands, pull straight up, no twisting or jiggling, no heat and no petroleum jelly", "★ **Review session, athlete's foot:** antifungal cream, keep feet dry, change socks regularly", "★ **Review session, rashes:** Koplik spots = measles. Slapped cheek = parvovirus B19 (fifth disease). Chickenpox: oatmeal baths, acyclovir for high risk, back to school once all lesions are crusted over"]}]}, {"h": "Slides she starred", "star": true, "blocks": [{"t": "tbl", "head": ["Chapter", "Slides with a star on them"], "rows": [["**Ch 9**", "Immunity (passive and active). Vaccines list. Vaccine-preventable diseases (DTaP and Tdap template). Vaccine administration routes"], ["**Ch 15**", "Vector-borne infections. Stages of infectious disease. Limiting the spread of infections (standard, airborne, droplet, contact). Viral exanthems. Teaching guidelines for tick removal. Ticks (Lyme disease and Rocky Mountain spotted fever). Pediculosis. Scabies. Tinea (ringworm). Parasite and helminthic infections. Pinworm. Nursing interventions to promote skin integrity"], ["**Ch 25**", "Types of immunity. Latex allergy and cross-reactivity"]]}]}, {"h": "Highlights", "star": true, "blocks": [{"t": "tbl", "head": ["Where", "What was highlighted"], "rows": [["**Ch 15: Vector-borne infections**", "==Lyme disease== and ==Rocky Mountain spotted fever=="], ["**Ch 15: Viral exanthems**", "==Slapped cheek or fifth disease== (parvovirus B19)"], ["**Ch 15: Scabies**", "==Permethrins, Lindane==. ==Shower, dry off, apply on clean skin head to toe over the time ordered (8 to 12 hours) and wash off=="], ["**Bold on the slides**", "Hand washing (Ch 15). Risk assessment, universal screening, selective screening (Ch 9). Immunity, passive immunity, active immunity (Ch 9). Granulocytes, lymphocytes, monocytes (Ch 15)"]]}]}, {"h": "Speaker notes from the slides", "star": true, "blocks": [{"t": "tbl", "head": ["Slide", "Speaker note", "Why it matters"], "rows": [["**Ch 9: Vaccines and schedules**", "Make a vaccine card: Infant (birth to 1 year), Toddler (over 1 to 3), Preschool (4 to 6), School age (6 to 12), Adolescent (12 to 20)", "Expect questions that match a vaccine to an age group"], ["**Ch 15: Limiting the spread**", "Each student gets a precaution type for: measles, TB (active), varicella, COVID, meningitis, hepatitis A, hepatitis B, chemotherapy, MRSA", "She will ask which precaution goes with which disease"], ["**Ch 15: Ticks**", "Lyme disease and Rocky Mountain spotted fever. Doxycycline treatment. PCR testing", "Both diseases, same drug"], ["**Ch 15: Erythema migrans**", "Can pop up anywhere on the body after a tick bite", "Do not limit it to the bite site"], ["**Ch 15: Pediculosis**", "Permethrin 1% shampoo, repeat in 7 days. Spinosad children over 4 years. Hot water or sealed plastic bag for 14 days", "Numbers are testable"], ["**Ch 15: Scabies**", "Parasitic infection", "Hot wash and dry bedding. Treat the family"], ["**Ch 15: Tinea**", "Fungal infection. Clotrimazole. Selenium shampoo. Oral griseofulvin without corticosteroid. Treat pets. Feet and body: tolnaftate. Griseofulvin for scalp. Fluconazole is systemic", "Which drug for which site"], ["**Ch 15: Pinworm**", "Swallowing tiny eggs. Clear scotch tape 3 nights in a row. Fecal-oral. Itching worse at night", "Diagnosis steps"], ["**Ch 25: SCID**", "X-linked or autosomal recessive. Absent T-cell and B-cell function. Potentially fatal. Stem cell or bone marrow replacement. IVIG. Lifelong. Future CRISPR", "Genetics and treatment"], ["**Ch 25: HIV labs**", "CD4 under 200. Under 18 months use the PCR test", "Which test for an infant"], ["**Ch 25: HIV goals**", "Vertical transmission is mother to infant in utero or via breast milk. Horizontal is nonsterile needles, blood products, tattooing", "Vertical vs horizontal"], ["**Ch 25: Latex allergy**", "IgE-mediated response, anaphylaxis", "Why the reaction is dangerous"]]}]}, {"h": "Why: immunity and vaccines", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["Active immunity lasts and passive fades", "Active: the child's own cells make antibodies and memory cells. Passive: borrowed antibodies are used up"], ["A vaccine gives active immunity", "It trains the child's own immune system"], ["MMR and varicella are live, so not for severe immunodeficiency or pregnancy", "A weakened live germ can still multiply and cause disease if the immune system cannot control it"], ["MMR, varicella and IPV are subcutaneous", "Live vaccines and IPV were tested under the skin, and this is the route the box lists"], ["Infants get IM shots in the thigh", "Vastus lateralis has the most muscle mass at that age. The deltoid is too small"], ["Tetanus is not passed person to person", "It comes from spores in soil entering a wound"], ["Infants under 1 year are at highest risk from pertussis", "They have not finished the series, and they can stop breathing instead of whooping"], ["Mild illness is not a reason to delay a vaccine", "A cold does not weaken the response enough to matter"]]}]}, {"h": "Why: infection", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["Granulocytes are the first line", "Neutrophils reach an infection first and eat germs"], ["Hand washing is bold on the slide", "Hands carry germs from patient to patient, so washing breaks the chain"], ["Measles, TB and varicella are airborne", "Their particles are tiny and stay in the air, so they need a negative pressure room and an N95"], ["Meningitis (bacterial) is droplet", "It spreads by larger respiratory droplets over a short distance, so a surgical mask is enough"], ["Check temperature 30 to 60 minutes after an antipyretic", "That is when the drug has had time to work"], ["Use the same site and device for temperatures", "Different sites read differently, so changes may be false"], ["Roseola rash appears after the fever breaks", "The virus causes days of high fever, then the body clears it and the rash shows"], ["Fifth disease is not contagious once the rash shows", "The child spread the virus before the rash appeared"], ["Do not twist a tick", "The mouthparts can break off in the skin"], ["Doxycycline for RMSF is started right away", "The disease can kill within days, and labs lag behind"], ["Wash all bedding and clothing in hot water after lice", "Eggs can live on surfaces 3 to 7 days, so items can reinfest the child"], ["Back to school after chickenpox when all lesions are crusted", "Crusted lesions no longer hold live virus, so the child is no longer contagious"], ["Keep feet dry and change socks for athlete's foot", "Fungus grows in warm, moist skin, so dry feet and clean socks slow it"], ["Parental commitment for pinworm", "Everyone in the home must be treated and follow hygiene, or the worms are passed back"], ["Scabies and pinworm itch more at night", "Mites and worms are more active when the child is warm and still"], ["Treat the whole family for scabies and pinworm", "Others carry it without symptoms and pass it back"], ["No corticosteroid for ringworm", "A steroid suppresses the skin's defenses and lets the fungus grow"]]}]}, {"h": "Why: immune disorders", "star": true, "blocks": [{"t": "tbl", "head": ["Know this", "Why"], "rows": [["Cellular = T cells, humoral = B cells", "Cellular means cells do the attacking. Humoral means antibodies in body fluids (humor)"], ["IgG crosses the placenta, the others do not", "Only IgG is small enough and has the transport receptor"], ["Infants are weak at 3 to 6 months", "Maternal IgG fades before their own antibodies catch up"], ["SCID needs a stem cell transplant", "It replaces the missing T and B cell factory"], ["PCR for HIV in infants, not ELISA", "ELISA looks for antibodies and the infant still carries the mother's"], ["Latex allergy causes anaphylaxis", "IgE triggers a sudden release of histamine"], ["Latex allergy and banana, avocado, kiwi", "Some food proteins look like latex proteins"]]}]}, {"h": "Ch 9 | Immunity: passive vs active", "star": true, "blocks": [{"t": "tbl", "head": ["Term", "Definition (slide)", "Examples (added)"], "rows": [["★ **Immunity**", "Ability to destroy and remove a specific **antigen** from the body", "Antibody or T-cell response to one specific germ"], ["★ **Passive immunity**", "Produced when the **immunoglobulins of one person are transferred to another**", "Maternal IgG across the placenta, breast milk, IV immune globulin, HBIG after exposure. Short-lived"], ["★ **Active immunity**", "Acquired when a person's **own immune system generates** the immune response", "Having the disease or getting a vaccine. Long-lasting"]]}, {"t": "note", "k": "anno", "x": "Why a vaccine is active: it teaches the child's own body to make antibodies and memory cells, so the protection lasts. Borrowed antibodies fade in weeks to months."}]}, {"h": "Ch 9 | Vaccines on the list", "star": true, "blocks": [{"t": "tbl", "head": ["Vaccine", "Protects against", "Type (added)"], "rows": [["★ **DTaP, Tdap**", "Diphtheria, tetanus, pertussis", "Toxoid plus acellular pertussis"], ["★ **Hib**", "Haemophilus influenzae type b: meningitis, epiglottitis, pneumonia", "Conjugate"], ["★ **IPV**", "Polio", "Killed"], ["★ **MMR**", "Measles, mumps, rubella", "Live attenuated"], ["★ **Hep A**", "Hepatitis A", "Killed"], ["★ **Hep B**", "Hepatitis B", "Recombinant"], ["★ **Varicella (Var)**", "Chickenpox", "Live attenuated"], ["★ **Pneumococcal (PCV, PPSV)**", "Pneumococcus: pneumonia, meningitis, sepsis, ear infections", "PCV conjugate. PPSV polysaccharide for high-risk children"], ["★ **Influenza (IIV, LAIV)**", "Influenza", "IIV killed (shot). LAIV live (nasal spray)"], ["★ **Rotavirus (RV)**", "Severe diarrhea and dehydration in infants", "Live attenuated, given by mouth"], ["★ **HPV (HPV2, HPV4)**", "Human papillomavirus: cervical and other cancers, genital warts", "Recombinant"], ["★ **Meningococcal**", "Meningococcal meningitis and sepsis", "Conjugate (MenACWY) or protein (MenB)"]]}]}, {"h": "Ch 9 | Vaccine administration routes (Box 9.7)", "star": true, "blocks": [{"t": "tbl", "head": ["Intramuscular", "Subcutaneous", "Intranasal"], "rows": [["★ DTaP, DT, Tdap", "★ IPV", "★ Influenza (LAIV)"], ["★ Hepatitis A, hepatitis B", "★ **MMR**", ""], ["★ Hib", "★ Varicella", ""], ["★ Influenza (RIV, IIV)", "★ MPSV4", ""], ["★ Pneumococcal conjugate (PCV)", "", ""], ["★ HPV", "", ""], ["★ MCV4", "", ""], ["★ IPV", "", ""]]}, {"t": "note", "k": "star", "x": "Lecture: IM is how most vaccines are given, but know the subcutaneous ones: MMR, varicella, polio (IPV) and the meningococcal polysaccharide vaccine (MPSV4). The box also lists IPV under IM, so either route is accepted for IPV. LAIV is the nasal spray."}]}, {"h": "Ch 9 | Birth to 1 year schedule (slide) and the vaccine card", "star": true, "blocks": [{"t": "tbl", "head": ["Age", "Vaccines", "Notes"], "rows": [["★ **Newborn**", "Hep B", "First dose"], ["★ **2 months**", "DTaP, RV, IPV, Hib, PCV, Hep B", "Six vaccines at the first visit"], ["★ **4 months**", "DTaP, RV, IPV, PCV", "+ The CDC schedule also gives Hib at 4 months. The slide leaves it out"], ["★ **6 months**", "DTaP, RV, IPV, Hib, PCV, Hep B", "Last visit of the primary series"], ["★ **6 to 12 months**", "Seasonal flu vaccine", "+ Two doses 4 weeks apart the first season"]]}, {"t": "note", "k": "star", "x": "Speaker note: make a vaccine card for each age group: Infant (birth to 1 year), Toddler (over 1 to 3 years), Preschool (4 to 6 years), School age (6 to 12 years), Adolescent (12 to 20 years). The rows below finish the card."}]}, {"h": "Ch 9 | Vaccine-preventable diseases: DTaP and Tdap", "star": true, "blocks": [{"t": "tbl", "head": ["Item", "Answer"], "rows": [["★ **Vaccine**", "DTaP (children under 7). Tdap (age 7 and older, including the 11 to 12 year booster and each pregnancy)"], ["★ **Type of vaccine**", "Toxoid (diphtheria and tetanus) plus an acellular pertussis component. The lowercase **a** in DTaP means acellular, the lowercase **d** and **p** in Tdap mean reduced doses"], ["★ **Who is at risk**", "Unvaccinated children. Infants under 1 year are at the highest risk from pertussis, because they cannot finish the series until 6 months"]]}, {"t": "tbl", "head": ["Disease and cause", "Manifestations", "Treatment and key point"], "rows": [["★ **Diphtheria**. Corynebacterium diphtheriae. Droplet. A toxin damages the throat, heart and nerves", "Sore throat, fever, thick gray **pseudomembrane** over the tonsils and throat, swollen neck ('bull neck'), airway obstruction, myocarditis", "Diphtheria antitoxin plus an antibiotic. Airway is the priority"], ["★ **Tetanus**. Clostridium tetani spores in soil and dirty wounds. **Not** spread person to person", "Jaw stiffness (**lockjaw**), painful muscle spasms, arched back, spasm of the face", "Tetanus immune globulin, wound cleaning, antibiotic, muscle relaxants, quiet dark room"], ["★ **Pertussis**. Bordetella pertussis. Droplet. Whooping cough", "Starts like a cold, then violent coughing fits with a **whoop**, vomiting after coughing. Infants may have **apnea** instead of a whoop", "Macrolide antibiotic such as azithromycin. Droplet precautions. Infants are watched for apnea"]]}, {"t": "note", "k": "anno", "x": "The slide lists these as a template with the answers blank. All content here is added from standard references."}]}, {"h": "Ch 15 | Stages of infectious disease", "star": true, "blocks": [{"t": "tbl", "head": ["Stage", "Meaning"], "rows": [["★ **Incubation**", "Time from the germ **entering** the body to the **first symptom**. The germ is actively multiplying"], ["★ **Prodrome**", "From **non-specific symptoms** (fatigue, malaise) to more specific symptoms of the disease"], ["★ **Illness**", "Signs and symptoms are **clearly evident**"], ["★ **Convalescence**", "Acute symptoms **begin to disappear**"], ["★ **Communicability**", "The slide asks: during which phase is the disease communicable? Added: Often from late incubation through the illness, so a child can spread a germ before anyone knows they are sick"]]}, {"t": "note", "k": "anno", "x": "Why this order: the germ grows silently first, vague symptoms show next, then the disease declares itself, then the body recovers."}]}, {"h": "Ch 15 | Limiting the spread of infection", "star": true, "blocks": [{"t": "tbl", "head": ["Tier", "Precaution", "What to do (added)"], "rows": [["★ **Tier one: standard**", "For **every** patient. Handwashing is the key action", "Hand hygiene, gloves, gown, mask or eye protection when blood or body fluids could splash"], ["★ **Tier two: airborne**", "Tiny particles that stay in the air", "Negative pressure room, door closed, fit-tested **N95** for staff"], ["★ **Tier two: droplet**", "Larger droplets that travel a short distance", "Private room, **surgical mask** on entering"], ["★ **Tier two: contact**", "Direct touch or contaminated surfaces", "Private room, **gown and gloves**, dedicated equipment"]]}, {"t": "note", "k": "star", "x": "Lecture: she handed out 3 note cards (airborne, droplet, contact) and had the class give examples. Speaker note list: measles, TB (active), varicella, COVID, meningitis, hepatitis A, hepatitis B, chemotherapy, MRSA."}, {"t": "note", "k": "star", "x": "Review session (Nov 18): the airborne mnemonic is **MTV**: **M**easles, **T**uberculosis, **V**aricella. Droplet: **mumps**, rubella and meningitis. Smallpox stays airborne."}, {"t": "note", "k": "anno", "x": "Memory aids (added, not from her): droplet is **Mr. IMP** = Mumps, Rubella, Influenza, Meningitis, Pertussis. Contact is **MRS. V** = MRSA, RSV, Scabies, Varicella (varicella is also airborne). Airborne is **MTV** = Measles, Tuberculosis, Varicella."}]}, {"h": "Ch 15 | Role of immunizations in preventing childhood infections", "star": true, "blocks": [{"t": "ul", "items": ["★ **Lecture: highlight and star this slide**"]}]}, {"h": "Ch 15 | Viral exanthems (rash illnesses)", "star": true, "blocks": [{"t": "tbl", "head": ["Disease and cause", "Key signs (added)", "Nursing and teaching (added)"], "rows": [["★ **Rubella** (German measles). Rubella virus. Droplet", "Mild fever, pink rash starting on the face and spreading down, swollen **posterior auricular and suboccipital** nodes. Clears in about 3 days", "Prevented by MMR. **Teratogenic**: keep away from pregnant women (congenital rubella: cataracts, deafness, heart defects)"], ["★ **Rubeola** (measles). Measles virus. **Airborne**", "Fever, **cough, coryza, conjunctivitis**, **Koplik spots** (tiny white spots on the inner cheeks) before the rash, then a red blotchy rash from the hairline down", "Airborne precautions, vitamin A, dim room for photophobia. Watch for otitis media, pneumonia, encephalitis"], ["★ **Varicella zoster** (chickenpox). **Airborne and contact**", "Itchy **vesicles** in crops. Macule, papule, vesicle, pustule, crust, with **all stages at once**", "Contagious 1 to 2 days before the rash until all lesions are crusted. Trim nails, calamine or oatmeal baths, acyclovir (an antiviral) for high-risk children, **no aspirin**. Review session: the child may **return to school once all lesions are crusted over (scabbed)**"], ["★ **Parvovirus B19** (==slapped cheek or fifth disease==). Droplet", "Bright red **slapped cheeks**, then a lacy rash on the trunk and limbs that can return with heat or sun", "Contagious **before** the rash, so a child with the rash can attend school. Dangerous in sickle cell disease, pregnancy and immunocompromise"], ["★ **Roseola infantum** (exanthem subitum or sixth disease). Human herpesvirus 6. Ages 6 months to 2 years", "**High fever for 3 to 5 days**, then the fever **breaks** and a rose-pink rash appears on the trunk", "Antipyretics and fluids. Febrile seizures can occur. The rash comes **after** the fever"]]}, {"t": "note", "k": "anno", "x": "Reference on the slide: Carmen and Kyle text pages 472 to 477, ATI pages 241 to 244. Fifth disease and slapped cheek are highlighted. The columns after the disease name are added."}]}, {"h": "Ch 15 | Vector-borne infections", "star": true, "blocks": [{"t": "tbl", "head": ["Item", "Content"], "rows": [["**Types**", "==Lyme disease==, ==Rocky Mountain spotted fever== (both highlighted), malaria"]]}]}, {"h": "Ch 15 | Ticks: Lyme disease and Rocky Mountain spotted fever", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Lyme disease", "Rocky Mountain spotted fever"], "rows": [["★ **A&P**", "+ Borrelia burgdorferi, from the **black-legged (deer) tick**. Needs about 36 to 48 hours attached", "+ Rickettsia rickettsii, from the **American dog tick or wood tick**"], ["★ **Manifestation**", "**Erythema migrans** expanding red ring, fever, fatigue, headache, joint and muscle aches. Later: facial palsy, heart block, arthritis", "+ Fever, severe headache, nausea and vomiting, then a rash **starting at the wrists and ankles** and spreading to palms, soles and trunk, becoming **petechial**"], ["★ **Diagnosis**", "+ Clinical rash plus blood antibody tests (ELISA then Western blot)", "**PCR testing** (note). Added: Blood tests can be negative early"], ["★ **Treatment**", "**Doxycycline** (note). Added: Amoxicillin or cefuroxime for young children", "**Doxycycline** (note). Added: Start **immediately**, do not wait for the lab result"], ["★ **Nursing education**", "Assessment question (review session): **ask if the child has been in the woods or a wooded area**. Added: Repellent, long sleeves, tick checks after being outdoors, shower, remove ticks right away", "+ Same prevention. Report fever or rash within about 2 weeks of a bite"]]}, {"t": "note", "k": "star", "x": "Speaker note: Lyme disease and Rocky Mountain spotted fever, doxycycline for treatment, PCR testing. Lecture: Lyme disease will be on your quiz AND your final. Highlight doxycycline, it is very important. If a child is allergic to doxycycline, weigh the benefit against the risk, because there is really no other antibiotic choice. A PCR test is sent if either disease is suspected."}]}, {"h": "Ch 15 | Erythema migrans", "star": true, "blocks": [{"t": "ul", "items": ["★ **Speaker note and lecture:** the bull's-eye rash is caused by the bacteria after the tick bite and can show up **anywhere on the body**. It may appear within days of the bite"]}]}, {"h": "Ch 15 | Teaching guidelines for tick removal", "star": true, "blocks": [{"t": "tbl", "head": ["Step", "Action"], "rows": [["★ 1", "Use **fine-tipped tweezers**"], ["★ 2", "Protect fingers with a tissue, paper towel or latex gloves"], ["★ 3", "Grasp the tick **as close to the skin as possible** and **pull upward** with steady, even pressure"], ["★ 4", "Do **not twist, jiggle or jerk** the tick"], ["★ 5", "Clean the site with soap and water and wash your hands"], ["★ 6", "**Save the tick** for identification in case the child becomes sick"]]}, {"t": "note", "k": "anno", "x": "Why not twist or jerk: the mouthparts can break off and stay in the skin. Review session: **do not use heat** (matches or lighters) **or petroleum jelly**. These are not safe ways to remove a tick."}]}, {"h": "Ch 15 | Parasitic and helminthic infections (overview)", "star": true, "blocks": [{"t": "tbl", "head": ["Group", "Infections on the slide"], "rows": [["★ **Parasitic infections**", "Pediculosis capitis (head lice), pediculosis pubis (pubic lice), scabies, tinea (ringworm)"], ["★ **Helminthic infections**", "Pinworm, hookworm, ascariasis"]]}, {"t": "note", "k": "anno", "x": "The slide groups tinea (ringworm) under parasitic, but the speaker note on the tinea slide says fungal infection. Know both: it is listed here, and it is a fungus."}]}, {"h": "Ch 15 | Pediculosis (head lice)", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "Pediculosis capitis: **infestation of the hair and scalp**. Added: Lice crawl, they do not jump. Spread by head-to-head contact and shared combs, hats and brushes. Not caused by poor hygiene"], ["★ **Manifestation**", "**Nits on the shaft of the hair near the scalp**. Nits **hatch in 7 to 10 days**. Lice **live 48 hours off the host**. Review session: **eggs can live on surfaces for 3 to 7 days**. Added: Itching scalp, especially behind the ears and at the nape"], ["★ **Diagnosis**", "**Visual inspection**"], ["★ **Treatment**", "**Pediculicide**. Permethrin 1% shampoo, **repeat in 7 days**. Spinosad for children **over 4 years**"], ["★ **Nursing education**", "**Remove nits with a fine-tooth comb daily for 1 week**. **Avoid sharing** hats, combs and brushes. **Examine all family members**. Review session: **wash all bedding and clothing in hot water**. Wash linens in hot water or **bag items in a sealed plastic bag for 14 days**"]]}, {"t": "note", "k": "star", "x": "Speaker notes: permethrin 1% shampoo repeat in 7 days. Spinosad children over 4 years. Wash in hot water or bag in a sealed plastic bag for 14 days. Lecture: highlight and star this slide. Memory trick: capitis = cap (head). Pediculosis pubis lives in the pubic area."}]}, {"h": "Ch 15 | Scabies", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "**Sarcoptes scabiei** mite. Added: Spread by skin-to-skin contact. Parasitic infection (note)"], ["★ **Manifestation**", "**Burrows under the skin**. Added: Intense itching worse at night between the fingers, wrists, waist, armpits and groin"], ["★ **Diagnosis**", "**Skin scraping** (lecture)"], ["★ **Treatment**", "==Permethrins, Lindane== (highlighted). Added: Permethrin 5% cream is first choice. Lindane is a last resort and can cause seizures, so avoid in infants"], ["★ **Nursing education**", "==Shower, dry off, apply on clean skin head to toe, leave on for the time ordered (8 to 12 hours), then wash off== (highlighted). **Hot wash and dry** bedding and clothing. **Treat the family**"]]}, {"t": "note", "k": "star", "x": "Lecture: highlight and star permethrin and how to apply it. Review session: shower and put it on before bedtime, leave it on overnight, rinse it off in the morning after breakfast (8 to 12 hours). Wash all bedding in hot water and treat all family members and contacts. Spread by direct (skin-to-skin) contact. Itching can last 2 to 4 weeks after treatment, which does not mean the treatment failed."}]}, {"h": "Ch 15 | Tinea (ringworm)", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "Fungal infection (note). Added: Dermatophytes live in skin, hair and nails. Types: capitis (scalp), corporis (body), pedis (feet), cruris (groin)"], ["★ **Manifestation**", "**Scaly, red, dry, itchy** rash (lecture). Added: Round patch with a clear center and a raised edge. Scalp: scaly bald patch with broken hairs"], ["★ **Diagnosis**", "**Skin scraping** (lecture). Added: KOH exam, Wood's lamp or fungal culture"], ["★ **Treatment**", "**Clotrimazole** topical (lecture summary lists clotrimazole and **nystatin** as the antifungal medications). **Selenium shampoo**. **Oral griseofulvin without a corticosteroid** for tinea capitis. **Tolnaftate** for feet and body (tinea pedis). **Fluconazole (Diflucan)** is systemic"], ["★ **Nursing education**", "**Treat pets**. Added: Keep skin dry, do not share combs, hats or towels, wear sandals in locker rooms"]]}, {"t": "note", "k": "star", "x": "Speaker notes: griseofulvin for tinea (ringworm) of the scalp. Tolnaftate for tinea pedis (athlete's foot), an antifungal. Review session, athlete's foot: use an **antifungal cream**, **keep the feet dry** and **change socks regularly**. Fluconazole (Diflucan) is systemic."}]}, {"h": "Ch 15 | Pinworm", "star": true, "blocks": [{"t": "tbl", "head": ["Template item", "Content"], "rows": [["★ **A&P**", "+ Enterobius vermicularis. Spread **fecal-oral** by swallowing tiny eggs (note)"], ["★ **Manifestation**", "**Itchy bottom, worse at night** (note and lecture). Intestinal parasite. Added: Poor sleep and irritability"], ["★ **Diagnosis**", "**Tape test**: a piece of clear tape over the rectum while the child sleeps, because worms come out at night. Do it **3 consecutive nights** (note and lecture)"], ["★ **Treatment**", "**Anti-helminthic drugs: pyrantel pamoate, albendazole and mebendazole** (review session), as one dose repeated in 2 weeks. Treat the household. **Parental commitment is a big one**: everyone must follow the plan or it comes back"], ["★ **Nursing education**", "+ Handwashing after toilet and before eating, short nails, wash bedding and underwear in hot water, shower in the morning"]]}, {"t": "note", "k": "star", "x": "Speaker notes: fecal-oral, scotch tape 3 nights in a row, itching worse at night. Lecture: highlight this slide, it will be on the quiz. The worm is Enterobius vermicularis, swallowed as microscopic eggs."}]}, {"h": "Ch 15 | Nursing interventions to promote skin integrity", "star": true, "blocks": [{"t": "ul", "items": ["★ Monitor skin for color changes, temperature, redness, swelling, warmth, pain or signs of infection, and changes in rash lesions, distribution or size", "★ Encourage fluid intake and proper nutrition", "★ Keep the child's **fingernails short**", "★ Encourage the child to **press on rather than scratch** itchy areas", "★ Use antipruritics and topical ointments or creams as ordered"]}]}, {"h": "Ch 25 | Types of immunity", "star": true, "blocks": [{"t": "tbl", "head": ["Type", "Slide definition", "Plain meaning (added)"], "rows": [["★ **Passive**", "Antibodies **received from an external source** (mother to baby, IVIG)", "Borrowed protection. Short-lived"], ["★ **Cellular**", "Antibodies produced by native **T-cell lymphocytes**", "T cells attack infected cells directly. Added: T cells do not make antibodies, B cells do"], ["★ **Humoral**", "Antibodies produced by native **B-cell lymphocytes**", "B cells make antibodies that float in the blood and body fluids"]]}, {"t": "note", "k": "star", "x": "Lecture: please highlight this slide. Link to Chapter 9: there immunity is passive or active. Here active immunity is split into cellular (T cells) and humoral (B cells). B and T cells are made in the bone marrow."}]}, {"h": "Ch 25 | Severe combined immune deficiency (SCID)", "star": true, "blocks": [{"t": "ul", "items": ["★ **Speaker note (page 911):** genetic, **X-linked or autosomal recessive**, so boys or girls. **Absent T-cell and B-cell function**", "★ **Potentially fatal**. Treatment is **stem cell or bone marrow replacement**. **IVIG** assists. **Lifelong treatment**. Future treatment possible with **CRISPR**"]}, {"t": "note", "k": "anno", "x": "Why bone marrow works: it replaces the missing T and B cell factory."}]}, {"h": "Ch 25 | How HIV spreads to children", "star": true, "blocks": [{"t": "tbl", "head": ["Route", "Meaning (note)", "Examples"], "rows": [["★ **Vertical transmission**", "**Passive from mother to infant**: in utero or via **breast milk**", "+ Also during delivery"], ["★ **Horizontal transmission**", "Spread by blood or body fluid contact", "**Nonsterile needles, blood products, tattooing**. Added: Sexual contact"]]}, {"t": "note", "k": "star", "x": "Speaker note, ATI page 251, text page 912."}]}, {"h": "Ch 25 | Latex allergy and cross-reactivity", "star": true, "blocks": [{"t": "tbl", "head": ["Item", "Content"], "rows": [["★ **Ask**", "Ask if the child is **allergic to rubber gloves**"], ["★ **Mechanism**", "**IgE-mediated response**, can cause **anaphylaxis** (note, page 924)"], ["★ **Cross-reacting foods**", "Apples, apricots, avocados, bananas, carrots, celery, cherry, chestnuts, fig, grape, kiwi, melon, nectarine, papaya, passion fruit, pear, peach, pineapple, plum, potatoes, tomatoes"]]}, {"t": "note", "k": "anno", "x": "Why foods matter: some food proteins look like latex proteins, so the body reacts to them too. Banana, avocado, kiwi and chestnut are the classic ones."}]}, {"h": "Exam traps: Ch 9: Health Supervision", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["A screening used on every child regardless of risk.", "Universal screening. Selective needs a risk factor first."], ["Lead testing in Virginia is a selective screening.", "No. She gave it as the universal screening example."], ["Which comes first, risk assessment or selective screening?", "Risk assessment. It decides who needs the selective screen."], ["Chronically ill child needs fewer visits because the care is in the hospital.", "False. They need more frequent visits and coordinated services."], ["A sick-child visit counts as health supervision.", "No. Health supervision is proactive and preventive."], ["A daycare or school cannot be a health supervision setting.", "False. Daycare centers and schools are both listed settings."]]}]}, {"h": "Exam traps: Ch 9: Immunizations (ATI Ch 34)", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Which vaccine route is subcutaneous?", "MMR (also varicella and IPV). Do not pick intramuscular."], ["Passive immunity from a vaccine.", "No. A vaccine gives active immunity."], ["A child with a cold and a low-grade fever must wait for vaccines.", "No. Mild illness is not a reason to delay."], ["Tetanus is spread by coughing.", "No. It comes from spores in soil entering a wound."], ["Which type of vaccine is MMR?", "Live attenuated, so avoid it in severe immunodeficiency."], ["Acetaminophen or aspirin for fever after a shot?", "Acetaminophen. Aspirin is linked to Reye syndrome."], ["The slide lists six vaccines at 4 months.", "No. It lists four: DTaP, RV, IPV, PCV."]]}]}, {"h": "Exam traps: Ch 15: Infection Basics", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Granulocytes vs lymphocytes: which is the first line of defense?", "Granulocytes. Lymphocytes produce and maintain the response. Monocytes are second line."], ["Incubation vs prodrome.", "Incubation ends at the first symptom. Prodrome is vague symptoms before the specific ones."], ["Measles precaution.", "Airborne. Droplet is wrong."], ["Mumps needs airborne precautions.", "Droplet. The airborne mnemonic MTV is measles, tuberculosis, varicella."], ["Hepatitis B and chemotherapy in the precaution list.", "Standard precautions, not isolation. Chemo needs safe drug handling."], ["Recheck the temperature right after the antipyretic.", "Wait 30 to 60 minutes."], ["Switch thermometer and site between readings.", "Wrong. Use the same site and device."], ["Dress a febrile child in extra blankets.", "Wrong. Light clothing."], ["Which is most important to prevent infection?", "Hand washing (bold on the slide)."], ["Antibiotic stopped when the fever breaks.", "Wrong. Finish the full course."]]}]}, {"h": "Exam traps: Ch 15: Viral Rashes, Ticks and Zoonoses", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Koplik spots point to which rash illness?", "Rubeola (measles). Not rubella."], ["Rubella vs rubeola.", "Rubella is German measles (mild). Rubeola is measles (Koplik spots, airborne)."], ["Fifth disease vs sixth disease.", "Fifth is slapped cheek (parvovirus B19). Sixth is roseola."], ["Rash first, then fever breaks.", "Wrong for roseola. The fever breaks first, then the rash."], ["Which viral rash is dangerous to a pregnant woman?", "Rubella (teratogenic). Also report parvovirus B19 exposure."], ["Twist the tick out gently.", "Wrong. Pull straight up with steady pressure. Do not twist, jiggle or jerk."], ["Hold a lighter near the tick or cover it with petroleum jelly.", "Wrong. No heat and no petroleum jelly. Use fine-tipped tweezers."], ["A child with chickenpox returns to school when the fever is gone.", "Review session: when all lesions have crusted over."], ["Cat-scratch fever and rabies are vector-borne.", "No. They are zoonotic (animal to human)."], ["Wait for lab results to start doxycycline for RMSF.", "Wrong. Treat immediately when suspected."], ["Erythema migrans only appears at the bite site.", "The note says it can show up anywhere on the body after a tick bite."]]}]}, {"h": "Exam traps: Ch 15: Lice, Scabies, Ringworm and Worms", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Tinea is a parasite.", "Fungus (the note). It is only grouped with parasitic infections on the slide."], ["Nits hatch in 24 hours.", "7 to 10 days."], ["Lice eggs die within a day once they leave the head.", "Review session: eggs can live on surfaces 3 to 7 days, so wash all bedding and clothing in hot water."], ["Pinworm is treated with permethrin cream.", "Anti-helminthic drugs: pyrantel pamoate, albendazole or mebendazole."], ["Athlete's foot is treated with an oral antibiotic.", "It is a fungus: antifungal cream, dry feet, change socks."], ["Lice survive a week off the head.", "48 hours off the host."], ["Spinosad for any age.", "Slide: children over 4 years."], ["Apply scabies cream to the neck down only and wash off after 1 hour.", "Head to toe, 8 to 12 hours, then wash off."], ["Corticosteroid cream for ringworm.", "Wrong. Griseofulvin without a corticosteroid."], ["Scotch tape test once, in the afternoon.", "3 nights in a row (note). Morning, before bathing."], ["Itching worse at night: which two infections?", "Scabies and pinworm."], ["Treat only the child with scabies.", "Treat the family."]]}]}, {"h": "Exam traps: Ch 25: Immunity and Immune Disorders", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["Cellular immunity is made by B cells.", "T cells. B cells are humoral."], ["IgA crosses the placenta.", "IgA, IgD, IgE and IgM do not cross."], ["Phagocytes are mature at birth.", "They reach adult levels at age 7."], ["Four ear infections in 6 months is normal.", "Four or more in 1 year is a warning sign."], ["SCID only affects boys.", "X-linked or autosomal recessive: boys or girls."], ["Humoral immunity is fully functional at birth.", "Cellular is functional at birth. Humoral develops over time."], ["Prematurity is a primary immunodeficiency.", "Secondary cause."]]}]}, {"h": "Exam traps: Ch 25: HIV and Latex Allergy", "star": true, "blocks": [{"t": "tbl", "head": ["The trap", "What is right"], "rows": [["ELISA is the best test for an infant.", "PCR. ELISA detects antibodies, which may be the mother's."], ["HIV spreads by hugging or sharing toys.", "No. Everyday contact is safe."], ["Vertical transmission = needles.", "Vertical is mother to baby. Needles are horizontal."], ["Latex allergy is a delayed rash only.", "The slide stresses IgE-mediated and anaphylaxis."], ["Banana, avocado and kiwi are safe for a latex-allergic child.", "No. They cross-react."]]}]}], "cold": ["Immunity: passive (borrowed, short) vs active (own, long). Ch 25: cellular = T cells, humoral = B cells.", "MMR, varicella and IPV subcutaneous. LAIV nasal. Others IM.", "Vaccine card: infant, toddler, preschool, school age, adolescent.", "Stages: incubation, prodrome, illness, convalescence.", "Airborne MTV: measles, TB, varicella. Droplet Mr. IMP: mumps, rubella, influenza, meningitis, pertussis. Contact MRS. V: MRSA, RSV, scabies, varicella. Hepatitis B and chemo: standard.", "Viral exanthems: rubella, rubeola (Koplik), varicella, fifth (slapped cheek), roseola (fever then rash).", "Lyme: erythema migrans, doxycycline. RMSF: rash from wrists and ankles, PCR, doxycycline. Tick removal: pull straight up.", "Lice: permethrin 1% repeat in 7 days, nits hatch 7 to 10 days, bag 14 days. Scabies: permethrin 5% head to toe 8 to 12 hours, treat family.", "Tinea is fungal: griseofulvin scalp, tolnaftate feet and body, treat pets. Pinworm: scotch tape 3 nights.", "Skin integrity: short nails, press do not scratch.", "Primary immunodeficiency 5 types. 10 warning signs. SCID: absent T and B cells, stem cells, IVIG.", "HIV: vertical vs horizontal. PCR for infants under 18 months, CD4 under 200, platelets below 30,000 treat.", "Latex allergy: IgE, anaphylaxis, cross-reacting foods.", "HIV regimen: 3 drugs, one each from NRTI, NNRTI and protease inhibitor classes. Lyme and RMSF: quiz and final, doxycycline."], "traps": []}, {"id": "h9", "icon": "🩺", "title": "Ch 9: Health Supervision", "sub": "Keeping well children well: where care happens, the medical home, screenings and anticipatory guidance. Slide stars and notes are marked. Lines starting with + are added to fill gaps in the slides.", "sections": [{"h": "Principles of health supervision", "star": false, "blocks": [{"t": "ul", "items": ["Provide services **proactively**: before illness happens", "Optimize the child's level of functioning", "Make sure the child is growing and developing appropriately", "Promote the best possible health of the child", "Prevent injury and illness through **child teaching**", "+ Why: health supervision is prevention and monitoring. A visit for a sick child is not health supervision, a well-child visit is"]}]}, {"h": "Settings for health supervision", "star": false, "blocks": [{"t": "ul", "items": ["Private physician offices", "Freestanding clinics in retail stores", "Community health department clinics", "Nonprofit community-based clinics with sliding scale payments", "Daycare centers", "Schools", "+ Why a sliding scale clinic matters: payment based on income keeps preventive care within reach of families who cannot afford a private office"]}]}, {"h": "Medical home and health partnerships", "star": false, "blocks": [{"t": "tbl", "head": ["Characteristics of a medical home", "What it looks like"], "rows": [["**Long-term relationship**", "Trusting, comprehensive relationship with the child and family from infancy through adolescence"], ["**Family-centered care**", "Providers respect the family's customs and beliefs"], ["**Accessible, affordable, comprehensive**", "Care the family can actually reach and pay for"], ["**Coordinated specialty care**", "Specialists are coordinated through the medical home"], ["**Responsive provider**", "Accessible for and responsive to the family's questions"]]}, {"t": "tbl", "head": ["Benefits of health partnerships (child, family, community)", "Meaning"], "rows": [["**Mutual goal setting**", "Everyone agrees on the goals and shares the benefits"], ["**Marshalling of resources**", "Gathering the people and services the child needs"], ["**Optimal health practices**", "Developing the habits that keep the child healthy"]]}]}, {"h": "Special issues in health supervision", "star": false, "blocks": [{"t": "tbl", "head": ["Special issue", "What the nurse thinks about"], "rows": [["**Cultural influences**", "Beliefs about illness, food, discipline and medicine shape what the family will accept"], ["**Community influences**", "Neighborhood safety, school, resources and access to care"], ["**Chronically ill child**", "Needs specialized supervision and **more frequent visits**. Services from many specialties must be coordinated through the medical home. The family may need extra support, coordination of community resources and ongoing assessment of family needs"], ["**Internationally adopted child**", "+ Screen for infections (TB, hepatitis B and C, HIV, parasites), lead and growth or developmental delay. Review immunization records and catch up vaccines. Support attachment"]]}, {"t": "note", "k": "anno", "x": "Added detail for the internationally adopted row. The slide only names the topic."}]}, {"h": "Psychosocial assessment for a chronically ill child", "star": false, "blocks": [{"t": "ul", "items": ["Health insurance coverage", "Transportation to health care facilities", "Financial stressors", "Family coping: parents, siblings and extended family", "School's response to the child with a chronic illness", "+ Why: a family without insurance, a ride or money will miss visits no matter how well the care is planned"]}]}, {"h": "Three components of health supervision", "star": false, "blocks": [{"t": "ul", "items": ["★ **Developmental surveillance and screening**", "★ **Injury and disease prevention**", "★ **Health promotion**"]}, {"t": "tbl", "head": ["Screenings done at the visit", "Notes"], "rows": [["History and physical assessment", "Every visit"], ["Developmental and behavioral assessment", "Surveillance every visit, standardized screen at set ages"], ["Sensory screening", "Vision and hearing"], ["Appropriate at-risk screening", "Based on the child's risk factors"], ["Immunizations", "Keeping the schedule current"], ["Health promotion", "Anticipatory guidance and teaching"]]}]}, {"h": "Developmental surveillance, screening and assessment", "star": false, "blocks": [{"t": "tbl", "head": ["Level", "What it is"], "rows": [["**Surveillance**", "Ongoing and flexible, done at every visit. Five parts: note and address **parental concerns**, obtain a **developmental history**, use the appropriate **screening assessment**, make **accurate observations**, **consult** relevant professionals"], ["**Screening**", "+ A short standardized tool at set ages (for example 9, 18 and 30 months for general development, and 18 and 24 months for autism)"], ["**Assessment**", "+ In-depth evaluation by a specialist after a screen is abnormal or a concern remains"]]}, {"t": "note", "k": "anno", "x": "The slides list the same five components under both surveillance and assessment. The definitions of screening and assessment are added."}]}, {"h": "Types of screenings", "star": false, "blocks": [{"t": "tbl", "head": ["Type", "Definition", "Example"], "rows": [["**Risk assessment**", "Objective and subjective data used to find the **likelihood** that the child will develop a condition", "+ Asking about housing age and lead exposure"], ["**Universal screening**", "Screening of an **entire population** no matter the child's individual risk", "Lead testing in Virginia (lecture). Added: Newborn metabolic and hearing screens"], ["**Selective screening**", "Done when a risk assessment shows the child has **one or more risk factors**", "+ A TB skin test for a child with a known exposure"]]}, {"t": "note", "k": "anno", "x": "Order matters: the risk assessment comes first and decides who gets the selective screen."}]}, {"h": "Specific screenings performed", "star": false, "blocks": [{"t": "tbl", "head": ["Screening", "What it looks for", "When (added)"], "rows": [["**Metabolic**", "Inherited disorders such as PKU, hypothyroidism, galactosemia, cystic fibrosis, sickle cell disease", "Heel stick after 24 hours of feeding, before discharge"], ["**Hearing**", "Hearing loss that would delay speech and language", "Newborn screen, then audiometry at about 4, 5, 6, 8 and 10 years"], ["**Vision**", "Poor acuity, strabismus, amblyopia", "Red reflex at birth, acuity charts from about 3 years"], ["**Iron-deficiency anemia**", "Low hemoglobin from too little iron", "Hemoglobin at about 12 months"], ["**Lead**", "Lead poisoning from old paint, dust and soil", "Her example of a **universal** screening in Virginia. Added: tested at 12 and 24 months"], ["**Hypertension**", "High blood pressure", "Blood pressure yearly from age 3"], ["**Hyperlipidemia**", "High cholesterol and triglycerides (she called it high cholesterol)", "Lipid panel once at 9 to 11 years, again at 17 to 21"]]}]}, {"h": "Anticipatory guidance topics", "star": false, "blocks": [{"t": "tbl", "head": ["Topic", "Teaching points (added)"], "rows": [["**Oral health care**", "Wipe gums, brush at the first tooth with a smear of fluoride toothpaste, no bottle in bed, first dental visit by age 1"], ["**Healthy weight**", "Track BMI percentile, limit sugary drinks and screen time, offer fruits and vegetables"], ["**Healthy activity**", "About 60 minutes of active play or exercise a day"], ["**Personal hygiene**", "Handwashing, bathing, dental care"], ["**Safe sun exposure**", "Shade, hats, protective clothing, sunscreen SPF 30 or higher. Keep infants under 6 months out of direct sun"]]}, {"t": "note", "k": "anno", "x": "Slide 22 lists the five topics. The teaching points are added."}]}, {"h": "Well-child visit schedule", "star": false, "blocks": [{"t": "tbl", "head": ["Age", "Visit"], "rows": [["**Infancy**", "+ Newborn (3 to 5 days), 1, 2, 4, 6, 9 and 12 months"], ["**Toddler years**", "+ 15, 18, 24 and 30 months"], ["**Ages 3 to 21**", "+ Once every year"]]}, {"t": "note", "k": "anno", "x": "Added. The slides do not give the visit schedule."}]}], "cold": ["Health supervision = **prevention**: developmental surveillance and screening, injury and disease prevention, health promotion.", "Medical home: long-term trusting relationship, family-centered, accessible and affordable, coordinated specialty care, responsive provider.", "Chronic illness: more frequent visits, coordinate specialists through the medical home, assess insurance, transportation, finances, coping and school.", "Universal = everyone. Selective = only those with risk factors found by a risk assessment.", "Seven screenings: metabolic, hearing, vision, iron-deficiency anemia, lead, hypertension, hyperlipidemia.", "Five anticipatory guidance topics: oral health, healthy weight, healthy activity, hygiene, safe sun exposure."], "traps": [["A screening used on every child regardless of risk.", "Universal screening. Selective needs a risk factor first."], ["Lead testing in Virginia is a selective screening.", "No. She gave it as the universal screening example."], ["Which comes first, risk assessment or selective screening?", "Risk assessment. It decides who needs the selective screen."], ["Chronically ill child needs fewer visits because the care is in the hospital.", "False. They need more frequent visits and coordinated services."], ["A sick-child visit counts as health supervision.", "No. Health supervision is proactive and preventive."], ["A daycare or school cannot be a health supervision setting.", "False. Daycare centers and schools are both listed settings."]]}, {"id": "im9", "icon": "💉", "title": "Ch 9: Immunizations (ATI Ch 34)", "sub": "Immunity, vaccine types, the vaccine list, routes, the schedule by age and DTaP. Slide stars are marked. Lines starting with + are added to fill gaps in the slides.", "sections": [{"h": "Immunity: passive vs active", "star": true, "blocks": [{"t": "tbl", "head": ["Term", "Definition (slide)", "Examples (added)"], "rows": [["★ **Immunity**", "Ability to destroy and remove a specific **antigen** from the body", "Antibody or T-cell response to one specific germ"], ["★ **Passive immunity**", "Produced when the **immunoglobulins of one person are transferred to another**", "Maternal IgG across the placenta, breast milk, IV immune globulin, HBIG after exposure. Short-lived"], ["★ **Active immunity**", "Acquired when a person's **own immune system generates** the immune response", "Having the disease or getting a vaccine. Long-lasting"]]}, {"t": "note", "k": "anno", "x": "Why a vaccine is active: it teaches the child's own body to make antibodies and memory cells, so the protection lasts. Borrowed antibodies fade in weeks to months."}]}, {"h": "Types of vaccines", "star": false, "blocks": [{"t": "tbl", "head": ["Type", "How it works", "Examples (added)"], "rows": [["**Live attenuated**", "Weakened live germ. Strong, long-lasting response. **Not for severely immunocompromised or pregnant people**", "MMR, varicella, rotavirus (oral), LAIV (nasal flu)"], ["**Killed (inactivated)**", "Dead germ. Cannot cause the disease. Often needs boosters", "IPV, hepatitis A, injected flu (IIV)"], ["**Toxoid**", "Inactivated toxin made by the germ. Protects against the toxin's effects", "Diphtheria and tetanus in DTaP, Tdap"], ["**Conjugate**", "Sugar coat of the germ attached to a protein so young infants respond", "Hib, pneumococcal (PCV), meningococcal (MenACWY)"], ["**Recombinant**", "Made from a single piece of the germ produced in the lab", "Hepatitis B, HPV"]]}, {"t": "note", "k": "anno", "x": "The slide lists only the five type names. Descriptions and examples are added."}]}, {"h": "Vaccines on the list", "star": true, "blocks": [{"t": "tbl", "head": ["Vaccine", "Protects against", "Type (added)"], "rows": [["★ **DTaP, Tdap**", "Diphtheria, tetanus, pertussis", "Toxoid plus acellular pertussis"], ["★ **Hib**", "Haemophilus influenzae type b: meningitis, epiglottitis, pneumonia", "Conjugate"], ["★ **IPV**", "Polio", "Killed"], ["★ **MMR**", "Measles, mumps, rubella", "Live attenuated"], ["★ **Hep A**", "Hepatitis A", "Killed"], ["★ **Hep B**", "Hepatitis B", "Recombinant"], ["★ **Varicella (Var)**", "Chickenpox", "Live attenuated"], ["★ **Pneumococcal (PCV, PPSV)**", "Pneumococcus: pneumonia, meningitis, sepsis, ear infections", "PCV conjugate. PPSV polysaccharide for high-risk children"], ["★ **Influenza (IIV, LAIV)**", "Influenza", "IIV killed (shot). LAIV live (nasal spray)"], ["★ **Rotavirus (RV)**", "Severe diarrhea and dehydration in infants", "Live attenuated, given by mouth"], ["★ **HPV (HPV2, HPV4)**", "Human papillomavirus: cervical and other cancers, genital warts", "Recombinant"], ["★ **Meningococcal**", "Meningococcal meningitis and sepsis", "Conjugate (MenACWY) or protein (MenB)"]]}]}, {"h": "Vaccine administration routes (Box 9.7)", "star": true, "blocks": [{"t": "tbl", "head": ["Intramuscular", "Subcutaneous", "Intranasal"], "rows": [["★ DTaP, DT, Tdap", "★ IPV", "★ Influenza (LAIV)"], ["★ Hepatitis A, hepatitis B", "★ **MMR**", ""], ["★ Hib", "★ Varicella", ""], ["★ Influenza (RIV, IIV)", "★ MPSV4", ""], ["★ Pneumococcal conjugate (PCV)", "", ""], ["★ HPV", "", ""], ["★ MCV4", "", ""], ["★ IPV", "", ""]]}, {"t": "note", "k": "star", "x": "Lecture: IM is how most vaccines are given, but know the subcutaneous ones: MMR, varicella, polio (IPV) and the meningococcal polysaccharide vaccine (MPSV4). The box also lists IPV under IM, so either route is accepted for IPV. LAIV is the nasal spray."}, {"t": "ul", "items": ["+ Why live vaccines go under the skin: MMR and varicella are live and are absorbed slowly from fat, which is how the manufacturers tested them", "+ Infants get intramuscular shots in the vastus lateralis (thigh). Older children use the deltoid"]}]}, {"h": "Birth to 1 year schedule (slide) and the vaccine card", "star": true, "blocks": [{"t": "tbl", "head": ["Age", "Vaccines", "Notes"], "rows": [["★ **Newborn**", "Hep B", "First dose"], ["★ **2 months**", "DTaP, RV, IPV, Hib, PCV, Hep B", "Six vaccines at the first visit"], ["★ **4 months**", "DTaP, RV, IPV, PCV", "+ The CDC schedule also gives Hib at 4 months. The slide leaves it out"], ["★ **6 months**", "DTaP, RV, IPV, Hib, PCV, Hep B", "Last visit of the primary series"], ["★ **6 to 12 months**", "Seasonal flu vaccine", "+ Two doses 4 weeks apart the first season"]]}, {"t": "note", "k": "star", "x": "Speaker note: make a vaccine card for each age group: Infant (birth to 1 year), Toddler (over 1 to 3 years), Preschool (4 to 6 years), School age (6 to 12 years), Adolescent (12 to 20 years). The rows below finish the card."}]}, {"h": "Vaccine card: toddler through adolescent (added)", "star": false, "blocks": [{"t": "tbl", "head": ["Age group", "Age", "Vaccines"], "rows": [["**Toddler**", "12 to 15 months", "MMR #1, varicella #1, Hib booster, PCV booster"], ["**Toddler**", "12 to 23 months", "Hep A, 2 doses 6 months apart"], ["**Toddler**", "15 to 18 months", "DTaP #4"], ["**Preschool**", "4 to 6 years", "DTaP #5, IPV #4, MMR #2, varicella #2"], ["**School age**", "Every year", "Seasonal flu vaccine"], ["**School age to adolescent**", "11 to 12 years", "Tdap, HPV, MenACWY #1"], ["**Adolescent**", "16 years", "MenACWY booster"]]}, {"t": "note", "k": "anno", "x": "HPV is 2 doses 6 to 12 months apart when started before age 15, and 3 doses when started at 15 or older. Follow the slide schedule for the exam. The CDC revised its schedule in 2026, while the AAP and AAFP still follow the classic one the slides use."}]}, {"h": "Vaccine-preventable diseases: DTaP and Tdap", "star": true, "blocks": [{"t": "tbl", "head": ["Item", "Answer"], "rows": [["★ **Vaccine**", "DTaP (children under 7). Tdap (age 7 and older, including the 11 to 12 year booster and each pregnancy)"], ["★ **Type of vaccine**", "Toxoid (diphtheria and tetanus) plus an acellular pertussis component. The lowercase **a** in DTaP means acellular, the lowercase **d** and **p** in Tdap mean reduced doses"], ["★ **Who is at risk**", "Unvaccinated children. Infants under 1 year are at the highest risk from pertussis, because they cannot finish the series until 6 months"]]}, {"t": "tbl", "head": ["Disease and cause", "Manifestations", "Treatment and key point"], "rows": [["★ **Diphtheria**. Corynebacterium diphtheriae. Droplet. A toxin damages the throat, heart and nerves", "Sore throat, fever, thick gray **pseudomembrane** over the tonsils and throat, swollen neck ('bull neck'), airway obstruction, myocarditis", "Diphtheria antitoxin plus an antibiotic. Airway is the priority"], ["★ **Tetanus**. Clostridium tetani spores in soil and dirty wounds. **Not** spread person to person", "Jaw stiffness (**lockjaw**), painful muscle spasms, arched back, spasm of the face", "Tetanus immune globulin, wound cleaning, antibiotic, muscle relaxants, quiet dark room"], ["★ **Pertussis**. Bordetella pertussis. Droplet. Whooping cough", "Starts like a cold, then violent coughing fits with a **whoop**, vomiting after coughing. Infants may have **apnea** instead of a whoop", "Macrolide antibiotic such as azithromycin. Droplet precautions. Infants are watched for apnea"]]}, {"t": "note", "k": "anno", "x": "The slide lists these as a template with the answers blank. All content here is added from standard references."}]}, {"h": "Contraindications and precautions (added)", "star": false, "blocks": [{"t": "tbl", "head": ["Category", "Examples"], "rows": [["**Contraindication: do not give**", "Anaphylaxis to a previous dose or a vaccine component. Live vaccines in severe immunodeficiency or pregnancy. Rotavirus vaccine with a history of intussusception or severe combined immunodeficiency. Encephalopathy within 7 days of a pertussis-containing dose"], ["**Precaution: weigh risk and benefit**", "Moderate or severe acute illness with or without fever. Guillain-Barre syndrome within 6 weeks of a tetanus-containing vaccine"], ["**NOT a reason to delay**", "Mild illness, low-grade fever, a cold, current antibiotics, prematurity, breastfeeding, a family history of a mild reaction"]]}, {"t": "note", "k": "anno", "x": "The slide only links to the CDC guide to contraindications and precautions. This table is added."}]}, {"h": "Nursing care for immunizations (added)", "star": false, "blocks": [{"t": "tbl", "head": ["When", "Action"], "rows": [["**Before**", "Screen for allergies, illness and prior reactions. Give the **Vaccine Information Statement**. Check the right vaccine, dose, route, site and expiration date"], ["**During**", "Infants: thigh. Older children: deltoid. Position with a parent's hold, offer comfort such as breastfeeding, sucrose or distraction. Separate multiple shots by at least 1 inch"], ["**After**", "Observe 15 to 20 minutes for anaphylaxis with epinephrine available. Document vaccine, lot number, site, route and date. Report adverse events to **VAERS**"], ["**Teaching**", "Soreness, redness and low-grade fever are expected. Acetaminophen as directed, **never aspirin**. Call for hives, trouble breathing, a high fever or a fever that lasts"]]}]}], "cold": ["Passive immunity = borrowed antibodies (short). Active = child's own immune system makes them (long).", "Five vaccine types: live attenuated, killed, toxoid, conjugate, recombinant.", "MMR, varicella and IPV are subcutaneous. LAIV is the nasal spray. DTaP, Hep A and B, Hib, PCV, HPV, MCV4 and flu shots are IM.", "Newborn Hep B. 2 months DTaP, RV, IPV, Hib, PCV, Hep B. 4 months DTaP, RV, IPV, PCV. 6 months DTaP, RV, IPV, Hib, PCV, Hep B. Flu from 6 months.", "DTaP = diphtheria, tetanus, pertussis. Tetanus is not spread person to person.", "Live vaccines: MMR, varicella, rotavirus, LAIV. She said immunocompromised children avoid live vaccines.", "Vaccine card age groups: infant, toddler, preschool, school age, adolescent."], "traps": [["Which vaccine route is subcutaneous?", "MMR (also varicella and IPV). Do not pick intramuscular."], ["Passive immunity from a vaccine.", "No. A vaccine gives active immunity."], ["A child with a cold and a low-grade fever must wait for vaccines.", "No. Mild illness is not a reason to delay."], ["Tetanus is spread by coughing.", "No. It comes from spores in soil entering a wound."], ["Which type of vaccine is MMR?", "Live attenuated, so avoid it in severe immunodeficiency."], ["Acetaminophen or aspirin for fever after a shot?", "Acetaminophen. Aspirin is linked to Reye syndrome."], ["The slide lists six vaccines at 4 months.", "No. It lists four: DTaP, RV, IPV, PCV."]]}, {"id": "inf15", "icon": "🦠", "title": "Ch 15: Infection Basics", "sub": "How infections work in children: white blood cells, stages, precautions, history and exam, labs, treatments and fever. Slide stars, highlights and notes are marked. Lines starting with + are added to fill gaps in the slides.", "sections": [{"h": "Why children get more infections (added)", "star": false, "blocks": [{"t": "ul", "items": ["+ Immature immune system and no memory yet for most germs", "+ **Short, wide, horizontal eustachian tubes** make ear infections common", "+ Small airways swell and block easily", "+ Daycare and school mean constant exposure", "+ Hands in mouths and poor handwashing spread germs"]}, {"t": "note", "k": "anno", "x": "The learning objective asks you to compare children and adults. The slide has no content, so these are standard points."}]}, {"h": "White blood cells by type", "star": false, "blocks": [{"t": "tbl", "head": ["Cell type", "Role (slide)", "Added"], "rows": [["**Granulocytes**", "**First line of defense**, phagocytic cells", "Neutrophils (bands, segs or PMNs), eosinophils, basophils. High neutrophils with many bands point to bacterial infection"], ["**Lymphocytes**", "**Produce and maintain** the immune response: B cells, T cells, natural killer cells", "Often rise with viral infection"], ["**Monocytes**", "**Second line of defense**. Respond to larger and more severe infections", "Become macrophages in tissue"]]}]}, {"h": "Types of infectious disease", "star": false, "blocks": [{"t": "tbl", "head": ["Type", "Meaning", "Examples"], "rows": [["**Bacterial**", "Caused by bacteria", "+ Strep throat, impetigo, otitis media"], ["**Viral**", "Caused by viruses", "+ Measles, chickenpox, roseola"], ["**Zoonotic**", "Germs passed **from animals to humans**, directly or indirectly", "Rabies, cat-scratch fever"], ["**Vector-borne**", "Spread by ticks, mosquitoes or other insect vectors", "==Lyme disease==, ==Rocky Mountain spotted fever==, malaria"], ["**Parasitic and helminthic**", "Parasites and worms", "Head lice, scabies, pinworm, hookworm, ascariasis"], ["**Sexually transmitted**", "Spread by sexual contact", "+ Chlamydia, gonorrhea, HPV, HIV"]]}]}, {"h": "Stages of infectious disease", "star": true, "blocks": [{"t": "tbl", "head": ["Stage", "Meaning"], "rows": [["★ **Incubation**", "Time from the germ **entering** the body to the **first symptom**. The germ is actively multiplying"], ["★ **Prodrome**", "From **non-specific symptoms** (fatigue, malaise) to more specific symptoms of the disease"], ["★ **Illness**", "Signs and symptoms are **clearly evident**"], ["★ **Convalescence**", "Acute symptoms **begin to disappear**"], ["★ **Communicability**", "The slide asks: during which phase is the disease communicable? Added: Often from late incubation through the illness, so a child can spread a germ before anyone knows they are sick"]]}, {"t": "note", "k": "anno", "x": "Why this order: the germ grows silently first, vague symptoms show next, then the disease declares itself, then the body recovers."}]}, {"h": "Limiting the spread of infection", "star": true, "blocks": [{"t": "tbl", "head": ["Tier", "Precaution", "What to do (added)"], "rows": [["★ **Tier one: standard**", "For **every** patient. Handwashing is the key action", "Hand hygiene, gloves, gown, mask or eye protection when blood or body fluids could splash"], ["★ **Tier two: airborne**", "Tiny particles that stay in the air", "Negative pressure room, door closed, fit-tested **N95** for staff"], ["★ **Tier two: droplet**", "Larger droplets that travel a short distance", "Private room, **surgical mask** on entering"], ["★ **Tier two: contact**", "Direct touch or contaminated surfaces", "Private room, **gown and gloves**, dedicated equipment"]]}, {"t": "note", "k": "star", "x": "Lecture: she handed out 3 note cards (airborne, droplet, contact) and had the class give examples. Speaker note list: measles, TB (active), varicella, COVID, meningitis, hepatitis A, hepatitis B, chemotherapy, MRSA."}, {"t": "note", "k": "star", "x": "Review session (Nov 18): the airborne mnemonic is **MTV**: **M**easles, **T**uberculosis, **V**aricella. Droplet: **mumps**, rubella and meningitis. Smallpox stays airborne."}, {"t": "note", "k": "anno", "x": "Memory aids (added, not from her): droplet is **Mr. IMP** = Mumps, Rubella, Influenza, Meningitis, Pertussis. Contact is **MRS. V** = MRSA, RSV, Scabies, Varicella (varicella is also airborne). Airborne is **MTV** = Measles, Tuberculosis, Varicella."}, {"t": "tbl", "head": ["Disease", "Precaution", "Source"], "rows": [["Measles", "**Airborne**", "Lecture"], ["Varicella", "**Airborne** (and **contact**)", "Lecture"], ["Tuberculosis (active)", "**Airborne**, negative pressure room", "Lecture"], ["Smallpox", "**Airborne**", "Lecture"], ["Influenza (flu)", "**Droplet**", "Lecture"], ["Pertussis", "**Droplet**", "Lecture"], ["Rubella (part of MMR, not measles)", "**Droplet**", "Lecture"], ["Mumps", "**Droplet**", "Review session"], ["Meningitis, viral or bacterial", "**Droplet**", "Lecture"], ["RSV", "**Contact**", "Lecture"], ["Scabies", "**Contact**", "Lecture"], ["MRSA", "**Contact**", "Lecture and note"], ["COVID-19", "Airborne (N95) plus contact and eye protection", "+ Added"], ["Hepatitis A", "Standard. Add contact for a diapered or incontinent child", "+ Added"], ["Hepatitis B", "Standard", "+ Added"], ["Chemotherapy", "Standard plus safe handling of hazardous drugs: chemo-rated gloves and gown. Not isolation", "+ Added"]]}]}, {"h": "Methods of preventing infectious disease", "star": false, "blocks": [{"t": "ul", "items": ["★ **HAND WASHING** is the most important (bold on the slide)", "Adequate immunization", "Proper handling and preparation of food", "Judicious antibiotic use", "+ Why: hands carry germs between patients. Antibiotics overused or stopped early breed resistant germs"]}]}, {"h": "Health history for infection", "star": false, "blocks": [{"t": "ul", "items": ["Past medical history: birth history, family history, **immunization status**, previous illness or surgery", "History of the current illness: onset, duration, symptoms, treatments given", "Symptoms: fever, sore throat, lethargy, malaise, vomiting, diarrhea, cough, rash", "Changes in usual behavior: poor feeding, decreased appetite, increased irritability", "Known exposure: ill household or school contacts", "Recent travel"]}]}, {"h": "Physical examination for infection", "star": false, "blocks": [{"t": "tbl", "head": ["Method", "What to assess"], "rows": [["**Inspection and observation**", "Skin, mouth, throat and hair for lesions or wounds. **Hydration status and vital signs**"], ["**Palpation**", "Skin temperature, texture, turgor and moisture. Palpate the **rash**. Palpate **lymph nodes**"]]}]}, {"h": "Common laboratory tests for infection", "star": false, "blocks": [{"t": "tbl", "head": ["Test", "What it tells you (added)"], "rows": [["**Complete blood count (CBC)**", "WBC count and differential. High WBC with many neutrophils and bands suggests bacterial infection. Lymphocytes rise in viral infection"], ["**Erythrocyte sedimentation rate (ESR)**", "Non-specific marker of inflammation. Rises slowly and falls slowly"], ["**C-reactive protein (CRP)**", "Non-specific inflammation marker that rises and falls faster than the ESR"], ["**Blood culture and sensitivity**", "Finds germs in the blood and which antibiotic works. Collect **before** the first antibiotic dose"], ["**Stool culture**", "Bacteria or parasites in diarrhea"], ["**Urine culture**", "Urinary tract infection. Clean catch or catheter specimen in a young child"], ["**Wound culture**", "Germ in an infected wound"], ["**Throat culture**", "Group A strep"]]}]}, {"h": "Common treatments and medications", "star": false, "blocks": [{"t": "tbl", "head": ["Group", "Examples and teaching"], "rows": [["**Treatments**", "Hydration and fever reduction"], ["**Antibiotics**", "For bacterial infection only. Finish the **full course** even when the child feels better"], ["**Antivirals**", "For certain viral infections, for example acyclovir for chickenpox in a high-risk child"], ["**Antipyretics**", "+ Acetaminophen every 4 to 6 hours, ibuprofen every 6 to 8 hours (over 6 months old). **Never aspirin** in a child with a viral illness: Reye syndrome"], ["**Antipruritics**", "+ Diphenhydramine by mouth, calamine lotion or oatmeal baths for itching"]]}]}, {"h": "Nursing interventions to promote comfort", "star": false, "blocks": [{"t": "ul", "items": ["Assess pain and the response to interventions frequently", "Give analgesics and antipruritics as ordered", "Apply **cool compresses or baths** to itchy areas", "Give fluids frequently", "Provide **cool mist** humidification", "Dress the child in **light clothing** if febrile", "Use diversional activities and distraction", "**Lecture, pain medicine not working:** use distraction, **check the milligram dose**, and consider giving it **around the clock** on a schedule so it stays built up in the system, which is common for hospitalized children"]}]}, {"h": "Role of immunizations in preventing childhood infections", "star": true, "blocks": [{"t": "ul", "items": ["★ **Lecture: highlight and star this slide**", "Many childhood diseases, viral and bacterial, can be prevented with adequate immunization", "Many vaccinations require **multiple doses**", "Immunizations can prevent: **diphtheria, pertussis, tetanus (DTP)**, **mumps, measles, rubella (MMR)**, **varicella**, **poliomyelitis** and others"]}]}, {"h": "Key teaching points for a child with an infection", "star": false, "blocks": [{"t": "ul", "items": ["Assess the child's and family's willingness to learn", "Give the family time to adjust to the diagnosis", "**Repeat** information", "Teach in **short sessions**", "Gear teaching to the child's level of understanding", "Give reinforcement and rewards", "Use multiple modes of learning that involve many senses"]}]}, {"h": "Fever: how it happens", "star": false, "blocks": [{"t": "tbl", "head": ["Step", "What happens"], "rows": [["1", "Infection stimulates release of **endogenous pyrogens**"], ["2", "Pyrogens act on the **hypothalamus** and trigger **prostaglandin** production, which raises the body's **set point**"], ["3", "The body now feels cold: **shivering, vasoconstriction, decreased peripheral perfusion**. This **decreases heat loss**"], ["4", "Fever results"]]}, {"t": "note", "k": "anno", "x": "Why a feverish child shivers and has cool hands: the set point went up, so the body acts cold and saves heat until the new temperature is reached."}]}, {"h": "Managing fever in a child with an infection", "star": false, "blocks": [{"t": "ul", "items": ["Check temperature at least every **4 to 6 hours**, **30 to 60 minutes after an antipyretic** and with any change in condition", "Use the **same site and device** each time", "Give antipyretics per order when the child is **uncomfortable** or cannot keep up with the **metabolic demands** of the fever", "Notify the physician by institution or order guidelines", "Assess fluid intake. Encourage oral fluids or give IV fluids per order", "Keep linens and clothing clean and dry", "**Lecture:** institutions set their own fever cutoff, some say 100.3 and others 100.5. Follow the order or policy", "+ Fever is 38 degrees C (100.4 degrees F) or higher. A fever in an infant under 3 months needs urgent evaluation", "+ Do not use cold baths or alcohol rubs. They cause shivering and raise the temperature or are toxic"]}]}], "cold": ["WBCs: granulocytes first line, lymphocytes produce and maintain, monocytes second line.", "Six types: bacterial, viral, zoonotic, vector-borne, parasitic and helminthic, sexually transmitted.", "Stages: incubation, prodrome, illness, convalescence. Communicability can start before symptoms.", "Standard (handwashing) for all. Tier two: airborne, droplet, contact. Measles, TB and varicella are airborne.", "Hand washing is the single most important prevention method.", "Blood cultures before antibiotics. CRP rises faster than ESR.", "Fever: pyrogens, hypothalamus, prostaglandins, higher set point. Temp every 4 to 6 hours and 30 to 60 minutes after an antipyretic. Same site, same device.", "No aspirin for children with viral illness: Reye syndrome."], "traps": [["Granulocytes vs lymphocytes: which is the first line of defense?", "Granulocytes. Lymphocytes produce and maintain the response. Monocytes are second line."], ["Incubation vs prodrome.", "Incubation ends at the first symptom. Prodrome is vague symptoms before the specific ones."], ["Measles precaution.", "Airborne. Droplet is wrong."], ["Mumps needs airborne precautions.", "Droplet. The airborne mnemonic MTV is measles, tuberculosis, varicella."], ["Hepatitis B and chemotherapy in the precaution list.", "Standard precautions, not isolation. Chemo needs safe drug handling."], ["Recheck the temperature right after the antipyretic.", "Wait 30 to 60 minutes."], ["Switch thermometer and site between readings.", "Wrong. Use the same site and device."], ["Dress a febrile child in extra blankets.", "Wrong. Light clothing."], ["Which is most important to prevent infection?", "Hand washing (bold on the slide)."], ["Antibiotic stopped when the fever breaks.", "Wrong. Finish the full course."]]}, {"id": "vir15", "icon": "🔴", "title": "Ch 15: Viral Rashes, Ticks and Zoonoses", "sub": "Viral exanthems, animal-borne and tick-borne disease. Slide stars, highlights and notes are marked. Lines starting with + are added to fill gaps in the slides.", "sections": [{"h": "Viral exanthems (rash illnesses)", "star": true, "blocks": [{"t": "tbl", "head": ["Disease and cause", "Key signs (added)", "Nursing and teaching (added)"], "rows": [["★ **Rubella** (German measles). Rubella virus. Droplet", "Mild fever, pink rash starting on the face and spreading down, swollen **posterior auricular and suboccipital** nodes. Clears in about 3 days", "Prevented by MMR. **Teratogenic**: keep away from pregnant women (congenital rubella: cataracts, deafness, heart defects)"], ["★ **Rubeola** (measles). Measles virus. **Airborne**", "Fever, **cough, coryza, conjunctivitis**, **Koplik spots** (tiny white spots on the inner cheeks) before the rash, then a red blotchy rash from the hairline down", "Airborne precautions, vitamin A, dim room for photophobia. Watch for otitis media, pneumonia, encephalitis"], ["★ **Varicella zoster** (chickenpox). **Airborne and contact**", "Itchy **vesicles** in crops. Macule, papule, vesicle, pustule, crust, with **all stages at once**", "Contagious 1 to 2 days before the rash until all lesions are crusted. Trim nails, calamine or oatmeal baths, acyclovir (an antiviral) for high-risk children, **no aspirin**. Review session: the child may **return to school once all lesions are crusted over (scabbed)**"], ["★ **Parvovirus B19** (==slapped cheek or fifth disease==). Droplet", "Bright red **slapped cheeks**, then a lacy rash on the trunk and limbs that can return with heat or sun", "Contagious **before** the rash, so a child with the rash can attend school. Dangerous in sickle cell disease, pregnancy and immunocompromise"], ["★ **Roseola infantum** (exanthem subitum or sixth disease). Human herpesvirus 6. Ages 6 months to 2 years", "**High fever for 3 to 5 days**, then the fever **breaks** and a rose-pink rash appears on the trunk", "Antipyretics and fluids. Febrile seizures can occur. The rash comes **after** the fever"]]}, {"t": "note", "k": "anno", "x": "Reference on the slide: Carmen and Kyle text pages 472 to 477, ATI pages 241 to 244. Fifth disease and slapped cheek are highlighted. The columns after the disease name are added."}]}, {"h": "Zoonotic infections", "star": false, "blocks": [{"t": "ul", "items": ["**Definition:** diseases caused by infectious agents passed **directly or indirectly from animals to humans**", "+ **Rabies:** virus in the saliva of an infected animal such as a bat, raccoon, skunk, fox or dog. Wash the wound with soap and water for 15 minutes. Rabies immune globulin plus the vaccine series. Fatal once symptoms start", "+ **Cat-scratch fever:** Bartonella henselae from a kitten scratch or bite. Papule, then tender swollen nodes near the site, low fever. Usually self-limited. Wash scratches, avoid rough play, control fleas"]}]}, {"h": "Vector-borne infections", "s
