ng and clothes in hot water, dry on high, and treat the family", "Treat only the child, since the mites cannot spread to the family", "Throw away the child's mattress and all of the family's pillows", "Keep the child home from school for 6 months after treatment starts"], "a": [0], "y": "Right: scabies spreads by direct contact, so family members are treated together. Not only the child: others carry it. Not discarding the mattress: not needed. Not 6 months: not needed after treatment."}, {"ty": "mc", "d": 3, "q": "Which statement about tinea (ringworm) is correct?", "o": ["A fungal infection, diagnosed by skin scraping and treated with an antifungal", "A worm infection treated with permethrin applied head to toe", "A viral infection treated with acyclovir for 10 days", "An infection spread only by pets and never from one person to another"], "a": [0], "y": "Right: the speaker note says fungal. The slide groups it with parasitic infections, but the treatment is an antifungal. Not a worm and permethrin: ringworm is not a worm. Not viral: antivirals do not treat it. Not only pets: it can spread by direct contact and shared objects."}, {"ty": "mat", "d": 3, "q": "Match each drug to what it treats.", "pairs": [["Griseofulvin", "Ringworm of the scalp"], ["Tolnaftate", "Athlete's foot between the toes"], ["Permethrin 5% cream", "Burrowing mites in the skin"], ["Permethrin 1% shampoo", "Nits on the hair shaft"]], "y": "Griseofulvin is oral for tinea capitis. Tolnaftate is topical for tinea pedis. Permethrin 5% cream treats scabies, and 1% shampoo treats head lice."}, {"ty": "mc", "d": 3, "q": "A provider orders a corticosteroid cream for a child's ringworm on the arm. What should the nurse do?", "o": ["Question the order, since tinea is treated without corticosteroids", "Give it, since steroids reduce the itching and will clear the infection", "Give it together with an oral antibiotic to cover bacteria too", "Give it only at night when the itching is the worst for the child"], "a": [0], "y": "Right: steroids can worsen a fungal skin infection. Not giving it: it may spread the fungus. Not with an antibiotic: antibiotics do not treat a fungus. Not only at night: timing does not fix the problem."}, {"ty": "mc", "d": 3, "q": "Which action is correct for a family whose child has ringworm?", "o": ["Treat the family pets", "Wash the pets with permethrin shampoo only", "Ignore the pets since animals do not spread ringworm", "Give the child the pet's medicine"], "a": [0], "y": "Right: pets can carry the fungus and reinfect the child. Not permethrin: that is for lice and scabies, not a fungus. Not ignoring pets: the speaker note says to treat pets. Not the pet's medicine: unsafe."}, {"ty": "mc", "d": 3, "q": "A mother asks how to test for pinworm. Which instruction is correct?", "o": ["Press clear tape around the rectum while the child sleeps, for 3 nights in a row", "Collect one stool sample in the afternoon and take it to the lab", "Press tape to the child's scalp one time in the morning", "Scrape the skin of the belly and send it to the lab for a microscope exam"], "a": [0], "y": "Right: worms come out at night, and the test is repeated 3 nights. Not one stool sample: eggs are often missed. Not the scalp: that is where lice live. Not belly scraping: that is how scabies or tinea are tested."}, {"ty": "mc", "d": 3, "q": "Which pair of infections has itching that is worse at night?", "o": ["Scabies and pinworm", "Tinea and head lice", "Rubeola and roseola", "Lyme disease and RMSF"], "a": [0], "y": "Right: scabies (burrows) and pinworm (perianal itching) both itch at night. Not tinea and lice: lice itch continuously, tinea is not night-specific. Not rubeola and roseola: viral rashes. Not Lyme and RMSF: tick-borne, not itchy."}, {"ty": "ord", "d": 3, "q": "Put the steps for applying scabies cream in order.", "items": ["Shower", "Dry off", "Apply on clean skin from head to toe", "Leave on for 8 to 12 hours", "Wash off"], "y": "Clean skin first so the cream works, then apply everywhere, leave the full time, and wash off."}, {"ty": "mc", "d": 3, "q": "A child with pinworm is scratching all night. Which teaching is best?", "o": ["Wash hands after the toilet and before eating, nails short, bedding washed hot", "Take antibiotics for 10 days to kill the worms in the gut and bowel", "Apply permethrin cream from head to toe and leave it on overnight", "Wear a tight bandage over the rectum all day to stop the spread"], "a": [0], "y": "Right: pinworm is fecal-oral, so hygiene breaks the cycle. Not antibiotics: they do not kill worms. Not permethrin: for scabies. Not a bandage: does not stop spread."}, {"ty": "mc", "d": 3, "q": "Which worm infection causes iron-deficiency anemia after larvae enter bare feet?", "o": ["Hookworm", "Pinworm", "Ascariasis", "Pediculosis"], "a": [0], "y": "Right: hookworm larvae burrow into skin and the adult worm feeds on blood (added content). Not pinworm: swallowed eggs, itching at night. Not ascariasis: swallowed eggs, can obstruct the bowel. Not pediculosis: lice."}, {"ty": "mc", "d": 3, "q": "A child with an itchy rash keeps scratching. Which nursing action matches the skin integrity slide?", "o": ["Keep nails short and encourage pressing on the area instead of scratching", "Apply a tight dressing so that the child cannot touch the area at all", "Withhold fluids so that the skin dries out and the itching eases", "Allow scratching whenever it relieves the itch because it is harmless"], "a": [0], "y": "Right: short nails and pressing reduce skin breakdown. Not a tight dressing: causes heat and distress. Not withholding fluids: slide says encourage fluids. Not allowing scratching: breaks the skin and lets bacteria in."}, {"ty": "ngn", "d": 3, "scen": "A 7-year-old has been scratching her scalp for 2 weeks. The nurse sees tiny white specks stuck to the hair shafts close to the scalp, mostly behind the ears. The school nurse sent a note home.", "parts": [{"ty": "mc", "d": 3, "q": "What is the most likely problem?", "o": ["Pediculosis capitis", "Tinea capitis", "Scabies infestation", "Pinworm infection"], "a": [0], "y": "Right: nits attached to hair shafts near the scalp mean head lice. Not tinea capitis: scaly bald patches. Not scabies: burrows between fingers and in skin folds. Not pinworm: perianal itching."}, {"ty": "mc", "d": 3, "q": "Which treatment does the nurse expect?", "o": ["Permethrin 1% shampoo, repeated in 7 days", "Oral griseofulvin for 6 weeks", "Permethrin 5% cream head to toe for 8 to 12 hours", "Tolnaftate cream"], "a": [0], "y": "Right: pediculicide shampoo with a repeat in 7 days. Not griseofulvin: an antifungal. Not 5% cream: for scabies. Not tolnaftate: antifungal for feet."}, {"ty": "sata", "d": 3, "q": "Which teaching points apply? Select all that apply.", "o": ["Do not share hats, combs or brushes", "Comb daily with a fine-tooth comb for 1 week", "Examine every family member", "Lice jump from head to head", "Lice are caused by poor hygiene"], "a": [0, 1, 2], "y": "Right: prevention, daily combing and checking the family. Not jumping: lice crawl. Not poor hygiene: anyone can get lice."}], "y": ""}, {"ty": "mc", "d": 3, "q": "A mother asks how long lice eggs can live on her child's bedding. Which answer is correct?", "o": ["3 to 7 days, so wash all bedding and clothing in hot water", "24 hours, so a quick rinse of the pillowcase is enough", "10 to 14 days, so everything must be thrown away", "1 month, so the room must be sealed for the whole time"], "a": [0], "y": "Right: the review session said 3 to 7 days. Not 24 hours: too short and under-washes. Not 10 to 14 days or 1 month: overstated, and throwing things away is not the teaching."}, {"ty": "mc", "d": 3, "q": "Which three drugs are the anti-helminthic medications for pinworm?", "o": ["Pyrantel pamoate, albendazole and mebendazole", "Permethrin, lindane and spinosad", "Tolnaftate, griseofulvin and fluconazole", "Doxycycline, nystatin and acyclovir"], "a": [0], "y": "Right: the three anti-helminthics. Not permethrin, lindane and spinosad: lice and scabies. Not tolnaftate, griseofulvin and fluconazole: antifungals. Not doxycycline, nystatin and acyclovir: antibiotic, antifungal and antiviral."}], "imm25": [{"ty": "mc", "d": 3, "q": "An infant with an antibody deficiency receives intravenous immunoglobulin (IVIG). Which type of immunity is this?", "o": ["Passive immunity", "Humoral immunity, because B cells produced the antibodies", "Cellular immunity, because T cells delivered it", "Active immunity, because the infant's body now has antibodies"], "a": [0], "y": "Right: IVIG is antibodies received from an external source, which is the definition of passive immunity. Not humoral: that means the child's own B cells made them. Not cellular: that is T-cell mediated. Not active: the child's own immune system did not generate them."}, {"ty": "mat", "d": 3, "q": "Match each type of immunity to its definition on the slide.", "pairs": [["Passive immunity", "Antibodies received from an external source, such as mother to baby or IVIG"], ["Cellular immunity", "Response carried out by T lymphocytes"], ["Humoral immunity", "Antibodies produced by the child's own B lymphocytes"]], "y": "Passive is from outside, cellular is T cells, humoral is B cells and their antibodies. Cellular and humoral together make up active immunity."}, {"ty": "mc", "d": 3, "q": "Which immunoglobulin crosses the placenta and protects the newborn for the first months?", "o": ["IgG", "IgA", "IgE", "IgM"], "a": [0], "y": "Right: the slide says IgA, IgD, IgE and IgM do not cross, which leaves IgG as the antibody that does (added content). Not IgA, IgE or IgM: all named as not crossing the placenta."}, {"ty": "sata", "d": 3, "q": "Which statements about newborn and infant immunity are correct? Select all that apply.", "o": ["The newborn receives passive immunity from the placenta and breastfeeding", "Cellular immunity is generally functional at birth", "Phagocytic cells reach adult chemotaxis at age 7", "Infants have larger tonsils and thymus than adults", "Humoral immunity is fully developed at birth", "Infant B cells respond to infection as well as adult B cells"], "a": [0, 1, 2, 3], "y": "Right: these four are slide statements. Not humoral fully developed: it develops over time. Not equal B-cell response: infant B cells respond less well than adult B cells."}, {"ty": "mc", "d": 3, "q": "Why is an infant of 4 months more prone to infection than a newborn of 1 week?", "o": ["Borrowed maternal antibodies fade before the infant makes enough of their own", "The infant's thymus has disappeared so T cells are no longer made", "The infant's B cells are now fully mature and overreact to germs", "The infant has lost all cellular immunity after the first month"], "a": [0], "y": "Right: passive protection declines while the infant's own humoral immunity is still developing (added content). Not thymus gone: infants have a large thymus. Not mature B cells: they respond less well than adults. Not lost cellular immunity: it is functional at birth."}, {"ty": "mc", "d": 3, "q": "Which describes primary immunodeficiency?", "o": ["Mostly hereditary or congenital", "Mostly caused by chemotherapy given in childhood", "Mostly caused by malnutrition in the first year", "Mostly caused by HIV infection acquired at birth"], "a": [0], "y": "Right: primary means mostly hereditary or congenital. Not chemotherapy, malnutrition or HIV: these are causes of secondary immunodeficiency."}, {"ty": "mat", "d": 3, "q": "Match each primary immunodeficiency type to what is impaired.", "pairs": [["Humoral deficiency", "Antibody production by B cells"], ["Cellular immunodeficiency", "T cell production"], ["Combined deficiency (SCID)", "Both B cell and T cell function"], ["Phagocytic defect", "Neutrophil and macrophage killing"]], "y": "Humoral affects B-cell antibodies. Cellular means T-cell production is impaired (lecture). Combined, such as SCID, loses both. Phagocytic defects involve the cells that engulf and kill germs."}, {"ty": "mc", "d": 3, "q": "Which child meets a warning sign for primary immunodeficiency?", "o": ["A child with 5 episodes of acute otitis media in 1 year", "A child with 3 colds during the winter months in 1 year", "A child with 1 episode of pneumonia in 1 year that cleared", "A child with 1 course of antibiotics that lasted a full 10 days"], "a": [0], "y": "Right: four or more new episodes of otitis media in 1 year is a warning sign. Not 3 colds: normal for children. Not 1 pneumonia: the sign is 2 or more in a year. Not 10 days of antibiotics: the sign is 2 months with little effect."}, {"ty": "sata", "d": 3, "q": "Which findings are among the 10 warning signs of primary immunodeficiency? Select all that apply.", "o": ["Failure to thrive in an infant", "Persistent oral thrush after 1 year of age", "Recurrent deep skin or organ abscesses", "Family history of primary immunodeficiency", "One episode of mild sinusitis", "A sunburn that peels"], "a": [0, 1, 2, 3], "y": "Right: these are four of the 10 signs. Not one mild sinus episode: the sign is two or more severe episodes. Not a sunburn: unrelated."}, {"ty": "mc", "d": 3, "q": "An infant has chronic diarrhea, failure to thrive, persistent thrush and very low immunoglobulins. What is the most likely diagnosis?", "o": ["Severe combined immunodeficiency", "Latex allergy with an IgE reaction", "Fifth disease, a viral rash illness", "Pediculosis capitis, an infestation of the scalp"], "a": [0], "y": "Right: these are the SCID assessment findings on the slide. Not latex allergy: IgE reaction to latex. Not fifth disease: a mild rash illness. Not pediculosis: a lice infestation."}, {"ty": "mc", "d": 3, "q": "Which treatment can potentially cure SCID?", "o": ["Stem cell or bone marrow replacement", "A live attenuated vaccine series", "Lifelong oral antibiotics alone", "Plasmapheresis alone each week"], "a": [0], "y": "Right: SCID is potentially fatal, and stem cell or bone marrow replacement replaces the missing T and B cell function (speaker note). Not live vaccines: dangerous in SCID. Not antibiotics alone: only treats infections. Not plasmapheresis: filters plasma and does not replace missing cells."}, {"ty": "mc", "d": 3, "q": "A mother asks whether SCID only affects boys. What is the best answer?", "o": ["It is genetic, X-linked or autosomal recessive, so boys or girls can have it", "Only boys, because it is always passed on the X chromosome", "Only girls, because it is always passed down as a recessive trait", "Neither, because SCID is acquired from a childhood infection"], "a": [0], "y": "Right: the note says X-linked or autosomal recessive. Not only boys: autosomal recessive also affects girls. Not only girls: X-linked is more common in boys. Not acquired: it is a primary immunodeficiency."}, {"ty": "sata", "d": 3, "q": "Which are causes of secondary immunodeficiency? Select all that apply.", "o": ["Malignancy and chemotherapy", "Use of immunosuppressive medication", "Malnutrition or a protein-losing state", "Prematurity", "HIV infection", "A complement deficiency present from birth", "X-linked agammaglobulinemia"], "a": [0, 1, 2, 3, 4], "y": "Right: the slide lists six causes, including chronic illness. Not complement deficiency or X-linked agammaglobulinemia: these are primary and inherited."}, {"ty": "mc", "d": 3, "q": "Which treatment gives the child passive antibodies?", "o": ["IV immunoglobulins", "Immunosuppressants", "Cytotoxic medications", "Bone marrow transplantation"], "a": [0], "y": "Right: IVIG supplies donor antibodies. Not immunosuppressants: they calm the immune system. Not cytotoxics: they kill dividing cells. Not transplant: replaces the cell factory."}, {"ty": "mc", "d": 3, "q": "Which child with a primary immunodeficiency should NOT receive a live vaccine?", "o": ["A child with SCID", "A child with an uncomplicated cold", "A child who is breastfed", "A child who has had the first dose of DTaP"], "a": [0], "y": "Right: live vaccines can multiply and cause disease when the immune system cannot respond (lecture: avoid live vaccines in immunocompromised children). Not the cold, breastfeeding or a prior DTaP: none are contraindications."}, {"ty": "ngn", "d": 3, "scen": "A 9-month-old is brought in with chronic diarrhea. She has had pneumonia twice and oral thrush for 2 months. Her weight has dropped from the 50th to the 5th percentile. Her brother died in infancy of infection. Labs show very low immunoglobulins.", "parts": [{"ty": "sata", "d": 3, "q": "Which findings suggest a severe combined immunodeficiency? Select all that apply.", "o": ["Chronic diarrhea", "Failure to thrive", "Persistent thrush", "Very low immunoglobulins", "History of severe infections early in infancy", "Slapped cheeks", "Burrows between the fingers"], "a": [0, 1, 2, 3, 4], "y": "Right: all five are on the SCID assessment slide, and the family history supports a genetic cause. Not slapped cheeks: fifth disease. Not burrows: scabies."}, {"ty": "mc", "d": 3, "q": "Which action is the priority for this infant?", "o": ["Protect from infection and prepare for stem cell or bone marrow replacement", "Give the scheduled MMR and varicella vaccines at this visit", "Discharge with instructions to use cool mist humidification at home", "Give acetaminophen and watch the infant at home for 1 week"], "a": [0], "y": "Right: the infant needs infection protection and definitive treatment. Not MMR and varicella: live vaccines are unsafe. Not cool mist: a comfort measure that treats nothing. Not watching: delays treatment."}, {"ty": "mc", "d": 3, "q": "Which support does the nurse expect to give?", "o": ["IVIG and lifelong follow-up", "Aspirin for the fever", "A single antibiotic course", "Topical permethrin cream"], "a": [0], "y": "Right: IVIG assists and treatment is lifelong (speaker note). Not aspirin: Reye syndrome. Not one course: SCID is ongoing. Not permethrin: for scabies and lice."}], "y": ""}], "hiv25": [{"ty": "mc", "d": 3, "q": "Which describes the HIV medication regimen for a child?", "o": ["A 3-drug regimen with one drug from each of three classes", "Three drugs chosen from the same class so that they boost each other", "A single antiviral medicine taken for life by the child", "Two antibiotics and an antifungal given for several weeks"], "a": [0], "y": "Right: lecture said infectious disease chooses one drug from each class and uses all three. Not three from one class: she said one from each. Not a single antiviral: monotherapy leads to resistance. Not antibiotics and antifungal: they do not treat HIV."}, {"ty": "sata", "d": 3, "q": "Which drug classes make up the HIV regimen? Select all that apply.", "o": ["Nucleoside reverse transcriptase inhibitors (NRTIs)", "Non-nucleoside reverse transcriptase inhibitors (NNRTIs)", "Protease inhibitors", "Macrolide antibiotics", "Disease-modifying antirheumatic drugs"], "a": [0, 1, 2], "y": "Right: the three classes are NRTIs, NNRTIs and protease inhibitors. Not macrolides: antibiotics. Not DMARDs: treat autoimmune joint disease."}, {"ty": "mc", "d": 3, "q": "A 10-month-old born to an HIV-positive mother needs HIV testing. Which test is correct?", "o": ["PCR test", "ELISA antibody test", "Skin scraping", "Tape test"], "a": [0], "y": "Right: under 18 months, use PCR. The infant may carry the mother's antibodies. Not ELISA: less accurate in infants and toddlers. Not skin scraping or tape test: used for scabies and pinworm."}, {"ty": "mc", "d": 3, "q": "Why is a positive ELISA in a 4-month-old not enough to diagnose HIV?", "o": ["ELISA detects antibodies, and the infant may carry the mother's", "ELISA detects viral DNA and is unreliable in infants for that reason", "ELISA only detects bacterial infection so it is not used for HIV", "ELISA is only done after 5 years of age in all children"], "a": [0], "y": "Right: maternal antibodies can stay for months, so the test can be falsely positive (added content). Not viral DNA: that is PCR. Not bacterial: ELISA here targets HIV antibodies. Not after 5 years: it is used when the child is over 18 months."}, {"ty": "mc", "d": 3, "q": "Which test does the instructor say is used for a child over 18 months?", "o": ["HIV antibody test", "PCR test only", "Throat culture", "Wood's lamp exam"], "a": [0], "y": "Right: over 18 months, maternal antibodies have cleared, so the antibody test is used. Not PCR only: PCR is the infant choice. Not throat culture or Wood's lamp: not HIV tests."}, {"ty": "mc", "d": 3, "q": "A child with HIV has a CD4 count of 180. What does this mean?", "o": ["The count is under 200, where HIV is diagnosed as AIDS", "The count is normal for a child of any age with HIV", "The platelets need treatment because the CD4 count is low", "The viral load is undetectable on current medication"], "a": [0], "y": "Right: CD4 under 200 was her threshold. Not normal: low CD4 means helper T cells are depleted. Not platelets: a platelet count under 30,000 needs treatment. Not undetectable viral load: that is a PCR result, not a CD4 value."}, {"ty": "mc", "d": 3, "q": "A child with HIV has a platelet count of 25,000. What does the slide say?", "o": ["A platelet count under 30,000 requires treatment", "The count is expected in HIV and needs no action at all", "Only a count under 5,000 needs treatment in a child with HIV", "Platelets are not affected by HIV infection in children"], "a": [0], "y": "Right: under 30,000 needs treatment. Not no action: bleeding risk. Not under 5,000: not what the slide says. Not unaffected: platelets can be low in HIV."}, {"ty": "sata", "d": 3, "q": "Which are horizontal transmission routes? Select all that apply.", "o": ["Nonsterile needles", "Blood products", "Tattooing", "Passage in utero", "Breast milk"], "a": [0, 1, 2], "y": "Right: the note lists needles, blood products and tattooing as horizontal. Not in utero or breast milk: those are vertical, mother to infant."}, {"ty": "sata", "d": 3, "q": "Which findings suggest HIV infection in a child? Select all that apply.", "o": ["Failure to thrive", "Recurrent bacterial infections", "Opportunistic infections", "Chronic or recurrent diarrhea", "Prolonged candidiasis", "Developmental delay", "A single mild cold", "A rash after a new soap"], "a": [0, 1, 2, 3, 4, 5], "y": "Right: these are on the signs and symptoms slide, along with recurrent fever. Not a single cold or soap rash: not specific."}, {"ty": "mc", "d": 3, "q": "Which history finding is the strongest clue to HIV in an infant?", "o": ["Maternal HIV infection", "A sibling with a cold", "A birth at term gestation", "Breastfed for only 3 days"], "a": [0], "y": "Right: maternal HIV is the first item in the history clues. Not a sibling's cold: common. Not term birth: unrelated. Not brief breastfeeding: not the first clue; maternal infection is."}, {"ty": "mc", "d": 3, "q": "A mother of a child with HIV keeps missing the evening medication dose. Which response is best?", "o": ["Explore barriers, teach the schedule and why missed doses cause resistance", "Tell her the doses are optional if the child looks well and is growing", "Stop the medication until the next visit so the child can rest", "Reduce the number of drugs herself until the evening dose is easier"], "a": [0], "y": "Right: promoting compliance with the regimen is a goal of care, and missed doses breed resistant virus. Not optional: the child looks well because the drugs work. Not stopping: viral load rebounds. Not changing drugs herself: unsafe."}, {"ty": "mc", "d": 3, "q": "A family worries about stigma and keeping the HIV diagnosis confidential. What is the best nursing action?", "o": ["Respect confidentiality, and offer counseling and support resources", "Tell the school and neighbors about the diagnosis to protect them", "Tell the family to hide the child's medication from everyone", "Advise the family to avoid medical appointments to stay private"], "a": [0], "y": "Right: stigma and confidentiality are named stressors, and ongoing psychosocial support is a goal. Not telling others: breaches confidentiality. Not hiding medication: harms adherence. Not avoiding appointments: increases risk."}, {"ty": "mc", "d": 3, "q": "Which action is included in family education for a child with HIV?", "o": ["When to call the infectious disease provider", "How to stop the medication for a few days each week", "How to avoid ever mentioning the diagnosis to the child", "How to give live vaccines at home"], "a": [0], "y": "Right: the slide lists regimen, follow-up, when to call, stress reduction and HIV education. Not stopping medication: unsafe. Not hiding it: not on the slide. Not home live vaccines: not part of the education."}, {"ty": "mc", "d": 3, "q": "What does the nurse ask first about latex allergy?", "o": ["Whether the child is allergic to rubber gloves", "Whether the child likes to play with balloons", "Whether the child has had pinworm before", "Whether the child has had a tick bite"], "a": [0], "y": "Right: the slide says to ask about an allergy to rubber gloves. Not balloons or pinworm or tick bites: unrelated."}, {"ty": "sata", "d": 3, "q": "Which foods can cross-react with latex? Select all that apply.", "o": ["Banana", "Avocado", "Kiwi", "Chestnut", "Plain white rice", "Chicken breast"], "a": [0, 1, 2, 3], "y": "Right: banana, avocado, kiwi and chestnut are the classic cross-reacting foods, and all appear on the list. Not rice or chicken: not on the list."}, {"ty": "mc", "d": 3, "q": "Why can latex allergy be life-threatening?", "o": ["It is an IgE-mediated response that can cause anaphylaxis", "It causes a T-cell infection of the bone marrow in the child", "It causes a slow, mild rash several days after contact only", "It destroys CD4 cells in the same way that HIV does"], "a": [0], "y": "Right: IgE-mediated responses release histamine fast and can close the airway (speaker note). Not a T-cell infection: not what happens. Not a slow rash only: delayed rash is a different type. Not CD4 destruction: that is HIV."}, {"ty": "ngn", "d": 3, "scen": "A 14-month-old born to an HIV-positive mother has failure to thrive, oral thrush for 2 months and chronic diarrhea. She has been admitted with pneumonia. Her grandmother asks whether she can touch the baby and share her cup.", "parts": [{"ty": "mc", "d": 3, "q": "Which test confirms HIV in this infant?", "o": ["PCR test", "ELISA", "Tape test", "Skin scraping"], "a": [0], "y": "Right: under 18 months, use PCR. Not ELISA: may reflect maternal antibodies. Not tape or skin scraping: other infections."}, {"ty": "sata", "d": 3, "q": "Which findings suggest HIV? Select all that apply.", "o": ["Failure to thrive", "Oral thrush", "Chronic diarrhea", "Recurrent pneumonia", "Maternal HIV infection", "A well-appearing sibling", "Normal growth"], "a": [0, 1, 2, 3, 4], "y": "Right: all five are slide findings. Not the healthy sibling or normal growth: do not suggest HIV."}, {"ty": "mc", "d": 3, "q": "What is the best answer to the grandmother?", "o": ["Touching and sharing a cup are safe, and the nurse teaches how HIV spreads", "Everyone should wear a gown and mask for all contact with the baby", "The grandmother should not touch the baby while she is ill", "Every toy should be disinfected after each time the baby touches it"], "a": [0], "y": "Right: everyday contact is safe, and HIV education is part of family teaching. Not a gown and mask: not needed. Not avoiding touch: harmful and untrue. Not disinfecting every toy: unnecessary."}], "y": ""}], "star": [{"ty": "mc", "d": 3, "q": "She said to highlight one antibiotic because there is really no other choice for two tick-borne diseases. Which pair does it treat?", "o": ["Doxycycline for Lyme disease and Rocky Mountain spotted fever", "Permethrin for Lyme disease and for scabies in the same child", "Griseofulvin for Rocky Mountain spotted fever and for tinea", "Acyclovir for Lyme disease and for varicella in the same child"], "a": [0], "y": "Right: doxycycline treats both tick diseases. Not permethrin: an antiparasitic for lice and scabies. Not griseofulvin: an antifungal. Not acyclovir: an antiviral for chickenpox, and it does nothing for Lyme."}, {"ty": "mc", "d": 3, "q": "A child allergic to doxycycline has suspected Rocky Mountain spotted fever. What did she say?", "o": ["Weigh the benefit against the risk, since no other antibiotic works well", "Switch to permethrin cream and apply it from head to toe at bedtime", "Wait for the PCR result and give nothing until the result is back", "Use griseofulvin instead and recheck the child in a week or so"], "a": [0], "y": "Right: the disease is dangerous and doxycycline is the drug of choice. Not permethrin or griseofulvin: not antibiotics for this disease. Not waiting: delay can be fatal."}, {"ty": "mc", "d": 3, "q": "Which test is sent when Lyme disease or Rocky Mountain spotted fever is suspected, per the slide and lecture?", "o": ["PCR test", "Tape test", "Skin scraping", "Throat culture"], "a": [0], "y": "Right: PCR testing for both tick diseases. Not tape: pinworm. Not skin scraping: scabies and tinea. Not throat culture: strep."}, {"ty": "ord", "d": 3, "q": "Put the tick removal steps in order.", "items": ["Use fine-tipped tweezers", "Grasp the tick as close to the skin as possible", "Pull upward with steady, even pressure", "Clean the site with soap and water", "Save the tick for identification"], "y": "She called these easy questions. Tweezers first, grasp near the skin, steady pull with no twisting, clean the site, then save the tick."}, {"ty": "mc", "d": 3, "q": "Which statement about tick removal is correct?", "o": ["Do not twist or jerk the tick, and do not leave mouthparts behind", "Twist while pulling to break the tick's grip on the skin", "Pull the tick by its body from a distance with your fingers", "Burn the tick with a hot match so that it lets go"], "a": [0], "y": "Right: steady pull, no twisting, nothing left behind. Not twisting: breaks the mouthparts off. Not pulling by the body from a distance: crushes it and spreads its contents. Not burning: tick stays attached and may release germs."}, {"ty": "sata", "d": 3, "q": "Which airborne infections did she list? Select all that apply.", "o": ["Measles", "Varicella", "Tuberculosis", "Smallpox", "Pertussis", "Scabies"], "a": [0, 1, 2, 3], "y": "Right: measles, varicella, TB and smallpox are airborne. Not pertussis: droplet. Not scabies: contact."}, {"ty": "sata", "d": 3, "q": "Which droplet infections did she list? Select all that apply.", "o": ["Influenza", "Pertussis", "Rubella", "Meningitis", "Tuberculosis", "MRSA"], "a": [0, 1, 2, 3], "y": "Right: flu, pertussis, rubella (the MMR component that is not measles) and meningitis. Not TB: airborne. Not MRSA: contact."}, {"ty": "sata", "d": 3, "q": "Which contact infections did she list? Select all that apply.", "o": ["Varicella", "Scabies", "RSV", "MRSA", "Influenza", "Smallpox"], "a": [0, 1, 2, 3], "y": "Right: varicella (along with airborne), scabies, RSV and MRSA. Not influenza: droplet. Not smallpox: airborne."}, {"ty": "mc", "d": 3, "q": "Which infection needs both airborne and contact precautions?", "o": ["Varicella", "Measles", "Pertussis", "Influenza"], "a": [0], "y": "Right: varicella spreads by air and by lesion contact. Not measles: airborne only. Not pertussis: droplet. Not influenza: droplet."}, {"ty": "mc", "d": 3, "q": "Which description fits scabies?", "o": ["A mite burrows under the skin; skin scraping; treated with permethrin", "A worm seen on a tape test, which is treated with permethrin", "A fungus seen on Wood's lamp, which is treated with permethrin", "A louse that lays nits on the hair shaft, treated with griseofulvin"], "a": [0], "y": "Right: Sarcoptes scabiei mites burrow, are found by scraping and treated with permethrin 5% cream. Not tape test: pinworm. Not fungus: tinea uses antifungals. Not nits and griseofulvin: lice are treated with permethrin shampoo."}, {"ty": "mc", "d": 3, "q": "Which description fits pinworm?", "o": ["Rectal itching at night, diagnosed with a tape test on 3 nights", "Scalp itching with nits found stuck on the hair shaft", "Burrows between the fingers, diagnosed by skin scraping", "A ring-shaped scaly patch that is treated with griseofulvin"], "a": [0], "y": "Right: pinworm itch worsens at night and the tape test is repeated. Not nits on hair shaft: lice. Not burrows: scabies. Not ring-shaped patch: tinea."}, {"ty": "mc", "d": 3, "q": "Which description fits tinea?", "o": ["A fungal infection with a scaly red itchy rash; treat the pets too", "A parasitic infection of burrowing mites that needs the family treated", "A viral rash that appears only after the fever breaks", "A worm infection that is spread by swallowing microscopic eggs"], "a": [0], "y": "Right: fungal rash, skin scraping and treating pets. Not burrowing mites: scabies. Not rash after fever: roseola. Not swallowed eggs: pinworm."}, {"ty": "mat", "d": 3, "q": "Match each clue to the infection.", "pairs": [["Nits on the hair shaft near the scalp", "Pediculosis capitis"], ["Burrows under the skin", "Scabies"], ["Scotch tape test on 3 nights", "Pinworm"], ["Scaly red ring-shaped rash", "Tinea"]], "y": "Nits on hair mean lice. Burrows mean scabies mites. Tape test means pinworm. A scaly ring rash means tinea, a fungus."}, {"ty": "mc", "d": 3, "q": "Which pairing of precaution and disease is correct?", "o": ["Droplet and meningitis", "Airborne and meningitis", "Contact and meningitis", "Standard and meningitis"], "a": [0], "y": "Right: she placed meningitis, viral or bacterial, under droplet. Not airborne: that group is measles, varicella, TB and smallpox. Not contact: that group is varicella, scabies, RSV and MRSA. Not standard only: transmission precautions are needed."}, {"ty": "mc", "d": 3, "q": "Which highlighted instruction on the scabies slide is correct?", "o": ["Shower, apply on clean skin head to toe, leave 8 to 12 hours, then wash", "Apply to the rash only and wash it off after 1 hour in the shower", "Apply at night to unwashed skin, and leave it on for 2 days", "Apply once to the whole body and never wash it off at all"], "a": [0], "y": "Right: this is the highlighted application. The other options use the wrong area, time or preparation."}, {"ty": "mc", "d": 3, "q": "Which transmission pair is correct for a mother holding her baby who has scabies?", "o": ["Direct skin-to-skin contact", "Airborne droplets across the room", "Swallowing eggs", "Insect vector"], "a": [0], "y": "Right: scabies spreads by direct contact (lecture). Not airborne droplets: not how mites spread. Not swallowing eggs: pinworm. Not a vector: that is how ticks and mosquitoes spread disease."}, {"ty": "mc", "d": 3, "q": "Which statement is correct about the passive immunity slide in Chapter 9?", "o": ["Immunoglobulins of one person are transferred to another, as in breastfeeding", "The person's own immune system generates the response after exposure", "It always lasts a lifetime once it has been acquired by the child", "It is another word for a vaccination given by injection in the clinic"], "a": [0], "y": "Right: this is the slide definition. Not own immune system: that is active. Not lifelong: passive fades. Not vaccination: vaccines produce active immunity."}, {"ty": "mc", "d": 3, "q": "Which vaccines did she say are given subcutaneously?", "o": ["MMR, varicella, polio and meningococcal polysaccharide", "DTaP, Hib and hepatitis B together, given in the thigh", "Hepatitis A, HPV and Tdap together, given in the arm", "PCV, MCV4 and influenza (IIV) shots, given in the muscle"], "a": [0], "y": "Right: the subcutaneous list in the box and lecture. The other options list intramuscular vaccines."}, {"ty": "mc", "d": 3, "q": "Why should an immunocompromised child avoid live vaccines?", "o": ["The weakened germ can multiply and cause disease when immunity is weak", "Live vaccines contain far too much toxoid for a weak child", "Live vaccines are only effective in adults and not in children", "Live vaccines make the child's antibodies cross the placenta"], "a": [0], "y": "Right: this is the mechanism. Not too much toxoid: toxoids are not live. Not adults only: not true. Not placenta: unrelated."}, {"ty": "mc", "d": 3, "q": "Which pair shows the two HIV tests and the age rule from the lecture?", "o": ["PCR for infants under 18 months, antibody test over 18 months", "Antibody test for infants under 18 months, PCR over 18 months", "PCR only, at any age", "Antibody test only, at any age"], "a": [0], "y": "Right: PCR is for under 18 months and antibody for over 18. Not the reverse: antibody tests in infants are unreliable because of maternal antibodies. Not PCR only or antibody only: the lecture gave both with an age cutoff."}, {"ty": "mc", "d": 3, "q": "Which statement about the HIV regimen is her big takeaway?", "o": ["Know the 3 classes: NRTIs, NNRTIs and protease inhibitors", "Know one broad antibiotic that treats HIV by itself", "Know that steroids are the first line for HIV", "Know the sunscreen SPF for children with HIV"], "a": [0], "y": "Right: she repeated the three classes at the end. The other choices are not part of HIV treatment."}, {"ty": "mc", "d": 3, "q": "Which pairing of type of immunity and cell is correct?", "o": ["Cellular immunity and T lymphocytes", "Cellular immunity and B lymphocytes", "Humoral immunity and T lymphocytes", "Passive immunity and T lymphocytes"], "a": [0], "y": "Right: cellular is T cells. Not B for cellular: B cells are humoral. Not T for humoral: reversed. Not passive and T: passive is borrowed antibodies."}, {"ty": "mc", "d": 3, "q": "Which setting best represents a universal screening example from the lecture?", "o": ["Testing every child for lead in Virginia", "Testing a child for TB after an exposure", "Testing for anemia only in preterm infants", "A hearing test only for children with ear infections"], "a": [0], "y": "Right: lead testing was the lecture example of screening everyone. The other examples test only children with risk factors, which is selective."}, {"ty": "sata", "d": 3, "q": "Which are the five vaccine types on the slide? Select all that apply.", "o": ["Live attenuated", "Killed", "Toxoid", "Conjugate", "Recombinant", "Plasma-derived", "Immunosuppressive"], "a": [0, 1, 2, 3, 4], "y": "Right: five types: live attenuated, killed, toxoid, conjugate and recombinant. Not plasma-derived or immunosuppressive: not vaccine types."}, {"ty": "mc", "d": 3, "q": "A nurse teaches that scabies and pinworm share one feature. Which is it?", "o": ["The itching is worse at night", "Both are diagnosed with a tape test", "Both are treated with griseofulvin", "Both are caused by fungi"], "a": [0], "y": "Right: both itch more at night. Not tape test for both: only pinworm. Not griseofulvin: it is for tinea. Not fungi: scabies is a mite and pinworm is a worm."}, {"ty": "mc", "d": 3, "q": "The slide on role of immunizations she asked you to highlight lists which group of diseases?", "o": ["DTP, MMR, varicella and polio", "Lyme disease, RMSF, malaria and rabies", "Head lice, scabies, pinworm and ringworm", "HIV, SCID, latex allergy and autoimmune disease"], "a": [0], "y": "Right: the DTP, MMR, varicella and polio group. The other groups are not prevented by these vaccines."}, {"ty": "mc", "d": 3, "q": "Which description matches a viral rash that you should recognize by Koplik spots?", "o": ["Rubeola (measles)", "Rubella (German measles)", "Roseola infantum", "Varicella (chickenpox)"], "a": [0], "y": "Right: Koplik spots are the key finding for rubeola. Not rubella: milder and no Koplik spots. Not roseola: rash after fever. Not varicella: vesicles."}, {"ty": "mc", "d": 3, "q": "Her memory trick for fifth disease is a slap on the cheek. Which virus is it?", "o": ["Parvovirus B19", "Rubella virus", "Varicella-zoster virus", "Human herpesvirus 6"], "a": [0], "y": "Right: parvovirus B19 is fifth disease. Not rubella: German measles. Not varicella-zoster: chickenpox. Not HHV-6: roseola."}, {"ty": "mc", "d": 3, "q": "A nurse records a child's temperature as 100.4 F. What did she say about fever cutoffs?", "o": ["Institutions differ, such as 100.3 or 100.5, so follow the order", "Every hospital uses exactly 100.4 F as the fever cutoff", "A fever is only counted when the temperature is above 104 F", "Fever is defined by chills and flushing, not by a number"], "a": [0], "y": "Right: she said institutions set different numbers. Not 100.4 everywhere: the lecture says it varies. Not 104: far too high. Not chills only: a measured temperature is used."}, {"ty": "mc", "d": 3, "q": "Her memory trick for head lice is 'capitis = cap'. What does it mean?", "o": ["Capitis is the head and pubis is the pubic area", "Capitis means the lice live only in hats and brushes", "Capitis means the lice that live in the pubic area", "Capitis means the infection is caused by a worm"], "a": [0], "y": "Right: capitis for the head and pubis for the pubic area. The other options are wrong in location or kind of organism."}, {"ty": "mc", "d": 3, "q": "Which statement about the medical home is correct?", "o": ["Long-term, comprehensive, family-centered, coordinated care from infancy on", "A hospital unit that cares for chronically ill children only and no one else", "A pharmacy service that fills prescriptions for children and their families", "A school program that offers health screenings to children during the day"], "a": [0], "y": "Right: this is the slide definition. Not a hospital unit or pharmacy or school program: it is a primary care relationship."}, {"ty": "ngn", "d": 3, "scen": "A 6-year-old has a fever of 103 F, a cough, red eyes and white spots inside the cheeks, and a red rash from the hairline down. Her mother says no vaccines were given.", "parts": [{"ty": "mc", "d": 3, "q": "Which precaution is required?", "o": ["Airborne precautions", "Droplet precautions", "Contact precautions", "Standard precautions"], "a": [0], "y": "Right: measles is airborne. Not droplet: rubella and others. Not contact or standard: not enough."}, {"ty": "mc", "d": 3, "q": "Which vaccine prevents this illness?", "o": ["MMR, given subcutaneously", "DTaP, given intramuscularly", "Hib, given intramuscularly", "Rotavirus, given by mouth"], "a": [0], "y": "Right: MMR prevents measles and is subcutaneous. The others prevent different diseases."}, {"ty": "mc", "d": 3, "q": "Which pair of findings is most specific?", "o": ["Koplik spots and a rash from the hairline down", "Slapped cheeks and a lacy rash on the limbs", "A rash that appears after the fever breaks", "Itchy vesicles in crops of different stages"], "a": [0], "y": "Right: Koplik spots and the downward rash identify rubeola. The other pairs describe fifth disease, roseola and varicella."}], "y": ""}, {"ty": "ngn", "d": 3, "scen": "A 5-year-old has a fever and a rash that began on the wrists and ankles and spread to the trunk. His father pulled a tick off his leg 4 days ago.", "parts": [{"ty": "mc", "d": 3, "q": "What is the best first action?", "o": ["Start doxycycline as ordered and send a PCR test", "Wait a week before starting any treatment", "Apply permethrin cream head to toe", "Give griseofulvin by mouth for 6 weeks"], "a": [0], "y": "Right: treat quickly, since the disease can be fatal, and send PCR. Not waiting: dangerous. Not permethrin or griseofulvin: wrong drug classes."}, {"ty": "sata", "d": 3, "q": "Which teaching does the nurse give? Select all that apply.", "o": ["Use fine-tipped tweezers for tick removal", "Save the tick", "Check skin after being outdoors", "Twist ticks out gently", "Burn the tick off"], "a": [0, 1, 2], "y": "Right: correct removal, saving the tick and checking skin. Not twisting or burning: harm the removal."}], "y": ""}, {"ty": "mc", "d": 3, "q": "Which statement about HIV transmission is correct?", "o": ["Vertical transmission is mother to infant in utero or via breast milk", "Horizontal transmission is mother to infant in utero", "Vertical transmission is by tattooing and shared needles", "Horizontal transmission is by breast milk from mother to infant"], "a": [0], "y": "Right: this is the lecture and note definition. The other options swap the two terms."}, {"ty": "mc", "d": 3, "q": "A nurse prepares MMR, DTaP and Hib for a 15-month-old. Which route plan is correct?", "o": ["MMR subcutaneously, DTaP and Hib intramuscularly", "MMR intramuscularly, DTaP and Hib subcutaneously", "All three subcutaneously because the child is a toddler", "MMR by intranasal spray, DTaP and Hib intramuscularly"], "a": [0], "y": "Right: MMR is live and is on the subcutaneous list, while DTaP and Hib are intramuscular. Not the reverse: it flips both lists. Not all subcutaneous: DTaP and Hib are not on that list. Not intranasal: only the live flu vaccine (LAIV) is a nasal spray."}, {"ty": "mc", "d": 3, "q": "Why is the vastus lateralis the intramuscular site for infants?", "o": ["It has the most muscle mass at that age, so the dose reaches muscle", "It has the thickest fat layer, which slows absorption of the vaccines given there", "The deltoid is reserved for subcutaneous vaccines in every age group of children", "It prevents soreness completely, so no teaching is needed after the vaccine"], "a": [0], "y": "Right: the thigh muscle is the largest in an infant, and the deltoid is too small. Not fat: a thick fat layer is a reason to reach muscle, not a benefit. Not deltoid reserved for subcutaneous: older children use the deltoid for IM shots. Not no soreness: soreness is expected."}, {"ty": "mc", "d": 3, "q": "Why are infants under 1 year at the highest risk from pertussis?", "o": ["They cannot finish the series until 6 months and may stop breathing", "They receive no protection from DTaP at any point during the whole first year", "Pertussis spreads only to infants and only through contact with breast milk", "Their lungs are too large for coughing fits to clear the secretions well"], "a": [0], "y": "Right: the primary series is incomplete until 6 months, and infants may have apnea. Not no protection: DTaP starts at 2 months. Not breast milk: pertussis is droplet spread. Not lungs too large: infant airways are small, which is part of the danger."}, {"ty": "mc", "d": 3, "q": "A 13-month-old has a runny nose and a temperature of 100.8 F (38.2 C) at the MMR and varicella visit. Which action is correct?", "o": ["Give the vaccines, because a mild illness is not a reason to delay", "Give only varicella today because MMR is the stronger live vaccine", "Hold both until the child has been fever-free for 2 weeks", "Give both at half the usual dose to lower the chance of a reaction"], "a": [0], "y": "Right: mild illness and a low-grade fever do not weaken the response enough to delay. Not varicella only: both live vaccines are given. Not 2 weeks fever-free: that delay is unnecessary and risks a missed visit. Not half doses: a partial dose gives incomplete protection."}, {"ty": "mc", "d": 3, "q": "Which child should NOT receive the MMR vaccine today?", "o": ["A child on high-dose chemotherapy with severe immunosuppression", "A child taking amoxicillin for otitis media and a temperature of 99 F", "A child who was born at 34 weeks and is now 12 months old and healthy", "A child who is breastfed and whose mother has a mild cold this week"], "a": [0], "y": "Right: MMR is a live vaccine, and a weakened germ can multiply when immunity cannot control it. Not current antibiotics, prematurity or breastfeeding: these are on the not-a-reason-to-delay list."}, {"ty": "mc", "d": 3, "q": "A child steps on a rusty nail. Which statement about tetanus is correct?", "o": ["Spores enter the wound, and it is not passed from person to person", "It spreads by coughing, so droplet precautions with a mask are needed", "It spreads by skin contact, so contact precautions with a gown are needed", "It spreads in the air, so a negative pressure room is needed for the child"], "a": [0], "y": "Right: Clostridium tetani spores in soil enter a wound, and there is no person-to-person spread. Not droplet, contact or airborne: those routes apply to pertussis, scabies and measles, not tetanus."}, {"ty": "mc", "d": 3, "q": "Which nursing priority fits a child with a thick gray throat membrane and a swollen neck?", "o": ["Watch the airway for obstruction and keep emergency equipment ready", "Encourage forceful coughing to clear the membrane from the throat", "Scrape the membrane off with a swab to make swallowing easier", "Offer a large meal now so calories are taken before swallowing worsens"], "a": [0], "y": "Right: diphtheria can close the airway, so airway comes first (ABC). Not forceful coughing: it does not clear a membrane and tires the child. Not scraping: it bleeds and worsens swelling. Not a large meal: swallowing is already hard and aspiration is a risk."}, {"ty": "mc", "d": 3, "q": "A newborn of a mother who is positive for hepatitis B surface antigen receives HBIG. Which type of immunity does this give?", "o": ["Passive immunity, because the antibodies are borrowed and fade", "Active immunity, because the baby's own cells made antibodies in response", "Cellular immunity, because the mother's T cells were transferred to the baby", "Humoral immunity that lasts for the child's entire life after one dose"], "a": [0], "y": "Right: immune globulin is antibodies made by someone else, so protection is short-lived. Not active: the baby's own system did not make them. Not cellular: T cells are not given. Not lifelong humoral: borrowed antibodies fade in weeks to months."}, {"ty": "mc", "d": 3, "q": "A mother asks why her 2-month-old is protected from many germs but still needs a vaccine series. Which explanation is best?", "o": ["Maternal IgG is borrowed protection that fades, so the baby builds her own", "Maternal IgM crosses the placenta and lasts until the child is about age 3", "Vaccines replace the mother's antibodies with stronger ones made in a lab", "The baby's B cells are fully mature at birth, so vaccines are optional later"], "a": [0], "y": "Right: IgG crosses the placenta and is used up, so active immunity from vaccines is needed. Not IgM: it does not cross the placenta. Not replacement: vaccines teach the baby's own cells. Not mature B cells: infant B cells respond less well than adult cells."}, {"ty": "mc", "d": 3, "q": "Which statement about IgA, IgD, IgE and IgM in a newborn is correct?", "o": ["They do not cross the placenta and need an antigen challenge to be made", "They cross the placenta in the third trimester and protect for 6 months", "They are supplied only by breast milk and not made by the infant", "They are present at adult levels at birth in a full-term infant"], "a": [0], "y": "Right: only IgG crosses the placenta, so these four must be produced after exposure. Not crossing: that is IgG. Not only breast milk: the infant makes them over time. Not adult levels: levels rise with age."}, {"ty": "mc", "d": 3, "q": "A nurse notes that a 5-year-old's neutrophils and monocytes still show decreased chemotaxis. When do these cells reach adult levels?", "o": ["Age 7", "Age 2", "At birth for a full-term infant", "Age 12"], "a": [0], "y": "Right: the slide says phagocytes reach adult levels at age 7, so a 5-year-old is still slower to send white cells to an infection. The other ages do not match the slide."}, {"ty": "mc", "d": 3, "q": "Which child most needs a workup for primary immunodeficiency?", "o": ["A child with 5 ear infections in 12 months and thrush that persists at 14 months", "A child with 3 colds in 6 months and 1 ear infection that cleared quickly with rest", "A child with 1 pneumonia in a year that cleared with a 10-day course of antibiotic", "A child with diaper rash after a course of antibiotics and no other infections at all"], "a": [0], "y": "Right: 4 or more ear infections in a year and persistent thrush after 1 year are warning signs. Not the others: frequent colds, one pneumonia and a diaper rash do not meet the warning criteria."}, {"ty": "mc", "d": 3, "q": "Why does a stem cell or bone marrow transplant treat SCID?", "o": ["It replaces the source of the missing T cells and B cells", "It filters harmful antibodies out of the plasma", "It gives the child borrowed antibodies that last for life", "It calms an overactive immune system that attacks the body"], "a": [0], "y": "Right: marrow is where T and B cells are made, and SCID lacks both. Not filtering: that describes plasmapheresis. Not borrowed antibodies: IVIG does that and fades. Not calming: that describes immunosuppressants."}, {"ty": "mc", "d": 3, "q": "A 6-month-old born to an HIV-positive mother has a positive ELISA. Why is a PCR test needed?", "o": ["ELISA finds antibodies, and maternal antibodies can remain up to 18 months", "ELISA finds viral DNA, so it is unreliable once the child is on medication", "ELISA is only valid in children who have a CD4 count above 200", "PCR is only done after 18 months when the child is older"], "a": [0], "y": "Right: a positive antibody test in a young infant may reflect the mother's antibodies, while PCR finds the virus itself. Not viral DNA: that is what PCR detects. Not CD4 above 200: ELISA validity does not depend on CD4. Not after 18 months: the antibody test is used then, and PCR is used before."}, {"ty": "mc", "d": 3, "q": "A 20-month-old has an unclear HIV exposure history. Which test does the lecture support?", "o": ["The HIV antibody test, because maternal antibodies have cleared", "PCR only, because antibody tests are never used in any child at any age", "A platelet count, because it confirms the diagnosis of HIV infection in children", "A CD4 count under 200, because it is the screening test for all children"], "a": [0], "y": "Right: over 18 months the antibody test is used. Not PCR only: PCR is the rule under 18 months. Not platelets: they show bleeding risk, not the diagnosis. Not CD4: it stages disease and is not a screening test."}, {"ty": "mc", "d": 3, "q": "A child's CD4 count is 180. Which statement is correct?", "o": ["It is under 200, which is where HIV is diagnosed as AIDS", "It is normal for a child of any age, so no action is needed", "It means the viral load is undetectable on treatment", "It means the platelet count needs treatment now"], "a": [0], "y": "Right: a CD4 count under 200 is the cutoff from the note and lecture. Not normal: CD4 is low in HIV. Not undetectable viral load: that is a different test. Not platelets: platelets below 30,000 need treatment, which is a separate count."}, {"ty": "mc", "d": 3, "q": "Which regimen follows her takeaway of one drug from each of the three classes?", "o": ["Zidovudine, nevirapine and lopinavir with ritonavir", "Zidovudine, lamivudine and nevirapine", "Nevirapine, efavirenz and lopinavir with ritonavir", "Trimethoprim-sulfamethoxazole, zidovudine and nevirapine"], "a": [0], "y": "Right: zidovudine is an NRTI, nevirapine an NNRTI and lopinavir with ritonavir a protease inhibitor. Not the second: two NRTIs. Not the third: two NNRTIs. Not the fourth: trimethoprim-sulfamethoxazole prevents Pneumocystis pneumonia and is not one of the three classes."}, {"ty": "mc", "d": 3, "q": "A child with HIV has a low CD4 count. Which drug prevents Pneumocystis pneumonia?", "o": ["Trimethoprim-sulfamethoxazole", "Zidovudine, an NRTI used in the regimen", "Lopinavir with ritonavir, the protease inhibitor", "Nevirapine, an NNRTI used in the regimen"], "a": [0], "y": "Right: trimethoprim-sulfamethoxazole is the prophylaxis for Pneumocystis pneumonia when CD4 is low. Zidovudine, nevirapine and lopinavir with ritonavir treat the HIV itself and are not prophylaxis for this pneumonia."}, {"ty": "mc", "d": 3, "q": "A teenager contracts HIV from a tattoo done with a nonsterile needle. How is this classified?", "o": ["Horizontal transmission, because it spread by blood contact", "Vertical transmission, because it spread through a bodily fluid", "Vertical transmission, because it began in a tattoo parlor", "Horizontal transmission, because it passed from a mother"], "a": [0], "y": "Right: nonsterile needles, blood products and tattooing are horizontal. Not vertical: vertical means mother to infant, in utero or by breast milk. The last choice describes the wrong route for a horizontal case."}, {"ty": "mc", "d": 3, "q": "A child with spina bifida develops hives and wheezing after eating a banana. Which explanation fits?", "o": ["An IgE-mediated cross-reaction, because banana proteins resemble latex proteins", "A T-cell infection of the bone marrow that was caused by eating the banana", "A slow, mild rash that appears several days after the child has eaten the fruit", "A viral illness that destroys CD4 cells over time after the first exposure"], "a": [0], "y": "Right: latex allergy is IgE-mediated and food proteins can look like latex proteins, so anaphylaxis is possible. Not a T-cell infection or viral destruction of CD4 cells: those describe other diseases. Not slow and mild: the reaction is sudden."}, {"ty": "mc", "d": 3, "q": "A mother twisted a tick and its head stayed in her child's skin. Which teaching is correct?", "o": ["Twisting can break the mouthparts off, so pull straight up with steady pressure", "Twisting is correct, and burning the tick afterward helps it release its grip fast", "Twisting loosens the grip, so pull the tick from its body quickly with your fingers", "Covering the tick with petroleum jelly is the safest way to remove it from the skin"], "a": [0], "y": "Right: mouthparts can stay in the skin when a tick is twisted or jerked. Not twist and burn: burning does not help and may release germs. Not pulling the body quickly: it squeezes the tick and leaves parts. Not petroleum jelly: the tick stays attached."}, {"ty": "mc", "d": 3, "q": "A child has a bull's-eye rash on the back 4 days after a hike. Which statement is correct?", "o": ["It can appear anywhere on the body and is the sign of early Lyme disease", "It only counts as Lyme disease if it is found at the bite site on the skin", "It is the typical rash of Rocky Mountain spotted fever and begins on the wrists", "It always itches and hurts, which separates it from other rashes in children"], "a": [0], "y": "Right: the speaker note says erythema migrans can show up anywhere after a tick bite. Not bite site only: that is the trap. Not RMSF: that rash starts at the wrists and ankles and becomes petechial. Not itchy and painful: it usually does not itch or hurt."}, {"ty": "mc", "d": 3, "q": "Which finding points to Rocky Mountain spotted fever rather than Lyme disease?", "o": ["A rash that begins at the wrists and ankles and becomes petechial", "An expanding red ring with central clearing that appears within days of the bite", "A tick bite from a black-legged (deer) tick that was attached for 36 hours", "Facial palsy and arthritis that appear weeks after the original tick bite"], "a": [0], "y": "Right: the RMSF rash starts at the wrists and ankles, spreads to the palms, soles and trunk, and becomes petechial. Not the expanding ring, the deer tick or later palsy and arthritis: these belong to Lyme disease."}, {"ty": "mc", "d": 3, "q": "Why is doxycycline started for suspected Rocky Mountain spotted fever before the PCR result returns?", "o": ["The disease can be fatal within days, and early tests may be negative", "PCR is only valid after the child has already taken the antibiotic for 24 hours", "The result changes the drug from doxycycline to permethrin if the test is positive", "Doxycycline must be in the blood before a tick can be safely removed from the skin"], "a": [0], "y": "Right: delay is dangerous and labs lag behind. Not PCR after antibiotic: the test does not depend on it. Not permethrin: it is an antiparasitic that does not treat this disease. Not before removal: the tick is removed on its own timeline."}, {"ty": "mc", "d": 3, "q": "A parent says, 'I will apply permethrin only to the rash and wash it off after 30 minutes.' Which correction is best?", "o": ["Apply it head to toe on clean skin, leave it 8 to 12 hours, then wash it off", "Apply it only from the neck down on clean skin and leave it on for 24 hours", "Apply it to the rash only and leave it on until the itching has fully stopped", "Apply it at bedtime on unwashed skin and rinse it off the next morning after 1 hour"], "a": [0], "y": "Right: the highlighted instruction is shower, dry, apply on clean skin head to toe for the ordered time (8 to 12 hours), then wash. Not neck down: mites live everywhere on the skin. Not until itching stops: itching lasts weeks. Not unwashed skin for 1 hour: too short and dirty skin."}, {"ty": "mc", "d": 3, "q": "Three weeks after a scabies treatment, the child still itches. Which statement is correct?", "o": ["Itching can last 2 to 4 weeks after treatment and does not mean it failed", "Repeat permethrin daily until the itching stops completely, even for 3 weeks", "Switch to lindane right away because the permethrin has clearly failed to work", "Itching after treatment always means the whole family was not treated at all"], "a": [0], "y": "Right: the lecture says itching can continue 2 to 4 weeks. Not daily permethrin: overuse irritates skin. Not lindane: a last resort that can cause seizures. Not untreated family: family treatment is needed, but itching alone does not prove it."}, {"ty": "mc", "d": 3, "q": "Why should lindane be avoided in infants?", "o": ["It can cause seizures, so it is a last resort", "It cannot kill scabies mites in children under 1 year", "It causes severe nausea if applied for more than 1 hour", "It is only effective against lice and not against scabies"], "a": [0], "y": "Right: lindane is neurotoxic and can cause seizures, so permethrin is first choice. The other choices state effects that are not the reason: lindane is listed as a scabies treatment, and its danger is seizures."}, {"ty": "mc", "d": 3, "q": "A parent says, 'My son's lice will jump from head to head, so I will keep him away from other children.' What does this show?", "o": ["Misunderstanding: lice crawl and spread by head contact and shared items", "Correct teaching: lice jump, so keeping a distance of 3 feet prevents spread", "Correct teaching: lice live for a week away from the head, so wash items often", "Misunderstanding: lice are caused by poor hygiene, which the mother must fix"], "a": [0], "y": "Right: lice crawl, they do not jump, and they spread by head-to-head contact and shared combs, hats and brushes. Not jump: that is the myth. Not a week off the head: they live 48 hours. Not poor hygiene: the myth is about hygiene, but this parent did not say it."}, {"ty": "mc", "d": 3, "q": "Why is permethrin 1% shampoo repeated in 7 days?", "o": ["To kill lice that hatched after the first treatment before they lay eggs", "Because the first treatment only works on adult lice and ignores the young", "Because the shampoo loses its effect once the hair has been combed out", "Because nits hatch within 24 hours of the first application of the shampoo"], "a": [0], "y": "Right: nits hatch in 7 to 10 days, so a repeat catches newly hatched lice. Not adult lice only: the point is timing of hatching. Not combing: combing is done daily regardless. Not 24 hours: nits hatch in 7 to 10 days."}, {"ty": "mc", "d": 3, "q": "Why are combs and stuffed toys sealed in a plastic bag for 14 days?", "o": ["Nits hatch in 7 to 10 days and lice die within 48 hours without a host", "Lice survive 2 weeks off the head and the bag keeps them alive until then", "Plastic kills nits within 1 hour and the rest of the time is only spare time", "Lice can jump out of the bag unless it has been sealed for a full 14 days"], "a": [0], "y": "Right: 14 days covers the longest hatching time plus the death of lice without a host. Not 2 weeks off the head: 48 hours. Not 1 hour: the bag deprives them and time covers hatching. Not jumping: lice crawl."}, {"ty": "mc", "d": 3, "q": "Why is the pinworm tape test done on 3 consecutive nights?", "o": ["One negative test can miss it, since females lay eggs on and off at night", "The worms only appear on the third night after the infection has begun", "The tape loses its stick after the first night and must be replaced each time", "The test measures the number of worms that are present to set the dose"], "a": [0], "y": "Right: egg laying is intermittent, so repeat tests increase the chance of finding eggs. Not third night only: worms can be found any night. Not tape losing stick: not the reason. Not dosing: treatment is a set dose and repeated in 2 weeks."}, {"ty": "mc", "d": 3, "q": "Which action best breaks the pinworm cycle in a household?", "o": ["Treat all household members and wash bedding and underwear in hot water", "Treat only the child and wash only the child's pajamas and sheets in warm water", "Give antibiotics to the whole family for 10 days to kill the intestinal worms", "Apply permethrin from head to toe on the child at night and rinse in the morning"], "a": [0], "y": "Right: others carry it without symptoms and spread it fecal-orally, so everyone is treated. Not the child only: reinfection follows. Not antibiotics: pinworm is a worm and needs mebendazole, albendazole or pyrantel pamoate. Not permethrin: that treats scabies."}, {"ty": "mc", "d": 3, "q": "Which pairing of tinea site and drug is correct?", "o": ["Tinea pedis with tolnaftate and tinea capitis with oral griseofulvin", "Tinea pedis with griseofulvin and tinea capitis with tolnaftate", "Tinea capitis with permethrin and tinea pedis with spinosad", "Tinea pedis with oral fluconazole only and tinea capitis with nystatin"], "a": [0], "y": "Right: tolnaftate for feet and body, oral griseofulvin without a corticosteroid for scalp. Not swapped: it reverses the sites. Not permethrin and spinosad: those are for scabies and lice. Not fluconazole only and nystatin: they are not the slide's pairing."}, {"ty": "mc", "d": 3, "q": "Fluconazole (Diflucan) is described as systemic. What does that mean?", "o": ["It acts throughout the body rather than only on the skin where it is applied", "It is applied only to the rash and absorbed into the nearby skin over time", "It is a shampoo that is left on the scalp for 10 minutes and then rinsed out", "It is only used to treat parasites that burrow under the skin of the hands"], "a": [0], "y": "Right: systemic drugs are taken by mouth or IV and travel in the blood. Not applied only to the rash, or a shampoo: those are topical. Not for burrowing parasites: it is an antifungal, and burrowing mites are scabies."}, {"ty": "mc", "d": 3, "q": "A 12-month-old had a temperature of 104 F for 4 days. The fever stopped, and a pink rash appeared on the trunk. Which illness is this?", "o": ["Roseola infantum, also called sixth disease", "Fifth disease, also called slapped cheek disease", "Rubeola, also called measles", "Rubella, also called German measles"], "a": [0], "y": "Right: roseola has days of high fever, then the fever breaks and a rose-pink rash appears. Not fifth disease: slapped cheeks and a lacy rash. Not rubeola: Koplik spots and cough, with the rash while ill. Not rubella: mild fever with swollen posterior auricular nodes."}, {"ty": "mc", "d": 3, "q": "A coworker is pregnant. Which statement about a child with rubella is correct?", "o": ["Rubella is teratogenic, so the coworker should avoid contact", "Rubella is harmless in pregnancy because it is mild in children", "Rubella spreads only to pregnant women", "Rubella requires an N95 and a negative pressure room for the coworker"], "a": [0], "y": "Right: rubella can cause congenital defects such as cataracts, deafness and heart defects. Not harmless: mild illness in the child does not mean mild in the fetus. Not only pregnant women: anyone nonimmune can get it. Not airborne: rubella is droplet."}, {"ty": "mc", "d": 3, "q": "Which finding is characteristic of varicella?", "o": ["Itchy vesicles in crops, with macules, vesicles and crusts present at once", "A single crop of uniform vesicles that all crust over together in one week", "A bright red face, then a lacy rash on the limbs that returns with sun", "White spots on the inner cheeks that appear before the red blotchy rash"], "a": [0], "y": "Right: varicella lesions appear in crops, so different stages exist together. Not a single uniform crop: that is not varicella. Not slapped cheeks and lace: fifth disease. Not white inner-cheek spots: Koplik spots of rubeola."}, {"ty": "mc", "d": 3, "q": "Why can a child with the slapped cheek rash attend school?", "o": ["The child was contagious before the rash and is not once it shows", "The rash is not caused by a virus, so it cannot spread to other children", "The child is contagious only after the rash has crusted over completely", "Fifth disease spreads only during the first 5 days of life in newborns"], "a": [0], "y": "Right: parvovirus B19 is spread before the rash appears. Not non-viral: it is caused by parvovirus B19. Not after crusting: crusts describe varicella. Not 5 days of life: the name fifth disease refers to its place in the old rash list."}, {"ty": "mc", "d": 3, "q": "A child's WBC count is 18,000 with many neutrophils and bands. Which conclusion is best?", "o": ["A bacterial infection is likely, since granulocytes respond first", "A viral infection is likely, since lymphocytes are the first line", "A parasitic infection is likely, since monocytes respond first", "The count is normal and needs no further assessment"], "a": [0], "y": "Right: neutrophils are granulocytes, the first line of defense, and bands point to bacteria. Not viral: lymphocytes rise in viral infection and are not the first line. Not monocytes: second line. Not normal: the count is high."}, {"ty": "mc", "d": 3, "q": "Which child needs a negative pressure room?", "o": ["A child with active tuberculosis", "A child with pertussis", "A child with bacterial meningitis", "A child with a MRSA wound infection"], "a": [0], "y": "Right: TB is airborne, so it needs negative pressure and an N95. Not pertussis or meningitis: droplet, with a private room and surgical mask. Not MRSA: contact, with gown and gloves."}, {"ty": "mc", "d": 3, "q": "A nurse enters the room of a child with pertussis. Which PPE is correct?", "o": ["A surgical mask in a private room", "An N95 in a negative pressure room", "A gown and gloves only", "No PPE beyond hand hygiene"], "a": [0], "y": "Right: pertussis is droplet, which travels a short distance. Not N95 and negative pressure: airborne. Not gown and gloves only: contact. Not hand hygiene only: standard precautions are not enough for droplet disease."}, {"ty": "mc", "d": 3, "q": "A nurse asks about lead exposure for every 12-month-old but gives a TB skin test only to a child exposed to active TB. How are these screenings classified?", "o": ["Lead is universal, and the TB test is selective after a risk assessment", "Lead is selective screening, and the TB test is universal screening for all", "Both are universal screenings because they are both done at 12 months of age", "Both are selective screenings because they depend on the individual child"], "a": [0], "y": "Right: universal screening covers everyone regardless of risk, while selective needs a risk factor found by risk assessment. Not the reverse: it swaps the definitions. Not both universal or both selective: only one applies to everyone."}, {"ty": "sata", "d": 3, "q": "Which vaccines are live attenuated? Select all that apply.", "o": ["MMR", "Varicella", "Rotavirus", "Influenza nasal spray (LAIV)", "IPV", "Hepatitis A", "Influenza injection (IIV)"], "a": [0, 1, 2, 3], "y": "Right: MMR, varicella, oral rotavirus and LAIV use a weakened live germ. Not IPV, hepatitis A or injected flu (IIV): these are killed vaccines and cannot cause the disease."}, {"ty": "sata", "d": 3, "q": "Which findings are signs of HIV infection in a child? Select all that apply.", "o": ["Failure to thrive", "Prolonged candidiasis", "Recurrent bacterial infections", "Developmental delay", "Koplik spots with a downward rash", "Slapped cheeks with a lacy rash"], "a": [0, 1, 2, 3], "y": "Right: failure to thrive, prolonged candidiasis, recurrent bacterial infections and developmental delay are on the slide. Not Koplik spots or slapped cheeks: they identify measles and fifth disease."}, {"ty": "sata", "d": 3, "q": "Which findings are warning signs of primary immunodeficiency? Select all that apply.", "o": ["Four or more ear infections in 1 year", "Two or more pneumonias in 1 year", "Antibiotics for 2 months or longer with little effect", "Persistent thrush after 1 year of age", "One cold per season", "One course of antibiotics that cleared an infection"], "a": [0, 1, 2, 3], "y": "Right: these four are on the warning-sign list. Not one cold per season or a single course that worked: normal for children."}, {"ty": "sata", "d": 3, "q": "Which foods can cross-react in a child with latex allergy? Select all that apply.", "o": ["Banana", "Avocado", "Kiwi", "Chestnut", "Rice", "Cow's milk", "Chicken"], "a": [0, 1, 2, 3], "y": "Right: banana, avocado, kiwi and chestnut are the classic cross-reacting foods because their proteins look like latex proteins. Not rice, milk or chicken: not on the cross-reacting list."}, {"ty": "sata", "d": 3, "q": "Which are stressors for a family after an HIV diagnosis? Select all that apply.", "o": ["Diagnosis of an incurable disease", "HIV-associated stigma", "Financial difficulties", "Multiple medical appointments and hospitalizations", "Fewer appointments after the first year", "A guaranteed cure from a single drug"], "a": [0, 1, 2, 3], "y": "Right: these four are listed stressors, along with multiple affected family members and a wish for confidentiality. Not fewer appointments or a guaranteed cure: HIV is incurable and needs ongoing follow-up."}, {"ty": "sata", "d": 3, "q": "Which teaching points help prevent the spread of head lice? Select all that apply.", "o": ["Examine all family members", "Avoid sharing hats, combs and brushes", "Comb out nits daily for 1 week", "Wash linens in hot water or seal items in a bag for 14 days", "Shave the head of every family member", "Spray the house with insecticide daily"], "a": [0, 1, 2, 3], "y": "Right: these steps are on the slide. Not shaving or daily house spraying: unnecessary and potentially harmful, since lice live on the head."}, {"ty": "sata", "d": 3, "q": "Which findings are more typical of Rocky Mountain spotted fever than Lyme disease? Select all that apply.", "o": ["A rash that starts at the wrists and ankles", "A petechial rash that spreads to the palms and soles", "Transmission by the American dog tick or wood tick", "A diagnosis supported by PCR testing", "An expanding bull's-eye rash", "Transmission by the black-legged (deer) tick"], "a": [0, 1, 2, 3], "y": "Right: these four describe RMSF. Not bull's-eye rash and the deer tick: those are Lyme disease."}, {"ty": "sata", "d": 3, "q": "Which situations are NOT reasons to delay a vaccine? Select all that apply.", "o": ["A mild cold", "A child currently on antibiotics", "Prematurity", "Breastfeeding", "Anaphylaxis to a previous dose", "Severe immunodeficiency before a live vaccine"], "a": [0, 1, 2, 3], "y": "Right: a mild cold, current antibiotics, prematurity and breastfeeding do not weaken the response enough to delay. Not anaphylaxis to a prior dose or severe immunodeficiency with a live vaccine: these are contraindications."}, {"ty": "ord", "d": 3, "q": "Put the scabies treatment steps in order.", "items": ["Shower and dry off", "Apply the medication on clean skin from head to toe", "Leave it on for the ordered time of 8 to 12 hours", "Wash it off", "Wash bedding and clothing in hot water"], "y": "Clean dry skin comes first so the drug contacts the mites. Apply head to toe, leave it on for 8 to 12 hours, wash it off, then hot wash and dry the linens."}, {"ty": "ord", "d": 3, "q": "Put the stages of a varicella lesion in order.", "items": ["Macule", "Papule", "Vesicle", "Pustule", "Crust"], "y": "The spot is flat (macule), raises (papule), fills with clear fluid (vesicle), turns cloudy (pustule), then dries into a crust. In varicella all stages are present at once."}, {"ty": "ord", "d": 3, "q": "Put the vaccine card milestones in order from youngest to oldest.", "items": ["MMR #1 and varicella #1 at 12 to 15 months", "DTaP #4 at 15 to 18 months", "DTaP #5, IPV #4, MMR #2 and varicella #2 at 4 to 6 years", "Tdap, HPV and MenACWY #1 at 11 to 12 years", "MenACWY booster at 16 years"], "y": "Toddler visits come first, then DTaP #4, then the preschool boosters, then the 11 to 12 year set, then the 16-year booster."}, {"ty": "ord", "d": 3, "q": "Put the course of measles (rubeola) in order.", "items": ["Exposure and incubation", "Fever, cough, runny nose and red eyes", "Koplik spots inside the cheeks", "Red blotchy rash from the hairline down", "Recovery"], "y": "Symptoms begin as a cold-like prodrome, Koplik spots appear before the rash, the rash then spreads downward, and the child recovers."}, {"ty": "ord", "d": 3, "q": "Put the nursing care for a vaccine visit in order.", "items": ["Screen for allergies and illness and give the Vaccine Information Statement", "Check the right vaccine, dose, route, site and expiration date", "Give the vaccine in the correct site", "Observe for 15 to 20 minutes with epinephrine available", "Document the lot number and report adverse events to VAERS"], "y": "Screen first so unsafe vaccines are not given, check the rights, give the vaccine, watch for anaphylaxis, then document and report."}, {"ty": "mat", "d": 3, "q": "Match each vaccine type to its example.", "pairs": [["Live attenuated", "MMR"], ["Toxoid", "Tetanus part of DTaP"], ["Conjugate", "Hib"], ["Recombinant", "Hepatitis B"], ["Killed (inactivated)", "IPV"]], "y": "MMR uses a weakened live germ. The tetanus part of DTaP is an inactivated toxin. Hib has a sugar coat attached to a protein. Hepatitis B is made from one lab-produced piece. IPV is a dead germ."}, {"ty": "mat", "d": 3, "q": "Match each drug to what it treats or prevents.", "pairs": [["Permethrin cream", "Scabies"], ["Spinosad", "Head lice in a child over 4 years"], ["Griseofulvin", "Ringworm of the scalp"], ["Tolnaftate", "Athlete's foot (tinea pedis)"], ["Trimethoprim-sulfamethoxazole", "Pneumocystis pneumonia prophylaxis"]], "y": "Permethrin treats scabies mites. Spinosad treats lice in children over 4. Griseofulvin is the oral drug for scalp ringworm. Tolnaftate is topical for feet. Trimethoprim-sulfamethoxazole prevents Pneumocystis pneumonia."}, {"ty": "mat", "d": 3, "q": "Match each immunity term to its meaning.", "pairs": [["Cellular immunity", "T cells that kill infected cells directly"], ["Humoral immunity", "Antibodies from B cells in blood and fluids"], ["Passive immunity", "Antibodies received from an outside source"], ["Active immunity", "The person's own immune system generates the response"], ["Phagocytosis", "Neutrophils and monocytes engulf germs"]], "y": "Cellular means T cells attack directly. Humoral means B cells make antibodies in fluids. Passive is borrowed. Active is self-generated. Phagocytosis is white cells eating germs."}, {"ty": "mat", "d": 3, "q": "Match each illness to the sign that identifies it.", "pairs": [["Roseola", "Rash that appears after the fever breaks"], ["Parvovirus B19", "Bright red slapped cheeks"], ["Rubeola", "Koplik spots"], ["Rubella", "Swollen posterior auricular nodes"], ["Varicella", "Vesicles at all stages at once"]], "y": "Each illness has a signature: roseola rash after fever, fifth disease slapped cheeks, measles Koplik spots, rubella neck nodes, varicella crops of mixed lesions."}, {"ty": "ngn", "d": 3, "scen": "A 4-year-old attends daycare and has a fever and itchy blisters in crops on the trunk. Some are crusted and some are fluid filled. His mother is 10 weeks pregnant and picked him up.", "parts": [{"ty": "mc", "d": 3, "q": "Which precautions does the nurse use?", "o": ["Airborne and conta
